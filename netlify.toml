[build]
  publish = "mty"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Lembretes no celular (push-lembretes.js): roda de hora em hora; ela mesma decide a hora certa (7h, 19h e 21h de Brasília).
[functions."push-lembretes"]
  schedule = "0 * * * *"

# teamyoda.com.br é a entrada de tudo do Team Yoda: na raiz, o portal (/portal/); o app do treinador em /treinador; Academia
# Digital em /digital/; link do aluno, app do cliente, reservas e inscrições como sempre. O 39 Ranch segue no domínio dele
# (39tennis.com.br e app.39tennis.com.br) e o QuadraLab no quadralab.com.br.
[[redirects]]
  from = "/treinador"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "https://teamyoda.com.br/"
  to = "/portal/"
  status = 302
  force = true

[[redirects]]
  from = "https://www.teamyoda.com.br/*"
  to = "https://teamyoda.com.br/:splat"
  status = 301
  force = true

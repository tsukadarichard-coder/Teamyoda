<div id="root"><p style="max-width:760px;margin:60px auto;padding:0 20px;font-family:system-ui,sans-serif;color:#5B6B63;">Abrindo a Central…</p></div>

<!-- Central do dono: site separado dos apps. Agenda, tarefas, metas, revisão semanal e notas de Team Yoda, 39 Ranch,
     QuadraLab e Alvor. O login é a mesma conta do Firebase dos apps; quem decide quem entra é o servidor
     (netlify/functions/central.js no site do Team Yoda, alcançado por /api/central — ver netlify.toml): só o e-mail do dono. -->
<script>
/* configuração pública do Firebase (a mesma de mty-nuvem.js) — só identifica o projeto; não dá acesso a nada sozinha */
var CONFIG_FIREBASE = {
  apiKey: "AIzaSyDxtc8qn1GQjNQRYReRi4UH6ACNnYcn9Y4",
  authDomain: "metodologia-mty.firebaseapp.com",
  projectId: "metodologia-mty",
  storageBucket: "metodologia-mty.firebasestorage.app",
  messagingSenderId: "545940708034",
  appId: "1:545940708034:web:88ac30dcf4f7c6e190b95b",
};
var authCentral = null;
try { if (!firebase.apps.length) firebase.initializeApp(CONFIG_FIREBASE); authCentral = firebase.auth(); } catch (e) { console.error("Central: Firebase não iniciou", e); }
window.mtyAuth = authCentral ? {
  entrar: function (email, senha) { return authCentral.signInWithEmailAndPassword(email, senha); },
  sair: function () { return authCentral.signOut(); },
  recuperarSenha: function (email) { return authCentral.sendPasswordResetEmail(email); },
  observar: function (cb) { return authCentral.onAuthStateChanged(cb); },
  usuario: function () { return authCentral.currentUser; },
  tokenId: function (forcar) { return authCentral.currentUser ? authCentral.currentUser.getIdToken(!!forcar) : Promise.resolve(null); },
} : null;
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const API_CENTRAL = "/api/central";
const DONOS_CENTRAL = ["tsukada.richard@gmail.com"];

/* ── visual (o mesmo dos apps) ── */
const C = { tinta: "#17251F", papel: "#F6F8F7", cal: "#FFFFFF", saibro: "#69B32A", grafite: "#5B6B63", linha: "#E2E8E5", quadra: "#103B32" };
const ARCH = "Inter, system-ui, sans-serif";
const SERIF = ARCH;
const entrada = {
  width: "100%", maxWidth: "100%", padding: "9px 11px", border: "1px solid " + C.linha, borderRadius: 10,
  background: C.cal, fontFamily: SERIF, fontSize: 16, color: C.tinta, boxSizing: "border-box", minWidth: 0,
};
const prosa = { fontFamily: SERIF, fontSize: 14.5, lineHeight: 1.55, color: C.tinta, margin: 0 };
function Etiqueta({ children, cor = C.grafite }) {
  return <span style={{ fontFamily: ARCH, fontSize: 10, fontWeight: 600, letterSpacing: "0.14em", textTransform: "uppercase", color: cor }}>{children}</span>;
}
function Botao({ children, onClick, variante = "cheio", pequeno, disabled, style, type }) {
  const base = {
    fontFamily: ARCH, fontSize: pequeno ? 12 : 14, fontWeight: 600, padding: pequeno ? "6px 12px" : "11px 18px", borderRadius: 10,
    cursor: disabled ? "default" : "pointer", border: "1px solid " + C.tinta, opacity: disabled ? 0.55 : 1,
  };
  const v = { cheio: { ...base, background: C.tinta, color: C.papel }, vazio: { ...base, background: "transparent", color: C.tinta } };
  return <button type={type} onClick={onClick} disabled={disabled} style={{ ...v[variante], ...style }}>{children}</button>;
}
function Campo({ rotulo, children, nota }) {
  return (
    <div className="mb-4">
      <div className="mb-2"><Etiqueta>{rotulo}</Etiqueta></div>
      {children}
      {nota && <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 5 }}>{nota}</p>}
    </div>
  );
}
function Aviso({ children, cor = C.saibro }) {
  return <div style={{ background: C.cal, borderLeft: "3px solid " + cor, padding: "13px 15px", marginBottom: 16 }}><p style={{ ...prosa, fontSize: 13.5 }}>{children}</p></div>;
}
function TabelaFin({ cabecalho, linhas }) {
  const cel = { fontFamily: ARCH, fontSize: 13, padding: "6px 8px", borderBottom: "1px solid " + C.linha, textAlign: "left", verticalAlign: "top" };
  return (
    <div style={{ overflowX: "auto", marginBottom: 10 }}>
      <table style={{ width: "100%", borderCollapse: "collapse", background: C.cal }}>
        <thead><tr>{cabecalho.map((h, i) => <th key={i} style={{ ...cel, fontWeight: 700, color: C.grafite, fontSize: 11.5, textAlign: i && i === cabecalho.length - 1 ? "right" : "left" }}>{h}</th>)}</tr></thead>
        <tbody>{linhas.map((l, k) => <tr key={k}>{l.map((c, i) => <td key={i} style={{ ...cel, textAlign: i && i === l.length - 1 ? "right" : "left" }}>{c}</td>)}</tr>)}</tbody>
      </table>
    </div>
  );
}
function reais(v) { return (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function mesISOAtual() { return new Date(Date.now() - 3 * 3600000).toISOString().slice(0, 7); }
function somaMes(mes, d) { const [a, m] = mes.split("-").map(Number); return new Date(Date.UTC(a, m - 1 + d, 1)).toISOString().slice(0, 7); }
function nomeMes(mes) { const [a, m] = mes.split("-").map(Number); return ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"][m - 1] + " de " + a; }
function dataISO(d) { return d.toISOString().slice(0, 10); }
function dataCurta(iso) { return iso ? iso.split("-").reverse().slice(0, 2).join("/") : ""; }

/* ── TELA DA CENTRAL ──────────────────────────────────────────────────────
   Agenda, tarefas, metas e indicadores, revisão semanal e notas dos quatro
   negócios (Team Yoda, 39 Ranch, QuadraLab, Alvor) num lugar só. Números
   automáticos de onde já existem; o resto, o dono digita. Salva sozinho a
   cada mudança. */
const NEGOCIOS_CENTRAL = [
  { id: "team-yoda", nome: "Team Yoda", cor: "#103B32" }, { id: "39-ranch", nome: "39 Ranch", cor: "#8A6D1E" },
  { id: "quadralab", nome: "QuadraLab", cor: "#2F5D9E" }, { id: "alvor", nome: "Alvor", cor: "#7A3E8E" }, { id: "geral", nome: "Geral", cor: "#5B6B63" },
];
const LINKS_PADRAO_CENTRAL = {
  "team-yoda": [{ rotulo: "App Team Yoda", url: "https://app.39tennis.com.br" }],
  "39-ranch": [{ rotulo: "Site 39 Ranch", url: "https://39tennis.com.br" }],
  quadralab: [{ rotulo: "Site QuadraLab", url: "https://quadralab.com.br" }, { rotulo: "Painel do administrador", url: "https://quadralab.com.br/admin.html" }],
  alvor: [{ rotulo: "Alvor Hub", url: "https://alvorhub.netlify.app" }],
};
function negocioCentral(id) { return NEGOCIOS_CENTRAL.find((n) => n.id === id) || NEGOCIOS_CENTRAL[4]; }
async function chamarCentral(metodo, corpo) {
  const token = await window.mtyAuth.tokenId();
  const r = await fetch(API_CENTRAL, { method: metodo, headers: { "content-type": "application/json", authorization: "Bearer " + token }, body: metodo === "GET" ? undefined : JSON.stringify(corpo) });
  const c = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(c.erro || ("Erro " + r.status));
  return c;
}
function segundaDe(iso) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dataISO(d); }
function maisDias(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return dataISO(d); }
function diaSemanaCurto(iso) { return ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"][new Date(iso + "T12:00:00").getDay()]; }
function compromissosNoDia(agenda, iso) {
  const dia = new Date(iso + "T12:00:00").getDay();
  return (agenda || []).filter((x) => x.data === iso || (x.semanal && x.data <= iso && new Date(x.data + "T12:00:00").getDay() === dia))
    .sort((a, b) => (a.inicio || "99").localeCompare(b.inicio || "99"));
}
function novoIdCentral(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function EtiquetaNegocio({ id }) {
  const n = negocioCentral(id);
  return <span style={{ fontFamily: ARCH, fontSize: 10.5, fontWeight: 700, color: "#fff", background: n.cor, borderRadius: 999, padding: "2px 8px", whiteSpace: "nowrap" }}>{n.nome}</span>;
}
function BarraMeta({ real, meta }) {
  if (!meta) return null;
  const pct = Math.max(0, Math.min(100, Math.round((Number(real) || 0) / meta * 100)));
  return (<div style={{ height: 6, background: "#E9EFEC", borderRadius: 4, marginTop: 3 }}><div style={{ width: pct + "%", height: 6, borderRadius: 4, background: pct >= 100 ? C.quadra : pct >= 60 ? "#C9A227" : "#C9744F" }} /></div>);
}

function TelaCentral() {
  const [resp, setResp] = useState(null);
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState("");
  const [estadoSalvar, setEstadoSalvar] = useState("");
  const [aba, setAba] = useState("hoje");
  const [semana, setSemana] = useState(() => segundaDe(dataISO(new Date())));
  const [mesNeg, setMesNeg] = useState(mesISOAtual());
  const [filtroNeg, setFiltroNeg] = useState("");
  const [mostrarFeitas, setMostrarFeitas] = useState(false);
  const [novaTarefa, setNovaTarefa] = useState({ titulo: "", negocio: "geral", prazo: "", prioridade: "media" });
  const [novoComp, setNovoComp] = useState(null);
  const [novaNota, setNovaNota] = useState({ texto: "", negocio: "geral", decisao: false });
  const [semanaRev, setSemanaRev] = useState(() => segundaDe(dataISO(new Date())));
  const carregadoRef = useRef(false), timerRef = useRef(null);
  const hoje = (resp && resp.hoje) || dataISO(new Date());

  useEffect(() => {
    chamarCentral("GET").then((r) => { setResp(r); setDados(r.dados); carregadoRef.current = true; }).catch((e) => setErro(String(e.message || e)));
  }, []);
  /* salva sozinho, 1 s depois da última mudança */
  function mudar(fn) {
    setDados((atual) => { const novo = JSON.parse(JSON.stringify(atual)); fn(novo); return novo; });
    setEstadoSalvar("pendente");
  }
  useEffect(() => {
    if (!carregadoRef.current || estadoSalvar !== "pendente") return;
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => {
      setEstadoSalvar("salvando");
      chamarCentral("POST", { dados }).then(() => setEstadoSalvar("salvo")).catch(() => setEstadoSalvar("erro"));
    }, 1000);
    return () => clearTimeout(timerRef.current);
  }, [dados, estadoSalvar]);

  if (erro) return <div><h1 style={{ fontFamily: ARCH, fontSize: 22, fontWeight: 700 }}>Central</h1><Aviso>{erro}</Aviso></div>;
  if (!dados) return <p style={{ ...prosa, color: C.grafite }}>Abrindo a Central…</p>;

  const auto = resp.auto || {}, ty = auto["team-yoda"] || {}, rc = auto["39-ranch"] || {}, ql = auto.quadralab || {};
  const neg = (id) => dados.negocios[id] || { metas: {}, indicadores: {}, links: [], notas: "" };
  const garantirNeg = (d, id) => { d.negocios[id] = d.negocios[id] || { metas: {}, indicadores: {}, links: [], notas: "" }; return d.negocios[id]; };
  const tarefasAbertas = dados.tarefas.filter((t) => !t.feita);
  const atrasadas = tarefasAbertas.filter((t) => t.prazo && t.prazo < hoje);
  const deHoje = tarefasAbertas.filter((t) => t.prazo === hoje);
  const revAnterior = dados.revisoes[maisDias(segundaDe(hoje), -7)];
  const revAtual = dados.revisoes[segundaDe(hoje)];
  const diaSemana = new Date(hoje + "T12:00:00").getDay();

  /* alertas: o que pede decisão hoje, de todos os negócios */
  const alertas = [];
  [["team-yoda", ty], ["39-ranch", rc]].forEach(([id, a]) => {
    if (a.erro) { alertas.push({ id, nivel: "medio", texto: "Não consegui ler os números agora." }); return; }
    if (a.aulasEmAberto) alertas.push({ id, nivel: "alto", texto: a.aulasEmAberto + " aula(s) sem fechar" });
    if (a.emAbertoMensalidades) alertas.push({ id, nivel: "alto", texto: a.emAbertoMensalidades + " mensalidade(s) em aberto no mês" });
    if (a.pedidosReposicao) alertas.push({ id, nivel: "medio", texto: a.pedidosReposicao + " pedido(s) de reposição" });
    if (a.reservasNovas) alertas.push({ id, nivel: "medio", texto: a.reservasNovas + " reserva(s) nova(s) pelo link" });
    if (a.semPreco) alertas.push({ id, nivel: "baixo", texto: "Turmas sem preço no Financeiro" });
  });
  if (ql.erro) alertas.push({ id: "quadralab", nivel: "medio", texto: ql.erro });
  (ql.precisaDeVoce || []).forEach((p) => alertas.push({ id: "quadralab", nivel: p.nivel, texto: p.titulo + (p.n > 1 ? " (" + p.n + ")" : "") }));
  if (atrasadas.length) alertas.push({ id: "geral", nivel: "alto", texto: atrasadas.length + " tarefa(s) atrasada(s)" });
  if ((diaSemana === 5 || diaSemana === 6 || diaSemana === 0) && !(revAtual && revAtual.feitaEm)) alertas.push({ id: "geral", nivel: "medio", texto: "Faça a revisão da semana (15 min)" });
  const corNivel = { alto: "#B23A2E", medio: "#C9A227", baixo: C.grafite };

  const h2 = { fontFamily: ARCH, fontSize: 16, fontWeight: 700, margin: "18px 0 8px" };
  const sub = { ...prosa, fontSize: 12.5, color: C.grafite };
  const cartao = { background: C.cal, border: "1px solid " + C.linha, borderRadius: 10, padding: "10px 12px", marginBottom: 8 };
  const chipA = (on) => ({ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700, padding: "6px 12px", borderRadius: 999, cursor: "pointer", border: "1px solid " + (on ? C.quadra : C.linha), background: on ? C.quadra : C.cal, color: on ? "#fff" : C.tinta });
  const inp = { ...entrada, fontSize: 15, padding: "6px 9px" };

  function adicionarTarefa(base) {
    const t = { ...novaTarefa, ...(base || {}) }; if (!t.titulo.trim()) return;
    mudar((d) => d.tarefas.unshift({ id: novoIdCentral("ta"), titulo: t.titulo.trim(), negocio: t.negocio, prazo: t.prazo, prioridade: t.prioridade, feita: false, nota: "", criadaEm: hoje }));
    setNovaTarefa({ ...novaTarefa, titulo: "" });
  }
  function alternarTarefa(id) { mudar((d) => { const t = d.tarefas.find((x) => x.id === id); t.feita = !t.feita; t.feitaEm = t.feita ? hoje : ""; }); }
  function linhaTarefa(t) {
    const atrasada = !t.feita && t.prazo && t.prazo < hoje;
    return (
      <div key={t.id} className="flex flex-wrap items-center gap-2" style={{ padding: "6px 0", borderBottom: "1px solid " + C.linha }}>
        <input type="checkbox" checked={t.feita} onChange={() => alternarTarefa(t.id)} aria-label={"Concluir " + t.titulo} />
        <span style={{ width: 8, height: 8, borderRadius: 8, background: t.prioridade === "alta" ? "#B23A2E" : t.prioridade === "baixa" ? "#9AA7A0" : "#C9A227" }} title={"prioridade " + t.prioridade} />
        <span style={{ fontFamily: ARCH, fontSize: 13.5, flex: 1, minWidth: 140, textDecoration: t.feita ? "line-through" : "none", color: t.feita ? C.grafite : C.tinta }}>{t.titulo}</span>
        <EtiquetaNegocio id={t.negocio} />
        {t.prazo && <span style={{ ...sub, color: atrasada ? "#B23A2E" : C.grafite, fontWeight: atrasada ? 700 : 400 }}>{t.prazo === hoje ? "hoje" : dataCurta(t.prazo)}</span>}
        <button onClick={() => mudar((d) => { d.tarefas = d.tarefas.filter((x) => x.id !== t.id); })} style={{ border: "none", background: "none", cursor: "pointer", color: C.grafite }} aria-label="Apagar tarefa">✕</button>
      </div>
    );
  }
  function formTarefa() {
    return (
      <div className="flex flex-wrap items-end gap-2 mb-2">
        <input style={{ ...inp, flex: 1, minWidth: 180 }} placeholder="Nova tarefa" value={novaTarefa.titulo} onChange={(e) => setNovaTarefa({ ...novaTarefa, titulo: e.target.value })} onKeyDown={(e) => { if (e.key === "Enter") adicionarTarefa(); }} />
        <select style={{ ...inp, width: 130 }} value={novaTarefa.negocio} onChange={(e) => setNovaTarefa({ ...novaTarefa, negocio: e.target.value })}>{NEGOCIOS_CENTRAL.map((n) => <option key={n.id} value={n.id}>{n.nome}</option>)}</select>
        <input type="date" style={{ ...inp, width: 150 }} value={novaTarefa.prazo} onChange={(e) => setNovaTarefa({ ...novaTarefa, prazo: e.target.value })} aria-label="Prazo" />
        <select style={{ ...inp, width: 110 }} value={novaTarefa.prioridade} onChange={(e) => setNovaTarefa({ ...novaTarefa, prioridade: e.target.value })}><option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option></select>
        <Botao pequeno onClick={() => adicionarTarefa()}>Adicionar</Botao>
      </div>
    );
  }
  function listaCompromissos(iso) {
    const l = compromissosNoDia(dados.agenda, iso);
    if (!l.length) return <p style={sub}>Nada marcado.</p>;
    return l.map((x) => (
      <div key={x.id + iso} className="flex flex-wrap items-center gap-2" style={{ padding: "5px 0", borderBottom: "1px solid " + C.linha }}>
        <span style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700, minWidth: 92 }}>{x.inicio || "dia todo"}{x.fim ? "–" + x.fim : ""}</span>
        <span style={{ fontFamily: ARCH, fontSize: 13.5, flex: 1, minWidth: 120 }}>{x.titulo}{x.local ? <span style={{ color: C.grafite }}> · {x.local}</span> : null}{x.semanal ? <span style={{ color: C.grafite }}> · toda semana</span> : null}</span>
        <EtiquetaNegocio id={x.negocio} />
        <button onClick={() => setNovoComp({ ...x })} style={{ border: "none", background: "none", cursor: "pointer", color: C.grafite, fontSize: 12.5, textDecoration: "underline" }}>editar</button>
      </div>
    ));
  }
  function formCompromisso() {
    if (!novoComp) return <Botao pequeno variante="vazio" onClick={() => setNovoComp({ id: "", titulo: "", data: aba === "agenda" ? semana < segundaDe(hoje) || semana > segundaDe(hoje) ? semana : hoje : hoje, inicio: "", fim: "", negocio: "geral", local: "", nota: "", semanal: false })}>+ Compromisso</Botao>;
    const c = novoComp, set = (k, v) => setNovoComp({ ...c, [k]: v });
    return (
      <div style={{ ...cartao, borderColor: C.quadra }}>
        <div className="flex flex-wrap items-end gap-2">
          <input style={{ ...inp, flex: 1, minWidth: 180 }} placeholder="Título (ex.: reunião com o clube)" value={c.titulo} onChange={(e) => set("titulo", e.target.value)} />
          <input type="date" style={{ ...inp, width: 150 }} value={c.data} onChange={(e) => set("data", e.target.value)} aria-label="Dia" />
          <input type="time" style={{ ...inp, width: 110 }} value={c.inicio} onChange={(e) => set("inicio", e.target.value)} aria-label="Início" />
          <input type="time" style={{ ...inp, width: 110 }} value={c.fim} onChange={(e) => set("fim", e.target.value)} aria-label="Fim" />
        </div>
        <div className="flex flex-wrap items-end gap-2 mt-2">
          <select style={{ ...inp, width: 130 }} value={c.negocio} onChange={(e) => set("negocio", e.target.value)}>{NEGOCIOS_CENTRAL.map((n) => <option key={n.id} value={n.id}>{n.nome}</option>)}</select>
          <input style={{ ...inp, width: 200 }} placeholder="Local (opcional)" value={c.local} onChange={(e) => set("local", e.target.value)} />
          <label className="flex items-center gap-1" style={{ fontFamily: ARCH, fontSize: 13 }}><input type="checkbox" checked={c.semanal} onChange={(e) => set("semanal", e.target.checked)} /> repete toda semana</label>
        </div>
        <div className="flex flex-wrap gap-2 mt-2">
          <Botao pequeno disabled={!c.titulo.trim() || !c.data} onClick={() => { mudar((d) => { if (c.id) d.agenda = d.agenda.map((x) => (x.id === c.id ? { ...c, titulo: c.titulo.trim() } : x)); else d.agenda.push({ ...c, id: novoIdCentral("ag"), titulo: c.titulo.trim() }); }); setNovoComp(null); }}>Salvar</Botao>
          {c.id && <Botao pequeno variante="vazio" onClick={() => { mudar((d) => { d.agenda = d.agenda.filter((x) => x.id !== c.id); }); setNovoComp(null); }}>Apagar</Botao>}
          <Botao pequeno variante="vazio" onClick={() => setNovoComp(null)}>Cancelar</Botao>
        </div>
      </div>

/* ── login e moldura ── */
function TelaEntrar() {
  const [email, setEmail] = useState(""), [senha, setSenha] = useState(""), [msg, setMsg] = useState(""), [indo, setIndo] = useState(false);
  async function entrar(e) {
    e.preventDefault(); setMsg(""); setIndo(true);
    try { await window.mtyAuth.entrar(email.trim(), senha); }
    catch (err) { setMsg(/invalid|wrong|not-found|credential/i.test(String(err && (err.code || err.message))) ? "E-mail ou senha não conferem." : "Não consegui entrar agora. Tente de novo."); }
    setIndo(false);
  }
  async function recuperar() {
    if (!email.trim()) { setMsg("Digite o e-mail acima e toque de novo em “Esqueci a senha”."); return; }
    try { await window.mtyAuth.recuperarSenha(email.trim()); setMsg("Enviei um link para redefinir a senha em " + email.trim() + "."); } catch (e) { setMsg("Não consegui enviar o link agora."); }
  }
  return (
    <form onSubmit={entrar} style={{ maxWidth: 380, margin: "12vh auto 0", padding: "0 16px" }}>
      <h1 style={{ fontFamily: ARCH, fontSize: 26, fontWeight: 800, color: C.tinta, marginBottom: 4 }}>Central</h1>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 18 }}>Team Yoda, 39 Ranch, QuadraLab e Alvor num lugar só.</p>
      <Campo rotulo="E-mail"><input style={entrada} type="email" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} /></Campo>
      <Campo rotulo="Senha"><input style={entrada} type="password" autoComplete="current-password" value={senha} onChange={(e) => setSenha(e.target.value)} /></Campo>
      <Botao type="submit" disabled={indo || !email.trim() || !senha} style={{ width: "100%" }}>{indo ? "Entrando…" : "Entrar"}</Botao>
      <button type="button" onClick={recuperar} style={{ ...prosa, fontSize: 13, color: C.grafite, background: "none", border: "none", textDecoration: "underline", cursor: "pointer", marginTop: 12 }}>Esqueci a senha</button>
      {msg && <p style={{ ...prosa, fontSize: 13.5, marginTop: 10 }}>{msg}</p>}
      <p style={{ ...prosa, fontSize: 12, color: C.grafite, marginTop: 18 }}>Mesma conta do app do Team Yoda.</p>
    </form>
  );
}

  if (usuario === undefined) return <p style={{ ...prosa, color: C.grafite, maxWidth: 760, margin: "60px auto", padding: "0 20px" }}>Abrindo a Central…</p>;
  if (!usuario) return <TelaEntrar />;
  const dono = DONOS_CENTRAL.indexOf(String(usuario.email || "").toLowerCase()) >= 0;
  return (
    <div style={{ maxWidth: 1040, margin: "0 auto", padding: "14px 16px 40px" }}>
      <div className="flex items-center gap-2" style={{ marginBottom: 6 }}>
        <span style={{ ...prosa, fontSize: 12.5, color: C.grafite, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{usuario.email}</span>
        <Botao pequeno variante="vazio" onClick={() => window.mtyAuth.sair()}>Sair</Botao>
      </div>
      {dono ? <TelaCentral /> : <Aviso cor="#B23A2E">Esta Central é só do dono. Entre com a conta tsukada.richard@gmail.com.</Aviso>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppCentral />);
</script>
</body>
</html>

/* ── Etapa 1 (13/11/2026): avisos no celular e lista Implantação ──
   Os avisos usam as notificações que os apps do Team Yoda já têm (Web Push com as chaves do servidor). O aparelho se inscreve
   aqui; quem recebe o quê o servidor decide pelo login (Richard ou administrativo). No iPhone, só com a Central na tela de início. */
const GRUPOS_IMPL = [["viagem", "Durante a viagem"], ["code", "No Code"], ["time", "Com o time"], ["pessoal", "Pessoal"]];
function chaveParaBytes(b64) { const p = "=".repeat((4 - (b64.length % 4)) % 4), s = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, (c) => c.charCodeAt(0)); }
function suportePush() {
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const instalado = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  const tem = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  return { tem, ios, instalado, permissao: tem ? Notification.permission : "indisponivel" };
}
async function inscricaoAtual() {
  if (!("serviceWorker" in navigator)) return null;
  const reg = await navigator.serviceWorker.getRegistration("/"); if (!reg || !reg.pushManager) return null;
  return reg.pushManager.getSubscription();
}
function PainelAvisos({ papel, avisosIni, tipos, chavePush }) {
  const [prefs, setPrefs] = useState(avisosIni);
  const [estado, setEstado] = useState("verificando"); // verificando | ativo | inativo | bloqueado | sem-suporte | ios-instalar
  const [msg, setMsg] = useState(""), [ocupado, setOcupado] = useState(""), [salvo, setSalvo] = useState("");
  const sup = suportePush();
  useEffect(() => {
    if (sup.ios && !sup.instalado) { setEstado("ios-instalar"); return; }
    if (!sup.tem) { setEstado("sem-suporte"); return; }
    if (sup.permissao === "denied") { setEstado("bloqueado"); return; }
    inscricaoAtual().then((s) => (s ? chamarCentral("POST", { acao: "avisosEstado", endpoint: s.endpoint }).then((r) => setEstado(r.inscrito ? "ativo" : "inativo")) : setEstado("inativo")))
      .catch(() => setEstado("inativo"));
  }, []);
  async function ativar() {
    setMsg(""); setOcupado("ativar");
    try {
      if (!chavePush) throw new Error("O servidor não respondeu a chave dos avisos. Tente de novo em instantes.");
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { setEstado(perm === "denied" ? "bloqueado" : "inativo"); throw new Error("Sem permissão, os avisos não chegam. Toque em Permitir quando o aparelho perguntar."); }
      const reg = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
      await navigator.serviceWorker.ready;
      let s = await reg.pushManager.getSubscription();
      if (!s) s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chaveParaBytes(chavePush) });
      await chamarCentral("POST", { acao: "avisosInscrever", inscricao: s.toJSON ? s.toJSON() : s });
      setEstado("ativo"); setMsg("Avisos ativados neste aparelho. Toque em Enviar notificação de teste para conferir.");
    } catch (e) { setMsg(String(e.message || e)); }
    setOcupado("");
  }
  async function desativar() {
    setMsg(""); setOcupado("desativar");
    try { const s = await inscricaoAtual(); if (s) { await chamarCentral("POST", { acao: "avisosCancelar", endpoint: s.endpoint }); await s.unsubscribe().catch(() => {}); } setEstado("inativo"); setMsg("Avisos desligados neste aparelho."); }
    catch (e) { setMsg(String(e.message || e)); }
    setOcupado("");
  }
  async function testar() {
    setMsg(""); setOcupado("teste");
    try { await chamarCentral("POST", { acao: "avisosTeste" }); setMsg("Notificação de teste enviada. Ela chega em alguns segundos."); } catch (e) { setMsg(String(e.message || e)); }
    setOcupado("");
  }
  async function salvar() {
    setSalvo("salvando");
    try { const r = await chamarCentral("POST", { acao: "avisosSalvar", prefs }); setPrefs(r.avisos); setSalvo("salvo"); } catch (e) { setSalvo("erro"); setMsg(String(e.message || e)); }
  }
  const cartaoA = { background: "#FFFFFF", border: "1px solid #E6EBE8", borderRadius: 16, padding: "14px 16px", marginBottom: 12 };
  const sub = { ...prosa, fontSize: 13, color: C.grafite };
  const inpH = { ...entrada, fontSize: 15, padding: "6px 9px", width: 110 };

            <Campo rotulo="Decisões tomadas"><textarea rows={2} style={inp} value={r.decisoes} onChange={(e) => setR("decisoes", e.target.value)} /></Campo>
            <Campo rotulo="Prioridades da próxima semana" nota="Aparecem em “Hoje” durante a semana seguinte.">
              {prio.map((p, i) => <input key={i} style={{ ...inp, marginBottom: 5 }} placeholder={(i + 1) + "."} value={p} onChange={(e) => { const l = prio.slice(); l[i] = e.target.value; setR("prioridades", l); }} />)}
              {prio.length < 5 && <Botao pequeno variante="vazio" onClick={() => setR("prioridades", prio.concat([""]))}>+ prioridade</Botao>}
            </Campo>
            <Botao onClick={() => { setR("feitaEm", hoje); prio.filter((p) => p.trim()).forEach((p) => adicionarTarefa({ titulo: p.trim(), negocio: "geral", prazo: maisDias(semanaRev, 11), prioridade: "alta" })); }} disabled={!!r.feitaEm}>{r.feitaEm ? "Revisão feita ✓" : "Concluir revisão e virar as prioridades em tarefas"}</Botao>
            <h2 style={h2}>Semanas anteriores</h2>
            {Object.keys(dados.revisoes).filter((s) => s !== semanaRev).sort().reverse().slice(0, 8).map((s) => (
              <button key={s} onClick={() => setSemanaRev(s)} style={{ ...cartao, display: "block", width: "100%", textAlign: "left", cursor: "pointer" }}>
                <span style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700 }}>Semana de {dataCurta(s)}</span>
                <span style={{ ...sub, display: "block" }}>{(dados.revisoes[s].prioridades || []).filter(Boolean).join(" · ") || "sem prioridades"}</span>
              </button>
            ))}
          </div>
        );
      })()}

      {aba === "implantacao" && impl && <AbaImplantacao lista={impl} mudar={mudarImpl} hoje={hoje} />}
      {aba === "avisos" && <PainelAvisos papel="richard" avisosIni={resp.avisos || { tipos: {}, silencio: { ativo: true, de: "22:00", ate: "07:00" } }} tipos={resp.tipos || []} chavePush={resp.chavePush} />}

      {aba === "notas" && (
        <div style={quadro}>
          <div style={cartao}>
            <textarea rows={2} style={inp} placeholder="Ideia, conversa, decisão…" value={novaNota.texto} onChange={(e) => setNovaNota({ ...novaNota, texto: e.target.value })} />
            <div className="flex flex-wrap items-center gap-2 mt-2">
              <select style={{ ...inp, width: 130 }} value={novaNota.negocio} onChange={(e) => setNovaNota({ ...novaNota, negocio: e.target.value })}>{NEGOCIOS_CENTRAL.map((n) => <option key={n.id} value={n.id}>{n.nome}</option>)}</select>
              <label className="flex items-center gap-1" style={{ fontFamily: ARCH, fontSize: 13 }}><input type="checkbox" checked={novaNota.decisao} onChange={(e) => setNovaNota({ ...novaNota, decisao: e.target.checked })} /> é uma decisão</label>
              <Botao pequeno disabled={!novaNota.texto.trim()} onClick={() => { mudar((d) => d.notas.unshift({ id: novoIdCentral("no"), data: hoje, negocio: novaNota.negocio, texto: novaNota.texto.trim(), decisao: novaNota.decisao })); setNovaNota({ texto: "", negocio: novaNota.negocio, decisao: false }); }}>Guardar</Botao>
            </div>
          </div>
          <div className="flex flex-wrap gap-2 my-2">
            <button style={chipA(!filtroNeg)} onClick={() => setFiltroNeg("")}>Todos</button>
            {NEGOCIOS_CENTRAL.map((n) => <button key={n.id} style={chipA(filtroNeg === n.id)} onClick={() => setFiltroNeg(n.id)}>{n.nome}</button>)}
          </div>
          {dados.notas.filter((x) => !filtroNeg || x.negocio === filtroNeg).map((x) => (
            <div key={x.id} style={{ ...cartao, borderLeft: x.decisao ? "4px solid " + C.quadra : "1px solid " + C.linha }}>
              <div className="flex flex-wrap items-center gap-2"><EtiquetaNegocio id={x.negocio} /><span style={sub}>{dataCurta(x.data)}{x.decisao ? " · decisão" : ""}</span><span style={{ flex: 1 }} />
                <button onClick={() => mudar((d) => { d.notas = d.notas.filter((y) => y.id !== x.id); })} style={{ border: "none", background: "none", cursor: "pointer", color: C.grafite }} aria-label="Apagar nota">✕</button></div>
              <p style={{ ...prosa, fontSize: 14, marginTop: 4, whiteSpace: "pre-wrap" }}>{x.texto}</p>
            </div>
          ))}
          {!dados.notas.length && <p style={sub}>Guarde aqui as decisões e ideias de cada negócio — fica tudo pesquisável por negócio.</p>}
        </div>
      )}
    </div>
  );
}

/* ── login e moldura ── */
function TelaEntrar() {
  const [email, setEmail] = useState(""), [senha, setSenha] = useState(""), [msg, setMsg] = useState(""), [indo, setIndo] = useState(false);
  async function entrar(e) {
    e.preventDefault(); setMsg(""); setIndo(true);
    try { await window.mtyAuth.entrar(email.trim(), senha); }
    catch (err) { setMsg(/invalid|wrong|not-found|credential/i.test(String(err && (err.code || err.message))) ? "E-mail ou senha não conferem." : "Não consegui entrar agora. Tente de novo."); }
    setIndo(false);
  }
  async function recuperar() {
    if (!email.trim()) { setMsg("Digite o e-mail acima e toque de novo em “Esqueci a senha”."); return; }
    try { await window.mtyAuth.recuperarSenha(email.trim()); setMsg("Enviei um link para redefinir a senha em " + email.trim() + "."); } catch (e) { setMsg("Não consegui enviar o link agora."); }
  }
  return (
    <form onSubmit={entrar} style={{ maxWidth: 380, margin: "12vh auto 0", padding: "0 16px" }}>
      <h1 style={{ fontFamily: ARCH, fontSize: 26, fontWeight: 800, color: C.tinta, marginBottom: 4 }}>Central</h1>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 18 }}>Team Yoda, 39 Ranch, QuadraLab e Alvor num lugar só.</p>
      <Campo rotulo="E-mail"><input style={entrada} type="email" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} /></Campo>
      <Campo rotulo="Senha"><input style={entrada} type="password" autoComplete="current-password" value={senha} onChange={(e) => setSenha(e.target.value)} /></Campo>
      <Botao type="submit" disabled={indo || !email.trim() || !senha} style={{ width: "100%" }}>{indo ? "Entrando…" : "Entrar"}</Botao>
      <button type="button" onClick={recuperar} style={{ ...prosa, fontSize: 13, color: C.grafite, background: "none", border: "none", textDecoration: "underline", cursor: "pointer", marginTop: 12 }}>Esqueci a senha</button>
      {msg && <p style={{ ...prosa, fontSize: 13.5, marginTop: 10 }}>{msg}</p>}
      <p style={{ ...prosa, fontSize: 12, color: C.grafite, marginTop: 18 }}>Mesma conta do app do Team Yoda.</p>
    </form>
  );
}

function AppCentral() {
  const [usuario, setUsuario] = useState(undefined);
  useEffect(() => (window.mtyAuth ? window.mtyAuth.observar((u) => setUsuario(u || null)) : setUsuario(null)), []);
  if (!window.mtyAuth) return <div style={{ maxWidth: 520, margin: "60px auto", padding: "0 16px" }}><Aviso cor="#B23A2E">Não consegui carregar o login. Verifique a internet e recarregue a página.</Aviso></div>;
  if (usuario === undefined) return <p style={{ ...prosa, color: C.grafite, maxWidth: 760, margin: "60px auto", padding: "0 20px" }}>Abrindo a Central…</p>;
  if (!usuario) return <TelaEntrar />;
  return (
    <div style={{ maxWidth: 1040, margin: "0 auto", padding: "14px 16px 40px" }}>
      <div className="flex items-center gap-2" style={{ marginBottom: 6 }}>
        <span style={{ ...prosa, fontSize: 12.5, color: C.grafite, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{usuario.email}</span>
        <Botao pequeno variante="vazio" onClick={() => window.mtyAuth.sair()}>Sair</Botao>
      </div>
      <TelaCentral />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppCentral />);
</script>
</body>
</html>

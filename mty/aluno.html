<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu plano · Metodologia MTY</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu plano">
<style>
  :root{ --papel:#F5F2F0; --tinta:#141210; --verm:#C8102E; --cinza:#6B6461; --linha:#D8D1CB; --verde:#2E4739; }
  *{box-sizing:border-box}
  body{margin:0; background:var(--papel); color:var(--tinta);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:0 0 60px}
  .topo{background:var(--verm); height:7px}
  .wrap{max-width:560px; margin:0 auto; padding:0 18px}
  header{padding:22px 0 10px}
  h1{font-family:Georgia,serif; font-size:24px; margin:10px 0 2px}
  .sub{color:var(--cinza); font-size:13.5px}
  .rosca-wrap{display:flex; align-items:center; gap:16px; background:#fff; border:1px solid var(--linha); border-radius:6px; padding:14px 16px; margin:14px 0 6px}
  .progtxt{font-size:12px; color:var(--cinza); margin-top:6px}
  .bloco{margin:22px 0 8px; font-family:Georgia,serif; font-weight:700; font-size:16px}
  .semana{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--cinza); margin:14px 0 6px}
  .aula{background:#fff; border:1px solid var(--linha); border-left:4px solid var(--linha); border-radius:3px;
    padding:10px 13px; margin-bottom:8px; display:flex; align-items:center; gap:10px}
  .aula.feita{border-left-color:var(--verde)}
  .marca{font-size:18px}
  .aula .txt{flex:1}
  .aula .data{font-size:11.5px; color:var(--cinza)}
  .erro{background:#fff; border:1px solid var(--linha); border-left:4px solid var(--verm); padding:14px; margin-top:24px}
  .carregando{color:var(--cinza); padding:30px 0}
  .sincronia{font-size:11.5px; color:var(--cinza); text-align:right; margin-top:22px}
  .sincronia.piscando{color:var(--verde)}

  .painel{background:#fff; border:1px solid var(--linha); border-radius:6px; padding:15px 16px; margin-top:18px}
  .painel h2{font-family:Georgia,serif; font-size:15px; margin:0 0 4px}
  .painel .desc{font-size:12.5px; color:var(--cinza); margin:0 0 11px}
  .btn{font:600 13px -apple-system,sans-serif; padding:9px 14px; border-radius:4px; border:1px solid var(--tinta);
    background:var(--tinta); color:#fff; cursor:pointer}
  .btn.fraco{background:#fff; color:var(--tinta)}
  .btn.perigo{background:var(--verm); border-color:var(--verm); color:#fff}
  .btn:disabled{opacity:.5; cursor:default}
  .linha-btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
  textarea, .campo-texto{width:100%; font:14px/1.4 -apple-system,sans-serif; padding:9px 10px; border:1px solid var(--linha);
    border-radius:4px; resize:vertical; background:var(--papel)}
  .aviso-mini{font-size:12px; color:var(--cinza); margin-top:6px}
  .confirmado{font-size:12.5px; color:var(--verde); margin-top:8px; font-weight:600}
  .grade{display:grid; grid-template-columns:repeat(7, 1fr); gap:3px; margin:10px 0}
  .grade .rot{font-size:10px; text-align:center; color:var(--cinza); font-weight:700}
  .cel{font-size:10.5px; text-align:center; padding:5px 2px; border-radius:3px; border:1px solid var(--linha); cursor:pointer; background:var(--papel)}
  .cel.ocupado{background:#EFE7E4; color:var(--cinza); cursor:default; text-decoration:line-through}
  .cel.sel{background:var(--verde); color:#fff; border-color:var(--verde)}
  .pedido-pendente{background:#FDF6E7; border:1px solid #C9A227; border-radius:4px; padding:10px 12px; font-size:12.5px; margin-top:8px}
</style>
</head>
<body>
<div class="topo"></div>
<div class="wrap">
<div id="mty-instalar"></div>
<div id="conteudo"><div class="carregando">Carregando…</div></div>
</div>
<script>
/* Manifest gerado na hora, não um arquivo estático: o link do aluno
   carrega org/id/t na própria URL, e um manifest fixo (start_url fixo)
   faria o ícone instalado abrir sem esses parâmetros — "link incompleto".
   Gerando o manifest com start_url = URL atual, o ícone reabre exatamente
   este link do aluno. */
(function () {
  const manifest = {
    name: 'Meu plano · Metodologia MTY', short_name: 'Meu plano',
    start_url: location.pathname + location.search, display: 'standalone',
    background_color: '#F5F2F0', theme_color: '#C8102E',
    icons: [
      { src: 'assets/icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: 'assets/icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: 'assets/icon-512-maskable.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' },
    ],
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});

/* Mesma ideia do app do treinador: sem API única entre navegadores —
   Chrome/Android dispara beforeinstallprompt (dá pra chamar .prompt()
   num clique); iOS Safari não tem nenhuma API, só a orientação de tocar
   em Compartilhar → Adicionar à Tela de Início. Fica fora do ciclo de
   render(d) porque não depende dos dados do aluno nem deve sumir a cada
   sincronia automática. */
(function () {
  const el = document.getElementById('mty-instalar');
  let deferredPrompt = null;
  function padrao() {
    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (standalone) { el.innerHTML = ''; return; }
    if (deferredPrompt) {
      el.innerHTML = '<div class="painel"><p class="desc">Instale este link na tela de início do seu celular — abre direto, sem digitar o endereço de novo.</p>' +
        '<button class="btn" id="mty-btn-instalar">Instalar</button></div>';
      document.getElementById('mty-btn-instalar').addEventListener('click', async function () {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        padrao();
      });
      return;
    }
    if (ios) {
      el.innerHTML = '<div class="painel"><p class="desc">Pra instalar na tela de início: toque em <b>Compartilhar</b> ' +
        '(o ícone com uma seta pra cima) e depois em <b>"Adicionar à Tela de Início"</b>.</p></div>';
      return;
    }
    el.innerHTML = '';
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; padrao(); });
  window.addEventListener('appinstalled', function () { deferredPrompt = null; padrao(); });
  padrao();
})();
</script>
<script>
function escapar(s){ return String(s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

/* Mesma leitura de três estados usada no app do treinador: feita (verde),
   pendente (cinza, neutro) e repetindo — falta/cancelada, ainda vai
   precisar de reposição (vermelho). */
function rosquinhaSvg(feita, pendente, repetindo) {
  const total = feita + pendente + repetindo;
  if (!total) return '';
  const r = 42, c = 2 * Math.PI * r;
  let offset = 0;
  const circulos = [
    { v: feita, cor: 'var(--verde)' },
    { v: repetindo, cor: 'var(--verm)' },
    { v: pendente, cor: 'var(--linha)' },
  ].filter(function (s) { return s.v > 0; }).map(function (s) {
    const len = (s.v / total) * c;
    const trecho = '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="' + s.cor + '" stroke-width="12" ' +
      'stroke-dasharray="' + len + ' ' + (c - len) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 50 50)" />';
    offset += len;
    return trecho;
  }).join('');
  const pct = Math.round((feita / total) * 100);
  return '<svg width="104" height="104" viewBox="0 0 100 100" style="flex-shrink:0">' + circulos +
    '<text x="50" y="48" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="20" fill="var(--tinta)">' + pct + '%</text>' +
    '<text x="50" y="62" text-anchor="middle" font-size="7.5" letter-spacing="0.5" fill="var(--cinza)">FEITAS</text>' +
    '</svg>';
}
function legendaRosca(feita, pendente, repetindo) {
  const itens = [['Feitas', 'var(--verde)', feita], ['Pendentes', 'var(--cinza)', pendente], ['Repetindo', 'var(--verm)', repetindo]]
    .filter(function (x) { return x[2] > 0; });
  return itens.map(function (x) {
    return '<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">' +
      '<span style="width:9px;height:9px;border-radius:999px;background:' + x[1] + ';display:inline-block"></span>' +
      '<span style="font-size:12.5px">' + x[0] + ' · ' + x[2] + '</span></div>';
  }).join('');
}

/* Mesma lógica do painel do treinador: os critérios de saída são sempre
   a mesma pergunta (atingido/parcial/não atingido) em todo ciclo, então
   dá pra comparar % de critérios atingidos entre ciclos, mesmo com plano
   e texto diferentes em cada um. Sem biblioteca de gráfico aqui — é um
   SVG simples, na mesma linha da rosquinhaSvg acima. */
function graficoEvolucaoSvg(pontos) {
  if (pontos.length < 2) return '';
  const w = 280, h = 120, padL = 22, padR = 8, padT = 10, padB = 8;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  function x(i) { return padL + (pontos.length === 1 ? 0 : (i / (pontos.length - 1)) * innerW); }
  function y(v) { return padT + innerH - (v / 100) * innerH; }
  function linha(chave, cor) {
    const segmentos = [];
    let atual = [];
    pontos.forEach(function (p, i) {
      if (p[chave] == null) { if (atual.length > 1) segmentos.push(atual); atual = []; return; }
      atual.push([x(i), y(p[chave])]);
    });
    if (atual.length > 1) segmentos.push(atual);
    const linhas = segmentos.map(function (seg) {
      const d = seg.map(function (p, i) { return (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
      return '<path d="' + d + '" fill="none" stroke="' + cor + '" stroke-width="2" />';
    }).join('');
    const pontosSvg = pontos.map(function (p, i) {
      return p[chave] == null ? '' : '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p[chave]).toFixed(1) + '" r="3" fill="' + cor + '" />';
    }).join('');
    return linhas + pontosSvg;
  }
  const grade = [0, 50, 100].map(function (v) {
    return '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--linha)" stroke-width="1" />' +
      '<text x="' + (padL - 4) + '" y="' + (y(v) + 3).toFixed(1) + '" font-size="8" text-anchor="end" fill="var(--cinza)">' + v + '</text>';
  }).join('');
  return '<svg width="100%" viewBox="0 0 ' + w + ' ' + h + '" style="max-width:320px">' + grade +
    linha('pctCriterios', 'var(--verde)') + linha('pctAulas', 'var(--tinta)') + '</svg>';
}

const NOTA_COR_REL = { sim: '#2E4739', par: '#C9A227', nao: '#C8102E' };
const NOTA_LABEL_REL = { sim: 'Atingido', par: 'Parcial', nao: 'Não atingido' };

/* Mesma técnica do painel do treinador: sem biblioteca de PDF — abre uma
   aba com HTML limpo e chama a impressão do navegador ("Salvar como PDF"
   em qualquer aparelho, sem precisar de nada além do próprio navegador). */
function exportarRelatorioPDF(d, id) {
  const h = (d.historicoRelatorios || []).find(function (x) { return x.id === id; });
  if (!h) return;
  const janela = window.open('', '_blank');
  if (!janela) { alert('Seu navegador bloqueou a aba de exportação — permita pop-ups pra este site e tente de novo.'); return; }
  const criteriosHtml = (h.criterios || []).map(function (c) {
    const cor = NOTA_COR_REL[c.resultado] || '#8A8580';
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #E4DED9">' +
      '<span style="width:10px;height:10px;border-radius:999px;background:' + cor + ';flex-shrink:0"></span>' +
      '<span style="flex:1;font-size:13.5px">' + escapar(c.nome) + '</span>' +
      '<span style="font-size:11.5px;font-weight:700;color:' + cor + '">' + (NOTA_LABEL_REL[c.resultado] || 'Não avaliado') + '</span></div>';
  }).join('');
  janela.document.write(
    '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">' +
    '<title>Relatório de ciclo · ' + escapar(d.nome) + '</title>' +
    '<style>' +
    'body{font-family:-apple-system,system-ui,sans-serif;color:#141210;max-width:640px;margin:30px auto;padding:0 20px}' +
    'h1{font-family:Georgia,serif;font-size:20px;margin:0 0 4px}' +
    '.sub{color:#6B6461;font-size:13px;margin-bottom:20px}' +
    'h2{font-family:Georgia,serif;font-size:15px;margin:26px 0 8px}' +
    'pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,monospace;background:#F5F2F0;padding:14px;border-radius:4px}' +
    '@media print { .no-print{display:none} }' +
    '</style></head><body>' +
    '<h1>Relatório de ciclo</h1>' +
    '<div class="sub">' + escapar(d.nome) + ' · ' + escapar(h.tipo || '') + ' · gerado em ' +
      new Date(h.data).toLocaleDateString('pt-BR') + ' · ' + h.feitas + ' de ' + h.total + ' aulas</div>' +
    (criteriosHtml ? '<h2>Critérios de saída</h2>' + criteriosHtml : '') +
    '<h2>Relatório completo</h2><pre>' + escapar(h.texto) + '</pre>' +
    '<button class="no-print" onclick="window.print()" style="margin-top:20px;padding:10px 16px;font-weight:700;cursor:pointer">Salvar como PDF / Imprimir</button>' +
    '</body></html>'
  );
  janela.document.close();
}

const NOMES_DIA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
function horariosPadrao() {
  const lista = [];
  for (let h = 7; h <= 21; h++) lista.push((h < 10 ? '0' : '') + h + ':00');
  return lista;
}
function todosHorarios(agenda) {
  const set = {};
  horariosPadrao().forEach(function (h) { set[h] = true; });
  Object.keys(agenda || {}).forEach(function (dia) { (agenda[dia] || []).forEach(function (h) { set[h] = true; }); });
  return Object.keys(set).sort();
}

(function(){
  const p = new URLSearchParams(location.search);
  const org = p.get('org'), id = p.get('id'), t = p.get('t');
  const el = document.getElementById('conteudo');
  const INTERVALO = 20000; // atualiza sozinho a cada 20s — o aluno não precisa recarregar a página

  if (!org || !id || !t) {
    el.innerHTML = '<div class="erro">Este link está incompleto. Peça o link certo ao seu treinador.</div>';
    return;
  }

  let ultimoJson = null;
  let ultimoDado = null;

  /* Estado das telinhas de ação — fica fora do innerHTML (que é
     reconstruído a cada atualização), pra abrir um painel ou digitar
     numa caixa de texto não se perder na próxima sincronia automática. */
  const ui = {
    painel: null, // 'cancelar' | 'reagendar' | 'feedback' | 'jogo' | null
    diaEscolhido: null, horaEscolhida: null,
    mensagem: null, enviando: false,
    relatorioAberto: null, // id do relatório de ciclo aberto na lista, ou null
  };

  async function postAcao(corpo) {
    const r = await fetch('/.netlify/functions/ver-aluno', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(Object.assign({ org: org, id: id, t: t }, corpo)),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.erro || ('Erro ' + r.status));
    return d;
  }

  async function carregar(forcarRender) {
    try {
      const r = await fetch('/.netlify/functions/ver-aluno?org=' + encodeURIComponent(org) + '&id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t));
      const d = await r.json();
      if (!r.ok) throw new Error(d.erro || ('Erro ' + r.status));

      const textoJson = JSON.stringify(d);
      const primeiraCarga = ultimoJson === null;
      const mudou = textoJson !== ultimoJson;
      ultimoJson = textoJson;
      ultimoDado = d;
      if (!mudou && !forcarRender) { marcarSincronia(false); return; }

      render(d);
      marcarSincronia(!primeiraCarga);
    } catch (e) {
      el.innerHTML = '<div class="erro">' + escapar(e.message || String(e)) + '</div>';
    }
  }

  function render(d) {
    if (!d.temPlano) {
      // sem plano ainda, mas dá pra dizer o que gostaria de trabalhar e
      // mandar feedback — o pedido pode até virar insumo do primeiro plano.
      el.innerHTML = '<header><h1>' + escapar(d.nome) + '</h1><div class="sub">Ainda não há um plano montado para você.</div></header>' +
        painelRelatorios(d) + painelDuvida(d) + painelFeedback(d) + '<div class="sincronia" id="mty-sincronia"></div>';
      ligarEventos(d);
      return;
    }
    const repetindo = d.aulas.filter(function (a) { return a.status === 'falta' || a.status === 'cancelada'; }).length;
    const pendente = d.totalAulas - d.aulasFeitas - repetindo;
    let html = '';
    html += '<header><h1>' + escapar(d.nome) + '</h1><div class="sub">' + escapar(d.tipoPlano) + '</div></header>';
    if (d.prioridade) html += '<p class="sub">' + escapar(d.prioridade) + '</p>';
    html += '<div class="rosca-wrap">' + rosquinhaSvg(d.aulasFeitas, pendente, repetindo) +
      '<div>' + legendaRosca(d.aulasFeitas, pendente, repetindo) +
      '<div class="progtxt">' + d.aulasFeitas + ' de ' + d.totalAulas + ' aulas</div></div></div>';

    let blocoAtual = null, semanaAtual = null;
    d.aulas.forEach(function(a){
      if (a.bloco !== blocoAtual) { blocoAtual = a.bloco; semanaAtual = null; html += '<div class="bloco">' + escapar(a.bloco) + '</div>'; }
      if (a.semana !== semanaAtual) { semanaAtual = a.semana; html += '<div class="semana">Semana ' + a.semana + (a.foco ? ' · ' + escapar(a.foco) : '') + '</div>'; }
      var marca = { feita: '✅', falta: '❌', cancelada: '🌧️' }[a.status] || '⬜';
      html += '<div class="aula' + (a.status === 'feita' ? ' feita' : '') + '">' +
        '<span class="marca">' + marca + '</span>' +
        '<span class="txt">' + escapar(a.titulo) + '</span>' +
        (a.data ? '<span class="data">' + escapar(a.data) + '</span>' : '') +
        '</div>';
    });

    html += painelRelatorios(d);
    html += painelSuaAula(d);
    html += painelDuvida(d);
    html += painelFeedback(d);
    html += painelJogo(d);
    html += '<div class="sincronia" id="mty-sincronia"></div>';
    el.innerHTML = html;
    ligarEventos(d);
  }

  function painelRelatorios(d) {
    const historico = d.historicoRelatorios || [];
    if (!historico.length) return '';
    const pontos = historico.slice().reverse().map(function (h) {
      const comCriterios = (h.criterios || []).length > 0;
      const pctCriterios = comCriterios ? Math.round(100 * h.criterios.reduce(function (s, c) {
        return s + (c.resultado === 'sim' ? 1 : c.resultado === 'par' ? 0.5 : 0);
      }, 0) / h.criterios.length) : null;
      const pctAulas = h.total > 0 ? Math.round(100 * (h.feitas / h.total)) : null;
      return { pctCriterios: pctCriterios, pctAulas: pctAulas };
    });
    let html = '<div class="painel">';
    html += '<h2>Seus relatórios de ciclo</h2>';
    html += '<p class="desc">O que seu treinador observou ao fechar cada ciclo de treino.</p>';
    const grafico = graficoEvolucaoSvg(pontos);
    if (grafico) {
      html += '<div style="margin:8px 0">' + grafico + '</div>' +
        '<div style="display:flex;gap:14px;font-size:11.5px;margin-bottom:10px">' +
        '<span><span style="color:var(--verde);font-weight:700">▬</span> Critérios atingidos</span>' +
        '<span><span style="color:var(--tinta);font-weight:700">▬</span> Aulas realizadas</span></div>';
    }
    html += historico.map(function (h) {
      const aberto = ui.relatorioAberto === h.id;
      const criteriosHtml = (h.criterios || []).map(function (c) {
        const cor = NOTA_COR_REL[c.resultado] || 'var(--cinza)';
        const rot = NOTA_LABEL_REL[c.resultado] || 'Não avaliado';
        return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px">' +
          '<span style="width:8px;height:8px;border-radius:999px;background:' + cor + ';flex-shrink:0"></span>' +
          '<span style="flex:1">' + escapar(c.nome) + '</span><span style="font-size:11px;font-weight:700;color:' + cor + '">' + rot + '</span></div>';
      }).join('');
      return '<div style="border-top:1px solid var(--linha);padding:10px 0">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<span style="font-size:12.5px">' + new Date(h.data).toLocaleDateString('pt-BR') + ' · ' + escapar(h.tipo || 'ciclo') + ' · ' + h.feitas + ' de ' + h.total + ' aulas</span>' +
        '<span class="linha-btns" style="margin-top:0">' +
        '<button class="btn fraco" data-acao="alternar-relatorio" data-id="' + h.id + '">' + (aberto ? 'Fechar' : 'Ver') + '</button>' +
        '<button class="btn fraco" data-acao="exportar-relatorio-pdf" data-id="' + h.id + '">Exportar PDF</button>' +
        '</span></div>' +
        (aberto ? '<div style="margin-top:8px">' + criteriosHtml +
          '<pre style="white-space:pre-wrap;font-size:11.5px;background:var(--papel);padding:10px;border-radius:4px;margin-top:8px">' + escapar(h.texto) + '</pre></div>' : '') +
        '</div>';
    }).join('');
    html += '</div>';
    return html;
  }

  function painelSuaAula(d) {
    const pendentes = (d.pedidosReposicao || []).filter(function (p) { return p.status === 'pendente'; });
    let html = '<div class="painel">';
    html += '<h2>Sua aula</h2>';
    if (!d.aulaEmVigor) {
      html += '<p class="desc">Nenhuma aula pendente no momento — nada para cancelar ou reagendar.</p></div>';
      return html;
    }
    html += '<p class="desc">' + escapar(d.aulaEmVigor.bloco) + ' · semana ' + d.aulaEmVigor.semana + ' · <b>' + escapar(d.aulaEmVigor.titulo) + '</b></p>';

    if (pendentes.length > 0) {
      html += '<div class="pedido-pendente">Você já pediu reposição para ' + NOMES_DIA[pendentes[0].diaPreferido] +
        ' ' + escapar(pendentes[0].horaPreferido) + ' — aguardando seu treinador confirmar.</div>';
    } else {
      html += '<div class="linha-btns">' +
        '<button class="btn perigo" data-acao="abrir-cancelar">Cancelar esta aula</button>' +
        '<button class="btn fraco" data-acao="abrir-reagendar">Pedir outro horário</button>' +
        '</div>';
    }

    if (ui.painel === 'cancelar') {
      const horasDeAviso = d.proximaAula ? (new Date(d.proximaAula).getTime() - Date.now()) / 3600000 : null;
      const dentroDoPrazo = horasDeAviso !== null && horasDeAviso >= 24;
      html += '<div class="painel" style="margin-top:10px;background:var(--papel)">' +
        '<p class="desc">Cancelar com pelo menos 24h de antecedência não conta como aula realizada — seu treinador repõe. ' +
        'Com menos de 24h, o horário já está reservado e esta aula é contada como realizada mesmo assim.</p>' +
        (horasDeAviso === null
          ? '<p class="aviso-mini">Sem horário fixo cadastrado — fale com seu treinador para cancelar.</p>'
          : '<p class="aviso-mini" style="color:' + (dentroDoPrazo ? 'var(--verde)' : 'var(--verm)') + ';font-weight:600">' +
            (dentroDoPrazo
              ? 'Ainda dá tempo — faltam ' + Math.round(horasDeAviso) + 'h para sua aula. Cancelar agora NÃO conta como realizada.'
              : 'Faltam só ' + Math.max(0, Math.round(horasDeAviso)) + 'h para sua aula — menos de 24h. Cancelar agora conta como realizada.') +
            '</p>') +
        '<div class="linha-btns">' +
        '<button class="btn perigo" data-acao="confirmar-cancelar" ' + (ui.enviando || horasDeAviso === null ? 'disabled' : '') + '>Confirmar cancelamento</button>' +
        '<button class="btn fraco" data-acao="fechar-painel">Voltar</button>' +
        '</div></div>';
    }
    if (ui.painel === 'reagendar') {
      html += '<div class="painel" style="margin-top:10px;background:var(--papel)">' +
        '<p class="desc">Toque num horário livre da grade abaixo pra sugerir a troca. Isto vira um pedido — seu treinador confirma.</p>' +
        html_gradeAgenda(d.agendaOcupada || {}) +
        '<textarea id="mty-nota-reagendar" rows="2" placeholder="Algo a explicar? (opcional)"></textarea>' +
        '<div class="linha-btns">' +
        '<button class="btn" data-acao="enviar-reagendar" ' + (ui.enviando || ui.diaEscolhido === null ? 'disabled' : '') + '>Enviar pedido</button>' +
        '<button class="btn fraco" data-acao="fechar-painel">Cancelar</button>' +
        '</div></div>';
    }
    if (ui.painel === 'msg-sua-aula' && ui.mensagem) {
      html += '<div class="confirmado">' + escapar(ui.mensagem) + '</div>';
    }
    html += '</div>';
    return html;
  }

  function html_gradeAgenda(agenda) {
    const horas = todosHorarios(agenda);
    let html = '<div class="grade">';
    NOMES_DIA.forEach(function (nome) { html += '<div class="rot">' + nome + '</div>'; });
    horas.forEach(function (hora) {
      for (let dia = 0; dia < 7; dia++) {
        const ocupado = (agenda[dia] || agenda[String(dia)] || []).indexOf(hora) >= 0;
        const selecionado = ui.diaEscolhido === dia && ui.horaEscolhida === hora;
        const classe = ocupado ? 'cel ocupado' : (selecionado ? 'cel sel' : 'cel');
        html += '<div class="' + classe + '" ' + (ocupado ? '' : 'data-acao="escolher-horario" data-dia="' + dia + '" data-hora="' + hora + '"') + '>' +
          (ocupado ? '·' : hora) + '</div>';
      }
    });
    html += '</div>';
    return html;
  }

  function painelDuvida(d) {
    const pedidos = d.pedidosConteudo || [];
    let html = '<div class="painel">';
    html += '<h2>O que você gostaria de trabalhar</h2>';
    html += '<p class="desc">Vai para o seu treinador. Se ele aprovar, entra no seu próximo planejamento.</p>';
    if (ui.painel === 'msg-duvida' && ui.mensagem) {
      html += '<div class="confirmado">' + escapar(ui.mensagem) + '</div>';
    } else {
      html += '<textarea id="mty-texto-duvida" rows="3" placeholder="Um golpe, uma dúvida, algo que você quer treinar mais..."></textarea>' +
        '<div class="linha-btns"><button class="btn" data-acao="enviar-duvida" ' + (ui.enviando ? 'disabled' : '') + '>Enviar</button></div>';
    }
    if (pedidos.length) {
      const ROTULO_STATUS = { pendente: 'aguardando seu treinador', aprovado: 'aprovado — entrou no planejamento', recusado: 'não aprovado desta vez' };
      html += pedidos.slice(0, 5).map(function (p) {
        return '<div class="pedido-pendente" style="margin-top:8px">' + escapar(p.texto) +
          '<br><span class="aviso-mini">' + (ROTULO_STATUS[p.status] || p.status) + '</span></div>';
      }).join('');
    }
    html += '</div>';
    return html;
  }

  function painelFeedback(d) {
    let html = '<div class="painel">';
    html += '<h2>Feedback para o coordenador</h2>';
    html += '<p class="desc">Vai direto para o coordenador da academia — seu treinador não vê este campo.</p>';
    if (ui.painel === 'msg-feedback' && ui.mensagem) {
      html += '<div class="confirmado">' + escapar(ui.mensagem) + '</div>';
    } else {
      html += '<textarea id="mty-texto-feedback" rows="3" placeholder="O que você quer contar pro coordenador?"></textarea>' +
        '<div class="linha-btns"><button class="btn" data-acao="enviar-feedback" ' + (ui.enviando ? 'disabled' : '') + '>Enviar feedback</button></div>';
    }
    html += '</div>';
    return html;
  }

  function painelJogo(d) {
    let html = '<div class="painel">';
    html += '<h2>Descreva um jogo</h2>';
    html += '<p class="desc">Fica disponível para seu treinador consultar — como foi o jogo, o que funcionou, o que não funcionou.</p>';
    if (ui.painel === 'msg-jogo' && ui.mensagem) {
      html += '<div class="confirmado">' + escapar(ui.mensagem) + '</div>';
    } else {
      html += '<textarea id="mty-texto-jogo" rows="3" placeholder="Contra quem, o resultado, o que você notou..."></textarea>' +
        '<div class="linha-btns"><button class="btn" data-acao="enviar-jogo" ' + (ui.enviando ? 'disabled' : '') + '>Enviar</button></div>';
    }
    html += '</div>';
    return html;
  }

  function ligarEventos(d) {
    el.querySelectorAll('[data-acao]').forEach(function (btn) {
      btn.addEventListener('click', function () { onAcao(btn.dataset, d); });
    });
  }

  async function onAcao(dataset, d) {
    const acao = dataset.acao;
    if (acao === 'abrir-cancelar') { ui.painel = 'cancelar'; ui.mensagem = null; render(d); return; }
    if (acao === 'abrir-reagendar') { ui.painel = 'reagendar'; ui.diaEscolhido = null; ui.horaEscolhida = null; ui.mensagem = null; render(d); return; }
    if (acao === 'fechar-painel') { ui.painel = null; render(d); return; }
    if (acao === 'escolher-horario') { ui.diaEscolhido = Number(dataset.dia); ui.horaEscolhida = dataset.hora; render(d); return; }
    if (acao === 'alternar-relatorio') { ui.relatorioAberto = (ui.relatorioAberto === dataset.id) ? null : dataset.id; render(d); return; }
    if (acao === 'exportar-relatorio-pdf') { exportarRelatorioPDF(d, dataset.id); return; }

    if (acao === 'confirmar-cancelar') {
      ui.enviando = true; render(d);
      try {
        const resp = await postAcao({ acao: 'cancelar' });
        ui.enviando = false; ui.painel = 'msg-sua-aula'; ui.mensagem = resp.mensagem;
        await carregar(true);
      } catch (e) {
        ui.enviando = false; ui.painel = 'msg-sua-aula'; ui.mensagem = 'Não deu: ' + e.message; render(ultimoDado);
      }
      return;
    }
    if (acao === 'enviar-reagendar') {
      const nota = (document.getElementById('mty-nota-reagendar') || {}).value || '';
      ui.enviando = true; render(d);
      try {
        const resp = await postAcao({ acao: 'reagendar', diaPreferido: ui.diaEscolhido, horaPreferido: ui.horaEscolhida, nota: nota });
        ui.enviando = false; ui.painel = 'msg-sua-aula'; ui.mensagem = resp.mensagem;
        await carregar(true);
      } catch (e) {
        ui.enviando = false; ui.painel = 'msg-sua-aula'; ui.mensagem = 'Não deu: ' + e.message; render(ultimoDado);
      }
      return;
    }
    if (acao === 'enviar-duvida') {
      const texto = (document.getElementById('mty-texto-duvida') || {}).value || '';
      if (!texto.trim()) return;
      ui.enviando = true; render(d);
      try {
        const resp = await postAcao({ acao: 'duvida', texto: texto });
        ui.enviando = false; ui.painel = 'msg-duvida'; ui.mensagem = resp.mensagem || 'Enviado.';
        await carregar(true);
      } catch (e) {
        ui.enviando = false; ui.painel = null; alert('Não deu: ' + e.message); render(ultimoDado);
      }
      return;
    }
    if (acao === 'enviar-feedback') {
      const texto = (document.getElementById('mty-texto-feedback') || {}).value || '';
      if (!texto.trim()) return;
      ui.enviando = true; render(d);
      try {
        const resp = await postAcao({ acao: 'feedback', texto: texto });
        ui.enviando = false; ui.painel = 'msg-feedback'; ui.mensagem = resp.mensagem || 'Enviado ao coordenador.';
        render(ultimoDado);
      } catch (e) {
        ui.enviando = false; ui.painel = null; alert('Não deu: ' + e.message); render(ultimoDado);
      }
      return;
    }
    if (acao === 'enviar-jogo') {
      const texto = (document.getElementById('mty-texto-jogo') || {}).value || '';
      if (!texto.trim()) return;
      ui.enviando = true; render(d);
      try {
        const resp = await postAcao({ acao: 'jogo', texto: texto });
        ui.enviando = false; ui.painel = 'msg-jogo'; ui.mensagem = resp.mensagem || 'Enviado.';
        render(ultimoDado);
      } catch (e) {
        ui.enviando = false; ui.painel = null; alert('Não deu: ' + e.message); render(ultimoDado);
      }
      return;
    }
  }

  function marcarSincronia(destacar) {
    const nota = document.getElementById('mty-sincronia');
    if (!nota) return;
    const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    nota.textContent = 'Atualizado às ' + agora;
    nota.className = 'sincronia' + (destacar ? ' piscando' : '');
    if (destacar) setTimeout(() => { nota.className = 'sincronia'; }, 2500);
  }

  carregar();
  setInterval(carregar, INTERVALO);
})();
</script>
</body>
</html>

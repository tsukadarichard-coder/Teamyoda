<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar minha conta · Metodologia MTY</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#C8102E">
<style>
  :root{ --papel:#F5F2F0; --tinta:#141210; --verm:#C8102E; --cinza:#6B6461; --linha:#D8D1CB; --verde:#2E4739; }
  *{box-sizing:border-box}
  body{margin:0; background:var(--papel); color:var(--tinta);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:0 0 60px}
  .topo{background:var(--verm); height:7px}
  .wrap{max-width:420px; margin:0 auto; padding:0 20px}
  header{padding:26px 0 14px; text-align:center}
  header img{height:34px}
  h1{font-family:Georgia,serif; font-size:20px; margin:14px 0 4px}
  .sub{color:var(--cinza); font-size:13px}
  .selo{display:inline-block; margin-top:10px; padding:4px 10px; border-radius:999px; background:#EFEAE4;
    color:var(--cinza); font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase}
  .campo{margin:16px 0}
  label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.04em;
    text-transform:uppercase; margin-bottom:6px; color:var(--cinza)}
  input{width:100%; border:1px solid var(--linha); background:#fff; border-radius:3px;
    padding:11px 12px; font:inherit; font-size:15px; color:var(--tinta)}
  input:focus{outline:none; border-color:var(--verm)}
  .bt{width:100%; border:none; border-radius:3px; padding:14px; font-size:15px; font-weight:700;
    cursor:pointer; font-family:inherit; background:var(--verm); color:#fff; margin-top:8px;
    transition:transform .06s ease, opacity .06s ease}
  .bt[disabled]{opacity:.6}
  .bt:active:not([disabled]){transform:scale(0.97); opacity:.85}
  .msg{margin-top:16px; padding:13px 14px; border-radius:3px; font-size:13.5px; display:none}
  .ok{background:var(--verde); color:#fff}
  .erro{background:#fff; border:1px solid var(--linha); border-left:4px solid var(--verm)}
  .rodape{margin-top:22px; text-align:center; font-size:12.5px; color:var(--cinza)}
  .rodape a{color:var(--verm)}
</style>
</head>
<body>
<div class="topo"></div>
<div class="wrap">
<header>
  <img src="assets/logo-team-yoda.jpg" alt="Team Yoda">
  <h1>Criar minha conta</h1>
  <div class="sub">Pra treinador independente — sem academia, sem convite</div>
  <div class="selo">Plano grátis pra começar</div>
</header>

<div id="form">
  <div class="campo">
    <label>Seu nome</label>
    <input type="text" id="nome" autocomplete="name">
  </div>
  <div class="campo">
    <label>E-mail</label>
    <input type="email" id="email" autocomplete="email">
  </div>
  <div class="campo">
    <label>Senha</label>
    <input type="password" id="senha" autocomplete="new-password" placeholder="pelo menos 6 caracteres">
  </div>
  <button class="bt" id="btEnviar">Criar minha conta</button>
  <div class="msg" id="msg"></div>
</div>

<div class="rodape">Já tem uma academia? <a href="solicitar-acesso.html">Solicite acesso a ela</a> em vez disso.</div>
</div>

<script>
document.getElementById('btEnviar').onclick = async function(){
  var btn = this, msg = document.getElementById('msg');
  msg.style.display = 'none';

  var nome = document.getElementById('nome').value.trim();
  var email = document.getElementById('email').value.trim();
  var senha = document.getElementById('senha').value;

  if (!nome || !email || !senha) {
    msg.className = 'msg erro'; msg.textContent = 'Preencha todos os campos.'; msg.style.display = 'block';
    return;
  }

  btn.disabled = true; btn.textContent = 'Criando…';
  try {
    var r = await fetch('/.netlify/functions/cadastro-individual', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ nome: nome, email: email, senha: senha }),
    });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(d.erro || ('Erro ' + r.status));

    document.getElementById('form').innerHTML =
      '<div class="msg ok" style="display:block">Conta criada! Já pode entrar com este e-mail e senha na tela principal — sua área é só sua, ninguém mais vê seus dados.</div>' +
      '<a class="bt" style="display:block; text-align:center; text-decoration:none; box-sizing:border-box" href="index.html">Entrar agora</a>';
  } catch (e) {
    msg.className = 'msg erro';
    msg.textContent = e.message || String(e);
    msg.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Criar minha conta';
  }
};
</script>
</body>
</html>

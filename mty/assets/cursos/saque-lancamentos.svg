<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Onde lançar a bola no saque plano, slice e kick" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"><title>Onde lançar a bola no saque plano, slice e kick</title><defs><marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="600" height="340" rx="18" fill="#F6F8F7"/><text x="20" y="34" font-size="19" font-weight="800" fill="#17251F">Saque: onde lançar a bola (destro, visto de cima)</text><rect x="20" y="52" width="560" height="200" rx="14" fill="#3A7B56"/><line x1="20" y1="232" x2="580" y2="232" stroke="#fff" stroke-width="3"/><text x="300" y="248" font-size="12" font-weight="600" fill="#DDE5E0" text-anchor="middle">linha de base</text><ellipse cx="300" cy="196" rx="34" ry="18" fill="#E8691F" stroke="#fff" stroke-width="2"/><text x="300" y="201" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">você</text><line x1="300" y1="190" x2="300" y2="70" stroke="#fff" stroke-width="2" stroke-dasharray="4 5" opacity=".7"/><text x="306" y="76" font-size="12" font-weight="600" fill="#DDE5E0">para a quadra</text><circle cx="330" cy="140" r="11" fill="#E4F542" stroke="#2A3410" stroke-width="1.5"/><text x="346" y="132" font-size="15" font-weight="800" fill="#fff">Plano</text><text x="40" y="280" font-size="14" font-weight="600" fill="#17251F">Plano: à frente e um pouco à direita</text><circle cx="392" cy="158" r="11" fill="#E4F542" stroke="#2A3410" stroke-width="1.5"/><text x="408" y="150" font-size="15" font-weight="800" fill="#fff">Slice</text><text x="40" y="298" font-size="14" font-weight="600" fill="#17251F">Slice: mais à direita</text><circle cx="300" cy="186" r="11" fill="#E4F542" stroke="#2A3410" stroke-width="1.5"/><text x="316" y="178" font-size="15" font-weight="800" fill="#fff">Kick</text><tex
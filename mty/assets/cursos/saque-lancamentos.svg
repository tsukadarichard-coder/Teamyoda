<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 674" width="640" height="674" role="img" aria-label="Onde lançar a bola no saque plano, slice e kick" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, system-ui, sans-serif"><title>Onde lançar a bola no saque plano, slice e kick</title><defs><linearGradient id="gFundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12291F"/><stop offset="1" stop-color="#0C1D16"/></linearGradient><clipPath id="cCartao"><rect width="640" height="674" rx="22"/></clipPath><filter id="fBrilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter><linearGradient id="gPiso" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E7050"/><stop offset="1" stop-color="#1D4A36"/></linearGradient></defs><g clip-path="url(#cCartao)"><rect width="640" height="674" fill="url(#gFundo)"/><rect x="28" y="30" width="22" height="3" rx="1.5" fill="#E4F542"/><text x="58" y="36" font-size="13" font-weight="800" fill="#E4F542" letter-spacing="1.6">TÉCNICA · SAQUE</text><text x="28" y="72" font-size="27" font-weight="800" fill="#F3F7F4">Onde lançar a bola (destro)</text><text x="28" y="98" font-size="16" font-weight="500" fill="#A9BBB1">Visto de cima, com a quadra à frente. O círculo é a sua cabeça.</text><rect x="28" y="122" width="584" height="300" rx="18" fill="url(#gPiso)"/><line x1="28" y1="268" x2="612" y2="268" stroke="#fff" stroke-width="4"/><line x1="300" y1="268" x2="300" y2="256" stroke="#fff" stroke-width="4"/><text x="40" y="288" font-size="11" font-weight="800" fill="rgba(255,255,255,.7)" letter-spacing="1.2">LINHA DE BASE</text><line x1="240" y1="168" x2="240" y2="140" stroke="#E4F542" stroke-width="2.5"/><polygon points="234,144 240,134 246,144" fill="#E4F542"/><text x="252" y="151" font-size="14" font-weight="700" fill="#E4F542">para a quadra</text><g transform="translate(278 308) rotate(60)"><path d="M0 -22 C9 -22 11 -10 10 -2 C9 8 8 19 0 20 C-8 19 -8 8 -8 -2 C-9 -10 -8 -22 0 -22Z" fill="#D5DED9"/></g><g transform="translate(330 334) rotate(80)"><path d="M0 -22 C9 -22 11 -10 10 -2 C9 8 8 19 0 20 C-8 19 -8 8 -8 -2 C-9 -10 -8 -22 0 -22Z" fill="#F07A2D"/></g><circle cx="300" cy="310" r="17" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2" stroke-dasharray="4 3"/><circle cx="328" cy="256" r="18" fill="#E4F542" fill-opacity=".28" filter="url(#fBrilho)"/><circle cx="328" cy="256" r="9" fill="#E4F542" stroke="#0C1D16" stroke-width="1.5"/><line x1="328" y1="256" x2="400" y2="200" stroke="#E4F542" stroke-opacity=".8" stroke-width="1.3"/><circle cx="328" cy="256" r="3" fill="#E4F542"/><rect x="400" y="184" width="84" height="32" rx="16" fill="rgba(8,20,14,.9)" stroke="#E4F542" stroke-opacity=".6"/><circle cx="417" cy="200" r="10.5" fill="#E4F542"/><text x="417" y="204.5" font-size="12.5" font-weight="800" fill="#0C1D16" text-anchor="middle">1</text><text x="434" y="205.2" font-size="15" font-weight="700" fill="#F3F7F4">Plano</text><circle cx="370" cy="294" r="18" fill="#7FC4E8" fill-opacity=".28" filter="url(#fBrilho)"/><circle cx="370" cy="294" r="9" fill="#7FC4E8" stroke="#0C1D16" stroke-width="1.5"/><line x1="370" y1="294" x2="440" y2="300" stroke="#7FC4E8" stroke-opacity=".8" stroke-width="1.3"/><circle cx="370" cy="294" r="3" fill="#7FC4E8"/><rect x="440" y="284" width="84" height="32" rx="16" fill="rgba(8,20,14,.9)" stroke="#7FC4E8" stroke-opacity=".6"/><circle cx="457" cy="300" r="10.5" fill="#7FC4E8"/><text x="457" y="304.5" font-size="12.5" font-weight="800" fill="#0C1D16" text-anchor="middle">2</text><text x="474" y="305.2" font-size="15" font-weight="700" fill="#F3F7F4">Slice</text><circle cx="296" cy="304" r="18" fill="#F07A2D" fill-opacity=".28" filter="url(#fBrilho)"/><circle cx="296" cy="304" r="9" fill="#F07A2D" stroke="#0C1D16" stroke-width="1.5"/><line x1="296" y1="304" x2="185.6" y2="230" stroke="#F07A2D" stroke-opacity=".8" stroke-width="1.3"/><circle cx="296" cy="304" r="3" fill="#F07A2D"/><rect x="110" y="214" width="75.6" height="32" rx="16" fill="rgba(8,20,14,.9)" stroke="#F07A2D" stroke-opacity=".6"/><circle cx="127" cy="230" r="10.5" fill="#F07A2D"/><text x="127" y="234.5" font-size="12.5" font-weight="800" fill="#0C1D16" text-anchor="middle">3</text><text x="144" y="235.2" font-size="15" font-weight="700" fill="#F3F7F4">Kick</text><line x1="28" y1="446" x2="612" y2="446" stroke="rgba(255,255,255,.08)"/><circle cx="42" cy="475" r="13" fill="#E4F542"/><text x="42" y="480" font-size="14" font-weight="800" fill="#0C1D16" text-anchor="middle">1</text><text x="68" y="481" font-size="19" font-weight="500" fill="#F3F7F4">Plano: à frente do corpo e um pouco à direita,</text><text x="68" y="506" font-size="19" font-weight="500" fill="#F3F7F4">para bater de cima para baixo.</text><circle cx="42" cy="541" r="13" fill="#7FC4E8"/><text x="42" y="546" font-size="14" font-weight="800" fill="#0C1D16" text-anchor="middle">2</text><text x="68" y="547" font-size="19" font-weight="500" fill="#F3F7F4">Slice: mais à direita, para a raquete passar pelo</text><text x="68" y="572" font-size="19" font-weight="500" fill="#F3F7F4">lado da bola.</text><circle cx="42" cy="607" r="13" fill="#F07A2D"/><text x="42" y="612" font-size="14" font-weight="800" fill="#0C1D16" text-anchor="middle">3</text><text x="68" y="613" font-size="19" font-weight="500" fill="#F3F7F4">Kick: sobre a cabeça ou um pouco atrás, para</text><text x="68" y="638" font-size="19" font-weight="500" fill="#F3F7F4">escovar de baixo para cima.</text></g><rect x=".5" y=".5" width="639" height="673" rx="21.5" fill="none" stroke="rgba(255,255,255,.08)"/></svg>

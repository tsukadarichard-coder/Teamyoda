<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" width="640" height="484" role="img" aria-label="O balanço depois do jogo" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, system-ui, sans-serif"><title>O balanço depois do jogo</title><defs><linearGradient id="gFundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12291F"/><stop offset="1" stop-color="#0C1D16"/></linearGradient><clipPath id="cCartao"><rect width="640" height="484" rx="22"/></clipPath><filter id="fBrilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><g clip-path="url(#cCartao)"><rect width="640" height="484" fill="url(#gFundo)"/><rect x="28" y="30" width="22" height="3" rx="1.5" fill="#7FC4E8"/><text x="58" y="36" font-size="13" font-weight="800" fill="#7FC4E8" letter-spacing="1.6">MENTAL</text><text x="28" y="72" font-size="27" font-weight="800" fill="#F3F7F4">O balanço depois do jogo</text><text x="28" y="104" font-size="17" font-weight="500" fill="#A9BBB1">Dez minutos, no mesmo dia, por escrito.</text><line x1="56" y1="176" x2="56" y2="216" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="56" cy="154" r="22" fill="#0C1D16" stroke="#E4F542" stroke-width="2.2"/><text x="56" y="160" font-size="16" font-weight="800" fill="#E4F542" text-anchor="middle">01</text><text x="96" y="154" font-size="21" font-weight="800" fill="#F3F7F4">O que funcionou</text><text x="96" y="180" font-size="18" font-weight="500" fill="#A9BBB1">Decisões e golpes que deram certo.</text><line x1="56" y1="260" x2="56" y2="300" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="56" cy="238" r="22" fill="#0C1D16" stroke="#FF6B57" stroke-width="2.2"/><text x="56" y="244" font-size="16" font-weight="800" fill="#FF6B57" text-anchor="middle">02</text><text x="96" y="238" font-size="21" font-weight="800" fill="#F3F7F4">O que não funcionou</text><text x="96" y="264" font-size="18" font-weight="500" fill="#A9BBB1">Sem culpar ninguém, nem você.</text><line x1="56" y1="344" x2="56" y2="384" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="56" cy="322" r="22" fill="#0C1D16" stroke="#7FC4E8" stroke-width="2.2"/><text x="56" y="328" font-size="16" font-weight="800" fill="#7FC4E8" text-anchor="middle">03</text><text x="96" y="322" font-size="21" font-weight="800" fill="#F3F7F4">Por que os erros</text><text x="96" y="348" font-size="18" font-weight="500" fill="#A9BBB1">Foi decisão ou execução?</text><circle cx="56" cy="406" r="22" fill="#0C1D16" stroke="#F07A2D" stroke-width="2.2"/><text x="56" y="412" font-size="16" font-weight="800" fill="#F07A2D" text-anchor="middle">04</text><text x="96" y="406" font-size="21" font-weight="800" fill="#F3F7F4">O que treinar</text><text x="96" y="432" font-size="18" font-weight="500" fill="#A9BBB1">Um ou dois pontos para a próxima semana.</text></g><rect x=".5" y=".5" width="639" height="483" rx="21.5" fill="none" stroke="rgba(255,255,255,.08)"/></svg>

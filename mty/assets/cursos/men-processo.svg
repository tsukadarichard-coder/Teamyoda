<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 222" width="600" height="222" role="img" aria-label="Foco no processo" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"><title>Foco no processo</title><defs><marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="600" height="222" rx="18" fill="#F6F8F7"/><text x="20" y="36" font-size="19" font-weight="800" fill="#17251F">Foco no processo</text><rect x="16" y="56" width="568" height="64" rx="14" fill="#fff" stroke="#E2E8E5" stroke-width="1.5"/><circle cx="50" cy="88" r="17" fill="#69B32A"/><text x="50" y="94" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="80" y="83" font-size="16" font-weight="800" fill="#17251F">Depois de cada ponto</text><text x="80" y="104" font-size="13.5" font-weight="500" fill="#5B6B63">nomeie uma coisa que você executou bem</text><rect x="16" y="130" width="568" height="64" rx="14" fill="#fff" stroke="#E2E8E5" stroke-width="1.5"/><circle cx="50" cy="162" r="17" fill="#5B6B63"/><text x="50" y="168" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="80" y="157" font-size="16" font-weight="800" fill="#17251F">Ganhou ou perdeu</text><text x="80" y="178" font-size="13.5" font-weight="500" fill="#5B6B63">não importa: o placar fica de fora</text></svg>

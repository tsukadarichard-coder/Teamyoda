importa agora. O placar fica de fora; o</text><text x="96" y="312" font-size="18" font-weight="500" fill="#A9BBB1">processo fica dentro.</text></g><rect x=".5" y=".5" width="639" height="363" rx="21.5" fill="none" stroke="rgba(255,255,255,.08)"/></svg>

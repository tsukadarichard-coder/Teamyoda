<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" width="640" height="472" role="img" aria-label="A rotina de 20 segundos" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, system-ui, sans-serif"><title>A rotina de 20 segundos</title><defs><linearGradient id="gFundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12291F"/><stop offset="1" stop-color="#0C1D16"/></linearGradient><clipPath id="cCartao"><rect width="640" height="472" rx="22"/></clipPath><filter id="fBrilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><g clip-path="url(#cCartao)"><rect width="640" height="472" fill="url(#gFundo)"/><rect x="28" y="30" width="22" height="3" rx="1.5" fill="#7FC4E8"/><text x="58" y="36" font-size="13" font-weight="800" fill="#7FC4E8" letter-spacing="1.6">MENTAL</text><text x="28" y="72" font-size="27" font-weight="800" fill="#F3F7F4">A rotina de 20 segundos</text><text x="28" y="104" font-size="17" font-weight="500" fill="#A9BBB1">Entre um ponto e outro, sempre na mesma ordem.</text><line x1="56" y1="176" x2="56" y2="240" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="56" cy="154" r="22" fill="#0C1D16" stroke="#7FC4E8" stroke-width="2.2"/><text x="56" y="160" font-size="16" font-weight="800" fill="#7FC4E8" text-anchor="middle">01</text><text x="96" y="154" font-size="21" font-weight="800" fill="#F3F7F4">Fechar o ponto</text><text x="96" y="180" font-size="18" font-weight="500" fill="#A9BBB1">Vire de costas para a rede e olhe para as</text><text x="96" y="204" font-size="18" font-weight="500" fill="#A9BBB1">cordas.</text><rect x="554.2" y="137" width="57.8" height="26" rx="13" fill="rgba(255,255,255,.08)"/><text x="602" y="155" font-size="13.5" font-weight="700" fill="#F3F7F4" text-anchor="end">0–5 s</text><line x1="56" y1="284" x2="56" y2="348" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="56" cy="262" r="22" fill="#0C1D16" stroke="#7FC4E8" stroke-width="2.2"/><text x="56" y="268" font-size="16" font-weight="800" fill="#7FC4E8" text-anchor="middle">02</text><text x="96" y="262" font-size="21" font-weight="800" fill="#F3F7F4">Respirar</text><text x="96" y="288" font-size="18" font-weight="500" fill="#A9BBB1">Uma ou mais respirações lentas, pela</text><text x="96" y="312" font-size="18" font-weight="500" fill="#A9BBB1">barriga.</text><rect x="546.6" y="245" width="65.4" height="26" rx="13" fill="rgba(255,255,255,.08)"/><text x="602" y="263" font-size="13.5" font-weight="700" fill="#F3F7F4" text-anchor="end">5–12 s</text><circle cx="56" cy="370" r="22" fill="#0C1D16" stroke="#E4F542" stroke-width="2.2"/><text x="56" y="376" font-size="16" font-weight="800" fill="#E4F542" text-anchor="middle">03</text><text x="96" y="370" font-size="21" font-weight="800" fill="#F3F7F4">Decidir</text><text x="96" y="396" font-size="18" font-weight="500" fill="#A9BBB1">Escolha a tática do próximo ponto e só então</text><text x="96" y="420" font-size="18" font-weight="500" fill="#A9BBB1">volte.</text><rect x="539.1" y="353" width="72.9" height="26" rx="13" fill="rgba(255,255,255,.08)"/><text x="602" y="371" font-size="13.5" font-weight="700" fill="#F3F7F4" text-anchor="end">12–20 s</text></g><rect x=".5" y=".5" width="639" height="471" rx="21.5" fill="none" stroke="rgba(255,255,255,.08)"/></svg>

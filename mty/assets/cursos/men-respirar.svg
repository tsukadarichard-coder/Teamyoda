<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" width="640" height="424" role="img" aria-label="Respirar entre os pontos" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, system-ui, sans-serif"><title>Respirar entre os pontos</title><defs><linearGradient id="gFundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12291F"/><stop offset="1" stop-color="#0C1D16"/></linearGradient><clipPath id="cCartao"><rect width="640" height="424" rx="22"/></clipPath><filter id="fBrilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><g clip-path="url(#cCartao)"><rect width="640" height="424" fill="url(#gFundo)"/><rect x="28" y="30" width="22" height="3" rx="1.5" fill="#7FC4E8"/><text x="58" y="36" font-size="13" font-weight="800" fill="#7FC4E8" letter-spacing="1.6">MENTAL</text><text x="28" y="72" font-size="27" font-weight="800" fill="#F3F7F4">Respirar entre os pontos</text><text x="28" y="104" font-size="17" font-weight="500" fill="#A9BBB1">Três respirações baixam o ritmo do coração.</text><line x1="56" y1="176" x2="56" y2="216" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="56" cy="154" r="22" fill="#0C1D16" stroke="#7FC4E8" stroke-width="2.2"/><text x="56" y="160" font-size="16" font-weight="800" fill="#7FC4E8" text-anchor="middle">01</text><text x="96" y="154" font-size="21" font-weight="800" fill="#F3F7F4">Primeira respiração</text><text x="96" y="180" font-size="18" font-weight="500" fill="#A9BBB1">Pela barriga, devagar, ombros soltos.</text><rect x="569.3" y="137" width="42.7" height="26" rx="13" fill="rgba(255,255,255,.08)"/><text x="602" y="155" font-size="13.5" font-weight="700" fill="#F3F7F4" text-anchor="end">4 s</text><line x1="56" y1="260" x2="56" y2="300" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="56" cy="238" r="22" fill="#0C1D16" stroke="#7FC4E8" stroke-width="2.2"/><text x="56" y="244" font-size="16" font-weight="800" fill="#7FC4E8" text-anchor="middle">02</text><text x="96" y="238" font-size="21" font-weight="800" fill="#F3F7F4">Segunda respiração</text><text x="96" y="264" font-size="18" font-weight="500" fill="#A9BBB1">Solte o ar mais devagar do que puxou.</text><rect x="569.3" y="221" width="42.7" height="26" rx="13" fill="rgba(255,255,255,.08)"/><text x="602" y="239" font-size="13.5" font-weight="700" fill="#F3F7F4" text-anchor="end">6 s</text><circle cx="56" cy="322" r="22" fill="#0C1D16" stroke="#E4F542" stroke-width="2.2"/><text x="56" y="328" font-size="16" font-weight="800" fill="#E4F542" text-anchor="middle">03</text><text x="96" y="322" font-size="21" font-weight="800" fill="#F3F7F4">Terceira respiração</text><text x="96" y="348" font-size="18" font-weight="500" fill="#A9BBB1">Só depois volte para o saque ou para a</text><text x="96" y="372" font-size="18" font-weight="500" fill="#A9BBB1">devolução.</text><rect x="569.3" y="305" width="42.7" height="26" rx="13" fill="rgba(255,255,255,.08)"/><text x="602" y="323" font-size="13.5" font-weight="700" fill="#F3F7F4" text-anchor="end">6 s</text></g><rect x=".5" y=".5" width="639" height="423" rx="21.5" fill="none" stroke="rgba(255,255,255,.08)"/></svg>

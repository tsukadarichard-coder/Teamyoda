<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="Margem: a bola alta sobre a rede cai funda; a rasante cai curta" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"><title>Margem: a bola alta sobre a rede cai funda; a rasante cai curta</title><defs><marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="600" height="330" rx="18" fill="#F6F8F7"/><text x="20" y="34" font-size="19" font-weight="800" fill="#17251F">Margem: a bola profunda nasce da altura</text><line x1="30" y1="210" x2="570" y2="210" stroke="#3A7B56" stroke-width="6"/><line x1="300" y1="210" x2="300" y2="170" stroke="#17251F" stroke-width="5"/><text x="300" y="162" font-size="12" font-weight="700" fill="#5B6B63" text-anchor="middle">rede</text><text x="40" y="232" font-size="13" font-weight="700" fill="#5B6B63">você</text><text x="560" y="232" font-size="13" font-weight="700" fill="#5B6B63" text-anchor="end">fundo do outro lado</text><path d="M60 185 Q300 40 540 208" fill="none" stroke="#69B32A" stroke-width="4" marker-end="url(#seta)"/><path d="M60 185 Q240 152 400 208" fill="none" stroke="#C2412F" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#seta)"/><line x1="24" y1="260" x2="52" y2="260" stroke="#69B32A" stroke-width="4"/><text x="62" y="265" font-size="14.5" font-weight="800" fill="#2F5F12">alta sobre a rede: cai funda</text><line x1="24" y1="286" x2="52" y2="286" stroke="#C2412F" stroke-width="4" stroke-dasharray="8 6"/><text x="62" y="291" font-size="14.5" font-weight="800" fill="#C2412F">rasante: cai curta ou para na rede</text><text x="20" y="318" font-size="14" font-weight="600" fill="#5B6B63">Mire com margem: sobre a rede e para dentro das linhas.</text></svg>

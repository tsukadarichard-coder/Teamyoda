<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" role="img" aria-label="Voltar depois de erros" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, system-ui, sans-serif"><title>Voltar depois de erros</title><defs><linearGradient id="gFundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12291F"/><stop offset="1" stop-color="#0C1D16"/></linearGradient><clipPath id="cCartao"><rect width="640" height="580" rx="22"/></clipPath><filter id="fBrilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><g clip-path="url(#cCartao)"><rect width="640" height="580" fill="url(#gFundo)"/><rect x="28" y="30" width="22" height="3" rx="1.5" fill="#7FC4E8"/><text x="58" y="36" font-size="13" font-weight="800" fill="#7FC4E8" letter-spacing="1.6">MENTAL</text><text x="28" y="72" font-size="27" font-weight="800" fill="#F3F7F4">Voltar depois de erros</text><text x="28" y="104" font-size="17" font-weight="500" fill="#A9BBB1">Separe o erro forçado do erro que dependia de você.</text><line x1="56" y1="176" x2="56" y2="240" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="56" cy="154" r="22" fill="#0C1D16" stroke="#FF6B57" stroke-width="2.2"/><text x="56" y="160" font-size="16" font-weight="800" fill="#FF6B57" text-anchor="middle">✕</text><text x="96" y="154" font-size="21" font-weight="800" fill="#F3F7F4">Bola difícil</text><text x="96" y="180" font-size="18" font-weight="500" fill="#A9BBB1">Erro forçado pelo adversário: tudo bem, siga</text><text x="96" y="204" font-size="18" font-weight="500" fill="#A9BBB1">o plano.</text><line x1="56" y1="284" x2="56" y2="348" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="56" cy="262" r="22" fill="#0C1D16" stroke="#FF6B57" stroke-width="2.2"/><text x="56" y="268" font-size="16" font-weight="800" fill="#FF6B57" text-anchor="middle">✕</text><text x="96" y="262" font-size="21" font-weight="800" fill="#F3F7F4">Bola difícil</text><text x="96" y="288" font-size="18" font-weight="500" fill="#A9BBB1">Erro forçado de novo: o plano continua</text><text x="96" y="312" font-size="18" font-weight="500" fill="#A9BBB1">certo.</text><line x1="56" y1="392" x2="56" y2="456" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="56" cy="370" r="22" fill="#0C1D16" stroke="#FF6B57" stroke-width="2.2"/><text x="56" y="376" font-size="16" font-weight="800" fill="#FF6B57" text-anchor="middle">✕</text><text x="96" y="370" font-size="21" font-weight="800" fill="#F3F7F4">Bola difícil</text><text x="96" y="396" font-size="18" font-weight="500" fill="#A9BBB1">Respire, mantenha a margem, não mude por</text><text x="96" y="420" font-size="18" font-weight="500" fill="#A9BBB1">impulso.</text><circle cx="56" cy="478" r="22" fill="#0C1D16" stroke="#E4F542" stroke-width="2.2"/><text x="56" y="484" font-size="16" font-weight="800" fill="#E4F542" text-anchor="middle">✓</text><text x="96" y="478" font-size="21" font-weight="800" fill="#F3F7F4">Bola fácil</text><text x="96" y="504" font-size="18" font-weight="500" fill="#A9BBB1">Volte à rotina e execute com margem e alvo</text><text x="96" y="528" font-size="18" font-weight="500" fill="#A9BBB1">grande.</text></g><rect x=".5" y=".5" width="639" height="579" rx="21.5" fill="none" stroke="rgba(255,255,255,.08)"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 296" width="600" height="296" role="img" aria-label="Visualização antes do treino" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"><title>Visualização antes do treino</title><defs><marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="600" height="296" rx="18" fill="#F6F8F7"/><text x="20" y="36" font-size="19" font-weight="800" fill="#17251F">Visualização antes do treino</text><rect x="16" y="56" width="568" height="64" rx="14" fill="#fff" stroke="#E2E8E5" stroke-width="1.5"/><circle cx="50" cy="88" r="17" fill="#17251F"/><text x="50" y="94" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="80" y="83" font-size="16" font-weight="800" fill="#17251F">Feche os olhos</text><text x="80" y="104" font-size="13.5" font-weight="500" fill="#5B6B63">5 minutos antes de entrar em quadra</text><rect x="16" y="130" width="568" height="64" rx="14" fill="#fff" stroke="#E2E8E5" stroke-width="1.5"/><circle cx="50" cy="162" r="17" fill="#1E5A6B"/><text x="50" y="168" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="80" y="157" font-size="16" font-weight="800" fill="#17251F">Veja e sinta</text><text x="80" y="178" font-size="13.5" font-weight="500" fill="#5B6B63">o som da bola, o toque na raquete, o alvo</text><rect x="16" y="204" width="568" height="64" rx="14" fill="#fff" stroke="#E2E8E5" stroke-width="1.5"/><circle cx="50" cy="236" r="17" fill="#69B32A"/><text x="50" y="242" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="80" y="231" font-size="16" font-weight="800" fill="#17251F">Execute na cabeça</text><text x="80" y="252" font-size="13.5" font-weight="500" fill="#5B6B63">os exercícios do dia, bem feitos</text></svg>

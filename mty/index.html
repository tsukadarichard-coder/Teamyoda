/* Pedido de plano pra uma TURMA inteira — uma única aula em grupo, não
   os planos de cada jogador colados lado a lado. É isso que faz os
   planos "conversarem": em vez de cada membro seguir um roteiro
   diferente no mesmo horário de quadra, o grupo tem um cronograma só,
   calibrado pelas fichas de todo mundo. */
/* Mesma ideia de regrasAdulto, mas agregada pro grupo — uma turma de
   adultos pode misturar objetivos diferentes (simples, duplas, não
   compete), então aqui é "que objetivos existem no grupo", não "qual é
   o objetivo dele". O formato geral+específico+aplicação é obrigatório
   pra toda turma de adultos, independente do objetivo de cada um. */
function regrasAdultosTurma(membros) {
  const adultos = membros.filter((m) => m.estagio === "A");
  if (!adultos.length) return [];
  const linhas = [
    "· Turma tem jogador(es) adulto(s) (estágio A): o jogo deles deve ser mais conservador em risco",
    "  do que o de um juvenil — mas o temperamento PRÓPRIO de cada um (agressivo ou defensivo,",
    "  conforme a ficha de cada um) nunca é substituído por isso.",
    "· Toda aula desta turma segue o formato: uma parte GERAL (o que todos do grupo precisam,",
    "  junto), uma parte ESPECÍFICA (o que cada jogador precisa, mesmo que em estações) e um",
    "  exercício de APLICAÇÃO PRÁTICA (jogo/ponto) pra fechar — descreva isso no campo \"d\" de cada aula.",
  ];
  const objetivos = new Set(adultos.map((m) => m.objetivoAdulto).filter(Boolean));
  if (objetivos.has("duplas")) linhas.push("· Há jogador(es) com objetivo em duplas: inclua fundamentos gerais de duplas nas estações dele(s).");
  if (objetivos.has("simples")) linhas.push("· Há jogador(es) com objetivo em simples: fundamentos gerais de simples nas estações dele(s).");
  if (objetivos.has("nao")) linhas.push(
    "· Há jogador(es) recreativo(s), que não competem: sem cobrança de resultado nem exigência",
    "  técnica alta pra eles — mas querem aprender e melhorar mesmo assim. Garanta espaço na aula",
    "  pra jogo (ponto aplicado) e treino de controle, não só exercício isolado.");
  const disposicoes = new Set(adultos.map((m) => m.disposicaoAdulto).filter(Boolean));
  if (disposicoes.has("manutencao")) linhas.push(
    "· Há jogador(es) que treinam por rotina/saúde/convívio, não por alta exigência técnica: pra",
    "  eles, na parte ESPECÍFICA, evite correção em excesso ou repetição sem variar o formato.");
  if (disposicoes.has("competitivo")) linhas.push(
    "· Há jogador(es) competitivo(s) por natureza mesmo sem competir formalmente: pra eles, prefira",
    "  transformar a parte específica em jogo com placar em vez de repetição neutra.");
  if (adultos.some((m) => m.dificuldadeConsistencia)) linhas.push(
    "· Há jogador(es) adulto(s) marcado(s) com dificuldade de consistência (erram demais pra",
    "  sustentar a troca): garanta pra ele(s), na parte ESPECÍFICA, bate-bola cruzado (família DC)",
    "  sem exigência de variação — exceção deliberada ao formato geral da turma, só pra ele(s).");
  return linhas;
}

/* A proporção técnica/geral/tática muda de lado no Y5: antes dele, o
   trabalho ainda é de fundamento (técnica específica maior, geral e
   tática parecidas entre si); a partir dele, a tática já tem padrão de
   jogo próprio nascendo, e a técnica vira ferramenta a serviço dela. */
function regrasCompeticaoTurma(membros) {
  const competidores = membros.filter((m) => m.estagio === "C");
  if (!competidores.length) return [];
  const abaixoY5 = competidores.filter((m) => NIVEIS.indexOf(m.nivel) < NIVEIS.indexOf("Y5")).length;
  const maioriaAbaixoY5 = abaixoY5 >= Math.ceil(competidores.length / 2);
  return maioriaAbaixoY5 ? [
    "· A maioria do grupo de competição está abaixo do nível Y5: dê proporção maior à técnica",
    "  específica; a parte geral e a parte tática devem ficar parecidas em volume entre si — nenhuma",
    "  das duas deve dominar sobre a outra.",
  ] : [
    "· A maioria do grupo de competição já está no nível Y5 ou acima: a técnica específica deve",
    "  diminuir de proporção, a parte geral também diminui, e a parte tática cresce — é aqui que",
    "  nasce o padrão de jogo de cada tenista; a técnica trabalhada agora existe pra sustentar a",
    "  tática que ele já está desenvolvendo, não como fim em si.",
  ];
}

    "  urgente:true — pode ser sinal de que a turma deveria ser dividida em vez de forçar um",
    "  plano só.",
    ...regrasAdultosTurma(membros),
    ...regrasCompeticaoTurma(membros),
  ].join("\n");
}

function promptClassificacao(a) {
  return [
    "Você é assistente de um treinador de tênis que usa a Metodologia MTY.",
    "A partir da ficha abaixo, sugira o ESTÁGIO e o NÍVEL do jogador. É essa classificação que",
    "decide quais exercícios do catálogo entram no plano dele — leia a ficha inteira antes de decidir.",
    "",
    "ESTÁGIOS POSSÍVEIS (escolha exatamente um):",
    "V · Vermelha — iniciação infantil, bola vermelha, quadra reduzida.",
    "L · Laranja — infantil em progressão, bola laranja, quadra intermediária.",
    "G · Verde — infantil avançado, bola verde, quadra cheia, ainda sem jogar com bola amarela de adulto.",
    "A · Adulto — joga com bola e quadra de adulto, sem estrutura competitiva.",
    "C · Competição — joga ou está pronto para torneios, com repertório tático e físico compatível.",
    "",
    "NÍVEIS POSSÍVEIS (escolha exatamente um). O aluno nunca é testado — os critérios são o que se",
    "observaria dele em aula, três vezes, antes de considerar cumprido. É a mesma escada para todos",
    "os públicos: o que muda entre criança e adulto é a velocidade, não o caminho. Na dúvida entre",
    "dois níveis, escolha o mais baixo — subir cedo frustra, subir com folga motiva.",
    "",
    ...NIVEIS_CRITERIOS.map((c) =>
      c.nivel + " · " + c.nome + " — " + c.capacidade + " (" + c.publico + "). Critérios: " +
      c.criterios.join("; ") + "." + (c.naoExige ? " Ainda não exige: " + c.naoExige : "")
    ),
    "",
    "Baseie-se só no que a ficha mostra. Se a informação for insuficiente para decidir com segurança,",
    "escolha a opção mais conservadora e diga isso na justificativa — nunca arbitre sem base.",
    "",
    "Devolva APENAS um JSON válido, sem texto antes ou depois, sem crases, neste formato:",
    JSON.stringify({ estagio: "V|L|G|A|C", nivel: "Y1..Y6", justificativa: "duas ou três frases, citando o que da ficha sustenta a escolha" }),
    "",
    "FICHA:",
    relatorioFicha(a),
  ].join("\n");
}

function SugestaoClassificacao({ f, set }) {
  const [sugestao, setSugestao] = useState(null);
  const [gerando, setGerando] = useState(false);
  const [erro, setErro] = useState("");

  async function sugerir() {
    setErro(""); setGerando(true); setSugestao(null);
    try {
      let t = (await chamarIA(promptClassificacao(f), 700)).trim();
      t = t.replace(/^```(json)?/i, "").replace(/```$/, "").trim();
      const i = t.indexOf("{");
      if (i > 0) t = t.slice(i);
      const obj = JSON.parse(t);
      if (!ESTAGIOS.some((e) => e.s === obj.estagio)) throw new Error("Estágio sugerido inválido: " + obj.estagio);
      if (!NIVEIS.includes(obj.nivel)) throw new Error("Nível sugerido inválido: " + obj.nivel);
      setSugestao(obj);
    } catch (e) {
      setErro(String(e.message || e));
    }
    setGerando(false);
  }
  function aplicar() {
    if (!sugestao) return;
    set("estagio", sugestao.estagio);
    set("nivel", sugestao.nivel);
  }

  return (
    <div className="mb-4">
      <Botao pequeno variante="vazio" onClick={sugerir} disabled={gerando}>
        {gerando ? "Analisando a ficha…" : "Sugerir estágio e nível com IA"}
      </Botao>
      {erro && <div className="mt-2"><Aviso>{erro}</Aviso></div>}
      {sugestao && (
        <div className="mt-3" style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + C.quadra, padding: "12px 14px" }}>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <Etiqueta cor={C.quadra}>Sugestão da IA</Etiqueta>
            <Etiqueta>{ESTAGIOS.find((e) => e.s === sugestao.estagio)?.n || sugestao.estagio} · {sugestao.nivel}</Etiqueta>
          </div>
          <p style={{ ...prosa, fontSize: 13, color: C.grafite, marginBottom: 10 }}>{sugestao.justificativa}</p>
          <div className="flex gap-2 items-center">
            <Botao pequeno onClick={aplicar}
              disabled={f.estagio === sugestao.estagio && f.nivel === sugestao.nivel}>
              {f.estagio === sugestao.estagio && f.nivel === sugestao.nivel ? "✓ aplicada" : "Aplicar sugestão"}
            </Botao>
            <Botao pequeno variante="vazio" onClick={() => setSugestao(null)}>Descartar</Botao>
          </div>
          <p style={{ ...prosa, fontSize: 11.5, color: C.grafite, marginTop: 8 }}>
            Rascunho da IA. O estágio e o nível continuam editáveis logo acima — o plano de treino é
            sempre montado a partir do que estiver selecionado ali, não desta sugestão.
          </p>
        </div>
      )}
    </div>
  );
}

/* Controle de edição: o coordenador edita qualquer um; um treinador
   comum só edita quem é dele (ou quem ainda não tem dono — pra não
   travar um jogador recém-criado antes de atribuir professor). Isto é
   um portão de UI, no mesmo nível dos outros checks de papelAtual já
   usados no app — não é imposto pelas regras do Firestore. */
function podeEditarAluno(aluno, papelAtual, uidAtual) {
  if (papelAtual === "coordenador" || !uidAtual) return true;
  return !aluno.professorUid || aluno.professorUid === uidAtual;
}
function podeEditarTurma(turma, papelAtual, uidAtual) {
  if (papelAtual === "coordenador" || !uidAtual) return true;
  return !turma.professorUid || turma.professorUid === uidAtual || turma.professorAuxiliarUid === uidAtual;
}

function TelaFicha({ aluno, salvar, papelAtual, uidAtual }) {
  const podeEditar = podeEditarAluno(aluno, papelAtual, uidAtual);
  const [f, setF] = useState(aluno);
  /* Jogador sem nome ainda é ficha nova — abre direto pra edição. Uma
     ficha já preenchida abre fechada, só o resumo: reabrir pra editar
     é uma ação deliberada, não o padrão — o que alimenta o plano daqui
     pra frente são os relatórios das aulas, não reedições da ficha. */
  const [editando, setEditando] = useState(!aluno.nome);
  useEffect(() => { setF(aluno); setEditando(!aluno.nome); }, [aluno.id]);
  const [salvo, setSalvo] = useState(false);
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const setCamada = (k, v) => setF((x) => ({ ...x, camadas: { ...x.camadas, [k]: v } }));
  const ent = (k) => (f.entrada || {})[k] || "";
  const setEnt = (k, v) => setF((x) => ({ ...x, entrada: { ...(x.entrada || {}), [k]: v } }));
  const avaliacaoGolpe = (g) => (f.avaliacaoTecnica || {})[g] || {};
  const setAvaliacaoGolpe = (g, v) => setF((x) => ({ ...x, avaliacaoTecnica: { ...(x.avaliacaoTecnica || {}), [g]: v } }));
  const [professores, setProfessores] = useState([]);
  useEffect(() => { listaProfessores().then(setProfessores); }, []);
  const [sugestaoAuto, setSugestaoAuto] = useState(null);
  const [sugerindoAuto, setSugerindoAuto] = useState(false);

  /* Toda edição de ficha fica com carimbo de hora — é o que permite ao
     Plano saber que a ficha mudou depois que ele foi gerado, e oferecer
     revisão a partir das aulas que ainda faltam (ver TelaPlano).

     A sugestão automática de estágio/nível dispara uma vez só, no
     primeiro save em que a camada técnica já está preenchida — nunca de
     novo depois disso (cada disparo é uma chamada de IA, e não faz
     sentido repetir isso a cada edição de ficha). O botão manual
     "Sugerir estágio e nível com IA" continua disponível pra pedir de
     novo a qualquer momento. */
  async function salvarEFechar() {
    const dados = { ...f, fichaAtualizadaEm: new Date().toISOString() };
    const primeiraClassificacao = !aluno.classificacaoSugeridaEm && (f.camadas.tecnico || "").trim().length > 0;
    if (primeiraClassificacao) dados.classificacaoSugeridaEm = dados.fichaAtualizadaEm;
    salvar(dados);
    setEditando(false);
    setSalvo(true);
    // a ficha de edição é longa; sem isto o resumo (bem mais curto) troca
    // de tela na posição de rolagem em que o treinador estava, e o aviso
    // "ficha salva" — que fica no topo — nunca chega a ser visto.
    window.scrollTo({ top: 0, behavior: "smooth" });
    setTimeout(() => setSalvo(false), 4000);

    if (primeiraClassificacao) {
      setSugerindoAuto(true);
      try {
        let t = (await chamarIA(promptClassificacao(dados), 700)).trim();
        t = t.replace(/^```(json)?/i, "").replace(/```$/, "").trim();
        const i = t.indexOf("{");
        if (i > 0) t = t.slice(i);
        const obj = JSON.parse(t);
        if (ESTAGIOS.some((e) => e.s === obj.estagio) && NIVEIS.includes(obj.nivel)) setSugestaoAuto(obj);
      } catch (e) {
        // silencioso — é uma sugestão automática de bônus; um erro de IA aqui não pode travar nem assustar quem só queria salvar a ficha.
      }
      setSugerindoAuto(false);
    }
  }
  function aplicarSugestaoAuto() {
    if (!sugestaoAuto) return;
    // A ficha já fechou pra edição quando esta sugestão aparece (mora no
    // resumo, não no formulário) — mas o rascunho local `f` continua
    // vivo no componente e reabre junto se o treinador clicar em "Editar
    // ficha" de novo. Sem sincronizar `f` aqui, reabrir e salvar sem
    // mexer em nada reverteria estágio/nível pro valor antigo do rascunho.
    const atualizado = { ...aluno, estagio: sugestaoAuto.estagio, nivel: sugestaoAuto.nivel, fichaAtualizadaEm: new Date().toISOString() };
    salvar(atualizado);
    setF(atualizado);
    setSugestaoAuto(null);
  }
  function escolherProfessor(uid) {
    const p = professores.find((x) => x.uid === uid);
    setF((x) => ({ ...x, professorUid: uid, professorNome: p ? p.nome : "" }));
  }

  const camadaPreenchida = (k) => f.camadas[k].trim().length > 0;
  const liberada = { tecnico: true, fisico: camadaPreenchida("tecnico"), tatico: camadaPreenchida("fisico"), mental: camadaPreenchida("tatico") };

  /* Todos os hooks do componente ficam acima desta linha — o early
     return abaixo (ficha fechada, só resumo) precisa vir depois de
     todos eles, senão a ordem dos hooks muda entre o modo resumo e o
     modo edição e o React quebra. */
  const alertaMental = useMemo(() => {
    const t = (f.camadas.mental + " " + f.camadas.tatico).toLowerCase();
    const gatilhos = ["insegur", "nervos", "medo", "falta de agressividade", "cabeça", "mole", "trava", "ansios"];
    return gatilhos.some((g) => t.includes(g)) && f.camadas.tecnico.trim().length < 30;
  }, [f.camadas]);

  if (!editando) {
    return <ResumoFicha aluno={aluno} aoEditar={() => setEditando(true)} salvo={salvo} papelAtual={papelAtual} podeEditar={podeEditar}
      sugerindoAuto={sugerindoAuto} sugestaoAuto={sugestaoAuto} aplicarSugestaoAuto={aplicarSugestaoAuto} descartarSugestaoAuto={() => setSugestaoAuto(null)} />;
  }
  if (!podeEditar) return <ResumoFicha aluno={aluno} aoEditar={() => {}} salvo={salvo} papelAtual={papelAtual} podeEditar={false} />;

  function mudaLista(campo, i, chave, valor) {
    setF((x) => {
      const l = [...x[campo]];
      l[i] = { ...l[i], [chave]: valor };
      return { ...x, [campo]: l };
    });
  }
  const addLista = (campo, vazio) => setF((x) => ({ ...x, [campo]: [...x[campo], vazio] }));
  const tiraLista = (campo, i) => setF((x) => ({ ...x, [campo]: x[campo].filter((_, k) => k !== i) }));

  function mover(i, passo) {
    setF((x) => {
      const l = [...x.prioridades];
      const j = i + passo;
      if (j < 0 || j >= l.length) return x;
      [l[i], l[j]] = [l[j], l[i]];
      return { ...x, prioridades: l };
    });
  }

  return (
    <div>
      <Secao titulo="Classificação inicial" nota="Antes de tudo: é criança, adulto ou juvenil/adulto de competição? Isso decide o catálogo de exercícios e a trilha de progressão usados no resto da ficha.">
        <Campo rotulo="Estágio">
          <Seletor opcoes={ESTAGIOS.map((e) => ({ v: e.s, r: e.n }))} valor={f.estagio} aoMudar={(v) => set("estagio", v)} />
        </Campo>
        <Etiqueta cor={C.grafite}>{faseDoEstagio(f.estagio)}</Etiqueta>
      </Secao>

      <Secao titulo="Identificação" nota="F-01 do manual: a ficha de avaliação inicial.">
        <Campo rotulo="Nome"><input style={entrada} value={f.nome} onChange={(e) => set("nome", e.target.value)} placeholder="Nome do jogador ou da turma" /></Campo>
        {professores.length > 0 && (
          <Campo rotulo="Professor responsável" nota="Define de qual dashboard este jogador aparece por padrão.">
            <Seletor opcoes={[{ v: "", r: "Sem professor definido" }, ...professores.map((p) => ({ v: p.uid, r: p.nome }))]}
              valor={f.professorUid || ""} aoMudar={escolherProfessor} />
          </Campo>
        )}
        <Campo rotulo="Horário fixo de treino" nota="Alimenta a Grade de horário e a Agenda semanal.">
          <EditorHorarios horarios={f.horarios || []} setHorarios={(h) => set("horarios", h)} />
        </Campo>
        <div className="grid grid-cols-2 gap-3">
          <Campo rotulo="Nascimento"><input type="date" style={entrada} value={f.nascimento} onChange={(e) => set("nascimento", e.target.value)} /></Campo>
          <Campo rotulo="Altura atual / projeção">
            <div className="flex gap-2">
              <input style={entrada} value={f.alturaAtual} onChange={(e) => set("alturaAtual", e.target.value)} placeholder="1,78" />
              <input style={entrada} value={f.projecaoAltura} onChange={(e) => set("projecaoAltura", e.target.value)} placeholder="1,88" />
            </div>
          </Campo>
        </div>
        <Campo rotulo="Lateralidade"><Seletor opcoes={[{ v: "destro", r: "Destro" }, { v: "canhoto", r: "Canhoto" }]} valor={f.lateralidade} aoMudar={(v) => set("lateralidade", v)} /></Campo>
        <Campo rotulo="Backhand"><Seletor opcoes={[{ v: "duas", r: "Duas mãos" }, { v: "uma", r: "Uma mão" }]} valor={f.backhand} aoMudar={(v) => set("backhand", v)} /></Campo>
        <Campo rotulo="Composição física" nota="O tipo de treino se define pelo tipo físico (D-02).">
          <Seletor opcoes={[{ v: "leve", r: "Leve" }, { v: "medio", r: "Médio" }, { v: "forte", r: "Forte" }]} valor={f.tipoFisico} aoMudar={(v) => set("tipoFisico", v)} />
        </Campo>
        <Campo rotulo="Histórico de atividades na infância" nota="Define quanto o bloco de base motora pesa. Trabalho geral igual para todos significa que o diagnóstico não foi feito.">
          <Seletor opcoes={[{ v: "pobre", r: "Pouca variedade" }, { v: "media", r: "Média" }, { v: "rica", r: "Muitos esportes" }]} valor={f.baseMotora} aoMudar={(v) => set("baseMotora", v)} />
        </Campo>
        <Campo rotulo="Tempo treinando" nota="Calibra expectativa: um adulto motivado com 3 meses de quadra não lê igual a um com 3 anos platôs.">
          <Seletor opcoes={[{ v: "novo", r: "Menos de 6 meses" }, { v: "intermediario", r: "6 meses a 2 anos" }, { v: "experiente", r: "Mais de 2 anos" }]}
            valor={f.tempoTreinando} aoMudar={(v) => set("tempoTreinando", v)} />
        </Campo>
        {f.estagio !== "A" ? (
          <Campo rotulo="Contexto familiar e do jogador" nota="Convívio, expectativas, suporte, pressão, relação com o erro e com o esforço.">
            <textarea rows={3} style={{ ...entrada, resize: "vertical" }} value={f.contexto} onChange={(e) => set("contexto", e.target.value)} />
          </Campo>
        ) : (
          <>
            <Campo rotulo="Disposição do aluno adulto" nota="Não é o objetivo dele (isso vem em Perfil de jogo) — é quem ele é na quadra: o que motiva, o que desmotiva.">
              <Seletor opcoes={DISPOSICOES_ADULTO.map((d) => ({ v: d.v, r: d.r }))} valor={f.disposicaoAdulto} aoMudar={(v) => set("disposicaoAdulto", v)} />
            </Campo>
            {f.disposicaoAdulto && <p style={{ ...prosa, color: C.grafite, fontSize: 13, marginTop: -6, marginBottom: 14 }}>{DISPOSICOES_ADULTO.find((d) => d.v === f.disposicaoAdulto).d}</p>}
            <Campo rotulo="Comportamento em quadra" nota="Humor, comunicação, paciência com o próprio erro, se é comunicativo ou fechado — substitui o contexto familiar no adulto: aqui o que importa é a pessoa que está treinando, não a criação dela.">
              <textarea rows={3} style={{ ...entrada, resize: "vertical" }} value={f.comportamentoAdulto} onChange={(e) => set("comportamentoAdulto", e.target.value)} />
            </Campo>
          </>
        )}
      </Secao>

      <Secao titulo="Diagnóstico — as quatro camadas" nota="A ordem é técnico, físico, tático, mental, e não pode ser invertida (D-01). Cada camada abre a seguinte.">
        {[["tecnico", "1 · Técnico", "Bases de apoio, golpes por fase, trocas de golpe e de empunhadura"],
          ["fisico", "2 · Físico", "Capacidades associadas às qualidades técnicas"],
          ["tatico", "3 · Tático", "Repertório de decisões disponível, lido à luz das camadas 1 e 2"],
          ["mental", "4 · Mental", "Observações à luz de tudo o que já foi observado"]].map(([k, rot, dica]) => (
          <div key={k} className="mb-4" style={{ opacity: liberada[k] ? 1 : 0.45 }}>
            <div className="mb-2"><Etiqueta cor={liberada[k] ? C.tinta : C.grafite}>{rot}</Etiqueta></div>
            <textarea rows={3} disabled={!liberada[k]} placeholder={liberada[k] ? dica : "Preencha a camada anterior primeiro"}
              style={{ ...entrada, resize: "vertical", background: liberada[k] ? C.cal : C.papel }}
              value={f.camadas[k]} onChange={(e) => setCamada(k, e.target.value)} />
          </div>
        ))}
        {alertaMental && (
          <Aviso>
            Há leitura de estado com pouca evidência técnica registrada. Antes de nomear isso como
            cabeça, verifique se existe ferramenta técnica para a jogada e em que bola da sequência o
            erro acontece. Muito do que parece insegurança é uma base que não sustenta o golpe.
          </Aviso>
        )}
      </Secao>

      <Secao titulo="Perfil de jogo" nota="Parte 6 do manual: o jogo nasce do corpo e do temperamento do jogador — não se escolhe, se reconhece.">
        <Campo rotulo="Perfil de corpo">
          <Seletor opcoes={PERFIS_CORPO.map((p) => ({ v: p.v, r: p.r }))} valor={f.perfilCorpo} aoMudar={(v) => set("perfilCorpo", v)} />
        </Campo>
        {f.perfilCorpo && <p style={{ ...prosa, color: C.grafite, fontSize: 13, marginTop: -6, marginBottom: 14 }}>{PERFIS_CORPO.find((p) => p.v === f.perfilCorpo).d}</p>}
        <Campo rotulo="Temperamento">
          <Seletor opcoes={PERFIS_TEMPERAMENTO.map((p) => ({ v: p.v, r: p.r }))} valor={f.perfilTemperamento} aoMudar={(v) => set("perfilTemperamento", v)} />
        </Campo>
        {f.perfilTemperamento && <p style={{ ...prosa, color: C.grafite, fontSize: 13, marginTop: -6, marginBottom: f.estagio === "A" ? 14 : 0 }}>{PERFIS_TEMPERAMENTO.find((p) => p.v === f.perfilTemperamento).d}</p>}
        {f.estagio === "A" && (
          <>
            <Campo rotulo="Objetivo" nota="Muda o que entra na aula — nunca sobrescreve o temperamento dele acima.">
              <Seletor opcoes={OBJETIVOS_ADULTO.map((o) => ({ v: o.v, r: o.r }))} valor={f.objetivoAdulto} aoMudar={(v) => set("objetivoAdulto", v)} />
            </Campo>
            {f.objetivoAdulto && <p style={{ ...prosa, color: C.grafite, fontSize: 13, marginTop: -6 }}>{OBJETIVOS_ADULTO.find((o) => o.v === f.objetivoAdulto).d}</p>}
          </>
        )}
        <Campo rotulo="Dificuldade de consistência" nota="Erra demais pra sustentar a troca de bolas — não é sobre risco tático, é sobre não conseguir manter o ponto vivo. Mais comum e mais decisivo no adulto, mas vale para qualquer estágio.">
          <Seletor opcoes={[{ v: false, r: "Não" }, { v: true, r: "Sim" }]} valor={f.dificuldadeConsistencia} aoMudar={(v) => set("dificuldadeConsistencia", v)} />
        </Campo>
      </Secao>

      <Secao titulo="Ficha de entrada" nota="Preencha na ordem dos blocos — ela segue o protocolo do método. Onde não souber, marque 'não sei': campo honesto vira item de observação; campo chutado vira erro de diagnóstico.">
        <div className="mb-5">
          <div className="mb-2"><Etiqueta cor={C.tinta}>1 · Técnico, golpe a golpe</Etiqueta></div>
          <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginBottom: 10 }}>
            "Erra o backhand" diz pouco. "Erra o backhand quando a bola vem alta e ele está
            recuando" diz quase tudo.
          </p>
          {GOLPES_ENTRADA.map((g) => (
            <div key={g} style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + C.saibro, padding: "11px 13px", marginBottom: 9 }}>
              <div style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700, marginBottom: 8 }}>{g}</div>
              <CampoEntrada rotulo="Funciona" valor={ent("g_" + g + "_ok")} aoMudar={(v) => setEnt("g_" + g + "_ok", v)} />
              <CampoEntrada rotulo="Falha quando" valor={ent("g_" + g + "_falha")} aoMudar={(v) => setEnt("g_" + g + "_falha", v)} />
              <FasesGolpe golpe={g} avaliacao={avaliacaoGolpe(g)} aoMudar={(v) => setAvaliacaoGolpe(g, v)} />
            </div>
          ))}
        </div>

        {ENTRADA_BLOCOS.map((b) => (
          <div key={b.n} className="mb-5">
            <div className="mb-2"><Etiqueta cor={C.tinta}>{b.n} · {b.t}</Etiqueta></div>
            <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginBottom: 10 }}>{b.nota}</p>
            {b.campos.map(([k, rot]) => (
              <CampoEntrada key={k} rotulo={rot} valor={ent(k)} aoMudar={(v) => setEnt(k, v)} />
            ))}
          </div>
        ))}
      </Secao>

      <Secao titulo="Prioridades" nota="A ordem define os ciclos de estímulo do macro e a proporção do volume tático. Arraste pelas setas.">
        {f.prioridades.map((p, i) => (
          <div key={p} className="flex items-center gap-3 mb-2" style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + (i < 2 ? C.saibro : C.linha), padding: "9px 12px" }}>
            <span style={{ fontFamily: ARCH, fontWeight: 700, fontSize: 13, color: i < 2 ? C.saibro : C.grafite, width: 18 }}>{LETRAS[i]}</span>
            <span style={{ ...prosa, flex: 1 }}>{AREAS[p].nome}</span>
            <button onClick={() => mover(i, -1)} style={iconeEstilo}>↑</button>
            <button onClick={() => mover(i, 1)} style={iconeEstilo}>↓</button>
          </div>
        ))}
        <Campo rotulo="Arma(s) do jogador" nota="O que já funciona entra como manutenção, não some do plano. Pode marcar mais de uma.">
          <SeletorMulti opcoes={AREA_OPCOES.map((a) => ({ v: a.id, r: a.nome }))} valor={armasDoJogador(f)} aoMudar={(v) => set("armas", v)} />
        </Campo>
      </Secao>

      <Secao titulo="Horizonte" nota="Planejamento do fim para o começo: o objetivo distante é a bússola de tudo o que vem antes.">
        <Campo rotulo="Objetivo final">
          <input style={entrada} value={f.objetivoFinal} onChange={(e) => set("objetivoFinal", e.target.value)} placeholder="Ex.: os 4 Grand Slams juvenis em 2028" />
        </Campo>
        {f.marcos.map((m, i) => (
          <div key={i} className="mb-2 grid grid-cols-12 gap-2">
            <input style={{ ...entrada, gridColumn: "span 3" }} value={m.ano} onChange={(e) => mudaLista("marcos", i, "ano", e.target.value)} placeholder="Ano" />
            <input style={{ ...entrada, gridColumn: "span 8" }} value={m.marco} onChange={(e) => mudaLista("marcos", i, "marco", e.target.value)} placeholder="Marco intermediário" />
            <button onClick={() => tiraLista("marcos", i)} style={{ ...iconeEstilo, gridColumn: "span 1" }}>×</button>
            <input style={{ ...entrada, gridColumn: "span 12" }} value={m.precisa} onChange={(e) => mudaLista("marcos", i, "precisa", e.target.value)} placeholder="O que precisa estar pronto" />
          </div>
        ))}
        <Botao pequeno variante="vazio" onClick={() => addLista("marcos", { ano: "", marco: "", precisa: "" })}>+ Marco</Botao>
      </Secao>

      <Secao titulo="Calendário e rotina" nota="As datas de competição desenham as fases sozinhas.">
        <div className="grid grid-cols-2 gap-3">
          <Campo rotulo="Início do ciclo"><input type="date" style={entrada} value={f.inicio} onChange={(e) => set("inicio", e.target.value)} /></Campo>
          <Campo rotulo="Semanas"><input type="number" min={4} max={52} style={entrada} value={f.semanas} onChange={(e) => set("semanas", Number(e.target.value))} /></Campo>
        </div>
        <Campo rotulo="Competições">
          {f.competicoes.map((c, i) => (
            <div key={i} className="flex gap-2 mb-2">
              <input style={entrada} value={c.nome} onChange={(e) => mudaLista("competicoes", i, "nome", e.target.value)} placeholder="Nome do torneio" />
              <input type="date" style={{ ...entrada, maxWidth: 160 }} value={c.data} onChange={(e) => mudaLista("competicoes", i, "data", e.target.value)} />
              <button onClick={() => tiraLista("competicoes", i)} style={iconeEstilo}>×</button>
            </div>
          ))}
          <Botao pequeno variante="vazio" onClick={() => addLista("competicoes", { nome: "", data: "" })}>+ Competição</Botao>
        </Campo>
        <Campo rotulo="Dias de quadra por semana"><Seletor opcoes={[3, 4, 5, 6].map((d) => ({ v: d, r: d + " dias" }))} valor={f.diasQuadra} aoMudar={(v) => set("diasQuadra", v)} /></Campo>
        <Campo rotulo="Períodos por dia"><Seletor opcoes={[{ v: 1, r: "Um" }, { v: 2, r: "Dois" }]} valor={f.periodos} aoMudar={(v) => set("periodos", v)} /></Campo>
        <Campo rotulo="Escola"><Seletor opcoes={[{ v: "manha", r: "Manhã" }, { v: "tarde", r: "Tarde" }, { v: "noite", r: "Noite" }, { v: "nao", r: "Não estuda" }]} valor={f.escola} aoMudar={(v) => set("escola", v)} /></Campo>
        <Campo rotulo="Musculação por semana"><Seletor opcoes={[0, 1, 2, 3].map((n) => ({ v: n, r: String(n) }))} valor={f.musculacao} aoMudar={(v) => set("musculacao", v)} /></Campo>
      </Secao>

      <Secao titulo="Nível e trilha de progressão" nota="O estágio já foi definido no topo da ficha. Com o diagnóstico acima preenchido, a sugestão de nível vem dos dados coletados — e a trilha abaixo mostra visualmente onde o jogador está, o que já passou e o caminho até o teto deste estágio.">
        <Campo rotulo="Nível"><Seletor opcoes={NIVEIS.map((n) => ({ v: n, r: n }))} valor={f.nivel} aoMudar={(v) => set("nivel", v)} /></Campo>
        <TrilhaVisual estagio={f.estagio} categoria={f.categoria} criteriosClassificacao={f.criteriosClassificacao} />
        <TrilhaClassificacao f={f} set={set} />
        <SugestaoClassificacao f={f} set={set} />
        <LegendaNiveis nivelInicial={f.nivel} />
      </Secao>

      <div className="flex items-center gap-2">
        <Botao onClick={salvarEFechar} variante="saibro">Salvar ficha</Botao>
        {aluno.nome && <Botao variante="vazio" onClick={() => setEditando(false)}>Cancelar</Botao>}
      </div>
    </div>
  );
}

/* Ficha já preenchida: fica fechada, só um resumo do que já foi
   observado — reabrir pra editar é deliberado, não o padrão. O que
   mantém o plano atualizado daqui pra frente são os relatórios das
   aulas (Sessão e fechamento de ciclo do Plano), não reedições daqui. */
function ResumoFicha({ aluno: a, aoEditar, salvo, papelAtual, podeEditar = true, sugerindoAuto, sugestaoAuto, aplicarSugestaoAuto, descartarSugestaoAuto }) {
  const camadasRot = [["tecnico", "Técnico"], ["fisico", "Físico"], ["tatico", "Tático"], ["mental", "Mental"]];
  const temCamada = camadasRot.some(([k]) => (a.camadas[k] || "").trim());
  const corpo = PERFIS_CORPO.find((p) => p.v === a.perfilCorpo);
  const temperamento = PERFIS_TEMPERAMENTO.find((p) => p.v === a.perfilTemperamento);
  const objetivoAdulto = OBJETIVOS_ADULTO.find((o) => o.v === a.objetivoAdulto);
  const disposicaoAdulto = DISPOSICOES_ADULTO.find((d) => d.v === a.disposicaoAdulto);

  return (
    <div>
      {salvo && (
        <div className="mb-4" style={{ background: C.quadra, padding: "9px 13px" }}>
          <Etiqueta cor="#fff">✓ ficha salva</Etiqueta>
        </div>
      )}

      <div className="flex items-start justify-between gap-3 flex-wrap mb-6">
        <div>
          <Etiqueta>{faseDoEstagio(a.estagio)} · nível {a.nivel}</Etiqueta>
          <p style={{ ...prosa, fontSize: 13.5, color: C.grafite, marginTop: 4 }}>
            {a.professorNome ? "Prof. " + a.professorNome + " · " : ""}
            {(a.horarios || []).length ? a.horarios.map((h) => nomeDia(h.dia) + " " + h.hora).join(", ") : "sem horário fixo definido"}
          </p>
        </div>
        {podeEditar
          ? <Botao pequeno variante="vazio" onClick={aoEditar}>Editar ficha</Botao>
          : <Etiqueta cor={C.grafite}>Ficha de outro treinador · somente leitura</Etiqueta>}
      </div>
      {!podeEditar && (
        <Aviso>Este jogador é de outro treinador — a ficha fica travada pra edição. Só o professor responsável ou o coordenador podem editá-la.</Aviso>
      )}

      {sugerindoAuto && (
        <div className="mb-5" style={{ background: C.cal, border: "1px solid " + C.linha, padding: "12px 14px" }}>
          <Etiqueta cor={C.grafite}>Analisando a ficha pra sugerir o nível…</Etiqueta>
        </div>
      )}
      {sugestaoAuto && (
        <div className="mb-5" style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + C.quadra, padding: "12px 14px" }}>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <Etiqueta cor={C.quadra}>Sugestão automática da IA</Etiqueta>
            <Etiqueta>{ESTAGIOS.find((e) => e.s === sugestaoAuto.estagio)?.n || sugestaoAuto.estagio} · {sugestaoAuto.nivel}</Etiqueta>
          </div>
          <p style={{ ...prosa, fontSize: 13, color: C.grafite, marginBottom: 10 }}>{sugestaoAuto.justificativa}</p>
          <div className="flex gap-2">
            <Botao pequeno onClick={aplicarSugestaoAuto}>Aplicar sugestão</Botao>
            <Botao pequeno variante="vazio" onClick={descartarSugestaoAuto}>Descartar</Botao>
          </div>
        </div>
      )}

      <Secao titulo="Diagnóstico">
        {temCamada ? camadasRot.map(([k, rot]) => (a.camadas[k] || "").trim() && <Linha key={k} rotulo={rot} texto={a.camadas[k]} />)
          : <p style={{ ...prosa, color: C.grafite }}>Diagnóstico ainda não preenchido.</p>}
      </Secao>

      <Secao titulo="Perfil de jogo">
        {corpo && <Linha rotulo="Corpo" texto={corpo.r} />}
        {temperamento && <Linha rotulo="Temperamento" texto={temperamento.r} />}
        {a.estagio === "A" && objetivoAdulto && <Linha rotulo="Objetivo" texto={objetivoAdulto.r} />}
        {a.estagio === "A" && disposicaoAdulto && <Linha rotulo="Disposição" texto={disposicaoAdulto.r} />}
        {a.dificuldadeConsistencia && <Linha rotulo="Consistência" texto="Dificuldade marcada — erra demais pra sustentar a troca de bolas." />}
        {!corpo && !temperamento && !(a.estagio === "A" && objetivoAdulto) && !(a.estagio === "A" && disposicaoAdulto) && !a.dificuldadeConsistencia &&
          <p style={{ ...prosa, color: C.grafite }}>Perfil de jogo ainda não definido.</p>}
      </Secao>

      <Secao titulo="Prioridades">
        <p style={prosa}>{a.prioridades.map((p) => AREAS[p].nome).join(" → ")}</p>
      </Secao>

      <Secao titulo="Horizonte">
        {a.objetivoFinal ? <Linha rotulo="Objetivo" texto={a.objetivoFinal} /> : <p style={{ ...prosa, color: C.grafite }}>Sem objetivo final definido.</p>}
      </Secao>

      <Secao titulo="Calendário">
        <p style={prosa}>
          {a.inicio ? "Início " + a.inicio : "sem data de início"} · {a.semanas} semanas · {a.diasQuadra} dias de quadra por semana · {a.periodos >= 2 ? "dois turnos por dia" : "um turno por dia"}
        </p>
      </Secao>

      {papelAtual === "coordenador" && (a.feedbacksAluno || []).length > 0 && (
        <Secao titulo="Feedback do aluno" nota="Enviado pelo próprio aluno, pelo link dele — só o coordenador vê este campo, o treinador não.">
          {a.feedbacksAluno.map((f) => (
            <div key={f.id} style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid #C9A227", padding: "10px 13px", marginBottom: 7 }}>
              <Etiqueta>{new Date(f.data).toLocaleDateString("pt-BR")}</Etiqueta>
              <p style={{ ...prosa, fontSize: 13.5, marginTop: 4 }}>{f.texto}</p>
            </div>
          ))}
        </Secao>
      )}

      {podeEditar && <Botao variante="vazio" onClick={aoEditar}>Editar ficha</Botao>}
    </div>
  );
}

/* ─────────────────────────── periodização ─────────────────────────── */
function exportaMarkdown(a, fases, grupos, ciclos, prop, grade) {
  const L = [];
  L.push(`# Planejamento e periodização — ${a.nome || "sem nome"}`);
  L.push(`\n${a.semanas} semanas · início ${a.inicio || "—"} · estágio ${a.estagio} · nível ${a.nivel}\n`);
  if (a.objetivoFinal) L.push(`**Objetivo final:** ${a.objetivoFinal}\n`);
  L.push("## Visão geral: do fim para o começo\n");
  L.push("| Horizonte | Marco | O que precisa estar pronto |");
  L.push("|---|---|---|");
  a.marcos.filter((m) => m.marco).forEach((m) => L.push(`| ${m.ano} | ${m.marco} | ${m.precisa} |`));
  L.push(`| Este documento | Periodização de ${a.semanas} semanas | ${grupos.length} blocos |\n`);
  L.push("## Os blocos do ciclo\n");
  L.push("| Semanas | Fase | Função |");
  L.push("|---|---|---|");
  grupos.forEach((g) => L.push(`| ${g.ini === g.fim ? g.ini : g.ini + "–" + g.fim} | ${g.fase}${g.eventos.length ? " · " + g.eventos.join(", ") : ""} | ${FUNCAO_FASE[g.fase] || ""} |`));
  L.push("\n## Semana-padrão dos mesociclos de base\n");
  L.push("| Horário | " + grade.dias.join(" | ") + " |");
  L.push("|" + "---|".repeat(grade.dias.length + 1));
  grade.faixas.forEach((fx) => L.push("| " + fx.hora + " | " + fx.conteudo.join(" | ") + " |"));
  L.push(`\n## A proporção tática\n\n${prop.abertura}% do volume tático nos padrões de abertura, ${prop.media}% nas trocas médias, ${prop.defesa}% na defesa longa.\n`);
  L.push("## Os ciclos de estímulo\n");
  L.push("Regra: cada estímulo mantido por 3 treinos; rotação parcial ao fim de cada mesociclo — nunca os dois estímulos de um ciclo ao mesmo tempo.\n");
  L.push("| Ciclo | Estímulo 1 | Estímulo 2 | Exercícios-chave |");
  L.push("|---|---|---|---|");
  ciclos.forEach((c) => L.push(`| ${c.letra} — ${c.nome} | ${c.estimulos[0]} | ${c.estimulos[1]} | ${c.exercicios.map((e) => e.c).join(" · ")} |`));
  L.push("\n## Critérios tangíveis de avaliação\n");
  ciclos.forEach((c) => {
    L.push(`\n### ${AREAS[c.areaId].nome}\n`);
    L.push("| Métrica | Como medir | Base | Meta |");
    L.push("|---|---|---|---|");
    AREAS[c.areaId].metricas.forEach((m) => L.push(`| ${m[0]} | ${m[1]} | medir na semana 1 | ${m[2]} |`));
  });
  L.push("\n---\n");
  L.push("O número orienta a direção; o olhar decide o dia. Nenhum tenista é um robô.");
  return L.join("\n");
}

function TelaPeriodizacao({ aluno }) {
  const pronto = aluno.inicio && aluno.semanas >= 4;
  const fases = useMemo(() => (pronto ? montaFases(aluno) : []), [aluno]);
  const grupos = useMemo(() => agrupaFases(fases), [fases]);
  const ciclos = useMemo(() => montaCiclos(aluno.prioridades, aluno.estagio), [aluno]);
  const prop = proporcaoTatica(aluno.prioridades);
  const grade = montaGrade(aluno);

  if (!pronto)
    return <Aviso>Defina a data de início e o número de semanas na ficha para desenhar as fases.</Aviso>;

  const dados = fases.map((s) => ({
    n: s.n, rotulo: "S" + s.n,
    volume: PERFIL_FASE[s.fase]?.vol ?? 60,
    intensidade: PERFIL_FASE[s.fase]?.int ?? 50,
    fase: s.fase,
  }));

  function baixar() {
    const md = exportaMarkdown(aluno, fases, grupos, ciclos, prop, grade);
    const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `periodizacao-${(aluno.nome || "jogador").toLowerCase().replace(/\s+/g, "-")}.md`;
    a.click();
    URL.revokeObjectURL(url);
  }

  return (
    <div>
      <Secao titulo="O ciclo em uma imagem" nota="O volume sobe nos mesociclos de base e cai nas semanas de afinação e torneio; a intensidade faz o caminho oposto e chega ao pico exatamente na competição. Nenhuma semana combina volume máximo com intensidade máxima — é essa separação que protege o corpo.">
        <div style={{ height: 210, marginLeft: -18 }}>
          <ResponsiveContainer width="100%" height="100%">
            <ComposedChart data={dados}>
              {grupos.map((g, i) => (
                <ReferenceArea key={i} x1={"S" + g.ini} x2={"S" + g.fim}
                  fill={PERFIL_FASE[g.fase]?.cor || C.grafite} fillOpacity={0.07} />
              ))}
              <XAxis dataKey="rotulo" tick={{ fontSize: 9, fontFamily: ARCH, fill: C.grafite }} interval={0} />
              <YAxis tick={{ fontSize: 9, fontFamily: ARCH, fill: C.grafite }} width={28} />
              <Tooltip contentStyle={{ fontFamily: ARCH, fontSize: 12, borderRadius: 2, border: "1px solid " + C.linha }}
                formatter={(v, n) => [v, n === "volume" ? "Volume" : "Intensidade"]} />
              <Area type="monotone" dataKey="volume" stroke={C.quadra} fill={C.quadra} fillOpacity={0.16} strokeWidth={2} />
              <Line type="monotone" dataKey="intensidade" stroke={C.saibro} strokeWidth={2} dot={false} />
            </ComposedChart>
          </ResponsiveContainer>
        </div>
        <div className="flex gap-4 mt-1">
          <Etiqueta cor={C.quadra}>▬ Volume</Etiqueta>
          <Etiqueta cor={C.saibro}>▬ Intensidade</Etiqueta>
        </div>
      </Secao>

      <Secao titulo="Os blocos do ciclo">
        <Tabela cabecalho={["Semanas", "Fase", "Função"]} larguras={["18%", "26%", "56%"]}
          linhas={grupos.map((g) => [
            <span style={{ fontFamily: ARCH, fontWeight: 700 }}>{g.ini === g.fim ? g.ini : `${g.ini}–${g.fim}`}</span>,
            <span style={{ color: PERFIL_FASE[g.fase]?.cor }}>{g.fase}{g.eventos.length ? ` · ${g.eventos.join(", ")}` : ""}</span>,
            FUNCAO_FASE[g.fase] || "",
          ])} />
      </Secao>

      <Secao titulo="A semana-padrão" nota="Vale nos mesociclos de base. Muda nas semanas de afinação, competição e regeneração.">
        <Tabela cabecalho={["Horário", ...grade.dias]}
          linhas={grade.faixas.map((fx) => [
            <span style={{ fontFamily: ARCH, fontSize: 11, fontWeight: 600 }}>{fx.hora}</span>,
            ...fx.conteudo.map((c) => <span style={{ fontSize: 12.5, color: c === "LIVRE" ? C.grafite : C.tinta }}>{c}</span>),
          ])} larguras={["12%"]} />
        <div className="mt-4">
          <Aviso cor={C.quadra}>
            Duas coisas não mudam em nenhuma semana: domingo é inteiramente livre, porque a
            regeneração é parte do treino e não ausência dele; e os registros do jogador são
            preenchidos ao fim de cada período de quadra, em menos de dois minutos.
          </Aviso>
        </div>
      </Secao>

      <Secao titulo="A proporção tática" nota="Cerca de 70% dos pontos do circuito têm até quatro golpes. O treino espelha isso — e concentra o volume nas duas maiores lacunas.">
        <div className="flex" style={{ height: 42, marginBottom: 10 }}>
          {[["abertura", "Padrões de abertura", C.saibro], ["media", "Trocas médias", C.quadra], ["defesa", "Defesa longa", C.grafite]].map(([k, rot, cor]) => (
            <div key={k} style={{ width: prop[k] + "%", background: cor, color: "#fff", fontFamily: ARCH, fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", borderRight: "2px solid " + C.papel }}>
              {prop[k]}%
            </div>
          ))}
        </div>
        <p style={{ ...prosa, fontSize: 13.5, color: C.grafite }}>
          {prop.abertura}% nos padrões de abertura — saque, devolução e a bola seguinte —,{" "}
          {prop.media}% nas trocas médias onde os games se decidem, {prop.defesa}% na defesa longa. A
          troca longa não é abolida; ela deixa de ocupar o lugar que os dados dão às quatro
          primeiras bolas.
        </p>
      </Secao>

      <Secao titulo="Os ciclos de estímulo" nota="Cada estímulo é mantido por três treinos; a rotação é parcial ao fim de cada mesociclo. Nunca os dois estímulos de um ciclo ao mesmo tempo.">
        {ciclos.map((c) => (
          <div key={c.letra} className="mb-6">
            <div className="flex items-baseline gap-3 mb-2">
              <span style={{ fontFamily: ARCH, fontSize: 22, fontWeight: 700, color: C.saibro }}>{c.letra}</span>
              <h3 style={{ fontFamily: ARCH, fontSize: 15.5, fontWeight: 700, flex: 1 }}>{c.nome}</h3>
              <Etiqueta>{c.volume}% do volume</Etiqueta>
            </div>
            <Tabela cabecalho={["Estímulo 1", "Estímulo 2"]} linhas={[[c.estimulos[0], c.estimulos[1]]]} />
            <div className="mt-3">
              {c.exercicios.map((e) => <CartaoExercicio key={e.c} e={e} />)}
              {!c.exercicios.length && (
                <p style={{ ...prosa, fontSize: 13, color: C.saibro }}>
                  Nenhum exercício do catálogo atende a esta área no estágio {aluno.estagio}.
                </p>
              )}
            </div>
          </div>
        ))}
      </Secao>

      <Secao titulo="Critérios tangíveis de avaliação" nota="Cada critério tem linha de base medida na semana 1 e meta ao fim do primeiro mesociclo. Números são referência de direção, não sentença: a reavaliação é feita com o atleta.">
        {ciclos.map((c) => (

            <h3 style={{ fontFamily: ARCH, fontSize: 14.5, fontWeight: 700, marginBottom: 8 }}>{AREAS[c.areaId].nome}</h3>
            <Tabela cabecalho={["Métrica", "Como medir", "Base", "Meta"]} larguras={["30%", "34%", "14%", "22%"]}
              linhas={AREAS[c.areaId].metricas.map((m) => [m[0], m[1], "medir", <b>{m[2]}</b>])} />

        <p style={{ ...prosa, fontSize: 13.5, color: C.grafite }}>
          <b>Critério de rotação:</b> ao fim da primeira semana de regeneração, o estímulo com metas
          atingidas e consolidadas sai; entra o próximo da fila, definida pelo que a competição
          revelar. Os demais permanecem.
        </p>

      <Secao titulo="Caderno do treinador">
        <p style={{ ...prosa, marginBottom: 10 }}>Antes de entrar na quadra:</p>

          "Global e aquecimento cabem em 20% da sessão?",
          "Que métrica será coletada hoje: posição do erro, bola da atenção ou protocolo"].map((t) => (
          <div key={t} className="flex gap-3 mb-2">
            <span style={{ color: C.grafite }}>□</span>

        <div className="mt-5">
          <Tabela cabecalho={["Situação", "Fazer", "Não fazer"]}
            linhas={[
              ["Erro técnico recorrente", "Perguntar primeiro: o que você sentiu nessa bola? Só depois a instrução direta", "Corrigir de longe com frase vaga"],
              ["Acerto relevante", "Ser específico: terminou o golpe lá no alto, percebeu?", "Boa bola, isso aí, valeu"],
              ["Erro cedo na sequência", "Registrar a posição e não interromper — o dado vale mais que o sermão", "Chamar de erro tático o que é pressa"],

      <Secao titulo="Cartão do jogador" nota="Uma página, impressa e plastificada, na mochila. É o único material que o jogador carrega.">

          <div className="mb-4"><Etiqueta cor={C.saibro}>Protocolo entre pontos</Etiqueta></div>
          {[["Fechei", "o ponto anterior acabou quando acabou; meu gesto de encerrar é sempre o mesmo"],
            ["Respirei", "respiração baixa e lenta voltando à linha de base"],
            ["Decidi", "direção e tipo do saque, ou posição e intenção da devolução, antes do primeiro quique. Decidido não se reabre"],
            ["Executei", "quiques sentidos, não contados"]].map(([t, d], i) => (
            <div key={t} className="flex gap-3 mb-2">
              <span style={{ fontFamily: ARCH, fontWeight: 700, fontSize: 13, color: C.saibro }}>{i + 1}</span>

            </div>
          ))}
          <div className="mt-5 mb-3"><Etiqueta cor={C.saibro}>Minhas regras</Etiqueta></div>
          {["A bola que arma tem alvo de segurança. A bola que converte tem alvo de pressão. Nunca ao contrário",
            "Sustentar não é perder. A bola profunda e sem graça, com atenção total, é a bola que constrói o ponto",
            "Ranking não joga. Quem joga é o corpo do outro lado — e é para ele que eu olho",

      <Aviso>

        engessar o trabalho num planejamento estritamente numérico, sem o olhar do treinador e sem
        perceber a situação do jogador naquela semana, transforma formação em linha de produção.
        Nenhum tenista é um robô. O número orienta a direção; o olhar decide o dia.

      <Botao onClick={baixar} variante="saibro">Baixar plano em Markdown</Botao>

        manual.

  );
}

/* ─────────────────────────── sessão do dia ─────────────────────────── */
const BLOCOS = [
  { id: 1, nome: "Base motora e entrada", familias: ["CO", "CF", "MV"], porque: "Entrada em movimento. Também é o destino da regressão à raiz." },
  { id: 2, nome: "Fundamento do ciclo", familias: ["FB", "DC"], porque: "O fundamento da semana, distribuído — nunca insistido numa sessão só." },
  { id: 3, nome: "Início do ponto", familias: ["IP", "PDS"], porque: "Saque e devolução nunca separados do que vem depois." },
  { id: 4, nome: "Tema do ciclo", familias: null, porque: "O estímulo ativo do ciclo nesta semana." },
  { id: 5, nome: "Jogo aplicado", familias: ["JA", "ADV", "DM"], porque: "A regra existe para forçar o tema, não para premiar a bola dentro." },
];

function fatiaInicio(nivel) {
  const i = NIVEIS.indexOf(nivel);
  return i <= 1 ? 0.25 : i <= 3 ? 0.3 : 0.35;
}

function sorteia(lista, evitar, n) {
  const frescos = lista.filter((e) => !evitar.has(e.c));
  const fonte = frescos.length >= n ? frescos : lista;
  const copia = [...fonte], saida = [];
  while (saida.length < n && copia.length) saida.push(copia.splice(Math.floor(Math.random() * copia.length), 1)[0]);
  return saida;
}

/* Saque e devolução são obrigatoriedades do método, não estilos
   opcionais (ver PRINCIPIOS_MTY) — e a maioria dos pontos, mesmo no
   nível ATP, se decide nos primeiros golpes do ponto. O sorteio
   genérico do bloco "Início do ponto" podia, por azar, cair todo pro
   mesmo lado (dois de saque, nenhum de devolução) ou nem entrar numa
   sessão curta. Esta função garante um exercício de cada, sempre. */
function garanteSaqueEDevolucao(pool, evitar) {
  const deSaque = pool.filter((e) => AREAS.saque.busca.test(e.n + " " + e.m));
  const umSaque = sorteia(deSaque.length ? deSaque : pool, evitar, 1);
  const usados = new Set(umSaque.map((e) => e.c));
  const deDevolucao = pool.filter((e) => !usados.has(e.c) && AREAS.devolucao.busca.test(e.n + " " + e.m));
  const poolDevolucao = deDevolucao.length ? deDevolucao : pool.filter((e) => !usados.has(e.c));
  const umaDevolucao = sorteia(poolDevolucao, evitar, 1);
  return [...umSaque, ...umaDevolucao];
}

/* Até a bola laranja (V e L), o treino tem que ser lúdico — brincadeira
   não é intervalo do treino, é o treino (Play and Stay). O catálogo já
   tem a família BR (brincadeiras) só pra isso; esta função garante que
   toda sessão de um jogador V/L carrega pelo menos uma, em vez de
   depender do sorteio genérico topar com ela por acaso. */
function garanteBrincadeira(exerciciosAtuais, evitar, estagio) {
  if (!["V", "L"].includes(estagio)) return exerciciosAtuais;
  if (exerciciosAtuais.some((e) => e.f === "BR")) return exerciciosAtuais;
  const usados = new Set(exerciciosAtuais.map((e) => e.c));
  const pool = exerciciosParaSorteio().filter((e) => e.f === "BR" && e.e.includes(estagio) && !usados.has(e.c));
  const [brincadeira] = sorteia(pool, evitar, 1);
  return brincadeira ? [...exerciciosAtuais, brincadeira] : exerciciosAtuais;
}

function TelaSessao({ aluno, alunos, setAlunos, setSubaba, papelAtual, uidAtual }) {
  const podeEditar = podeEditarAluno(aluno, papelAtual, uidAtual);
  const [cicloAtivo, setCiclo] = useState(0);
  const [duracao, setDuracao] = useState(90);
  const [plano, setPlano] = useState(null);
  const [divergencias, setDivergencias] = useState([]);
  const [fechando, setFechando] = useState(false);
  const [obs, setObs] = useState({ corrigi: "", ignorei: "", mudaria: "", nota: 3 });
  const [statusAulaPlano, setStatusAulaPlano] = useState("feita");
  const [motivoAulaPlano, setMotivoAulaPlano] = useState("");
  const [personalizados, setPersonalizados] = useState([]);
  const PERSONALIZADO_VAZIO = { n: "", m: "", r: "", p: "", x: "", i: "", d: "" };
  const [novoPersonalizado, setNovoPersonalizado] = useState(PERSONALIZADO_VAZIO);
  const [chuvaMenuAberto, setChuvaMenuAberto] = useState(false);
  const [salvo, setSalvo] = useState(null); // null | "plano" | "avulso"
  const ciclos = useMemo(() => montaCiclos(aluno.prioridades, aluno.estagio), [aluno]);

  /* Dia de chuva sem cancelar a aula: a quadra não deu, mas o encontro
     aconteceu — usa um dos quatro modelos prontos (TREINO_CHUVA) como a
     sessão de hoje, em vez do sorteio normal de exercícios em quadra.
     Diferente de marcar "Cancelada" na aba Aulas (que é pra quando a
     aula de fato NÃO rolou). */
  function usarModeloChuva(modeloId) {
    setDivergencias([]);
    setPlano({ chuva: true, modeloId });
    setChuvaMenuAberto(false);
  }

  function setCampoPersonalizado(k, v) {
    setNovoPersonalizado((x) => ({ ...x, [k]: v }));
  }
  /* O exercício do treinador vira um exercício de verdade na sessão —
     mesmos critérios do catálogo (montagem, regressão, progressão,
     correção, o que ignorar), só que escrito na hora, não vindo do
     manual. Só o nome é obrigatório; o resto é o que der pra preencher. */
  function adicionarPersonalizado() {
    if (!novoPersonalizado.n.trim()) return;
    setPersonalizados((p) => [...p, {
      c: "PERS-" + Date.now(), n: novoPersonalizado.n.trim(), e: [], g: "", o: "", v: 1, custom: true,
      m: novoPersonalizado.m.trim(), r: novoPersonalizado.r.trim(), p: novoPersonalizado.p.trim(),
      x: novoPersonalizado.x.trim(), i: novoPersonalizado.i.trim(), d: novoPersonalizado.d.trim(),
    }]);
    setNovoPersonalizado(PERSONALIZADO_VAZIO);
  }
  function removerPersonalizado(c) {
    setPersonalizados((p) => p.filter((x) => x.c !== c));
  }

  /* A sessão de hoje é sempre pra aula em vigor do Plano, quando existe
     uma — é isso que fecha o ciclo "o que falta → monto o treino →
     marco como feito", sem o treinador precisar ir a outra aba achar
     qual aula é essa. Sem plano (ou plano concluído), a sessão continua
     funcionando solta, do jeito que sempre funcionou. */
  const aulaEmVigorBruta = aluno.plano ? aulaEmVigor(aluno) : null;
  /* Um bloco aguardando confirmação do critério de saída não é uma aula
     de verdade pra montar sessão — trata como se não houvesse aula em
     vigor (cai no ciclo avulso), com um aviso acima explicando o motivo. */
  const aulaAtual = aulaEmVigorBruta && !aulaEmVigorBruta.gate ? aulaEmVigorBruta : null;

  const pesoBase = aluno.baseMotora === "pobre" ? 0.2 : aluno.baseMotora === "rica" ? 0.1 : 0.15;

  /* Havendo aula em vigor no Plano, a sessão NÃO sorteia nada — usa
     exatamente os exercícios que aquela aula já definiu. Duas fontes de
     treino pro mesmo dia (o ciclo avulso e a aula do Plano) é o que
     deixava o treinador sem saber qual delas seguir; agora só existe
     uma. O ciclo avulso (sorteio por prioridade) só entra em cena
     quando o jogador não tem uma aula do Plano pra seguir hoje. */
  /* Uma sessão completa tem partes, não só a lista de exercícios da
     aula: aquecimento primeiro, sempre; e saque + devolução garantidos
     no conteúdo, mesmo quando a aula do Plano em si não trouxe os
     dois (o método não abre mão disso — ver PRINCIPIOS_MTY). O
     conteúdo específico da aula continua sendo exatamente o que o
     Plano definiu; isto só garante que a sessão não fique incompleta
     ao redor dele. */
  function gerar() {
    setDivergencias([]);
    if (aulaAtual) {
      const evitar = new Set(aluno.historico.slice(-2).flat());
      const aquecimento = sorteia(exerciciosParaSorteio().filter((e) => BLOCOS[0].familias.includes(e.f) && e.e.includes(aluno.estagio)), evitar, 1);
      /* !e.semBola aqui também — não só no sorteio: uma aula do Plano
         gerada ANTES desta regra (ou colada à mão) pode ter um código
         sem bola preso no ex[], e olhar só o sorteio automático não
         bastava pra tirar ele da sessão de hoje. */
      let conteudo = (aulaAtual.ex || []).map((c) => TODOS_EXERCICIOS().find((e) => e.c === c)).filter((e) => e && !e.semBola);
      const usados = new Set(conteudo.map((e) => e.c));
      const temSaque = conteudo.some((e) => AREAS.saque.busca.test(e.n + " " + e.m));
      const temDevolucao = conteudo.some((e) => AREAS.devolucao.busca.test(e.n + " " + e.m));
      if (!temSaque) {
        const [s] = sorteia(exerciciosParaSorteio().filter((e) => AREAS.saque.busca.test(e.n + " " + e.m) && e.e.includes(aluno.estagio) && !usados.has(e.c)), evitar, 1);
        if (s) { conteudo = [...conteudo, s]; usados.add(s.c); }
      }
      if (!temDevolucao) {
        const [d] = sorteia(exerciciosParaSorteio().filter((e) => AREAS.devolucao.busca.test(e.n + " " + e.m) && e.e.includes(aluno.estagio) && !usados.has(e.c)), evitar, 1);
        if (d) conteudo = [...conteudo, d];
      }
      conteudo = garanteBrincadeira(conteudo, evitar, aluno.estagio);
      setPlano({ daAula: true, aquecimento, conteudo });
      return;
    }
    const evitar = new Set(aluno.historico.slice(-2).flat());
    const f3 = fatiaInicio(aluno.nivel);
    const areaCiclo = AREAS[ciclos[cicloAtivo].areaId];
    const pesos = [pesoBase, 0.2, f3, 0.2, Math.max(0.1, 1 - (pesoBase + 0.4 + f3))];
    setPlano(
      BLOCOS.map((b, i) => {
        const familias = b.id === 4 ? areaCiclo.familias : b.familias;
        const pool = exerciciosParaSorteio().filter((e) => familias.includes(e.f) && e.e.includes(aluno.estagio));
        const min = Math.round(duracao * pesos[i]);
        let exercicios = b.id === 3 ? garanteSaqueEDevolucao(pool, evitar) : sorteia(pool, evitar, min >= 18 ? 2 : 1);
        if (b.id === 5) exercicios = garanteBrincadeira(exercicios, evitar, aluno.estagio);
        return { ...b, familias, minutos: min, percentual: Math.round(pesos[i] * 100), exercicios };
      })
    );
  }

  /* No modo daAula, "id" é a seção ("aquecimento" ou "conteudo"), não
     um id numérico de bloco — as duas seções são arrays soltos no
     próprio objeto do plano, não uma lista de blocos. */
  function trocar(id, i) {
    setPlano((p) => {
      if (p.daAula) {
        const lista = p[id];
        const usados = new Set([...p.aquecimento, ...p.conteudo].map((e) => e.c));
        const pool = exerciciosParaSorteio().filter((e) => e.e.includes(aluno.estagio) && !usados.has(e.c));
        if (!pool.length) return p;
        const novo = pool[Math.floor(Math.random() * pool.length)];
        const saiu = lista[i];
        setDivergencias((d) => [...d, { bloco: aulaAtual.t, tipo: "troca", saiu: saiu.c, entrou: novo.c }]);
        return { ...p, [id]: lista.map((e, k) => (k === i ? novo : e)) };
      }
      return p.map((b) => {
        if (b.id !== id) return b;
        const usados = new Set(p.flatMap((x) => x.exercicios.map((e) => e.c)));
        const pool = exerciciosParaSorteio().filter((e) => b.familias.includes(e.f) && e.e.includes(aluno.estagio) && !usados.has(e.c));
        if (!pool.length) return b;
        const novo = pool[Math.floor(Math.random() * pool.length)];
        const saiu = b.exercicios[i];
        setDivergencias((d) => [...d, { bloco: b.nome, tipo: "troca", saiu: saiu.c, entrou: novo.c }]);
        return { ...b, exercicios: b.exercicios.map((e, k) => (k === i ? novo : e)) };
      });
    });
  }

  function remover(id, i) {
    setPlano((p) => {
      if (p.daAula) {
        const lista = p[id];
        setDivergencias((d) => [...d, { bloco: aulaAtual.t, tipo: "corte", saiu: lista[i].c }]);
        return { ...p, [id]: lista.filter((_, k) => k !== i) };
      }
      return p.map((b) => {
        if (b.id !== id) return b;
        setDivergencias((d) => [...d, { bloco: b.nome, tipo: "corte", saiu: b.exercicios[i].c }]);
        return { ...b, exercicios: b.exercicios.filter((_, k) => k !== i) };
      });
    });
  }

  function registrar() {
    const hoje = new Date().toISOString().slice(0, 10);
    const cods = plano.chuva ? [] : plano.daAula ? [...plano.aquecimento, ...plano.conteudo].map((e) => e.c) : plano.flatMap((b) => b.exercicios.map((e) => e.c));
    const modeloChuva = plano.chuva ? TREINO_CHUVA.find((m) => m.id === plano.modeloId) : null;
    /* O relatório desta sessão vira a observação da aula no Plano — é
       daqui que o fechamento de ciclo (e o próximo plano gerado por IA)
       vai buscar o que realmente aconteceu na quadra, em vez do
       treinador ter que reabrir e reescrever isso em outro lugar. */
    const notasSessao = [
      modeloChuva && ("Dia de chuva — " + modeloChuva.nome + ". " + modeloChuva.saida),
      obs.corrigi.trim() && ("Corrigi: " + obs.corrigi.trim()),
      obs.ignorei.trim() && ("Deixei passar: " + obs.ignorei.trim()),
      obs.mudaria.trim() && ("Teria montado diferente: " + obs.mudaria.trim()),
    ].filter(Boolean).join(" · ");
    const reg = {
      id: "r" + Date.now(), tipo: "sessao", data: hoje,
      ciclo: aulaAtual ? (aulaAtual.bloco + " · semana " + aulaAtual.semana + " · " + aulaAtual.t)
        : modeloChuva ? ("Dia de chuva · " + modeloChuva.nome) : (ciclos[cicloAtivo].letra + " · " + ciclos[cicloAtivo].nome),
      duracao, exercicios: cods, exerciciosPersonalizados: personalizados.map((p) => p.n), divergencias, ...obs,
      aulaDoPlano: aulaAtual ? aulaAtual.t : null,
    };
    setAlunos(alunos.map((a) => {
      if (a.id !== aluno.id) return a;
      const atualizado = { ...a, historico: [...a.historico, cods], registros: [...(a.registros || []), reg] };
      if (aulaAtual) {
        const anterior = (a.regPlano || {})[aulaAtual.id] || {};
        const d = { ...anterior, status: statusAulaPlano, data: hoje };
        if (statusAulaPlano !== "feita") d.motivo = motivoAulaPlano; else delete d.motivo;
        if (notasSessao) d.obs = notasSessao;
        atualizado.regPlano = { ...(a.regPlano || {}), [aulaAtual.id]: d };
      }
      return atualizado;
    }));
    setPlano(null); setFechando(false); setDivergencias([]);
    setObs({ corrigi: "", ignorei: "", mudaria: "", nota: 3 });
    setStatusAulaPlano("feita"); setMotivoAulaPlano("");
    setPersonalizados([]); setNovoPersonalizado(PERSONALIZADO_VAZIO);
    /* Confirmação visível de que o registro foi salvo — o relatório desta
       sessão vai para aluno.registros (aba Caderno) e, quando havia aula
       do Plano em vigor, também para regPlano[aulaAtual.id].obs (é dali
       que o fechamento de ciclo e o próximo plano por IA leem). Sem isso
       na tela, "salvou mesmo?" ficava sem resposta — o formulário só
       desaparecia. */
    setSalvo(aulaAtual ? "plano" : "avulso");
    setTimeout(() => setSalvo(null), 4000);
  }

  const total = plano && !plano.daAula && !plano.chuva ? plano.reduce((s, b) => s + b.minutos, 0) : 1;
  const pctIP = plano && !plano.daAula && !plano.chuva ? Math.round((plano[2].minutos / total) * 100) : 0;
  const dentro = pctIP >= 25 && pctIP <= 35;

  return (
    <div>
      {salvo && (
        <div className="mb-4" style={{ background: C.quadra, padding: "9px 13px" }}>
          <Etiqueta cor="#fff">{salvo === "plano" ? "✓ sessão registrada e marcada no plano" : "✓ sessão registrada no caderno"}</Etiqueta>
        </div>
      )}
      {!podeEditar && (
        <div className="mb-5"><Aviso>Este jogador é de outro treinador — só ele (ou o coordenador) pode registrar a sessão dele.</Aviso></div>
      )}
      {aulaAtual ? (
        <div className="mb-5" style={{ background: C.cal, borderLeft: "3px solid " + C.saibro, padding: "13px 15px" }}>
          <Etiqueta cor={C.saibro}>Sessão de hoje é a aula em vigor do Plano</Etiqueta>
          <p style={{ ...prosa, fontSize: 14, fontWeight: 700, marginTop: 4 }}>{aulaAtual.bloco} · semana {aulaAtual.semana} · {aulaAtual.t}</p>
          <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 4 }}>
            É o mesmo treino que está no Plano pra esta aula — não um novo sorteio. Ao fechar a sessão, isso marca essa aula como feita.
          </p>

/* ─────────────────────────── scout de partida ─────────────────────────── */
const PONTOS_TENIS = ["0", "15", "30", "40"];

function placarInicial(formato, sacaPrimeiro) {
  return {
    formato, p: [0, 0], g: [0, 0], sets: [], saque: sacaPrimeiro,
    tiebreak: false, fim: false, vencedor: null,
  };
}

function rotuloPontos(e) {
  if (e.tiebreak) return `${e.p[0]}-${e.p[1]}`;
  const [a, b] = e.p;
  if (a >= 3 && b >= 3) {
    if (a === b) return "40-40";
    return a > b ? "AD-40" : "40-AD";
  }
  return `${PONTOS_TENIS[a]}-${PONTOS_TENIS[b]}`;
}

/* placar adverso: adversário à frente no game, ou nós atrás em games no set */
function ehAdverso(e) {
  if (e.p[1] > e.p[0]) return true;
  if (e.g[1] > e.g[0]) return true;
  return false;
}

function gamesParaSet(formato) {
  return formato === "4games" ? 4 : 6;
}

function aplicaPonto(e0, nos) {
  const e = { ...e0, p: [...e0.p], g: [...e0.g], sets: [...e0.sets] };
  if (e.fim) return e;
  const i = nos ? 0 : 1, j = nos ? 1 : 0;
  e.p[i]++;

  const alvoGames = gamesParaSet(e.formato);

  function fechaGame(quem) {
    e.g[quem]++;
    e.p = [0, 0];
    e.saque = e.saque === "nos" ? "ele" : "nos";
    const o = quem === 0 ? 1 : 0;
    if (e.g[quem] >= alvoGames && e.g[quem] - e.g[o] >= 2) fechaSet(quem);
    else if (e.g[0] === alvoGames && e.g[1] === alvoGames) e.tiebreak = true;
  }
  function fechaSet(quem) {
    e.sets.push([e.g[0], e.g[1]]);
    e.g = [0, 0];
    e.tiebreak = false;
    const meus = e.sets.filter((s) => s[0] > s[1]).length;
    const dele = e.sets.filter((s) => s[1] > s[0]).length;
    const preciso = e.formato === "3sets" ? 2 : 1;
    if (meus >= preciso || dele >= preciso) {
      e.fim = true;
      e.vencedor = meus > dele ? "nos" : "ele";
    }
  }

  if (e.tiebreak) {
    if (e.p[i] >= 7 && e.p[i] - e.p[j] >= 2) {
      e.g[i]++;
      e.p = [0, 0];
      fechaSet(i);
    }
  } else if (e.p[i] >= 4 && e.p[i] - e.p[j] >= 2) {
    fechaGame(i);
  }
  return e;
}

const FIM_PONTO = [
  { v: "winner_nos", r: "Winner meu", nos: true, cor: "#2E4739" },
  { v: "erro_dele", r: "Erro dele", nos: true, cor: "#2E4739" },
  { v: "erro_nos", r: "Erro meu", nos: false, cor: "#C8102E" },
  { v: "winner_dele", r: "Winner dele", nos: false, cor: "#C8102E" },
];

function TelaScout({ aluno, alunos, setAlunos }) {
  const [fase, setFase] = useState("antes");
  const [cfg, setCfg] = useState({ adversario: "", torneio: "", formato: "3sets", saca: "nos" });
  const [placar, setPlacar] = useState(null);
  const [pontos, setPontos] = useState([]);
  const [rascunho, setRascunho] = useState(null);
  const [pilha, setPilha] = useState([]);

  function comecar() {
    setPlacar(placarInicial(cfg.formato, cfg.saca));
    setPontos([]);
    setPilha([]);
    setFase("durante");
  }

  function escolheFim(op) {
    setRascunho({
      fim: op.v, nos: op.nos, saque: null, bola: null, causa: null,
      protocolo: false, rede: false, ataquePerdido: false,
      adverso: ehAdverso(placar), sacador: placar.saque,
    });
  }

  function confirma(bola) {
    const p = { ...rascunho, bola, n: pontos.length + 1, placarAntes: rotuloPontos(placar) };
    setPilha([...pilha, { placar, pontos }]);
    setPontos([...pontos, p]);
    setPlacar(aplicaPonto(placar, p.nos));
    setRascunho(null);
  }

  function desfazer() {
    if (rascunho) { setRascunho(null); return; }
    const ult = pilha[pilha.length - 1];
    if (!ult) return;
    setPlacar(ult.placar);
    setPontos(ult.pontos);
    setPilha(pilha.slice(0, -1));
  }

  const setsTexto = placar
    ? [...placar.sets.map((x) => `${x[0]}-${x[1]}`), `${placar.g[0]}-${placar.g[1]}`].join("  ")
    : "";

  /* ── antes ── */
  if (fase === "antes")
    return (
      <div>
        <Aviso cor={C.quadra}>
          Dois toques por ponto: como terminou e em que bola. O placar se calcula sozinho, para que
          o jogo sob placar adverso possa ser lido depois.
        </Aviso>
        <Campo rotulo="Adversário">
          <input style={entrada} value={cfg.adversario} onChange={(e) => setCfg({ ...cfg, adversario: e.target.value })} />
        </Campo>
        <Campo rotulo="Torneio">
          <input style={entrada} value={cfg.torneio} onChange={(e) => setCfg({ ...cfg, torneio: e.target.value })} placeholder="Torneio ou jogo-treino" />
        </Campo>
        <Campo rotulo="Formato">
          <Seletor opcoes={[{ v: "3sets", r: "Melhor de 3" }, { v: "1set", r: "Set único" }, { v: "4games", r: "Set a 4 games" }]}
            valor={cfg.formato} aoMudar={(v) => setCfg({ ...cfg, formato: v })} />
        </Campo>
        <Campo rotulo="Quem saca primeiro">
          <Seletor opcoes={[{ v: "nos", r: "Meu jogador" }, { v: "ele", r: "Adversário" }]}
            valor={cfg.saca} aoMudar={(v) => setCfg({ ...cfg, saca: v })} />
        </Campo>
        <Botao onClick={comecar} variante="saibro">Começar a coleta</Botao>
      </div>
    );

  /* ── relatório ── */
  if (fase === "depois")
    return <Relatorio aluno={aluno} alunos={alunos} setAlunos={setAlunos} cfg={cfg}
      pontos={pontos} placar={placar} aoSair={() => { setFase("antes"); setPontos([]); }} />;

  /* ── durante ── */
  const nossoSaque = placar.saque === "nos";
  const adverso = ehAdverso(placar);

  return (
    <div>
      <div style={{ position: "sticky", top: 96, background: C.papel, paddingBottom: 10, zIndex: 5 }}>
        <div style={{ background: C.tinta, color: C.papel, padding: "12px 15px", borderRadius: 2 }}>
          <div className="flex items-center justify-between">
            <div>
              <div style={{ fontFamily: ARCH, fontSize: 10, letterSpacing: "0.14em", opacity: 0.7 }}>
                {nossoSaque ? "SAQUE DO MEU JOGADOR" : "SAQUE DO ADVERSÁRIO"}
              </div>
              <div style={{ fontFamily: ARCH, fontSize: 30, fontWeight: 700, lineHeight: 1.1 }}>
                {rotuloPontos(placar)}
              </div>
            </div>
            <div className="text-right">
              <div style={{ fontFamily: ARCH, fontSize: 10, letterSpacing: "0.14em", opacity: 0.7 }}>SETS</div>
              <div style={{ fontFamily: ARCH, fontSize: 17, fontWeight: 600 }}>{setsTexto}</div>
            </div>
          </div>
          {adverso && (
            <div className="mt-2" style={{ fontFamily: ARCH, fontSize: 11, fontWeight: 700, color: "#FF8DA1" }}>
              PLACAR ADVERSO — este ponto entra na comparação
            </div>
          )}
        </div>
      </div>

      {placar.fim && (
        <Aviso>
          Partida encerrada. {pontos.length} pontos coletados.{" "}
          <button onClick={() => setFase("depois")} style={{ textDecoration: "underline", cursor: "pointer" }}>
            Ver o relatório
          </button>
        </Aviso>
      )}

      {nossoSaque && !rascunho && (
        <div className="mb-4">
          <div className="mb-2"><Etiqueta>Saque (opcional)</Etiqueta></div>
          <div className="flex gap-2">
            {[["1", "1º dentro"], ["2", "2º dentro"], ["df", "Dupla falta"]].map(([v, r]) => (
              <button key={v}
                onClick={() => {
                  if (v === "df") {
                    setPilha([...pilha, { placar, pontos }]);
                    const p = { fim: "erro_nos", nos: false, saque: "df", bola: "1-2", causa: "execucao",
                      protocolo: false, rede: false, ataquePerdido: false, adverso, sacador: "nos",
                      n: pontos.length + 1, placarAntes: rotuloPontos(placar) };
                    setPontos([...pontos, p]);
                    setPlacar(aplicaPonto(placar, false));
                  } else setRascunho({ saquePre: v });
                }}
                style={{ flex: 1, fontFamily: ARCH, fontSize: 13, fontWeight: 600, padding: "12px 6px",
                  border: "1px solid " + (v === "df" ? C.saibro : C.linha), borderRadius: 2,
                  background: C.cal, color: v === "df" ? C.saibro : C.tinta, cursor: "pointer" }}>
                {r}
              </button>
            ))}
          </div>
        </div>

res trocam BH slice na cruzada. Foco em: trajetória baixa sobre a rede, bola que desliza no piso, profundidade no fundo. Não deve subir mais de 1m acima da rede.","g":"5-7 min","r":"Bola alimentada alta, sem deslocamento.","p":"Slice de defesa em bola profunda com deslocamento para trás.","x":"Ângulo da raquete e permanência do corpo baixo na saída.","i":"A altura da bola sobre a rede. Slice defensivo alto está cumprindo sua função — ganhar tempo.","v":0,"o":"Slice de BH como ferramenta defensiva e de variação."},{"c":"FB010","n":"FH e BH com Recuperação ao Centro","f":"FB","e":["V","L","G","A","C"],"m":"Jogadores trocam bolas na cruzada mas após cada golpe devem tocar o cone no centro da linha de base antes de se mover para o próximo golpe.","g":"5-7 min","r":"Reduzir o ritmo da troca; marcar o ponto central com cone.","p":"Aumentar o ritmo e o afastamento lateral da alimentação.","x":"O último passo de recuperação — se ele acontece antes da bola do adversário sair.","i":"A qualidade do golpe. A métrica aqui é o retorno ao centro; golpe imperfeito com recuperação correta é execução correta.","v":0,"o":"Hábito de recuperação ao centro após cada golpe."},{"c":"FB011","n":"FH Open Stance","f":"FB","e":["L","G","A","C"],"m":"Treinador alimenta bolas forçando stance aberto. Foco na rotação completa dos quadris e ombros. Peso transfere do pé traseiro para o pé da frente durante o swing.","g":"6 séries de 8 bolas","r":"Posição de contato marcada no chão; alimentação parada.","p":"Bola em movimento lateral, obrigando ajuste da base em deslocamento.","x":"Base de apoio e rotação do quadril sem perder o eixo.","i":"A stance fechada quando ela aparece. Open stance é padrão, não regra única — em bola curta a fechada continua sendo a melhor escolha.","v":0,"o":"FH com stance aberto - padrão do tênis moderno."},{"c":"FB012","n":"BH Closed Stance","f":"FB","e":["L","G","A","C"],"m":"Treinador alimenta bolas centrais para BH com stance fechado. Atentar ao cruzamento do pé de frente. Rotação do ombro deve ser completa.","g":"6 séries de 8 bolas","r":"Alimentação parada com pé de apoio marcado.","p":"Bola com deslocamento e alternância de profundidade.","x":"Entrada do pé da frente e transferência de peso na direção do golpe.","i":"Open stance de backhand quando aparece sob pressão. Sob pressão ela é a resposta correta.","v":0,"o":"BH com stance fechado - base da técnica moderna."},{"c":"FB013","n":"Voleio FH - Bloqueio","f":"FB","e":["V","L","G","A","C"],"m":"Jogador na linha de serviço. Treinador alimenta bolas para voleio de FH. Foco em: split step, punho firme, bloqueio sem swing, direção definida antes do contato.","g":"6 séries de 8 voleios","r":"Bola lançada com a mão, à altura do peito.","p":"Voleio com deslocamento lateral prévio e alvo de direção definido.","x":"Punho firme e contato à frente, com o corpo entrando na bola.","i":"O tamanho da preparação. Voleio curto demais é raro; corrigir excesso vem depois de existir o bloqueio.","v":0,"o":"Voleio de FH como bloqueio com direção definida."},{"c":"FB014","n":"Voleio BH - Bloqueio","f":"FB","e":["V","L","G","A","C"],"m":"Mesma estrutura do FB013 com BH. Braço estendido para o lado esquerdo (destros), punho firme acima do pulso, ângulo de raquete levemente aberto.","g":"6 séries de 8 voleios","r":"Bola lançada com a mão; voleio a uma mão com apoio da outra na raquete.","p":"Voleio baixo e voleio alto alternados, com direção comandada.","x":"Firmeza do punho e ombro à frente no contato.","i":"Direção nas primeiras séries. Primeiro o bloqueio existe; depois ele aponta.","v":0,"o":"Voleio de BH com punho firme e direção."},{"c":"FB015","n":"Smash Central","f":"FB","e":["L","G","A","C"],"m":"Treinador alimenta lobs centrais para smash. Apontar com o braço livre, posicionar de lado, contato com braço estendido acima da cabeça. Direção com alvo.","g":"6 séries de 6 smashes","r":"Bola lançada com a mão, sem deslocamento, com o jogador já posicionado.","p":"Lob alimentado profundo, obrigando recuo com passo cruzado antes do smash.","x":"Posicionamento sob a bola e o braço não-dominante apontando para acompanhar a trajetória.","i":"A força. Smash mal posicionado não se resolve batendo mais forte — se resolve chegando antes.","v":0,"o":"Smash frontal como golpe decisivo na rede."},{"c":"FB016","n":"Lob Defensivo","f":"FB","e":["L","G","A","C"],"m":"Treinador na rede alimenta bolas rápidas. Jogador executa lob defensivo: alto (pelo menos 2m acima do oponente), profundo (último metro do fundo), preferencialmente para o BH do adversário.","g":"6 séries de 6 lobs","r":"Alimentação lenta e alta, com o treinador na rede sem finalizar.","p":"Lob sob pressão real, com adversário buscando o smash.","x":"Abertura da face e permanência do corpo baixo no contato.","i":"A profundidade nas primeiras repetições. Lob curto é erro de altura, não de intenção — o jogador acertou a decisão.","v":0,"o":"Lob como resposta a bolas de pressão com oponente na rede."},{"c":"FB017","n":"Drop Shot pelo FH","f":"FB","e":["L","G","A","C"],"m":"Treinador alimenta bolas de profundidade média. Preparação idêntica ao FH normal, ação de segurar a raquete no contato criando efeito cortado curto. Alvo: primeiro metro após a rede.","g":"6 séries de 6 drop shots","r":"Alimentação de bola curta e lenta, com o jogador já dentro da quadra.","p":"Disfarce: preparação idêntica à do golpe de base até o instante do contato.","x":"Toque leve e desaceleração da raquete no contato.","i":"A quantidade de drop shots que caem na rede no início. O gesto é de precisão fina e leva semanas.","v":0,"o":"Drop shot pelo FH com disfarce e precisão."},{"c":"FB018","n":"Drop Shot pelo BH","f":"FB","e":["L","G","A","C"],"m":"Mesma filosofia do FB017 com BH. A raquete acompanha a bola brevemente em vez de atravessa-lá. Alvo: quina da rede ou curto cruzado.","g":"6 séries de 6 drop shots","r":"Bola alimentada alta e lenta pelo lado do backhand.","p":"Drop shot a partir de bola profunda, com deslocamento para dentro da quadra.","x":"Ângulo aberto da face e controle da desaceleração.","i":"A escolha do momento. Aqui se treina o gesto; quando usar é assunto da família tática.","v":0,"o":"Drop shot pelo BH com disfarce e controle."},{"c":"FB019","n":"Passada Cruzada","f":"FB","e":["L","G","A","C"],"m":"Treinador na rede alimenta bolas de borda. Jogador executa passada cruzada com FH ou BH. Bola baixa sobre a rede, com bom ângulo e profundidade.","g":"6 séries de 6 passadas","r":"Treinador na rede sem interceptar; bola alimentada de posição fixa.","p":"Adversário real na rede buscando o voleio de finalização.","x":"Contato à frente e ombro fechado para segurar a bola dentro do ângulo.","i":"Passadas que o adversário alcança. A passada cruzada correta pode ser voleada — a decisão continua certa.","v":0,"o":"Passing shot cruzado com adversário na rede."},{"c":"FB020","n":"Passada Paralela","f":"FB","e":["L","G","A","C"],"m":"Treinador na rede alimenta bolas centrais. Jogador executa passada paralela. Bola baixa pelo lado do oponente, profunda. Timing crítico: bater cedo.","g":"6 séries de 6 passadas","r":"Adversário na rede parado do lado oposto.","p":"Adversário coberto na paralela, obrigando disfarce da direção.","x":"Preparação idêntica à da cruzada até o contato, e a linha do ombro.","i":"A taxa de erro para fora. A paralela é o tiro mais estreito da quadra — o erro é do risco escolhido, não do gesto.","v":0,"o":"Passing shot paralelo como alternativa tática."},{"c":"FB021","n":"Approach FH Paralelo","f":"FB","e":["L","G","A","C"],"m":"Treinador alimenta bolas curtas. Jogador avança e executa FH approach pela paralela profundo e baixo. Sobe a rede para posição de voleio. Foco no split step após o approach. J","g":"6 séries de 6 approaches","r":"Bola curta alimentada de cesta com o jogador já em movimento.","p":"Approach seguido de voleio real com o ponto disputado até o fim.","x":"Subida em movimento, sem parar após o contato, e altura baixa da bola de approach.","i":"A potência do approach. Approach é bola de posicionamento — pedir força aqui converte um approach em ataque e tira o jogador da rede.","v":0,"o":"Approach de FH pela paralela como subida eficiente."},{"c":"FB022","n":"Approach BH Cruzado","f":"FB","e":["L","G","A","C"],"m":"Treinador alimenta bolas curtas para o BH. Jogador executa BH approach cruzado, profundo, e sobe à rede. Split step antes do voleio.","g":"6 séries de 6 approaches J","r":"Aproximação sem deslocamento; alimentação parada em meia quadra.","p":"Approach cruzado seguido de cobertura da paralela na rede.","x":"Continuidade do deslocamento e altura da bola sobre a rede.","i":"A direção quando o jogador está atrasado. Chegar atrasado e subir mesmo assim é o erro real; a direção é secundário.","v":0,"o":"Approach de BH cruzado para subida à rede."},{"c":"FB023","n":"Devolução - Bloco","f":"FB","e":["V","L","G","A","C"],"m":"Treinador saca com velocidade moderada de ambos os lados. Jogador usa devolução de bloco: swing curto, contato firme, redirecionando com profundidade. Sem tentar acelerar.","g":"8-12 devoluções por lado","r":"Saque alimentado à meia velocidade ou por lançamento de mão.","p":"Saque real em velocidade de jogo, alternando lados.","x":"Preparação curta e split step no instante do contato do sacador.","i":"A profundidade da devolução. Bloco que entra já cumpriu o objetivo do exercício.","v":0,"o":"Devolução segura como primeira resposta ao saque."},{"c":"FB024","n":"Devolução - Ataque FH","f":"FB","e":["G","A","C"],"m":"Treinador saca aberto no AC. Jogador usa devolução de FH agressiva: swing completo, intenção de cruzada profunda ou inside out. Decisão da direção antes do saque.","g":"8-12 devoluções","r":"Saque à meia velocidade e alvo amplo.","p":"Devolução de ataque seguida da primeira bola disputada.","x":"Entrada do corpo para dentro da quadra e ponto de contato à frente da linha.","i":"O erro para fora. Devolução de ataque erra — se ela nunca erra, não é ataque.","v":0,"o":"Devolução agressiva de FH contra saques abertos."},{"c":"FB025","n":"Saque Flat - T","f":"FB","e":["V","L","G","A","C"],"m":"Jogador executa saques flat com alvo no T. Foco: lançamento acima e levemente à frente, contato no ponto mais alto, pronação natural. 5 saques por série.","g":"8-12 séries de 5 saques","r":"Saque a partir da posição de trofeu, sem movimento completo.","p":"Reduzir o alvo do T e registrar o percentual por série.","x":"Lançamento consistente e flexão de joelhos na carga.","i":"O percentual nas primeiras séries e a flexão exagerada — a referência é 65 a 67 graus, não o agachamento máximo.","v":0,"o":"Saque flat com precisão no T."},{"c":"FB026","n":"Saque Flat - Aberto","f":"FB","e":["V","L","G","A","C"],"m":"Mesmo formato do FB025 com alvo no canto externo. Trabalhar dos dois lados (DC e AC).","g":"8-12 séries de 5 saques","r":"Alvo ampliado; saque de posição de trofeu.","p":"Alvo reduzido, com registro de percentual e alternância com o T.","x":"Lançamento mais à frente e à direita, e a linha do ombro na saída.","i":"A força do saque. Velocidade de braço, não força de braço — a diferença aparece no som, não no esforço.","v":0,"o":"Saque flat com precisão aberto."},{"c":"FB027","n":"Saque Kick","f":"FB","e":["L","G","A","C"],"m":"Lançamento mais atrás da cabeça, contato na posição 11h, escovada de baixo para cima e levemente para o lado. Bola deve saltar alto para o BH do adversário no AC.","g":"8-12 séries de 5 saques","r":"Movimento de kick sem bola, depois com bola sem alvo.","p":"Kick com alvo alto no quadrado e uso como segundo saque em ponto real.","x":"Trajetória da raquete de baixo para cima e o arqueamento das costas.","i":"A velocidade. O kick vive da altura sobre a rede e do salto após o quique — velocidade aqui é irrelevante.","v":0,"o":"Saque com efeito kick como 2º saque consistente."},{"c":"FB028","n":"Saque Slice","f":"FB","e":["L","G","A","C"],"m":"Lançamento levemente a direita (destros), contato na posição 3h, escovada lateral. Bola deve deslizar baixa e abrir o campo. Trabalhar dos dois lados.","g":"8-12 séries de 5 saques","r":"Sem bola primeiro; depois com alvo amplo no lado aberto.","p":"Slice aberto para tirar o adversário da quadra, seguido da primeira bola.","x":"Lançamento mais lateral e contato na lateral da bola.","i":"A profundidade. Slice curto e aberto que tira o adversário da quadra é um bom saque.","v":0,"o":"Saque slice para afastar o adversário."},{"c":"FB029","n":"FH Shadow Drill","f":"FB","e":["V","L","G","A","C"],"m":"Shadow swings de FH: preparação completa, rotação dos quadris antes dos ombros, ponto de contato à frente do corpo, finalização acima do ombro oposto. Treinador corrige o gesto.","g":"3 séries de 20 repetições","r":"Movimento fracionado em quatro tempos, com pausa em cada um.","p":"Movimento em velocidade real, com deslocamento antes de cada repetição.","x":"Sequência base de apoio → preparação → contato → terminação, sem a pressão da bola.","i":"Ritmo. Shadow lento e correto vale mais que shadow rápido e aproximado.","v":0,"o":"Fixar o padrão motor do FH sem a pressão da bola."},{"c":"FB030","n":"BH Shadow Drill","f":"FB","e":["V","L","G","A","C"],"m":"Mesmo formato do FB029 com BH. Para dois mãos: início do movimento pelo braço não-dominante. Para uma mão: posição da pegada e extensão na finalização.","g":"3 séries de 20 repetições","r":"Movimento fracionado com pausa no ponto de contato imaginário.","p":"Shadow com deslocamento lateral e alternância de altura simulada.","x":"Coordenação entre rotação do tronco e chegada do braço.","i":"Detalhes finos de pegada. Shadow fixa o padrão amplo; a pegada se corrige com bola.","v":0,"o":"Fixar o padrão motor do BH sem a pressão da bola."},{"c":"IP001","n":"Saque e ponto","f":"IP","e":["V","L","G","A","C"],"m":"Saca e disputa o ponto imediatamente, sem troca de aquecimento prévia.","g":"4 séries de 6 pontos","r":"quadra reduzida, saque por baixo","p":"saque com alvo declarado antes","x":"rotina antes do saque, disputa até o fim","i":"qualidade técnica do saque","v":1,"o":""},{"c":"IP002","n":"Saque para dois alvos","f":"IP","e":["V","L","G","A"],"m":"Dois alvos amplos na área de saque; declara o alvo em voz alta antes de sacar.","g":"3 × 10 saques","r":"alvos maiores, sem declarar","p":"três alvos, um deles no corpo","x":"decisão fechada antes da rotina","i":"velocidade","v":1,"o":""},{"c":"IP003","n":"Saque + a bola seguinte","f":"IP","e":["V","L","G","A","C"],"m":"Saca, o professor devolve neutro, o aluno executa a primeira bola com intenção definida.","g":"4 × 8 sequências","r":"devolução lançada pelo professor","p":"devolução real variando os três caminhos","x":"intenção da primeira bola, recuperação após o saque","i":"o resultado do ponto","v":1,"o":""},{"c":"IP004","n":"Devolução e ponto","f":"IP","e":["V","L","G","A","C"],"m":"O ponto começa na devolução; sacador com saque controlado.","g":"4 × 6 pontos","r":"saque lançado por baixo","p":"sacador com saque pleno","x":"posição de espera e split","i":"potência da devolução","v":1,"o":""},{"c":"IP005","n":"Devolução com dois alvos","f":"IP","e":["V","L","G","A"],"m":"Devolve alternando alvo declarado antes do saque.","g":"3 × 10","r":"alvo único e amplo","p":"alvo escolhido só após ver a direção do saque","x":"direção com estrutura firme","i":"profundidade máxima","v":1,"o":""},{"c":"IP006","n":"Devolução + primeira bola","f":"IP","e":["L","G","A","C"],"m":"Devolve e executa a bola seguinte com intenção definida.","g":"4×8","r":"primeira bola livre","p":"primeira bola com alvo de pressão","x":"recuperação ao centro dinâmico entre as duas bolas","i":"o terceiro golpe","v":1,"o":""},{"c":"IP007","n":"Devolução entrando","f":"IP","e":["L","G","A","C"],"m":"Espera dentro da linha, bloqueia com direção e sai à frente.","g":"3 × 10","r":"segundo saque apenas","p":"primeiro saque forte","x":"timing do split no contato do sacador","i":"tamanho da preparação","v":1,"o":""},{"c":"IP008","n":"Devolução de trás com profundidade","f":"IP","e":["G","A","C"],"m":"Espera atrás, golpe pleno com alvo central profundo.","g":"3 × 10","r":"alvo mais curto","p":"alvo além da linha de saque com margem reduzida","x":"transferência de peso para dentro","i":"ângulo","v":1,"o":""},{"c":"IP009","n":"Saque aberto + quadra vazia","f":"IP","e":["G","A","C"],"m":"Saque aberto na quadra de iguais; ataca o espaço oposto na primeira bola.","g":"4×6","r":"professor devolve para o lado previsto","p":"devolução variando","x":"leitura do espaço criado","i":"velocidade do saque","v":1,"o":""},{"c":"IP010","n":"Saque no corpo + centro","f":"IP","e":["G","A","C"],"m":"Saque no corpo; primeira bola agressiva pelo centro, negando ângulo.","g":"4×6","r":"alvo central amplo","p":"exigir profundidade além da linha de saque","x":"posicionamento após o saque","i":"o resultado do ponto","v":1,"o":""},{"c":"IP011","n":"Saque fechado + paralela protegida","f":"IP","e":["G","C"],"m":"Saque fechado; primeira bola protegendo a paralela.","g":"3×8","r":"sem exigência de direção","p":"devolvedor instruído a atacar a paralela","x":"cobertura da rota provável","i":"potência","v":1,"o":""},{"c":"IP012","n":"Matriz três caminhos","f":"IP","e":["G","C"],"m":"A devolução volta cruzada, pelo meio ou paralela; a resposta está pré-resolvida para cada uma.","g":"6×6","r":"dois caminhos apenas","p":"o devolvedor escolhe livremente","x":"decisão instantânea, sem deliberar","i":"execução fina","v":1,"o":""},{"c":"IP013","n":"Matriz completa dos 18 cenários","f":"IP","e":["C"],"m":"Três direções de saque × dois lados × três caminhos de devolução.","g":"18 blocos de 4 pontos, distribuídos em duas semanas","r":"trabalhar seis cenários por vez","p":"encadear com a terceira bola","x":"o mapa estar pré-resolvido","i":"tudo o mais","v":1,"o":""},{"c":"IP014","n":"Saque indecifrável","f":"IP","e":["G","C"],"m":"Duas variações com armado idêntico; o parceiro tenta antecipar e declara antes do contato.","g":"3 × 12","r":"duas variações muito distintas","p":"três variações","x":"identidade do armado e do lançamento","i":"eficácia do saque","v":1,"o":""},{"c":"IP015","n":"Segundo saque com alvo","f":"IP","e":["G","A","C"],"m":"Apenas segundos saques, com alvo e plano declarados. Proibido jogar para “não errar”.","g":"4 × 10","r":"alvo amplo","p":"placar adverso simulado","x":"existência de intenção positiva","i":"duplas faltas nas primeiras sessões","v":1,"o":""},{"c":"IP016","n":"Saque + subida","f":"IP","e":["G","A","C"],"m":"Saque e subida imediata, com split na zona de voleio antes do golpe do adversário.","g":"3×8","r":"subir após a primeira bola","p":"contra devolvedor atacando","x":"timing do split na subida","i":"qualidade do voleio","v":1,"o":""},{"c":"IP017","n":"Devolução + subida","f":"IP","e":["G","A","C"],"m":"Devolução agressiva emendando avanço.","g":"3×8","r":"apenas em segundo saque","p":"em primeiro saque","x":"decisão de subir tomada antes da devolução","i":"o voleio","v":1,"o":""},{"c":"IP018","n":"Rodízio de início de ponto","f":"IP","e":["V","L","G","A"],"m":"Grupo: dois sacam, dois devolvem, troca a cada quatro pontos.","g":"20 min","r":"saques lançados","p":"com placar e consequência","x":"ritmo e engajamento de todos","i":"técnica fina","v":1,"o":""},{"c":"IP019","n":"Saque sob placar adverso","f":"IP","e":["G","C"],"m":"Sacar em 0-30 e 30-40, declarando direção e tipo antes.","g":"3×8","r":"só 30-40","p":"com público ou parceiro pressionando","x":"decisão fechada e não reaberta","i":"resultado","v":1,"o":""},{"c":"IP020","n":"Devolução contra três velocidades","f":"IP","e":["G","A","C"],"m":"O sacador varia entre lento, médio e forte sem avisar.","g":"3 × 12","r":"duas velocidades","p":"variando também direção e efeito","x":"ajuste de posição e de tamanho de preparação","i":"potência","v":1,"o":""},{"c":"JA001","n":"Ponto do saque","f":"JA","e":["V","L","G","A","C"],"m":"Todo ponto começa com saque real.","g":"10–15 pontos","r":"saque adaptado","p":"saque com plano declarado","x":"rotina","i":"técnica","v":1,"o":""},{"c":"JA002","n":"Ponto de quatro bolas","f":"JA","e":["V","L","G","A","C"],"m":"O ponto encerra na quarta bola; vence quem estiver melhor posicionado.","g":"12 pontos","r":"seis bolas","p":"três bolas","x":"intenção desde a primeira bola","i":"trocas longas","v":1,"o":""},{"c":"JA003","n":"Frente vale dobro","f":"JA","e":["V","L","G","A","C"],"m":"Ponto ganho à frente da linha de serviço vale dois.","g":"um set curto","r":"vale um e meio","p":"só pontua à frente","x":"disposição de subir","i":"qualidade do voleio","v":1,"o":""},{"c":"JA004","n":"Curta obrigatória","f":"JA","e":["V","L","G","A"],"m":"Toda bola curta recebida obriga a entrar e atacar.","g":"12 pontos","r":"obrigatório só em bola muito curta","p":"qualquer bola dentro da quadra","x":"reconhecimento","i":"erro no ataque","v":1,"o":""},{"c":"JA005","n":"Rei da quadra com saque","f":"JA","e":["V","L","G","A"],"m":"Rodízio com saque obrigatório a cada entrada.","g":"15 min","r":"entrada com bola lançada","p":"dois pontos para entrar","x":"ritmo","i":"técnica","v":1,"o":""},{"c":"JA006","n":"Classificar em voz alta","f":"JA","e":["L","G","A","C"],"m":"Diz “neutra”, “ataque” ou “defesa” antes de cada golpe.","g":"12 pontos","r":"só na primeira bola","p":"em todas, com o professor conferindo","x":"ler a bola, não o próprio estado","i":"execução","v":1,"o":""},{"c":"JA007","n":"Mudança de direção autorizada","f":"JA","e":["G","A","C"],"m":"Só pode mudar de direção se o deslocamento estiver induzindo.","g":"12 pontos","r":"o professor autoriza em voz alta","p":"o aluno julga sozinho","x":"geometria do deslocamento","i":"resultado","v":1,"o":""},{"c":"JA008","n":"Contato antecipado","f":"JA","e":["G","A","C"],"m":"Ponto perdido se golpear na descida da bola.","g":"10 pontos","r":"vale só no fundo","p":"vale em toda bola","x":"posição de espera mais dentro","i":"erros iniciais","v":1,"o":""},{"c":"JA009","n":"Placar adverso","f":"JA","e":["G","A","C"],"m":"O jogo começa 0-30 ou 2-4.","g":"2 sets curtos","r":"15-30","p":"0-40","x":"protocolo entre pontos","i":"o placar final","v":1,"o":""},{"c":"JA010","n":"Placar favorável a fechar","f":"JA","e":["G","A","C"],"m":"Começa 40-0 e precisa fechar.","g":"2 sets curtos","r":"40-15","p":"40-0 com dois break points salvos antes","x":"manter intenção com vantagem","i":"resultado","v":1,"o":""},{"c":"JA011","n":"Duas defesas","f":"JA","e":["G","A","C"],"m":"Defender alternando obrigatoriamente alta e acelerada.","g":"12 pontos","r":"alternância anunciada","p":"por chamada durante o ponto","x":"disponibilidade das duas opções","i":"qualidade fina","v":1,"o":""},{"c":"JA012","n":"Protocolo entre pontos","f":"JA","e":["G","A","C"],"m":"Ponto anulado se a rotina de quatro passos não for executada.","g":"um set","r":"só antes do saque","p":"também na devolução","x":"execução real, não mecânica","i":"o jogo","v":1,"o":""},{"c":"JA013","n":"Padrão obrigatório","f":"JA","e":["G","C"],"m":"Só pontua quem executar o padrão do dia.","g":"12 pontos","r":"dois padrões possíveis","p":"padrão único","x":"automatização","i":"o resto do ponto","v":1,"o":""},{"c":"JA014","n":"Set curto com tema","f":"JA","e":["L","G","A","C"],"m":"Set a 4 games com a regra do dia valendo.","g":"1–2 sets","r":"a 3 games","p":"com placar adverso somado","x":"transferência do tema para o jogo","i":"vitória","v":1,"o":""},{"c":"MV001","n":"Movimentação em X","f":"MV","e":["L","G","A","C"],"m":"Treinador lança 2 bolas profundas (defesa) e 2 curtas (ataque) alternando FH e BH. Jogador retorna sempre ao ponto central formando o X. Cones marcam os 4 pontos de chegada.","g":"4 séries de 8-12 bolas","r":"Reduzir a quatro bolas por série e ampliar o intervalo entre alimentações.","p":"Aumentar o ritmo da alimentação e retirar os cones de referência.","x":"A recuperação ao ponto central após cada golpe — esta é a métrica do exercício.","i":"A qualidade do golpe. Golpe médio com recuperação correta é execução correta aqui.","v":0,"o":"Padrão de movimentação em X combinando defesa e ataque."},{"c":"MV002","n":"Movimentação em V Ofensivo","f":"MV","e":["L","G","A","C"],"m":"Treinador lança bolas curtas. Jogador avança em diagonal, passa por trás do cone, golpeia em ataque e recupera em diagonal oposta formando o V.","g":"4 séries de 4-8 bolas","r":"Bola de ataque alimentada mais lenta e mais alta.","p":"Alternar bola de ataque e bola neutra sem aviso prévio.","x":"A geometria da entrada em V: entrar na diagonal, não de frente.","i":"O efeito da bola de ataque. Pedir mais spin para ela cair dentro converte ataque em controle.","v":0,"o":"Padrão de deslocamento em V para bolas de ataque."},{"c":"MV003","n":"Movimentação em V Defensivo","f":"MV","e":["L","G","A","C"],"m":"Treinador lança bolas profundas. Jogador recua, passa pela frente do cone, golpeia em defesa (alto e fundo) e recupera em diagonal.","g":"4 séries de 4-8 bolas","r":"Reduzir a profundidade da alimentação; menos bolas por série.","p":"Alimentação mais profunda e angulada, forçando saída em corrida.","x":"A saída do V defensivo e o primeiro passo de retorno.","i":"A escolha entre defesa alta e defesa acelerada. As duas convivem — a função é parar o ataque, não devolver mais uma bola.","v":0,"o":"Padrão de deslocamento em V para bolas defensivas."},{"c":"MV004","n":"Spider Drill - 5 Pontos","f":"MV","e":["V","L","G","A","C"],"m":"5 bolas posicionadas: centro da base, ambos cantos do fundo e ambas posições de rede. Parte do centro, busca cada bola individualmente e retorna. Cronometrar.","g":"4 séries, 90 seg descanso","r":"Reduzir a três pontos e retirar o cronômetro.","p":"Cronometrar e registrar; competir contra a própria marca da semana anterior.","x":"Freada e mudança de direção no ponto de chegada.","i":"O tempo total nas primeiras semanas. Movimento eficiente primeiro; o cronômetro depois.","v":0,"o":"Velocidade, aceleração e mudança de direção."},{"c":"MV005","n":"Skipping Lateral - FH","f":"MV","e":["V","L","G","A","C"],"m":"Jogador faz skipping lateral por linha de 4 cones baixos e ao final executa FH. Foco na velocidade dos pés nos cones e na preparação da raquete ANTES de sair dos cones.","g":"4 séries de 4-6 bolas","r":"Sem bola, apenas o padrão de passos.","p":"Aumentar a distância lateral e a velocidade da alimentação.","x":"Passadas de ajuste curtas antes do contato — o último passo é o que decide o golpe.","i":"O golpe em si. Aqui se corrigem os pés; a raquete espera a sua vez.","v":0,"o":"Coordenação e passadas de ajuste laterais com FH."},{"c":"MV006","n":"Skipping Lateral - BH","f":"MV","e":["V","L","G","A","C"],"m":"Mesmo formato do MV005 com saída pelo BH. Cones levemente deslocados para o lado do BH.","g":"4 séries de 4-6 bolas","r":"Padrão de passos sem bola, em ritmo lento.","p":"Alternância de distância e alimentação sem aviso do lado.","x":"Ajuste final do apoio antes do contato de backhand.","i":"Consistência da bola. Este é um exercício de pés com bola, não de troca.","v":0,"o":"Coordenação e passadas de ajuste com BH."},{"c":"MV007","n":"Zig Zag Frente e Costas","f":"MV","e":["V","L","G","A","C"],"m":"Jogador faz zig zag: entra de frente entre os cones, sai de costas. Ao final executa FH ou BH. 4 cones baixos.","g":"4 séries de 4-6 bolas","r":"Reduzir o número de mudanças de plano por série.","p":"Acrescentar bola após cada zigue-zague, com direção comandada.","x":"Coordenação entre planos de deslocamento — frente, trás e lateral na mesma série.","i":"Velocidade. Coordenação antes de velocidade, sempre.","v":0,"o":"Coordenação para passadas de ajuste em múltiplos planos."},{"c":"MV008","n":"Entrar e Sair - Ajuste de Passadas","f":"MV","e":["L","G","A","C"],"m":"Em rally cruzado, ambos devem sempre entrar ou sair para cada golpe - sem ficar parados nem só deslocar lateralmente.","g":"5-7 min por cruzada","r":"Alimentação de cesta com distância fixa entre as bolas.","p":"Troca livre na cruzada, com o treinador variando a profundidade sem aviso.","x":"O ajuste para frente e para trás — entrar na bola curta e sair da bola profunda.","i":"A direção. Aqui só existe a cruzada; a decisão de direção não está em jogo.","v":0,"o":"Ajuste de passadas para frente e para trás nos golpes de base."},{"c":"MV009","n":"2x1 - Mudança de Direção","f":"MV","e":["G","A","C"],"m":"Jogador A golpeia 2 cruzadas e 1 paralela. Jogador B golpeia somente na cruzada. Alternar papéis.","g":"5-7 min, alternar papéis","r":"Ritmo reduzido; o jogador do lado único define o ritmo.","p":"Aumentar o ritmo e reduzir o tempo entre as bolas.","x":"A mudança de direção sob deslocamento: geometria dos apoios antes da bola.","i":"O cansaço do jogador do lado único. A fadiga é parte do desenho do exercício.","v":0,"o":"Mudança de direção sob pressão de dois golpes para um lado e um para o outro."},{"c":"MV010","n":"1x1 - Ritmo de Mudança","f":"MV","e":["G","A","C"],"m":"Jogador A golpeia 1 cruzada e 1 paralela alternando. Jogador B responde somente cruzado. Ritmo mais alto que o 2x1.","g":"5-7 min, alternar papéis","r":"Reduzir o ritmo e a distância lateral.","p":"Ritmo alto com contagem de trocas antes do erro.","x":"Frequência de passos entre golpes.","i":"Erros que aparecem no fim da série. Eles são informação sobre condicionamento, não sobre técnica.","v":0,"o":"Mudança de direção em ritmo mais alto."},{"c":"MV011","n":"2x2 - Comando pelo FH","f":"MV","e":["G","A","C"],"m":"Jogador A golpeia 2 bolas para cada lado (FH ou BH). Jogador B golpeia somente no centro.","g":"5-7 min, alternar","r":"Reduzir a exigência de deslocamento do jogador comandado.","p":"Comando livre, com o jogador do FH decidindo a direção em tempo real.","x":"A posição de espera que permite o FH invertido.","i":"O backhand do jogador que comanda. Neste exercício ele não existe.","v":0,"o":"Comando tático usando FH para dois lados."},{"c":"MV012","n":"Corrida FH - Cruzada","f":"MV","e":["L","G","A","C"],"m":"Jogador simula BH e recebe FH na corrida. Bola golpeada na cruzada: funda, plana, sem ângulo excessivo.","g":"6 séries de 4 bolas","r":"Reduzir a distância da corrida; alimentação mais lenta.","p":"Duas bolas em corrida seguidas antes da saída cruzada.","x":"O apoio externo na saída e o equilíbrio no contato em corrida.","i":"A profundidade. Bola em corrida raramente é profunda — exigir isso quebra o equilíbrio do golpe.","v":0,"o":"FH na corrida com saída para a cruzada profunda."},{"c":"MV013","n":"Corrida BH - Cruzada","f":"MV","e":["L","G","A","C"],"m":"Jogador simula FH e recebe BH na corrida. Bola cruzada, funda, sem ângulo excessivo.","g":"6 séries de 4 bolas","r":"Distância reduzida e alimentação alta.","p":"Corrida mais longa com recuperação imediata para a bola seguinte.","x":"Equilíbrio no contato e o apoio de freada.","i":"A altura da bola de saída. Bola alta na corrida é a resposta correta — ganha tempo.","v":0,"o":"BH na corrida com saída para a cruzada profunda."},{"c":"MV014","n":"Corrida FH - Paralela","f":"MV","e":["G","A","C"],"m":"Jogador simula BH e recebe FH na corrida. Bola golpeada na paralela: timing de contato mais cedo que o normal.","g":"6 séries de 4 bolas","r":"Reduzir a distância e alimentar bola mais alta.","p":"Corrida em velocidade real com alvo estreito na paralela.","x":"Fechamento do ombro em desequilíbrio — a paralela em corrida exige mais rotação, não menos.","i":"A taxa de erro. Paralela em corrida é jogada de risco assumido.","v":0,"o":"FH na corrida com saída para a paralela."},{"c":"MV015","n":"Corrida BH - Paralela","f":"MV","e":["G","A","C"],"m":"Jogador simula FH e recebe BH na corrida para a paralela. Timing preciso essencial para dois mãos.","g":"6 séries de 4 bolas","r":"Alimentação lenta e distância curta.","p":"Corrida longa com saída paralela e recuperação para a bola seguinte.","x":"Estabilidade do tronco no contato fora de equilíbrio.","i":"A comparação com a versão de forehand. São golpes diferentes com exigências diferentes.","v":0,"o":"BH na corrida com saída para a paralela."},{"c":"MV016","n":"Figura 8","f":"MV","e":["L","G","A","C"],"m":"Dois cones posicionados. Jogador percorre figura 8 ao redor dos cones, recebendo FH no cone esquerdo e BH no direito.","g":"4 séries de 8 bolas","r":"Reduzir para quatro bolas e ampliar o intervalo.","p":"Aumentar o ritmo e acrescentar variação de altura.","x":"A curva do deslocamento — a figura 8 se perde quando o jogador anda em linha reta.","i":"A qualidade técnica dos golpes. O desenho do deslocamento é o objeto aqui.","v":0,"o":"Padrão de movimentação em figura 8 com golpes em ambos os lados."},{"c":"MV017","n":"Laterais com Escadinha - FH","f":"MV","e":["V","L","G","A","C"],"m":"Jogador percorre escadinha lateral e ao final executa FH. Velocidade máxima na escadinha, desaceleração controlada antes do golpe.","g":"4 séries de 6 bolas","r":"Escadinha sem bola; depois escadinha com bola alimentada parada.","p":"Escadinha em velocidade máxima seguida de golpe em deslocamento lateral.","x":"Transição da escadinha para o primeiro passo de aproximação da bola.","i":"A execução da escadinha em si depois que o padrão está estabelecido — o que interessa é a saída dela.","v":0,"o":"Coordenação de pés laterais com escadinha e finalização de FH."},{"c":"MV018","n":"Laterais com Escadinha - BH","f":"MV","e":["V","L","G","A","C"],"m":"Mesmo formato do MV017 com BH. Atletas destros tendem a ter mais dificuldade neste lado.","g":"4 séries de 6 bolas","r":"Padrão de escadinha isolado, sem finalização.","p":"Escadinha rápida com finalização de backhand em bola em movimento.","x":"A saída da escadinha para o apoio de golpe.","i":"Erros do golpe final nas primeiras séries. O foco é a transição.","v":0,"o":"Coordenação de pés laterais com escadinha e finalização de BH."},{"c":"MV019","n":"Defesa e Transição para Ataque","f":"MV","e":["G","A","C"],"m":"Treinador lança 2 bolas profundas (defesa) seguidas de 1 bola curta (transição). Jogador deve reconhecer a mudança e acelerar na bola de transição.","g":"4 séries de 6 bolas","r":"Separar as duas fases: primeiro a defesa, depois o ataque, em séries distintas.","p":"Sequência contínua com número variável de bolas defensivas antes da virada.","x":"O momento da virada — quando a bola do adversário permite sair da defesa.","i":"A execução do golpe de ataque. Aqui se corrige o reconhecimento do momento, não o golpe.","v":0,"o":"Transição da posição defensiva para a ofensiva em sequência."},{"c":"MV020","n":"Triângulo - 3 Posições de Quadra","f":"MV","e":["L","G","A","C"],"m":"3 cones em triângulo. Treinador sinaliza e jogador corre para a posição correspondente. Ao chegar, executa o golpe adequado para aquela posição.","g":"4 séries de 9 movimentações","r":"Reduzir a duas posições; retirar a pressão de tempo.","p":"Acrescentar bola em cada posição e cronometrar o circuito.","x":"Transição entre as três alturas de quadra — base, meia quadra e rede exigem apoios diferentes.","i":"O golpe executado em cada posição. O objeto é o trânsito entre elas.","v":0,"o":"Agilidade entre 3 posições táticas: base, meia quadra e rede."},{"c":"MV021","n":"Split Step - Timing de Reação","f":"MV","e":["V","L","G","A","C"],"m":"Treinador executa golpe. No momento exato do contato, jogador faz split step. Repetir com variação de posição.","g":"3 séries de 20 repetições","r":"Split step sem bola, no comando de voz do treinador.","p":"Split step com bola em velocidade real e direção imprevisível.","x":"O instante do split — ele acontece no contato do adversário, não depois.","i":"A altura do salto. Split step alto é split step lento.","v":0,"o":"Timing correto do split step em relação ao contato do adversário."},{"c":"MV022","n":"Recuperação Lateral Rápida","f":"MV","e":["G","A","C"],"m":"Treinador lança série de bolas alternando entre os dois lados extremos. Jogador deve recuperar o máximo possível entre golpes. Intensidade alta.","g":"4 séries de 6 bolas, 60 seg descanso","r":"Reduzir a amplitude do deslocamento defensivo.","p":"Duas recuperações extremas consecutivas antes do fim da série.","x":"O passo cruzado de saída da posição extrema.","i":"A qualidade da bola defensiva. Sair viva já é o resultado.","v":0,"o":"Velocidade de recuperação lateral após golpes defensivos extremos."},{"c":"MV023","n":"Avanço Diagonal - FH","f":"MV","e":["L","G","A","C"],"m":"Treinador alimenta bolas curtas em diagonal. Jogador avança em diagonal, executa FH approach profundo e sobe à rede.","g":"6 séries de 6 approaches J","r":"Bola curta alimentada com o jogador já em movimento.","p":"Bola curta imprevisível, alimentada durante uma troca.","x":"A diagonal de entrada — avanço em linha reta chega atrasado.","i":"O golpe de approach. O objeto é a trajetória do deslocamento.","v":0,"o":"Avanço diagonal em direção a bola curta com FH."},{"c":"MV024","n":"Avanço Diagonal - BH","f":"MV","e":["L","G","A","C"],"m":"Mesma estrutura do MV023 com BH. O avanço diagonal para o BH é menos natural para a maioria dos atletas.","g":"6 séries de 6 approaches J","r":"Alimentação parada em meia quadra.","p":"Bola curta surpresa dentro de uma troca cruzada.","x":"A entrada diagonal pelo lado do backhand e o apoio no contato.","i":"A comparação de eficiência com o lado do forehand. São entradas diferentes.","v":0,"o":"Avanço diagonal em direção a bola curta com BH."},{"c":"MV025","n":"Quadra Inteira - Cobertura Total","f":"MV","e":["G","A","C"],"m":"Treinador lança 6 bolas em ordem imprevisível: 2 cruzadas, 2 paralelas, 1 curta, 1 lob. Jogador cobre todas.","g":"4 séries de 6 bolas, 90 seg descanso","r":"Reduzir para quatro bolas por série e ampliar o descanso.","p":"Seis bolas em máxima amplitude com descanso reduzido.","x":"Economia de deslocamento — quem cobre a quadra inteira o faz com menos passos, não com mais velocidade.","i":"Erros técnicos sob fadiga extrema. Eles são o custo da carga e não indicam lacuna técnica.","v":0,"o":"Cobrir toda a quadra em sequência de alta intensidade."},{"c":"PDB001","n":"Mudança de Direção - FH","f":"PDB","e":["G","A","C"],"m":"Jogador a direita recebe 4 bolas alternando cruzada e paralela de FH. Trajetória plana, spin mínimo, transferir peso para frente.","g":"6-8 séries de 4 bolas","r":"Duas bolas por série com alimentação mais lenta.","p":"Seis bolas com alimentação em ritmo real e alvo estreito.","x":"Transferência de peso para frente e trajetória plana da bola.","i":"O efeito. Este é um exercício de bola plana — pedir mais topspin descaracteriza o objetivo.","v":0,"o":"FH com trajetória plana e mudança de direção."},{"c":"PDB002","n":"Mudança de Direção - BH","f":"PDB","e":["G","A","C"],"m":"Jogador a esquerda recebe 4 bolas alternando cruzada e paralela de BH. Mesmo princípio: entrar, transferir, trajetória plana.","g":"6-8 séries de 4 bolas","r":"Alimentação parada, sem deslocamento entre as bolas.","p":"Ritmo alto com mudança de direção comandada em tempo real.","x":"Estabilidade do apoio na mudança de direção do backhand.","i":"A profundidade. Velocidade da bola no ar é a medida aqui.","v":0,"o":"BH com trajetória plana e mudança de direção."},{"c":"PDB003","n":"Mudança de Direção - Centro FH","f":"PDB","e":["G","A","C"],"m":"Jogador no centro recebe 4 bolas alternando entre os dois cantos com FH. Trajetória plana, retornar ao cone central.","g":"6-8 séries de 4 bolas","r":"Alternância previsível entre os dois cantos.","p":"Cantos definidos por comando do treinador durante a série.","x":"A posição de espera central que permite atender aos dois lados.","i":"A recuperação perfeita ao centro. Em bola de pressão a recuperação é parcial e isso é correto.","v":0,"o":"FH para os dois cantos a partir do centro."},{"c":"PDB004","n":"Corrida FH - Saída Cruzada","f":"PDB","e":["G","A","C"],"m":"Simula BH, recebe FH na corrida. Bola cruzada, plana, profunda, sem ângulo excessivo.","g":"6-8 séries de 4 bolas","r":"Corrida curta com alimentação alta.","p":"Corrida longa em ritmo real, com recuperação para a bola seguinte.","x":"O apoio externo de freada e o equilíbrio no contato.","i":"A profundidade da saída cruzada em corrida máxima.","v":0,"o":"FH na corrida com saída para a cruzada profunda."},{"c":"PDB005","n":"Corrida BH - Saída Cruzada","f":"PDB","e":["G","A","C"],"m":"Simula FH, recebe BH na corrida. Bola cruzada, plana, profunda.","g":"6-8 séries de 4 bolas","r":"Distância reduzida; bola mais alta.","p":"Corrida longa com duas bolas consecutivas.","x":"Estabilidade do tronco no backhand em deslocamento.","i":"A velocidade da bola de saída. Em corrida, entrar já é o resultado.","v":0,"o":"BH na corrida com saída para a cruzada profunda."},{"c":"PDB006","n":"Corrida FH - Saída Paralela","f":"PDB","e":["G","A","C"],"m":"Simula BH, recebe FH na corrida. Timing de contato mais cedo que o normal.","g":"6-8 séries de 4 bolas","r":"Corrida curta com alvo amplo.","p":"Corrida máxima com alvo estreito na paralela.","x":"Fechamento do ombro em desequilíbrio — a paralela exige mais rotação.","i":"A taxa de erro. Paralela em corrida é jogada de risco assumido.","v":0,"o":"FH na corrida com saída para a paralela."},{"c":"PDB007","n":"Corrida BH - Saída Paralela","f":"PDB","e":["G","A","C"],"m":"Simula FH, recebe BH na corrida para paralela. Quadris devem rodar completamente.","g":"6-8 séries de 4 bolas","r":"Alimentação lenta e distância curta.","p":"Ritmo real com recuperação obrigatória após a saída.","x":"Extensão do braço na direção da paralela sem abrir o ombro cedo.","i":"A comparação com a paralela de forehand.","v":0,"o":"BH na corrida com saída para a paralela."},{"c":"PDB008","n":"Corrida FH Cruzada mais Mudança Paralela","f":"PDB","e":["G","A","C"],"m":"Corre para FH cruzado na corrida, recupera, recebe mais uma bola para FH paralelo.","g":"6-8 séries de 4 bolas","r":"Separar em dois exercícios: primeiro a corrida, depois a mudança.","p":"Sequência contínua em ritmo real com alvo estreito.","x":"A recuperação entre a corrida e a mudança — é ela que viabiliza a segunda bola.","i":"O erro da bola de mudança. É a bola de maior exigência do padrão.","v":0,"o":"Corrida FH cruzado mais mudança para paralela."},{"c":"PDB009","n":"Corrida BH mais Inside In","f":"PDB","e":["G","A","C"],"m":"BH na corrida cruzado, recuperação, FH inside in como finalização.","g":"6-8 séries de 4 bolas","r":"Bola de inside in alimentada de posição fixa.","p":"Sequência completa em ritmo real, com o ponto disputado após.","x":"O deslocamento lateral que abre espaço para o forehand invertido.","i":"A velocidade do backhand de abertura.","v":0,"o":"BH cruzado na corrida mais inside in."},{"c":"PDB010","n":"Abertura Centro FH mais Inside Out","f":"PDB","e":["G","A","C"],"m":"FH próximo ao centro abre pela cruzada; em seguida bola central para inside out. Ambas planas.","g":"6-8 séries de 6 bolas","r":"Quatro bolas por série com alimentação lenta.","p":"Seis bolas em ritmo real com adversário ativo.","x":"A posição que torna o inside out disponível.","i":"A recuperação central completa entre as bolas.","v":0,"o":"FH cruzado e pressão com inside out."},{"c":"PDB011","n":"Abertura FH Cruzado mais Mudança","f":"PDB","e":["G","A","C"],"m":"FH cruzado profundo para deslocar mais bola mais central para mudança de direção.","g":"6-8 séries de 6 bolas","r":"Mudança anunciada antes da série.","p":"Momento da mudança decidido pelo jogador.","x":"O reconhecimento da bola que autoriza a mudança de direção.","i":"Qual bola foi escolhida para mudar, quando a geometria do deslocamento estava correta.","v":0,"o":"FH cruzado e mudança de direção."},{"c":"PDB012","n":"Abertura BH Cruzado mais FH Final","f":"PDB","e":["G","A","C"],"m":"BH cruzado para deslocar mais bola central para FH finalizar.","g":"6-8 séries de 6 bolas","r":"Bola de finalização alimentada pelo treinador.","p":"Padrão completo em ritmo real com adversário defendendo.","x":"A transição do backhand de construção para o forehand de finalização.","i":"O erro da finalização. Decisão certa, execução errada: corrige-se contato ou apoio.","v":0,"o":"BH cruzado e finalização com FH."},{"c":"PDB013","n":"Abertura FH mais Approach Paralela","f":"PDB","e":["G","A","C"],"m":"FH cruzado fundo mais bola curta cruzada para approach pela paralela subindo a rede.","g":"6-8 séries de 6 bolas J","r":"Approach alimentado, sem a fase de abertura.","p":"Padrão completo seguido de voleio e ponto disputado.","x":"A continuidade do deslocamento entre a abertura e o approach.","i":"A potência do approach. Approach é bola de posicionamento.","v":0,"o":"FH cruzado mais approach pela paralela."},{"c":"PDB014","n":"Abertura Inside Out mais Approach BH","f":"PDB","e":["G","A","C"],"m":"FH inside out mais bola curta cruzada para BH approach e subida à rede.","g":"6-8 séries de 6 bolas J","r":"Inside out alimentado de posição fixa.","p":"Sequência completa com voleio de finalização.","x":"A leitura da bola curta que autoriza o approach de backhand.","i":"A direção do approach nas primeiras séries.","v":0,"o":"Inside out e approach de BH para a rede."},{"c":"PDB015","n":"Abertura FH mais Approach Central","f":"PDB","e":["G","A","C"],"m":"FH cruzado fundo mais bola curta central para FH approach no lado oposto.","g":"6-8 séries de 6 bolas J","r":"Approach central alimentado isoladamente.","p":"Sequência completa com adversário buscando a passada.","x":"A altura baixa do approach central e a chegada à rede.","i":"O ângulo. Approach central existe justamente para não dar ângulo.","v":0,"o":"FH cruzado mais approach central."},{"c":"PDB016","n":"Inside Out mais Approach Central","f":"PDB","e":["G","A","C"],"m":"Inside out como abertura mais bola curta central para FH approach.","g":"6-8 séries de 6 bolas J","r":"Separar inside out e approach em séries distintas.","p":"Sequência contínua com ponto disputado na rede.","x":"O encadeamento entre o forehand invertido e a entrada para a rede.","i":"A qualidade do voleio final.","v":0,"o":"Inside out e approach central pelo FH."},{"c":"PDB017","n":"Inside Out mais Inside In mais Rede","f":"PDB","e":["A","C"],"m":"Inside out mais inside in já avançando a rede. Ambas as bolas rápidas.","g":"6-8 séries de 6 bolas","r":"Duas bolas em vez de três; sem a chegada à rede.","p":"Sequência completa em ritmo real com adversário defendendo.","x":"A manutenção do equilíbrio entre dois forehands agressivos consecutivos.","i":"O erro no terceiro tempo. É o padrão de maior carga técnica da série.","v":0,"o":"Dois FH agressivos e chegada à rede."},{"c":"PDR001","n":"Subida FH Paralela mais Voleio BH","f":"PDR","e":["G","A","C"],"m":"Bola curta, approach FH paralelo, voleio BH no lado oposto. Subida em movimento, split step antes do voleio.","g":"6-8 séries de 4 subidas J","r":"Approach alimentado com o jogador já em meia quadra.","p":"Ponto disputado após o voleio, com adversário buscando a passada.","x":"A sequência fluida entre approach, deslocamento e split step.","i":"A qualidade do approach quando o split step aconteceu no tempo certo.","v":0,"o":"Finalização na rede com voleio BH após approach FH paralelo."},{"c":"PDR002","n":"Subida FH Paralela mais Voleio FH","f":"PDR","e":["G","A","C"],"m":"Mesma subida do PDR001 com voleio FH. Foco em colocação, não potência.","g":"6-8 séries de 4 subidas J","r":"Approach parado; voleio alimentado com a mão.","p":"Sequência em velocidade real com direção do voleio comandada.","x":"A cobertura do lado do forehand após o approach paralelo.","i":"A direção do voleio nas primeiras séries.","v":0,"o":"Finalização com voleio FH após approach FH paralelo."},{"c":"PDR003","n":"Subida BH Paralela mais Voleio FH","f":"PDR","e":["G","A","C"],"m":"Approach BH paralelo, voleio FH no lado oposto. Split step preciso após o approach de BH.","g":"6-8 séries de 4 subidas J","r":"Bola curta alimentada de cesta em meia quadra.","p":"Sequência completa com passada real do adversário.","x":"O deslocamento diagonal após o approach de backhand.","i":"A comparação de rendimento com o approach de forehand.","v":0,"o":"Finalização com voleio FH após approach BH paralelo."},{"c":"PDR004","n":"Subida BH Paralela mais Voleio BH","f":"PDR","e":["G","A","C"],"m":"Approach BH paralelo, voleio BH. Exige bom posicionamento pós-approach.","g":"6-8 séries de 4 subidas J","r":"Voleio alimentado sem approach prévio.","p":"Sequência completa com dois voleios antes da finalização.","x":"A firmeza do punho no voleio de backhand em movimento.","i":"A profundidade do voleio. Voleio de finalização é ângulo, não profundidade.","v":0,"o":"Finalização com voleio BH após approach BH paralelo."},{"c":"PDR005","n":"Subida FH Central Esq mais Voleio BH","f":"PDR","e":["G","A","C"],"m":"Bola curta no centro, approach FH pelo lado esquerdo, voleio BH no lado oposto.","g":"6-8 séries de 4 subidas J","r":"Approach central alimentado, sem deslocamento prévio.","p":"Sequência completa com ponto disputado.","x":"A posição de cobertura na rede após approach pelo centro.","i":"O ângulo do approach. Approach central não abre ângulo por definição.","v":0,"o":"Approach FH pelo lado esquerdo, voleio BH."},{"c":"PDR006","n":"Subida FH Central Esq mais Voleio FH","f":"PDR","e":["G","A","C"],"m":"Mesma subida do PDR005 com voleio FH. Versão avançada: treinador decide o voleio no momento da subida.","g":"6-8 séries de 4 subidas J","r":"Alimentação parada em meia quadra.","p":"Ritmo real com direção do voleio decidida em tempo real.","x":"A antecipação da direção da passada do adversário.","i":"Erros de leitura nas primeiras séries. A leitura se constrói por repetição distribuída.","v":0,"o":"Approach FH pelo lado esquerdo, voleio FH."},{"c":"PDR007","n":"Subida FH Central Dir mais Voleio BH","f":"PDR","e":["G","A","C"],"m":"Bola curta no centro, approach FH pelo lado direito, voleio BH no lado oposto.","g":"6-8 séries de 4 subidas J","r":"Approach alimentado; voleio com bola lançada de mão.","p":"Sequência em velocidade real com adversário ativo.","x":"O deslocamento cruzado até a posição de voleio de backhand.","i":"A qualidade do approach quando a chegada à rede aconteceu no tempo.","v":0,"o":"Approach FH pelo lado direito, voleio BH."},{"c":"PDR008","n":"Subida FH Central Dir mais Voleio FH","f":"PDR","e":["G","A","C"],"m":"Bola curta no centro, approach FH pelo lado direito, voleio FH. Completa o ciclo de 8 combinações PDR.","g":"6-8 séries de 4 subidas J","r":"Separar approach e voleio em séries distintas.","p":"Ciclo completo com dois voleios e smash de finalização.","x":"O encadeamento inteiro do ciclo, sem parada entre as fases.","i":"Erros isolados de cada fase. O objeto deste exercício é a continuidade.","v":0,"o":"Ciclo completo: approach FH direito, voleio FH."},{"c":"PDS001","n":"Saque mais 1 Bola DC","f":"PDS","e":["G","A","C"],"m":"Saque mais 1ª bola com decisão tática. Posição do saque e da 1ª bola variam. Decisão ANTES do saque.","g":"8-12 séries de 2 bolas","r":"Saque à meia velocidade; direção da primeira bola anunciada.","p":"Saque real com o ponto disputado após a primeira bola.","x":"A decisão tomada antes do saque e a recuperação para dentro da quadra.","i":"O percentual de primeiro saque. O objeto é o encadeamento saque–primeira bola.","v":0,"o":"Abertura do ponto no DC."},{"c":"PDS002","n":"Saque mais 1 Bola AC","f":"PDS","e":["G","A","C"],"m":"Mesmo formato do PDS001 no AC. Saque aberto vai para o BH do adversário.","g":"8-12 séries de 2 bolas","r":"Alvo do saque ampliado.","p":"Alvo estreito com registro do percentual do padrão completo.","x":"A adaptação da geometria do padrão ao lado da vantagem.","i":"A transposição direta do padrão do lado da igualdade.","v":0,"o":"Abertura do ponto no AC."},{"c":"PDS003","n":"DC Aberto - FH Centro - Inside","f":"PDS","e":["A","C"],"m":"Saque aberto, 1ª bola central de FH, 2a bola inside out ou in como finalização.","g":"8-12 séries de 3 bolas","r":"Duas bolas em vez de três; decisão anunciada.","p":"Três bolas com decisão em tempo real na terceira.","x":"A posição de espera que mantém as duas saídas — inside out e inside in — disponíveis.","i":"Qual das duas saídas foi escolhida. Ambas são corretas se a leitura estava certa.","v":0,"o":"Saque aberto DC, FH centro, inside out ou in."},{"c":"PDS004","n":"DC Aberto - FH Direito - Inside In","f":"PDS","e":["A","C"],"m":"Saque aberto, 1ª bola FH direito, inside in como finalização.","g":"8-12 séries de 3 bolas","r":"Alimentação da segunda bola pelo treinador.","p":"Padrão completo com adversário defendendo de verdade.","x":"O fechamento do ombro no inside in.","i":"O erro para fora do inside in. É o tiro mais estreito do padrão.","v":0,"o":"Saque aberto DC, FH direito, inside in."},{"c":"PDS005","n":"DC Aberto - FH Cruzado - BH/Inside Out","f":"PDS","e":["A","C"],"m":"Saque aberto, FH cruzado, BH cruzado ou inside out como finalização.","g":"8-12 séries de 3 bolas","r":"Finalização única e anunciada.","p":"Finalização escolhida em tempo real entre as duas opções.","x":"A leitura da posição do adversário após o forehand cruzado.","i":"A opção escolhida, quando a leitura estava correta.","v":0,"o":"Saque aberto DC, FH cruzado, finalização variada."},{"c":"PDS006","n":"DC Aberto - BH - FH/Inside In","f":"PDS","e":["A","C"],"m":"Saque aberto, BH, FH cruzado ou inside in. Saque abre, BH transita, FH finaliza.","g":"8-12 séries de 3 bolas","r":"Sequência com bolas alimentadas de posição fixa.","p":"Ritmo real com o ponto disputado após a terceira bola.","x":"A transição do backhand para o forehand de finalização.","i":"O erro da bola de finalização, quando o padrão foi construído corretamente.","v":0,"o":"Saque aberto DC, BH, finalização com FH."},{"c":"PDS007","n":"DC Fechado - BH - FH/Inside In","f":"PDS","e":["A","C"],"m":"Saque no T, 1ª bola BH, FH cruzado ou inside in.","g":"8-12 séries de 3 bolas","r":"Duas bolas com direção anunciada.","p":"Três bolas com decisão livre e adversário ativo.","x":"A adaptação ao ângulo do saque fechado.","i":"A velocidade do saque. Saque fechado vive de posicionamento.","v":0,"o":"Saque fechado DC, BH, finalização variada."},{"c":"PDS008","n":"DC Fechado - BH - FH Variação","f":"PDS","e":["A","C"],"m":"Mesma estrutura do PDS007 com decisão em tempo real na 3a bola.","g":"8-12 séries de 3 bolas","r":"Variação suprimida: uma única finalização por série.","p":"Decisão livre na terceira bola, com registro do que foi escolhido.","x":"O tempo da decisão na terceira bola.","i":"A variante escolhida. O que se observa é se a decisão foi tomada a tempo.","v":0,"o":"Variação com decisão tática na 3a bola."},{"c":"PDS009","n":"DC Fechado - BH - BH Cruzado/Inside Out","f":"PDS","e":["A","C"],"m":"Saque no T, BH, BH cruzado ou inside out como finalização.","g":"8-12 séries de 3 bolas","r":"Bolas alimentadas com direção fixa.","p":"Sequência real com adversário deslocando de verdade.","x":"A sustentação da qualidade em dois backhands consecutivos.","i":"A velocidade do primeiro backhand. Ele constrói, não finaliza.","v":0,"o":"Saque fechado DC, sequência de dois BH."},{"c":"PDS010","n":"DC Fechado - BH - BH Paralelo/Inside In","f":"PDS","e":["A","C"],"m":"Saque no T, BH, BH paralelo ou inside in. BH como arma de abertura E finalização.","g":"8-12 séries de 3 bolas","r":"Alvo ampliado na paralela de backhand.","p":"Alvo estreito com ponto disputado após a finalização.","x":"A rotação completa do quadril na paralela de backhand.","i":"A taxa de erro. A paralela de backhand é o tiro de menor margem do repertório.","v":0,"o":"Saque fechado DC, finalização pela paralela de BH."},{"c":"PDS011","n":"DC Fechado - FH Central - BH/Inside Out","f":"PDS","e":["A","C"],"m":"Saque no T, FH central cruzado, BH cruzado ou inside out.","g":"8-12 séries de 3 bolas","r":"Finalização única e anunciada.","p":"Finalização decidida em tempo real.","x":"O forehand central como bola que retira ângulo do adversário.","i":"A profundidade da bola central quando ela cumpriu a função de neutralizar.","v":0,"o":"Saque fechado DC, FH central, finalização variada."},{"c":"PDS012","n":"DC Fechado - FH Central - Inside In/Out","f":"PDS","e":["A","C"],"m":"Saque no T, FH central, inside in ou inside out. O mais tecnicamente exigente da série PDS.","g":"8-12 séries de 3 bolas","r":"Uma das duas saídas por série.","p":"Escolha em tempo real com adversário se reposicionando.","x":"A posição do corpo que mantém as duas saídas disponíveis.","i":"Qual saída foi escolhida. O critério é a leitura, não a opção.","v":0,"o":"Saque fechado DC, FH central, inside in ou out."},{"c":"RT001","n":"Chega antes da bola","f":"RT","e":["V","L","G","A"],"m":"Alvo no chão marcando onde os pés devem estar antes do quique.","g":"3 × 10","r":"bola mais lenta e alta","p":"bola mais rápida e profunda","x":"antecipação da saída","i":"o golpe","v":1,"o":""},{"c":"RT002","n":"Contato no topo","f":"RT","e":["L","G","A","C"],"m":"Golpear no instante em que a bola para no ar após o quique.","g":"4 × 10","r":"bola alta e lenta","p":"bola com efeito e profunda","x":"momento do contato","i":"direção e profundidade","v":1,"o":""},{"c":"RT003","n":"Um passo para dentro","f":"RT","e":["L","G","A","C"],"m":"A cada bola da troca, a base avança cerca de 30 cm para dentro da quadra.","g":"3 séries de troca até 8 bolas","r":"avanço a cada duas bolas","p":"avanço obrigatório a cada bola","x":"ganho de terreno mantendo equilíbrio","i":"erros por falta de tempo nas primeiras sessões","v":1,"o":""},{"c":"RT004","n":"Bola curta é convite","f":"RT","e":["V","L","G","A","C"],"m":"Bola curta do professor; entrar e finalizar à frente.","g":"4×8","r":"bola mais alta e central","p":"bola curta com efeito e ângulo","x":"decisão de entrar e ponto de contato","i":"o resultado da bola","v":1,"o":""},{"c":"RT005","n":"Duas alturas, mesmo alvo","f":"RT","e":["L","G","A","C"],"m":"Mesma direção com trajetória alta e depois direta; comparar o tempo de resposta do parceiro.","g":"2 × 10 de cada","r":"sem comparação, só executar","p":"o parceiro relata a diferença percebida","x":"compreensão do conceito","i":"consistência","v":1,"o":""},{"c":"RT006","n":"Meia quadra permanente","f":"RT","e":["G","A","C"],"m":"Trocar de dentro da linha de base durante toda a série.","g":"3 × 8 bolas","r":"sobre a linha","p":"um metro para dentro","x":"preparação encurtada compatível com o tempo","i":"número de erros","v":1,"o":""},{"c":"RT007","n":"Devolução que rouba tempo","f":"RT","e":["G","A","C"],"m":"Devolver na subida do quique, sem exceção.","g":"3 × 10","r":"apenas segundo saque","p":"primeiro saque","x":"posição de espera e primeiro passo","i":"profundidade","v":1,"o":""},{"c":"RT008","n":"Defesa acelerada","f":"RT","e":["G","C"],"m":"Na corrida, acelerar a cruzada em vez de levantar a bola.","g":"3×8","r":"bola menos aberta","p":"bola muito aberta com pressão","x":"estabilização e aceleração sob desequilíbrio","i":"taxa de acerto inicial","v":1,"o":""},{"c":"RT009","n":"As duas defesas","f":"RT","e":["G","A","C"],"m":"Alternar defesa alta e defesa acelerada, por chamada do professor durante o ponto.","g":"4 × 6 pontos","r":"alternância anunciada antes","p":"chamada durante o deslocamento","x":"capacidade de escolher a opção pedida","i":"qualidade fina de cada uma","v":1,"o":""},{"c":"RT010","n":"Variação como redução","f":"RT","e":["G","A","C"],"m":"Alternar ritmo, altura e efeito para tirar a referência de tempo do parceiro.","g":"3 × 10","r":"duas variáveis","p":"as quatro variáveis","x":"intenção de tirar referência, não de acertar mais","i":"consistência","v":1,"o":""},{"c":"RT011","n":"Split antecipado","f":"RT","e":["L","G","A","C"],"m":"Iniciar o salto lendo o corpo do parceiro, não a bola.","g":"3 × 12","r":"parceiro exagera o gesto","p":"parceiro disfarça","x":"olhar no corpo do outro após o próprio contato","i":"o golpe seguinte","v":1,"o":""},{"c":"RT012","n":"Corta o tempo na subida","f":"RT","e":["G","C"],"m":"Subir à rede em bola que normalmente não pediria subida.","g":"3×6","r":"bola claramente curta","p":"bola neutra","x":"posição alcançada antes do golpe adversário","i":"ponto ganho ou perdido","v":1,"o":""},{"c":"RT013","n":"Braço solto, bola rápida","f":"RT","e":["L","G","A","C"],"m":"Séries alternando esforço percebido (50%, 70%, máximo); comparar velocidade e regularidade.","g":"3 × 8 em cada nível","r":"dois níveis de esforço","p":"medir com radar ou cronometrar","x":"percepção de que solto produz mais que forçado","i":"direção","v":1,"o":""},{"c":"RT014","n":"Terreno ganho por ponto","f":"RT","e":["G","C"],"m":"Registrar quantos metros o jogador avançou ao longo do ponto.","g":"10 pontos com registro","r":"registro apenas do ponto final","p":"meta de avanço por ponto","x":"consciência de posição","i":"técnica","v":1,"o":""},{"c":"TR001","n":"Trilho de ganho de quadra","f":"TR","e":["L","G","A","C"],"m":"Combinado: três bolas fundas cruzadas, e a cada uma o jogador avança meio metro. Marque com cones as três posições de avanço. O parceiro devolve sempre fundo e cruzado.","g":"3 séries de 9 bolas","r":"Duas bolas em vez de três; o parceiro alimenta de cesto em vez de trocar.","p":"O avanço é decidido pelo jogador conforme a bola do outro, sem cones.","x":"A profundidade da bola. É ela que compra o metro — não a velocidade.","i":"A qualidade técnica do golpe. O objeto é o terreno ganho, e ele se mede nos pés.","v":0,"o":"Avançar terreno metro a metro, com o adversário recuando a cada bola."},{"c":"TR002","n":"Trilho de negação de ângulo","f":"TR","e":["G","A","C"],"m":"Combinado: o parceiro joga uma bola angulada; o jogador responde funda ao centro; o parceiro devolve sem ângulo; o jogador escolhe o lado. Quatro bolas, sempre iguais.","g":"3 séries de 8 pontos","r":"O parceiro angula sempre para o mesmo lado.","p":"O parceiro escolhe o lado do ângulo; o jogador reconhece e neutraliza.","x":"A altura sobre a rede na bola central. Sem altura, ela não chega funda.","i":"A ausência de brilho da jogada. A bola central é a mais subestimada e a mais eficaz.","v":0,"o":"Tirar do adversário a possibilidade de abrir a quadra."},{"c":"TR003","n":"Trilho da bola que autoriza","f":"TR","e":["L","G","A","C"],"m":"Treinador alimenta três tipos de bola em ordem aleatória: funda e alta, curta e lenta, profunda e rápida. O jogador diz em voz alta 'neutra', 'ataque' ou 'defesa' antes de bater.","g":"4 séries de 10 bolas","r":"Duas categorias apenas: ataque e não-ataque.","p":"Sem falar em voz alta; a resposta aparece na escolha do golpe.","x":"A correspondência entre o que ele nomeou e o que ele jogou.","i":"O erro da bola. O objeto é o reconhecimento, e ele acontece antes do contato.","v":0,"o":"Reconhecer, antes de preparar, se a bola é de neutro, de ataque ou de defesa."},{"c":"TR004","n":"Trilho de virada da quadra","f":"TR","e":["G","A","C"],"m":"Combinado: duas bolas cruzadas do lado não dominante, terceira bola do parceiro para o meio, o jogador contorna e joga inside out. Sempre a mesma sequência.","g":"3 séries de 8 sequências","r":"O parceiro joga a terceira bola sempre no mesmo ponto do meio.","p":"O parceiro varia: às vezes a bola vem ao meio, às vezes fica no canto. O jogador decide.","x":"A posição dos pés que viabiliza o contorno — ela acontece antes da bola chegar.","i":"A velocidade do inside out. O objeto é a leitura da bola que permite virar.","v":0,"o":"Contornar para o lado dominante a partir da bola que já veio ao meio."},{"c":"TR005","n":"Trilho de forçar a bola curta","f":"TR","e":["G","A","C"],"m":"Combinado: duas bolas fundas com altura, obrigando o parceiro a recuar; na terceira ele devolve obrigatoriamente curta; o jogador entra e ataca de meia quadra.","g":"3 séries de 8 sequências","r":"O parceiro entrega a bola curta sem as duas fundas anteriores.","p":"O parceiro decide quando encurtar; o jogador precisa reconhecer e entrar.","x":"A altura e a profundidade das duas primeiras bolas. São elas que produzem a terceira.","i":"O erro do ataque final. Se as duas primeiras bolas empurraram, o trilho funcionou.","v":0,"o":"Produzir a bola curta em vez de esperar por ela."},{"c":"TR006","n":"Trilho de transição defesa-ataque","f":"TR","e":["G","A","C"],"m":"Combinado: treinador alimenta uma bola profunda que empurra o jogador para trás; ele responde alta e funda ao centro; o treinador alimenta uma bola média; o jogador ataca.","g":"3 séries de 8 sequências","r":"A bola defensiva é alimentada menos profunda.","p":"Duas bolas defensivas antes da neutralização.","x":"A bola do meio: ela é de neutralização, não de ataque. Atacar dela é o erro do trilho.","i":"A qualidade da bola defensiva. Sair viva já é o resultado dessa bola.","v":0,"o":"Sair da defesa devolvendo o ponto ao neutro, e atacar na bola seguinte."},{"c":"TR007","n":"Trilho de mudança de direção","f":"TR","e":["L","G","A","C"],"m":"Treinador alimenta alternando bolas confortáveis (cintura, corpo equilibrado) e desconfortáveis (alta, larga, em corrida). O jogador só muda de direção nas confortáveis; nas outras, devolve na mesma diagonal.","g":"4 séries de 10 bolas","r":"As bolas confortáveis são anunciadas antes.","p":"Sem anúncio, com o jogador declarando em voz alta 'muda' ou 'mantém'.","x":"A decisão, não a execução. Mudar de bola difícil é erro mesmo quando a bola entra.","i":"O erro da bola mantida na diagonal. Ela está certa por definição.","v":0,"o":"Mudar a diagonal apenas a partir de bola confortável."},{"c":"TR008","n":"Trilho de subida intencional","f":"TR","e":["G","A","C"],"m":"Combinado: bola funda que empurra, bola de aproximação baixa no lado fraco do parceiro, subida, voleio de decisão. Quatro tempos, sempre iguais.","g":"3 séries de 8 sequências","r":"A bola de aproximação é alimentada pelo treinador; o jogador só sobe e voleia.","p":"O parceiro passa de verdade, e o ponto é disputado até o fim.","x":"A altura da bola de aproximação. Bola alta dá tempo, e tempo dá passada.","i":"A qualidade do voleio nas primeiras séries. O objeto é a escolha da bola de subida.","v":0,"o":"Subir à rede atrás da bola que foi feita para permitir a subida."},{"c":"TR009","n":"Semiaberto de ganho de quadra","f":"TR","e":["G","A","C"],"m":"Treinador alimenta uma bola neutra ao centro; a partir dela o ponto é livre. Vale ponto duplo para quem terminar o ponto tendo o pé dentro da quadra.","g":"3 séries de 8 pontos","r":"Alimentação mais alta e mais lenta.","p":"Alimentação profunda, obrigando a ganhar quadra a partir de posição pior.","x":"Se o avanço acontece por escolha ou por acaso.","i":"O resultado do ponto. A medida é o terreno, não o placar.","v":0,"o":"Avançar terreno em ponto vivo, a partir de entrada controlada."},{"c":"TR010","n":"Semiaberto de defesa para ataque","f":"TR","e":["G","A","C"],"m":"Treinador alimenta uma bola que empurra o jogador para fora; o ponto segue vivo. O jogador precisa neutralizar antes de atacar.","g":"3 séries de 8 pontos","r":"A bola de entrada é menos agressiva.","p":"Duas bolas de pressão na entrada antes de o ponto ficar livre.","x":"A bola de transição — a que devolve o ponto ao neutro.","i":"Atacar cedo nas primeiras séries. O erro faz parte do reconhecimento.","v":0,"o":"Reconhecer, em ponto vivo, o momento em que a defesa acabou."},{"c":"TR011","n":"Semiaberto de bola curta","f":"TR","e":["L","G","A","C"],"m":"Treinador alimenta uma bola curta em momento não anunciado durante a troca; o ponto segue.","g":"3 séries de 10 pontos","r":"A bola curta é anunciada antes de sair.","p":"A curta vem sempre depois de duas bolas fundas que o jogador teve de produzir.","x":"A entrada em diagonal e o pé de apoio.","i":"O erro do ataque. Atacar e errar vale mais que esperar e devolver.","v":0,"o":"Entrar e atacar a bola curta em ponto vivo."},{"c":"TR012","n":"Semiaberto de saque e ganho de quadra","f":"TR","e":["G","A","C"],"m":"Saque real, e o jogador precisa terminar o ponto com o pé dentro da quadra para valer ponto duplo. O ponto segue livre depois da devolução.","g":"3 séries de 8 pontos","r":"Saque à meia velocidade.","p":"Só vale ponto se terminar dentro da quadra.","x":"A entrada para dentro logo após o saque.","i":"O percentual de primeiro saque. O objeto é o terreno depois dele.","v":0,"o":"Encadear o saque com o avanço de terreno."},{"c":"TR013","n":"Semiaberto de negação de ângulo","f":"TR","e":["G","A","C"],"m":"Treinador alimenta uma bola que coloca o parceiro dentro da quadra; o jogador precisa neutralizar pelo centro antes de retomar a iniciativa.","g":"3 séries de 8 pontos","r":"A bola de entrada coloca o parceiro menos à frente.","p":"O parceiro tem liberdade de angular sempre que quiser.","x":"A leitura da posição do outro, e não da bola.","i":"A beleza da jogada. Bola central e alta pontuando é o resultado desejado.","v":0,"o":"Reconhecer, em ponto vivo, quando o adversário está em posição de angular."},{"c":"TR014","n":"Semiaberto de mudança de direção","f":"TR","e":["G","A","C"],"m":"Troca cruzada iniciada por alimentação; o jogador pode mudar de direção quando quiser, mas perde o ponto se mudar de bola em corrida.","g":"3 séries de 8 pontos","r":"A regra vale só para um dos jogadores.","p":"A regra vale para os dois, com o parceiro tentando forçar mudanças ruins.","x":"O critério da mudança, não o resultado dela.","i":"O erro da bola mudada de posição correta.","v":0,"o":"Escolher, em ponto vivo, a bola que permite mudar."},{"c":"TR015","n":"Semiaberto de subida","f":"TR","e":["G","A","C"],"m":"Ponto iniciado por alimentação neutra; o jogador precisa subir em algum momento do ponto, mas escolhendo a bola.","g":"3 séries de 8 pontos","r":"A subida é anunciada antes do ponto.","p":"Vale ponto duplo se a subida acontecer antes da quinta bola.","x":"A bola escolhida para subir — foi ela quem empurrou o adversário?","i":"O resultado do voleio. O objeto é a escolha da bola de aproximação.","v":0,"o":"Decidir a subida em ponto vivo, sem aviso."},{"c":"TR016","n":"Semiaberto do perfil","f":"TR","e":["A","C"],"m":"A entrada é a situação típica do perfil do jogador: bola profunda para quem joga de trás com peso, bola rápida e baixa para quem joga sobre a linha, alternada para o perfil completo.","g":"3 séries de 8 pontos","r":"Entrada mais fácil e mais previsível.","p":"Entrada na situação menos confortável do perfil, para trabalhar o buraco em vez da arma.","x":"Se o jogador está jogando o próprio jogo ou o jogo que imagina que devia jogar.","i":"A comparação com outro aluno. O perfil é dele.","v":0,"o":"Trabalhar a intenção principal do jogador dentro do ponto vivo."},{"c":"TR017","n":"Aberto: o pé dentro","f":"TR","e":["L","G","A","C"],"m":"Games normais. Ponto vale dobro se o jogador terminar com pelo menos um pé dentro da linha de base.","g":"2 a 4 games","r":"A regra vale só para quem está trabalhando o tema.","p":"Só vale ponto se terminar dentro da quadra.","x":"Se o avanço aparece sem lembrete.","i":"Tudo o mais durante o game. A regra faz o trabalho.","v":0,"o":"Premiar o avanço de terreno no ponto disputado."},{"c":"TR018","n":"Aberto: proibido angular de trás","f":"TR","e":["G","A","C"],"m":"Games normais. Perde o ponto quem jogar bola angulada estando atrás da linha de base.","g":"2 a 4 games","r":"A regra é avisada, não penalizada, nas primeiras duas semanas.","p":"A regra vale para os dois jogadores.","x":"A consciência de posição antes da escolha do alvo.","i":"As bolas angulares de dentro da quadra. Essas são o objetivo.","v":0,"o":"Instalar a ordem correta — ganhar quadra antes de angular."},{"c":"TR019","n":"Aberto: a intenção declarada","f":"TR","e":["G","A","C"],"m":"Antes de cada ponto, o jogador declara em voz alta a intenção da primeira bola: empurrar, abrir, neutralizar ou terminar. O ponto é disputado normalmente.","g":"2 a 3 games","r":"Duas intenções possíveis apenas.","p":"Intenção declarada silenciosamente e verificada no debriefing.","x":"A correspondência entre o declarado e o jogado.","i":"O resultado do ponto. A medida é a fidelidade à intenção.","v":0,"o":"Instalar a intencionalidade de cada bola."},{"c":"TR020","n":"Aberto: quatro bolas","f":"TR","e":["G","A","C"],"m":"Games normais. Ponto vale dobro se terminar em até quatro bolas com o ponto tendo sido construído — isto é, se as bolas anteriores tiveram função diferente entre si.","g":"2 a 4 games","r":"Contagem apenas, sem pontuação dobrada.","p":"O jogador precisa nomear as funções das bolas no fim de cada ponto.","x":"Se existe encadeamento ou se as bolas são todas iguais.","i":"Pontos longos. Eles acontecem e não são erro.","v":0,"o":"Encadear intenções sem alongar o ponto."},{"c":"TR021","n":"Aberto: sem bola de espera","f":"TR","e":["L","G","A","C"],"m":"Games normais. O jogador perde o ponto se jogar duas bolas seguidas sem mudar nada — mesma altura, mesma direção, mesma profundidade.","g":"2 a 3 games","r":"A regra vale a partir da terceira bola do ponto.","p":"A regra vale desde a primeira bola.","x":"A capacidade de dar função a toda bola, inclusive à de sustentação.","i":"Erros que aparecem por excesso de mudança nas primeiras séries.","v":0,"o":"Eliminar a bola sem intenção."},{"c":"TR022","n":"Aberto: subida obrigatória","f":"TR","e":["G","A","C"],"m":"Games normais. O jogador precisa subir à rede pelo menos uma vez por game, e escolher a bola.","g":"2 a 4 games","r":"A subida pode acontecer atrás de qualquer bola.","p":"A subida só vale se acontecer atrás de bola que fez o adversário recuar.","x":"A escolha da bola de subida.","i":"O resultado da subida. Subir atrás da bola certa e perder o ponto é execução correta.","v":0,"o":"Instalar a rede como conclusão, não como estilo."},{"c":"TR023","n":"Aberto: o piso do jogo","f":"TR","e":["A","C"],"m":"Games normais, com uma condição que simula o piso: bola mais murcha para simular saibro, quadra encurtada para simular piso rápido. O jogador ajusta a construção.","g":"2 a 4 games","r":"Uma condição por sessão.","p":"Alternância de condição a cada game, sem aviso.","x":"Se o jogador muda a construção conforme a condição ou insiste no mesmo jogo.","i":"A preferência dele por uma das condições. Ela é informação de perfil, não erro.","v":0,"o":"Adaptar a intenção ao piso e à velocidade da quadra."},{"c":"TR024","n":"Aberto: dois perfis","f":"TR","e":["A","C"],"m":"Games normais, com os dois jogadores sabendo o perfil um do outro. Cada um precisa nomear, no fim do game, uma jogada que usou por causa do perfil do outro.","g":"2 a 4 games","r":"O professor nomeia os perfis antes.","p":"Os jogadores identificam sozinhos o perfil do outro, sem saber de antemão.","x":"A leitura, não o resultado.","i":"O placar. É a leitura que se está treinando.","v":0,"o":"Reconhecer o perfil do adversário e jogar contra ele."}];

/* ─────────────────────────── geração do macro ─────────────────────────── */
function segundaDaSemana(iso) {
  const d = new Date(iso + "T12:00:00");
  const dia = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dia);
  return d;
}

function fmtData(d) {
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}

function montaFases({ inicio, semanas, competicoes }) {
  const base = segundaDaSemana(inicio);
  const linha = [];
  for (let i = 0; i < semanas; i++) {
    const d = new Date(base);
    d.setDate(d.getDate() + i * 7);
    linha.push({ n: i + 1, data: d, fase: null, evento: null });
  }

  // 1 · semanas de competição
  const idxTorneios = [];
  competicoes.forEach((c) => {
    if (!c.data) return;
    const dc = segundaDaSemana(c.data).getTime();
    const alvo = linha.find((s) => s.data.getTime() === dc);
    if (alvo) {
      alvo.fase = "Torneio";
      alvo.evento = c.nome || "Competição";
      idxTorneios.push(alvo.n - 1);
    }
  });
  idxTorneios.sort((a, b) => a - b);

  // 2 · ponte competitiva entre torneios próximos
  for (let k = 0; k < idxTorneios.length - 1; k++) {
    const vao = idxTorneios[k + 1] - idxTorneios[k];
    if (vao > 1 && vao <= 3) {
      for (let i = idxTorneios[k] + 1; i < idxTorneios[k + 1]; i++)
        if (!linha[i].fase) linha[i].fase = "Ponte competitiva";
    }
  }

  // 3 · afinação antes de cada torneio (2 semanas no primeiro, 1 nos demais)
  idxTorneios.forEach((idx, ordem) => {
    const quantas = ordem === 0 ? 2 : 1;
    let postas = 0;
    for (let i = idx - 1; i >= 0 && postas < quantas; i--) {
      if (!linha[i].fase) {
        linha[i].fase = "Afinação";
        postas++;
      } else break;
    }
  });

  // 4 · regeneração depois de cada torneio (menos o último bloco)
  idxTorneios.forEach((idx, ordem) => {
    if (ordem === idxTorneios.length - 1) return;
    const prox = linha[idx + 1];
    if (prox && !prox.fase) prox.fase = "Regeneração";
  });

  // 5 · última semana: descanso
  const ultima = linha[linha.length - 1];
  if (ultima && (!ultima.fase || ultima.fase === "Ponte competitiva") && idxTorneios.length)
    ultima.fase = "Descanso";

  // 6 · sobra depois do último torneio vira ponte competitiva, não base
  if (idxTorneios.length) {
    const ultimoT = idxTorneios[idxTorneios.length - 1];
    const livresNoFim = linha.slice(ultimoT + 1).filter((s) => !s.fase).length;
    if (livresNoFim <= 2)
      linha.slice(ultimoT + 1).forEach((s) => { if (!s.fase) s.fase = "Ponte competitiva"; });
  }

  // 7 · o que sobrou vira base, em mesociclos de até 3 semanas
  //     (o estímulo dura 3 treinos e roda ao fim de cada mesociclo)
  const ROM = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
  let bloco = 0;
  let corridas = 0;
  let anterior = null;
  linha.forEach((s) => {
    if (!s.fase) {
      if (anterior !== "base" || corridas >= 3) { bloco++; corridas = 0; }
      s.fase = "Base " + ROM[Math.min(bloco - 1, ROM.length - 1)];
      corridas++;
      anterior = "base";
    } else { anterior = "outra"; corridas = 0; }
  });

  return linha;
}

function agrupaFases(linha) {
  const g = [];
  linha.forEach((s) => {
    const ult = g[g.length - 1];
    if (ult && ult.fase === s.fase) {
      ult.fim = s.n;
      if (s.evento) ult.eventos.push(s.evento);
    } else {
      g.push({ fase: s.fase, ini: s.n, fim: s.n, eventos: s.evento ? [s.evento] : [] });
    }
  });
  return g;
}

function montaCiclos(prioridades, estagio) {
  return prioridades.slice(0, 4).map((areaId, i) => {
    const a = AREAS[areaId];
    const chave = EXERCICIOS.filter(
      (e) => a.familias.includes(e.f) && e.e.includes(estagio) && a.busca.test(e.n + " " + e.m)
    ).slice(0, 6);
    const alt = EXERCICIOS.filter((e) => a.familias.includes(e.f) && e.e.includes(estagio)).slice(0, 6);
    return {
      letra: LETRAS[i],
      areaId,
      nome: a.nome,
      estimulos: a.estimulos,
      volume: i < 2 ? 30 : 20,
      exercicios: (chave.length >= 3 ? chave : alt).slice(0, 5),
    };
  });
}

function proporcaoTatica(prioridades) {
  const aberturaPrioritaria =
    prioridades.slice(0, 2).filter((p) => p === "saque" || p === "devolucao").length;
  if (aberturaPrioritaria === 2) return { abertura: 60, media: 25, defesa: 15 };
  if (aberturaPrioritaria === 1) return { abertura: 50, media: 32, defesa: 18 };
  return { abertura: 40, media: 38, defesa: 22 };
}

  faixas.push({

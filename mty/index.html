/* ─────────────────────────── catálogo ─────────────────────────── */
/* ─────────────────────────── plano do ciclo ───────────────────────────
   O plano chega como JSON gerado na conversa. Aqui ele vira documento vivo:
   o treinador marca aula, anota, consulta o exercício e fecha o ciclo. */
function TelaPlano({ aluno, alunos, setAlunos }) {
  const [colando, setColando] = useState(false);
  const [texto, setTexto] = useState("");
  const [erro, setErro] = useState("");
  const [gerando, setGerando] = useState(false);
  const [semanas, setSemanas] = useState(12);
  const [aulasSem, setAulasSem] = useState(3);
  const [verEx, setVerEx] = useState(null);
  const [relatorio, setRelatorio] = useState("");
  const [linkAluno, setLinkAluno] = useState("");
  const [gerandoLink, setGerandoLink] = useState(false);

  const plano = aluno.plano;
  const reg = aluno.regPlano || {};
  const historico = aluno.historicoRelatorios || [];
  const [abrirHist, setAbrirHist] = useState(null);

  function atualiza(campos) {
    setAlunos(alunos.map((a) => (a.id === aluno.id ? { ...a, ...campos } : a)));
  }

  function valida(alvo) {
    if (!alvo.blocos || !alvo.blocos.length) throw new Error("Não encontrei os blocos do plano.");
    const ruins = [];
    alvo.blocos.forEach((b) => (b.semanasLista || []).forEach((sem) =>
      (sem.aulas || []).forEach((au) => (au.ex || []).forEach((c) => {
        if (!EXERCICIOS.some((e) => e.c === c)) ruins.push(c);
      }))));
    if (ruins.length)
      throw new Error("Códigos que não existem no catálogo: " + [...new Set(ruins)].join(", "));
    const raizes = (alvo.cadeia || []).filter((c) => c.raiz).length;
    if (raizes > 1) throw new Error("O plano marcou " + raizes + " camadas como origem. Só pode haver uma.");
    return alvo;
  }

  async function gerarComIA() {
    setErro(""); setGerando(true);
    try {
      let t = (await chamarIA(promptPlanoEstruturado(aluno, semanas, aulasSem, historico), 8000)).trim();
      t = t.replace(/^```(json)?/i, "").replace(/```$/, "").trim();
      const i = t.indexOf("{");
      if (i > 0) t = t.slice(i);
      const alvo = valida(JSON.parse(t));
      atualiza({ plano: alvo, regPlano: {} });
    } catch (e) {
      setErro(String(e.message || e));
    }
    setGerando(false);
  }

  function importar() {
    setErro("");
    try {
      let t = texto.trim().replace(/^```(json)?/i, "").replace(/```$/, "").trim();
      const i = t.indexOf("{");
      if (i > 0) t = t.slice(i);
      const p = JSON.parse(t);
      const alvo = valida(p.plano || p);
      atualiza({ plano: alvo, regPlano: {} });
      setColando(false); setTexto("");
    } catch (e) {
      setErro(String(e.message || e));
    }
  }

  const aulas = useMemo(() => {
    if (!plano) return [];
    const lista = [];
    let n = 0;
    plano.blocos.forEach((b) => (b.semanasLista || []).forEach((sem) =>
      (sem.aulas || []).forEach((au) => {
        n++;
        lista.push({ id: "A" + String(n).padStart(2, "0"), bloco: b.titulo || b.nome,
          semana: sem.n, foco: sem.foco, ...au });
      })));
    return lista;
  }, [plano]);

  const feitas = aulas.filter((a) => reg[a.id] && reg[a.id].feita).length;

  function marca(id) {
    const d = { ...(reg[id] || {}) };
    d.feita = !d.feita;
    if (d.feita && !d.data) d.data = new Date().toISOString().slice(0, 10);
    atualiza({ regPlano: { ...reg, [id]: d } });
  }
  function campo(id, k, v) {
    atualiza({ regPlano: { ...reg, [id]: { ...(reg[id] || {}), [k]: v } } });
  }
  function fech(k, v) {
    atualiza({ regPlano: { ...reg, __fech: { ...(reg.__fech || {}), [k]: v } } });
  }

  function gerar() {
    const F = reg.__fech || {};
    const NOTA = { sim: "ATINGIDO", par: "PARCIAL", nao: "NÃO ATINGIDO", "": "não avaliado" };
    const L = [];
    L.push("RELATÓRIO DE CICLO · METODOLOGIA MTY");
    L.push("Jogador: " + (aluno.nome || "sem nome") + " · " + (plano.tipo || ""));
    L.push("Gerado em: " + new Date().toLocaleDateString("pt-BR"));
    L.push("Aulas realizadas: " + feitas + " de " + aulas.length);
    L.push("");
    L.push("═══ FECHAMENTO DO CICLO ═══");
    L.push("");
    L.push("CRITÉRIOS DE SAÍDA");
    plano.blocos.filter((b) => b.saida).forEach((b, i) => {
      L.push("  " + (b.nome || "") + " · " + (b.titulo || "") + ": " + NOTA[F["nota:C" + i] || ""]);
      const t = (F["crit:C" + i] || "").trim();
      if (t) L.push("    " + t);
    });
    L.push("");
    L.push("O QUE ESTAVA EM OBSERVAÇÃO");
    (plano.observacao || []).forEach((o, i) => {
      L.push("  " + o.t);
      L.push("    " + ((F["obs:O" + i] || "").trim() || "[segue em aberto — não foi preenchido]"));
    });
    L.push("");
    const dores = aulas.filter((a) => (reg[a.id] || {}).dor);
    L.push("REGISTRO DE DOR — " + (dores.length ? dores.length + " aulas com registro" : "nenhum registro no período"));
    dores.forEach((a) => L.push("  " + (reg[a.id].data || "") + " · semana " + a.semana + " · " + reg[a.id].dor));
    L.push("");
    let bl = "";
    aulas.forEach((a) => {
      const d = reg[a.id];
      if (!d || !d.feita) return;
      if (a.bloco !== bl) { bl = a.bloco; L.push("── " + bl.toUpperCase() + " ──"); }
      L.push("Semana " + a.semana + " · " + a.t + " · " + (d.data || "sem data"));
      if ((d.obs || "").trim()) L.push("   " + d.obs.trim());
      L.push("   exercícios: " + (a.ex || []).join(" "));
    });
    const naoFeitas = aulas.filter((a) => !reg[a.id] || !reg[a.id].feita);
    if (naoFeitas.length) {
      L.push("");
      L.push("NÃO REALIZADAS (" + naoFeitas.length + ")");
      naoFeitas.forEach((a) => L.push("  Semana " + a.semana + " · " + a.t));
    }
    L.push("");
    L.push("---");
    L.push("Aula sem observação escrita não é aula sem informação — é informação não registrada.");
    L.push("Campos de observação em branco seguem em aberto e entram no próximo ciclo.");
    setRelatorio(L.join("\n"));
  }

  function arquivar() {
    const item = {
      id: "REL-" + Date.now().toString(36),
      data: new Date().toISOString(),
      tipo: plano.tipo || "",
      feitas, total: aulas.length,
      texto: relatorio,
    };
    atualiza({ historicoRelatorios: [item, ...historico] });
  }

  function removerDoHistorico(id) {
    if (!confirm("Remover este relatório do histórico? Não dá pra desfazer.")) return;
    atualiza({ historicoRelatorios: historico.filter((h) => h.id !== id) });
    if (abrirHist === id) setAbrirHist(null);
  }

  /* ── sem plano ainda ── */
  if (!plano) {
    return (
      <div>
        <Aviso cor={C.quadra}>
          Este jogador ainda não tem plano. Preencha a ficha de entrada e gere aqui mesmo —
          ou cole um plano montado fora.
        </Aviso>

        <Secao titulo="Gerar a partir da ficha" nota="Usa o que está preenchido na aba Ficha e escolhe os exercícios dentro do catálogo, respeitando o estágio do jogador. Se o jogador já teve ciclos anteriores, o plano novo é montado considerando o que ficou registrado neles.">
          <div className="grid grid-cols-2 gap-3">
            <Campo rotulo="Semanas do ciclo">
              <Seletor opcoes={[8, 12, 16].map((n) => ({ v: n, r: n + " semanas" }))}
                valor={semanas} aoMudar={setSemanas} />
            </Campo>
            <Campo rotulo="Aulas por semana">
              <Seletor opcoes={[1, 2, 3, 4, 5].map((n) => ({ v: n, r: String(n) }))}
                valor={aulasSem} aoMudar={setAulasSem} />
            </Campo>
          </div>
          {!(aluno.camadas.tecnico || "").trim() && (
            <Aviso>
              A camada técnica da ficha está vazia. O plano vai sair genérico — preencha a aba
              Ficha antes de gerar.
            </Aviso>
          )}
          {erro && <Aviso>{erro}</Aviso>}
          <div className="flex gap-2 flex-wrap items-center">
            <Botao onClick={gerarComIA} variante="saibro">
              {gerando ? "Montando o plano…" : "Gerar planejamento"}
            </Botao>
            <Botao variante="vazio" onClick={() => setColando(true)}>Colar plano pronto</Botao>
          </div>
          {gerando && <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 9 }}>
            Costuma levar de trinta segundos a um minuto.</p>}
        </Secao>

        {colando && (
          <div>
            <Campo rotulo="Cole o JSON do plano" nota="Pode colar com as crases do bloco de código — eu limpo.">
              <textarea rows={9} style={{ ...entrada, resize: "vertical", fontFamily: "ui-monospace, monospace", fontSize: 12 }}
                value={texto} onChange={(e) => setTexto(e.target.value)} />
            </Campo>
            {erro && <Aviso>{erro}</Aviso>}
            <div className="flex gap-2">
              <Botao onClick={importar} variante="saibro">Importar</Botao>
              <Botao variante="vazio" onClick={() => { setColando(false); setErro(""); }}>Cancelar</Botao>
            </div>
          </div>
        )}
      </div>
    );
  }

  const pct = aulas.length ? Math.round((feitas / aulas.length) * 100) : 0;

  async function gerarLinkAluno() {
    setGerandoLink(true);
    try {
      let chave = aluno.linkToken;
      if (!chave) {
        chave = MTY.id("aluno");
        atualiza({ linkToken: chave });
      }
      const org = await organizacao();
      const url = location.origin + "/aluno.html?org=" + encodeURIComponent(org || "") +
        "&id=" + encodeURIComponent(aluno.id) + "&t=" + encodeURIComponent(chave);
      setLinkAluno(url);
    } finally {
      setGerandoLink(false);
    }
  }

  return (
    <div>
      <div className="mb-5">
        <div className="flex items-baseline justify-between gap-3 mb-2">
          <span style={{ fontFamily: ARCH, fontSize: 15, fontWeight: 700 }}>{plano.tipo || "Plano do ciclo"}</span>
          <Etiqueta>{feitas} de {aulas.length} aulas · {pct}%</Etiqueta>
        </div>
        <div style={{ height: 7, background: C.linha }}>
          <div style={{ height: "100%", width: pct + "%", background: C.quadra }} />
        </div>
      </div>

      <div className="mb-5">
        <Botao pequeno variante="vazio" onClick={gerarLinkAluno}>
          {gerandoLink ? "Gerando…" : "Link para o aluno (protótipo)"}
        </Botao>
        {linkAluno && (
          <div className="mt-2 flex gap-2 items-center">
            <input readOnly value={linkAluno} style={{ ...entrada, fontSize: 12, flex: 1 }}
              onFocus={(e) => e.target.select()} />
            <Botao pequeno variante="vazio" onClick={() => navigator.clipboard.writeText(linkAluno)}>Copiar</Botao>
          </div>
        )}
      </div>

      <div style={{ background: "#FDF6E7", borderLeft: "3px solid #C9A227", padding: "11px 14px", marginBottom: 16 }}>
        <p style={{ ...prosa, fontSize: 13 }}>
          <b>Rascunho.</b> Leia o plano inteiro antes de conduzir. Nenhum planejamento vai para
          o aluno sem um treinador revisar e assinar.
        </p>
      </div>

      {plano.prioridade && (
        <div style={{ background: C.cal, borderLeft: "3px solid " + C.saibro, padding: "12px 15px", marginBottom: 18 }}>
          <p style={{ ...prosa, fontSize: 14 }}>{plano.prioridade}</p>
        </div>
      )}

      {plano.blocos.map((b, bi) => (
        <div key={bi} className="mb-7">
          <div style={{ background: C.tinta, color: C.papel, padding: "12px 15px" }}>
            <div style={{ fontFamily: ARCH, fontSize: 10, fontWeight: 700, letterSpacing: ".12em", color: C.saibro }}>
              {b.nome} · semanas {b.semanas}
            </div>
            <div style={{ fontFamily: ARCH, fontSize: 16, fontWeight: 700, marginTop: 2 }}>{b.titulo}</div>
          </div>
          {b.alvo && <p style={{ ...prosa, fontSize: 13, color: C.grafite, background: C.cal,
            border: "1px solid " + C.linha, borderTop: "none", padding: "11px 15px", margin: 0 }}>{b.alvo}</p>}

          {(b.semanasLista || []).map((sem, si) => (
            <div key={si} style={{ border: "1px solid " + C.linha, borderTop: "none", background: C.cal }}>
              <div className="flex items-center gap-3 flex-wrap" style={{ padding: "9px 14px", background: C.papel, borderBottom: "1px solid " + C.linha }}>
                <Etiqueta cor={C.tinta}>Semana {sem.n}</Etiqueta>
                <span style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700, flex: 1 }}>{sem.foco}</span>
                {sem.carga && <Etiqueta>{sem.carga}</Etiqueta>}
              </div>
              {(sem.aulas || []).map((au, ai) => {
                const idx = aulas.findIndex((x) => x.semana === sem.n && x.t === au.t && (x.ex || []).join() === (au.ex || []).join());
                const id = idx >= 0 ? aulas[idx].id : "A?" + si + ai;
                const d = reg[id] || {};
                return (
                  <div key={ai} style={{ borderBottom: "1px solid " + C.linha, background: d.feita ? "#F4F7F4" : C.cal }}>
                    <div className="flex gap-3" style={{ padding: "11px 14px" }}>
                      <button onClick={() => marca(id)} title="marcar como realizada"
                        style={{ width: 20, height: 20, flexShrink: 0, marginTop: 2, cursor: "pointer",
                          border: "1.5px solid " + (d.feita ? C.quadra : C.linha),
                          background: d.feita ? C.quadra : C.cal, color: "#fff",
                          fontFamily: ARCH, fontSize: 12, fontWeight: 700, lineHeight: 1 }}>
                        {d.feita ? "✓" : ""}
                      </button>
                      <div className="flex-1">
                        <div style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700,
                          color: d.feita ? C.quadra : C.tinta }}>{ai + 1} · {au.t}</div>
                        <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 2 }}>{au.d}</p>
                        <div className="flex gap-1 flex-wrap mt-2">
                          {(au.ex || []).map((c) => (
                            <button key={c} onClick={() => setVerEx(c)}
                              style={{ fontFamily: ARCH, fontSize: 10.5, fontWeight: 700, padding: "3px 7px",
                                border: "1px solid " + (c.startsWith("TR") ? C.saibro : C.linha),
                                color: c.startsWith("TR") ? C.saibro : C.grafite,
                                background: C.papel, cursor: "pointer", borderRadius: 2 }}>{c}</button>
                          ))}
                          {au.selo === "ss" && <Etiqueta cor={C.saibro}>sem saque</Etiqueta>}
                          {au.selo && au.selo.indexOf("cs:") === 0 &&
                            <Etiqueta cor={C.quadra}>saque · {au.selo.split(":")[1]}</Etiqueta>}
                        </div>
                      </div>
                    </div>
                    {d.feita && (
                      <div className="flex gap-2 flex-wrap" style={{ padding: "0 14px 12px 47px" }}>
                        <input type="date" style={{ ...entrada, width: 150, fontSize: 12.5, padding: "6px 9px" }}
                          value={d.data || ""} onChange={(e) => campo(id, "data", e.target.value)} />
                        <input style={{ ...entrada, width: 165, fontSize: 12.5, padding: "6px 9px", borderColor: C.saibro }}
                          placeholder="dor · min / bolas" value={d.dor || ""}
                          onChange={(e) => campo(id, "dor", e.target.value)} />
                        <textarea rows={2} style={{ ...entrada, flex: 1, minWidth: 210, fontSize: 12.5, resize: "vertical" }}
                          placeholder="o que apareceu · o que não apareceu" value={d.obs || ""}
                          onChange={(e) => campo(id, "obs", e.target.value)} />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
          {b.saida && (
            <div style={{ background: C.papel, border: "1px solid " + C.linha, borderTop: "none",
              borderLeft: "3px solid " + C.quadra, padding: "12px 15px" }}>
              <Etiqueta cor={C.quadra}>Critério de saída</Etiqueta>
              <p style={{ ...prosa, fontSize: 13, marginTop: 4 }}>{b.saida}</p>
            </div>
          )}
        </div>
      ))}

      <Secao titulo="Fechamento do ciclo" nota="É esta parte que faz o próximo ciclo conversar com este. Sem ela, o plano seguinte recebe o que foi feito, mas não o que foi aprendido.">
        <h3 style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700, marginBottom: 9 }}>Os critérios de saída</h3>
        {plano.blocos.filter((b) => b.saida).map((b, i) => {
          const v = (reg.__fech || {})["nota:C" + i] || "";
          return (
            <div key={i} style={{ background: C.cal, border: "1px solid " + C.linha, padding: "13px 15px", marginBottom: 9 }}>
              <div style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700 }}>{b.nome} · {b.titulo}</div>
              <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, margin: "5px 0 9px" }}>{b.saida}</p>
              <div className="flex gap-2 flex-wrap mb-2">
                {[["sim", "atingido", C.quadra], ["par", "parcial", C.ocre || "#C9A227"], ["nao", "não atingido", C.saibro]].map(([k, r, cor]) => (
                  <button key={k} onClick={() => fech("nota:C" + i, v === k ? "" : k)}
                    style={{ fontFamily: ARCH, fontSize: 11.5, fontWeight: 700, padding: "6px 12px", cursor: "pointer",

                onChange={(e) => fech("crit:C" + i, e.target.value)} />
            </div>

            <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, margin: "5px 0 8px" }}>{o.d}</p>
            <textarea rows={2} style={{ ...entrada, resize: "vertical", fontSize: 12.5 }}

              onChange={(e) => fech("obs:O" + i, e.target.value)} />

      <div className="flex gap-2 flex-wrap mb-4">

        }}>Remover plano</Botao>

      {relatorio && (
        <div style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + C.quadra, padding: 15 }}>
          <div className="mb-2"><Etiqueta cor={C.quadra}>Relatório do ciclo</Etiqueta></div>
          <textarea readOnly value={relatorio}
            style={{ ...entrada, minHeight: 260, fontFamily: "ui-monospace, monospace", fontSize: 11.5, whiteSpace: "pre" }} />
          <div className="mt-3 flex gap-2">
            <Botao pequeno variante="vazio" onClick={() => navigator.clipboard.writeText(relatorio)}>Copiar</Botao>
            <Botao pequeno onClick={arquivar}>Arquivar no histórico</Botao>
          </div>
        </div>
      )}

      {historico.length > 0 && (
        <div className="mt-4">
          <div className="mb-2"><Etiqueta>Histórico de relatórios · {historico.length}</Etiqueta></div>
          {historico.map((h) => (
            <div key={h.id} style={{ background: C.papel, border: "1px solid " + C.linha, padding: "10px 13px", marginBottom: 7 }}>
              <div className="flex items-center justify-between gap-2 flex-wrap">
                <p style={{ ...prosa, fontSize: 12.5 }}>
                  {new Date(h.data).toLocaleDateString("pt-BR")} · {h.tipo || "ciclo"} · {h.feitas} de {h.total} aulas
                </p>
                <div className="flex gap-2">
                  <Botao pequeno variante="vazio" onClick={() => setAbrirHist(abrirHist === h.id ? null : h.id)}>
                    {abrirHist === h.id ? "Fechar" : "Ver"}
                  </Botao>
                  <Botao pequeno variante="vazio" onClick={() => navigator.clipboard.writeText(h.texto)}>Copiar</Botao>
                  <Botao pequeno variante="vazio" onClick={() => removerDoHistorico(h.id)}>Remover</Botao>
                </div>
              </div>
              {abrirHist === h.id && (
                <textarea readOnly value={h.texto}
                  style={{ ...entrada, minHeight: 220, marginTop: 9, fontFamily: "ui-monospace, monospace", fontSize: 11.5, whiteSpace: "pre" }} />
              )}
            </div>
          ))}
        </div>
      )}

      {verEx && (() => {
        const e = EXERCICIOS.find((x) => x.c === verEx);
        if (!e) return null;
        return (
          <div onClick={() => setVerEx(null)}
            style={{ position: "fixed", inset: 0, background: "rgba(20,18,16,.6)", zIndex: 60,
              display: "grid", placeItems: "center", padding: 18 }}>
            <div onClick={(ev) => ev.stopPropagation()}
              style={{ background: C.papel, maxWidth: 560, width: "100%", maxHeight: "84vh",
                overflowY: "auto", padding: 20 }}>
              <Etiqueta cor={C.saibro}>{e.c}</Etiqueta>
              <h3 style={{ fontFamily: ARCH, fontSize: 18, fontWeight: 700, margin: "4px 0 3px" }}>{e.n}</h3>
              <p style={{ ...prosa, fontSize: 13, color: C.grafite, marginBottom: 13 }}>
                {FAM[e.f]} · {e.e.join(" · ")} · {e.g}
              </p>
              {e.o && <p style={{ ...prosa, fontSize: 13.5, fontStyle: "italic", marginBottom: 11 }}>{e.o}</p>}
              <Linha rotulo="Montagem" texto={e.m} />
              <Linha rotulo="− Regressão" texto={e.r} />
              <Linha rotulo="+ Progressão" texto={e.p} />
              <Linha rotulo="Corrigir" texto={e.x} />
              <Linha rotulo="Ignorar" texto={e.i} destaque />
              <div className="mt-4"><Botao pequeno onClick={() => setVerEx(null)}>Fechar</Botao></div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function TelaCatalogo() {
  const [busca, setBusca] = useState("");
  const [estagio, setEstagio] = useState("todos");
  const [familia, setFamilia] = useState("todas");
  const lista = useMemo(() => {
    const t = busca.trim().toLowerCase();
    return EXERCICIOS.filter((e) => {
      if (estagio !== "todos" && !e.e.includes(estagio)) return false;
      if (familia !== "todas" && e.f !== familia) return false;
      if (!t) return true;
      return (e.c + " " + e.n + " " + e.m + " " + e.i).toLowerCase().includes(t);
    });
  }, [busca, estagio, familia]);
  return (
    <div>
      <input style={{ ...entrada, marginBottom: 14 }} value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar por código, nome ou montagem" />
      <Campo rotulo="Estágio"><Seletor opcoes={[{ v: "todos", r: "Todos" }, ...ESTAGIOS.map((e) => ({ v: e.s, r: e.s }))]} valor={estagio} aoMudar={setEstagio} /></Campo>
      <Campo rotulo="Família"><Seletor opcoes={[{ v: "todas", r: "Todas" }, ...Object.keys(FAM).map((f) => ({ v: f, r: f }))]} valor={familia} aoMudar={setFamilia} /></Campo>
      <div className="mb-3"><Etiqueta>{lista.length} exercícios</Etiqueta></div>
      {lista.slice(0, 80).map((e) => <CartaoExercicio key={e.c} e={e} />)}
      {lista.length > 80 && <p style={{ ...prosa, fontSize: 13, color: C.grafite }}>Mostrando os 80 primeiros. Refine a busca.</p>}
    </div>
  );
}

/* ─────────────────────────── raiz ─────────────────────────── */
/* ── Portão de acesso da equipe ──
   Só existe quando o Firebase está configurado. Em modo local o app abre
   direto, porque não há nuvem para proteger. Todos os treinadores que
   entram veem os mesmos dados: é conta de equipe, não de aluno. */
function TelaLogin({ aoEntrar }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [ocupado, setOcupado] = useState(false);

  async function enviar() {
    setErro(""); setOcupado(true);
    try {
      await window.mtyAuth.entrar(email.trim(), senha);
      aoEntrar();
    } catch (e) {
      const c = (e && e.code) || "";
      const msgs = {
        "auth/invalid-email": "E-mail inválido.",
        "auth/user-not-found": "Não existe conta com este e-mail.",
        "auth/wrong-password": "Senha incorreta.",
        "auth/invalid-credential": "E-mail ou senha incorretos.",
        "auth/too-many-requests": "Muitas tentativas. Espere um pouco e tente de novo.",
      };
      setErro(msgs[c] || "Não consegui completar. Verifique a conexão e tente de novo.");
    }
    setOcupado(false);
  }

  return (
    <div style={{ background: C.papel, minHeight: "100vh" }}>
      <div style={{ height: 4, background: C.saibro }} />
      <div style={{ maxWidth: 400, margin: "0 auto", padding: "56px 22px" }}>
        <img src="assets/logo-team-yoda.jpg" alt="Team Yoda" style={{ height: 34, marginBottom: 10 }} />
        <div className="mt-1 mb-7"><Etiqueta>Acesso da equipe técnica</Etiqueta></div>

        <Campo rotulo="E-mail">
          <input type="email" autoComplete="email" style={entrada} value={email}
            onChange={(e) => setEmail(e.target.value)} placeholder="treinador@exemplo.com" />
        </Campo>
        <Campo rotulo="Senha">
          <input type="password" autoComplete="current-password"
            style={entrada} value={senha} onChange={(e) => setSenha(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && email && senha) enviar(); }} />
        </Campo>

        {erro && (
          <div style={{ background: C.cal, borderLeft: "3px solid " + C.saibro, padding: "11px 13px", marginBottom: 14 }}>
            <p style={{ ...prosa, fontSize: 13.5, color: C.saibro }}>{erro}</p>
          </div>
        )}

        <button onClick={enviar} disabled={ocupado || !email || !senha}
          style={{ width: "100%", fontFamily: ARCH, fontSize: 14, fontWeight: 700, padding: "13px 0",
            borderRadius: 2, cursor: ocupado ? "wait" : "pointer", border: "none",
            background: (!email || !senha) ? C.linha : C.saibro,
            color: (!email || !senha) ? C.grafite : "#fff" }}>
          {ocupado ? "…" : "Entrar"}
        </button>

        <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 18 }}>
          Todos os treinadores da mesma academia veem os mesmos jogadores, fichas e casos. Não há
          cadastro por aqui — sua conta é criada pelo administrador, já ligada à sua academia. Sem
          conta, fale com quem administra a MTY na sua academia.
        </p>
      </div>
    </div>
  );
}

function App() {
  const [alunos, setAlunos] = useState([]);
  const [abertoId, setAbertoId] = useState(null);
  const [aba, setAba] = useState("alunos");
  const [subaba, setSubaba] = useState("ficha");
  const [carregando, setCarregando] = useState(true);
  const exigeLogin = typeof window !== "undefined" && !!window.mtyAuth;
  const [autenticado, setAutenticado] = useState(!exigeLogin);
  const [checando, setChecando] = useState(exigeLogin);

  useEffect(() => {
    if (!exigeLogin) return;
    return window.mtyAuth.observar((u) => { setAutenticado(!!u); setChecando(false); });
  }, [exigeLogin]);

  useEffect(() => {
    if (!autenticado) return;
    leia("mty:alunos:v2", []).then((a) => { setAlunos(a); setCarregando(false); });
  }, [autenticado]);
  useEffect(() => { if (autenticado && !carregando) grave("mty:alunos:v2", alunos); }, [alunos, carregando, autenticado]);

  const aberto = abertoId ? alunos.find((a) => a.id === abertoId) : null;

  function criar() {
    const n = novoAluno();
    setAlunos([...alunos, n]);
    setAbertoId(n.id);
    setSubaba("ficha");
  }
  function salvar(f) { setAlunos(alunos.map((a) => (a.id === f.id ? f : a))); }

  if (checando)
    return <div style={{ background: C.papel, minHeight: "100vh", padding: 60, textAlign: "center", fontFamily: ARCH, color: C.grafite }}>Verificando acesso…</div>;
  if (!autenticado) return <TelaLogin aoEntrar={() => setAutenticado(true)} />;

  return (
    <div style={{ background: C.papel, minHeight: "100vh", color: C.tinta }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap');
        * { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid ${C.saibro}; outline-offset: 2px; }
      `}</style>

      <header style={{ borderBottom: "1px solid " + C.linha, background: C.cal, position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ height: 4, background: C.saibro }} />
        <div className="px-5 pt-4 pb-2" style={{ maxWidth: 760, margin: "0 auto" }}>
          <div className="flex items-center justify-between gap-3">
            <img src="assets/logo-team-yoda.jpg" alt="Team Yoda" style={{ height: 26 }} />
            {exigeLogin && (
              <button onClick={() => window.mtyAuth.sair()}
                style={{ fontFamily: ARCH, fontSize: 11.5, fontWeight: 600, color: C.grafite, cursor: "pointer", padding: "4px 8px", border: "1px solid " + C.linha, borderRadius: 2, background: C.cal }}>
                sair
              </button>
            )}
          </div>
          <div className="mt-0.5"><Etiqueta>Ficha, periodização e sessão · 315 exercícios</Etiqueta></div>
          <nav className="flex gap-6 mt-3">
            {[{ v: "alunos", r: "Jogadores" }, { v: "catalogo", r: "Catálogo" }, { v: "taticas", r: "Táticas" }, { v: "casos", r: "Casos" }, { v: "metodo", r: "Como decide" }].map((t) => (
              <button key={t.v} onClick={() => { setAba(t.v); setAbertoId(null); }}
                style={{ fontFamily: ARCH, fontSize: 13, fontWeight: aba === t.v ? 700 : 500, padding: "6px 0", cursor: "pointer", color: aba === t.v ? C.tinta : C.grafite, borderBottom: "2px solid " + (aba === t.v ? C.saibro : "transparent") }}>
                {t.r}
              </button>
            ))}
          </nav>
        </div>
      </header>

      <main className="px-5 py-6" style={{ maxWidth: 760, margin: "0 auto" }}>
        {carregando ? <p style={{ ...prosa, color: C.grafite }}>Carregando…</p> :
         aba === "catalogo" ? <TelaCatalogo /> :
         aba === "taticas" ? <TelaTaticas /> :
         aba === "casos" ? <TelaCasos /> :
         aba === "metodo" ? <TelaMetodo /> :
         aberto ? (
          <div>
            <button onClick={() => setAbertoId(null)} className="mb-3" style={{ ...prosa, color: C.grafite, cursor: "pointer" }}>← Todos os jogadores</button>
            <h1 style={{ fontFamily: ARCH, fontSize: 25, fontWeight: 700, lineHeight: 1.1 }}>{aberto.nome || "Sem nome"}</h1>
            <div className="mt-2 mb-5"><Etiqueta>{aberto.nivel} · Estágio {aberto.estagio} · {aberto.semanas} semanas · {aberto.historico.length} sessões</Etiqueta></div>
            <div className="flex gap-5 mb-6" style={{ borderBottom: "1px solid " + C.linha }}>
              {[{ v: "ficha", r: "Ficha" }, { v: "plano", r: "Plano" }, { v: "periodizacao", r: "Periodização" }, { v: "sessao", r: "Sessão" }, { v: "scout", r: "Scout" }, { v: "registro", r: "Caderno" }].map((t) => (
                <button key={t.v} onClick={() => setSubaba(t.v)}
                  style={{ fontFamily: ARCH, fontSize: 13, fontWeight: subaba === t.v ? 700 : 500, padding: "8px 0", cursor: "pointer", color: subaba === t.v ? C.tinta : C.grafite, borderBottom: "2px solid " + (subaba === t.v ? C.saibro : "transparent"), marginBottom: -1 }}>
                  {t.r}
                </button>
              ))}
            </div>
            {subaba === "ficha" ? <TelaFicha aluno={aberto} salvar={salvar} /> :
             subaba === "plano" ? <TelaPlano aluno={aberto} alunos={alunos} setAlunos={setAlunos} /> :
             subaba === "periodizacao" ? <TelaPeriodizacao aluno={aberto} /> :
             subaba === "scout" ? <TelaScout aluno={aberto} alunos={alunos} setAlunos={setAlunos} /> :
             subaba === "registro" ? <TelaRegistro aluno={aberto} alunos={alunos} setAlunos={setAlunos} /> :
             <TelaSessao aluno={aberto} alunos={alunos} setAlunos={setAlunos} />}
          </div>
        ) : (
          <div>
            <p style={{ ...prosa, color: C.grafite, marginBottom: 20 }}>
              Cada jogador guarda a ficha das quatro camadas, o calendário e o histórico de sessões.
              É desse conjunto que sai a periodização.
            </p>
            {alunos.map((a) => (
              <button key={a.id} onClick={() => { setAbertoId(a.id); setSubaba("ficha"); }}
                className="w-full text-left flex items-center justify-between gap-3"
                style={{ background: C.cal, border: "1px solid " + C.linha, borderRadius: 2, padding: "13px 15px", marginBottom: 8 }}>
                <div>
                  <div style={{ fontFamily: ARCH, fontSize: 15, fontWeight: 700 }}>{a.nome || "Sem nome"}</div>
                  <div className="mt-1"><Etiqueta>{a.nivel} · Estágio {a.estagio} · {a.inicio ? `início ${a.inicio}` : "sem calendário"}</Etiqueta></div>
                </div>
                <span style={{ color: C.grafite, fontSize: 20 }}>→</span>
              </button>
            ))}
            <div className="mt-4"><Botao onClick={criar} variante="saibro">Novo jogador</Botao></div>
          </div>
        )}
      </main>
    </div>
  );
}

function novoCaso() {
  return {
    id: "caso" + Date.now(), data: new Date().toISOString().slice(0, 10), autor: "",
    aluno: "", observei: "", concluí: "", fiz: "", porque: "", depois: "", refazer: "",
  };
}

function TelaCasos() {
  const [casos, setCasos] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [editando, setEditando] = useState(null);
  const [busca, setBusca] = useState("");

  useEffect(() => { leia("mty:casos:v1", [], true).then((c) => { setCasos(c); setCarregando(false); }); }, []);
  useEffect(() => { if (!carregando) grave("mty:casos:v1", casos, true); }, [casos, carregando]);

  function salvarCaso(c) {
    setCasos((lista) => lista.some((x) => x.id === c.id) ? lista.map((x) => (x.id === c.id ? c : x)) : [c, ...lista]);
    setEditando(null);
  }
  function remover(id) { setCasos((lista) => lista.filter((x) => x.id !== id)); }

  const filtrados = casos.filter((c) => (c.aluno + " " + c.observei + " " + c.concluí).toLowerCase().includes(busca.toLowerCase()));

  if (editando) {
    const c = editando;
    const set = (k, v) => setEditando({ ...c, [k]: v });
    return (
      <div>
        <button onClick={() => setEditando(null)} className="mb-3" style={{ ...prosa, color: C.grafite, cursor: "pointer" }}>← Todos os casos</button>
        <Secao titulo="Ficha de caso" nota="Este banco é compartilhado com toda a equipe — o que você escrever aqui, os outros treinadores veem.">
          <Campo rotulo="Autor"><input style={entrada} value={c.autor} onChange={(e) => set("autor", e.target.value)} placeholder="Seu nome" /></Campo>
          <div className="grid grid-cols-2 gap-3">
            <Campo rotulo="Data"><input type="date" style={entrada} value={c.data} onChange={(e) => set("data", e.target.value)} /></Campo>
            <Campo rotulo="Aluno"><input style={entrada} value={c.aluno} onChange={(e) => set("aluno", e.target.value)} placeholder="Idade, tempo de tênis, nível" /></Campo>
          </div>
          <Campo rotulo="O que eu observei" nota="Só descrição — sem causa, sem juízo. Nada de 'nervoso' ou 'desmotivado'.">
            <textarea rows={3} style={{ ...entrada, resize: "vertical" }} value={c.observei} onChange={(e) => set("observei", e.target.value)} />
          </Campo>
          <Campo rotulo="O que eu concluí" nota="Aqui sim entra a sua leitura.">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.concluí} onChange={(e) => set("concluí", e.target.value)} />
          </Campo>
          <Campo rotulo="O que eu fiz">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.fiz} onChange={(e) => set("fiz", e.target.value)} />
          </Campo>
          <Campo rotulo="Por que assim, e não de outro jeito">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.porque} onChange={(e) => set("porque", e.target.value)} />
          </Campo>
          <Campo rotulo="O que aconteceu depois">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.depois} onChange={(e) => set("depois", e.target.value)} />
          </Campo>
          <Campo rotulo="Se eu pudesse refazer" nota="Opcional.">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.refazer} onChange={(e) => set("refazer", e.target.value)} />
          </Campo>
        </Secao>
        <div className="flex gap-2">
          <Botao onClick={() => salvarCaso(c)} variante="saibro">Salvar caso</Botao>
          {casos.some((x) => x.id === c.id) && <Botao variante="vazio" onClick={() => { remover(c.id); setEditando(null); }}>Remover</Botao>}
        </div>
      </div>
    );
  }

  return (
    <div>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 16 }}>
        Banco de casos da equipe — compartilhado entre todos os treinadores que abrem este
        aplicativo. Casos que deram errado valem tanto quanto os que deram certo.
      </p>
      <input style={{ ...entrada, marginBottom: 14 }} value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar por aluno ou palavra-chave" />
      {carregando ? <p style={{ ...prosa, color: C.grafite }}>Carregando…</p> : filtrados.length === 0 ? (
        <p style={{ ...prosa, color: C.grafite }}>Nenhum caso ainda. O primeiro pode ser seu.</p>
      ) : filtrados.map((c) => (
        <button key={c.id} onClick={() => setEditando(c)} className="w-full text-left"
          style={{ background: C.cal, border: "1px solid " + C.linha, borderRadius: 2, padding: "11px 14px", marginBottom: 8, display: "block" }}>
          <div className="flex items-center justify-between">
            <span style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700 }}>{c.aluno || "Sem identificação"}</span>
            <Etiqueta>{c.data}{c.autor ? " · " + c.autor : ""}</Etiqueta>
          </div>
          <p style={{ ...prosa, fontSize: 13, color: C.grafite, marginTop: 4 }}>{(c.observei || "").slice(0, 140)}{(c.observei || "").length > 140 ? "…" : ""}</p>
        </button>
      ))}
      <div className="mt-4"><Botao onClick={() => setEditando(novoCaso())} variante="saibro">Novo caso</Botao></div>
    </div>
  );
}

function TelaMetodo() {
  return (
    <div>
      <p style={{ ...prosa, marginBottom: 18 }}>
        O sistema não inventa nada. Ele aplica regras já escritas no método e mostra o resultado
        para o treinador decidir.
      </p>
      {[
        ["A ficha é a F-01", "Identificação, corpo, histórico de atividades, contexto e as quatro camadas. Os campos são os do manual, não uma invenção do app."],
        ["A ordem das camadas é travada", "Técnico abre físico, que abre tático, que abre mental. Analisar o mental antes do técnico é julgar a coragem de alguém apoiado no pé errado."],
        ["As competições desenham as fases", "Semana do torneio, duas de afinação antes da primeira competição e uma antes das seguintes, regeneração depois, ponte entre torneios próximos, descanso no fim. O resto vira base."],
        ["Volume e intensidade nunca no pico juntos", "O volume sobe na base e cai na competição; a intensidade faz o inverso. É essa separação que protege o corpo."],
        ["As prioridades viram ciclos", "As duas maiores lacunas recebem 30% do volume cada; as outras duas, 20%. E definem a proporção tática entre abertura, trocas médias e defesa longa."],
        ["Repetição distribuída", "Cada estímulo dura três treinos e a rotação é parcial. Na sessão, as duas últimas aplicações ficam fora do sorteio."],
        ["O olhar decide", "Toda proposta é editável antes de registrar. O sistema propõe; quem decide é quem está na quadra."],
        ["O jogo entra por métrica de processo", "O scout coleta onde o ponto terminou, se o erro foi de decisão ou de execução e se o protocolo aconteceu. O placar é calculado sozinho para permitir a leitura sob placar adverso — mas o resultado não muda a rota do plano."],
        ["A divergência é o dado", "Cada troca ou corte que você faz sobre a proposta fica registrada. Regra que é recusada toda vez está errada e precisa ser reescrita — é assim que o método se corrige."],
        ["Três objetivos, nesta ordem", "Ganhar a quadra, produzir ângulo, diminuir o tempo. Todo padrão tático (aba Táticas) serve a um deles — o que não serve não é padrão, é jogada bonita."],
        ["O trilho é a progressão de ensino", "Fechado instala a decisão, semiaberto abre com entrada controlada, aberto com regra vira jogo. Um padrão novo nunca entra direto no ponto livre."],
      ].map(([t, d], i) => (
        <div key={t} className="flex gap-4 mb-5">
          <div style={{ fontFamily: ARCH, fontSize: 12, fontWeight: 700, color: C.saibro, paddingTop: 3, width: 20, flexShrink: 0 }}>{i + 1}</div>
          <div>
            <div style={{ fontFamily: ARCH, fontSize: 14.5, fontWeight: 700 }}>{t}</div>
            <p style={{ ...prosa, fontSize: 13.5, color: C.grafite, marginTop: 3 }}>{d}</p>
          </div>
        </div>
      ))}
      <Aviso>
        Dos 315 exercícios, 189 vêm do banco histórico da equipe — estágio, regressão, progressão,
        corrigir e ignorar foram deduzidos do método e ainda esperam revisão exercício a exercício.
        Os outros 126 (novos, lúdicos e a família de trilhos táticos) já nasceram neste formato.
      </Aviso>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>

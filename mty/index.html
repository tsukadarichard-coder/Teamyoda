      {!rascunho?.fim && (
        <div>
          <div className="mb-2"><Etiqueta>Como o ponto terminou</Etiqueta></div>
          <div className="grid grid-cols-2 gap-2 mb-4">
            {FIM_PONTO.map((op) => (
              <button key={op.v}
                onClick={() => setRascunho({ ...(rascunho || {}), ...{
                  fim: op.v, nos: op.nos, saque: rascunho?.saquePre || null, bola: null, causa: null,
                  protocolo: false, rede: false, ataquePerdido: false, adverso, sacador: placar.saque } })}
                style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700, padding: "20px 8px",
                  border: "1px solid " + op.cor, borderRadius: 2, background: C.cal, color: op.cor, cursor: "pointer" }}>
                {op.r}
              </button>
            ))}
          </div>
        </div>
      )}

      {rascunho?.fim && (
        <div style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + C.saibro, padding: 15 }}>
          <div className="mb-3">
            <Etiqueta cor={C.saibro}>{FIM_PONTO.find((o) => o.v === rascunho.fim).r}</Etiqueta>
          </div>

          {rascunho.fim === "erro_nos" && (
            <Campo rotulo="A causa" nota="Decisão errada e execução errada não se corrigem juntas.">
              <Seletor opcoes={[{ v: "decisao", r: "Decisão" }, { v: "execucao", r: "Execução" }]}
                valor={rascunho.causa} aoMudar={(v) => setRascunho({ ...rascunho, causa: v })} />
            </Campo>
          )}

          <div className="flex flex-wrap gap-2 mb-4">
            {[["protocolo", "Protocolo antes do ponto"], ["rede", "Subiu à rede"], ["ataquePerdido", "Demanda de ataque não convertida"]].map(([k, r]) => (
              <button key={k} onClick={() => setRascunho({ ...rascunho, [k]: !rascunho[k] })}
                style={{ fontFamily: ARCH, fontSize: 12, fontWeight: 600, padding: "7px 11px", borderRadius: 2,
                  cursor: "pointer", border: "1px solid " + (rascunho[k] ? C.tinta : C.linha),
                  background: rascunho[k] ? C.tinta : C.cal, color: rascunho[k] ? C.papel : C.grafite }}>
                {rascunho[k] ? "✓ " : ""}{r}
              </button>
            ))}
          </div>

          <div className="mb-2"><Etiqueta>Em que bola o ponto terminou</Etiqueta></div>
          <div className="grid grid-cols-3 gap-2">
            {["1-2", "3-4", "5+"].map((b) => (
              <button key={b} onClick={() => confirma(b)}
                style={{ fontFamily: ARCH, fontSize: 16, fontWeight: 700, padding: "18px 6px", borderRadius: 2,
                  cursor: "pointer", border: "1px solid " + C.tinta, background: C.tinta, color: C.papel }}>
                {b}
              </button>
            ))}
          </div>
        </div>
      )}

      <div className="flex items-center justify-between mt-6">
        <Etiqueta>{pontos.length} pontos</Etiqueta>
        <div className="flex gap-2">
          <Botao pequeno variante="vazio" onClick={desfazer}>Desfazer</Botao>
          <Botao pequeno onClick={() => setFase("depois")}>Encerrar e ver relatório</Botao>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────── relatório ─────────────────────────── */
function resume(pontos) {
  const n = pontos.length || 1;
  const conta = (f) => pontos.filter(f).length;
  const pct = (x) => Math.round((x / n) * 100);

  const curtos = conta((p) => p.bola === "1-2");
  const medios = conta((p) => p.bola === "3-4");
  const longos = conta((p) => p.bola === "5+");
  const ganhos = conta((p) => p.nos);
  const errosNos = pontos.filter((p) => p.fim === "erro_nos");
  const errosDecisao = errosNos.filter((p) => p.causa === "decisao").length;
  const errosExec = errosNos.filter((p) => p.causa === "execucao").length;
  const errosCurtos = errosNos.filter((p) => p.bola === "1-2").length;

  const meusSaques = pontos.filter((p) => p.sacador === "nos");
  const df = meusSaques.filter((p) => p.saque === "df");
  const dfAdverso = df.filter((p) => p.adverso).length;
  const saquesAdverso = meusSaques.filter((p) => p.adverso).length || 1;
  const saquesNeutro = meusSaques.length - saquesAdverso || 1;
  const razaoDF = ((dfAdverso / saquesAdverso) / (Math.max(df.length - dfAdverso, 0.0001) / saquesNeutro)) || 0;

  const primeiros = meusSaques.filter((p) => p.saque === "1").length;
  const comSaqueMarcado = meusSaques.filter((p) => p.saque).length || 1;

  const protocolo = conta((p) => p.protocolo);
  const rede = conta((p) => p.rede);
  const redeGanha = conta((p) => p.rede && p.nos);
  const ataquePerdido = conta((p) => p.ataquePerdido);

  const adversos = pontos.filter((p) => p.adverso);
  const adversosGanhos = adversos.filter((p) => p.nos).length;

  return {
    n: pontos.length, curtos, medios, longos,
    pctCurtos: pct(curtos), pctMedios: pct(medios), pctLongos: pct(longos),
    pctAte4: pct(curtos + medios),
    ganhos, pctGanhos: pct(ganhos),
    errosNos: errosNos.length, errosDecisao, errosExec, errosCurtos,
    pctErrosCurtos: errosNos.length ? Math.round((errosCurtos / errosNos.length) * 100) : 0,
    df: df.length, dfAdverso, razaoDF: Number(razaoDF.toFixed(1)),
    pctPrimeiro: Math.round((primeiros / comSaqueMarcado) * 100),
    pctProtocolo: pct(protocolo), rede, redeGanha, ataquePerdido,
    adversos: adversos.length, adversosGanhos,
    pctAdversos: adversos.length ? Math.round((adversosGanhos / adversos.length) * 100) : 0,
  };
}

function leitura(r) {
  const sinais = [];
  if (r.pctErrosCurtos >= 40)
    sinais.push(["devolucao", `${r.pctErrosCurtos}% dos seus erros aconteceram na bola 1–2. O ponto está sendo perdido antes de existir — o trabalho é de início do ponto, não de troca.`]);
  if (r.razaoDF >= 1.5 && r.df > 0)
    sinais.push(["saque", `As duplas faltas aparecem ${r.razaoDF}× mais sob placar adverso. Isso é rotina antes do saque, não mecânica.`]);
  else if (r.pctPrimeiro > 0 && r.pctPrimeiro < 55)
    sinais.push(["saque", `${r.pctPrimeiro}% de primeiro saque dentro. Abaixo da faixa que sustenta o padrão de abertura.`]);
  if (r.errosDecisao > r.errosExec && r.errosNos >= 5)
    sinais.push(["fundo", `Mais erros de decisão (${r.errosDecisao}) que de execução (${r.errosExec}). O recurso existe; o padrão de decisão é que não está treinado.`]);
  if (r.errosExec > r.errosDecisao * 2 && r.errosNos >= 5)
    sinais.push(["fundo", `Os erros são de execução (${r.errosExec} contra ${r.errosDecisao} de decisão). A decisão está certa — corrige-se apoio e ponto de contato, nunca a jogada.`]);
  if (r.pctProtocolo > 0 && r.pctProtocolo < 70)
    sinais.push(["mental", `Protocolo presente em ${r.pctProtocolo}% dos pontos. Abaixo de 80% o intervalo de 20 segundos está sendo desperdiçado.`]);
  if (r.ataquePerdido >= 4)
    sinais.push(["rede", `${r.ataquePerdido} bolas com demanda de ataque não convertidas. É a assimetria clássica: reconhecer defesa é fácil, decidir atacar é o que custa.`]);
  if (r.pctLongos >= 35)
    sinais.push(["movimentacao", `${r.pctLongos}% dos pontos passaram de cinco bolas. Acima do que os dados do circuito mostram — o tempo do adversário não está sendo reduzido.`]);
  return sinais;
}

function Relatorio({ aluno, alunos, setAlunos, cfg, pontos, placar, aoSair }) {
  const r = useMemo(() => resume(pontos), [pontos]);
  const sinais = useMemo(() => leitura(r), [r]);
  const [salvo, setSalvo] = useState(false);

  const dados = [
    { faixa: "1–2 bolas", valor: r.pctCurtos },
    { faixa: "3–4 bolas", valor: r.pctMedios },
    { faixa: "5+ bolas", valor: r.pctLongos },
  ];

  function salvar() {
    const reg = {
      id: "r" + Date.now(), tipo: "jogo", data: new Date().toISOString().slice(0, 10),
      torneio: cfg.torneio || "jogo-treino", adversario: cfg.adversario || "—",
      plano: "", protocolo: r.pctProtocolo, erros12: r.pctErrosCurtos,
      revelou: sinais.map((s) => s[1]).join(" "),
      resultado: placar ? [...placar.sets.map((x) => `${x[0]}-${x[1]}`)].join(" ") || "não concluído" : "—",
      scout: { ...r, pontos },
    };
    setAlunos(alunos.map((a) => a.id === aluno.id ? { ...a, registros: [...(a.registros || []), reg] } : a));
    setSalvo(true);
  }

  function reordenar() {
    const areas = [...new Set(sinais.map((s) => s[0]))];
    const nova = [...areas, ...aluno.prioridades.filter((p) => !areas.includes(p))];
    setAlunos(alunos.map((a) => a.id === aluno.id ? { ...a, prioridades: nova } : a));
  }

  if (!pontos.length)
    return <div><Aviso>Nenhum ponto coletado.</Aviso><Botao onClick={aoSair}>Voltar</Botao></div>;

  return (
    <div>
      <Secao titulo="Onde o ponto se decidiu" nota="Cerca de 70% dos pontos do circuito terminam em até quatro bolas. É contra essa referência que se lê o jogo.">
        <div className="flex mb-3" style={{ height: 40 }}>
          {dados.map((d, i) => (
            <div key={d.faixa} style={{ width: Math.max(d.valor, 3) + "%", background: [C.saibro, C.quadra, C.grafite][i],
              color: "#fff", fontFamily: ARCH, fontSize: 11, fontWeight: 700, display: "flex",
              alignItems: "center", justifyContent: "center", borderRight: "2px solid " + C.papel }}>
              {d.valor}%
            </div>
          ))}
        </div>
        <Tabela cabecalho={["Faixa", "Pontos", "%"]}
          linhas={[["1–2 bolas", r.curtos, r.pctCurtos + "%"], ["3–4 bolas", r.medios, r.pctMedios + "%"], ["5 ou mais", r.longos, r.pctLongos + "%"]]} />
        <p style={{ ...prosa, fontSize: 13.5, color: C.grafite, marginTop: 10 }}>
          {r.pctAte4}% dos pontos terminaram em até quatro bolas.
          {r.pctAte4 >= 65 ? " Em linha com o circuito." : " Abaixo do circuito — o jogo está indo para a troca longa."}
        </p>
      </Secao>

      <Secao titulo="O jogo em números">
        <Tabela cabecalho={["Medida", "Valor"]} linhas={[
          ["Pontos coletados", r.n],
          ["Pontos ganhos", `${r.ganhos} · ${r.pctGanhos}%`],
          ["Erros do meu jogador", r.errosNos],
          ["— por decisão", r.errosDecisao],
          ["— por execução", r.errosExec],
          ["Erros na bola 1–2", `${r.errosCurtos} · ${r.pctErrosCurtos}% dos erros`],
          ["1º saque dentro", r.pctPrimeiro ? r.pctPrimeiro + "%" : "não marcado"],
          ["Duplas faltas", `${r.df} · ${r.dfAdverso} em placar adverso`],
          ["Protocolo entre pontos", r.pctProtocolo + "%"],
          ["Subidas à rede", `${r.rede} · ${r.redeGanha} convertidas`],
          ["Demandas de ataque perdidas", r.ataquePerdido],
          ["Pontos em placar adverso", `${r.adversos} · ${r.pctAdversos}% ganhos`],
        ]} larguras={["58%", "42%"]} />
      </Secao>

      <Secao titulo="O que este jogo aponta" nota="Leitura automática pelas regras do método. É ponto de partida para a sua conversa com o atleta, não conclusão.">
        {sinais.length === 0 ? (
          <p style={{ ...prosa, color: C.grafite }}>
            Nada fora do esperado nos indicadores coletados. Vale olhar o registro livre no caderno.
          </p>
        ) : (
          sinais.map(([area, txt], i) => (
            <div key={i} className="flex gap-4 mb-4">
              <div style={{ width: 4, background: C.saibro, flexShrink: 0 }} />
              <div>
                <Etiqueta cor={C.saibro}>{AREAS[area]?.nome || area}</Etiqueta>
                <p style={{ ...prosa, fontSize: 13.5, marginTop: 3 }}>{txt}</p>
              </div>
            </div>
          ))
        )}
        {sinais.length > 0 && (
          <div className="mt-4">
            <Botao pequeno variante="vazio" onClick={reordenar}>
              Reordenar prioridades do jogador por esta leitura
            </Botao>
            <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 8 }}>
              Muda os ciclos de estímulo e a proporção tática do plano. A rotação de estímulos
              acontece no fim do mesociclo — não no dia seguinte ao jogo.
            </p>
          </div>
        )}
      </Secao>

      <Aviso>
        Um jogo é uma amostra. Três jogos na mesma direção são um sinal; um jogo isolado é ruído. O
        resultado não muda a rota do plano — quem muda a rota é o padrão que se repete.
      </Aviso>

      <div className="flex gap-2 flex-wrap">
        {!salvo ? <Botao onClick={salvar} variante="saibro">Salvar no caderno</Botao>
          : <Etiqueta cor={C.quadra}>✓ Salvo no caderno do jogador</Etiqueta>}
        <Botao variante="vazio" onClick={aoSair}>Novo jogo</Botao>
      </div>
    </div>
  );
}

/* ─────────────────────────── caderno ─────────────────────────── */
const DIAS_SEM = ["SEG", "TER", "QUA", "QUI", "SEX"];

function exportaCaderno(a) {
  const regs = a.registros || [];
  const L = [`# Caderno — ${a.nome || "sem nome"}`, ""];
  L.push(`Estágio ${a.estagio} · nível ${a.nivel} · ${regs.length} registros`, "");

  const sess = regs.filter((r) => r.tipo === "sessao");
  if (sess.length) {
    L.push("## Sessões", "");
    sess.forEach((r) => {
      L.push(`### ${r.data} · ciclo ${r.ciclo} · ${r.duracao} min`);
      L.push(`Aplicados: ${r.exercicios.join(" · ")}`);
      if (r.corrigi) L.push(`**Corrigi:** ${r.corrigi}`);
      if (r.ignorei) L.push(`**Vi e deixei passar:** ${r.ignorei}`);
      if (r.mudaria) L.push(`**Teria montado diferente:** ${r.mudaria}`);
      L.push(`Presença do jogador: ${r.nota}/5`);
      if (r.divergencias?.length) {
        L.push("Divergências sobre a proposta:");
        r.divergencias.forEach((d) => L.push(`- ${d.bloco}: ${d.tipo === "troca" ? `${d.saiu} → ${d.entrou}` : `cortou ${d.saiu}`}`));
      }
      L.push("");
    });
  }

  const jogos = regs.filter((r) => r.tipo === "jogo");
  if (jogos.length) {
    L.push("## Jogos", "");
    L.push("| Data | Torneio | Adversário | Plano em uma frase | Protocolo | Erros bola 1–2 | O que o jogo revelou | Resultado |");
    L.push("|---|---|---|---|---|---|---|---|");
    jogos.forEach((r) => L.push(`| ${r.data} | ${r.torneio} | ${r.adversario} | ${r.plano} | ${r.protocolo}% | ${r.erros12}% | ${r.revelou} | ${r.resultado} |`));
    L.push("");
  }

  const semanas = regs.filter((r) => r.tipo === "semana");
  if (semanas.length) {
    L.push("## Planilha semanal (F-03)", "");
    semanas.forEach((r) => {
      L.push(`### Semana de ${r.data}`, "");
      L.push("| Dia | Erros bola 1–2 (%) | Bola em que a atenção soltou | Protocolo nos sets (%) | Observação |");
      L.push("|---|---|---|---|---|");
      DIAS_SEM.forEach((d) => {
        const l = r.linhas[d] || {};
        L.push(`| ${d} | ${l.erros || ""} | ${l.atencao || ""} | ${l.protocolo || ""} | ${l.obs || ""} |`);
      });
      L.push("");
    });
  }

  const med = regs.filter((r) => r.tipo === "medicao");
  if (med.length) {
    L.push("## Medições dos critérios", "");
    L.push("| Data | Área | Métrica | Valor |");
    L.push("|---|---|---|---|");
    med.forEach((r) => L.push(`| ${r.data} | ${r.area} | ${r.metrica} | ${r.valor} |`));
    L.push("");
  }

  L.push("---", "", "Material de campo. Serve para corrigir o método, não para julgar o jogador.");
  return L.join("\n");
}

function TelaRegistro({ aluno, alunos, setAlunos }) {
  const [modo, setModo] = useState("historico");
  const regs = aluno.registros || [];

  function adiciona(reg) {
    setAlunos(alunos.map((a) => a.id === aluno.id ? { ...a, registros: [...(a.registros || []), reg] } : a));
    setModo("historico");
  }
  function apaga(id) {
    setAlunos(alunos.map((a) => a.id === aluno.id ? { ...a, registros: a.registros.filter((r) => r.id !== id) } : a));
  }

  function baixar() {
    const blob = new Blob([exportaCaderno(aluno)], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const el = document.createElement("a");
    el.href = url;
    el.download = `caderno-${(aluno.nome || "jogador").toLowerCase().replace(/\s+/g, "-")}.md`;
    el.click();
    URL.revokeObjectURL(url);
  }

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-6">
        <Seletor
          opcoes={[
            { v: "historico", r: "Histórico" },
            { v: "jogo", r: "+ Jogo" },
            { v: "semana", r: "+ Semana" },
            { v: "medicao", r: "+ Medição" },
          ]}
          valor={modo} aoMudar={setModo} />
      </div>

      {(aluno.jogosRelatados || []).length > 0 && (
        <div className="mb-6">
          <Etiqueta>Jogos relatados pelo aluno, pelo link dele</Etiqueta>
          {aluno.jogosRelatados.map((j) => (
            <div key={j.id} style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + C.grafite, padding: "10px 13px", marginTop: 8 }}>
              <Etiqueta>{new Date(j.data).toLocaleDateString("pt-BR")}</Etiqueta>
              <p style={{ ...prosa, fontSize: 13.5, marginTop: 4 }}>{j.texto}</p>
            </div>
          ))}
        </div>
      )}

      {modo === "jogo" && <FormJogo aoSalvar={adiciona} />}
      {modo === "semana" && <FormSemana aoSalvar={adiciona} />}
      {modo === "medicao" && <FormMedicao aluno={aluno} aoSalvar={adiciona} />}

      {modo === "historico" && (
        <div>
          {regs.length === 0 ? (
            <Aviso cor={C.quadra}>
              Nada registrado ainda. O caderno é o que faz o plano melhorar: cada sessão fechada,
              cada jogo e cada medição vira material para rever as regras.
            </Aviso>
          ) : (
            <>
              <div className="mb-4"><Etiqueta>{regs.length} registros</Etiqueta></div>
              {[...regs].reverse().map((r) => (
                <div key={r.id} style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + (r.tipo === "jogo" ? C.saibro : C.quadra), padding: "11px 13px", marginBottom: 8 }}>
                  <div className="flex justify-between items-start gap-3">
                    <div className="flex-1">
                      <Etiqueta>{r.data} · {r.tipo}</Etiqueta>
                      {r.tipo === "sessao" && (
                        <p style={{ ...prosa, fontSize: 13.5, marginTop: 4 }}>
                          Ciclo {r.ciclo} · {r.exercicios.length} exercícios
                          {r.divergencias?.length ? ` · ${r.divergencias.length} divergências` : ""}
                          {(r.exerciciosPersonalizados || []).length > 0 && (
                            <><br /><span style={{ color: C.grafite }}>
                              {r.exerciciosPersonalizados.length === 1 ? "Exercício do treinador: " : "Exercícios do treinador: "}
                              {r.exerciciosPersonalizados.join(" · ")}
                            </span></>
                          )}
                          {r.mudaria ? <><br /><span style={{ color: C.saibro }}>Teria montado diferente: {r.mudaria}</span></> : null}
                        </p>
                      )}
                      {r.tipo === "jogo" && (
                        <p style={{ ...prosa, fontSize: 13.5, marginTop: 4 }}>
                          {r.torneio} · {r.adversario} · {r.resultado}
                          <br />Protocolo executado em {r.protocolo}% dos pontos
                          {r.revelou ? <><br /><span style={{ color: C.grafite }}>{r.revelou}</span></> : null}
                        </p>
                      )}
                      {r.tipo === "semana" && (
                        <p style={{ ...prosa, fontSize: 13.5, marginTop: 4 }}>Planilha da semana preenchida</p>
                      )}
                      {r.tipo === "medicao" && (
                        <p style={{ ...prosa, fontSize: 13.5, marginTop: 4 }}>{r.area} · {r.metrica}: <b>{r.valor}</b></p>
                      )}
                    </div>
                    <button onClick={() => apaga(r.id)} style={iconeEstilo}>×</button>
                  </div>
                </div>
              ))}
              <div className="mt-5">

/* ── rosquinha de status, reaproveitada no plano e no dashboard ──
   Sempre as mesmas três cores com o mesmo sentido em todo o app: feita
   (verde, C.quadra), pendente (grafite, neutro) e repetindo — falta ou
   cancelada, que ainda vai precisar de reposição (vermelho, C.saibro). */
function contagemStatus(aulas, statusDe) {
  const c = { feita: 0, pendente: 0, repetindo: 0 };
  aulas.forEach((a) => {
    const st = statusDe(a.id);
    if (st === "feita") c.feita++;
    else if (st === "falta" || st === "cancelada") c.repetindo++;
    else c.pendente++;
  });
  return c;
}
function RoscaStatus({ contagem, tamanho = 108 }) {
  const dados = [
    { nome: "Feitas", valor: contagem.feita, cor: C.quadra },
    { nome: "Pendentes", valor: contagem.pendente, cor: C.grafite },
    { nome: "Repetindo", valor: contagem.repetindo, cor: C.saibro },
  ].filter((d) => d.valor > 0);
  const total = contagem.feita + contagem.pendente + contagem.repetindo;
  if (total === 0) return null;
  const pct = Math.round((contagem.feita / total) * 100);

  return (
    <div className="flex items-center gap-4 flex-wrap">
      <div style={{ width: tamanho, height: tamanho, position: "relative", flexShrink: 0 }}>
        <ResponsiveContainer width="100%" height="100%">
          <PieChart>
            <Pie data={dados} dataKey="valor" nameKey="nome" innerRadius="68%" outerRadius="100%"
              startAngle={90} endAngle={-270} stroke="none" isAnimationActive={false}>
              {dados.map((d, i) => <Cell key={i} fill={d.cor} />)}
            </Pie>
            <Tooltip formatter={(v, n) => [v + " aula" + (v === 1 ? "" : "s"), n]}
              contentStyle={{ fontFamily: ARCH, fontSize: 12, border: "1px solid " + C.linha, borderRadius: 2 }} />
          </PieChart>
        </ResponsiveContainer>
        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", pointerEvents: "none" }}>
          <span style={{ fontFamily: ARCH, fontSize: 20, fontWeight: 700 }}>{pct}%</span>
          <span style={{ fontFamily: ARCH, fontSize: 9.5, color: C.grafite, textTransform: "uppercase", letterSpacing: "0.06em" }}>feitas</span>
        </div>
      </div>
      <div>
        {[["Feitas", C.quadra, contagem.feita], ["Pendentes", C.grafite, contagem.pendente], ["Repetindo", C.saibro, contagem.repetindo]]
          .filter(([, , v]) => v > 0)
          .map(([nome, cor, v]) => (
            <div key={nome} className="flex items-center gap-2 mb-1">
              <span style={{ width: 9, height: 9, borderRadius: 999, background: cor, display: "inline-block" }} />
              <span style={{ ...prosa, fontSize: 12.5 }}>{nome} · {v}</span>
            </div>
          ))}
      </div>
    </div>
  );
}

/* Visão do raciocínio do plano — blocos, progressão e a cadeia causal
   que sustenta o ciclo, sem exercício nenhum: isso já mora na Sessão de
   hoje. É a "visão geral de planejamento" que o treinador marca e
   acompanha, não o lugar onde ele escolhe o que vai treinar hoje. */
/* Saque e devolução são obrigatoriedade do método (PRINCIPIOS_MTY) —
   o prompt já pede isso à IA, mas um plano colado à mão ou revisado
   pelo treinador pode ter perdido a cobertura numa semana. Aponta,
   sem bloquear: quem decide é sempre o treinador. */
function semanasSemSaqueDevolucao(aulas) {
  const porSemana = {};
  aulas.forEach((a) => {
    /* a numeração de semana é relativa ao bloco (Bloco 1 · semana 1,
       Bloco 2 · semana 1, ...) — agrupar só por número de semana
       juntava blocos diferentes e escondia uma semana sem cobertura
       atrás da cobertura de outro bloco que calhava do mesmo número. */
    const chave = a.bloco + "·" + a.semana;
    const s = porSemana[chave] || (porSemana[chave] = { saque: false, devolucao: false });
    (a.ex || []).forEach((c) => {
      const ex = TODOS_EXERCICIOS().find((e) => e.c === c);
      if (!ex) return;
      if (AREAS.saque.busca.test(ex.n + " " + ex.m)) s.saque = true;
      if (AREAS.devolucao.busca.test(ex.n + " " + ex.m)) s.devolucao = true;
    });
  });
  return Object.values(porSemana).filter((s) => !s.saque || !s.devolucao).length;
}

/* Progresso por bloco, com o selo de gate (liberado/aguardando) —
   compartilhado entre o resumo (LinhaDeRaciocinio) e a visão geral no
   topo da aba Aulas, pra não ter duas contas divergentes do mesmo
   número. */
function calcularProgressoBlocos(plano, aulas, status, reg) {
  return plano.blocos.map((b, bi) => {
    const nomeBloco = b.titulo || b.nome;
    const aulasDoBloco = aulas.filter((a) => a.bloco === nomeBloco);
    const c = contagemStatus(aulasDoBloco, status);
    const saidaTexto = typeof b.saida === "string" && b.saida.trim() ? b.saida.trim()
      : b.saida ? "Critério de saída avaliado no fechamento do ciclo." : null;
    /* A transição de bloco (exceto a do último, que fecha pelo ciclo) só é
       liberada quando o treinador confirma o critério de saída na aba
       Aulas — este selo é só informativo aqui no resumo. */
    let gate = null;
    if ((b.saida || (b.areaFoco && AREAS[b.areaFoco])) && bi < plano.blocos.length - 1) {
      if (blocoLiberado(reg, nomeBloco)) gate = "liberado";
      else if (aulasDoBloco.length > 0 && aulasDoBloco.every((a) => status(a.id) === "feita")) gate = "aguardando";
    }
    return { nome: b.nome, titulo: b.titulo, semanas: b.semanas, alvo: b.alvo, areaFoco: b.areaFoco,
      saidaTexto, portao: b.portao, total: aulasDoBloco.length, gate, ...c };
  });
}

/* Visão geral do processo, no topo da aba Aulas — pra o treinador ver
   de cara aonde o jogador está e o que falta pra mudar de bloco (e do
   critério do catálogo virem com nível, por consequência de nível
   também). Só o gráfico de progresso + o alvo do bloco atual, sem
   entrar nos detalhes de cada aula (isso é o resto da aba). */
function VisaoGeralBlocos({ plano, aulas, status, reg, entidade, eTurma, membros }) {
  const porBloco = useMemo(() => calcularProgressoBlocos(plano, aulas, status, reg), [plano, aulas, reg]);
  const atual = porBloco.find((b) => b.gate === "aguardando") || porBloco.find((b) => b.pendente > 0 || b.repetindo > 0) || porBloco[porBloco.length - 1];
  const blocoAtualDef = atual && plano.blocos.find((b) => (b.titulo || b.nome) === (atual.titulo || atual.nome));
  const catalogo = blocoAtualDef ? criteriosDeSaidaDoBloco(blocoAtualDef, entidade, eTurma, membros) : null;

  return (
    <div className="mb-7">
      <Etiqueta>Visão geral do processo</Etiqueta>
      <div className="mt-2" style={{ width: "100%", height: Math.max(70, porBloco.length * 46) }}>
        <ResponsiveContainer width="100%" height="100%">
          <BarChart data={porBloco} layout="vertical" margin={{ left: 8, right: 16, top: 4, bottom: 4 }}>
            <XAxis type="number" allowDecimals={false} hide />
            <YAxis type="category" dataKey="nome" width={72} tick={{ fontSize: 11, fill: C.tinta }} axisLine={{ stroke: C.linha }} tickLine={false} />
            <Tooltip formatter={(v, n) => [v + " aula" + (v === 1 ? "" : "s"), n]}
              contentStyle={{ fontFamily: ARCH, fontSize: 12, border: "1px solid " + C.linha, borderRadius: 2 }} />
            <Bar dataKey="feita" stackId="s" fill={C.quadra} name="Feitas" isAnimationActive={false} />
            <Bar dataKey="pendente" stackId="s" fill={C.linha} name="Pendentes" isAnimationActive={false} />
            <Bar dataKey="repetindo" stackId="s" fill={C.saibro} name="Repetindo" isAnimationActive={false} radius={[0, 3, 3, 0]} />
          </BarChart>
        </ResponsiveContainer>
      </div>
      <div className="flex gap-1 flex-wrap mt-1">
        {porBloco.map((b, i) => (b.gate && <Etiqueta key={i} cor={b.gate === "liberado" ? C.quadra : C.saibro}>
          {b.titulo}{b.gate === "liberado" ? " · liberado" : " · aguardando confirmação"}
        </Etiqueta>))}
      </div>
      {atual && (atual.saidaTexto || catalogo) && (
        <div className="mt-3" style={{ background: C.cal, borderLeft: "3px solid " + C.saibro, padding: "11px 14px" }}>
          <Etiqueta cor={C.saibro}>Pra mudar de {atual.titulo}{catalogo ? " (nível " + catalogo.nivel + ")" : ""}</Etiqueta>
          {catalogo ? (
            <ul style={{ margin: "6px 0 0 18px", padding: 0 }}>
              {catalogo.itens.map((texto, i) => (
                <li key={i} style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 2 }}>{texto}</li>
              ))}
            </ul>
          ) : (
            <p style={{ ...prosa, fontSize: 12.5, marginTop: 4 }}>{atual.saidaTexto}</p>
          )}
        </div>
      )}
    </div>
  );
}

function LinhaDeRaciocinio({ plano, aulas, status, reg }) {
  const porBloco = calcularProgressoBlocos(plano, aulas, status, reg);
  const cadeia = plano.cadeia || [];
  const semanasFalhas = useMemo(() => semanasSemSaqueDevolucao(aulas), [aulas]);

  return (
    <div className="mb-7">
      {semanasFalhas > 0 && (
        <div className="mb-4">
          <Aviso>
            {semanasFalhas} {semanasFalhas === 1 ? "semana deste plano não tem" : "semanas deste plano não têm"} saque
            {" "}e devolução juntos — são obrigatoriedades do método (a maioria dos pontos, mesmo em nível de
            competição, se decide nos primeiros golpes do ponto). Vale conferir se é intencional.
          </Aviso>
        </div>
      )}

      {cadeia.length > 0 && (
        <div className="mb-6">
          <Etiqueta>Cadeia de raciocínio deste ciclo</Etiqueta>
          <div className="flex items-stretch gap-2 mt-2" style={{ overflowX: "auto", paddingBottom: 2 }}>
            {cadeia.map((c, i) => (
              <React.Fragment key={i}>
                {i > 0 && <div style={{ alignSelf: "center", color: C.grafite, fontFamily: ARCH, fontSize: 16 }}>→</div>}
                <div style={{ minWidth: 150, flex: 1, background: c.raiz ? C.cal : C.papel,
                  border: "1px solid " + (c.raiz ? C.saibro : C.linha), borderTop: "3px solid " + (c.raiz ? C.saibro : C.linha),
                  padding: "9px 11px" }}>
                  <Etiqueta cor={c.raiz ? C.saibro : C.grafite}>{c.camada}{c.raiz ? " · origem" : ""}</Etiqueta>
                  <p style={{ ...prosa, fontSize: 12, marginTop: 4 }}>{c.txt}</p>
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
      )}

      {porBloco.some((b) => b.total > 0) && (
        <div className="mb-4">
          <Etiqueta>Progresso por bloco</Etiqueta>
          <div className="mt-2" style={{ width: "100%", height: Math.max(70, porBloco.length * 46) }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={porBloco} layout="vertical" margin={{ left: 8, right: 16, top: 4, bottom: 4 }}>
                <XAxis type="number" allowDecimals={false} hide />
                <YAxis type="category" dataKey="nome" width={72} tick={{ fontSize: 11, fill: C.tinta }} axisLine={{ stroke: C.linha }} tickLine={false} />
                <Tooltip formatter={(v, n) => [v + " aula" + (v === 1 ? "" : "s"), n]}
                  contentStyle={{ fontFamily: ARCH, fontSize: 12, border: "1px solid " + C.linha, borderRadius: 2 }} />
                <Bar dataKey="feita" stackId="s" fill={C.quadra} name="Feitas" isAnimationActive={false} />
                <Bar dataKey="pendente" stackId="s" fill={C.linha} name="Pendentes" isAnimationActive={false} />
                <Bar dataKey="repetindo" stackId="s" fill={C.saibro} name="Repetindo" isAnimationActive={false} radius={[0, 3, 3, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      )}

      {porBloco.map((b, i) => (
        <div key={i} className="mb-3" style={{ borderLeft: "3px solid " + C.grafite, paddingLeft: 12 }}>
          <div className="flex items-baseline gap-2 flex-wrap">
            <span style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700 }}>{b.nome} · {b.titulo}</span>
            <Etiqueta>semanas {b.semanas}</Etiqueta>
            {b.gate === "liberado" && <Etiqueta cor={C.quadra}>✓ liberado</Etiqueta>}
            {b.gate === "aguardando" && <Etiqueta cor={C.saibro}>aguardando confirmação</Etiqueta>}
          </div>
          {b.alvo && <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 3 }}>{b.alvo}</p>}
          {b.saidaTexto && <p style={{ ...prosa, fontSize: 12, color: C.quadra, marginTop: 3 }}><b>Critério de saída:</b> {b.saidaTexto}</p>}
          {b.portao && <p style={{ ...prosa, fontSize: 12, color: C.saibro, marginTop: 3 }}><b>Portão pro próximo bloco:</b> {b.portao}</p>}
        </div>
      ))}
    </div>
  );
}

function escaparHTML(s) {
  return String(s || "").replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
}

const NOTA_COR = { sim: "#2E4739", par: "#C9A227", nao: "#C8102E", "": "#8A8580" };
const NOTA_LABEL = { sim: "Atingido", par: "Parcial", nao: "Não atingido", "": "Não avaliado" };

/* Exportação em PDF sem biblioteca nenhuma: abre uma aba com um
   documento HTML limpo e chama a caixa de impressão do navegador — em
   qualquer aparelho, "Imprimir" tem a opção "Salvar como PDF" (ou vai
   direto pro app de arquivos, no celular). Nada de Markdown aqui — é
   isso que o treinador e o jogador vão querer mostrar/guardar, não um
   arquivo de texto cru. */
function exportarRelatorioPDF(h, nomeEntidade) {
  const janela = window.open("", "_blank");
  if (!janela) { alert("O navegador bloqueou a janela de exportação — permita pop-ups pra este site e tente de novo."); return; }
  const criteriosHTML = (h.criterios || []).map((c) => (
    '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #E4DED9">' +
    '<span style="width:10px;height:10px;border-radius:999px;background:' + (NOTA_COR[c.resultado] || NOTA_COR[""]) + ';flex-shrink:0"></span>' +
    '<span style="flex:1;font-size:13.5px">' + escaparHTML(c.nome) + '</span>' +
    '<span style="font-size:11.5px;font-weight:700;color:' + (NOTA_COR[c.resultado] || NOTA_COR[""]) + '">' + (NOTA_LABEL[c.resultado] || NOTA_LABEL[""]) + '</span>' +
    '</div>'
  )).join("");
  janela.document.write(
    '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">' +
    '<title>Relatório de ciclo · ' + escaparHTML(nomeEntidade) + '</title>' +
    '<style>' +
    'body{font-family:-apple-system,system-ui,sans-serif;color:#141210;max-width:640px;margin:30px auto;padding:0 20px}' +
    'h1{font-family:Georgia,serif;font-size:20px;margin:0 0 4px}' +
    '.sub{color:#6B6461;font-size:13px;margin-bottom:20px}' +
    'h2{font-family:Georgia,serif;font-size:15px;margin:26px 0 8px}' +
    'pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,monospace;background:#F5F2F0;padding:14px;border-radius:4px}' +
    '@media print { .no-print{display:none} }' +
    '</style></head><body>' +
    '<h1>Relatório de ciclo</h1>' +
    '<div class="sub">' + escaparHTML(nomeEntidade) + ' · ' + escaparHTML(h.tipo || "") + ' · gerado em ' +
      new Date(h.data).toLocaleDateString("pt-BR") + ' · ' + h.feitas + ' de ' + h.total + ' aulas</div>' +
    (criteriosHTML ? '<h2>Critérios de saída</h2>' + criteriosHTML : "") +
    '<h2>Relatório completo</h2><pre>' + escaparHTML(h.texto) + '</pre>' +
    '<button class="no-print" onclick="window.print()" style="margin-top:20px;padding:10px 16px;font-weight:700;cursor:pointer">Salvar como PDF / Imprimir</button>' +
    '</body></html>'
  );
  janela.document.close();
}

/* Ciclos fechados (revisão pela ficha, ou fechamento manual de ciclo) —
   nada se perde quando um plano é substituído; fica arquivado aqui,
   visível tanto com o plano atual quanto com a tela "ainda não tem
   plano" (pra mostrar que o ciclo anterior não sumiu, só foi fechado). */
/* Os critérios de saída são sempre a mesma pergunta, ciclo após ciclo —
   isso é o que permite comparar % de critérios atingidos de um ciclo pro
   outro, mesmo com plano e texto diferentes em cada um. "Aulas
   realizadas" dá pra calcular em QUALQUER ciclo do histórico, mesmo os
   arquivados antes desta métrica existir — só "critérios atingidos" fica
   de fora dos ciclos antigos, que não guardaram o dado estruturado. */
function GraficoEvolucao({ historico }) {
  const cronologico = [...historico].reverse();
  const dados = cronologico.map((h, i) => {
    const comCriterios = (h.criterios || []).length > 0;
    const pctCriterios = comCriterios
      ? Math.round(100 * h.criterios.reduce((s, c) => s + (c.resultado === "sim" ? 1 : c.resultado === "par" ? 0.5 : 0), 0) / h.criterios.length)
      : null;
    const pctAulas = h.total > 0 ? Math.round(100 * (h.feitas / h.total)) : null;
    return { rotulo: "Ciclo " + (i + 1), data: new Date(h.data).toLocaleDateString("pt-BR"), pctCriterios, pctAulas };
  });
  if (dados.length < 2) return null;
  return (
    <div className="mb-5">
      <div className="mb-2"><Etiqueta>Evolução ao longo dos ciclos</Etiqueta></div>
      <div style={{ height: 180, marginLeft: -18 }}>
        <ResponsiveContainer width="100%" height="100%">
          <ComposedChart data={dados}>
            <CartesianGrid vertical={false} stroke={C.linha} />
            <XAxis dataKey="rotulo" tick={{ fontSize: 9, fontFamily: ARCH, fill: C.grafite }} interval={0} />
            <YAxis domain={[0, 100]} tick={{ fontSize: 9, fontFamily: ARCH, fill: C.grafite }} width={28} unit="%" />
            <Tooltip contentStyle={{ fontFamily: ARCH, fontSize: 12, borderRadius: 2, border: "1px solid " + C.linha }}
              labelFormatter={(r, p) => r + (p && p[0] ? " · " + p[0].payload.data : "")}
              formatter={(v, n) => [v == null ? "sem dado" : v + "%", n === "pctCriterios" ? "Critérios atingidos" : "Aulas realizadas"]} />
            <Line type="monotone" dataKey="pctCriterios" stroke={C.quadra} strokeWidth={2} connectNulls dot={{ r: 3 }} />
            <Line type="monotone" dataKey="pctAulas" stroke={C.grafite} strokeWidth={2} connectNulls dot={{ r: 3 }} />
          </ComposedChart>
        </ResponsiveContainer>
      </div>
      <div className="flex gap-4 mt-1">
        <Etiqueta cor={C.quadra}>▬ Critérios atingidos</Etiqueta>
        <Etiqueta cor={C.grafite}>▬ Aulas realizadas</Etiqueta>
      </div>
    </div>
  );
}

function HistoricoRelatorios({ historico, abrirHist, setAbrirHist, removerDoHistorico, podeEditar = true, nomeEntidade }) {
  const [copiadoId, setCopiadoId] = useState(null);
  if (historico.length === 0) return null;

  async function copiar(h) {
    await navigator.clipboard.writeText(h.texto);
    setCopiadoId(h.id);
    setTimeout(() => setCopiadoId((atual) => (atual === h.id ? null : atual)), 2000);
  }

  return (
    <div className="mt-4">
      <GraficoEvolucao historico={historico} />
      <div className="mb-2"><Etiqueta>Histórico de relatórios · {historico.length}</Etiqueta></div>
      {historico.map((h) => (
        <div key={h.id} style={{ background: C.papel, border: "1px solid " + C.linha, padding: "10px 13px", marginBottom: 7 }}>
          <div className="flex items-center justify-between gap-2 flex-wrap">
            <p style={{ ...prosa, fontSize: 12.5 }}>
              {new Date(h.data).toLocaleDateString("pt-BR")} · {h.tipo || "ciclo"} · {h.feitas} de {h.total} aulas
            </p>
            <div className="flex gap-2">
              <Botao pequeno variante="vazio" onClick={() => setAbrirHist(abrirHist === h.id ? null : h.id)}>
                {abrirHist === h.id ? "Fechar" : "Ver"}
              </Botao>
              <Botao pequeno variante="vazio" onClick={() => copiar(h)}>{copiadoId === h.id ? "✓ copiado" : "Copiar"}</Botao>
              <Botao pequeno variante="vazio" onClick={() => exportarRelatorioPDF(h, nomeEntidade)}>Exportar PDF</Botao>
              {podeEditar && <Botao pequeno variante="vazio" onClick={() => removerDoHistorico(h.id)}>Remover</Botao>}
            </div>
          </div>
          {abrirHist === h.id && (
            <textarea readOnly value={h.texto}
              style={{ ...entrada, minHeight: 220, marginTop: 9, fontFamily: "ui-monospace, monospace", fontSize: 11.5, whiteSpace: "pre" }} />
          )}
        </div>
      ))}
    </div>
  );
}

/* ─────────────────────────── catálogo ─────────────────────────── */
/* ─────────────────────────── plano do ciclo ───────────────────────────
   O plano chega como JSON gerado na conversa. Aqui ele vira documento vivo:
   o treinador marca aula, anota, consulta o exercício e fecha o ciclo. */
/* Serve tanto o plano individual (aluno/alunos/setAlunos) quanto o
   plano de turma (turma/membros/turmas/setTurmas) — é o mesmo formato
   de plano (blocos/semanas/aulas), só muda de onde ele vem (ficha de
   um jogador só, ou fichas do grupo inteiro) e onde ele é salvo. */
/* Um cartão de aula da aba Aulas — status (Realizada/Falta/Cancelada) +
   campos de registro. Extraído pra ser reaproveitado tanto pelas aulas
   programadas quanto pelas aulas de reforço (ver reforcarBloco em
   TelaPlano), que têm o mesmo checklist mas nascem de forma diferente. */
function CardAulaChecklist({ id, indice, titulo, descricao, selo, status, defineStatus, reg, campo, chuvaAberta, setChuvaAberta, podeEditar = true }) {
  const d = reg[id] || {};
  const st = status(id);
  const corStatus = { feita: C.quadra, falta: "#8A2E2E", cancelada: C.saibro }[st] || C.linha;
  return (
    <div style={{ borderBottom: "1px solid " + C.linha, background: st === "feita" ? "#F4F7F4" : st ? "#FBF4F0" : C.cal }}>
      <div className="flex gap-3" style={{ padding: "11px 14px" }}>
        <div className="flex-1">
          <div className="flex gap-1 flex-wrap mb-2">
            {[["feita", "Realizada"], ["falta", "Falta"], ["cancelada", "Cancelada"]].map(([v, r]) => (
              <button key={v} disabled={!podeEditar} onClick={() => defineStatus(id, v)}
                style={{ fontFamily: ARCH, fontSize: 10.5, fontWeight: 700, padding: "4px 8px",
                  borderRadius: 2, cursor: podeEditar ? "pointer" : "default", opacity: podeEditar ? 1 : 0.6,
                  border: "1px solid " + (st === v ? corStatus : C.linha),
                  background: st === v ? corStatus : C.papel,
                  color: st === v ? "#fff" : C.grafite }}>{r}</button>
            ))}
          </div>
          <div style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700,
            color: st === "feita" ? C.quadra : C.tinta }}>{indice} · {titulo}</div>
          {descricao && <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 2 }}>{descricao}</p>}
          {(selo === "ss" || (selo && selo.indexOf("cs:") === 0)) && (
            <div className="flex gap-1 flex-wrap mt-2">
              {selo === "ss" && <Etiqueta cor={C.saibro}>sem saque</Etiqueta>}
              {selo && selo.indexOf("cs:") === 0 &&
                <Etiqueta cor={C.quadra}>saque · {selo.split(":")[1]}</Etiqueta>}
            </div>
          )}
        </div>
      </div>
      {st === "feita" && (
        <div className="flex gap-2 flex-wrap" style={{ padding: "0 14px 12px 14px" }}>
          <input type="date" disabled={!podeEditar} style={{ ...entrada, width: 150, fontSize: 12.5, padding: "6px 9px" }}
            value={d.data || ""} onChange={(e) => campo(id, "data", e.target.value)} />
          <input disabled={!podeEditar} style={{ ...entrada, width: 165, fontSize: 12.5, padding: "6px 9px", borderColor: C.saibro }}
            placeholder="dor · min / bolas" value={d.dor || ""}
            onChange={(e) => campo(id, "dor", e.target.value)} />
          <textarea rows={2} disabled={!podeEditar} style={{ ...entrada, flex: 1, minWidth: 210, fontSize: 12.5, resize: "vertical" }}
            placeholder="o que apareceu · o que não apareceu" value={d.obs || ""}
            onChange={(e) => campo(id, "obs", e.target.value)} />
        </div>
      )}
      {(st === "falta" || st === "cancelada") && (
        <div style={{ padding: "0 14px 12px 14px" }}>
          <div className="flex gap-2 flex-wrap">
            <input type="date" disabled={!podeEditar} style={{ ...entrada, width: 150, fontSize: 12.5, padding: "6px 9px" }}
              value={d.data || ""} onChange={(e) => campo(id, "data", e.target.value)} />
            <input list="motivos-cancelamento" disabled={!podeEditar} style={{ ...entrada, flex: 1, minWidth: 210, fontSize: 12.5, padding: "6px 9px" }}
              placeholder={st === "cancelada" ? "motivo do cancelamento · ex: chuva" : "motivo da falta"}
              value={d.motivo || ""} onChange={(e) => campo(id, "motivo", e.target.value)} />
          </div>
          {st === "cancelada" && /chuva/i.test(d.motivo || "") && (
            <div className="mt-2">
              {chuvaAberta === id ? (
                <div>
                  <TreinoChuva />
                  <button onClick={() => setChuvaAberta(null)} className="mt-2" style={{ ...prosa, fontSize: 12, color: C.grafite, cursor: "pointer" }}>Ocultar sugestões</button>
                </div>
              ) : (
                <Botao pequeno variante="vazio" onClick={() => setChuvaAberta(id)}>🌧️ Ver sugestões de dia de chuva</Botao>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}
function TelaPlano({ aluno, alunos, setAlunos, turma, membros, turmas, setTurmas, modo = "resumo", papelAtual, uidAtual }) {
  const eTurma = !!turma;
  const entidade = eTurma ? turma : aluno;
  const podeEditar = eTurma ? podeEditarTurma(turma, papelAtual, uidAtual) : podeEditarAluno(aluno, papelAtual, uidAtual);
  const [colando, setColando] = useState(false);
  const [texto, setTexto] = useState("");
  const [erro, setErro] = useState("");
  const [gerando, setGerando] = useState(false);
  const [etapaIA, setEtapaIA] = useState("");
  const [segundosIA, setSegundosIA] = useState(0);
  const [semanas, setSemanas] = useState(4);
  const [aulasSem, setAulasSem] = useState(3);
  const [relatorio, setRelatorio] = useState("");
  const [relatorioCopiado, setRelatorioCopiado] = useState(false);
  const [relatorioArquivado, setRelatorioArquivado] = useState(false);
  const [linkAluno, setLinkAluno] = useState("");
  const [gerandoLink, setGerandoLink] = useState(false);
  const [linkCopiado, setLinkCopiado] = useState(false);
  const [chuvaAberta, setChuvaAberta] = useState(null);

  const plano = entidade.plano;
  const reg = entidade.regPlano || {};
  const historico = entidade.historicoRelatorios || [];
  const [abrirHist, setAbrirHist] = useState(null);

  /* Cronômetro da espera da IA. Fica aqui em cima, junto dos outros
     hooks, porque abaixo tem o early return do "ainda não tem plano" —
     e é justamente nessa tela que a barra de progresso aparece. */
  useEffect(() => {
    if (!gerando) { setSegundosIA(0); return; }
    const inicio = Date.now();
    const t = setInterval(() => setSegundosIA(Math.round((Date.now() - inicio) / 1000)), 500);
    return () => clearInterval(t);
  }, [gerando]);

  function atualiza(campos) {
    if (eTurma) setTurmas(turmas.map((t) => (t.id === turma.id ? { ...t, ...campos } : t)));
    else setAlunos(alunos.map((a) => (a.id === aluno.id ? { ...a, ...campos } : a)));
  }

  const valida = validarPlanoJSON;

  /* Cada geração leva um número. Parar de esperar, colar um plano à mão
     ou disparar outra geração invalidam a anterior: quando a IA velha
     finalmente responde, ela vê que já não é a geração da vez e sai sem
     sobrescrever o que está na tela nem apagar a barra da geração nova.
     Um booleano não daria conta — a geração seguinte o zeraria, e a
     resposta atrasada da primeira voltaria a valer. */
  const geracaoAtual = useRef(0);

  async function gerarComIA() {
    const minhaGeracao = ++geracaoAtual.current;
    const aindaVale = () => geracaoAtual.current === minhaGeracao;
    setErro(""); setGerando(true); setEtapaIA("Preparando o pedido");
    try {
      const prompt = eTurma
        ? promptPlanoTurma(turma, membros, semanas, aulasSem, historico)
        : promptPlanoEstruturado(aluno, semanas, aulasSem, historico);
      /* Plano de turma descreve estações/divisão do grupo por aula, às
         vezes pra vários jogadores de níveis diferentes — sai bem mais
         longo que um plano individual e estourava os 16000 tokens de
         saída, cortando o JSON no meio (erro "cortada por passar do
         limite"). 32000 é o teto que a function já aceita; pedir mais
         não custa mais caro sozinho — a Anthropic cobra pelo que é
         gerado de verdade, não pelo teto pedido. */
      let t = (await chamarIA(prompt, eTurma ? 32000 : 16000, (et) => { if (aindaVale()) setEtapaIA(et); })).trim();
      if (!aindaVale()) return;
      setEtapaIA("Conferindo o plano que voltou");
      t = t.replace(/^```(json)?/i, "").replace(/```$/, "").trim();
      const i = t.indexOf("{");
      if (i > 0) t = t.slice(i);
      let json;
      try {
        json = JSON.parse(t);
      } catch (e) {
        throw new Error("A IA devolveu um texto que não é um JSON válido (" + (e.message || e) + "). Tente gerar de novo.");
      }
      const alvo = valida(json);
      alvo.geradoEm = new Date().toISOString();
      atualiza({ plano: alvo, regPlano: {} });
    } catch (e) {
      if (aindaVale()) setErro(String(e.message || e));
    } finally {
      if (aindaVale()) { setGerando(false); setEtapaIA(""); }
    }
  }

  function pararDeEsperar() {
    geracaoAtual.current++;
    setGerando(false); setEtapaIA("");
  }

  function importar() {
    // um plano colado à mão ganha de uma geração ainda em andamento
    geracaoAtual.current++;
    setGerando(false); setEtapaIA("");
    setErro("");
    try {
      let t = texto.trim().replace(/^```(json)?/i, "").replace(/```$/, "").trim();
      const i = t.indexOf("{");
      if (i > 0) t = t.slice(i);
      const p = JSON.parse(t);
      const alvo = valida(p.plano || p);
      alvo.geradoEm = new Date().toISOString();
      atualiza({ plano: alvo, regPlano: {} });
      setColando(false); setTexto("");
    } catch (e) {
      setErro(String(e.message || e));
    }
  }

  const aulas = useMemo(() => listaAulas(plano, reg), [plano, reg]);

  /* status de cada aula: "" (pendente) | "feita" | "falta" | "cancelada". */
  function status(id) {
    return statusAula(reg, id);
  }
  const feitas = aulas.filter((a) => status(a.id) === "feita").length;

  function defineStatus(id, novo) {
    const d = { ...(reg[id] || {}) };
    d.status = status(id) === novo ? "" : novo;
    delete d.feita; // campo antigo — o status assume o lugar dele
    if (d.status && !d.data) d.data = new Date().toISOString().slice(0, 10);
    if (d.status !== "falta" && d.status !== "cancelada") d.motivo = "";
    atualiza({ regPlano: { ...reg, [id]: d } });
  }
  function campo(id, k, v) {
    atualiza({ regPlano: { ...reg, [id]: { ...(reg[id] || {}), [k]: v } } });
  }
  function fech(k, v) {
    atualiza({ regPlano: { ...reg, __fech: { ...(reg.__fech || {}), [k]: v } } });
  }
  /* Confirmar o critério de saída de um bloco (que não seja o último) é o
     que libera as aulas do bloco seguinte — ver aulaEmVigor/gateDeBloco.
     "Ainda não" não trava nada: acrescenta uma aula de reforço dentro do
     próprio bloco, sorteada do mesmo pool de exercícios que ele já usa,
     e o treinador decide de novo quando ela for dada. */
  function confirmarSaidaBloco(nomeBloco) {
    const blocos = reg.__blocos || {};
    atualiza({ regPlano: { ...reg, __blocos: { ...blocos, [nomeBloco]: { ...(blocos[nomeBloco] || {}), liberado: true } } } });
  }
  /* Quando o bloco tem areaFoco, o critério vira uma checklist do catálogo
     (ver criteriosDeSaidaDoBloco) marcada item a item — só libera quando
     todos estiverem marcados, pra não virar um "sim" de um clique só. */
  function marcarCriterioBloco(nomeBloco, i) {
    const blocos = reg.__blocos || {};
    const atual = blocos[nomeBloco] || {};
    const marcados = { ...(atual.criteriosMarcados || {}), [i]: !(atual.criteriosMarcados || {})[i] };
    atualiza({ regPlano: { ...reg, __blocos: { ...blocos, [nomeBloco]: { ...atual, criteriosMarcados: marcados } } } });
  }
  function reforcarBloco(nomeBloco) {
    const codigos = new Set();
    aulas.filter((a) => a.bloco === nomeBloco).forEach((a) => (a.ex || []).forEach((c) => codigos.add(c)));
    const pool = exerciciosParaSorteio().filter((e) => codigos.has(e.c));
    const escolhidos = sorteia(pool.length ? pool : exerciciosParaSorteio(), new Set(), Math.min(2, pool.length || 2));
    const blocos = reg.__blocos || {};
    const atual = blocos[nomeBloco] || {};
    const reforcos = [...(atual.reforcos || []), { ex: escolhidos.map((e) => e.c) }];
    atualiza({ regPlano: { ...reg, __blocos: { ...blocos, [nomeBloco]: { ...atual, reforcos } } } });
  }

  /* Função pura (não mexe em estado) pra poder ser reaproveitada tanto
     pelo botão manual "Gerar relatório do ciclo" quanto pela revisão
     automática quando a ficha muda — essa última precisa do texto na
     hora, sem esperar o setState de `relatorio` propagar. */
  /* Os critérios de saída são sempre a mesma pergunta (atingido / parcial /
     não atingido), ciclo após ciclo — isto é o que faz dar pra montar um
     gráfico de evolução comparável entre ciclos, mesmo quando o texto de
     cada critério muda de plano pra plano (ver GraficoEvolucao). */
  function criteriosDoFechamento(F) {
    return plano.blocos.filter((b) => b.saida).map((b, i) => ({
      nome: (b.nome || "") + " · " + (b.titulo || ""),
      resultado: F["nota:C" + i] || "",
    }));
  }

  function construirRelatorio() {
    const F = reg.__fech || {};
    const NOTA = { sim: "ATINGIDO", par: "PARCIAL", nao: "NÃO ATINGIDO", "": "não avaliado" };
    const L = [];
    L.push("RELATÓRIO DE CICLO · METODOLOGIA MTY");
    L.push((eTurma ? "Turma: " : "Jogador: ") + (entidade.nome || "sem nome") + " · " + (plano.tipo || ""));
    L.push("Gerado em: " + new Date().toLocaleDateString("pt-BR"));
    L.push("Aulas realizadas: " + feitas + " de " + aulas.length);
    L.push("");
    L.push("═══ FECHAMENTO DO CICLO ═══");
    L.push("");
    L.push("CRITÉRIOS DE SAÍDA");
    plano.blocos.filter((b) => b.saida).forEach((b, i) => {
      L.push("  " + (b.nome || "") + " · " + (b.titulo || "") + ": " + NOTA[F["nota:C" + i] || ""]);
      const t = (F["crit:C" + i] || "").trim();
      if (t) L.push("    " + t);
    });
    L.push("");
    L.push("O QUE ESTAVA EM OBSERVAÇÃO");
    (plano.observacao || []).forEach((o, i) => {
      L.push("  " + o.t);
      L.push("    " + ((F["obs:O" + i] || "").trim() || "[segue em aberto — não foi preenchido]"));
    });
    L.push("");
    const dores = aulas.filter((a) => (reg[a.id] || {}).dor);
    L.push("REGISTRO DE DOR — " + (dores.length ? dores.length + " aulas com registro" : "nenhum registro no período"));
    dores.forEach((a) => L.push("  " + (reg[a.id].data || "") + " · semana " + a.semana + " · " + reg[a.id].dor));
    L.push("");
    let bl = "";
    aulas.forEach((a) => {
      if (status(a.id) !== "feita") return;
      const d = reg[a.id];
      if (a.bloco !== bl) { bl = a.bloco; L.push("── " + bl.toUpperCase() + " ──"); }
      L.push("Semana " + a.semana + " · " + a.t + " · " + (d.data || "sem data"));
      if ((d.obs || "").trim()) L.push("   " + d.obs.trim());
      L.push("   exercícios: " + (a.ex || []).join(" "));
    });
    const faltasCancel = aulas.filter((a) => status(a.id) === "falta" || status(a.id) === "cancelada");
    if (faltasCancel.length) {
      L.push("");
      L.push("FALTAS E CANCELAMENTOS (" + faltasCancel.length + ")");
      faltasCancel.forEach((a) => L.push("  " + (reg[a.id].data || "") + " · semana " + a.semana + " · " + a.t +
        " · " + (status(a.id) === "falta" ? "falta" : "cancelada") + (reg[a.id].motivo ? " · " + reg[a.id].motivo : "")));
    }
    const naoFeitas = aulas.filter((a) => status(a.id) === "");
    if (naoFeitas.length) {
      L.push("");
      L.push("SEM REGISTRO (" + naoFeitas.length + ")");
      naoFeitas.forEach((a) => L.push("  Semana " + a.semana + " · " + a.t));
    }
    L.push("");
    L.push("---");
    L.push("Aula sem observação escrita não é aula sem informação — é informação não registrada.");
    L.push("Campos de observação em branco seguem em aberto e entram no próximo ciclo.");
    return L.join("\n");
  }

  function gerar() {
    setRelatorio(construirRelatorio());
  }

  /* A ficha mudou depois que este plano foi gerado — em vez de tentar
     remendar o plano existente (arriscando desalinhar as aulas já
     feitas), fecha o ciclo até aqui como fechamento normal (mesmo
     relatório, arquivado do mesmo jeito) e libera a tela pra gerar um
     novo plano a partir da ficha atual — que já vai lembrar deste ciclo
     via histórico de relatórios. */
  function revisarComFichaAtualizada() {
    const item = {
      id: "REL-" + Date.now().toString(36),
      data: new Date().toISOString(),
      tipo: (plano.tipo || "") + " (revisado pela ficha)",
      feitas, total: aulas.length,
      texto: construirRelatorio(),
      criterios: criteriosDoFechamento(reg.__fech || {}),
    };
    atualiza({ plano: null, regPlano: {}, historicoRelatorios: [item, ...historico] });
  }

  /* Vale tanto pro aluno quanto pra turma: pra turma, qualquer membro do
     grupo com a ficha editada depois da geração já conta — o plano da
     turma nasce da soma das fichas de todo mundo. */
  const fichaMudouDepoisDoPlano = plano && (eTurma
    ? membros.some((m) => m.fichaAtualizadaEm && plano.geradoEm && m.fichaAtualizadaEm > plano.geradoEm)
    : aluno.fichaAtualizadaEm && plano.geradoEm && aluno.fichaAtualizadaEm > plano.geradoEm);

  function refazerPlanejamento() {
    const msg = feitas > 0
      ? "Arquivar as " + feitas + " aulas já realizadas como ciclo fechado e gerar um plano novo com a ficha atual?"
      : "Gerar um plano novo com a ficha atual, no lugar deste?";
    if (confirm(msg)) revisarComFichaAtualizada();
  }

  function arquivar() {
    const item = {
      id: "REL-" + Date.now().toString(36),
      data: new Date().toISOString(),
      tipo: plano.tipo || "",
      feitas, total: aulas.length,
      texto: relatorio,
      criterios: criteriosDoFechamento(reg.__fech || {}),
    };
    atualiza({ historicoRelatorios: [item, ...historico] });
    setRelatorioArquivado(true);
    setTimeout(() => setRelatorioArquivado(false), 4000);
  }

  async function copiarRelatorio() {
    await navigator.clipboard.writeText(relatorio);
    setRelatorioCopiado(true);
    setTimeout(() => setRelatorioCopiado(false), 2000);
  }

  function removerDoHistorico(id) {
    if (!confirm("Remover este relatório do histórico? Não dá pra desfazer.")) return;
    atualiza({ historicoRelatorios: historico.filter((h) => h.id !== id) });
    if (abrirHist === id) setAbrirHist(null);
  }

  /* ── sem plano ainda ── */
  if (!plano) {
    return (
      <div>
        {!podeEditar && (
          <Aviso>{eTurma ? "Esta turma" : "Este jogador"} é de outro treinador — a montagem do plano fica travada. Só o professor responsável ou o coordenador podem gerar ou colar um plano.</Aviso>
        )}
        <Aviso cor={C.quadra}>
          {eTurma ? "Esta turma ainda não tem plano. Gere aqui mesmo a partir das fichas do grupo — ou cole um plano montado fora."
            : "Este jogador ainda não tem plano. Preencha a ficha de entrada e gere aqui mesmo — ou cole um plano montado fora."}
        </Aviso>

        <Secao titulo={eTurma ? "Gerar a partir das fichas do grupo" : "Gerar a partir da ficha"}
          nota={eTurma
            ? "Usa o que está preenchido na ficha de cada jogador do grupo e monta UM plano pra turma inteira, escolhendo exercícios que sirvam pra todos (ou em estações, se os níveis pedirem). Se a turma já teve ciclos anteriores, o plano novo considera o que ficou registrado neles."
            : "Usa o que está preenchido na aba Ficha e escolhe os exercícios dentro do catálogo, respeitando o estágio do jogador. Se o jogador já teve ciclos anteriores, o plano novo é montado considerando o que ficou registrado neles."}>
          <div className="grid grid-cols-2 gap-3">
            <Campo rotulo="Semanas do ciclo"
              nota="Por enquanto só 4 semanas, pra fechar ciclos e revisar relatórios mais rápido enquanto a plataforma está em ajuste.">
              <Seletor opcoes={[4].map((n) => ({ v: n, r: n + " semanas" }))}
                valor={semanas} aoMudar={setSemanas} />
            </Campo>
            <Campo rotulo="Aulas por semana"
              nota={!eTurma && aluno.periodos >= 2 ? "Ficha marca dois turnos por dia — jogador de competição costuma somar mais aulas na semana." : null}>
              <Seletor opcoes={[1, 2, 3, 4, 5, 6, 7, 8, 10].map((n) => ({ v: n, r: String(n) }))}
                valor={aulasSem} aoMudar={setAulasSem} />
            </Campo>
          </div>
          {!eTurma && !(aluno.camadas.tecnico || "").trim() && (
            <Aviso>
              A camada técnica da ficha está vazia. O plano vai sair genérico — preencha a aba
              Ficha antes de gerar.
            </Aviso>
          )}
          {eTurma && membros.some((m) => !(m.camadas.tecnico || "").trim()) && (
            <Aviso>
              {membros.filter((m) => !(m.camadas.tecnico || "").trim()).map((m) => m.nome || "sem nome").join(", ")}
              {" "}ainda {membros.filter((m) => !(m.camadas.tecnico || "").trim()).length === 1 ? "está" : "estão"} com a camada
              técnica da ficha vazia. O plano vai sair genérico pra {membros.filter((m) => !(m.camadas.tecnico || "").trim()).length === 1 ? "esse jogador" : "esses jogadores"} — preencha a ficha antes de gerar.
            </Aviso>
          )}
          {erro && <Aviso>{erro}</Aviso>}
          <div className="flex gap-2 flex-wrap items-center">
            <Botao onClick={gerarComIA} variante="saibro" disabled={gerando || !podeEditar}>
              {gerando ? "Montando o plano…" : "Gerar planejamento"}
            </Botao>
            <Botao variante="vazio" disabled={!podeEditar} onClick={() => setColando(true)}>Colar plano pronto</Botao>
          </div>
          {gerando && <BarraProgresso segundos={segundosIA} etapa={etapaIA} estimativa={eTurma ? 80 : 60} aoCancelar={pararDeEsperar} />}
        </Secao>

        {colando && (
          <div>
            <Campo rotulo="Cole o JSON do plano" nota="Pode colar com as crases do bloco de código — eu limpo.">
              <textarea rows={9} style={{ ...entrada, resize: "vertical", fontFamily: "ui-monospace, monospace", fontSize: 12 }}
                value={texto} onChange={(e) => setTexto(e.target.value)} />
            </Campo>
            {erro && <Aviso>{erro}</Aviso>}
            <div className="flex gap-2">
              <Botao onClick={importar} variante="saibro">Importar</Botao>
              <Botao variante="vazio" onClick={() => { setColando(false); setErro(""); }}>Cancelar</Botao>
            </div>
          </div>
        )}

        <HistoricoRelatorios historico={historico} abrirHist={abrirHist} setAbrirHist={setAbrirHist} removerDoHistorico={removerDoHistorico} podeEditar={podeEditar} nomeEntidade={entidade.nome} />
      </div>
    );
  }

  async function gerarLinkAluno() {
    setGerandoLink(true);
    try {
      let chave = aluno.linkToken;
      if (!chave) {
        chave = MTY.id("aluno");
        atualiza({ linkToken: chave });
      }
      const org = await organizacao();
      const url = location.origin + "/aluno.html?org=" + encodeURIComponent(org || "") +
        "&id=" + encodeURIComponent(aluno.id) + "&t=" + encodeURIComponent(chave);
      setLinkAluno(url);
      setLinkCopiado(false);
    } finally {
      setGerandoLink(false);
    }
  }

  async function copiarLinkAluno() {
    try {
      await navigator.clipboard.writeText(linkAluno);
    } catch {
      const campo = document.getElementById("mty-link-aluno");
      if (campo) { campo.select(); document.execCommand("copy"); }
    }
    setLinkCopiado(true);
    setTimeout(() => setLinkCopiado(false), 2000);
  }

  return (
    <div>
      <div className="mb-5" style={{ background: C.cal, border: "1px solid " + C.linha, padding: "14px 16px" }}>
        <div className="flex items-baseline justify-between gap-3 mb-3">
          <span style={{ fontFamily: ARCH, fontSize: 15, fontWeight: 700 }}>{plano.tipo || "Plano do ciclo"}</span>
          <Etiqueta>{feitas} de {aulas.length} aulas</Etiqueta>
        </div>
        <RoscaStatus contagem={contagemStatus(aulas, status)} />
      </div>

      {fichaMudouDepoisDoPlano && (
        <div className="mb-5">
          <Aviso>
            {eTurma ? "A ficha de pelo menos um jogador do grupo foi atualizada depois que este plano foi gerado."
              : "A ficha deste jogador foi atualizada depois que este plano foi gerado."}{" "}
            {feitas > 0
              ? "As " + feitas + (feitas === 1 ? " aula já realizada fica" : " aulas já realizadas ficam") + " arquivadas como um ciclo fechado, e você monta um plano novo com a ficha atual."
              : "Nenhuma aula deste plano foi realizada ainda, então dá pra gerar um novo direto."}
          </Aviso>
          <div className="mt-2">
            <Botao pequeno variante="saibro" onClick={refazerPlanejamento}>Revisar planejamento com a ficha atual</Botao>
          </div>
        </div>
      )}

      <datalist id="motivos-cancelamento">
        <option value="Chuva" /><option value="Quadra indisponível" /><option value="Feriado" />
        <option value="Doença" /><option value="Viagem" />
      </datalist>

      {modo === "resumo" && (
        <>
          {!eTurma && (
            <div className="mb-5">
              <Botao pequeno variante="vazio" onClick={gerarLinkAluno}>
                {gerandoLink ? "Gerando…" : "Link para o aluno (protótipo)"}
              </Botao>
              {linkAluno && (
                <div className="mt-2 flex gap-2 items-center flex-wrap">
                  <input id="mty-link-aluno" readOnly value={linkAluno} style={{ ...entrada, fontSize: 12, flex: 1 }}
                    onFocus={(e) => e.target.select()} />
                  <Botao pequeno variante="vazio" onClick={copiarLinkAluno}>{linkCopiado ? "✓ copiado" : "Copiar"}</Botao>
                </div>
              )}
            </div>
          )}

          <div style={{ background: "#FDF6E7", borderLeft: "3px solid #C9A227", padding: "11px 14px", marginBottom: 16 }}>
            <p style={{ ...prosa, fontSize: 13 }}>
              <b>Rascunho.</b> Leia o plano inteiro antes de conduzir. Nenhum planejamento vai para
              o aluno sem um treinador revisar e assinar.
            </p>
          </div>

          {plano.prioridade && (
            <div style={{ background: C.cal, borderLeft: "3px solid " + C.saibro, padding: "12px 15px", marginBottom: 18 }}>
              <p style={{ ...prosa, fontSize: 14 }}>{plano.prioridade}</p>
            </div>
          )}

          <LinhaDeRaciocinio plano={plano} aulas={aulas} status={status} reg={reg} />
        </>
      )}

      {modo === "aulas" && (
        <VisaoGeralBlocos plano={plano} aulas={aulas} status={status} reg={reg} entidade={entidade} eTurma={eTurma} membros={membros} />
      )}

      {modo === "aulas" && plano.blocos.map((b, bi) => (
        <div key={bi} className="mb-7">
          <div style={{ background: C.tinta, color: C.papel, padding: "12px 15px" }}>
            <div style={{ fontFamily: ARCH, fontSize: 10, fontWeight: 700, letterSpacing: ".12em", color: C.saibro }}>
              {b.nome} · semanas {b.semanas}
            </div>
            <div style={{ fontFamily: ARCH, fontSize: 16, fontWeight: 700, marginTop: 2 }}>{b.titulo}</div>
          </div>
          {b.alvo && <p style={{ ...prosa, fontSize: 13, color: C.grafite, background: C.cal,
            border: "1px solid " + C.linha, borderTop: "none", padding: "11px 15px", margin: 0 }}>{b.alvo}</p>}

          {(b.semanasLista || []).map((sem, si) => (
            <div key={si} style={{ border: "1px solid " + C.linha, borderTop: "none", background: C.cal }}>
              <div className="flex items-center gap-3 flex-wrap" style={{ padding: "9px 14px", background: C.papel, borderBottom: "1px solid " + C.linha }}>
                <Etiqueta cor={C.tinta}>Semana {sem.n}</Etiqueta>
                <span style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700, flex: 1 }}>{sem.foco}</span>
                {sem.carga && <Etiqueta>{sem.carga}</Etiqueta>}
              </div>
              {(sem.aulas || []).map((au, ai) => {
                const idx = aulas.findIndex((x) => x.semana === sem.n && x.t === au.t && (x.ex || []).join() === (au.ex || []).join());
                const id = idx >= 0 ? aulas[idx].id : "A?" + si + ai;
                return (
                  <CardAulaChecklist key={ai} id={id} indice={ai + 1} titulo={au.t} selo={au.selo}
                    status={status} defineStatus={defineStatus} reg={reg} campo={campo}
                    chuvaAberta={chuvaAberta} setChuvaAberta={setChuvaAberta} podeEditar={podeEditar} />
                );
              })}
            </div>
          ))}
          {(() => {
            const nomeBloco = b.titulo || b.nome;
            const reforcos = ((reg.__blocos || {})[nomeBloco] || {}).reforcos || [];
            if (!reforcos.length) return null;
            return (
              <div style={{ border: "1px solid " + C.linha, borderTop: "none", background: C.cal }}>
                <div className="flex items-center gap-3 flex-wrap" style={{ padding: "9px 14px", background: C.papel, borderBottom: "1px solid " + C.linha }}>
                  <Etiqueta cor={C.saibro}>Reforço</Etiqueta>
                  <span style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700, flex: 1 }}>Aulas extras até confirmar o critério de saída</span>
                </div>
                {reforcos.map((r, ri) => (
                  <CardAulaChecklist key={ri} id={"REF" + bi + "-" + ri} indice={"Reforço " + (ri + 1)} titulo="Reforço do bloco"
                    descricao="Os exercícios aparecem ao montar a sessão de hoje pra esta aula."
                    status={status} defineStatus={defineStatus} reg={reg} campo={campo}
                    chuvaAberta={chuvaAberta} setChuvaAberta={setChuvaAberta} podeEditar={podeEditar} />
                ))}
              </div>
            );
          })()}
          {(() => {
            const nomeBloco = b.titulo || b.nome;
            const catalogo = criteriosDeSaidaDoBloco(b, entidade, eTurma, membros);
            const saidaTexto = typeof b.saida === "string" ? b.saida : "";
            if (!catalogo && !saidaTexto && !b.saida) return null;
            const ehUltimo = bi === plano.blocos.length - 1;
            /* O último bloco não tem transição pra travar — quem fecha o
               ciclo é a seção "Fechamento do ciclo", no resumo. */
            if (ehUltimo) {
              return (
                <div style={{ background: C.papel, border: "1px solid " + C.linha, borderTop: "none",
                  borderLeft: "3px solid " + C.quadra, padding: "12px 15px" }}>
                  <Etiqueta cor={C.quadra}>Critério de saída</Etiqueta>
                  <p style={{ ...prosa, fontSize: 13, marginTop: 4 }}>{saidaTexto || "Avaliado no fechamento do ciclo."}</p>
                </div>
              );
            }
            if (blocoLiberado(reg, nomeBloco)) {
              return (
                <div style={{ background: "#F4F7F4", border: "1px solid " + C.linha, borderTop: "none",
                  borderLeft: "3px solid " + C.quadra, padding: "12px 15px" }}>
                  <Etiqueta cor={C.quadra}>✓ Critério de saída confirmado</Etiqueta>
                  {catalogo && <p style={{ ...prosa, fontSize: 12, color: C.grafite, marginTop: 4 }}>Catálogo · {catalogo.areaNome} · {catalogo.nivel}</p>}
                  {saidaTexto && <p style={{ ...prosa, fontSize: 13, marginTop: 4 }}>{saidaTexto}</p>}
                </div>
              );
            }
            const aulasDoBloco = aulas.filter((a) => a.bloco === nomeBloco);
            const todasFeitas = aulasDoBloco.length > 0 && aulasDoBloco.every((a) => status(a.id) === "feita");
            if (!todasFeitas) {
              return (
                <div style={{ background: C.papel, border: "1px solid " + C.linha, borderTop: "none",
                  borderLeft: "3px solid " + C.quadra, padding: "12px 15px" }}>
                  <Etiqueta cor={C.quadra}>Critério de saída</Etiqueta>
                  {saidaTexto && <p style={{ ...prosa, fontSize: 13, marginTop: 4 }}>{saidaTexto}</p>}
                  {catalogo && (
                    <ul style={{ margin: "6px 0 0 18px", padding: 0 }}>
                      {catalogo.itens.map((texto, i) => (
                        <li key={i} style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 2 }}>{texto}</li>
                      ))}
                    </ul>
                  )}
                  {!saidaTexto && !catalogo && <p style={{ ...prosa, fontSize: 13, marginTop: 4 }}>Avaliado ao fim do bloco.</p>}
                </div>
              );
            }
            /* Bloco com areaFoco: o critério vira checklist do catálogo do
               manual (AREAS.metricas a partir de Y4, NIVEIS_CRITERIOS antes
               disso) — só libera quando cada item foi marcado, não com um
               "sim" de um clique. Sem areaFoco (plano antigo, ou colado à
               mão), cai no texto livre de sempre. */
            const marcados = ((reg.__blocos || {})[nomeBloco] || {}).criteriosMarcados || {};
            const todosMarcados = catalogo ? catalogo.itens.every((_, i) => marcados[i]) : true;
            return (
              <div style={{ background: C.cal, border: "1px solid " + C.saibro, borderTop: "none", padding: "13px 15px" }}>
                <Etiqueta cor={C.saibro}>Bloco aguardando confirmação</Etiqueta>
                <p style={{ ...prosa, fontSize: 13, marginTop: 4 }}>
                  {catalogo
                    ? "As aulas programadas deste bloco já foram todas dadas. Confirme item a item, direto do catálogo do método (" + catalogo.areaNome + " · " + catalogo.nivel + "):"
                    : "As aulas programadas deste bloco já foram todas dadas. O jogador já demonstra este critério?"}
                </p>
                {saidaTexto && <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, margin: "4px 0 10px" }}>{saidaTexto}</p>}
                {catalogo && (
                  <div className="mb-2">
                    {catalogo.itens.map((texto, i) => (
                      <label key={i} className="flex items-start gap-2" style={{ fontSize: 12.5, marginTop: 6, cursor: podeEditar ? "pointer" : "default" }}>
                        <input type="checkbox" disabled={!podeEditar} checked={!!marcados[i]} onChange={() => marcarCriterioBloco(nomeBloco, i)}
                          style={{ marginTop: 3, flexShrink: 0 }} />
                        <span style={prosa}>{texto}</span>
                      </label>
                    ))}
                  </div>
                )}
                <div className="flex gap-2 flex-wrap">
                  <Botao pequeno variante="saibro" disabled={!todosMarcados || !podeEditar} onClick={() => confirmarSaidaBloco(nomeBloco)}>Sim, liberar o próximo bloco</Botao>
                  <Botao pequeno variante="vazio" disabled={!podeEditar} onClick={() => reforcarBloco(nomeBloco)}>Ainda não — acrescentar reforço</Botao>
                </div>
              </div>
            );
          })()}
        </div>
      ))}

      {modo === "resumo" && (
        <>
          <Secao titulo="Fechamento do ciclo" nota="É esta parte que faz o próximo ciclo conversar com este. Sem ela, o plano seguinte recebe o que foi feito, mas não o que foi aprendido.">
            <h3 style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700, marginBottom: 9 }}>Os critérios de saída</h3>
            {plano.blocos.filter((b) => b.saida).map((b, i) => {
              const v = (reg.__fech || {})["nota:C" + i] || "";
              return (
                <div key={i} style={{ background: C.cal, border: "1px solid " + C.linha, padding: "13px 15px", marginBottom: 9 }}>
                  <div style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700 }}>{b.nome} · {b.titulo}</div>
                  <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, margin: "5px 0 9px" }}>{b.saida}</p>
                  <div className="flex gap-2 flex-wrap mb-2">
                    {[["sim", "atingido", C.quadra], ["par", "parcial", C.ocre || "#C9A227"], ["nao", "não atingido", C.saibro]].map(([k, r, cor]) => (
                      <button key={k} disabled={!podeEditar} onClick={() => fech("nota:C" + i, v === k ? "" : k)}
                        style={{ fontFamily: ARCH, fontSize: 11.5, fontWeight: 700, padding: "6px 12px", cursor: podeEditar ? "pointer" : "default",
                          borderRadius: 2, border: "1px solid " + (v === k ? cor : C.linha),
                          background: v === k ? cor : C.papel, color: v === k ? "#fff" : C.grafite }}>{r}</button>
                    ))}
                  </div>
                  <textarea rows={2} disabled={!podeEditar} style={{ ...entrada, resize: "vertical", fontSize: 12.5 }}
                    placeholder="o que faltou, ou o que apareceu além do esperado"
                    value={(reg.__fech || {})["crit:C" + i] || ""}
                    onChange={(e) => fech("crit:C" + i, e.target.value)} />
                </div>
              );
            })}

            <h3 style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700, margin: "20px 0 9px" }}>O que estava em observação</h3>
            {(plano.observacao || []).map((o, i) => (
              <div key={i} style={{ background: C.cal, border: "1px solid " + C.linha, padding: "13px 15px", marginBottom: 9 }}>
                <div style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700 }}>
                  {o.t}{o.urgente && <span style={{ background: C.saibro, color: "#fff", fontSize: 9,
                    fontWeight: 700, padding: "2px 6px", marginLeft: 7 }}>MAIS URGENTE</span>}
                </div>
                <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, margin: "5px 0 8px" }}>{o.d}</p>
                <textarea rows={2} disabled={!podeEditar} style={{ ...entrada, resize: "vertical", fontSize: 12.5 }}
                  placeholder="o que se descobriu. Se continua em aberto, escrever isso."
                  value={(reg.__fech || {})["obs:O" + i] || ""}
                  onChange={(e) => fech("obs:O" + i, e.target.value)} />
              </div>
            ))}
          </Secao>

          <div className="flex gap-2 flex-wrap mb-4">
            <Botao onClick={gerar} variante="saibro">Gerar relatório do ciclo</Botao>
            {!fichaMudouDepoisDoPlano && (
              <Botao variante="vazio" disabled={!podeEditar} onClick={refazerPlanejamento}>Refazer planejamento com a ficha atual</Botao>
            )}
            <Botao variante="vazio" disabled={!podeEditar} onClick={() => {
              const msg = eTurma ? "Remover o plano desta turma? Os registros vão junto." : "Remover o plano deste jogador? Os registros vão junto.";
              if (!confirm(msg)) return;
              /* Se já rolou aula neste ciclo, remover sem arquivar apagaria
                 esse histórico do que a IA vê pra montar o próximo plano —
                 mesma lógica de revisarComFichaAtualizada, só que disparada
                 por "Remover" em vez de "Refazer". Sem aula feita ainda,
                 não há o que preservar: remove direto. */
              if (feitas > 0) {
                const item = {
                  id: "REL-" + Date.now().toString(36),
                  data: new Date().toISOString(),
                  tipo: (plano.tipo || "") + " (arquivado ao remover o plano)",

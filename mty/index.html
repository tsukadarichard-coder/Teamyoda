/* ── grade de horário e agenda semanal ──
   Junta os horários fixos de turmas e de jogadores individuais numa
   visão só. Não modela quadra nem conflito de horário — só "quem
   treina quando, com qual professor", pra grade (visual) e agenda
   (lista por dia) ficarem sempre iguais, lidas da mesma lista. */
function compromissosDaSemana(alunos, turmas) {
  const lista = [];
  turmas.forEach((t) => (t.horarios || []).forEach((h) => lista.push({
    tipo: "turma", dia: h.dia, hora: h.hora, titulo: t.nome, detalhe: t.duracaoPadrao,
    professorUid: t.professorUid || "", professorNome: t.professorNome || "",
    professorAuxiliarUid: t.professorAuxiliarUid || "", professorAuxiliarNome: t.professorAuxiliarNome || "",
  })));
  alunos.forEach((a) => (a.horarios || []).forEach((h) => lista.push({
    tipo: "individual", dia: h.dia, hora: h.hora, titulo: a.nome || "Sem nome", detalhe: "particular",
    professorUid: a.professorUid || "", professorNome: a.professorNome || "",
  })));
  return lista.sort((x, y) => x.dia - y.dia || x.hora.localeCompare(y.hora));
}

/* ── avisos do sininho ──
   Só o que o professor logado precisa saber hoje: o que tem treino hoje
   (dele, ou sem professor definido) e pendências de grupo em aberto nas
   turmas dele. Pedidos de cadastro (só coordenador) somam-se à parte,
   já que vêm de outra fonte (solicitacoes, não alunos/turmas). */
function avisosDoProfessor(alunos, turmas, reservas, uidAtual) {
  const meu = (professorUid) => !professorUid || professorUid === uidAtual;
  const minhaTurma = (t) => meu(t.professorUid) || t.professorAuxiliarUid === uidAtual;
  const diaHoje = new Date().getDay();

  const lembretes = [];
  turmas.filter(minhaTurma).forEach((t) =>
    (t.horarios || []).filter((h) => h.dia === diaHoje).forEach((h) =>
      lembretes.push({ tipo: "turma", titulo: t.nome, hora: h.hora })));
  alunos.filter((a) => meu(a.professorUid)).forEach((a) =>
    (a.horarios || []).filter((h) => h.dia === diaHoje).forEach((h) =>
      lembretes.push({ tipo: "individual", titulo: a.nome || "Sem nome", hora: h.hora })));
  lembretes.sort((x, y) => x.hora.localeCompare(y.hora));

  const pendencias = [];
  turmas.filter(minhaTurma).forEach((t) =>
    (t.pendencias || []).filter((p) => !p.resolvida).forEach((p) =>
      pendencias.push({ turma: t.nome, ...p })));

  /* O que o aluno pede pelo link dele (o que quer trabalhar, pedido de
     reposição) só existia dentro da própria página do aluno — sem
     nenhum aviso central, o treinador só via se abrisse aquele aluno
     por acaso. Agora entra no sino, igual lembrete e pendência. */
  const pedidosAlunos = [];
  alunos.filter((a) => meu(a.professorUid)).forEach((a) => {
    (a.pedidosConteudo || []).filter((p) => p.status === "pendente").forEach((p) =>
      pedidosAlunos.push({ alunoId: a.id, alunoNome: a.nome || "Sem nome", tipo: "conteudo", texto: p.texto }));
    (a.pedidosReposicao || []).filter((p) => p.status === "pendente").forEach((p) =>
      pedidosAlunos.push({ alunoId: a.id, alunoNome: a.nome || "Sem nome", tipo: "reposicao", texto: null }));
  });

  /* Reserva feita pelo cliente no link público (reservar.html) — quem
     gerencia a quadra precisa saber que alguém reservou, sem precisar
     ficar checando a aba toda hora. vistoPeloStaff é persistido na
     própria reserva (não no Set de avisos vistos da sessão), porque uma
     reserva feita hoje pra daqui a duas semanas não pode "expirar" do
     aviso só porque a página foi recarregada. */
  const reservasNovas = (reservas || []).filter((r) => r.origem === "cliente" && !r.vistoPeloStaff);

  return { lembretes, pendencias, pedidosAlunos, reservasNovas };
}

/* ── dashboard ──
   A página principal, sob medida pra quem está logado: por padrão só o
   que é dele (mais o que ainda não tem professor), com o mesmo
   alternador "meus/toda a academia" já usado em Jogadores e Agenda —
   pro coordenador, "toda a academia" é o painel dele. */
function agregarStatusAlunos(alunos) {
  const c = { feita: 0, pendente: 0, repetindo: 0 };
  alunos.forEach((a) => {
    if (!a.plano) return;
    const aulas = listaAulas(a.plano, a.regPlano);
    const s = contagemStatus(aulas, (id) => statusAula(a.regPlano, id));
    c.feita += s.feita; c.pendente += s.pendente; c.repetindo += s.repetindo;
  });
  return c;
}
function aulasDadasRecentes(alunos, dias) {
  const limite = Date.now() - dias * 86400000;
  let n = 0;
  alunos.forEach((a) => Object.values(a.regPlano || {}).forEach((r) => {
    if (r && r.status === "feita" && r.data && new Date(r.data).getTime() >= limite) n++;
  }));
  return n;
}
/* Mesma janela de aulasDadasRecentes, mas devolvendo cada aula (não só a
   contagem) — é o que abre quando o treinador clica no card do
   Dashboard, ou numa barra do gráfico por professor. */
function aulasDadasDetalhe(alunos, dias, professorNome) {
  const limite = Date.now() - dias * 86400000;
  const linhas = [];
  alunos.forEach((a) => {
    if (professorNome && (a.professorNome || "Sem professor") !== professorNome) return;
    const aulas = listaAulas(a.plano, a.regPlano);
    aulas.forEach((au) => {
      const r = (a.regPlano || {})[au.id];
      if (r && r.status === "feita" && r.data && new Date(r.data).getTime() >= limite) {
        linhas.push({ alunoId: a.id, alunoNome: a.nome || "Sem nome", titulo: au.t, bloco: au.bloco, semana: au.semana, data: r.data });
      }
    });
  });
  return linhas.sort((x, y) => (x.data < y.data ? 1 : -1));
}
function aulasPorProfessor(alunos) {
  const mapa = {};
  alunos.forEach((a) => {
    if (!a.plano) return;
    const nome = a.professorNome || "Sem professor";
    const feitas = listaAulas(a.plano, a.regPlano).filter((x) => statusAula(a.regPlano, x.id) === "feita").length;
    mapa[nome] = (mapa[nome] || 0) + feitas;
  });
  return Object.entries(mapa).map(([nome, valor]) => ({ nome, valor })).sort((a, b) => b.valor - a.valor);
}

function TileEstat({ rotulo, valor, cor, onClick, ativo }) {
  const Tag = onClick ? "button" : "div";
  return (
    <Tag onClick={onClick || undefined} className={onClick ? "w-full text-left" : undefined}
      style={{ background: ativo ? C.tinta : C.cal, border: "1px solid " + (ativo ? C.tinta : C.linha), borderRadius: 8, padding: "14px 16px",
        cursor: onClick ? "pointer" : "default" }}>
      <div style={{ fontFamily: ARCH, fontSize: 24, fontWeight: 700, color: ativo ? C.papel : (cor || C.tinta), lineHeight: 1 }}>{valor}</div>
      <div style={{ fontFamily: ARCH, fontSize: 10.5, color: ativo ? C.papel : C.grafite, textTransform: "uppercase", letterSpacing: "0.06em", marginTop: 5 }}>
        {rotulo}{onClick ? (ativo ? " ▲" : " ▾") : ""}
      </div>
    </Tag>
  );
}

/* Preço do claude-sonnet-5 (modelo usado em gerar-ia-background.js):
   US$2/milhão de tokens de entrada, US$10/milhão de saída. Só uma
   estimativa pra dar noção de gasto sem precisar abrir o painel da
   Anthropic — a fatura de verdade sai de lá. */
const PRECO_IA = { entrada: 2 / 1e6, saida: 10 / 1e6 };
function CardUsoIA({ usoIA }) {
  const geracoes = (usoIA && usoIA.geracoes) || 0;
  if (geracoes === 0) return null;
  const custo = (usoIA.tokensEntrada || 0) * PRECO_IA.entrada + (usoIA.tokensSaida || 0) * PRECO_IA.saida;
  return (
    <div className="mb-6" style={{ background: C.cal, border: "1px solid " + C.linha, borderRadius: 8, padding: "16px 18px" }}>
      <div style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700, marginBottom: 6 }}>Uso de IA nesta academia</div>
      <p style={{ ...prosa, fontSize: 13 }}>
        {geracoes} {geracoes === 1 ? "geração" : "gerações"} até agora · custo estimado{" "}
        <b>US$ {custo < 0.01 ? "< 0,01" : custo.toFixed(2).replace(".", ",")}</b>
      </p>
      <p style={{ ...prosa, fontSize: 11.5, color: C.grafite, marginTop: 4 }}>
        Estimativa pelo preço do modelo usado (claude-sonnet-5) — a fatura de verdade fica no painel da Anthropic.
        Atualiza ao recarregar a página.
      </p>
    </div>
  );
}

function TelaDashboard({ alunos, turmas, papelAtual, uidAtual, exigeLogin, irPara, usoIA, identidade }) {
  const [verTodos, setVerTodos] = useState(false);
  /* null fechado, "abertas"/"dadas" abrem a lista do card correspondente,
     ou o nome de um professor quando vem de um clique na barra do
     gráfico "aulas dadas por professor" — mesma lista, filtrada. */
  const [detalhe, setDetalhe] = useState(null);
  const meus = (professorUid) => !professorUid || professorUid === uidAtual;

  const alunosVistos = (!exigeLogin || verTodos || !uidAtual) ? alunos : alunos.filter((a) => meus(a.professorUid));
  const turmasVistas = (!exigeLogin || verTodos || !uidAtual) ? turmas : turmas.filter((t) => meus(t.professorUid) || t.professorAuxiliarUid === uidAtual);

  const status = agregarStatusAlunos(alunosVistos);
  const abertos = alunosVistos.filter((a) => a.plano && aulaEmVigor(a));
  const dadas7 = aulasDadasRecentes(alunosVistos, 7);
  const ehProfessorFiltro = detalhe && detalhe !== "abertas" && detalhe !== "dadas";
  const dadasDetalhe = (detalhe === "dadas" || ehProfessorFiltro)
    ? aulasDadasDetalhe(alunosVistos, 7, ehProfessorFiltro ? detalhe : null) : [];
  let pendenciasAbertas = 0;
  turmasVistas.forEach((t) => (t.pendencias || []).forEach((p) => { if (!p.resolvida) pendenciasAbertas++; }));
  const porProfessor = verTodos ? aulasPorProfessor(alunosVistos) : [];

  return (
    <div>
      {identidade && identidade.nome && (
        <div className="mb-1"><Etiqueta>{identidade.nome}</Etiqueta></div>
      )}
      <h1 style={{ fontFamily: ARCH, fontSize: 22, fontWeight: 700, marginBottom: 4 }}>Dashboard</h1>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 14 }}>
        {verTodos ? "A academia inteira, de uma vez." : "Só o que é seu — mais quem ainda não tem professor definido."}
      </p>

      {exigeLogin && uidAtual && (
        <div className="flex gap-2 mb-5">
          {[{ v: false, r: "Meu painel" }, { v: true, r: "Toda a academia" }].map((t) => (
            <button key={String(t.v)} onClick={() => setVerTodos(t.v)}
              style={{ fontFamily: ARCH, fontSize: 12, fontWeight: 700, padding: "6px 11px", borderRadius: 3, cursor: "pointer",
                border: "1px solid " + (verTodos === t.v ? C.saibro : C.linha),
                background: verTodos === t.v ? C.saibro : C.papel, color: verTodos === t.v ? "#fff" : C.grafite }}>
              {t.r}
            </button>
          ))}
        </div>
      )}

      <div className="mb-5" style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 10 }}>
        <TileEstat rotulo="Jogadores" valor={alunosVistos.length} />
        <TileEstat rotulo="Aulas em aberto" valor={abertos.length} cor={abertos.length > 0 ? C.saibro : C.tinta}

const celulaGrade = { border: "1px solid " + C.linha, padding: "8px 10px", verticalAlign: "top" };

const NAV_PRINCIPAL = [{ v: "dashboard", r: "Dashboard" }, { v: "alunos", r: "Jogadores" }, { v: "turmas", r: "Turmas" }, { v: "agenda", r: "Agenda" }, { v: "casos", r: "Casos" }];
const NAV_MANUAL = [{ v: "catalogo", r: "Catálogo" }, { v: "tecnica", r: "Técnica" }, { v: "taticas", r: "Táticas" },
  { v: "conducao", r: "Condução" }, { v: "publicos", r: "Públicos" }, { v: "aulas", r: "Aulas" }, { v: "metodo", r: "Como decide" }];

function App() {
  const [alunos, setAlunos] = useState([]);
  const [turmas, setTurmas] = useState([]);
  const [carregandoTurmas, setCarregandoTurmas] = useState(true);
  const [quadras, setQuadras] = useState([]);
  const [carregandoQuadras, setCarregandoQuadras] = useState(true);
  const [reservas, setReservas] = useState([]);
  const [carregandoReservas, setCarregandoReservas] = useState(true);
  const [exerciciosCustom, setExerciciosCustom] = useState([]);
  const [carregandoCustom, setCarregandoCustom] = useState(true);
  /* Formação da equipe, no App (não em TelaEquipe): tanto a aba "Formação"
     (o próprio treinador preenche) quanto "Equipe → Formação" (o
     coordenador acompanha) precisam enxergar a mesma lista — se cada
     tela carregasse e gravasse por conta própria, a última a salvar
     apagaria o que a outra tinha acabado de escrever. */
  const [membrosFormacao, setMembrosFormacao] = useState([]);
  const [carregandoFormacao, setCarregandoFormacao] = useState(true);
  const [abertoId, setAbertoId] = useState(null);
  const [aba, setAba] = useState("dashboard");
  const [subaba, setSubaba] = useState("ficha");
  const [manualAberto, setManualAberto] = useState(false);
  const manualRef = useRef(null);
  const manualAbriuEm = useRef(0);
  /* Referência da teoria de um módulo de Formação de volta pro Manual —
     troca de aba (quando houver) e rola até o item, sem precisar que cada
     tela do Manual saiba nada sobre Formação. focoManualId só existe pra
     TelaTecnica trocar de subaba (T/M/P) sozinha antes da rolagem. */
  const [focoManualId, setFocoManualId] = useState(null);
  function irParaManual(destino) {
    if (!destino) return;
    if (destino.aba) { setAba(destino.aba); setManualAberto(false); }
    setFocoManualId(destino.id || null);
    if (destino.id) {
      setTimeout(() => {
        const el = document.getElementById(destino.id);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      }, destino.aba ? 120 : 20);
    }
  }
  function alternarManual() {
    // um segundo toque (fantasma ou dedo escorregando) pode cair de novo
    // bem em cima deste mesmo botão — ignora um fechamento tentado a
    // menos de 400ms de ter aberto, e deixa o toque fora (acima) ou
    // escolher um item cuidar de fechar de verdade.
    if (manualAberto && Date.now() - manualAbriuEm.current < 400) return;
    if (!manualAberto) manualAbriuEm.current = Date.now();
    setManualAberto(!manualAberto);
  }
  /* Fecha ao tocar fora — mas o listener só é registrado DEPOIS que o
     menu abre (no efeito, não no clique que abriu). Um overlay de tela
     inteira com onClick fechava o próprio menu sozinho no celular: o
     toque "fantasma" que os navegadores mobile disparam ~300ms depois do
     toque real caía bem em cima do overlay recém-criado, na mesma
     posição do botão "Manual", fechando o menu antes de dar tempo de
     escolher algo. Ouvir mousedown/touchstart no documento (registrado
     um tick depois de abrir) não sofre com isso.
     Os dois eventos usam uma noção diferente de "fora": no mouse
     (mousedown), "fora" é fora da caixinha do próprio Manual — clicar em
     qualquer outro ponto da barra lateral (ex.: no logo, em outro grupo)
     fecha ele, igual sempre foi. Já no toque (touchstart), "fora" precisa
     ser fora da barra lateral INTEIRA: quando o menu não cabe na tela
     (ex.: celular deitado), tentar rolar a barra pra ver o resto da lista
     começa com um toque em outro ponto dela mesma — se isso contasse como
     "fora", o menu fechava assim que o dedo tocava a tela pra rolar, antes
     do gesto completar. Tocar em outro item da barra já fecha o Manual
     sozinho, pelo próprio onClick de cada botão. */
  useEffect(() => {
    if (!manualAberto) return;
    function aoClicarComMouse(e) {
      if (manualRef.current && !manualRef.current.contains(e.target)) setManualAberto(false);
    }
    function aoTocarComDedo(e) {
      if (!e.target.closest(".mty-sidebar")) setManualAberto(false);
    }
    document.addEventListener("mousedown", aoClicarComMouse);
    document.addEventListener("touchstart", aoTocarComDedo);
    return () => {
      document.removeEventListener("mousedown", aoClicarComMouse);
      document.removeEventListener("touchstart", aoTocarComDedo);
    };
  }, [manualAberto]);
  const [carregando, setCarregando] = useState(true);
  const exigeLogin = typeof window !== "undefined" && !!window.mtyAuth;
  const [autenticado, setAutenticado] = useState(!exigeLogin);
  const [checando, setChecando] = useState(exigeLogin);
  const [orgAtual, setOrgAtual] = useState(null);
  const [papelAtual, setPapelAtual] = useState(null);
  const [planoAtual, setPlanoAtual] = useState(null);
  const [planoAtivoAte, setPlanoAtivoAte] = useState(null);
  const [identidade, setIdentidade] = useState(null);
  const [usoIA, setUsoIA] = useState(null);
  const [verificandoOrg, setVerificandoOrg] = useState(exigeLogin);
  const [verTodosAlunos, setVerTodosAlunos] = useState(false);
  const [avisosAberto, setAvisosAberto] = useState(false);
  /* Menu lateral: cada grupo abre/fecha independente, mas começa todo
     aberto — assim quem já usa o app continua vendo tudo de cara, sem
     precisar clicar em nada antes de navegar. */
  const [gruposAbertos, setGruposAbertos] = useState({ trabalho: true, academia: true, equipe: true });
  function alternarGrupo(id) {
    setGruposAbertos((atual) => ({ ...atual, [id]: !atual[id] }));
  }
  /* No celular em pé, a barra lateral de 252px não cabe do lado do
     conteúdo — vira uma gaveta que fica recolhida por padrão (o CSS,
     no <style> abaixo, cuida de escondê-la fora da tela só em telas
     estreitas) e abre por cima de tudo com o botão ☰ do topo. Sempre à
     esquerda, nunca empilhada — só entra e sai por toque. No computador
     o botão ☰ nem aparece (também via CSS), e esse estado não tem efeito. */
  const [menuMobileAberto, setMenuMobileAberto] = useState(false);
  /* Avisos são recalculados do zero a cada render (aula de hoje, pendência,
     pedido do aluno) — sem estado próprio, o mesmo aviso reaparecia
     idêntico toda vez que o sininho abria de novo, mesmo já tendo sido
     clicado. Isto guarda, só nesta sessão do navegador (não precisa
     persistir — amanhã a agenda já é outra), quais avisos o treinador já
     abriu, pra sumirem da lista e da contagem sem precisar mudar o dado
     de verdade por trás deles. */
  const [avisosVistos, setAvisosVistos] = useState(() => new Set());
  function marcarAvisoVisto(id) {
    setAvisosVistos((atual) => new Set(atual).add(id));
  }
  const [pedidosPendentesCount, setPedidosPendentesCount] = useState(0);
  const [limiteAtingido, setLimiteAtingido] = useState(false);
  const uidAtual = exigeLogin && window.mtyAuth.usuario() ? window.mtyAuth.usuario().uid : null;

  useEffect(() => {
    if (!exigeLogin) return;
    return window.mtyAuth.observar((u) => { setAutenticado(!!u); setChecando(false); });
  }, [exigeLogin]);

  useEffect(() => {
    if (!exigeLogin || !autenticado) { setVerificandoOrg(false); return; }
    setVerificandoOrg(true);
    (async () => {
      const org = await organizacao();
      setOrgAtual(org);
      try {
        /* força a renovação do token (em vez de usar o que já estava em
           cache) — sem isso, quem acabou de ser promovido a coordenador,
           ou teve mostrarQuadras ligado pra academia, só via a mudança
           depois de sair e entrar de novo: o SDK do Firebase não sabe
           sozinho que uma claim mudou no servidor, e reaproveitava o
           token antigo até ele expirar por conta própria (até 1h). */
        const tok = await window.mtyAuth.usuario().getIdTokenResult(true);
        setPapelAtual((tok.claims && tok.claims.role) || null);
      } catch (e) { setPapelAtual(null); }
      try {
        const info = await db.collection("orgs").doc(org).collection("meta").doc("info").get();
        setPlanoAtual(info.exists ? (info.data().plano || null) : null);
        setPlanoAtivoAte(info.exists ? (info.data().planoAtivoAte || null) : null);
        setIdentidade(info.exists ? { nome: info.data().nome || "", logoUrl: info.data().logoUrl || "", mostrarManual: info.data().mostrarManual, mostrarQuadras: info.data().mostrarQuadras } : null);
      } catch (e) { setPlanoAtual(null); setPlanoAtivoAte(null); setIdentidade(null); }
      try {
        const uso = await db.collection("orgs").doc(org).collection("meta").doc("usoIA").get();
        setUsoIA(uso.exists ? uso.data() : null);
      } catch (e) { setUsoIA(null); }
      setVerificandoOrg(false);
    })();
  }, [exigeLogin, autenticado]);

  /* O título da aba troca pro nome da própria academia assim que a
     identidade dela carrega — antes disso (ou pra quem não configurou
     nome) fica o rótulo neutro do <title> estático. */
  useEffect(() => {
    document.title = identidade && identidade.nome ? identidade.nome + " · Painel do Treinador" : "Painel do Treinador";
  }, [identidade]);

  useEffect(() => {
    if (!autenticado || (exigeLogin && !orgAtual)) return;
    leia("mty:alunos:v2", []).then((a) => { setAlunos(a); setCarregando(false); });
    leia("mty:turmas:v1", [], true).then((t) => { setTurmas(t); setCarregandoTurmas(false); });
    leia("mty:exerciciosCustom:v1", [], true).then((ex) => { setExerciciosCustom(ex); setCatalogoCustom(ex); setCarregandoCustom(false); });
    leia("mty:formacao:v1", [], true).then((m) => { setMembrosFormacao(m); setCarregandoFormacao(false); });
    leia("mty:quadras:v1", [], true).then((q) => { setQuadras(q); setCarregandoQuadras(false); });
    leia("mty:reservas:v1", [], true).then((r) => { setReservas(r); setCarregandoReservas(false); });
}, [autenticado, orgAtual]);
  useEffect(() => { if (autenticado && !carregando) grave("mty:alunos:v2", alunos); }, [alunos, carregando, autenticado]);
  useEffect(() => { if (autenticado && !carregandoTurmas) grave("mty:turmas:v1", turmas, true); }, [turmas, carregandoTurmas, autenticado]);
  useEffect(() => { if (autenticado && !carregandoQuadras) grave("mty:quadras:v1", quadras, true); }, [quadras, carregandoQuadras, autenticado]);
  useEffect(() => { if (autenticado && !carregandoReservas) grave("mty:reservas:v1", reservas, true); }, [reservas, carregandoReservas, autenticado]);
  useEffect(() => { if (autenticado && !carregandoFormacao) grave("mty:formacao:v1", membrosFormacao, true); }, [membrosFormacao, carregandoFormacao, autenticado]);
  // sincronizado durante o render (não num useEffect): TelaCatalogo e as
  // funções de geração leem TODOS_EXERCICIOS() no mesmo render em que
  // exerciciosCustom muda — um efeito rodaria tarde demais pra isso e o
  // exercício recém-cadastrado só apareceria depois de outro re-render.
  setCatalogoCustom(exerciciosCustom);
  useEffect(() => {
    if (autenticado && !carregandoCustom) grave("mty:exerciciosCustom:v1", exerciciosCustom, true);
  }, [exerciciosCustom, carregandoCustom, autenticado]);

  /* pedidos de cadastro parados: só interessa ao coordenador, então nem
     tenta buscar pros outros papéis. Sondagem simples — não precisa de
     tempo real pra um número que só o sininho mostra. */
  useEffect(() => {
    if (papelAtual !== "coordenador") { setPedidosPendentesCount(0); return; }
    let ativo = true;
    function checar() { contarPedidosPendentes().then((n) => { if (ativo) setPedidosPendentesCount(n); }); }
    checar();
    const t = setInterval(checar, 60000);
    return () => { ativo = false; clearInterval(t); };
  }, [papelAtual]);

  const avisos = avisosDoProfessor(alunos, turmas, reservas, uidAtual);
  const idLembrete = (l) => "lembrete:" + l.tipo + ":" + l.titulo + ":" + l.hora;
  const idPendencia = (p) => "pendencia:" + (p.id || p.turma + ":" + p.data);
  const idPedidoAluno = (p) => "pedido:" + p.alunoId + ":" + p.tipo + ":" + (p.texto || "");
  const lembretesVisiveis = avisos.lembretes.filter((l) => !avisosVistos.has(idLembrete(l)));
  const pendenciasVisiveis = avisos.pendencias.filter((p) => !avisosVistos.has(idPendencia(p)));
  const pedidosAlunosVisiveis = avisos.pedidosAlunos.filter((p) => !avisosVistos.has(idPedidoAluno(p)));
  const reservasNovasVisiveis = papelAtual === "coordenador" ? avisos.reservasNovas : [];
  function verReserva(r) {
    setReservas(reservas.map((x) => (x.id === r.id ? { ...x, vistoPeloStaff: true } : x)));
    setAba("quadras");
    setAvisosAberto(false);
  }
  const totalAvisos = lembretesVisiveis.length + pendenciasVisiveis.length + pedidosAlunosVisiveis.length + reservasNovasVisiveis.length + pedidosPendentesCount;
  function abrirAvisos() {
    if (!avisosAberto && papelAtual === "coordenador") contarPedidosPendentes().then(setPedidosPendentesCount);
    setAvisosAberto(!avisosAberto);
  }

  const aberto = abertoId ? alunos.find((a) => a.id === abertoId) : null;
  /* Dashboard do professor: por padrão só os alunos dele (mais os que
     ainda não têm professor definido, pra nada sumir com a migração).
     "Todos os alunos" mostra a academia inteira, com o professor de
     cada um — pra qualquer treinador, não só o coordenador. */
  const alunosExibidos = (!exigeLogin || verTodosAlunos || !uidAtual)
    ? alunos
    : alunos.filter((a) => !a.professorUid || a.professorUid === uidAtual);

  const limitePlano = limiteDeAlunos(planoAtual);
  const planoVencido = !!(planoAtivoAte && planoAtivoAte < new Date().toISOString().slice(0, 10));
  /* O Manual (Catálogo, Técnica, Táticas, Condução, Públicos, Como decide)
     é a documentação do método MTY da própria Team Yoda — não faz
     sentido pra uma academia com o método próprio dela. Academia sem o
     campo (todo mundo antes desta mudança, inclusive a Team Yoda) segue
     vendo normalmente; só quem é provisionado dali pra frente sem marcar
     a opção fica sem essa aba. */
  const mostraManual = !identidade || typeof identidade.mostrarManual !== "boolean" || identidade.mostrarManual;
  /* Quadras é o oposto do Manual: uma feature nova, que nenhuma academia
     usava antes de existir — então o padrão é ficar ESCONDIDA, e só
     aparece pra quem for provisionado explicitamente com a opção
     marcada. A Team Yoda passou a usar Quadras e tem uma liberação
     própria aqui, sem depender desse campo (o mesmo vale do lado do
     servidor, em reservar-quadra.js, pro link público de reserva). Só
     pro coordenador, do mesmo jeito que qualquer outra academia. */
  const mostraQuadras = papelAtual === "coordenador" && (orgAtual === "team-yoda" || (!!identidade && identidade.mostrarQuadras === true));
  /* Menu lateral, por segmento: "Meu trabalho" é o dia a dia de qualquer
     treinador; "Academia" é gestão (por enquanto só Quadras, opcional) e
     só aparece pro coordenador — os demais treinadores nem veem a aba;
     "Equipe" é só do coordenador. Um grupo sem nenhum item (ex.: Academia
     numa academia sem Quadras) simplesmente não aparece. */
  const gruposNav = [
    { id: "trabalho", label: "Meu trabalho", itens: [
      ...NAV_PRINCIPAL,
      ...(exigeLogin && uidAtual ? [{ v: "formacao", r: "Formação" }] : []),
    ] },
    { id: "academia", label: "Academia", itens: [
      ...(mostraQuadras ? [{ v: "quadras", r: "Quadras" }] : []),
    ] },
    { id: "equipe", label: "Coordenação", badge: "coordenador", itens: [
      ...(papelAtual === "coordenador" ? [{ v: "equipe", r: "Equipe" }] : []),
    ] },
  ].filter((g) => g.itens.length > 0);
  function criar() {
    if (planoVencido || (limitePlano != null && alunos.length >= limitePlano)) {
      setLimiteAtingido(true);
      return;
    }
    const n = novoAluno();
    setAlunos([...alunos, n]);
    setAbertoId(n.id);
    setSubaba("ficha");
  }
  function salvar(f) { setAlunos(alunos.map((a) => (a.id === f.id ? f : a))); }
  function removerAluno(id) {
    if (!confirm("Remover este jogador? A ficha, o plano e o histórico dele vão junto — não dá pra desfazer.")) return;
    setAlunos(alunos.filter((a) => a.id !== id));
    setAbertoId(null);
  }

  if (checando)
    return <div style={{ background: C.papel, minHeight: "100vh", padding: 60, textAlign: "center", fontFamily: ARCH, color: C.grafite }}>Verificando acesso…</div>;
  if (!autenticado) return <TelaLogin aoEntrar={() => setAutenticado(true)} />;
  if (verificandoOrg)
    return <div style={{ background: C.papel, minHeight: "100vh", padding: 60, textAlign: "center", fontFamily: ARCH, color: C.grafite }}>Verificando sua academia…</div>;
  if (exigeLogin && !orgAtual) return <TelaSemAcademia />;

  return (
    <div style={{ background: C.papel, minHeight: "100vh", color: C.tinta }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap');
        * { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid ${C.saibro}; outline-offset: 2px; }
        button { transition: transform .06s ease, opacity .06s ease; }
        button:active:not(:disabled) { transform: scale(0.96); opacity: 0.75; }
        .mty-sidebar { transition: transform .2s ease; }
        .mty-hamburger { display: none; }
        @media (max-width: 760px) {
          /* Em pé no celular, os 252px fixos da barra não sobram do lado
             do conteúdo — ela vira uma gaveta escondida fora da tela à
             esquerda por padrão, e desliza por cima de tudo (nunca
             empurrando ou empilhando nada) quando o botão ☰ abre ela. */
          .mty-sidebar { transform: translateX(-100%); }
          .mty-sidebar.aberta { transform: translateX(0); box-shadow: 4px 0 18px rgba(0,0,0,.18); }
          .mty-hamburger { display: inline-flex !important; }
          .mty-topbar, .mty-main { margin-left: 0 !important; }
        }
      `}</style>

      {menuMobileAberto && (
        <div onClick={() => setMenuMobileAberto(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.35)", zIndex: 25 }} />
      )}

      <header className={"mty-sidebar" + (menuMobileAberto ? " aberta" : "")} style={{ position: "fixed", left: 0, top: 0, bottom: 0, width: 252, overflowY: "auto",
        background: C.cal, borderRight: "1px solid " + C.linha, zIndex: 30 }}>
        <div style={{ height: 4, background: C.saibro }} />
        <div style={{ padding: "18px 18px 14px" }}>
          <Marca identidade={identidade} altura={26} />
          <div className="mt-2"><Etiqueta>Ficha, periodização e sessão · 315 exercícios</Etiqueta></div>
        </div>
        <nav style={{ display: "block", padding: "4px 10px 18px" }}>
          {gruposNav.map((g) => (
            <div key={g.id} className="mb-1">
              <button onClick={() => alternarGrupo(g.id)} className="w-full flex items-center justify-between gap-2"
                style={{ padding: "9px 8px", border: "none", background: "none", cursor: "pointer", borderRadius: 3 }}>
                <span className="flex items-center gap-2">
                  <Etiqueta>{g.label}</Etiqueta>
                  {g.badge && (
                    <span style={{ fontFamily: ARCH, fontSize: 9, fontWeight: 700, letterSpacing: ".04em", textTransform: "uppercase",
                      color: "#fff", background: C.saibro, padding: "2px 6px", borderRadius: 999 }}>{g.badge}</span>
                  )}
                </span>
                <span style={{ fontSize: 13, color: C.grafite, fontWeight: 700 }}>{gruposAbertos[g.id] ? "−" : "+"}</span>
              </button>
              {gruposAbertos[g.id] && (
                <div className="flex flex-col" style={{ gap: 1 }}>
                  {g.itens.map((t) => (
                    <button key={t.v} onClick={() => { setAba(t.v); setAbertoId(null); setManualAberto(false); setMenuMobileAberto(false); }}
                      className="text-left"
                      style={{ fontFamily: ARCH, fontSize: 13.5, fontWeight: 600, padding: "8px 10px", borderRadius: 3, cursor: "pointer",
                        border: "none", background: aba === t.v ? C.tinta : "transparent", color: aba === t.v ? C.papel : C.grafite }}>
                      {t.r}
                    </button>
                  ))}
                </div>
              )}
            </div>
          ))}
          {mostraManual && (
            /* O dropdown do Manual virou lista inline (como os outros
               grupos) em vez de flutuar ao lado — dentro de uma barra

               risco de ficar cortado. A mecânica de abrir/fechar (guarda
               contra clique fantasma, fechar ao tocar fora, fechar ao
               escolher um item) continua a mesma de sempre — alternarManual
               e manualAberto não mudaram, só a posição visual do resultado. */
            <div ref={manualRef} className="mb-1">
              <button onClick={alternarManual} className="w-full flex items-center justify-between gap-2"
                style={{ padding: "9px 8px", border: "none", cursor: "pointer", borderRadius: 3,
                  background: NAV_MANUAL.some((t) => t.v === aba) ? C.tinta : "none" }}>
                <span style={{ fontFamily: ARCH, fontSize: 13.5, fontWeight: 600,
                  color: NAV_MANUAL.some((t) => t.v === aba) ? C.papel : C.grafite }}>Manual</span>
                <span style={{ fontSize: 13, fontWeight: 700, color: NAV_MANUAL.some((t) => t.v === aba) ? C.papel : C.grafite }}>
                  {manualAberto ? "−" : "+"}
                </span>
              </button>
              {manualAberto && (
                <div className="flex flex-col" style={{ gap: 1 }}>
                  {NAV_MANUAL.map((t) => (
                    <button key={t.v} onClick={() => { setAba(t.v); setAbertoId(null); setManualAberto(false); setMenuMobileAberto(false); }}
                      className="text-left"
                      style={{ fontFamily: ARCH, fontSize: 13, fontWeight: aba === t.v ? 700 : 500, padding: "7px 10px 7px 18px",
                        borderRadius: 3, cursor: "pointer", border: "none",
                        color: aba === t.v ? C.tinta : C.grafite, background: aba === t.v ? "#EFEAE4" : "transparent" }}>
                      {t.r}
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}
        </nav>
      </header>

          <button className="mty-hamburger" onClick={() => setMenuMobileAberto(true)} aria-label="Abrir menu"
            style={{ marginRight: "auto", fontSize: 18, cursor: "pointer", padding: "4px 9px", border: "1px solid " + C.linha, borderRadius: 2, background: C.cal }}>
            ☰
          </button>
          <div className="flex items-center gap-2" style={{ flexWrap: "wrap", justifyContent: "flex-end" }}>
          {exigeLogin && uidAtual && (
            <div style={{ position: "relative" }}>
              <button onClick={abrirAvisos}
                style={{ position: "relative", fontSize: 16, cursor: "pointer", padding: "4px 8px", border: "1px solid " + C.linha, borderRadius: 2, background: C.cal }}>
                🔔
                {totalAvisos > 0 && (
                  <span style={{ position: "absolute", top: -5, right: -5, background: C.saibro, color: "#fff",
                    fontFamily: ARCH, fontSize: 10, fontWeight: 700, borderRadius: 999, minWidth: 16, height: 16,
                    display: "flex", alignItems: "center", justifyContent: "center", padding: "0 3px" }}>
                    {totalAvisos}
                  </span>
                )}
              </button>
              {avisosAberto && (
                <>
                  <div onClick={() => setAvisosAberto(false)} style={{ position: "fixed", inset: 0, zIndex: 19 }} />
                  <div style={{ position: "absolute", top: "100%", right: 0, marginTop: 6, background: C.papel,
                    border: "1px solid " + C.linha, borderRadius: 2, boxShadow: "0 4px 14px rgba(0,0,0,.12)", zIndex: 20, width: 260, maxHeight: 340, overflowY: "auto", padding: 12 }}>
                    {totalAvisos === 0 ? (
                      <p style={{ ...prosa, fontSize: 12.5, color: C.grafite }}>Nada pra avisar por agora.</p>
                    ) : (
                      <>
                        {lembretesVisiveis.length > 0 && (
                          <div className="mb-3">
                            <Etiqueta>Hoje</Etiqueta>
                            {lembretesVisiveis.map((l, i) => (
                              <button key={i} onClick={() => { marcarAvisoVisto(idLembrete(l)); setAba(l.tipo === "turma" ? "turmas" : "alunos"); setAvisosAberto(false); }}
                                className="w-full text-left" style={{ display: "block", padding: "6px 0", border: "none", background: "none", cursor: "pointer" }}>
                                <p style={{ ...prosa, fontSize: 12.5 }}>{l.hora} · {l.titulo}</p>
                              </button>
                            ))}
                          </div>
                        )}
                        {pendenciasVisiveis.length > 0 && (
                          <div className="mb-3">
                            <Etiqueta cor={C.saibro}>Pendências do grupo</Etiqueta>
                            {pendenciasVisiveis.map((p, i) => (
                              <button key={i} onClick={() => { marcarAvisoVisto(idPendencia(p)); setAba("turmas"); setAvisosAberto(false); }}
                                className="w-full text-left" style={{ display: "block", padding: "6px 0", border: "none", background: "none", cursor: "pointer" }}>
                                <p style={{ ...prosa, fontSize: 12.5 }}>{p.turma} · {p.data}{p.motivo ? " · " + p.motivo : ""}</p>
                              </button>
                            ))}
                          </div>
                        )}
                        {pedidosAlunosVisiveis.length > 0 && (
                          <div className="mb-3">
                            <Etiqueta cor={C.saibro}>Pedidos dos alunos</Etiqueta>
                            {pedidosAlunosVisiveis.map((p, i) => (
                              <button key={i} onClick={() => { marcarAvisoVisto(idPedidoAluno(p)); setAba("alunos"); setAbertoId(p.alunoId); setAvisosAberto(false); }}
                                className="w-full text-left" style={{ display: "block", padding: "6px 0", border: "none", background: "none", cursor: "pointer" }}>
                                <p style={{ ...prosa, fontSize: 12.5 }}>
                                  <b>{p.alunoNome}</b> · {p.tipo === "conteudo" ? "quer trabalhar: " + p.texto : "pediu reposição"}
                                </p>
                              </button>
                            ))}
                          </div>
                        )}
                        {reservasNovasVisiveis.length > 0 && (
                          <div className="mb-3">
                            <Etiqueta cor={C.saibro}>Reservas de quadra</Etiqueta>
                            {reservasNovasVisiveis.map((r) => (
                              <button key={r.id} onClick={() => verReserva(r)}
                                className="w-full text-left" style={{ display: "block", padding: "6px 0", border: "none", background: "none", cursor: "pointer" }}>
                                <p style={{ ...prosa, fontSize: 12.5 }}>
                                  <b>{r.nomeContato}</b> reservou {r.data} às {r.horaInicio}
                                </p>
                              </button>
                            ))}
                          </div>
                        )}
                        {pedidosPendentesCount > 0 && (
                          <div>
                            <Etiqueta cor={C.saibro}>Equipe</Etiqueta>
                            <button onClick={() => { setAba("equipe"); setAvisosAberto(false); }}
                              className="w-full text-left" style={{ display: "block", padding: "6px 0", border: "none", background: "none", cursor: "pointer" }}>
                              <p style={{ ...prosa, fontSize: 12.5 }}>
                                {pedidosPendentesCount === 1 ? "1 pedido de cadastro" : pedidosPendentesCount + " pedidos de cadastro"} esperando
                              </p>
                            </button>
                          </div>
                        )}
                      </>
                    )}
                  </div>
                </>
              )}
            </div>
          )}
          {planoAtual && NOMES_PLANO[planoAtual] && (
            <Etiqueta cor={C.saibro}>{NOMES_PLANO[planoAtual]}{planoVencido ? " · vencido" : ""}</Etiqueta>
          )}
          {exigeLogin && uidAtual && orgAtual && (
            <EditorMeuNome org={orgAtual} uid={uidAtual} emailAtual={window.mtyAuth.usuario() ? window.mtyAuth.usuario().email : ""} />
          )}
          {exigeLogin && uidAtual && <InstalarApp compacto />}
          {exigeLogin && (
            <button onClick={() => window.mtyAuth.sair()}
              style={{ fontFamily: ARCH, fontSize: 11.5, fontWeight: 600, color: C.grafite, cursor: "pointer", padding: "4px 8px", border: "1px solid " + C.linha, borderRadius: 2, background: C.cal }}>
              sair
            </button>
          )}
          </div>
        </div>
      </div>

      <main className="mty-main px-5 py-6" style={{ maxWidth: 760, marginLeft: 252 }}>
        {carregando ? <p style={{ ...prosa, color: C.grafite }}>Carregando…</p> :
         aba === "catalogo" ? <TelaCatalogo exerciciosCustom={exerciciosCustom} setExerciciosCustom={setExerciciosCustom} /> :
         aba === "taticas" ? <TelaTaticas /> :
         aba === "tecnica" ? <TelaTecnica focoId={focoManualId} /> :
         aba === "casos" ? <TelaCasos /> :
         aba === "conducao" ? <TelaConducao /> :
         aba === "publicos" ? <TelaPublicos /> :
         aba === "aulas" ? <TelaAulas /> :
         aba === "metodo" ? <TelaMetodo /> :
         aba === "equipe" ? <TelaEquipe alunos={alunos} turmas={turmas} membros={membrosFormacao} setMembros={setMembrosFormacao} carregandoForm={carregandoFormacao} uidAtual={uidAtual}
           irPara={(id) => { setAba("alunos"); setAbertoId(id); setSubaba("plano"); }} irParaManual={irParaManual} /> :
         aba === "formacao" ? <TelaFormacaoPessoal membros={membrosFormacao} setMembros={setMembrosFormacao} carregando={carregandoFormacao} uidAtual={uidAtual} irParaManual={irParaManual} /> :
         aba === "turmas" ? <TelaTurmas alunos={alunos} setAlunos={setAlunos} turmas={turmas} setTurmas={setTurmas} papelAtual={papelAtual} uidAtual={uidAtual} /> :
         aba === "quadras" && mostraQuadras ? <TelaQuadras quadras={quadras} setQuadras={setQuadras} reservas={reservas} setReservas={setReservas} orgAtual={orgAtual} /> :
         aba === "agenda" ? <TelaAgenda alunos={alunos} turmas={turmas} uidAtual={uidAtual} exigeLogin={exigeLogin} /> :
         aba === "dashboard" ? <TelaDashboard alunos={alunos} turmas={turmas} papelAtual={papelAtual} uidAtual={uidAtual} exigeLogin={exigeLogin} usoIA={usoIA} identidade={identidade}
           irPara={(id) => { setAba("alunos"); setAbertoId(id); setSubaba("plano"); }} /> :
         aberto ? (
          <div>
            <div className="flex items-center justify-between gap-3 mb-3">
              <button onClick={() => setAbertoId(null)} style={{ ...prosa, color: C.grafite, cursor: "pointer" }}>← Todos os jogadores</button>
              <button onClick={() => removerAluno(aberto.id)} style={{ ...prosa, fontSize: 12.5, color: C.saibro, cursor: "pointer" }}>Remover jogador</button>
            </div>
            <h1 style={{ fontFamily: ARCH, fontSize: 25, fontWeight: 700, lineHeight: 1.1 }}>{aberto.nome || "Sem nome"}</h1>
            <div className="mt-2 mb-5"><Etiqueta>{aberto.nivel} · Estágio {aberto.estagio} · {aberto.semanas} semanas · {aberto.historico.length} sessões</Etiqueta></div>
            <CardTrilha aluno={aberto} aoMudar={(patch) => setAlunos(alunos.map((a) => (a.id === aberto.id ? { ...a, ...patch } : a)))} aoAbrirFicha={() => setSubaba("ficha")} />
            <CardPedidosReposicao aluno={aberto} aoMudar={(patch) => setAlunos(alunos.map((a) => (a.id === aberto.id ? { ...a, ...patch } : a)))} />
            <CardPedidosConteudo aluno={aberto} aoMudar={(patch) => setAlunos(alunos.map((a) => (a.id === aberto.id ? { ...a, ...patch } : a)))} />
            <CardAulaEmVigor aluno={aberto} aoClicar={() => setSubaba("sessao")} aoAbrirAulas={() => setSubaba("aulas")} />
            <div className="flex flex-wrap mb-6" style={{ gap: "4px 20px", borderBottom: "1px solid " + C.linha }}>

                <button key={t.v} onClick={() => setSubaba(t.v)}
                  style={{ fontFamily: ARCH, fontSize: 13, fontWeight: subaba === t.v ? 700 : 500, padding: "8px 0", cursor: "pointer", flexShrink: 0, color: subaba === t.v ? C.tinta : C.grafite, borderBottom: "2px solid " + (subaba === t.v ? C.saibro : "transparent"), marginBottom: -1 }}>

              ))}
            </div>
            {subaba === "ficha" ? <TelaFicha aluno={aberto} salvar={salvar} papelAtual={papelAtual} uidAtual={uidAtual} /> :

             subaba === "aulas" ? <TelaPlano aluno={aberto} alunos={alunos} setAlunos={setAlunos} setSubaba={setSubaba} modo="aulas" papelAtual={papelAtual} uidAtual={uidAtual} /> :
             subaba === "periodizacao" ? <TelaPeriodizacao aluno={aberto} /> :
             subaba === "scout" ? <TelaScout aluno={aberto} alunos={alunos} setAlunos={setAlunos} /> :
             subaba === "registro" ? <TelaRegistro aluno={aberto} alunos={alunos} setAlunos={setAlunos} /> :
             <TelaSessao aluno={aberto} alunos={alunos} setAlunos={setAlunos} setSubaba={setSubaba} papelAtual={papelAtual} uidAtual={uidAtual} />}
          </div>

          <div>
            <p style={{ ...prosa, color: C.grafite, marginBottom: 14 }}>

            {exigeLogin && uidAtual && (
              <div className="flex gap-5 mb-5" style={{ borderBottom: "1px solid " + C.linha }}>
                {[{ v: false, r: "Meus alunos" }, { v: true, r: "Todos os alunos" }].map((t) => (
                  <button key={String(t.v)} onClick={() => setVerTodosAlunos(t.v)}
                    style={{ fontFamily: ARCH, fontSize: 13, fontWeight: verTodosAlunos === t.v ? 700 : 500, padding: "8px 0", cursor: "pointer",
                      color: verTodosAlunos === t.v ? C.tinta : C.grafite, borderBottom: "2px solid " + (verTodosAlunos === t.v ? C.saibro : "transparent"), marginBottom: -1 }}>
                    {t.r}
                  </button>
                ))}
              </div>
            )}
            {alunosExibidos.length === 0 ? (
              <p style={{ ...prosa, color: C.grafite, marginBottom: 16 }}>Nenhum jogador seu por enquanto.</p>
            ) : (
              alunosExibidos.map((a) => {
                const emVigor = a.plano ? aulaEmVigor(a) : null;
                const regEmVigor = emVigor ? (a.regPlano || {})[emVigor.id] || {} : null;
                const repetindo = regEmVigor && (regEmVigor.status === "falta" || regEmVigor.status === "cancelada");
                return (
                  <button key={a.id} onClick={() => { setAbertoId(a.id); setSubaba("ficha"); }}
                    className="w-full text-left flex items-center justify-between gap-3"
                    style={{ background: C.cal, border: "1px solid " + C.linha, borderRadius: 2, padding: "13px 15px", marginBottom: 8 }}>
                    <div>
                      <div style={{ fontFamily: ARCH, fontSize: 15, fontWeight: 700 }}>{a.nome || "Sem nome"}</div>
                      <div className="mt-1">
                        <Etiqueta>{a.nivel} · Estágio {a.estagio} · {a.inicio ? `início ${a.inicio}` : "sem calendário"}</Etiqueta>
                      </div>
                      {verTodosAlunos && (
                        <p style={{ ...prosa, fontSize: 12, color: C.grafite, marginTop: 4 }}>
                          Professor: {a.professorNome || "sem professor definido"}
                        </p>
                      )}
                      {emVigor && (
                        <p style={{ ...prosa, fontSize: 12.5, color: C.saibro, marginTop: 4 }}>
                          {repetindo ? "Repetindo: " : "Em vigor: "}{emVigor.t}
                        </p>
                      )}
                    </div>
                    <span style={{ color: C.grafite, fontSize: 20 }}>→</span>
                  </button>
                );
              })
            )}
            {limiteAtingido && (
              <div className="mt-4 mb-2" style={{ background: C.cal, borderLeft: "3px solid " + C.saibro, padding: "13px 15px" }}>
                {planoVencido ? (
                  <>
                    <p style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700, marginBottom: 4 }}>A licença desta academia venceu em {planoAtivoAte}</p>
                    <p style={{ ...prosa, fontSize: 12.5, color: C.grafite }}>
                      Pra voltar a cadastrar jogadores, é só renovar a licença — fale com a gente.
                    </p>
                  </>
                ) : (
                  <>
                    <p style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700, marginBottom: 4 }}>{NOMES_PLANO[planoAtual] || "Este plano"} vai até {limitePlano} jogadores</p>
                    <p style={{ ...prosa, fontSize: 12.5, color: C.grafite }}>
                      Você já tem {limitePlano}. Pra cadastrar mais, fale com a gente sobre um plano maior.
                    </p>
                  </>
                )}
              </div>
            )}
            <div className="mt-4"><Botao onClick={criar} variante="saibro">Novo jogador</Botao></div>
          </div>
        )}
      </main>
    </div>
  );
}

function novoCaso() {
  return {
    id: "caso" + Date.now(), data: new Date().toISOString().slice(0, 10), autor: "",
    aluno: "", observei: "", concluí: "", fiz: "", porque: "", depois: "", refazer: "",
  };
}

function TelaCasos() {
  const [casos, setCasos] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [editando, setEditando] = useState(null);
  const [busca, setBusca] = useState("");

  useEffect(() => { leia("mty:casos:v1", [], true).then((c) => { setCasos(c); setCarregando(false); }); }, []);
  useEffect(() => { if (!carregando) grave("mty:casos:v1", casos, true); }, [casos, carregando]);

  function salvarCaso(c) {
    setCasos((lista) => lista.some((x) => x.id === c.id) ? lista.map((x) => (x.id === c.id ? c : x)) : [c, ...lista]);
    setEditando(null);
  }
  function remover(id) { setCasos((lista) => lista.filter((x) => x.id !== id)); }

  const filtrados = casos.filter((c) => (c.aluno + " " + c.observei + " " + c.concluí).toLowerCase().includes(busca.toLowerCase()));

  if (editando) {
    const c = editando;
    const set = (k, v) => setEditando({ ...c, [k]: v });
    return (
      <div>
        <button onClick={() => setEditando(null)} className="mb-3" style={{ ...prosa, color: C.grafite, cursor: "pointer" }}>← Todos os casos</button>
        <Secao titulo="Ficha de caso" nota="Este banco é compartilhado com toda a equipe — o que você escrever aqui, os outros treinadores veem.">
          <Campo rotulo="Autor"><input style={entrada} value={c.autor} onChange={(e) => set("autor", e.target.value)} placeholder="Seu nome" /></Campo>
          <div className="grid grid-cols-2 gap-3">
            <Campo rotulo="Data"><input type="date" style={entrada} value={c.data} onChange={(e) => set("data", e.target.value)} /></Campo>
            <Campo rotulo="Aluno"><input style={entrada} value={c.aluno} onChange={(e) => set("aluno", e.target.value)} placeholder="Idade, tempo de tênis, nível" /></Campo>
          </div>
          <Campo rotulo="O que eu observei" nota="Só descrição — sem causa, sem juízo. Nada de 'nervoso' ou 'desmotivado'.">
            <textarea rows={3} style={{ ...entrada, resize: "vertical" }} value={c.observei} onChange={(e) => set("observei", e.target.value)} />
          </Campo>
          <Campo rotulo="O que eu concluí" nota="Aqui sim entra a sua leitura.">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.concluí} onChange={(e) => set("concluí", e.target.value)} />
          </Campo>
          <Campo rotulo="O que eu fiz">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.fiz} onChange={(e) => set("fiz", e.target.value)} />
          </Campo>
          <Campo rotulo="Por que assim, e não de outro jeito">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.porque} onChange={(e) => set("porque", e.target.value)} />
          </Campo>
          <Campo rotulo="O que aconteceu depois">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.depois} onChange={(e) => set("depois", e.target.value)} />
          </Campo>
          <Campo rotulo="Se eu pudesse refazer" nota="Opcional.">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.refazer} onChange={(e) => set("refazer", e.target.value)} />
          </Campo>
        </Secao>
        <div className="flex gap-2">
          <Botao onClick={() => salvarCaso(c)} variante="saibro">Salvar caso</Botao>
          {casos.some((x) => x.id === c.id) && <Botao variante="vazio" onClick={() => { remover(c.id); setEditando(null); }}>Remover</Botao>}
        </div>
      </div>
    );
  }

  return (
    <div>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 16 }}>
        Banco de casos da equipe — compartilhado entre todos os treinadores que abrem este
        aplicativo. Casos que deram errado valem tanto quanto os que deram certo.
      </p>
      <input style={{ ...entrada, marginBottom: 14 }} value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar por aluno ou palavra-chave" />
      {carregando ? <p style={{ ...prosa, color: C.grafite }}>Carregando…</p> : filtrados.length === 0 ? (
        <p style={{ ...prosa, color: C.grafite }}>Nenhum caso ainda. O primeiro pode ser seu.</p>
      ) : filtrados.map((c) => (
        <button key={c.id} onClick={() => setEditando(c)} className="w-full text-left"
          style={{ background: C.cal, border: "1px solid " + C.linha, borderRadius: 2, padding: "11px 14px", marginBottom: 8, display: "block" }}>
          <div className="flex items-center justify-between">
            <span style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700 }}>{c.aluno || "Sem identificação"}</span>
            <Etiqueta>{c.data}{c.autor ? " · " + c.autor : ""}</Etiqueta>
          </div>
          <p style={{ ...prosa, fontSize: 13, color: C.grafite, marginTop: 4 }}>{(c.observei || "").slice(0, 140)}{(c.observei || "").length > 140 ? "…" : ""}</p>
        </button>
      ))}
      <div className="mt-4"><Botao onClick={() => setEditando(novoCaso())} variante="saibro">Novo caso</Botao></div>
    </div>
  );
}

function BlocoReferencia({ b }) {
  if (b.tipo === "tabela") {
    return (
      <div className="mb-4">
        {b.titulo && <h4 style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>{b.titulo}</h4>}
        <Tabela cabecalho={b.cabecalho} linhas={b.linhas} />
      </div>
    );
  }
  if (b.tipo === "lista") {
    return (
      <div className="mb-4">
        {b.titulo && <h4 style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>{b.titulo}</h4>}
        {b.itens.map((it, i) => (
          <div key={i} className="flex gap-3 mb-2">
            <span style={{ fontFamily: ARCH, fontSize: 11, fontWeight: 700, color: C.saibro, flexShrink: 0 }}>{i + 1}</span>
            <p style={{ ...prosa, fontSize: 13 }}>{it}</p>
          </div>
        ))}
      </div>
    );
  }
  if (b.tipo === "aviso") return <Aviso>{b.texto}</Aviso>;
  // texto simples
  return (
    <div className="mb-4">
      {b.titulo && <h4 style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700, marginBottom: 4 }}>{b.titulo}</h4>}
      <p style={{ ...prosa, fontSize: 13, color: C.grafite }}>{b.texto}</p>
    </div>
  );
}

  const [subaba, setSubaba] = useState("t");
  useEffect(() => {
    const mapa = { T: "t", M: "m", P: "p" };
    if (focoId && mapa[focoId[0]]) setSubaba(mapa[focoId[0]]);
  }, [focoId]);
  const series = { t: SERIE_T, m: SERIE_M, p: SERIE_P };
  return (
    <div>
      <p style={{ ...prosa, marginBottom: 14 }}>
        Parte 2 do manual. Uma ficha por golpe, movimentação ou decisão tática — cada uma responde
        sozinha à pergunta de quadra. O campo que mais importa em cada uma é o dos erros mais
        comuns: a ligação sintoma → causa.
      </p>
      <div className="flex gap-2 mb-6 flex-wrap">
        {[["t", "T · Golpes"], ["m", "M · Movimentação"], ["p", "P · Ponto e tática"]].map(([v, r]) => (
          <button key={v} onClick={() => setSubaba(v)}
            style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: subaba === v ? 700 : 500, padding: "7px 12px",
              borderRadius: 2, cursor: "pointer", border: "1px solid " + (subaba === v ? C.tinta : C.linha),
              background: subaba === v ? C.tinta : C.cal, color: subaba === v ? C.papel : C.grafite }}>
            {r}
          </button>
        ))}
      </div>
      {series[subaba].map((f) => <FichaTecnica key={f.id} f={f} />)}
    </div>
  );
}

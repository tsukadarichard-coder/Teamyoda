/* ─────────────────────────── catálogo ─────────────────────────── */
/* ─────────────────────────── plano do ciclo ───────────────────────────
   O plano chega como JSON gerado na conversa. Aqui ele vira documento vivo:
   o treinador marca aula, anota, consulta o exercício e fecha o ciclo. */
function TelaPlano({ aluno, alunos, setAlunos }) {
  const [colando, setColando] = useState(false);
  const [texto, setTexto] = useState("");
  const [erro, setErro] = useState("");
  const [gerando, setGerando] = useState(false);
  const [semanas, setSemanas] = useState(12);
  const [aulasSem, setAulasSem] = useState(3);
  const [verEx, setVerEx] = useState(null);
  const [relatorio, setRelatorio] = useState("");
  const [linkAluno, setLinkAluno] = useState("");
  const [gerandoLink, setGerandoLink] = useState(false);
  const [linkCopiado, setLinkCopiado] = useState(false);
  const [chuvaAberta, setChuvaAberta] = useState(null);

  const plano = aluno.plano;
  const reg = aluno.regPlano || {};
  const historico = aluno.historicoRelatorios || [];
  const [abrirHist, setAbrirHist] = useState(null);

  function atualiza(campos) {
    setAlunos(alunos.map((a) => (a.id === aluno.id ? { ...a, ...campos } : a)));
  }

  function valida(alvo) {
    if (!alvo.blocos || !alvo.blocos.length) throw new Error("Não encontrei os blocos do plano.");
    const ruins = [];
    alvo.blocos.forEach((b) => (b.semanasLista || []).forEach((sem) =>
      (sem.aulas || []).forEach((au) => (au.ex || []).forEach((c) => {
        if (!EXERCICIOS.some((e) => e.c === c)) ruins.push(c);
      }))));
    if (ruins.length)
      throw new Error("Códigos que não existem no catálogo: " + [...new Set(ruins)].join(", "));
    const raizes = (alvo.cadeia || []).filter((c) => c.raiz).length;
    if (raizes > 1) throw new Error("O plano marcou " + raizes + " camadas como origem. Só pode haver uma.");
    return alvo;
  }

  async function gerarComIA() {
    setErro(""); setGerando(true);
    try {
      let t = (await chamarIA(promptPlanoEstruturado(aluno, semanas, aulasSem, historico), 8000)).trim();
      t = t.replace(/^```(json)?/i, "").replace(/```$/, "").trim();
      const i = t.indexOf("{");
      if (i > 0) t = t.slice(i);
      const alvo = valida(JSON.parse(t));
      atualiza({ plano: alvo, regPlano: {} });
    } catch (e) {
      setErro(String(e.message || e));
    }
    setGerando(false);
  }

  function importar() {
    setErro("");
    try {
      let t = texto.trim().replace(/^```(json)?/i, "").replace(/```$/, "").trim();
      const i = t.indexOf("{");
      if (i > 0) t = t.slice(i);
      const p = JSON.parse(t);
      const alvo = valida(p.plano || p);
      atualiza({ plano: alvo, regPlano: {} });
      setColando(false); setTexto("");
    } catch (e) {
      setErro(String(e.message || e));
    }
  }

  const aulas = useMemo(() => listaAulas(plano), [plano]);

  /* status de cada aula: "" (pendente) | "feita" | "falta" | "cancelada". */
  function status(id) {
    return statusAula(reg, id);
  }
  const feitas = aulas.filter((a) => status(a.id) === "feita").length;

  function defineStatus(id, novo) {
    const d = { ...(reg[id] || {}) };
    d.status = status(id) === novo ? "" : novo;
    delete d.feita; // campo antigo — o status assume o lugar dele
    if (d.status && !d.data) d.data = new Date().toISOString().slice(0, 10);
    if (d.status !== "falta" && d.status !== "cancelada") d.motivo = "";
    atualiza({ regPlano: { ...reg, [id]: d } });
  }
  function campo(id, k, v) {
    atualiza({ regPlano: { ...reg, [id]: { ...(reg[id] || {}), [k]: v } } });
  }
  function fech(k, v) {
    atualiza({ regPlano: { ...reg, __fech: { ...(reg.__fech || {}), [k]: v } } });
  }

  function gerar() {
    const F = reg.__fech || {};
    const NOTA = { sim: "ATINGIDO", par: "PARCIAL", nao: "NÃO ATINGIDO", "": "não avaliado" };
    const L = [];
    L.push("RELATÓRIO DE CICLO · METODOLOGIA MTY");
    L.push("Jogador: " + (aluno.nome || "sem nome") + " · " + (plano.tipo || ""));
    L.push("Gerado em: " + new Date().toLocaleDateString("pt-BR"));
    L.push("Aulas realizadas: " + feitas + " de " + aulas.length);
    L.push("");
    L.push("═══ FECHAMENTO DO CICLO ═══");
    L.push("");
    L.push("CRITÉRIOS DE SAÍDA");
    plano.blocos.filter((b) => b.saida).forEach((b, i) => {
      L.push("  " + (b.nome || "") + " · " + (b.titulo || "") + ": " + NOTA[F["nota:C" + i] || ""]);
      const t = (F["crit:C" + i] || "").trim();
      if (t) L.push("    " + t);
    });
    L.push("");
    L.push("O QUE ESTAVA EM OBSERVAÇÃO");
    (plano.observacao || []).forEach((o, i) => {
      L.push("  " + o.t);
      L.push("    " + ((F["obs:O" + i] || "").trim() || "[segue em aberto — não foi preenchido]"));
    });
    L.push("");
    const dores = aulas.filter((a) => (reg[a.id] || {}).dor);
    L.push("REGISTRO DE DOR — " + (dores.length ? dores.length + " aulas com registro" : "nenhum registro no período"));
    dores.forEach((a) => L.push("  " + (reg[a.id].data || "") + " · semana " + a.semana + " · " + reg[a.id].dor));
    L.push("");
    let bl = "";
    aulas.forEach((a) => {
      if (status(a.id) !== "feita") return;
      const d = reg[a.id];
      if (a.bloco !== bl) { bl = a.bloco; L.push("── " + bl.toUpperCase() + " ──"); }
      L.push("Semana " + a.semana + " · " + a.t + " · " + (d.data || "sem data"));
      if ((d.obs || "").trim()) L.push("   " + d.obs.trim());
      L.push("   exercícios: " + (a.ex || []).join(" "));
    });
    const faltasCancel = aulas.filter((a) => status(a.id) === "falta" || status(a.id) === "cancelada");
    if (faltasCancel.length) {
      L.push("");
      L.push("FALTAS E CANCELAMENTOS (" + faltasCancel.length + ")");
      faltasCancel.forEach((a) => L.push("  " + (reg[a.id].data || "") + " · semana " + a.semana + " · " + a.t +
        " · " + (status(a.id) === "falta" ? "falta" : "cancelada") + (reg[a.id].motivo ? " · " + reg[a.id].motivo : "")));
    }
    const naoFeitas = aulas.filter((a) => status(a.id) === "");
    if (naoFeitas.length) {
      L.push("");
      L.push("SEM REGISTRO (" + naoFeitas.length + ")");
      naoFeitas.forEach((a) => L.push("  Semana " + a.semana + " · " + a.t));
    }
    L.push("");
    L.push("---");
    L.push("Aula sem observação escrita não é aula sem informação — é informação não registrada.");
    L.push("Campos de observação em branco seguem em aberto e entram no próximo ciclo.");
    setRelatorio(L.join("\n"));
  }

  function arquivar() {
    const item = {
      id: "REL-" + Date.now().toString(36),
      data: new Date().toISOString(),
      tipo: plano.tipo || "",
      feitas, total: aulas.length,
      texto: relatorio,
    };
    atualiza({ historicoRelatorios: [item, ...historico] });
  }

  function removerDoHistorico(id) {
    if (!confirm("Remover este relatório do histórico? Não dá pra desfazer.")) return;
    atualiza({ historicoRelatorios: historico.filter((h) => h.id !== id) });
    if (abrirHist === id) setAbrirHist(null);
  }

  /* ── sem plano ainda ── */
  if (!plano) {
    return (
      <div>
        <Aviso cor={C.quadra}>
          Este jogador ainda não tem plano. Preencha a ficha de entrada e gere aqui mesmo —
          ou cole um plano montado fora.
        </Aviso>

        <Secao titulo="Gerar a partir da ficha" nota="Usa o que está preenchido na aba Ficha e escolhe os exercícios dentro do catálogo, respeitando o estágio do jogador. Se o jogador já teve ciclos anteriores, o plano novo é montado considerando o que ficou registrado neles.">
          <div className="grid grid-cols-2 gap-3">
            <Campo rotulo="Semanas do ciclo">
              <Seletor opcoes={[8, 12, 16].map((n) => ({ v: n, r: n + " semanas" }))}
                valor={semanas} aoMudar={setSemanas} />
            </Campo>
            <Campo rotulo="Aulas por semana">
              <Seletor opcoes={[1, 2, 3, 4, 5].map((n) => ({ v: n, r: String(n) }))}
                valor={aulasSem} aoMudar={setAulasSem} />
            </Campo>
          </div>
          {!(aluno.camadas.tecnico || "").trim() && (
            <Aviso>
              A camada técnica da ficha está vazia. O plano vai sair genérico — preencha a aba
              Ficha antes de gerar.
            </Aviso>
          )}
          {erro && <Aviso>{erro}</Aviso>}
          <div className="flex gap-2 flex-wrap items-center">
            <Botao onClick={gerarComIA} variante="saibro">
              {gerando ? "Montando o plano…" : "Gerar planejamento"}
            </Botao>
            <Botao variante="vazio" onClick={() => setColando(true)}>Colar plano pronto</Botao>
          </div>
          {gerando && <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 9 }}>
            Costuma levar de trinta segundos a um minuto.</p>}
        </Secao>

        {colando && (
          <div>
            <Campo rotulo="Cole o JSON do plano" nota="Pode colar com as crases do bloco de código — eu limpo.">
              <textarea rows={9} style={{ ...entrada, resize: "vertical", fontFamily: "ui-monospace, monospace", fontSize: 12 }}
                value={texto} onChange={(e) => setTexto(e.target.value)} />
            </Campo>
            {erro && <Aviso>{erro}</Aviso>}
            <div className="flex gap-2">
              <Botao onClick={importar} variante="saibro">Importar</Botao>
              <Botao variante="vazio" onClick={() => { setColando(false); setErro(""); }}>Cancelar</Botao>
            </div>
          </div>
        )}
      </div>
    );
  }

  const pct = aulas.length ? Math.round((feitas / aulas.length) * 100) : 0;

  async function gerarLinkAluno() {
    setGerandoLink(true);
    try {
      let chave = aluno.linkToken;
      if (!chave) {
        chave = MTY.id("aluno");
        atualiza({ linkToken: chave });
      }
      const org = await organizacao();
      const url = location.origin + "/aluno.html?org=" + encodeURIComponent(org || "") +
        "&id=" + encodeURIComponent(aluno.id) + "&t=" + encodeURIComponent(chave);
      setLinkAluno(url);
      setLinkCopiado(false);
    } finally {
      setGerandoLink(false);
    }
  }

  async function copiarLinkAluno() {
    try {
      await navigator.clipboard.writeText(linkAluno);
    } catch {
      const campo = document.getElementById("mty-link-aluno");
      if (campo) { campo.select(); document.execCommand("copy"); }
    }
    setLinkCopiado(true);
    setTimeout(() => setLinkCopiado(false), 2000);
  }

  return (
    <div>
      <div className="mb-5">
        <div className="flex items-baseline justify-between gap-3 mb-2">
          <span style={{ fontFamily: ARCH, fontSize: 15, fontWeight: 700 }}>{plano.tipo || "Plano do ciclo"}</span>
          <Etiqueta>{feitas} de {aulas.length} aulas · {pct}%</Etiqueta>
        </div>
        <div style={{ height: 7, background: C.linha }}>
          <div style={{ height: "100%", width: pct + "%", background: C.quadra }} />
        </div>
      </div>

      <datalist id="motivos-cancelamento">
        <option value="Chuva" /><option value="Quadra indisponível" /><option value="Feriado" />
        <option value="Doença" /><option value="Viagem" />
      </datalist>

      <div className="mb-5">
        <Botao pequeno variante="vazio" onClick={gerarLinkAluno}>
          {gerandoLink ? "Gerando…" : "Link para o aluno (protótipo)"}
        </Botao>
        {linkAluno && (
          <div className="mt-2 flex gap-2 items-center flex-wrap">
            <input id="mty-link-aluno" readOnly value={linkAluno} style={{ ...entrada, fontSize: 12, flex: 1 }}
              onFocus={(e) => e.target.select()} />
            <Botao pequeno variante="vazio" onClick={copiarLinkAluno}>{linkCopiado ? "✓ copiado" : "Copiar"}</Botao>
          </div>
        )}
      </div>

      <div style={{ background: "#FDF6E7", borderLeft: "3px solid #C9A227", padding: "11px 14px", marginBottom: 16 }}>
        <p style={{ ...prosa, fontSize: 13 }}>
          <b>Rascunho.</b> Leia o plano inteiro antes de conduzir. Nenhum planejamento vai para
          o aluno sem um treinador revisar e assinar.
        </p>
      </div>

      {plano.prioridade && (
        <div style={{ background: C.cal, borderLeft: "3px solid " + C.saibro, padding: "12px 15px", marginBottom: 18 }}>
          <p style={{ ...prosa, fontSize: 14 }}>{plano.prioridade}</p>
        </div>
      )}

      {plano.blocos.map((b, bi) => (
        <div key={bi} className="mb-7">
          <div style={{ background: C.tinta, color: C.papel, padding: "12px 15px" }}>
            <div style={{ fontFamily: ARCH, fontSize: 10, fontWeight: 700, letterSpacing: ".12em", color: C.saibro }}>
              {b.nome} · semanas {b.semanas}
            </div>
            <div style={{ fontFamily: ARCH, fontSize: 16, fontWeight: 700, marginTop: 2 }}>{b.titulo}</div>
          </div>
          {b.alvo && <p style={{ ...prosa, fontSize: 13, color: C.grafite, background: C.cal,
            border: "1px solid " + C.linha, borderTop: "none", padding: "11px 15px", margin: 0 }}>{b.alvo}</p>}

          {(b.semanasLista || []).map((sem, si) => (
            <div key={si} style={{ border: "1px solid " + C.linha, borderTop: "none", background: C.cal }}>
              <div className="flex items-center gap-3 flex-wrap" style={{ padding: "9px 14px", background: C.papel, borderBottom: "1px solid " + C.linha }}>
                <Etiqueta cor={C.tinta}>Semana {sem.n}</Etiqueta>
                <span style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700, flex: 1 }}>{sem.foco}</span>
                {sem.carga && <Etiqueta>{sem.carga}</Etiqueta>}
              </div>
              {(sem.aulas || []).map((au, ai) => {
                const idx = aulas.findIndex((x) => x.semana === sem.n && x.t === au.t && (x.ex || []).join() === (au.ex || []).join());
                const id = idx >= 0 ? aulas[idx].id : "A?" + si + ai;
                const d = reg[id] || {};
                const st = status(id);
                const corStatus = { feita: C.quadra, falta: "#8A2E2E", cancelada: C.saibro }[st] || C.linha;
                return (
                  <div key={ai} style={{ borderBottom: "1px solid " + C.linha,
                    background: st === "feita" ? "#F4F7F4" : st ? "#FBF4F0" : C.cal }}>
                    <div className="flex gap-3" style={{ padding: "11px 14px" }}>
                      <div className="flex-1">
                        <div className="flex gap-1 flex-wrap mb-2">
                          {[["feita", "Realizada"], ["falta", "Falta"], ["cancelada", "Cancelada"]].map(([v, r]) => (
                            <button key={v} onClick={() => defineStatus(id, v)}
                              style={{ fontFamily: ARCH, fontSize: 10.5, fontWeight: 700, padding: "4px 8px",
                                borderRadius: 2, cursor: "pointer",
                                border: "1px solid " + (st === v ? corStatus : C.linha),
                                background: st === v ? corStatus : C.papel,
                                color: st === v ? "#fff" : C.grafite }}>{r}</button>
                          ))}
                        </div>
                        <div style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700,
                          color: st === "feita" ? C.quadra : C.tinta }}>{ai + 1} · {au.t}</div>
                        <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 2 }}>{au.d}</p>
                        <div className="flex gap-1 flex-wrap mt-2">
                          {(au.ex || []).map((c) => (
                            <button key={c} onClick={() => setVerEx(c)}
                              style={{ fontFamily: ARCH, fontSize: 10.5, fontWeight: 700, padding: "3px 7px",
                                border: "1px solid " + (c.startsWith("TR") ? C.saibro : C.linha),
                                color: c.startsWith("TR") ? C.saibro : C.grafite,
                                background: C.papel, cursor: "pointer", borderRadius: 2 }}>{c}</button>
                          ))}
                          {au.selo === "ss" && <Etiqueta cor={C.saibro}>sem saque</Etiqueta>}
                          {au.selo && au.selo.indexOf("cs:") === 0 &&
                            <Etiqueta cor={C.quadra}>saque · {au.selo.split(":")[1]}</Etiqueta>}
                        </div>
                      </div>
                    </div>
                    {st === "feita" && (

function TelaCatalogo() {
  const [busca, setBusca] = useState("");
  const [estagio, setEstagio] = useState("todos");
  const [familia, setFamilia] = useState("todas");
  const lista = useMemo(() => {
    const t = busca.trim().toLowerCase();
    return EXERCICIOS.filter((e) => {
      if (estagio !== "todos" && !e.e.includes(estagio)) return false;
      if (familia !== "todas" && e.f !== familia) return false;
      if (!t) return true;
      return (e.c + " " + e.n + " " + e.m + " " + e.i).toLowerCase().includes(t);
    });
  }, [busca, estagio, familia]);
  return (
    <div>
      <MapaFamilias />
      <input style={{ ...entrada, marginBottom: 14 }} value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar por código, nome ou montagem" />
      <Campo rotulo="Estágio"><Seletor opcoes={[{ v: "todos", r: "Todos" }, ...ESTAGIOS.map((e) => ({ v: e.s, r: e.s }))]} valor={estagio} aoMudar={setEstagio} /></Campo>
      <Campo rotulo="Família"><Seletor opcoes={[{ v: "todas", r: "Todas" }, ...Object.keys(FAM).map((f) => ({ v: f, r: f }))]} valor={familia} aoMudar={setFamilia} /></Campo>
      <div className="mb-3"><Etiqueta>{lista.length} exercícios</Etiqueta></div>
      {lista.slice(0, 80).map((e) => <CartaoExercicio key={e.c} e={e} />)}
      {lista.length > 80 && <p style={{ ...prosa, fontSize: 13, color: C.grafite }}>Mostrando os 80 primeiros. Refine a busca.</p>}
    </div>
  );
}

function TelaLogin({ aoEntrar }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [ocupado, setOcupado] = useState(false);

  async function enviar() {
    setErro(""); setOcupado(true);
    try {
      await window.mtyAuth.entrar(email.trim(), senha);
      aoEntrar();
    } catch (e) {
      const c = (e && e.code) || "";
      const msgs = {
        "auth/invalid-email": "E-mail inválido.",
        "auth/user-not-found": "Não existe conta com este e-mail.",
        "auth/wrong-password": "Senha incorreta.",
        "auth/invalid-credential": "E-mail ou senha incorretos.",
        "auth/too-many-requests": "Muitas tentativas. Espere um pouco e tente de novo.",
      };
      setErro(msgs[c] || "Não consegui completar. Verifique a conexão e tente de novo.");
    }
    setOcupado(false);
  }

  return (
    <div style={{ background: C.papel, minHeight: "100vh" }}>
      <div style={{ height: 4, background: C.saibro }} />
      <div style={{ maxWidth: 400, margin: "0 auto", padding: "56px 22px" }}>
        <img src="assets/logo-team-yoda.jpg" alt="Team Yoda" style={{ height: 34, marginBottom: 10 }} />
        <div className="mt-1 mb-7"><Etiqueta>Acesso da equipe técnica</Etiqueta></div>

        <Campo rotulo="E-mail">
          <input type="email" autoComplete="email" style={entrada} value={email}
            onChange={(e) => setEmail(e.target.value)} placeholder="treinador@exemplo.com" />
        </Campo>
        <Campo rotulo="Senha">
          <input type="password" autoComplete="current-password"
            style={entrada} value={senha} onChange={(e) => setSenha(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && email && senha) enviar(); }} />
        </Campo>

        {erro && (
          <div style={{ background: C.cal, borderLeft: "3px solid " + C.saibro, padding: "11px 13px", marginBottom: 14 }}>
            <p style={{ ...prosa, fontSize: 13.5, color: C.saibro }}>{erro}</p>
          </div>
        )}

        <button onClick={enviar} disabled={ocupado || !email || !senha}
          style={{ width: "100%", fontFamily: ARCH, fontSize: 14, fontWeight: 700, padding: "13px 0",
            borderRadius: 2, cursor: ocupado ? "wait" : "pointer", border: "none",
            background: (!email || !senha) ? C.linha : C.saibro,
            color: (!email || !senha) ? C.grafite : "#fff" }}>
          {ocupado ? "…" : "Entrar"}
        </button>

        <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 18 }}>
          Todos os treinadores da mesma academia veem os mesmos jogadores, fichas e casos.
          Ainda não tem conta? <a href="solicitar-acesso.html" style={{ color: C.saibro }}>Solicite acesso à sua academia</a> —
          o coordenador precisa aprovar antes de você entrar.
        </p>
      </div>
    </div>
  );
}

/* ── equipe da academia (só coordenador) ──
   Pedidos de acesso ficam pendentes até alguém com role "coordenador"
   aprovar — a function aprovar-treinador confere isso pelo próprio
   token de quem chama, não por um segredo separado. */
function TelaEquipe() {
  const [subaba, setSubaba] = useState("pedidos");
  const [pendentes, setPendentes] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [ocupado, setOcupado] = useState(null);
  const [erro, setErro] = useState("");
  const [membros, setMembros] = useState([]);
  const [carregandoForm, setCarregandoForm] = useState(true);

  useEffect(() => {
    leia("mty:formacao:v1", [], true).then((m) => { setMembros(m); setCarregandoForm(false); });
  }, []);
  useEffect(() => { if (!carregandoForm) grave("mty:formacao:v1", membros, true); }, [membros, carregandoForm]);

  async function carregar() {
    setCarregando(true);
    try {
      const org = await organizacao();
      const snap = await db.collection("orgs").doc(org).collection("solicitacoes")
        .where("status", "==", "pendente").get();
      const lista = [];
      snap.forEach((d) => lista.push({ uid: d.id, ...d.data() }));
      setPendentes(lista);
    } catch (e) {
      setErro(String(e.message || e));
    }
    setCarregando(false);
  }
  useEffect(() => { carregar(); }, []);

  async function aprovar(uid) {
    setOcupado(uid); setErro("");
    try {
      const token = await window.mtyAuth.tokenId();
      const r = await fetch("/.netlify/functions/aprovar-treinador", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: "Bearer " + token },
        body: JSON.stringify({ uid }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.erro || ("Erro " + r.status));
      await carregar();
    } catch (e) {
      setErro(String(e.message || e));
    }
    setOcupado(null);
  }

  async function recusar(uid) {
    setOcupado(uid); setErro("");
    try {
      const org = await organizacao();
      await db.collection("orgs").doc(org).collection("solicitacoes").doc(uid)
        .set({ status: "recusada" }, { merge: true });
      await carregar();
    } catch (e) {
      setErro(String(e.message || e));
    }
    setOcupado(null);
  }

  return (
    <div>
      <h1 style={{ fontFamily: ARCH, fontSize: 22, fontWeight: 700, marginBottom: 4 }}>Equipe</h1>
      <div className="flex gap-5 mb-6" style={{ borderBottom: "1px solid " + C.linha }}>
        {[{ v: "pedidos", r: "Pedidos" }, { v: "formacao", r: "Formação" }].map((t) => (
          <button key={t.v} onClick={() => setSubaba(t.v)}
            style={{ fontFamily: ARCH, fontSize: 13, fontWeight: subaba === t.v ? 700 : 500, padding: "8px 0", cursor: "pointer",
              color: subaba === t.v ? C.tinta : C.grafite, borderBottom: "2px solid " + (subaba === t.v ? C.saibro : "transparent"), marginBottom: -1 }}>
            {t.r}
          </button>
        ))}
      </div>

      {subaba === "pedidos" ? (
        <div>
          <p style={{ ...prosa, color: C.grafite, marginBottom: 18 }}>
            Pedidos de acesso de treinadores novos para esta academia.
          </p>

          {erro && <div className="mb-4"><Aviso>{erro}</Aviso></div>}

          {carregando ? (
            <p style={{ ...prosa, color: C.grafite }}>Carregando…</p>
          ) : pendentes.length === 0 ? (
            <p style={{ ...prosa, color: C.grafite }}>Nenhum pedido pendente no momento.</p>
          ) : (
            pendentes.map((p) => (
              <div key={p.uid} style={{ background: C.cal, border: "1px solid " + C.linha, padding: "13px 15px", marginBottom: 9 }}>
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <div>
                    <div style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700 }}>{p.nome || "Sem nome"}</div>
                    <div style={{ ...prosa, fontSize: 12.5, color: C.grafite }}>{p.email}</div>
                  </div>
                  <div className="flex gap-2">
                    <Botao pequeno onClick={() => aprovar(p.uid)} disabled={ocupado === p.uid}>
                      {ocupado === p.uid ? "…" : "Aprovar"}
                    </Botao>
                    <Botao pequeno variante="vazio" onClick={() => recusar(p.uid)} disabled={ocupado === p.uid}>
                      Recusar
                    </Botao>
                  </div>
                </div>
              </div>
            ))
          )}
        </div>
      ) : (
        <SecaoFormacao membros={membros} setMembros={setMembros} carregando={carregandoForm} />
      )}
    </div>
  );
}

            <div key={m.t} className="mb-2">
              <span style={{ fontFamily: ARCH, fontSize: 12, fontWeight: 700 }}>{m.t}</span>
              <span style={{ ...prosa, fontSize: 12, color: C.grafite }}> — {m.d}</span>
            </div>
          ))}
          <h4 style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700, margin: "14px 0 6px" }}>Níveis de certificação</h4>
          <Tabela cabecalho={["Nível", "Requisito", "Habilita a"]}
            linhas={FORMACAO_STAFF_INFO.certificacao.map((c) => [c.nivel, c.requisito, c.habilita])} />
          <Aviso cor={C.quadra}>{FORMACAO_STAFF_INFO.revalidacao}</Aviso>

function SecaoFormacao({ membros, setMembros, carregando }) {
  const [nomeNovo, setNomeNovo] = useState("");
  const [abertoId, setAbertoId] = useState(null);

  function adicionar() {
    if (!nomeNovo.trim()) return;
    setMembros([...membros, novoMembroFormacao(nomeNovo)]);
    setNomeNovo("");
  }
  function remover(id) {
    if (!confirm("Remover este treinador da formação? O progresso registrado vai junto.")) return;
    setMembros(membros.filter((m) => m.id !== id));
    if (abertoId === id) setAbertoId(null);
  }
  function alternar(id, cursoId, idx) {
    setMembros(membros.map((m) => {
      if (m.id !== id) return m;
      const curso = CURSOS_FORMACAO.find((c) => c.id === cursoId);
      const atual = m.progresso[cursoId] || curso.modulos.map(() => false);
      const prog = { ...m.progresso, [cursoId]: atual.map((v, i) => (i === idx ? !v : v)) };
      return { ...m, progresso: prog };
    }));
  }
  function contagem(m) {
    const feitos = CURSOS_FORMACAO.reduce((n, c) => n + (m.progresso[c.id] || []).filter(Boolean).length, 0);
    const total = CURSOS_FORMACAO.reduce((n, c) => n + c.modulos.length, 0);
    return feitos + "/" + total;
  }

  const aberto = abertoId ? membros.find((m) => m.id === abertoId) : null;

  return (
    <div>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 16 }}>
        Acompanhamento dos cursos de formação — Percepção em Quadra, Diagnóstico em Casos Reais e
        a Formação Interna de 36 semanas — por treinador da equipe.
      </p>

      <ReferenciaFormacaoStaff />

      <div className="flex gap-2 mb-5">
        <input style={entrada} value={nomeNovo} onChange={(e) => setNomeNovo(e.target.value)}
          placeholder="Nome do treinador" onKeyDown={(e) => e.key === "Enter" && adicionar()} />
        <Botao pequeno onClick={adicionar} disabled={!nomeNovo.trim()}>Adicionar</Botao>
      </div>

      {carregando ? (
        <p style={{ ...prosa, color: C.grafite }}>Carregando…</p>
      ) : aberto ? (
        <div>
          <button onClick={() => setAbertoId(null)} className="mb-3" style={{ ...prosa, color: C.grafite, cursor: "pointer" }}>← Todos os treinadores</button>
          <h2 style={{ fontFamily: ARCH, fontSize: 18, fontWeight: 700, marginBottom: 4 }}>{aberto.nome}</h2>
          <div className="mb-5"><Etiqueta>{contagem(aberto)} módulos concluídos</Etiqueta></div>
          {CURSOS_FORMACAO.map((c) => (
            <div key={c.id} className="mb-6">
              <h3 style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700, marginBottom: 9 }}>{c.nome}</h3>
              {c.modulos.map((mod, i) => {
                const feito = !!(aberto.progresso[c.id] || [])[i];
                return (
                  <div key={i} onClick={() => alternar(aberto.id, c.id, i)}
                    style={{ background: feito ? "#F4F7F4" : C.cal, border: "1px solid " + C.linha,
                      borderLeft: "3px solid " + (feito ? C.quadra : C.linha), padding: "10px 13px", marginBottom: 7, cursor: "pointer" }}>
                    <div className="flex items-start gap-3">
                      <span style={{ fontFamily: ARCH, fontSize: 16, lineHeight: 1.2, color: feito ? C.quadra : C.grafite }}>{feito ? "☑" : "☐"}</span>
                      <div>
                        <div style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700 }}>Módulo {i + 1} · {mod.t}</div>
                        <p style={{ ...prosa, fontSize: 12, color: C.grafite, marginTop: 3 }}>Sai do módulo: {mod.saida}</p>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
          <Botao variante="vazio" onClick={() => remover(aberto.id)}>Remover treinador</Botao>
        </div>
      ) : membros.length === 0 ? (
        <p style={{ ...prosa, color: C.grafite }}>Nenhum treinador cadastrado na formação ainda.</p>
      ) : (
        membros.map((m) => (
          <button key={m.id} onClick={() => setAbertoId(m.id)} className="w-full text-left flex items-center justify-between gap-3"
            style={{ background: C.cal, border: "1px solid " + C.linha, padding: "13px 15px", marginBottom: 9 }}>
            <div style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700 }}>{m.nome}</div>
            <Etiqueta>{contagem(m)}</Etiqueta>
          </button>
        ))
      )}
    </div>
  );
}

/* ── turmas (aulas em dupla/grupo) ──
   Cada jogador continua com o plano dele, individual, gerado do jeito
   de sempre. A turma só agrupa quem treina junto — a sessão une a
   próxima aula pendente de cada um numa tela só, e marca presença de
   todo mundo em uma ação (com espaço pra corrigir por pessoa: chuva
   cancela a turma inteira, mas um jogador específico pode ter faltado
   por outro motivo mesmo com o resto treinando). */
function TelaTurmas({ alunos, setAlunos, turmas, setTurmas }) {
  const [abertaId, setAbertaId] = useState(null);
  const [criando, setCriando] = useState(false);
  const [nome, setNome] = useState("");
  const [membrosSel, setMembrosSel] = useState([]);
  const [duracao, setDuracao] = useState("1h");

  const aberta = abertaId ? turmas.find((t) => t.id === abertaId) : null;
  if (aberta) {
    return (
      <SessaoTurma turma={aberta} alunos={alunos} setAlunos={setAlunos}
        aoFechar={() => setAbertaId(null)}
        aoRemover={() => { setTurmas(turmas.filter((t) => t.id !== aberta.id)); setAbertaId(null); }} />
    );
  }

  function alternarMembro(id) {
    setMembrosSel((sel) => sel.includes(id) ? sel.filter((x) => x !== id) : [...sel, id]);
  }
  function criarTurma() {
    if (!nome.trim() || membrosSel.length < 2) return;
    setTurmas([...turmas, { id: "turma-" + Date.now(), nome: nome.trim(), membros: membrosSel, duracaoPadrao: duracao }]);
    setNome(""); setMembrosSel([]); setDuracao("1h"); setCriando(false);
  }

  return (
    <div>
      <h1 style={{ fontFamily: ARCH, fontSize: 22, fontWeight: 700, marginBottom: 4 }}>Turmas</h1>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 18 }}>
        Pra jogadores que treinam juntos. Cada um mantém o próprio plano — a turma só une a
        aula do dia numa sessão só, com presença marcada de uma vez para o grupo.
      </p>

      <CartaoConducao />

      {!criando ? (
        <Botao pequeno onClick={() => setCriando(true)}>Nova turma</Botao>
      ) : (
        <div style={{ background: C.cal, border: "1px solid " + C.linha, padding: 15, marginBottom: 18 }}>
          <Campo rotulo="Nome da turma">
            <input style={entrada} value={nome} onChange={(e) => setNome(e.target.value)} placeholder="ex: Terça 17h" />
          </Campo>
          <Campo rotulo="Duração padrão">
            <Seletor opcoes={[{ v: "1h", r: "1h" }, { v: "1h30", r: "1h30" }, { v: "2h", r: "2h" }]} valor={duracao} aoMudar={setDuracao} />
          </Campo>
          <Campo rotulo="Jogadores (mínimo 2)">
            <div className="flex flex-wrap gap-2">
              {alunos.map((a) => (
                <button key={a.id} onClick={() => alternarMembro(a.id)}
                  style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 600, padding: "6px 11px", borderRadius: 2, cursor: "pointer",
                    border: "1px solid " + (membrosSel.includes(a.id) ? C.tinta : C.linha),
                    background: membrosSel.includes(a.id) ? C.tinta : C.papel,
                    color: membrosSel.includes(a.id) ? C.papel : C.grafite }}>
                  {a.nome || "Sem nome"}
                </button>
              ))}
            </div>
          </Campo>
          <div className="flex gap-2">
            <Botao pequeno onClick={criarTurma} disabled={!nome.trim() || membrosSel.length < 2}>Criar turma</Botao>
            <Botao pequeno variante="vazio" onClick={() => { setCriando(false); setNome(""); setMembrosSel([]); }}>Cancelar</Botao>
          </div>
        </div>
      )}

      {turmas.length === 0 ? (
        <p style={{ ...prosa, color: C.grafite }}>Nenhuma turma criada ainda.</p>
      ) : (
        turmas.map((t) => (
          <div key={t.id} onClick={() => setAbertaId(t.id)}
            style={{ background: C.cal, border: "1px solid " + C.linha, padding: "13px 15px", marginBottom: 9, cursor: "pointer" }}>
            <div style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700 }}>{t.nome}</div>
            <div className="mt-1"><Etiqueta>{t.duracaoPadrao} · {t.membros.length} jogadores</Etiqueta></div>
          </div>
        ))
      )}
    </div>
  );
}

function SessaoTurma({ turma, alunos, setAlunos, aoFechar, aoRemover }) {
  const membros = turma.membros.map((id) => alunos.find((a) => a.id === id)).filter(Boolean);
  const [statusGeral, setStatusGeral] = useState("feita");
  const [motivoGeral, setMotivoGeral] = useState("");
  const [statusPorMembro, setStatusPorMembro] = useState({});
  const [salvo, setSalvo] = useState(false);
  const [chuvaAberta, setChuvaAberta] = useState(false);

  function statusDe(alunoId) { return statusPorMembro[alunoId] || statusGeral; }
  function definirIndividual(alunoId, st) {
    setStatusPorMembro((s) => ({ ...s, [alunoId]: s[alunoId] === st ? null : st }));
  }

  function salvarSessao() {
    const hoje = new Date().toISOString().slice(0, 10);
    setAlunos(alunos.map((a) => {
      if (!turma.membros.includes(a.id)) return a;
      const prox = aulaEmVigor(a);
      if (!prox) return a;
      const st = statusDe(a.id);
      const reg = { ...(a.regPlano || {}) };
      const d = { status: st, data: hoje };
      if (st === "falta" || st === "cancelada") d.motivo = motivoGeral;
      reg[prox.id] = d;
      return { ...a, regPlano: reg };
    }));
    setSalvo(true);
  }

  return (
    <div>
      <button onClick={aoFechar} className="mb-3" style={{ ...prosa, color: C.grafite, cursor: "pointer" }}>← Turmas</button>
      <h1 style={{ fontFamily: ARCH, fontSize: 22, fontWeight: 700, marginBottom: 4 }}>{turma.nome}</h1>
      <div className="mb-5"><Etiqueta>{turma.duracaoPadrao} · {membros.length} jogadores</Etiqueta></div>

      <div style={{ background: C.cal, border: "1px solid " + C.linha, padding: 15, marginBottom: 18 }}>
        <Campo rotulo="Status da sessão de hoje" nota="Aplica pra todo mundo — dá pra corrigir por jogador na lista abaixo.">
          <div className="flex gap-1 flex-wrap">
            {[["feita", "Realizada"], ["falta", "Falta coletiva"], ["cancelada", "Cancelada"]].map(([v, r]) => (
              <button key={v} onClick={() => setStatusGeral(v)}
                style={{ fontFamily: ARCH, fontSize: 11.5, fontWeight: 700, padding: "6px 10px", borderRadius: 2, cursor: "pointer",
                  border: "1px solid " + (statusGeral === v ? C.tinta : C.linha),
                  background: statusGeral === v ? C.tinta : C.papel, color: statusGeral === v ? C.papel : C.grafite }}>{r}</button>
            ))}
          </div>
        </Campo>
        {(statusGeral === "falta" || statusGeral === "cancelada") && (
          <Campo rotulo="Motivo">
            <input list="motivos-cancelamento-turma" style={entrada} value={motivoGeral}
              onChange={(e) => setMotivoGeral(e.target.value)} placeholder="ex: chuva" />
            <datalist id="motivos-cancelamento-turma">
              <option value="Chuva" /><option value="Quadra indisponível" /><option value="Feriado" />
            </datalist>
          </Campo>
        )}
      </div>

      {statusGeral === "cancelada" && /chuva/i.test(motivoGeral) && (
        <div className="mb-5">
          {chuvaAberta ? (
            <div>
              <TreinoChuva />
              <button onClick={() => setChuvaAberta(false)} className="mt-2" style={{ ...prosa, fontSize: 12, color: C.grafite, cursor: "pointer" }}>Ocultar sugestões</button>
            </div>
          ) : (
            <Botao pequeno variante="vazio" onClick={() => setChuvaAberta(true)}>🌧️ Ver sugestões de dia de chuva</Botao>
          )}
        </div>
      )}

      {membros.map((a) => {
        const prox = aulaEmVigor(a);
        const st = statusDe(a.id);
        return (
          <div key={a.id} style={{ background: C.papel, border: "1px solid " + C.linha, padding: "12px 15px", marginBottom: 9 }}>
            <div className="flex items-center justify-between gap-3 flex-wrap mb-2">
              <div style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700 }}>{a.nome || "Sem nome"}</div>
              <div className="flex gap-1">
                {[["feita", "Realizada"], ["falta", "Falta"], ["cancelada", "Cancelada"]].map(([v, r]) => (
                  <button key={v} onClick={() => definirIndividual(a.id, v)}
                    style={{ fontFamily: ARCH, fontSize: 10.5, fontWeight: 700, padding: "4px 8px", borderRadius: 2, cursor: "pointer",
                      border: "1px solid " + (st === v ? C.saibro : C.linha),
                      background: st === v ? C.saibro : C.papel, color: st === v ? "#fff" : C.grafite }}>{r}</button>
                ))}
              </div>
            </div>
            {!a.plano ? (
              <p style={{ ...prosa, fontSize: 12.5, color: C.grafite }}>Este jogador ainda não tem plano.</p>
            ) : !prox ? (
              <p style={{ ...prosa, fontSize: 12.5, color: C.grafite }}>Sem aula pendente — plano em dia ou concluído.</p>
            ) : (
              <p style={{ ...prosa, fontSize: 12.5, color: C.grafite }}>
                {prox.bloco} · semana {prox.semana} · <b style={{ color: C.tinta }}>{prox.t}</b>
              </p>
            )}
          </div>
        );
      })}

      <div className="flex gap-2 items-center mt-4">
        <Botao onClick={salvarSessao}>Salvar sessão</Botao>
        <Botao variante="vazio" onClick={aoRemover}>Remover turma</Botao>
        {salvo && <Etiqueta cor={C.quadra}>✓ sessão registrada em cada jogador</Etiqueta>}
      </div>
    </div>
  );
}

const NAV_MANUAL = [{ v: "catalogo", r: "Catálogo" }, { v: "tecnica", r: "Técnica" }, { v: "taticas", r: "Táticas" },

                        style={{ display: "block", fontFamily: ARCH, fontSize: 13, fontWeight: aba === t.v ? 700 : 500,
                          padding: "9px 14px", cursor: "pointer", whiteSpace: "nowrap", border: "none",
                          color: aba === t.v ? C.tinta : C.grafite, background: aba === t.v ? C.cal : "transparent" }}>
                        {t.r}
                      </button>
                    ))}
                  </div>
                </>
              )}
            </div>
          </nav>
        </div>
      </header>

      <main className="px-5 py-6" style={{ maxWidth: 760, margin: "0 auto" }}>
        {carregando ? <p style={{ ...prosa, color: C.grafite }}>Carregando…</p> :
         aba === "catalogo" ? <TelaCatalogo /> :
         aba === "taticas" ? <TelaTaticas /> :
         aba === "tecnica" ? <TelaTecnica /> :
         aba === "casos" ? <TelaCasos /> :
         aba === "conducao" ? <TelaConducao /> :
         aba === "publicos" ? <TelaPublicos /> :
         aba === "aulas" ? <TelaAulas /> :
         aba === "metodo" ? <TelaMetodo /> :
         aba === "equipe" ? <TelaEquipe /> :
         aba === "turmas" ? <TelaTurmas alunos={alunos} setAlunos={setAlunos} turmas={turmas} setTurmas={setTurmas} /> :
         aberto ? (
          <div>
            <button onClick={() => setAbertoId(null)} className="mb-3" style={{ ...prosa, color: C.grafite, cursor: "pointer" }}>← Todos os jogadores</button>
            <h1 style={{ fontFamily: ARCH, fontSize: 25, fontWeight: 700, lineHeight: 1.1 }}>{aberto.nome || "Sem nome"}</h1>
            <div className="mt-2 mb-5"><Etiqueta>{aberto.nivel} · Estágio {aberto.estagio} · {aberto.semanas} semanas · {aberto.historico.length} sessões</Etiqueta></div>
            <CardAulaEmVigor aluno={aberto} aoClicar={() => setSubaba("plano")} />
            <div className="flex gap-5 mb-6" style={{ borderBottom: "1px solid " + C.linha }}>
              {[{ v: "ficha", r: "Ficha" }, { v: "plano", r: "Plano" }, { v: "periodizacao", r: "Periodização" }, { v: "sessao", r: "Sessão" }, { v: "scout", r: "Scout" }, { v: "registro", r: "Caderno" }].map((t) => (
                <button key={t.v} onClick={() => setSubaba(t.v)}
                  style={{ fontFamily: ARCH, fontSize: 13, fontWeight: subaba === t.v ? 700 : 500, padding: "8px 0", cursor: "pointer", color: subaba === t.v ? C.tinta : C.grafite, borderBottom: "2px solid " + (subaba === t.v ? C.saibro : "transparent"), marginBottom: -1 }}>
                  {t.r}
                </button>
              ))}
            </div>
            {subaba === "ficha" ? <TelaFicha aluno={aberto} salvar={salvar} /> :
             subaba === "plano" ? <TelaPlano aluno={aberto} alunos={alunos} setAlunos={setAlunos} /> :
             subaba === "periodizacao" ? <TelaPeriodizacao aluno={aberto} /> :
             subaba === "scout" ? <TelaScout aluno={aberto} alunos={alunos} setAlunos={setAlunos} /> :
             subaba === "registro" ? <TelaRegistro aluno={aberto} alunos={alunos} setAlunos={setAlunos} /> :
             <TelaSessao aluno={aberto} alunos={alunos} setAlunos={setAlunos} />}
          </div>
        ) : (
          <div>
            <p style={{ ...prosa, color: C.grafite, marginBottom: 20 }}>
              Cada jogador guarda a ficha das quatro camadas, o calendário e o histórico de sessões.
              É desse conjunto que sai a periodização.
            </p>
            {alunos.map((a) => {
              const emVigor = a.plano ? aulaEmVigor(a) : null;
              const regEmVigor = emVigor ? (a.regPlano || {})[emVigor.id] || {} : null;
              const repetindo = regEmVigor && (regEmVigor.status === "falta" || regEmVigor.status === "cancelada");
              return (
                <button key={a.id} onClick={() => { setAbertoId(a.id); setSubaba("ficha"); }}
                  className="w-full text-left flex items-center justify-between gap-3"
                  style={{ background: C.cal, border: "1px solid " + C.linha, borderRadius: 2, padding: "13px 15px", marginBottom: 8 }}>
                  <div>
                    <div style={{ fontFamily: ARCH, fontSize: 15, fontWeight: 700 }}>{a.nome || "Sem nome"}</div>
                    <div className="mt-1"><Etiqueta>{a.nivel} · Estágio {a.estagio} · {a.inicio ? `início ${a.inicio}` : "sem calendário"}</Etiqueta></div>
                    {emVigor && (
                      <p style={{ ...prosa, fontSize: 12.5, color: C.saibro, marginTop: 4 }}>
                        {repetindo ? "Repetindo: " : "Em vigor: "}{emVigor.t}
                      </p>
                    )}
                  </div>
                  <span style={{ color: C.grafite, fontSize: 20 }}>→</span>
                </button>
              );
            })}
            <div className="mt-4"><Botao onClick={criar} variante="saibro">Novo jogador</Botao></div>
          </div>
        )}
      </main>
    </div>
  );
}

          linhas={TATICA_PLACAR.map((p) => [p.sit, p.fazer, p.erro])} />
        <Aviso cor={C.quadra}>
          O 40-0 é o ponto mais desperdiçado do tênis amador — o único momento em que o risco é
          barato, e justamente quando quase todo jogador joga seguro.
        </Aviso>
      </Secao>

      <Secao titulo="Tática de duplas" nota="A lacuna que mais aparece no jogo de sábado do adulto recreativo. Seis regras resolvem a maior parte dos erros.">

function novoCaso() {
  return {
    id: "caso" + Date.now(), data: new Date().toISOString().slice(0, 10), autor: "",
    aluno: "", observei: "", concluí: "", fiz: "", porque: "", depois: "", refazer: "",
  };
}

function TelaCasos() {
  const [casos, setCasos] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [editando, setEditando] = useState(null);
  const [busca, setBusca] = useState("");

  useEffect(() => { leia("mty:casos:v1", [], true).then((c) => { setCasos(c); setCarregando(false); }); }, []);
  useEffect(() => { if (!carregando) grave("mty:casos:v1", casos, true); }, [casos, carregando]);

  function salvarCaso(c) {
    setCasos((lista) => lista.some((x) => x.id === c.id) ? lista.map((x) => (x.id === c.id ? c : x)) : [c, ...lista]);
    setEditando(null);
  }
  function remover(id) { setCasos((lista) => lista.filter((x) => x.id !== id)); }

  const filtrados = casos.filter((c) => (c.aluno + " " + c.observei + " " + c.concluí).toLowerCase().includes(busca.toLowerCase()));

  if (editando) {
    const c = editando;
    const set = (k, v) => setEditando({ ...c, [k]: v });
    return (
      <div>
        <button onClick={() => setEditando(null)} className="mb-3" style={{ ...prosa, color: C.grafite, cursor: "pointer" }}>← Todos os casos</button>
        <Secao titulo="Ficha de caso" nota="Este banco é compartilhado com toda a equipe — o que você escrever aqui, os outros treinadores veem.">
          <Campo rotulo="Autor"><input style={entrada} value={c.autor} onChange={(e) => set("autor", e.target.value)} placeholder="Seu nome" /></Campo>
          <div className="grid grid-cols-2 gap-3">
            <Campo rotulo="Data"><input type="date" style={entrada} value={c.data} onChange={(e) => set("data", e.target.value)} /></Campo>
            <Campo rotulo="Aluno"><input style={entrada} value={c.aluno} onChange={(e) => set("aluno", e.target.value)} placeholder="Idade, tempo de tênis, nível" /></Campo>
          </div>
          <Campo rotulo="O que eu observei" nota="Só descrição — sem causa, sem juízo. Nada de 'nervoso' ou 'desmotivado'.">
            <textarea rows={3} style={{ ...entrada, resize: "vertical" }} value={c.observei} onChange={(e) => set("observei", e.target.value)} />
          </Campo>
          <Campo rotulo="O que eu concluí" nota="Aqui sim entra a sua leitura.">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.concluí} onChange={(e) => set("concluí", e.target.value)} />
          </Campo>
          <Campo rotulo="O que eu fiz">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.fiz} onChange={(e) => set("fiz", e.target.value)} />
          </Campo>
          <Campo rotulo="Por que assim, e não de outro jeito">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.porque} onChange={(e) => set("porque", e.target.value)} />
          </Campo>
          <Campo rotulo="O que aconteceu depois">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.depois} onChange={(e) => set("depois", e.target.value)} />
          </Campo>
          <Campo rotulo="Se eu pudesse refazer" nota="Opcional.">
            <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={c.refazer} onChange={(e) => set("refazer", e.target.value)} />
          </Campo>
        </Secao>
        <div className="flex gap-2">
          <Botao onClick={() => salvarCaso(c)} variante="saibro">Salvar caso</Botao>
          {casos.some((x) => x.id === c.id) && <Botao variante="vazio" onClick={() => { remover(c.id); setEditando(null); }}>Remover</Botao>}
        </div>
      </div>
    );
  }

  return (
    <div>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 16 }}>
        Banco de casos da equipe — compartilhado entre todos os treinadores que abrem este
        aplicativo. Casos que deram errado valem tanto quanto os que deram certo.
      </p>
      <input style={{ ...entrada, marginBottom: 14 }} value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar por aluno ou palavra-chave" />
      {carregando ? <p style={{ ...prosa, color: C.grafite }}>Carregando…</p> : filtrados.length === 0 ? (
        <p style={{ ...prosa, color: C.grafite }}>Nenhum caso ainda. O primeiro pode ser seu.</p>
      ) : filtrados.map((c) => (
        <button key={c.id} onClick={() => setEditando(c)} className="w-full text-left"
          style={{ background: C.cal, border: "1px solid " + C.linha, borderRadius: 2, padding: "11px 14px", marginBottom: 8, display: "block" }}>
          <div className="flex items-center justify-between">
            <span style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700 }}>{c.aluno || "Sem identificação"}</span>
            <Etiqueta>{c.data}{c.autor ? " · " + c.autor : ""}</Etiqueta>
          </div>
          <p style={{ ...prosa, fontSize: 13, color: C.grafite, marginTop: 4 }}>{(c.observei || "").slice(0, 140)}{(c.observei || "").length > 140 ? "…" : ""}</p>
        </button>
      ))}
      <div className="mt-4"><Botao onClick={() => setEditando(novoCaso())} variante="saibro">Novo caso</Botao></div>
    </div>
  );
}

function BlocoReferencia({ b }) {
  if (b.tipo === "tabela") {
    return (
      <div className="mb-4">
        {b.titulo && <h4 style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>{b.titulo}</h4>}
        <Tabela cabecalho={b.cabecalho} linhas={b.linhas} />
      </div>
    );
  }
  if (b.tipo === "lista") {
    return (
      <div className="mb-4">
        {b.titulo && <h4 style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>{b.titulo}</h4>}
        {b.itens.map((it, i) => (
          <div key={i} className="flex gap-3 mb-2">
            <span style={{ fontFamily: ARCH, fontSize: 11, fontWeight: 700, color: C.saibro, flexShrink: 0 }}>{i + 1}</span>
            <p style={{ ...prosa, fontSize: 13 }}>{it}</p>
          </div>
        ))}
      </div>
    );
  }
  if (b.tipo === "aviso") return <Aviso>{b.texto}</Aviso>;
  // texto simples
  return (
    <div className="mb-4">
      {b.titulo && <h4 style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700, marginBottom: 4 }}>{b.titulo}</h4>}
      <p style={{ ...prosa, fontSize: 13, color: C.grafite }}>{b.texto}</p>
    </div>
  );
}

function TelaConducao() {
  const [praticaAberta, setPraticaAberta] = useState(false);
  return (
    <div>
      <p style={{ ...prosa, marginBottom: 18 }}>
        Parte 3 do manual · série C. Comunicação boa sobre diagnóstico errado só convence o aluno de
        algo falso com mais eficiência — esta série serve ao que as outras produzem, nunca no lugar
        delas.
      </p>

      {SERIE_CONDUCAO.map((c) => (
        <Secao key={c.id} titulo={c.id + " · " + c.titulo}>
          <p style={{ ...prosa, fontSize: 14, marginBottom: 14, fontStyle: "italic" }}>{c.frase}</p>
          {c.blocos.map((b, i) => <BlocoReferencia key={i} b={b} />)}
        </Secao>
      ))}

      <div style={{ background: C.cal, border: "1px solid " + C.linha, padding: "12px 15px" }}>
        <button onClick={() => setPraticaAberta(!praticaAberta)} className="w-full flex items-center justify-between gap-3" style={{ cursor: "pointer" }}>
          <span style={{ fontFamily: ARCH, fontSize: 13.5, fontWeight: 700 }}>Prática da série C</span>
          <Etiqueta>{praticaAberta ? "fechar" : "abrir"}</Etiqueta>
        </button>
        {praticaAberta && (
          <div className="mt-3">
            <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginBottom: 10 }}>
              As fichas desta série não se aprendem lendo — só na prática supervisionada.
            </p>
            {PRATICA_CONDUCAO.map((p) => (
              <div key={p.t} className="mb-3" style={{ background: C.papel, border: "1px solid " + C.linha, padding: "10px 13px" }}>

                <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 3 }}>{p.como}</p>

}

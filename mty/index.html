:"TR","e":["A","C"],"m":"Games normais, com os dois jogadores sabendo o perfil um do outro. Cada um precisa nomear, no fim do game, uma jogada que usou por causa do perfil do outro.","g":"2 a 4 games","r":"O professor nomeia os perfis antes.","p":"Os jogadores identificam sozinhos o perfil do outro, sem saber de antemão.","x":"A leitura, não o resultado.","i":"O placar. É a leitura que se está treinando.","v":0,"o":"Reconhecer o perfil do adversário e jogar contra ele."}];

/* Exercícios que o treinador cadastra na própria academia, com os
   mesmos campos do catálogo do manual — persistidos por org (ver
   TelaBiblioteca) e usados em TODO lugar que hoje só olha EXERCICIOS:
   geração de plano e sessão, índice que a IA recebe, validação de
   plano colado e a busca do catálogo. EXERCICIOS_CUSTOM é um espelho
   mutável do estado React (App carrega/salva via storage); as funções
   abaixo sempre leem TODOS_EXERCICIOS() em vez da constante crua, então
   um exercício novo aparece imediatamente sem precisar recarregar a
   página. */
let EXERCICIOS_CUSTOM = [];

      { t: "Diagnóstico (semanas 5–9) · Marco 1", teoria: "O Marco 1 exige uma avaliação inicial completa (D-02) apresentada ao grupo em 10 minutos, indo a causas e não a sintomas — a mesma disciplina das bases de apoio (D-03) e da leitura tática (D-05). A tarefa muda por experiência: o menos experiente aplica o protocolo como está; o mais experiente traz um caso em que o protocolo não coube, e por quê — essa divergência é o dado que revisa o próprio método.", referenciaManual: { aba: "metodo", id: "D-03", rotulo: "Diagnóstico avançado · D-03" }, saida: "Apresenta ao grupo, em 10 minutos, uma avaliação inicial completa (D-02) de um aluno da casa, chegando a causas e não a sintomas." },
      { t: "O golpe (semanas 10–15) · Marco 2", teoria: "No Marco 2, a análise de vídeo em grupo pede a causa-raiz uma fase antes do sintoma — todo golpe tem seis fases (preparação, armada, contato, terminação e as duas transições entre elas), e o sintoma quase sempre aparece numa fase enquanto a causa mora na fase anterior, muitas vezes nas próprias bases de apoio.", referenciaManual: { aba: "tecnica", id: "T-01", rotulo: "Técnica · T-01" }, saida: "Na análise de um vídeo em grupo, aponta por escrito a causa-raiz de um erro uma fase antes do sintoma." },
      { t: "Pés e ponto (semanas 16–21) · Marco 3", teoria: "O Marco 3 pede 30 minutos de sessão com foco tático, observada pelo par — é aqui que entra o rodízio de condução: a partir deste módulo, cada encontro é conduzido por um treinador diferente, não pelo formador, e a parte específica real acontece dentro do próprio grupo de formação, não isolada.", referenciaManual: { id: "referencia-formacao-staff", rotulo: "estrutura completa do programa ↑" }, saida: "Conduz 30 minutos de sessão com foco tático, observado pelo par, com parte específica real dentro do grupo." },
      { t: "Planejamento (semanas 22–27) · Marco 4", teoria: "Defender um planejamento de mesociclo completo, coerente com o diagnóstico, e nunca ancorado em resultado de torneio — resultado de torneio nunca é medida de progresso, seja na ficha de um aluno ou na avaliação de um treinador em formação.", referenciaManual: { aba: "metodo", id: "D-08", rotulo: "Diagnóstico avançado · D-08" }, saida: "Defende diante do grupo um planejamento completo de mesociclo para um aluno real, coerente com o diagnóstico e sem ancorar em resultado de torneio." },
      { t: "Comunicação (semanas 28–32) · Marco 5", teoria: "A conversa de reavaliação segue a estrutura C-07: o aluno fala primeiro, e nunca se promete prazo de evolução — a mesma regra que vale em qualquer conversa de reavaliação com atleta ou família, dentro ou fora do programa de formação.", referenciaManual: { aba: "conducao", id: "C-07", rotulo: "Condução · C-07" }, saida: "Conduz uma conversa de reavaliação real com um aluno seguindo a estrutura C-07, com o aluno falando primeiro e sem prometer prazo." },
      { t: "Competição e fechamento (semanas 33–36) · Marco final", teoria: "O caso final apresenta o aluno acompanhado no programa inteiro, incluindo o que o treinador faria diferente se recomeçasse. A certificação Assistente MTY (módulos 1–3 + Marcos 1 e 2) habilita conduzir iniciação (Y1–Y2) sob supervisão; Treinador MTY (programa completo + 5 marcos + caso final) habilita conduzir até Y4; Treinador MTY Sênior (mais 2 anos de aplicação e orientação de um par) habilita competição (Y5–Y6) e formar novos treinadores. A revalidação é anual, com observação de um par — sem ela, a franquia do método degrada em duas temporadas.", referenciaManual: { id: "referencia-formacao-staff", rotulo: "estrutura completa do programa ↑" }, saida: "Apresenta o caso completo de um aluno acompanhado no programa inteiro, incluindo o que faria diferente se recomeçasse." },

  {
    id: "escada-niveis", nome: "A Escada Y1–Y6", modulos: [
      { t: "A infância: Y1 a Y3", teoria: "Y1 (Descoberta) exige jogar o jogo: sacar por cima da rede, disputar o ponto do início ao fim, deslocar-se e parar equilibrado antes de golpear — sem exigir direção, profundidade ou efeito. Y2 (Troca) exige sustentar a troca cruzada e começar o ponto com intenção — atenção: sem atacar a bola que sobra, mesmo errando, o aluno não está pronto pro Y3, mesmo cumprindo os outros critérios. Y3 (Direção) é o momento em que o aluno já joga tênis de verdade: escolhe direção com intenção, sobe à rede e finaliza à frente, defende com bola alta e com bola acelerada — daqui em diante o trabalho é de repertório e decisão, não de fundamentos.", referenciaManual: { aba: "taticas", id: "legenda-niveis", rotulo: "Táticas · Critérios de nível Y1–Y6" }, saida: "Explica, com suas próprias palavras, a diferença entre um aluno Y1 e um Y3 para um responsável leigo, sem usar jargão técnico." },
      { t: "A entrada na competição: Y4", teoria: "Y4 (Construção) exige construir o ponto em duas bolas, com papéis definidos: uma bola que arma (alvo de segurança) e uma que converte (alvo de pressão), sem inverter os dois. O critério mais confundido é \"sustenta o ponto sem antecipar o risco\" — é a fronteira entre agressividade e pressa: quem ataca sempre e erra cedo não o cumpriu, porque esperar também é parte da construção.", referenciaManual: { aba: "taticas", id: "legenda-niveis", rotulo: "Táticas · Critérios de nível Y1–Y6" }, saida: "Aponta, na ficha de um aluno real, se ele já cumpre \"sustenta o ponto sem antecipar o risco\" — o critério mais confundido do Y4." },
      { t: "Decidir sob pressão: Y5", teoria: "Y5 (Decisão) exige dois ou três padrões próprios automatizados, acessados sem deliberar, além do domínio da matriz dos três caminhos da devolução após o saque e da manutenção da intenção do segundo saque sob placar adverso. O que distingue do Y4: lá o aluno executa o padrão quando o exercício pede; aqui ele acessa o padrão sozinho, dentro do jogo, sob pressão real de placar.", referenciaManual: { aba: "taticas", id: "legenda-niveis", rotulo: "Táticas · Critérios de nível Y1–Y6" }, saida: "Descreve um padrão próprio automatizado que viu um aluno acessar sozinho, sem ser mandado, dentro de um jogo de verdade." },
      { t: "Competição plena: Y6", teoria: "Y6 (Competição) exige repertório completo: a matriz completa dos 18 cenários do saque, os seis sistemas de ataque, e sustentar o plano de jogo numa partida disputada de verdade. O critério que só pode ser observado em competição real — nunca em treino — é reconstruir o plano de jogo dentro da própria partida quando ele não está funcionando; nenhum exercício de quadra reproduz essa pressão.", referenciaManual: { aba: "taticas", id: "legenda-niveis", rotulo: "Táticas · Critérios de nível Y1–Y6" }, saida: "Relata, de uma competição real de um aluno, um momento em que ele reconstruiu o plano de jogo dentro da própria partida." },
    ],
    quiz: [
      { p: "Qual critério pertence ao Y2 (Troca), não ao Y1 (Descoberta)?",
        opcoes: ["Reconhece e nomeia bola alta e bola baixa", "Ataca a bola que sobra, mesmo errando", "Saca por cima da rede e coloca a bola em jogo com regularidade", "Desloca-se e para equilibrado antes de golpear"], certa: 1 },
      { p: "O que distingue o Y5 do Y4, segundo a nota do próprio nível?",
        opcoes: ["Y5 é só sobre condicionamento físico", "No Y4 o aluno executa o padrão quando o exercício pede; no Y5 ele acessa sozinho, dentro do jogo, sob pressão", "Y4 já compete e Y5 ainda não", "Não há diferença real entre os dois"], certa: 1 },
      { p: "Qual critério do Y6 só pode ser observado em competição real, nunca em treino?",
        opcoes: ["Domina a matriz completa dos 18 cenários do saque", "Executa os seis sistemas de ataque", "Reconstrói o plano dentro da partida quando ele não funciona", "Tem as três variações de saque com armado indistinguível"], certa: 2 },

  {
    id: "leitura-ficha", nome: "Leitura da Ficha: Observar Antes de Escrever", modulos: [
      { t: "Ver antes de rotular", teoria: "O campo de comportamento (adulto) ou contexto (juvenil) da ficha exige observações concretas de humor ou comunicação, de aulas diferentes — nunca uma palavra de estado como \"desmotivado\" ou \"inseguro\". É a mesma disciplina da avaliação mental (D-06): o treinador registra o que viu, não o que inferiu sobre o interior do aluno.", referenciaManual: { aba: "metodo", id: "D-06", rotulo: "Diagnóstico avançado · D-06" }, saida: "Preenche o campo de comportamento (adulto) ou contexto (juvenil) de um aluno real citando três observações concretas de humor ou comunicação, de aulas diferentes, sem usar nenhuma palavra de estado como \"desmotivado\" ou \"inseguro\"." },
      { t: "Disposição não é objetivo", teoria: "Disposição e Objetivo são dois campos diferentes na ficha do adulto e não podem repetir a mesma informação: a Disposição é quem o aluno é na quadra — rotina/saúde/convívio, ou competitivo por natureza, por exemplo — e o Objetivo é o que ele joga e busca. Confundir os dois campos empobrece o diagnóstico e o plano que vem depois.", referenciaManual: { aba: "metodo", id: "principio-1", rotulo: "Como decide · princípio 1" }, saida: "Para um aluno adulto real, escreve a Disposição e o Objetivo dele em duas frases separadas, sem repetir a mesma informação nas duas — uma é quem ele é na quadra, a outra é o que ele joga." },
      { t: "Quando marcar dificuldade de consistência", teoria: "Dificuldade de consistência (não sustenta a troca) e erro tático (sustenta a troca, mas escolhe mal) exigem planos opostos: a primeira pede pelo menos um exercício semanal de bate-bola cruzado com o treinador, sem exigir variação — mesmo contrariando o princípio geral de variedade do método — porque sem base não há decisão nenhuma pra treinar.", referenciaManual: { aba: "metodo", id: "D-05", rotulo: "Diagnóstico avançado · D-05" }, saida: "Observa duas aulas de um aluno que erra muito e decide, por escrito, se é dificuldade de consistência (não sustenta a troca) ou erro tático (sustenta, mas escolhe mal) — os dois pedem planos diferentes." },
      { t: "Tempo treinando muda a leitura", teoria: "Dois alunos no mesmo nível técnico podem pedir planos diferentes se o tempo de quadra for diferente: um adulto motivado com poucos meses de treino ainda está construindo repertório básico, enquanto um adulto no mesmo nível técnico mas com anos de treino já esgotou a curva natural de aprendizado e precisa de outro tipo de estímulo — o mesmo diagnóstico técnico não garante o mesmo plano.", referenciaManual: { aba: "metodo", id: "principio-1", rotulo: "Como decide · princípio 1" }, saida: "Compara, por escrito, a ficha de um adulto motivado com poucos meses de quadra e a de um adulto no mesmo nível técnico com anos de treino — e explica por que o plano de cada um não pode ser igual mesmo com o mesmo diagnóstico técnico." },
    ],

  {
    id: "taticas-vocabulario-padroes", nome: "Táticas: Vocabulário, Escada e Padrões", modulos: [
      { t: "O vocabulário tático",
        teoria: "Oito termos que o professor precisa usar sempre do mesmo jeito (o aluno não precisa decorá-los): bola neutra (chega equilibrada, sem obrigar nada do adversário — jogar fundo e ao centro; erro comum: tratá-la como bola de ataque); bola de ataque (curta ou lenta, contato entre a cintura e o peito — entrar e acelerar; erro: atacar de trás da linha de base); bola de defesa (funda, rápida, ou você desequilibrado — responder alta e funda, ou acelerada cruzada; erro: tentar ganhar o ponto da defesa); bola que arma (alvo de segurança, ~2m dentro das linhas) e bola que converte (alvo de pressão, mais perto das linhas — erro: inverter os dois); margem (a bola funda nasce de altura sobre a rede, não de velocidade); reduzir o tempo (o objetivo central — pegar a bola mais cedo, jogar mais fundo, ganhar terreno; não é bater mais forte); e o padrão (sequência de 2 a 4 bolas com intenções decididas antes, nunca improvisada).",
        referenciaManual: { aba: "taticas", id: "vocabulario", rotulo: "Táticas · O vocabulário" },
        saida: "Escolha um aluno real e, pra três desses termos (por exemplo bola neutra, bola de ataque, bola de defesa), escreva um exemplo de bola que ele jogou recentemente encaixando em cada um." },
      { t: "Os três objetivos, na ordem certa",

        referenciaManual: { aba: "taticas", id: "objetivos-jogo", rotulo: "Táticas · Os três objetivos do jogo" },
        saida: "Explique com um caso real por que \"ganhar a quadra\" vem antes de \"produzir ângulo\", e este antes de \"diminuir o tempo\" — o que dá errado quando se inverte a ordem?" },
      { t: "O básico antes do específico",

        referenciaManual: { aba: "taticas", id: "basico-tatico", rotulo: "Táticas · O básico, para todo tenista" },

      { t: "A escada tática, degrau a degrau",
        teoria: "A escada tática segue os mesmos níveis Y1–Y6, sem pular degrau: Y1 não tem conteúdo tático formal; Y2 entra só direção e bola no corpo (padrão P15); Y3 traz a bola profunda ao centro e a devolução em jogo (P5, P8, P9, P11); Y4 é o divisor de águas entre bater bola e jogar tênis — a bola que arma e a que converte (P1, P2, P6, P10, P13, P14); Y5 traz padrões completos e leitura do adversário (P3, P4, P7, P12, P16); Y6 é plano de jogo, placar e plano B, com todos os padrões.",
        referenciaManual: { aba: "taticas", id: "escada-tatica", rotulo: "Táticas · A escada tática por nível" },
        saida: "Para um aluno seu classificado em Y3, Y4 ou Y5, diga que padrões táticos (da lista de 16) ele já deveria estar treinando segundo a escada — e diga se isso bate com o que você vem trabalhando com ele." },
      { t: "Escolher o padrão certo",

      { t: "Placar, duplas e o trilho",

  {
    id: "tecnica-series-tmp", nome: "Técnica: Golpes, Movimentação e Ponto", modulos: [
      { t: "As seis fases (T-01)",
        teoria: "Todo golpe tem seis fases: preparação, posicionamento e apoio, aceleração, contato, terminação, recuperação. O mapa sintoma→causa aponta a fase real do erro: terminação ruim geralmente vem de base atrasada (fase 2, não fase 5); contato fora do ponto vem de preparação tardia (fase 1); aceleração sem potência vem de joelhos que não flexionaram no apoio (fase 2). O princípio que atravessa tudo: força dá lugar à velocidade da bola no ar e à qualidade da trajetória — o critério é reduzir o tempo do adversário, não a potência.",

        saida: "Escolha um erro técnico recente de um aluno e, usando o mapa sintoma→causa do manual, diga em qual das seis fases (preparação, apoio, aceleração, contato, terminação, recuperação) está a causa provável — não o sintoma." },
      { t: "Golpes de fundo (T-02 a T-04)",
        teoria: "No forehand, os erros mais comuns vêm de contato atrás do corpo ou de joelhos sem flexão funcional — e a correção NUNCA é \"bata mais forte\" nem pedir mais efeito pra bola cair dentro (isso descaracteriza a jogada). O backhand de duas mãos tira estabilidade da estrutura dos dois braços, não da força, com contato mais à frente que no forehand. O de uma mão exige preparação antecipada como condição, não virtude — o ombro dominante aponta a bola cedo, e o slice é opção legítima em bola alta, não fuga.",
        referenciaManual: { aba: "tecnica", id: "T-02", rotulo: "Técnica · T-02" },
        saida: "Escolha um aluno com erro recorrente de forehand ou backhand e descreva a correção que você daria — evitando pedir \"mais força\" ou \"mais efeito\"." },
      { t: "Saque (T-05 e T-06)",
        teoria: "O saque tem base comum às três variações: continental obrigatória, flexão sincronizada numa faixa de ~55° a 75° nos joelhos (o valor de 90° que ainda circula é excessivo, mas abaixo de ~55° há perda medida de velocidade), tríplice extensão, e a decisão do tipo de saque vem ANTES da rotina, nunca durante. O que nunca pode mudar entre plano, slice e kick é o ritmo do armado, a posição dos pés e a trajetória do braço até a posição de troféu — só o lançamento e o contato mudam. Se o adversário lê a variação pelo armado, o saque perdeu a vantagem.",
        referenciaManual: { aba: "tecnica", id: "T-05", rotulo: "Técnica · T-05" },

      { t: "Rede e transições (T-08 a T-10, M-01 a M-04)",

        referenciaManual: { aba: "tecnica", id: "T-08", rotulo: "Técnica · T-08" },

  {
    id: "aulas-estrutura-trilhas", nome: "Aulas: Estrutura, Protocolos e Trilhas", modulos: [
      { t: "Os cinco blocos e os oito protocolos", teoria: "Toda aula tem cinco blocos: 1 abertura com bola (nunca fila parada), 2 início do ponto (saque+devolução, obrigatório), 3 parte geral programada (tema da semana, nunca improvisado), 4 técnica específica (a demanda individual, nunca pulada em aula de grupo), 5 jogo aplicado + fechamento. E oito protocolos valem em toda aula, de toda trilha: bola desde o primeiro minuto; instrução em solução; uma correção por vez; pergunta antes da resposta; nunca corrigir decisão e técnica juntas; nunca descaracterizar a jogada; elogiar a tentativa correta que errou; fechar com uma frase.", referenciaManual: { aba: "aulas", id: "estrutura-blocos", rotulo: "Aulas · A estrutura de toda aula" }, saida: "Na sua próxima aula, registre quantos dos oito protocolos de quadra (P1 a P8) você conseguiu manter conscientemente — e qual foi o mais difícil de sustentar." },
      { t: "O eixo da redução de tempo", teoria: "Reduzir o tempo do adversário é o eixo que atravessa todas as trilhas, ensinado desde a primeira aula — não é bater forte, é chegar antes, jogar mais cedo, ocupar espaço à frente. O tenista joga em torno de 70% da força; \"bate mais forte\" produz tensão, e tensão reduz velocidade de braço. A tradução muda por nível: pra criança pequena é \"não deixa ele ficar pronto\"; pro competitivo é \"cada décimo roubado reduz a qualidade da resposta do adversário\".", referenciaManual: { aba: "aulas", id: "reducao-tempo", rotulo: "Aulas · O eixo que atravessa todas as trilhas" }, saida: "Escolha um aluno de qualquer nível e traduza \"reduzir o tempo do adversário\" pra linguagem que ele entenderia, seguindo os exemplos do manual por faixa de nível." },
      { t: "O trabalho lúdico", teoria: "Toda aula de criança tem uma brincadeira com código no catálogo e propósito declarado — não é adorno. O mesmo split step feito isolado produz ~30 saltos com atenção caindo; dentro de um pega-pega produz ~200 saltos com atenção crescendo. Cinco regras: propósito declarado; a regra faz o trabalho da instrução; ninguém fica de fora por muito tempo; cada brincadeira diz o que se ignora; a vitória não vira medida do aluno. O que NÃO muda por ser lúdico: os cinco blocos, o mínimo de 25% em início de ponto, e a verificação silenciosa dos critérios de nível.", referenciaManual: { aba: "aulas", id: "ludico", rotulo: "Aulas · O trabalho lúdico" }, saida: "Para uma brincadeira que você usa (ou pretende usar) com crianças, diga qual é o propósito declarado dela — o que ela treina de verdade — e o que a regra da brincadeira faz sem precisar de instrução." },
      { t: "As trilhas por nível", teoria: "Cada trilha (A/B/C infantis, D/E/F adultos, G competição) segue um ciclo de 12 semanas em três mesociclos: M1 Instalação (1–4, instala os padrões do nível), M2 Ampliação (5–8, amplia repertório e variação), M3 Consolidação (9–12, consolida sob pressão de jogo e verifica critérios). Os adultos (D grupo, E dupla, F individual) compartilham o mesmo currículo de 24 aulas — muda a condução, não o conteúdo. A trilha de competição segue um semestre de 24 semanas com bases, afinações e competições intercaladas.", referenciaManual: { aba: "aulas", id: "estrutura-blocos", rotulo: "Aulas · A estrutura de toda aula" }, saida: "Escolha um aluno numa das trilhas (A, B, C, adultos D/E/F, ou G de competição) e diga em qual mesociclo (M1, M2 ou M3) ele está, e o que deveria estar sendo trabalhado agora." },
      { t: "A autoverificação do professor", teoria: "Ao fim de cada aula, quatro perguntas: todo aluno teve o bloco de técnica específica, ou sumiu no grupo? Minhas instruções foram soluções ou proibições? Corrigi uma coisa por vez, ou empilhei correções? Em algum momento pedi mais efeito pra uma bola de ataque cair dentro? Essa última é chamada, no manual, de a pergunta mais importante — se a resposta for sim, a jogada foi descaracterizada, e o custo aparece meses depois, quando o aluno já não ataca mais.", referenciaManual: { aba: "aulas", id: "autoverificacao", rotulo: "Aulas · Autoverificação do professor" }, saida: "Ao fim de uma aula real, responda as quatro perguntas de autoverificação do manual — principalmente a quarta: você pediu mais efeito pra alguma bola de ataque cair dentro?" },

      { t: "Adulto competitivo social", teoria: "É o único público em que a tática pesa mais que a técnica: 40% tática, 30% início do ponto, 20% técnica, 10% físico — porque reconstruir técnica é projeto de dois anos que ele não vai sustentar, mas reorganizar decisão cabe no tempo que ele tem. Ciclo de 8 semanas (não 12), ancorado no calendário do clube, com só um estímulo técnico por ciclo.", referenciaManual: { aba: "publicos", id: "competitivo-social", rotulo: "Públicos · Adulto competitivo social" }, saida: "Para um aluno adulto que compete (torneio interno, liga, ranking de clube), diga se a proporção de tática/técnica que você tem usado com ele bate com os 40%/30%/20%/10% do manual (tática/início do ponto/técnica/físico)." },

      { t: "Adulto acima de 50 e o aluno intermitente", teoria: "O adulto acima de 50 não é um público frágil — tem um corpo e uma expectativa diferentes, que se resolvem com ajuste de condução: bola mais lenta, blocos mais curtos com mais pausas (mantendo o volume total), nunca exigir corrida pra trás nas primeiras semanas. A regra é reduzir a carga por bloco, nunca a exigência da execução. Já o aluno intermitente segue uma regra de retomada por tempo de ausência: até 2 aulas, retoma onde a turma está; de 3 a 5, na aula anterior à que perdeu; mais de 5, no início do mesociclo, com reavaliação física.", referenciaManual: { aba: "publicos", id: "acima-50", rotulo: "Públicos · O adulto acima dos cinquenta" }, saida: "Descreva um aluno mais velho ou um aluno intermitente seu, e diga qual ajuste do manual (carga, retomada) você já aplica e qual ainda não." },

  {

/* ── trilha de classificação ──
   Mesmo com o plano personalizado, todo jogador está sempre em algum
   ponto de um caminho, com critério claro do que falta pro próximo.

   Infantil: segue o Play and Stay da ETF — bola vermelha, laranja e
   verde já são os próprios estágios (V/L/G), então a "categoria" ali é
   o próprio estágio e os critérios são os de Y1/Y2/Y3 (NIVEIS_CRITERIOS).

   Adulto e Competição: o estágio (A/C) não muda — quem avança é a
   categoria dentro dele, do jeito que foi descrito pelo método: o
   iniciante fica na categoria até executar todos os fundamentos
   básicos (técnica + mobilidade de quadra são os dois pilares que o
   seguram ali); o intermediário já disputa partida de verdade e tem
   um ou dois fundamentos muito bons, mas rede e pernas ainda atrasam;
   o avançado tem tudo bem executado e compete — daí em diante quem
   decide a evolução é o refinamento técnico, não mais um pré-requisito
   que falta. Competição segue a mesma lógica, para o juvenil/social de
   competição, com a entrada/meio/topo descritos pelo coordenador. */
/* Funde os critérios adaptados (Adulto/Competição) com os critérios
   "oficiais" da escada Y1–Y6 (NIVEIS_CRITERIOS) — sem isso, a trilha do
   adulto e da competição vivia só do texto adaptado, e a versão que o
   manual chama de "referência" nunca virava checklist de verdade pra
   quem não é criança. Anexa (nunca insere no meio, pra não bagunçar o
   índice de quem já tem criteriosClassificacao marcado) os critérios do
   nível na ÚLTIMA categoria de cada sequência que aponta pro mesmo
   nivelSugerido — é só ao SAIR daquela categoria que o jogador realmente
   alcança aquele degrau da escada oficial; as categorias anteriores da
   mesma sequência (ex.: Iniciante 1 e 2, ambas Y1) ficam só com o texto
   adaptado, mais fino, do próprio degrau intermediário. */
function mesclarComEscadaDoNivel(lista) {
  return lista.map((cat, i) => {
    const proxima = lista[i + 1];
    if (proxima && proxima.nivelSugerido === cat.nivelSugerido) return cat;
    const nivel = NIVEIS_CRITERIOS.find((n) => n.nivel === cat.nivelSugerido);
    if (!nivel) return cat;
    return {
      ...cat,
      criterios: [...cat.criterios, ...nivel.criterios],
      notaEscada: nivel.nota,
    };
  });
}

/* Categorias por estágio — V/L/G usam o próprio estágio como categoria
   (não têm subdivisão: um "L" só é reclassificado virando "G"). */
function categoriasDoEstagio(estagio) {
  const idx = ["V", "L", "G"].indexOf(estagio);
  if (idx >= 0) {
    const info = NIVEIS_CRITERIOS[idx];
    return [{
      id: estagio, nome: ESTAGIOS[idx].n + " · Play and Stay (" + info.nivel + ")",
      nivelSugerido: info.nivel, foco: info.capacidade, criterios: info.criterios,
      proximoEstagio: ["L", "G", null][idx],
    }];
  }
  if (estagio === "A") return CATEGORIAS_ADULTO;
  if (estagio === "C") return CATEGORIAS_COMPETICAO;
  return [];
}

/* Onde o jogador está na trilha agora, e o que falta marcar pra avançar
   — mesmo cálculo que TrilhaClassificacao usa pra desenhar o checklist,
   só que como dado puro. É isso que faz a classificação virar limitador
   de verdade pro planejamento: relatorioFicha usa isto pra dizer à IA
   quais critérios ainda faltam, em vez de só informar nível e estágio
   como um rótulo solto. */
function statusTrilha(f) {
  const lista = categoriasDoEstagio(f.estagio);
  if (lista.length === 0) return null;
  const semSubdivisao = lista.length === 1 && lista[0].id === f.estagio;
  const atual = semSubdivisao ? lista[0] : (lista.find((c) => c.id === f.categoria) || lista[0]);
  const marcados = f.criteriosClassificacao || {};
  const pendentes = atual.criterios.filter((_, i) => !marcados[atual.id + ":" + i]);
  return { atual, pendentes, feitos: atual.criterios.length - pendentes.length, total: atual.criterios.length, completo: pendentes.length === 0 };
}

/* Fase ampla do jogador — é o que o treinador precisa saber de cara,
   antes de qualquer diagnóstico: é criança, adulto ou juvenil/adulto
   de competição. Decide o catálogo de exercícios da ficha inteira. */
function faseDoEstagio(estagio) {
  if (["V", "L", "G"].includes(estagio)) return "Criança · Play and Stay";
  if (estagio === "C") return "Juvenil ou adulto de competição";
  return "Adulto";
}

/* O caminho da infância é sempre V → L → G, mesmo que o jogador atual
   esteja só numa dessas três — diferente de categoriasDoEstagio, que
   devolve só o degrau em que ele está agora. */
function nodesFaseCrianca() {
  return ["V", "L", "G"].map((s, i) => {
    const info = NIVEIS_CRITERIOS[i];
    return { id: s, nome: ESTAGIOS.find((e) => e.s === s).n, nivelSugerido: info.nivel, foco: info.capacidade, criterios: info.criterios };
  });
}
/* O caminho inteiro (todos os degraus, não só o atual) pra desenhar a trilha visual. */
function nodesDaTrilha(estagio) {
  if (["V", "L", "G"].includes(estagio)) return nodesFaseCrianca();
  if (estagio === "A") return CATEGORIAS_ADULTO;
  if (estagio === "C") return CATEGORIAS_COMPETICAO;
  return [];
}

/* Caminho visual da progressão: onde o jogador já passou (✓, verde),
   onde está agora (destacado, com quantos critérios já cumpriu) e o
   que ainda vem pela frente (apagado). Pensado pra abrir junto com o
   jogador na aula — não só o treinador ler sozinho depois. */
function TrilhaVisual({ estagio, categoria, criteriosClassificacao }) {
  const nodes = nodesDaTrilha(estagio);
  if (nodes.length === 0) return null;
  const idxAtual = ["V", "L", "G"].includes(estagio)
    ? nodes.findIndex((n) => n.id === estagio)
    : Math.max(0, nodes.findIndex((n) => n.id === categoria));
  const marcados = criteriosClassificacao || {};

  return (
    <div className="mt-2 mb-3">
      <div className="flex items-start" style={{ overflowX: "auto", paddingBottom: 2 }}>
        {nodes.map((n, i) => {
          const passado = i < idxAtual;
          const atual = i === idxAtual;
          const feitos = n.criterios ? n.criterios.filter((_, k) => marcados[n.id + ":" + k]).length : 0;
          const cor = passado ? C.quadra : atual ? C.saibro : C.linha;
          return (
            <React.Fragment key={n.id}>
              {i > 0 && (
                <div style={{ height: 2, flex: 1, minWidth: 16, marginTop: 13, background: i <= idxAtual ? C.quadra : C.linha }} />
              )}
              <div style={{ textAlign: "center", minWidth: 88, flexShrink: 0 }}>
                <div style={{
                  width: 27, height: 27, borderRadius: "50%", margin: "0 auto",
                  border: "2px solid " + cor, background: passado ? C.quadra : atual ? C.saibro : C.cal,
                  color: passado || atual ? "#fff" : C.grafite,
                  fontFamily: ARCH, fontSize: 12, fontWeight: 700,
                  display: "flex", alignItems: "center", justifyContent: "center",
                }}>
                  {passado ? "✓" : i + 1}
                </div>
                <p style={{ fontFamily: ARCH, fontSize: 10.5, fontWeight: atual ? 700 : 500, color: atual ? C.tinta : C.grafite, marginTop: 5, lineHeight: 1.25 }}>
                  {n.nome}
                </p>
                {n.criterios && (
                  <p style={{ ...prosa, fontSize: 10, color: atual ? C.saibro : C.grafite, marginTop: 1 }}>
                    {passado ? "concluído" : atual ? feitos + "/" + n.criterios.length : n.nivelSugerido}
                  </p>
                )}
              </div>
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

/* ─────────────────────────── geração do macro ─────────────────────────── */
function segundaDaSemana(iso) {
  const d = new Date(iso + "T12:00:00");
  const dia = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dia);
  return d;
}

function fmtData(d) {
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}

function montaFases({ inicio, semanas, competicoes }) {
  const base = segundaDaSemana(inicio);
  const linha = [];
  for (let i = 0; i < semanas; i++) {
    const d = new Date(base);
    d.setDate(d.getDate() + i * 7);
    linha.push({ n: i + 1, data: d, fase: null, evento: null });
  }

  // 1 · semanas de competição
  const idxTorneios = [];
  competicoes.forEach((c) => {
    if (!c.data) return;
    const dc = segundaDaSemana(c.data).getTime();
    const alvo = linha.find((s) => s.data.getTime() === dc);
    if (alvo) {
      alvo.fase = "Torneio";
      alvo.evento = c.nome || "Competição";
      idxTorneios.push(alvo.n - 1);
    }
  });
  idxTorneios.sort((a, b) => a - b);

  // 2 · ponte competitiva entre torneios próximos
  for (let k = 0; k < idxTorneios.length - 1; k++) {
    const vao = idxTorneios[k + 1] - idxTorneios[k];
    if (vao > 1 && vao <= 3) {
      for (let i = idxTorneios[k] + 1; i < idxTorneios[k + 1]; i++)
        if (!linha[i].fase) linha[i].fase = "Ponte competitiva";
    }
  }

  // 3 · afinação antes de cada torneio (2 semanas no primeiro, 1 nos demais)
  idxTorneios.forEach((idx, ordem) => {
    const quantas = ordem === 0 ? 2 : 1;
    let postas = 0;
    for (let i = idx - 1; i >= 0 && postas < quantas; i--) {
      if (!linha[i].fase) {
        linha[i].fase = "Afinação";
        postas++;
      } else break;
    }
  });

  // 4 · regeneração depois de cada torneio (menos o último bloco)
  idxTorneios.forEach((idx, ordem) => {
    if (ordem === idxTorneios.length - 1) return;
    const prox = linha[idx + 1];
    if (prox && !prox.fase) prox.fase = "Regeneração";
  });

  // 5 · última semana: descanso
  const ultima = linha[linha.length - 1];
  if (ultima && (!ultima.fase || ultima.fase === "Ponte competitiva") && idxTorneios.length)
    ultima.fase = "Descanso";

  // 6 · sobra depois do último torneio vira ponte competitiva, não base
  if (idxTorneios.length) {
    const ultimoT = idxTorneios[idxTorneios.length - 1];
    const livresNoFim = linha.slice(ultimoT + 1).filter((s) => !s.fase).length;
    if (livresNoFim <= 2)
      linha.slice(ultimoT + 1).forEach((s) => { if (!s.fase) s.fase = "Ponte competitiva"; });
  }

  // 7 · o que sobrou vira base, em mesociclos de até 3 semanas
  //     (o estímulo dura 3 treinos e roda ao fim de cada mesociclo)
  const ROM = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
  let bloco = 0;
  let corridas = 0;
  let anterior = null;
  linha.forEach((s) => {
    if (!s.fase) {
      if (anterior !== "base" || corridas >= 3) { bloco++; corridas = 0; }
      s.fase = "Base " + ROM[Math.min(bloco - 1, ROM.length - 1)];
      corridas++;
      anterior = "base";
    } else { anterior = "outra"; corridas = 0; }
  });

  return linha;
}

function agrupaFases(linha) {
  const g = [];
  linha.forEach((s) => {
    const ult = g[g.length - 1];
    if (ult && ult.fase === s.fase) {
      ult.fim = s.n;
      if (s.evento) ult.eventos.push(s.evento);
    } else {
      g.push({ fase: s.fase, ini: s.n, fim: s.n, eventos: s.evento ? [s.evento] : [] });
    }
  });
  return g;
}

function montaCiclos(prioridades, estagio) {
  return prioridades.slice(0, 4).map((areaId, i) => {
    const a = AREAS[areaId];
    const chave = exerciciosParaSorteio().filter(
      (e) => a.familias.includes(e.f) && e.e.includes(estagio) && a.busca.test(e.n + " " + e.m)
    ).slice(0, 6);
    const alt = exerciciosParaSorteio().filter((e) => a.familias.includes(e.f) && e.e.includes(estagio)).slice(0, 6);
    return {
      letra: LETRAS[i],
      areaId,
      nome: a.nome,
      estimulos: a.estimulos,
      volume: i < 2 ? 30 : 20,
      exercicios: (chave.length >= 3 ? chave : alt).slice(0, 5),
    };
  });
}

function proporcaoTatica(prioridades) {
  const aberturaPrioritaria =

  if (aberturaPrioritaria === 2) return { abertura: 60, media: 25, defesa: 15 };
  if (aberturaPrioritaria === 1) return { abertura: 50, media: 32, defesa: 18 };
  return { abertura: 40, media: 38, defesa: 22 };
}

function montaGrade({ diasQuadra, periodos, escola, musculacao }) {

  const ativos = dias.slice(0, Math.min(diasQuadra, 6));
  const musDias = ["SEG", "QUA", "SEX"].slice(0, musculacao);
  const manhaEscola = escola === "manha";

  const faixas = [];
  faixas.push({
    hora: "07h00",
    conteudo: dias.map((d) => (d === "DOM" ? "LIVRE" : d === "SÁB" ? "Livre" : "Café + mobilidade")),
  });
  faixas.push({
    hora: manhaEscola ? "13h30–15h30" : "08h00–10h00",
    conteudo: dias.map((d) =>
      d === "DOM" ? "LIVRE" : d === "SÁB" ? "Jogo treino ou físico leve" :
      ativos.includes(d) ? "Quadra: técnica (ciclos)" : "Livre"
    ),
  });
  if (periodos >= 2) {
    faixas.push({
      hora: manhaEscola ? "16h00–17h00" : "10h15–11h15",
      conteudo: dias.map((d) =>
        d === "DOM" || d === "SÁB" ? (d === "DOM" ? "LIVRE" : "—") :
        musDias.includes(d) ? "Musculação" : "Físico específico"
      ),
    });
    faixas.push({
      hora: manhaEscola ? "18h00–20h00" : "15h30–17h30",
      conteudo: dias.map((d, i) =>
        d === "DOM" ? "LIVRE" : d === "SÁB" ? "—" :
        ativos.includes(d) ? (i % 2 === 1 ? "Quadra: tática + sets com regra" : "Quadra: tática") : "Livre"

  }
  faixas.push({

      d === "SEX" ? "Livre (social)" : (escola === "noite" ? "Escola · sono 21h30" : "Estudo · sono 21h30")
    ),

async function leia(chave, padrao, compartilhado = false) {
  try {
    const r = await window.storage.get(chave, compartilhado);
    return r ? JSON.parse(r.value) : padrao;

}
async function grave(chave, valor, compartilhado = false) {

  catch (e) { console.error("falha ao gravar", e); }
}

/* ─────────────────────────── geração por IA ───────────────────────────
   A chave da Anthropic mora no servidor (function gerar-ia-background).
   Sem conta numa academia, a function recusa antes de gastar um único
   token. Gerar um plano passa fácil dos ~10s que uma function comum tem
   pra responder, então essa roda em segundo plano (até 15 min) e escreve
   o resultado em orgs/{orgId}/iaJobs/{jobId} — o app fica consultando
   até aparecer, em vez de esperar a resposta direto na mesma chamada. */
async function chamarIA(prompt, maxTokens, aoProgredir) {
  const etapa = (t) => { if (aoProgredir) aoProgredir(t); };
  etapa("Conferindo a conta");
  if (!window.mtyAuth || !window.mtyAuth.usuario()) {
    throw new Error("Entre com sua conta da academia para gerar com IA.");
  }
  const org = await organizacao();
  if (!org) throw new Error("Sua conta ainda não está ligada a uma academia.");

  const jobId = MTY.id("job");
  const token = await window.mtyAuth.tokenId();
  etapa("Enviando o pedido");
  const r = await fetch("/.netlify/functions/gerar-ia-background", {
    method: "POST",
    headers: { "content-type": "application/json", authorization: "Bearer " + token },
    body: JSON.stringify({ prompt, maxTokens, jobId }),
  });
  if (!r.ok && r.status !== 202) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.erro || ("Erro " + r.status));
  }

  const ref = db.collection("orgs").doc(org).collection("iaJobs").doc(jobId);
  /* 4 min de paciência: a function em segundo plano tem até 15, e um
     plano que demora mais que o normal ainda é um plano — desistir cedo
     joga fora um pedido que já foi pago e que provavelmente chegaria. */
  const limite = Date.now() + 240000;
  etapa("A IA está montando");
  while (Date.now() < limite) {
    await new Promise((resolver) => setTimeout(resolver, 2500));
    const snap = await ref.get();
    if (snap.exists) {
      const d = snap.data();
      if (d.status === "pronto") { etapa("Lendo o que voltou"); ref.delete().catch(() => {}); return d.texto || ""; }
      if (d.status === "erro") { ref.delete().catch(() => {}); throw new Error(d.erro || "Falha ao gerar."); }
    }
  }
  throw new Error("Passou de quatro minutos sem resposta da IA. O pedido pode ainda estar rodando no servidor — espere um pouco e tente de novo.");
}

/* Espera de uma geração com IA. A function em segundo plano só responde
   no fim — não existe percentual real vindo do servidor pra mostrar.
   Então a barra anda pelo tempo decorrido contra o tempo típico, e para
   em 92%: ela indica que a coisa está viva e quanto já se passou, sem
   fingir que terminou antes de o plano chegar de verdade. */
function BarraProgresso({ segundos, etapa, estimativa = 60, aoCancelar }) {
  const pct = Math.max(4, Math.min(92, Math.round((segundos / estimativa) * 92)));
  const passouDoNormal = segundos > estimativa;
  return (
    <div className="mt-3" style={{ background: C.cal, border: "1px solid " + C.linha, padding: "12px 14px" }}>
      <div className="flex items-baseline justify-between gap-3 mb-2">
        <Etiqueta cor={C.tinta}>{etapa || "Montando"}…</Etiqueta>
        <Etiqueta>{segundos < 60 ? segundos + "s" : Math.floor(segundos / 60) + "min " + (segundos % 60) + "s"}</Etiqueta>
      </div>
      <div style={{ height: 6, background: C.linha, borderRadius: 3, overflow: "hidden" }}>
        <div style={{ width: pct + "%", height: "100%", background: passouDoNormal ? "#C9A227" : C.saibro, transition: "width .5s linear" }} />
      </div>
      <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 8 }}>
        {passouDoNormal
          ? "Está levando mais que o normal, mas o pedido continua rodando no servidor. Vale esperar mais um pouco."
          : "Costuma levar de trinta segundos a um minuto. Pode deixar a aba aberta."}
      </p>
      {aoCancelar && (
        <div className="mt-2">
          <Botao pequeno variante="vazio" onClick={aoCancelar}>Parar de esperar</Botao>
        </div>
      )}
    </div>
  );
}

/* Mesmo visual do Seletor, mas pra campos que aceitam mais de uma opção
   marcada ao mesmo tempo (ex.: arma do jogador — dá pra ter mais de uma
   arma de verdade) — valor é sempre um array. */
function SeletorMulti({ opcoes, valor, aoMudar }) {
  const marcados = valor || [];
  function alternar(v) {
    aoMudar(marcados.includes(v) ? marcados.filter((x) => x !== v) : [...marcados, v]);
  }
  return (
    <div className="flex flex-wrap gap-2">
      {opcoes.map((o) => {
        const on = marcados.includes(o.v);
        return (
          <button key={String(o.v)} onClick={() => alternar(o.v)}
            style={{
              fontFamily: ARCH, fontSize: 13, fontWeight: on ? 700 : 500, padding: "8px 13px",
              borderRadius: 2, cursor: "pointer", border: "1px solid " + (on ? C.tinta : C.linha),
              background: on ? C.tinta : C.cal, color: on ? C.papel : C.grafite,
            }}>
            {on ? "✓ " : ""}{o.r}
          </button>
        );
      })}
    </div>
  );
}

/* ── horários fixos semanais, usado tanto por jogador individual quanto por turma ──
   Uma lista de {dia, hora} — pra suportar 2 a 5 vezes por semana sem
   modelar nada além disso (sem quadra, sem duração por horário: a
   duração já vem do cadastro da turma ou é sempre a mesma pro particular). */
function EditorHorarios({ horarios, setHorarios }) {
  const [dia, setDia] = useState(1);
  const [hora, setHora] = useState("17:00");

  function adicionar() {
    if (horarios.some((h) => h.dia === dia && h.hora === hora)) return;
    setHorarios([...horarios, { dia, hora }].sort((a, b) => a.dia - b.dia || a.hora.localeCompare(b.hora)));
  }
  function remover(i) { setHorarios(horarios.filter((_, k) => k !== i)); }

  return (
    <div>
      {horarios.length > 0 && (
        <div className="flex flex-wrap gap-2 mb-3">
          {horarios.map((h, i) => (
            <span key={i} className="flex items-center gap-2" style={{ fontFamily: ARCH, fontSize: 12, fontWeight: 600,
              padding: "5px 10px", border: "1px solid " + C.linha, borderRadius: 2, background: C.cal, color: C.grafite }}>
              {nomeDia(h.dia)} {h.hora}
              <button onClick={() => remover(i)} style={{ border: "none", background: "none", cursor: "pointer", color: C.saibro, fontWeight: 700, padding: 0 }}>×</button>
            </span>
          ))}
        </div>
      )}
      <div className="flex gap-2 items-center flex-wrap">
        <Seletor opcoes={DIAS_SEMANA} valor={dia} aoMudar={setDia} />
        <input type="time" style={{ ...entrada, width: 100 }} value={hora} onChange={(e) => setHora(e.target.value)} />
        <Botao pequeno variante="vazio" onClick={adicionar}>+ Adicionar</Botao>
      </div>
    </div>
  );
}

/* ── trilha de classificação, por jogador ──
   Mostra onde o jogador está e o que falta pra próxima categoria — a
   marcação fica presa ao par (estágio, categoria) atual: trocar de
   categoria começa um checklist novo, do jeito que uma trilha real
   funciona (não dá pra "voltar" um critério de um degrau já passado). */
function TrilhaClassificacao({ f, set }) {
  const lista = categoriasDoEstagio(f.estagio);
  if (lista.length === 0) return null;

  const semSubdivisao = lista.length === 1 && lista[0].id === f.estagio;
  const { atual, feitos, total, completo } = statusTrilha(f);
  const idxAtual = lista.findIndex((c) => c.id === atual.id);
  const proxima = !semSubdivisao && idxAtual >= 0 && idxAtual < lista.length - 1 ? lista[idxAtual + 1] : null;
  const marcados = f.criteriosClassificacao || {};

  function alternar(i) {
    const chave = atual.id + ":" + i;
    set("criteriosClassificacao", { ...marcados, [chave]: !marcados[chave] });
  }

  /* Avançar um degrau da trilha também atualiza o nível (Y1–Y6) pro
     nivelSugerido do degrau novo — a classificação por critério e a
     escada de níveis do método são a mesma coisa, não duas fichas que
     o treinador precisa manter sincronizadas na mão. */
  function registrarSalto(novaCategoriaId, novoEstagio) {
    if (novoEstagio) set("estagio", novoEstagio);
    if (novaCategoriaId) set("categoria", novaCategoriaId);
    const alvo = proxima || (novoEstagio ? categoriasDoEstagio(novoEstagio)[0] : null);
    if (alvo && alvo.nivelSugerido) set("nivel", alvo.nivelSugerido);
    set("historicoCategorias", [...(f.historicoCategorias || []), { data: new Date().toISOString().slice(0, 10), de: atual.nome }]);
  }

  return (
    <div className="mb-5">
      {!semSubdivisao && (
        <Campo rotulo="Categoria dentro do estágio">
          <Seletor opcoes={lista.map((c) => ({ v: c.id, r: c.nome }))} valor={atual.id} aoMudar={(v) => set("categoria", v)} />
        </Campo>
      )}
      <div style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + (completo ? C.quadra : C.saibro), padding: "13px 15px" }}>
        <div className="flex items-baseline justify-between gap-3 flex-wrap mb-1">
          <span style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700 }}>{atual.nome}</span>
          <Etiqueta cor={completo ? C.quadra : C.grafite}>{feitos} de {atual.criterios.length} critérios</Etiqueta>
        </div>
        <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginBottom: 10 }}>{atual.foco}</p>
        {atual.criterios.map((cr, i) => {
          const feito = !!marcados[atual.id + ":" + i];
          return (
            <div key={i} onClick={() => alternar(i)}
              style={{ background: feito ? "#F4F7F4" : C.papel, border: "1px solid " + C.linha,
                borderLeft: "3px solid " + (feito ? C.quadra : C.linha), padding: "9px 12px", marginBottom: 6, cursor: "pointer" }}>
              <div className="flex items-start gap-3">
                <span style={{ fontFamily: ARCH, fontSize: 15, lineHeight: 1.3, color: feito ? C.quadra : C.grafite }}>{feito ? "☑" : "☐"}</span>
                <p style={{ ...prosa, fontSize: 12.5 }}>{cr}</p>
              </div>
            </div>
          );
        })}
        <p style={{ ...prosa, fontSize: 11.5, color: C.grafite, marginTop: 4 }}>
          Marque um critério só depois de observá-lo em três ocasiões distintas, em aulas diferentes.
        </p>
        {atual.notaEscada && (
          <div className="mt-2" style={{ background: C.papel, borderLeft: "3px solid " + C.quadra, padding: "8px 11px" }}>
            <p style={{ ...prosa, fontSize: 12 }}>{atual.notaEscada}</p>
          </div>
        )}

        {completo && (proxima || (semSubdivisao && atual.proximoEstagio)) && (
          <div className="mt-3">
            <Botao pequeno onClick={() => registrarSalto(
              proxima ? proxima.id : null,
              semSubdivisao ? atual.proximoEstagio : null
            )}>
              Avançar para {proxima ? proxima.nome : ESTAGIOS.find((e) => e.s === atual.proximoEstagio).n}
            </Botao>
          </div>
        )}
        {completo && !proxima && !(semSubdivisao && atual.proximoEstagio) && (
          <p style={{ ...prosa, fontSize: 12.5, color: C.quadra, marginTop: 8, fontWeight: 600 }}>
            Teto desta trilha — a partir daqui a evolução é pelo refinamento técnico, não por um novo degrau.
          </p>
        )}
      </div>

      {(f.historicoCategorias || []).length > 0 && (
        <p style={{ ...prosa, fontSize: 11.5, color: C.grafite, marginTop: 8 }}>
          Trilha percorrida: {f.historicoCategorias.map((h) => h.de).join(" → ")} → {atual.nome}
        </p>
      )}
    </div>
  );
}

/* ─────────────────────────── ficha do aluno ─────────────────────────── */
const NS = "__NAOSEI__";
const GOLPES_ENTRADA = ["Forehand", "Backhand", "Saque", "Devolução", "Jogo de rede"];

/* As seis fases do golpe, direto da Parte 2 do manual (ficha T-01) —
   é o mesmo modelo usado ali pra achar a causa do erro em vez do
   sintoma, agora clicável na ficha de entrada golpe a golpe. */
const FASES_GOLPE = [
  { k: "preparacao", r: "1 · Preparação" },
  { k: "apoio", r: "2 · Posicionamento e apoio" },
  { k: "aceleracao", r: "3 · Aceleração" },
  { k: "contato", r: "4 · Contato" },
  { k: "terminacao", r: "5 · Terminação" },
  { k: "recuperacao", r: "6 · Recuperação" },
];
const NIVEIS_FASE = [
  { v: "consolidada", r: "Consolidada" },
  { v: "andamento", r: "Em andamento" },
  { v: "atrasada", r: "Atrasada" },
];

/* Campos da ficha de entrada. A ordem segue o protocolo: técnico, físico,
   tático, mental — e é ela que evita começar o diagnóstico pelo estado. */
const ENTRADA_BLOCOS = [
  { n: "2", t: "Físico observado",
    nota: "Alimenta o perfil de corpo. Deslocamento e resistência pesam mais que estatura.",
    campos: [
      ["desloc", "Como se desloca — chega na bola larga? recupera o centro?"],
      ["resist", "Resistência — em que momento da aula ou do jogo a qualidade cai"],

    ] },
  { n: "3", t: "Tático · o que faz no ponto",
    nota: "O bloco mais valioso. Descreve decisão, não execução — vale mais que a lista de golpes.",
    campos: [
      ["inicia", "Como inicia o ponto — o que tenta com a primeira bola"],
      ["funda", "O que faz com bola funda, atrás da linha"],
      ["facil", "O que faz com a bola fácil, curta, para atacar"],
      ["pressao", "Sob pressão — o que muda"],
      ["varia", "Repete o mesmo padrão ou varia? Qual aparece mais?"],
    ] },
  { n: "4", t: "Mental observado",
    nota: "Comportamento observado, não interpretação. Alimenta o temperamento.",
    campos: [
      ["ritmo", "Ritmo natural — cadenciado ou direto"],
      ["reacaoErro", "Como reage ao próprio erro — repete a jogada ou foge dela"],
      ["aperta", "Acelera ou trava quando o jogo aperta"],
      ["correcao", "Como recebe correção"],
    ] },
  { n: "5", t: "Objetivo",
    nota: "Quando o que ele quer e o que você vê não batem, isso é informação.",
    campos: [
      ["quer", "O que ELE diz que quer"],
      ["prioridadeReal", "O que VOCÊ vê como prioridade real"],
      ["prazo", "Prazo ou compromisso à vista"],
    ] },
  { n: "6", t: "Em aberto",
    nota: "O que ficou sem resposta e precisa ser observado na próxima aula.",
    campos: [["aberto", "Observar na próxima aula"]] },
];

const AREA_OPCOES = Object.entries(AREAS).map(([id, a]) => ({ id, nome: a.nome }));

/* A partir daqui o catálogo de métricas por área (AREAS.metricas — número
   e protocolo) já se aplica; antes disso a régua é a escada de nível
   (NIVEIS_CRITERIOS), sem quantificar — é a mesma leitura que
   PUBLICOS_ESPECIFICOS faz ("nenhum público pede critério novo, todos
   usam o mesmo catálogo e os mesmos critérios de nível"). */
const NIVEL_MIN_METRICAS = "Y4";
function nivelDeReferencia(entidade, eTurma, membros) {
  if (!eTurma) return entidade.nivel || "Y1";
  const niveis = (membros || []).map((m) => m.nivel || "Y1");
  if (!niveis.length) return "Y1";
  return niveis.reduce((min, n) => (NIVEIS.indexOf(n) < NIVEIS.indexOf(min) ? n : min), niveis[0]);
}
/* O critério de saída de um bloco vem direto do catálogo do manual, não
   de texto livre da IA — a IA só aponta a área (bloco.areaFoco, um id
   fixo de AREAS); a régua concreta é sempre a mesma pra todo mundo.
   Sem areaFoco válido (planos antigos, ou colados à mão), cai no critério
   em texto livre de sempre — ver o uso em TelaPlano. */
function criteriosDeSaidaDoBloco(bloco, entidade, eTurma, membros) {
  const area = AREAS[bloco.areaFoco];
  if (!area) return null;
  const nivel = nivelDeReferencia(entidade, eTurma, membros);
  const usaMetricas = NIVEIS.indexOf(nivel) >= NIVEIS.indexOf(NIVEL_MIN_METRICAS);
  if (usaMetricas && area.metricas && area.metricas.length) {
    return { areaNome: area.nome, nivel, itens: area.metricas.map(([m, protocolo, meta]) => m + " — " + protocolo + " · meta " + meta) };
  }
  const infoNivel = NIVEIS_CRITERIOS.find((n) => n.nivel === nivel);
  if (!infoNivel) return null;
  const relevantes = infoNivel.criterios.filter((c) => area.busca.test(c));
  return { areaNome: area.nome, nivel, itens: relevantes.length ? relevantes : infoNivel.criterios };
}

/* Campo da ficha de entrada, com marcador "não sei". A distinção entre
   "não perguntei" e "campo vazio" é o que impede o plano de ser construído

  const ns = valor === NS;
  return (

          value={ns ? "não sei" : (valor || "")}
          onChange={(e) => aoMudar(e.target.value)} />
        <button onClick={() => aoMudar(ns ? "" : NS)}
          style={{ fontFamily: ARCH, fontSize: 11.5, fontWeight: 700, padding: "10px 11px",
            borderRadius: 2, cursor: "pointer", whiteSpace: "nowrap",
            border: "1px solid " + (ns ? C.grafite : C.linha),
            background: ns ? C.grafite : C.cal, color: ns ? C.cal : C.grafite }}>
          não sei
        </button>
      </div>
      {nota && <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 5 }}>{nota}</p>}
    </div>
  );
}

/* Classificação golpe a golpe pelo modelo das seis fases (ficha T-01 do
   manual) — clicável, três níveis por fase, com observação opcional.
   Fica fechado por padrão dentro do card do golpe: são seis linhas a
   mais por golpe, e a ficha já é longa o bastante sem isso aberto. */
function FasesGolpe({ golpe, avaliacao, aoMudar }) {
  const [aberto, setAberto] = useState(false);
  const dados = avaliacao || {};
  const preenchidas = FASES_GOLPE.filter((f) => (dados[f.k] || {}).nivel).length;

  function mudaFase(faseKey, campo, valor) {
    const atual = dados[faseKey] || {};
    aoMudar({ ...dados, [faseKey]: { ...atual, [campo]: valor } });
  }

  return (
    <div className="mt-2" style={{ borderTop: "1px solid " + C.linha, paddingTop: 8 }}>
      <button type="button" onClick={() => setAberto(!aberto)}
        style={{ fontFamily: ARCH, fontSize: 11.5, fontWeight: 700, color: C.grafite, background: "none",
          border: "none", cursor: "pointer", padding: 0 }}>
        {(preenchidas ? preenchidas + "/6 fases avaliadas" : "Avaliar pelas seis fases") + (aberto ? " ▲" : " ▼")}
      </button>
      {aberto && (
        <div className="mt-3">
          {FASES_GOLPE.map((fase) => {
            const d = dados[fase.k] || {};
            return (
              <div key={fase.k} className="mb-3">
                <div className="mb-1"><Etiqueta>{fase.r}</Etiqueta></div>
                <Seletor opcoes={NIVEIS_FASE.map((n) => ({ v: n.v, r: n.r }))} valor={d.nivel || ""}
                  aoMudar={(v) => mudaFase(fase.k, "nivel", d.nivel === v ? "" : v)} />
                <input value={d.obs || ""} onChange={(e) => mudaFase(fase.k, "obs", e.target.value)}
                  placeholder="Observação (opcional)" style={{ ...entrada, marginTop: 6, fontSize: 13, padding: "7px 10px" }} />
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function novoAluno() {
  return {
    id: "a" + Date.now(), nome: "", nascimento: "", lateralidade: "destro", backhand: "duas",
    alturaAtual: "", projecaoAltura: "", tipoFisico: "medio", baseMotora: "media",
    contexto: "", estagio: "C", nivel: "Y5", perfilCorpo: "", perfilTemperamento: "",
    objetivoAdulto: "", disposicaoAdulto: "", comportamentoAdulto: "",
    tempoTreinando: "", dificuldadeConsistencia: false,
    entrada: {}, plano: null, regPlano: {}, avaliacaoTecnica: {},
    objetivoFinal: "", marcos: [{ ano: "", marco: "", precisa: "" }],
    camadas: { tecnico: "", fisico: "", tatico: "", mental: "" },
    prioridades: ["saque", "devolucao", "fundo", "rede"],
    armas: ["fundo"],
    inicio: "", semanas: 18, competicoes: [{ nome: "", data: "" }],

}

/* ── aulas do plano, achatadas numa lista única, e o status de cada uma ──
   Compartilhado entre a tela de plano individual e a sessão de turma —
   as duas precisam enxergar exatamente a mesma "próxima aula pendente". */
/* regPlano é opcional: quando informado, as aulas de reforço geradas por
   "ainda não bati o critério de saída" (ver blocoLiberado/reforçarBloco)
   entram na lista, logo depois das aulas programadas do próprio bloco —
   contam pra progresso, dashboard e checklist do mesmo jeito que as
   demais, só que nascem de uma decisão do treinador, não da IA. */
function listaAulas(plano, regPlano) {
  if (!plano) return [];
  const lista = [];
  let n = 0;
  plano.blocos.forEach((b, bi) => {
    const nomeBloco = b.titulo || b.nome;
    (b.semanasLista || []).forEach((sem) =>
      (sem.aulas || []).forEach((au) => {
        n++;
        lista.push({ id: "A" + String(n).padStart(2, "0"), bloco: nomeBloco,
          semana: sem.n, foco: sem.foco, ...au });
      }));
    const reforcos = (((regPlano || {}).__blocos || {})[nomeBloco] || {}).reforcos || [];
    reforcos.forEach((r, ri) => {
      lista.push({ id: "REF" + bi + "-" + ri, bloco: nomeBloco, semana: "reforço",
        foco: "Reforço do critério de saída", t: "Reforço " + (ri + 1), ex: r.ex || [], reforco: true });
    });
  });
  return lista;
}
function statusAula(reg, id) {
  const d = (reg || {})[id] || {};
  if (d.status) return d.status;
  return d.feita ? "feita" : "";
}
/* Um bloco (exceto o último — esse é resolvido pelo Fechamento do ciclo)
   só libera o próximo depois que o treinador confirma, na aba Aulas, que
   o critério de saída foi observado — não basta ter dado todas as aulas
   programadas. Enquanto não confirma, pode reforçar (ver reforços acima),
   e o que reforçar continua contando dentro do bloco atual. */
function blocoLiberado(regPlano, nomeBloco) {
  const info = ((regPlano || {}).__blocos || {})[nomeBloco];
  return !!(info && info.liberado);
}
function gateDeBloco(plano, regPlano, nomeBloco) {
  const nomes = plano.blocos.map((b) => b.titulo || b.nome);
  if (nomes[nomes.length - 1] === nomeBloco) return null; // último bloco: fecha pelo ciclo, não por gate
  const b = plano.blocos.find((bb) => (bb.titulo || bb.nome) === nomeBloco);
  if (!b || !(b.saida || (b.areaFoco && AREAS[b.areaFoco]))) return null;
  if (blocoLiberado(regPlano, nomeBloco)) return null;
  return { id: "GATE-" + nomeBloco, gate: true, bloco: nomeBloco, semana: null,
    t: "Aguardando confirmação do critério de saída", ex: [] };
}
/* A aula que vale agora: a primeira do plano que ainda não foi "feita".
   Falta e cancelada NÃO avançam — a aula continua em vigor até ser
   realizada, então uma aula cancelada por chuva se repete na próxima vez.
   Quando um bloco termina suas aulas (programadas + reforços) sem que o
   treinador tenha confirmado o critério de saída, a aula em vigor vira um
   "portão" em vez de pular pro próximo bloco — ver gateDeBloco. */
function aulaEmVigor(aluno) {
  const plano = aluno.plano;
  if (!plano) return null;
  const regPlano = aluno.regPlano || {};
  const aulas = listaAulas(plano, regPlano);
  let blocoAtual = null;
  for (const a of aulas) {
    if (a.bloco !== blocoAtual) {
      if (blocoAtual !== null) {
        const gate = gateDeBloco(plano, regPlano, blocoAtual);
        if (gate) return gate;
      }
      blocoAtual = a.bloco;
    }
    if (statusAula(regPlano, a.id) !== "feita") return a;
  }
  if (blocoAtual !== null) {
    const gate = gateDeBloco(plano, regPlano, blocoAtual);
    if (gate) return gate;
  }
  return null;
}

/* Pedido de reposição que o próprio aluno faz pelo link público (aluno.html)
   — o horário preferido é só uma sugestão dele; aprovar aqui apenas
   registra a decisão, não move nada sozinho na agenda. Quem combina o
   encaixe de verdade (quadra, horário do professor) é o treinador, por
   fora do app, como já acontece com pendência de turma. */
function CardPedidosReposicao({ aluno, aoMudar }) {
  const pendentes = (aluno.pedidosReposicao || []).filter((p) => p.status === "pendente");
  if (pendentes.length === 0) return null;

  function resolver(id, status) {
    aoMudar({ pedidosReposicao: (aluno.pedidosReposicao || []).map((p) => (p.id === id ? { ...p, status } : p)) });
  }

  return (
    <div className="mb-5" style={{ background: C.cal, borderLeft: "3px solid #C9A227", padding: "13px 15px" }}>
      <Etiqueta cor="#C9A227">{pendentes.length === 1 ? "Pedido de reposição do aluno" : pendentes.length + " pedidos de reposição do aluno"}</Etiqueta>
      {pendentes.map((p) => (
        <div key={p.id} className="mt-2" style={{ paddingTop: 8, borderTop: "1px solid " + C.linha }}>
          <p style={{ ...prosa, fontSize: 13.5 }}>
            Prefere <b>{(DIAS_SEMANA.find((d) => d.v === p.diaPreferido) || {}).r || p.diaPreferido}</b> às <b>{p.horaPreferido}</b>
            {p.nota ? " — " + p.nota : ""}
          </p>
          <div className="flex gap-2 mt-1">
            <Botao pequeno onClick={() => resolver(p.id, "aprovado")}>Aprovar</Botao>
            <Botao pequeno variante="vazio" onClick={() => resolver(p.id, "recusado")}>Recusar</Botao>
          </div>
        </div>
      ))}
    </div>
  );
}

/* O que o aluno pediu pra trabalhar, pelo link dele — diferente do
   feedback (secreto, só do coordenador), isto é dirigido ao treinador.
   Aprovar carimba fichaAtualizadaEm: é o mesmo gatilho que uma edição de
   ficha usa pra avisar, na aba Plano, que dá pra revisar o planejamento
   — aqui a "edição" é o pedido do próprio aluno entrando na ficha. */
function CardPedidosConteudo({ aluno, aoMudar }) {
  const pendentes = (aluno.pedidosConteudo || []).filter((p) => p.status === "pendente");
  if (pendentes.length === 0) return null;

  function resolver(id, status) {
    const pedido = pendentes.find((p) => p.id === id);
    const patch = { pedidosConteudo: (aluno.pedidosConteudo || []).map((p) => (p.id === id ? { ...p, status } : p)) };
    if (status === "aprovado") {
      patch.pedidosConteudoAprovados = [...(aluno.pedidosConteudoAprovados || []), pedido.texto];
      patch.fichaAtualizadaEm = new Date().toISOString();
    }
    aoMudar(patch);
  }

  return (
    <div className="mb-5" style={{ background: C.cal, borderLeft: "3px solid #C9A227", padding: "13px 15px" }}>
      <Etiqueta cor="#C9A227">{pendentes.length === 1 ? "O aluno quer trabalhar" : pendentes.length + " pedidos do aluno sobre o que trabalhar"}</Etiqueta>
      {pendentes.map((p) => (
        <div key={p.id} className="mt-2" style={{ paddingTop: 8, borderTop: "1px solid " + C.linha }}>
          <p style={{ ...prosa, fontSize: 13.5 }}>{p.texto}</p>
          <div className="flex gap-2 mt-1">
            <Botao pequeno onClick={() => resolver(p.id, "aprovado")}>Aprovar — entra no planejamento</Botao>
            <Botao pequeno variante="vazio" onClick={() => resolver(p.id, "recusado")}>Recusar</Botao>
          </div>
        </div>
      ))}
    </div>
  );
}

/* Mostrado assim que o treinador abre o aluno, pra não precisar procurar
   na lista qual aula vale hoje. */
function CardAulaEmVigor({ aluno, aoClicar, aoAbrirAulas }) {
  if (!aluno.plano) return null;
  const aula = aulaEmVigor(aluno);
  if (!aula) {
    return (
      <div className="mb-5" style={{ background: "#F4F7F4", borderLeft: "3px solid " + C.quadra, padding: "11px 14px" }}>
        <Etiqueta cor={C.quadra}>Plano concluído</Etiqueta>
        <p style={{ ...prosa, fontSize: 13, marginTop: 4 }}>Todas as aulas deste ciclo foram realizadas.</p>
      </div>
    );
  }
  if (aula.gate) {
    return (
      <button onClick={aoAbrirAulas} className="w-full text-left mb-5"
        style={{ display: "block", background: C.cal, borderLeft: "3px solid " + C.saibro, padding: "11px 14px", cursor: aoAbrirAulas ? "pointer" : "default" }}>
        <Etiqueta cor={C.saibro}>Bloco aguardando confirmação</Etiqueta>
        <p style={{ ...prosa, fontSize: 14, fontWeight: 700, marginTop: 4 }}>{aula.bloco} · critério de saída ainda não confirmado</p>
        <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 3 }}>
          As aulas programadas deste bloco já foram todas dadas. Falta decidir, na aba Aulas, se o jogador já
          demonstra o critério de saída (libera o próximo bloco) ou se ainda precisa de reforço.
        </p>
        {aoAbrirAulas && <p style={{ ...prosa, fontSize: 12, color: C.grafite, marginTop: 6 }}>Toque aqui para decidir →</p>}
      </button>
    );
  }
  const reg = (aluno.regPlano || {})[aula.id] || {};
  const repetindo = reg.status === "falta" || reg.status === "cancelada";
  return (
    <button onClick={aoClicar} className="w-full text-left mb-5"
      style={{ display: "block", background: C.cal, borderLeft: "3px solid " + C.saibro, padding: "11px 14px", cursor: aoClicar ? "pointer" : "default" }}>
      <Etiqueta cor={C.saibro}>Aula em vigor</Etiqueta>
      <p style={{ ...prosa, fontSize: 14, fontWeight: 700, marginTop: 4 }}>{aula.bloco} · semana {aula.semana} · {aula.t}</p>
      {repetindo && (
        <p style={{ ...prosa, fontSize: 12.5, color: C.saibro, marginTop: 3 }}>
          Repetindo — a aula anterior foi marcada como {reg.status === "falta" ? "falta" : "cancelada"}
          {reg.motivo ? " (" + reg.motivo + ")" : ""}{reg.data ? " em " + reg.data : ""}.
        </p>
      )}
      {aoClicar && <p style={{ ...prosa, fontSize: 12, color: C.grafite, marginTop: 6 }}>Toque aqui para montar a sessão de hoje →</p>}
    </button>
  );
}

/* Trilha de classificação, no topo do jogador — pra ele (e o professor)
   verem de cara onde está, e MEXEREM ali mesmo: marcar um critério
   observado hoje não deveria exigir entrar na ficha e depois salvar.
   Grava direto no aluno (como o Plano já faz), sem passar por um
   buffer de edição. TrilhaClassificacao é genérico o bastante pra
   aceitar o aluno no lugar do buffer da ficha (f/set). */
function CardTrilha({ aluno, aoMudar, aoAbrirFicha }) {
  const lista = categoriasDoEstagio(aluno.estagio);
  if (lista.length === 0) return null;
  const set = (k, v) => aoMudar({ [k]: v });

  return (
    <div className="mb-5" style={{ background: C.cal, border: "1px solid " + C.linha, padding: "11px 14px" }}>
      <div className="flex items-center justify-between gap-3 mb-3">
        <Etiqueta>{faseDoEstagio(aluno.estagio)}</Etiqueta>
        {aoAbrirFicha && (
          <button onClick={aoAbrirFicha} style={{ border: "none", background: "none", color: C.grafite, cursor: "pointer", padding: 0, fontFamily: ARCH, fontSize: 11.5, fontWeight: 600 }}>
            Ver ficha completa →
          </button>
        )}
      </div>
      <TrilhaVisual estagio={aluno.estagio} categoria={aluno.categoria} criteriosClassificacao={aluno.criteriosClassificacao} />
      <TrilhaClassificacao f={aluno} set={set} />
    </div>
  );
}

/* Texto da ficha para colar numa conversa e gerar o planejamento.
   Campos vazios ou marcados viram item de observação, nunca suposição. */
/* Fichas salvas antes desta virar múltipla escolha ainda têm "arma"
   (string única) em vez de "armas" (array) — lê os dois formatos, sem
   precisar migrar nada em silêncio nem perder o que já estava salvo. */
function armasDoJogador(f) {
  if (Array.isArray(f.armas) && f.armas.length) return f.armas;
  if (f.arma) return [f.arma];
  return [];
}

function relatorioFicha(a) {
  const e = a.entrada || {};
  const v = (k) => {
    if (e[k] === NS) return "[não sei]";
    const t = (e[k] || "").trim();
    return t === "" ? "[em branco]" : t;
  };
  const L = [];
  L.push("FICHA DE ENTRADA · METODOLOGIA MTY");
  L.push("Jogador: " + (a.nome || "sem nome"));
  L.push("Gerada em: " + new Date().toLocaleDateString("pt-BR"));
  L.push("");
  L.push("0 · CONTEXTO");
  L.push("Nascimento: " + (a.nascimento || "—") + " · Estágio: " + a.estagio + " · Nível: " + a.nivel);
  L.push("Lateralidade: " + a.lateralidade + " · Backhand: " + a.backhand);
  L.push("Altura atual/projeção: " + (a.alturaAtual || "—") + " / " + (a.projecaoAltura || "—"));
  L.push("Tipo físico: " + a.tipoFisico + " · Base motora: " + a.baseMotora);
  L.push("Rotina de treino: " + (a.diasQuadra || "—") + " dias de quadra por semana, " +
    (a.periodos >= 2 ? "dois turnos por dia (dobrado — típico de competição)" : "um turno por dia") +
    " · musculação " + (a.musculacao || 0) + "x/semana · escola: " + a.escola);
  const TEMPO_TREINANDO_R = { novo: "menos de 6 meses", intermediario: "6 meses a 2 anos", experiente: "mais de 2 anos" };
  L.push("Tempo treinando: " + (TEMPO_TREINANDO_R[a.tempoTreinando] || "[não definido]"));
  /* Adulto não usa contexto familiar — o que importa ali não é a criação
     da pessoa, é quem ela é dentro da quadra agora (ver DISPOSICOES_ADULTO
     e o campo comportamentoAdulto, preenchidos no lugar de "contexto"). */
  if (a.estagio === "A") {
    const disp = DISPOSICOES_ADULTO.find((d) => d.v === a.disposicaoAdulto);
    L.push("Disposição do aluno adulto: " + (disp ? disp.r + " — " + disp.d : "[não definida]"));
    if ((a.comportamentoAdulto || "").trim()) L.push("Comportamento em quadra: " + a.comportamentoAdulto.trim());
  } else if ((a.contexto || "").trim()) {
    L.push("Contexto: " + a.contexto.trim());
  }
  if (a.dificuldadeConsistencia) L.push("ALERTA: treinador marcou dificuldade de consistência — erra demais pra sustentar a troca de bolas.");
  L.push("");
  L.push("1 · TÉCNICO");
  GOLPES_ENTRADA.forEach((g) => {
    L.push(g);
    L.push("  funciona: " + v("g_" + g + "_ok"));
    L.push("  falha quando: " + v("g_" + g + "_falha"));
    const av = (a.avaliacaoTecnica || {})[g] || {};
    const fasesAvaliadas = FASES_GOLPE.filter((fase) => (av[fase.k] || {}).nivel);
    if (fasesAvaliadas.length) {
      L.push("  avaliação por fase (modelo das seis fases):");
      fasesAvaliadas.forEach((fase) => {
        const d = av[fase.k];
        const nivel = (NIVEIS_FASE.find((n) => n.v === d.nivel) || {}).r || d.nivel;
        L.push("    " + fase.r + ": " + nivel + ((d.obs || "").trim() ? " — " + d.obs.trim() : ""));
      });
    }
  });
  ENTRADA_BLOCOS.forEach((b) => {
    L.push("");
    L.push(b.n + " · " + b.t.toUpperCase());
    b.campos.forEach(([k, rot]) => L.push(rot + ": " + v(k)));
  });
  L.push("");
  L.push("DIAGNÓSTICO DAS QUATRO CAMADAS");
  [["tecnico", "Técnico"], ["fisico", "Físico"], ["tatico", "Tático"], ["mental", "Mental"]]
    .forEach(([k, r]) => L.push(r + ": " + ((a.camadas[k] || "").trim() || "[em branco]")));
  L.push("");
  L.push("CLASSIFICAÇÃO NA ESCADA DO MÉTODO (Y1–Y6)");
  const trilha = statusTrilha(a);
  if (trilha) {
    L.push("Degrau atual: " + trilha.atual.nome + " · nível de referência " + a.nivel);
    L.push(trilha.feitos + " de " + trilha.total + " critérios de classificação já observados neste degrau.");
    if (trilha.pendentes.length) {
      L.push("Critérios AINDA PENDENTES deste degrau — o plano deve priorizar blocos que trabalhem");
      L.push("exatamente estes pontos, não conteúdo genérico do nível:");
      trilha.pendentes.forEach((c) => L.push("  · " + c));
    } else {
      L.push("Todos os critérios deste degrau já foram observados — o jogador está pronto para o próximo degrau da trilha.");
    }
  } else {
    L.push("Sem trilha de classificação cadastrada para este estágio.");
  }
  L.push("");
  L.push("PERFIL E PRIORIDADES");
  L.push("Perfil de corpo: " + (a.perfilCorpo || "[não definido]"));
  L.push("Temperamento: " + (a.perfilTemperamento || "[não definido]"));
  if (a.estagio === "A") {
    const obj = OBJETIVOS_ADULTO.find((o) => o.v === a.objetivoAdulto);
    L.push("Objetivo (adulto): " + (obj ? obj.r + " — " + obj.d : "[não definido]"));
  }
  L.push("Prioridades: " + a.prioridades.map((p, i) => (i + 1) + ") " + AREAS[p].nome).join(" · "));
  L.push("Arma(s) do jogador: " + (armasDoJogador(a).map((id) => AREAS[id].nome).join(" · ") || "[não definida]"));
  if ((a.objetivoFinal || "").trim()) L.push("Objetivo final: " + a.objetivoFinal.trim());
  if ((a.pedidosConteudoAprovados || []).length) {
    L.push("");
    L.push("PEDIDOS DO PRÓPRIO JOGADOR, APROVADOS PELO TREINADOR (pelo link dele)");
    a.pedidosConteudoAprovados.forEach((p) => L.push("  · " + p));
  }
  L.push("");
  L.push("---");
  L.push("Campos [não sei] ou [em branco] devem entrar no planejamento como item de");
  L.push("observação para a próxima aula, nunca preenchidos por suposição.");
  return L.join("\n");
}

/* ── Princípios travados do método ──
   Viajam junto em todo pedido de planejamento. Sem isso, o texto sai soando
   MTY e contradizendo o método justamente nos pontos que custaram mais caro
   para corrigir. */
const PRINCIPIOS_MTY = [
  "Ordem de diagnóstico travada: técnico, depois físico, depois tático, e só então mental. Nunca inverter.",
  "Três objetivos do jogo, nesta ordem: ganhar a quadra, produzir ângulo, diminuir o tempo.",
  "NUNCA sugerir esperar o adversário errar. Não existe estilo de jogo baseado em esperar o erro do outro.",
  "NUNCA pedir mais efeito na bola de ataque para ela cair dentro. Isso converte ataque em bola de controle. Corrige-se apoio e ponto de contato.",

/* Índice de exercícios montado a partir do catálogo do próprio app,
   recortado pelo estágio do jogador — o pedido não carrega o que não serve. */
function indiceParaEstagio(estagio) {
  const porFam = {};
  exerciciosParaSorteio().filter((e) => e.e.includes(estagio)).forEach((e) => {
    (porFam[e.f] = porFam[e.f] || []).push(e.c + " " + e.n);
  });
  return Object.keys(porFam).sort().map((f) =>
    f + " (" + (FAM[f] || f) + "): " + porFam[f].join(" · ")).join("\n");
}

/* Mesma ideia, para um GRUPO de estágios (turma) — a união dos catálogos,
   marcando entre colchetes pra qual estágio cada exercício serve, pra
   IA montar estações/variações quando a turma for de nível misto. */
function indiceParaEstagios(estagios) {
  const set = new Set(estagios);
  const porFam = {};
  exerciciosParaSorteio().filter((e) => e.e.some((s) => set.has(s))).forEach((e) => {
    const validos = e.e.filter((s) => set.has(s)).join(",");
    (porFam[e.f] = porFam[e.f] || []).push(e.c + " " + e.n + " [" + validos + "]");
  });
  return Object.keys(porFam).sort().map((f) =>
    f + " (" + (FAM[f] || f) + "): " + porFam[f].join(" · ")).join("\n");
}

/* Validação de um plano recém-gerado ou colado — compartilhada entre o
   plano individual e o plano de turma, já que a forma do JSON é a mesma. */
function validarPlanoJSON(alvo) {
  if (!alvo.blocos || !alvo.blocos.length) throw new Error("Não encontrei os blocos do plano.");
  const ruins = [];
  alvo.blocos.forEach((b) => (b.semanasLista || []).forEach((sem) =>
    (sem.aulas || []).forEach((au) => (au.ex || []).forEach((c) => {
      if (!TODOS_EXERCICIOS().some((e) => e.c === c)) ruins.push(c);
    }))));
  if (ruins.length)
    throw new Error("Códigos que não existem no catálogo: " + [...new Set(ruins)].join(", "));
  const raizes = (alvo.cadeia || []).filter((c) => c.raiz).length;
  if (raizes > 1) throw new Error("O plano marcou " + raizes + " camadas como origem. Só pode haver uma.");
  return alvo;
}

/* Pedido que devolve o PLANO já no formato da aba — sem passar por conversa. */
/* Regras do estágio Adulto (não confundir com Competição — ali a
   cobrança já segue o padrão competitivo normal do método): conservar
   risco tático sem nunca substituir o temperamento próprio do jogador,
   e o tratamento do objetivo declarado (simples/duplas/não compete). */
function regrasAdulto(a) {
  if (a.estagio !== "A") return [];
  const obj = OBJETIVOS_ADULTO.find((o) => o.v === a.objetivoAdulto);
  const linhas = [
    "· Jogador adulto: o jogo dele deve ser mais conservador em risco do que o de um juvenil — mas",
    "  o temperamento PRÓPRIO dele (" + (a.perfilTemperamento ? PERFIS_TEMPERAMENTO.find((p) => p.v === a.perfilTemperamento).r : "não definido na ficha") + ") nunca é",
    "  substituído por isso. Ajusta-se o grau de risco tático dentro do estilo dele (mais agressivo",
    "  ou mais defensivo), nunca contra o estilo.",
  ];
  if (obj && obj.v === "simples") linhas.push("· Objetivo declarado: simples. Ensine os fundamentos gerais do jogo de simples.");
  if (obj && obj.v === "duplas") linhas.push(
    "· Objetivo declarado: duplas. Ensine os fundamentos gerais do jogo de duplas — posicionamento",
    "  de dupla, saque e devolução voltados à subida à rede, comunicação entre os dois.");
  if (obj && obj.v === "nao") linhas.push(
    "· Não compete: nada de cobrança de resultado ou de exigência técnica alta — mas ele quer",
    "  aprender e melhorar golpes e tática de verdade. Garanta espaço nas aulas pra jogo (ponto",
    "  aplicado) e treino de controle (consistência/rally), não só exercício isolado.");
  /* Disposição é quem ele é na quadra, não o que ele joga (isso é o
     objetivo, acima) — muda o TOM da condução, nunca o conteúdo técnico
     em si nem o grau de exigência definido pelo objetivo. */
  if (a.disposicaoAdulto === "evoluir") linhas.push(
    "· Disposição: quer evoluir de verdade. Pode cobrar correção técnica com mais densidade e",
    "  explicar o porquê de cada uma — ele tolera repetição se enxergar o motivo.");
  if (a.disposicaoAdulto === "manutencao") linhas.push(
    "· Disposição: treina por rotina, saúde e convívio — não por alta exigência técnica. Evite",
    "  excesso de correção seguida ou aula repetitiva demais; ele se desmotiva com isso mesmo",
    "  quando o objetivo declarado pede mais cobrança. Varie o formato do exercício mais do que",
    "  variaria para um aluno do tipo \"quer evoluir de verdade\".");
  if (a.disposicaoAdulto === "competitivo") linhas.push(
    "· Disposição: competitivo por natureza, mesmo sem competir formalmente — não gosta de perder",
    "  ponto nem de exercício sem disputa. Use isso a favor: transforme exercício isolado em jogo",
    "  ou placar sempre que der, em vez de pedir repetição neutra sem contexto de disputa.");
  return linhas;
}

/* Sinal de diagnóstico (não é exclusivo do adulto, mas é ali que mais
   aparece e mais pesa — ver o pedido do treinador). Erra demais pra
   sustentar a troca de bolas é diferente de erro tático: nenhuma
   variedade de exercício ajuda enquanto o jogador não sustenta rally
   nenhum. Isso justifica quebrar, por um tempo, o princípio geral do
   método de não fixar em bate-bola puro — a própria ficha marca que é
   uma EXCEÇÃO deliberada, não o novo padrão do plano inteiro. */
function regrasConsistencia(a) {
  if (!a.dificuldadeConsistencia) return [];
  return [
    "· ALERTA DE CONSISTÊNCIA: a ficha marca que o jogador erra demais pra sustentar a troca de",
    "  bolas — isso é sobre não conseguir manter o ponto vivo, não sobre risco tático. Inclua pelo",
    "  menos um exercício por semana de bate-bola cruzado, só entre jogador e treinador, sem",
    "  variação de alvo nem de trajetória exigida (família DC do catálogo) — o objetivo dele é",
    "  puramente sustentar a troca, não construir padrão de jogo.",
    "· Isto contraria o princípio geral do método de não fixar em bate-bola sem variação — é uma",
    "  exceção deliberada enquanto a consistência não vier, não o novo formato padrão da aula. Não",
    "  remova saque nem devolução do plano por causa disto: eles continuam obrigatórios (regra acima).",
  ];
}

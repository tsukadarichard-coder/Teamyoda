/* ─────────────────────────── geração do macro ─────────────────────────── */
function segundaDaSemana(iso) {
  const d = new Date(iso + "T12:00:00");
  const dia = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dia);
  return d;
}

function fmtData(d) {
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}

function montaFases({ inicio, semanas, competicoes }) {
  const base = segundaDaSemana(inicio);
  const linha = [];
  for (let i = 0; i < semanas; i++) {
    const d = new Date(base);
    d.setDate(d.getDate() + i * 7);
    linha.push({ n: i + 1, data: d, fase: null, evento: null });
  }

  // 1 · semanas de competição
  const idxTorneios = [];
  competicoes.forEach((c) => {
    if (!c.data) return;
    const dc = segundaDaSemana(c.data).getTime();
    const alvo = linha.find((s) => s.data.getTime() === dc);
    if (alvo) {
      alvo.fase = "Torneio";
      alvo.evento = c.nome || "Competição";
      idxTorneios.push(alvo.n - 1);
    }
  });
  idxTorneios.sort((a, b) => a - b);

  // 2 · ponte competitiva entre torneios próximos
  for (let k = 0; k < idxTorneios.length - 1; k++) {
    const vao = idxTorneios[k + 1] - idxTorneios[k];
    if (vao > 1 && vao <= 3) {
      for (let i = idxTorneios[k] + 1; i < idxTorneios[k + 1]; i++)
        if (!linha[i].fase) linha[i].fase = "Ponte competitiva";
    }
  }

  // 3 · afinação antes de cada torneio (2 semanas no primeiro, 1 nos demais)
  idxTorneios.forEach((idx, ordem) => {
    const quantas = ordem === 0 ? 2 : 1;
    let postas = 0;
    for (let i = idx - 1; i >= 0 && postas < quantas; i--) {
      if (!linha[i].fase) {
        linha[i].fase = "Afinação";
        postas++;
      } else break;
    }
  });

  // 4 · regeneração depois de cada torneio (menos o último bloco)
  idxTorneios.forEach((idx, ordem) => {
    if (ordem === idxTorneios.length - 1) return;
    const prox = linha[idx + 1];
    if (prox && !prox.fase) prox.fase = "Regeneração";
  });

  // 5 · última semana: descanso
  const ultima = linha[linha.length - 1];
  if (ultima && (!ultima.fase || ultima.fase === "Ponte competitiva") && idxTorneios.length)
    ultima.fase = "Descanso";

  // 6 · sobra depois do último torneio vira ponte competitiva, não base
  if (idxTorneios.length) {
    const ultimoT = idxTorneios[idxTorneios.length - 1];
    const livresNoFim = linha.slice(ultimoT + 1).filter((s) => !s.fase).length;
    if (livresNoFim <= 2)
      linha.slice(ultimoT + 1).forEach((s) => { if (!s.fase) s.fase = "Ponte competitiva"; });
  }

  // 7 · o que sobrou vira base, em mesociclos de até 3 semanas
  //     (o estímulo dura 3 treinos e roda ao fim de cada mesociclo)
  const ROM = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
  let bloco = 0;
  let corridas = 0;
  let anterior = null;
  linha.forEach((s) => {
    if (!s.fase) {
      if (anterior !== "base" || corridas >= 3) { bloco++; corridas = 0; }
      s.fase = "Base " + ROM[Math.min(bloco - 1, ROM.length - 1)];
      corridas++;
      anterior = "base";
    } else { anterior = "outra"; corridas = 0; }
  });

  return linha;
}

function agrupaFases(linha) {
  const g = [];
  linha.forEach((s) => {
    const ult = g[g.length - 1];
    if (ult && ult.fase === s.fase) {
      ult.fim = s.n;
      if (s.evento) ult.eventos.push(s.evento);
    } else {
      g.push({ fase: s.fase, ini: s.n, fim: s.n, eventos: s.evento ? [s.evento] : [] });
    }
  });
  return g;
}

function montaCiclos(prioridades, estagio) {
  return prioridades.slice(0, 4).map((areaId, i) => {
    const a = AREAS[areaId];
    const chave = EXERCICIOS.filter(
      (e) => a.familias.includes(e.f) && e.e.includes(estagio) && a.busca.test(e.n + " " + e.m)
    ).slice(0, 6);
    const alt = EXERCICIOS.filter((e) => a.familias.includes(e.f) && e.e.includes(estagio)).slice(0, 6);
    return {
      letra: LETRAS[i],
      areaId,
      nome: a.nome,
      estimulos: a.estimulos,
      volume: i < 2 ? 30 : 20,
      exercicios: (chave.length >= 3 ? chave : alt).slice(0, 5),
    };
  });
}

function proporcaoTatica(prioridades) {
  const aberturaPrioritaria =
    prioridades.slice(0, 2).filter((p) => p === "saque" || p === "devolucao").length;
  if (aberturaPrioritaria === 2) return { abertura: 60, media: 25, defesa: 15 };
  if (aberturaPrioritaria === 1) return { abertura: 50, media: 32, defesa: 18 };
  return { abertura: 40, media: 38, defesa: 22 };
}

function montaGrade({ diasQuadra, periodos, escola, musculacao }) {
  const dias = ["SEG", "TER", "QUA", "QUI", "SEX", "SÁB", "DOM"];
  const ativos = dias.slice(0, Math.min(diasQuadra, 6));
  const musDias = ["SEG", "QUA", "SEX"].slice(0, musculacao);
  const manhaEscola = escola === "manha";

  const faixas = [];
  faixas.push({
    hora: "07h00",
    conteudo: dias.map((d) => (d === "DOM" ? "LIVRE" : d === "SÁB" ? "Livre" : "Café + mobilidade")),
  });
  faixas.push({
    hora: manhaEscola ? "13h30–15h30" : "08h00–10h00",
    conteudo: dias.map((d) =>
      d === "DOM" ? "LIVRE" : d === "SÁB" ? "Jogo treino ou físico leve" :
      ativos.includes(d) ? "Quadra: técnica (ciclos)" : "Livre"
    ),
  });
  if (periodos >= 2) {
    faixas.push({
      hora: manhaEscola ? "16h00–17h00" : "10h15–11h15",
      conteudo: dias.map((d) =>
        d === "DOM" || d === "SÁB" ? (d === "DOM" ? "LIVRE" : "—") :
        musDias.includes(d) ? "Musculação" : "Físico específico"
      ),
    });
    faixas.push({
      hora: manhaEscola ? "18h00–20h00" : "15h30–17h30",
      conteudo: dias.map((d, i) =>
        d === "DOM" ? "LIVRE" : d === "SÁB" ? "—" :
        ativos.includes(d) ? (i % 2 === 1 ? "Quadra: tática + sets com regra" : "Quadra: tática") : "Livre"
      ),
    });
  }
  faixas.push({
    hora: "Noite",
    conteudo: dias.map((d) =>
      d === "DOM" ? "Preparar semana" : d === "SÁB" ? "Livre" :
      d === "SEX" ? "Livre (social)" : (escola === "noite" ? "Escola · sono 21h30" : "Estudo · sono 21h30")
    ),
  });
  return { dias, faixas };
}

/* ─────────────────────────── armazenamento ─────────────────────────── */
async function leia(chave, padrao, compartilhado = false) {
  try {
    const r = await window.storage.get(chave, compartilhado);
    return r ? JSON.parse(r.value) : padrao;
  } catch { return padrao; }
}
async function grave(chave, valor, compartilhado = false) {
  try { await window.storage.set(chave, JSON.stringify(valor), compartilhado); }
  catch (e) { console.error("falha ao gravar", e); }
}

/* ─────────────────────────── geração por IA ───────────────────────────
   A chave da Anthropic mora no servidor (function gerar-ia-background).
   Sem conta numa academia, a function recusa antes de gastar um único
   token. Gerar um plano passa fácil dos ~10s que uma function comum tem
   pra responder, então essa roda em segundo plano (até 15 min) e escreve
   o resultado em orgs/{orgId}/iaJobs/{jobId} — o app fica consultando
   até aparecer, em vez de esperar a resposta direto na mesma chamada. */
async function chamarIA(prompt, maxTokens) {
  if (!window.mtyAuth || !window.mtyAuth.usuario()) {
    throw new Error("Entre com sua conta da academia para gerar com IA.");
  }
  const org = await organizacao();
  if (!org) throw new Error("Sua conta ainda não está ligada a uma academia.");

  const jobId = MTY.id("job");
  const token = await window.mtyAuth.tokenId();
  const r = await fetch("/.netlify/functions/gerar-ia-background", {
    method: "POST",
    headers: { "content-type": "application/json", authorization: "Bearer " + token },
    body: JSON.stringify({ prompt, maxTokens, jobId }),
  });
  if (!r.ok && r.status !== 202) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.erro || ("Erro " + r.status));
  }

  const ref = db.collection("orgs").doc(org).collection("iaJobs").doc(jobId);
  const limite = Date.now() + 150000; // até 2min30 esperando a IA terminar
  while (Date.now() < limite) {
    await new Promise((resolver) => setTimeout(resolver, 2500));
    const snap = await ref.get();
    if (snap.exists) {
      const d = snap.data();
      if (d.status === "pronto") { ref.delete().catch(() => {}); return d.texto || ""; }
      if (d.status === "erro") { ref.delete().catch(() => {}); throw new Error(d.erro || "Falha ao gerar."); }
    }
  }
  throw new Error("A IA está demorando mais que o esperado. Tente de novo em instantes.");
}

const GOLPES_ENTRADA = ["Forehand", "Backhand", "Saque", "Devolução", "Jogo de rede"];

/* Texto da ficha para colar numa conversa e gerar o planejamento.
   Campos vazios ou marcados viram item de observação, nunca suposição. */
function relatorioFicha(a) {
  const e = a.entrada || {};
  const v = (k) => {
    if (e[k] === NS) return "[não sei]";
    const t = (e[k] || "").trim();
    return t === "" ? "[em branco]" : t;
  };
  const L = [];
  L.push("FICHA DE ENTRADA · METODOLOGIA MTY");
  L.push("Jogador: " + (a.nome || "sem nome"));
  L.push("Gerada em: " + new Date().toLocaleDateString("pt-BR"));
  L.push("");
  L.push("0 · CONTEXTO");
  L.push("Nascimento: " + (a.nascimento || "—") + " · Estágio: " + a.estagio + " · Nível: " + a.nivel);
  L.push("Lateralidade: " + a.lateralidade + " · Backhand: " + a.backhand);
  L.push("Altura atual/projeção: " + (a.alturaAtual || "—") + " / " + (a.projecaoAltura || "—"));
  L.push("Tipo físico: " + a.tipoFisico + " · Base motora: " + a.baseMotora);
  if ((a.contexto || "").trim()) L.push("Contexto: " + a.contexto.trim());
  L.push("");
  L.push("1 · TÉCNICO");
  GOLPES_ENTRADA.forEach((g) => {
    L.push(g);
    L.push("  funciona: " + v("g_" + g + "_ok"));
    L.push("  falha quando: " + v("g_" + g + "_falha"));
  });
  ENTRADA_BLOCOS.forEach((b) => {
    L.push("");
    L.push(b.n + " · " + b.t.toUpperCase());
    b.campos.forEach(([k, rot]) => L.push(rot + ": " + v(k)));
  });
  L.push("");
  L.push("DIAGNÓSTICO DAS QUATRO CAMADAS");
  [["tecnico", "Técnico"], ["fisico", "Físico"], ["tatico", "Tático"], ["mental", "Mental"]]
    .forEach(([k, r]) => L.push(r + ": " + ((a.camadas[k] || "").trim() || "[em branco]")));
  L.push("");
  L.push("PERFIL E PRIORIDADES");
  L.push("Perfil de corpo: " + (a.perfilCorpo || "[não definido]"));
  L.push("Temperamento: " + (a.perfilTemperamento || "[não definido]"));
  L.push("Prioridades: " + a.prioridades.map((p, i) => (i + 1) + ") " + AREAS[p].nome).join(" · "));
  L.push("Arma do jogador: " + AREAS[a.arma].nome);
  if ((a.objetivoFinal || "").trim()) L.push("Objetivo final: " + a.objetivoFinal.trim());
  L.push("");
  L.push("---");
  L.push("Campos [não sei] ou [em branco] devem entrar no planejamento como item de");
  L.push("observação para a próxima aula, nunca preenchidos por suposição.");
  return L.join("\n");
}

/* ── Princípios travados do método ──
   Viajam junto em todo pedido de planejamento. Sem isso, o texto sai soando
   MTY e contradizendo o método justamente nos pontos que custaram mais caro
   para corrigir. */
const PRINCIPIOS_MTY = [
  "Ordem de diagnóstico travada: técnico, depois físico, depois tático, e só então mental. Nunca inverter.",
  "Três objetivos do jogo, nesta ordem: ganhar a quadra, produzir ângulo, diminuir o tempo.",
  "NUNCA sugerir esperar o adversário errar. Não existe estilo de jogo baseado em esperar o erro do outro.",
  "NUNCA pedir mais efeito na bola de ataque para ela cair dentro. Isso converte ataque em bola de controle. Corrige-se apoio e ponto de contato.",
  "Velocidade da bola no ar é o motor; consistência e acerto são consequência de pernas e decisão.",
  "Saque, devolução e jogo de rede são obrigatoriedades, não estilos opcionais.",
  "Trajetória se define pela função da bola: paralela no ataque busca margem; cruzada para abrir pede mais efeito.",
  "Defesa tem duas formas que coexistem: bola alta para ganhar tempo, e cruzada acelerada. Ambas válidas.",
  "Torneios são checkpoint, não pico. Resultado é efeito colateral da performance, nunca âncora de planejamento.",
  "Trilho é a progressão de ensino: fechado, semiaberto, aberto com regra. Padrão novo nunca entra direto no ponto livre.",
  "Um estímulo dura três treinos; a rotação é parcial ao fim do mesociclo.",
  "Campos marcados [não sei] ou [em branco] viram item de observação para a próxima aula. Nunca preencher por suposição.",
];

/* Índice de exercícios montado a partir do catálogo do próprio app,
   recortado pelo estágio do jogador — o pedido não carrega o que não serve. */
function indiceParaEstagio(estagio) {
  const porFam = {};
  EXERCICIOS.filter((e) => e.e.includes(estagio)).forEach((e) => {
    (porFam[e.f] = porFam[e.f] || []).push(e.c + " " + e.n);
  });
  return Object.keys(porFam).sort().map((f) =>
    f + " (" + (FAM[f] || f) + "): " + porFam[f].join(" · ")).join("\n");
}

function PainelRelatorio({ aluno, aoFechar }) {

    setErroIA(""); setGerando(true); setPlano("");

      setErroIA(String(e.message || e));

function TelaFicha({ aluno, salvar }) {
  const [f, setF] = useState(aluno);
  useEffect(() => setF(aluno), [aluno.id]);
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const setCamada = (k, v) => setF((x) => ({ ...x, camadas: { ...x.camadas, [k]: v } }));
  const ent = (k) => (f.entrada || {})[k] || "";
  const setEnt = (k, v) => setF((x) => ({ ...x, entrada: { ...(x.entrada || {}), [k]: v } }));
  const [mostraRel, setMostraRel] = useState(false);

  const camadaPreenchida = (k) => f.camadas[k].trim().length > 0;
  const liberada = { tecnico: true, fisico: camadaPreenchida("tecnico"), tatico: camadaPreenchida("fisico"), mental: camadaPreenchida("tatico") };

  const alertaMental = useMemo(() => {
    const t = (f.camadas.mental + " " + f.camadas.tatico).toLowerCase();
    const gatilhos = ["insegur", "nervos", "medo", "falta de agressividade", "cabeça", "mole", "trava", "ansios"];
    return gatilhos.some((g) => t.includes(g)) && f.camadas.tecnico.trim().length < 30;
  }, [f.camadas]);

  function mudaLista(campo, i, chave, valor) {
    setF((x) => {
      const l = [...x[campo]];
      l[i] = { ...l[i], [chave]: valor };
      return { ...x, [campo]: l };
    });
  }
  const addLista = (campo, vazio) => setF((x) => ({ ...x, [campo]: [...x[campo], vazio] }));
  const tiraLista = (campo, i) => setF((x) => ({ ...x, [campo]: x[campo].filter((_, k) => k !== i) }));

  function mover(i, passo) {
    setF((x) => {
      const l = [...x.prioridades];
      const j = i + passo;
      if (j < 0 || j >= l.length) return x;
      [l[i], l[j]] = [l[j], l[i]];
      return { ...x, prioridades: l };
    });
  }

  return (
    <div>
      <Secao titulo="Identificação" nota="F-01 do manual: a ficha de avaliação inicial.">
        <Campo rotulo="Nome"><input style={entrada} value={f.nome} onChange={(e) => set("nome", e.target.value)} placeholder="Nome do jogador ou da turma" /></Campo>
        <div className="grid grid-cols-2 gap-3">
          <Campo rotulo="Nascimento"><input type="date" style={entrada} value={f.nascimento} onChange={(e) => set("nascimento", e.target.value)} /></Campo>
          <Campo rotulo="Altura atual / projeção">
            <div className="flex gap-2">
              <input style={entrada} value={f.alturaAtual} onChange={(e) => set("alturaAtual", e.target.value)} placeholder="1,78" />
              <input style={entrada} value={f.projecaoAltura} onChange={(e) => set("projecaoAltura", e.target.value)} placeholder="1,88" />
            </div>
          </Campo>
        </div>
        <Campo rotulo="Lateralidade"><Seletor opcoes={[{ v: "destro", r: "Destro" }, { v: "canhoto", r: "Canhoto" }]} valor={f.lateralidade} aoMudar={(v) => set("lateralidade", v)} /></Campo>
        <Campo rotulo="Backhand"><Seletor opcoes={[{ v: "duas", r: "Duas mãos" }, { v: "uma", r: "Uma mão" }]} valor={f.backhand} aoMudar={(v) => set("backhand", v)} /></Campo>
        <Campo rotulo="Composição física" nota="O tipo de treino se define pelo tipo físico (D-02).">
          <Seletor opcoes={[{ v: "leve", r: "Leve" }, { v: "medio", r: "Médio" }, { v: "forte", r: "Forte" }]} valor={f.tipoFisico} aoMudar={(v) => set("tipoFisico", v)} />
        </Campo>
        <Campo rotulo="Histórico de atividades na infância" nota="Define quanto o bloco de base motora pesa. Trabalho geral igual para todos significa que o diagnóstico não foi feito.">
          <Seletor opcoes={[{ v: "pobre", r: "Pouca variedade" }, { v: "media", r: "Média" }, { v: "rica", r: "Muitos esportes" }]} valor={f.baseMotora} aoMudar={(v) => set("baseMotora", v)} />
        </Campo>
        <Campo rotulo="Contexto familiar e do jogador" nota="Convívio, expectativas, suporte, pressão, relação com o erro e com o esforço.">
          <textarea rows={3} style={{ ...entrada, resize: "vertical" }} value={f.contexto} onChange={(e) => set("contexto", e.target.value)} />
        </Campo>
        <div className="grid grid-cols-2 gap-3">
          <Campo rotulo="Estágio"><Seletor opcoes={ESTAGIOS.map((e) => ({ v: e.s, r: e.s }))} valor={f.estagio} aoMudar={(v) => set("estagio", v)} /></Campo>
          <Campo rotulo="Nível"><Seletor opcoes={NIVEIS.map((n) => ({ v: n, r: n }))} valor={f.nivel} aoMudar={(v) => set("nivel", v)} /></Campo>
        </div>
      </Secao>

      <Secao titulo="Diagnóstico — as quatro camadas" nota="A ordem é técnico, físico, tático, mental, e não pode ser invertida (D-01). Cada camada abre a seguinte.">
        {[["tecnico", "1 · Técnico", "Bases de apoio, golpes por fase, trocas de golpe e de empunhadura"],
          ["fisico", "2 · Físico", "Capacidades associadas às qualidades técnicas"],
          ["tatico", "3 · Tático", "Repertório de decisões disponível, lido à luz das camadas 1 e 2"],
          ["mental", "4 · Mental", "Observações à luz de tudo o que já foi observado"]].map(([k, rot, dica]) => (
          <div key={k} className="mb-4" style={{ opacity: liberada[k] ? 1 : 0.45 }}>
            <div className="mb-2"><Etiqueta cor={liberada[k] ? C.tinta : C.grafite}>{rot}</Etiqueta></div>
            <textarea rows={3} disabled={!liberada[k]} placeholder={liberada[k] ? dica : "Preencha a camada anterior primeiro"}
              style={{ ...entrada, resize: "vertical", background: liberada[k] ? C.cal : C.papel }}
              value={f.camadas[k]} onChange={(e) => setCamada(k, e.target.value)} />
          </div>
        ))}
        {alertaMental && (
          <Aviso>
            Há leitura de estado com pouca evidência técnica registrada. Antes de nomear isso como
            cabeça, verifique se existe ferramenta técnica para a jogada e em que bola da sequência o
            erro acontece. Muito do que parece insegurança é uma base que não sustenta o golpe.
          </Aviso>
        )}
      </Secao>

      <Secao titulo="Perfil de jogo" nota="Parte 6 do manual: o jogo nasce do corpo e do temperamento do jogador — não se escolhe, se reconhece.">
        <Campo rotulo="Perfil de corpo">
          <Seletor opcoes={PERFIS_CORPO.map((p) => ({ v: p.v, r: p.r }))} valor={f.perfilCorpo} aoMudar={(v) => set("perfilCorpo", v)} />
        </Campo>
        {f.perfilCorpo && <p style={{ ...prosa, color: C.grafite, fontSize: 13, marginTop: -6, marginBottom: 14 }}>{PERFIS_CORPO.find((p) => p.v === f.perfilCorpo).d}</p>}
        <Campo rotulo="Temperamento">
          <Seletor opcoes={PERFIS_TEMPERAMENTO.map((p) => ({ v: p.v, r: p.r }))} valor={f.perfilTemperamento} aoMudar={(v) => set("perfilTemperamento", v)} />
        </Campo>
        {f.perfilTemperamento && <p style={{ ...prosa, color: C.grafite, fontSize: 13, marginTop: -6 }}>{PERFIS_TEMPERAMENTO.find((p) => p.v === f.perfilTemperamento).d}</p>}
      </Secao>

      <Secao titulo="Ficha de entrada" nota="Preencha na ordem dos blocos — ela segue o protocolo do método. Onde não souber, marque 'não sei': campo honesto vira item de observação; campo chutado vira erro de diagnóstico.">
        <div className="mb-5">
          <div className="mb-2"><Etiqueta cor={C.tinta}>1 · Técnico, golpe a golpe</Etiqueta></div>
          <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginBottom: 10 }}>
            "Erra o backhand" diz pouco. "Erra o backhand quando a bola vem alta e ele está
            recuando" diz quase tudo.
          </p>
          {GOLPES_ENTRADA.map((g) => (
            <div key={g} style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + C.saibro, padding: "11px 13px", marginBottom: 9 }}>
              <div style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700, marginBottom: 8 }}>{g}</div>
              <CampoEntrada rotulo="Funciona" valor={ent("g_" + g + "_ok")} aoMudar={(v) => setEnt("g_" + g + "_ok", v)} />
              <CampoEntrada rotulo="Falha quando" valor={ent("g_" + g + "_falha")} aoMudar={(v) => setEnt("g_" + g + "_falha", v)} />
            </div>
          ))}
        </div>

        {ENTRADA_BLOCOS.map((b) => (
          <div key={b.n} className="mb-5">
            <div className="mb-2"><Etiqueta cor={C.tinta}>{b.n} · {b.t}</Etiqueta></div>
            <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginBottom: 10 }}>{b.nota}</p>
            {b.campos.map(([k, rot]) => (
              <CampoEntrada key={k} rotulo={rot} valor={ent(k)} aoMudar={(v) => setEnt(k, v)} />
            ))}
          </div>
        ))}

        <Botao variante="vazio" onClick={() => setMostraRel(true)}>Gerar relatório da ficha</Botao>
        <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 8 }}>
          Gera o texto pronto para colar numa conversa com o Claude e montar o planejamento.
        </p>
      </Secao>

      <Secao titulo="Prioridades" nota="A ordem define os ciclos de estímulo do macro e a proporção do volume tático. Arraste pelas setas.">
        {f.prioridades.map((p, i) => (
          <div key={p} className="flex items-center gap-3 mb-2" style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + (i < 2 ? C.saibro : C.linha), padding: "9px 12px" }}>
            <span style={{ fontFamily: ARCH, fontWeight: 700, fontSize: 13, color: i < 2 ? C.saibro : C.grafite, width: 18 }}>{LETRAS[i]}</span>
            <span style={{ ...prosa, flex: 1 }}>{AREAS[p].nome}</span>
            <button onClick={() => mover(i, -1)} style={iconeEstilo}>↑</button>
            <button onClick={() => mover(i, 1)} style={iconeEstilo}>↓</button>
          </div>
        ))}
        <Campo rotulo="Arma do jogador" nota="O que já funciona entra como manutenção, não some do plano.">
          <Seletor opcoes={AREA_OPCOES.map((a) => ({ v: a.id, r: a.nome }))} valor={f.arma} aoMudar={(v) => set("arma", v)} />
        </Campo>
      </Secao>

      <Secao titulo="Horizonte" nota="Planejamento do fim para o começo: o objetivo distante é a bússola de tudo o que vem antes.">
        <Campo rotulo="Objetivo final">
          <input style={entrada} value={f.objetivoFinal} onChange={(e) => set("objetivoFinal", e.target.value)} placeholder="Ex.: os 4 Grand Slams juvenis em 2028" />
        </Campo>
        {f.marcos.map((m, i) => (
          <div key={i} className="mb-2 grid grid-cols-12 gap-2">
            <input style={{ ...entrada, gridColumn: "span 3" }} value={m.ano} onChange={(e) => mudaLista("marcos", i, "ano", e.target.value)} placeholder="Ano" />
            <input style={{ ...entrada, gridColumn: "span 8" }} value={m.marco} onChange={(e) => mudaLista("marcos", i, "marco", e.target.value)} placeholder="Marco intermediário" />
            <button onClick={() => tiraLista("marcos", i)} style={{ ...iconeEstilo, gridColumn: "span 1" }}>×</button>
            <input style={{ ...entrada, gridColumn: "span 12" }} value={m.precisa} onChange={(e) => mudaLista("marcos", i, "precisa", e.target.value)} placeholder="O que precisa estar pronto" />
          </div>
        ))}
        <Botao pequeno variante="vazio" onClick={() => addLista("marcos", { ano: "", marco: "", precisa: "" })}>+ Marco</Botao>
      </Secao>

      <Secao titulo="Calendário e rotina" nota="As datas de competição desenham as fases sozinhas.">
        <div className="grid grid-cols-2 gap-3">
          <Campo rotulo="Início do ciclo"><input type="date" style={entrada} value={f.inicio} onChange={(e) => set("inicio", e.target.value)} /></Campo>
          <Campo rotulo="Semanas"><input type="number" min={4} max={52} style={entrada} value={f.semanas} onChange={(e) => set("semanas", Number(e.target.value))} /></Campo>
        </div>
        <Campo rotulo="Competições">
          {f.competicoes.map((c, i) => (
            <div key={i} className="flex gap-2 mb-2">
              <input style={entrada} value={c.nome} onChange={(e) => mudaLista("competicoes", i, "nome", e.target.value)} placeholder="Nome do torneio" />
              <input type="date" style={{ ...entrada, maxWidth: 160 }} value={c.data} onChange={(e) => mudaLista("competicoes", i, "data", e.target.value)} />
              <button onClick={() => tiraLista("competicoes", i)} style={iconeEstilo}>×</button>
            </div>
          ))}
          <Botao pequeno variante="vazio" onClick={() => addLista("competicoes", { nome: "", data: "" })}>+ Competição</Botao>
        </Campo>
        <Campo rotulo="Dias de quadra por semana"><Seletor opcoes={[3, 4, 5, 6].map((d) => ({ v: d, r: d + " dias" }))} valor={f.diasQuadra} aoMudar={(v) => set("diasQuadra", v)} /></Campo>
        <Campo rotulo="Períodos por dia"><Seletor opcoes={[{ v: 1, r: "Um" }, { v: 2, r: "Dois" }]} valor={f.periodos} aoMudar={(v) => set("periodos", v)} /></Campo>
        <Campo rotulo="Escola"><Seletor opcoes={[{ v: "manha", r: "Manhã" }, { v: "tarde", r: "Tarde" }, { v: "noite", r: "Noite" }, { v: "nao", r: "Não estuda" }]} valor={f.escola} aoMudar={(v) => set("escola", v)} /></Campo>
        <Campo rotulo="Musculação por semana"><Seletor opcoes={[0, 1, 2, 3].map((n) => ({ v: n, r: String(n) }))} valor={f.musculacao} aoMudar={(v) => set("musculacao", v)} /></Campo>
      </Secao>

      {mostraRel && <PainelRelatorio aluno={f} aoFechar={() => setMostraRel(false)} />}

      <Botao onClick={() => salvar(f)} variante="saibro">Salvar ficha</Botao>
    </div>
  );
}

/* ─────────────────────────── periodização ─────────────────────────── */
function exportaMarkdown(a, fases, grupos, ciclos, prop, grade) {
  const L = [];
  L.push(`# Planejamento e periodização — ${a.nome || "sem nome"}`);
  L.push(`\n${a.semanas} semanas · início ${a.inicio || "—"} · estágio ${a.estagio} · nível ${a.nivel}\n`);
  if (a.objetivoFinal) L.push(`**Objetivo final:** ${a.objetivoFinal}\n`);
  L.push("## Visão geral: do fim para o começo\n");
  L.push("| Horizonte | Marco | O que precisa estar pronto |");
  L.push("|---|---|---|");
  a.marcos.filter((m) => m.marco).forEach((m) => L.push(`| ${m.ano} | ${m.marco} | ${m.precisa} |`));
  L.push(`| Este documento | Periodização de ${a.semanas} semanas | ${grupos.length} blocos |\n`);
  L.push("## Os blocos do ciclo\n");
  L.push("| Semanas | Fase | Função |");
  L.push("|---|---|---|");
  grupos.forEach((g) => L.push(`| ${g.ini === g.fim ? g.ini : g.ini + "–" + g.fim} | ${g.fase}${g.eventos.length ? " · " + g.eventos.join(", ") : ""} | ${FUNCAO_FASE[g.fase] || ""} |`));
  L.push("\n## Semana-padrão dos mesociclos de base\n");
  L.push("| Horário | " + grade.dias.join(" | ") + " |");
  L.push("|" + "---|".repeat(grade.dias.length + 1));
  grade.faixas.forEach((fx) => L.push("| " + fx.hora + " | " + fx.conteudo.join(" | ") + " |"));
  L.push(`\n## A proporção tática\n\n${prop.abertura}% do volume tático nos padrões de abertura, ${prop.media}% nas trocas médias, ${prop.defesa}% na defesa longa.\n`);
  L.push("## Os ciclos de estímulo\n");
  L.push("Regra: cada estímulo mantido por 3 treinos; rotação parcial ao fim de cada mesociclo — nunca os dois estímulos de um ciclo ao mesmo tempo.\n");
  L.push("| Ciclo | Estímulo 1 | Estímulo 2 | Exercícios-chave |");
  L.push("|---|---|---|---|");
  ciclos.forEach((c) => L.push(`| ${c.letra} — ${c.nome} | ${c.estimulos[0]} | ${c.estimulos[1]} | ${c.exercicios.map((e) => e.c).join(" · ")} |`));
  L.push("\n## Critérios tangíveis de avaliação\n");
  ciclos.forEach((c) => {
    L.push(`\n### ${AREAS[c.areaId].nome}\n`);
    L.push("| Métrica | Como medir | Base | Meta |");
    L.push("|---|---|---|---|");
    AREAS[c.areaId].metricas.forEach((m) => L.push(`| ${m[0]} | ${m[1]} | medir na semana 1 | ${m[2]} |`));
  });
  L.push("\n---\n");
  L.push("O número orienta a direção; o olhar decide o dia. Nenhum tenista é um robô.");
  return L.join("\n");
}

function TelaPeriodizacao({ aluno }) {
  const pronto = aluno.inicio && aluno.semanas >= 4;
  const fases = useMemo(() => (pronto ? montaFases(aluno) : []), [aluno]);
  const grupos = useMemo(() => agrupaFases(fases), [fases]);
  const ciclos = useMemo(() => montaCiclos(aluno.prioridades, aluno.estagio), [aluno]);
  const prop = proporcaoTatica(aluno.prioridades);
  const grade = montaGrade(aluno);

  if (!pronto)
    return <Aviso>Defina a data de início e o número de semanas na ficha para desenhar as fases.</Aviso>;

  const dados = fases.map((s) => ({
    n: s.n, rotulo: "S" + s.n,
    volume: PERFIL_FASE[s.fase]?.vol ?? 60,
    intensidade: PERFIL_FASE[s.fase]?.int ?? 50,
    fase: s.fase,
  }));

  function baixar() {
    const md = exportaMarkdown(aluno, fases, grupos, ciclos, prop, grade);
    const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `periodizacao-${(aluno.nome || "jogador").toLowerCase().replace(/\s+/g, "-")}.md`;
    a.click();
    URL.revokeObjectURL(url);
  }

  return (
    <div>
      <Secao titulo="O ciclo em uma imagem" nota="O volume sobe nos mesociclos de base e cai nas semanas de afinação e torneio; a intensidade faz o caminho oposto e chega ao pico exatamente na competição. Nenhuma semana combina volume máximo com intensidade máxima — é essa separação que protege o corpo.">
        <div style={{ height: 210, marginLeft: -18 }}>
          <ResponsiveContainer width="100%" height="100%">
            <ComposedChart data={dados}>
              {grupos.map((g, i) => (
                <ReferenceArea key={i} x1={"S" + g.ini} x2={"S" + g.fim}
                  fill={PERFIL_FASE[g.fase]?.cor || C.grafite} fillOpacity={0.07} />
              ))}
              <XAxis dataKey="rotulo" tick={{ fontSize: 9, fontFamily: ARCH, fill: C.grafite }} interval={0} />
              <YAxis tick={{ fontSize: 9, fontFamily: ARCH, fill: C.grafite }} width={28} />
              <Tooltip contentStyle={{ fontFamily: ARCH, fontSize: 12, borderRadius: 2, border: "1px solid " + C.linha }}
                formatter={(v, n) => [v, n === "volume" ? "Volume" : "Intensidade"]} />
              <Area type="monotone" dataKey="volume" stroke={C.quadra} fill={C.quadra} fillOpacity={0.16} strokeWidth={2} />
              <Line type="monotone" dataKey="intensidade" stroke={C.saibro} strokeWidth={2} dot={false} />
            </ComposedChart>
          </ResponsiveContainer>
        </div>
        <div className="flex gap-4 mt-1">
          <Etiqueta cor={C.quadra}>▬ Volume</Etiqueta>
          <Etiqueta cor={C.saibro}>▬ Intensidade</Etiqueta>
        </div>
      </Secao>

      <Secao titulo="Os blocos do ciclo">
        <Tabela cabecalho={["Semanas", "Fase", "Função"]} larguras={["18%", "26%", "56%"]}
          linhas={grupos.map((g) => [
            <span style={{ fontFamily: ARCH, fontWeight: 700 }}>{g.ini === g.fim ? g.ini : `${g.ini}–${g.fim}`}</span>,
            <span style={{ color: PERFIL_FASE[g.fase]?.cor }}>{g.fase}{g.eventos.length ? ` · ${g.eventos.join(", ")}` : ""}</span>,
            FUNCAO_FASE[g.fase] || "",
          ])} />
      </Secao>

      <Secao titulo="A semana-padrão" nota="Vale nos mesociclos de base. Muda nas semanas de afinação, competição e regeneração.">
        <Tabela cabecalho={["Horário", ...grade.dias]}
          linhas={grade.faixas.map((fx) => [
            <span style={{ fontFamily: ARCH, fontSize: 11, fontWeight: 600 }}>{fx.hora}</span>,
            ...fx.conteudo.map((c) => <span style={{ fontSize: 12.5, color: c === "LIVRE" ? C.grafite : C.tinta }}>{c}</span>),
          ])} larguras={["12%"]} />
        <div className="mt-4">
          <Aviso cor={C.quadra}>
            Duas coisas não mudam em nenhuma semana: domingo é inteiramente livre, porque a
            regeneração é parte do treino e não ausência dele; e os registros do jogador são
            preenchidos ao fim de cada período de quadra, em menos de dois minutos.
          </Aviso>
        </div>
      </Secao>

      <Secao titulo="A proporção tática" nota="Cerca de 70% dos pontos do circuito têm até quatro golpes. O treino espelha isso — e concentra o volume nas duas maiores lacunas.">
        <div className="flex" style={{ height: 42, marginBottom: 10 }}>
          {[["abertura", "Padrões de abertura", C.saibro], ["media", "Trocas médias", C.quadra], ["defesa", "Defesa longa", C.grafite]].map(([k, rot, cor]) => (
            <div key={k} style={{ width: prop[k] + "%", background: cor, color: "#fff", fontFamily: ARCH, fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", borderRight: "2px solid " + C.papel }}>
              {prop[k]}%
            </div>
          ))}
        </div>
        <p style={{ ...prosa, fontSize: 13.5, color: C.grafite }}>
          {prop.abertura}% nos padrões de abertura — saque, devolução e a bola seguinte —,{" "}
          {prop.media}% nas trocas médias onde os games se decidem, {prop.defesa}% na defesa longa. A
          troca longa não é abolida; ela deixa de ocupar o lugar que os dados dão às quatro
          primeiras bolas.
        </p>
      </Secao>

      <Secao titulo="Os ciclos de estímulo" nota="Cada estímulo é mantido por três treinos; a rotação é parcial ao fim de cada mesociclo. Nunca os dois estímulos de um ciclo ao mesmo tempo.">
        {ciclos.map((c) => (
          <div key={c.letra} className="mb-6">
            <div className="flex items-baseline gap-3 mb-2">
              <span style={{ fontFamily: ARCH, fontSize: 22, fontWeight: 700, color: C.saibro }}>{c.letra}</span>
              <h3 style={{ fontFamily: ARCH, fontSize: 15.5, fontWeight: 700, flex: 1 }}>{c.nome}</h3>
              <Etiqueta>{c.volume}% do volume</Etiqueta>
            </div>
            <Tabela cabecalho={["Estímulo 1", "Estímulo 2"]} linhas={[[c.estimulos[0], c.estimulos[1]]]} />
            <div className="mt-3">
              {c.exercicios.map((e) => <CartaoExercicio key={e.c} e={e} />)}
              {!c.exercicios.length && (
                <p style={{ ...prosa, fontSize: 13, color: C.saibro }}>
                  Nenhum exercício do catálogo atende a esta área no estágio {aluno.estagio}.
                </p>
              )}
            </div>
          </div>
        ))}
      </Secao>

      <Secao titulo="Critérios tangíveis de avaliação" nota="Cada critério tem linha de base medida na semana 1 e meta ao fim do primeiro mesociclo. Números são referência de direção, não sentença: a reavaliação é feita com o atleta.">
        {ciclos.map((c) => (
          <div key={c.letra} className="mb-6">
            <h3 style={{ fontFamily: ARCH, fontSize: 14.5, fontWeight: 700, marginBottom: 8 }}>{AREAS[c.areaId].nome}</h3>
            <Tabela cabecalho={["Métrica", "Como medir", "Base", "Meta"]} larguras={["30%", "34%", "14%", "22%"]}
              linhas={AREAS[c.areaId].metricas.map((m) => [m[0], m[1], "medir", <b>{m[2]}</b>])} />
          </div>
        ))}
        <p style={{ ...prosa, fontSize: 13.5, color: C.grafite }}>
          <b>Critério de rotação:</b> ao fim da primeira semana de regeneração, o estímulo com metas
          atingidas e consolidadas sai; entra o próximo da fila, definida pelo que a competição
          revelar. Os demais permanecem.
        </p>
      </Secao>

const BLOCOS = [
  { id: 1, nome: "Base motora e entrada", familias: ["CO", "CF", "MV"], porque: "Entrada em movimento. Também é o destino da regressão à raiz." },
  { id: 2, nome: "Fundamento do ciclo", familias: ["FB", "DC"], porque: "O fundamento da semana, distribuído — nunca insistido numa sessão só." },
  { id: 3, nome: "Início do ponto", familias: ["IP", "PDS"], porque: "Saque e devolução nunca separados do que vem depois." },
  { id: 4, nome: "Tema do ciclo", familias: null, porque: "O estímulo ativo do ciclo nesta semana." },
  { id: 5, nome: "Jogo aplicado", familias: ["JA", "ADV", "DM"], porque: "A regra existe para forçar o tema, não para premiar a bola dentro." },
];

function fatiaInicio(nivel) {
  const i = NIVEIS.indexOf(nivel);
  return i <= 1 ? 0.25 : i <= 3 ? 0.3 : 0.35;
}

function sorteia(lista, evitar, n) {
  const frescos = lista.filter((e) => !evitar.has(e.c));
  const fonte = frescos.length >= n ? frescos : lista;
  const copia = [...fonte], saida = [];
  while (saida.length < n && copia.length) saida.push(copia.splice(Math.floor(Math.random() * copia.length), 1)[0]);
  return saida;
}

function TelaSessao({ aluno, alunos, setAlunos }) {
  const [cicloAtivo, setCiclo] = useState(0);
  const [duracao, setDuracao] = useState(90);
  const [plano, setPlano] = useState(null);
  const [divergencias, setDivergencias] = useState([]);
  const [fechando, setFechando] = useState(false);
  const [obs, setObs] = useState({ corrigi: "", ignorei: "", mudaria: "", nota: 3 });
  const ciclos = useMemo(() => montaCiclos(aluno.prioridades, aluno.estagio), [aluno]);

  const pesoBase = aluno.baseMotora === "pobre" ? 0.2 : aluno.baseMotora === "rica" ? 0.1 : 0.15;

  function gerar() {
    const evitar = new Set(aluno.historico.slice(-2).flat());
    const f3 = fatiaInicio(aluno.nivel);
    const areaCiclo = AREAS[ciclos[cicloAtivo].areaId];
    const pesos = [pesoBase, 0.2, f3, 0.2, Math.max(0.1, 1 - (pesoBase + 0.4 + f3))];
    setDivergencias([]);
    setPlano(
      BLOCOS.map((b, i) => {
        const familias = b.id === 4 ? areaCiclo.familias : b.familias;
        const pool = EXERCICIOS.filter((e) => familias.includes(e.f) && e.e.includes(aluno.estagio));
        const min = Math.round(duracao * pesos[i]);
        return { ...b, familias, minutos: min, percentual: Math.round(pesos[i] * 100), exercicios: sorteia(pool, evitar, min >= 18 ? 2 : 1) };
      })
    );
  }

  function trocar(id, i) {
    setPlano((p) => p.map((b) => {
      if (b.id !== id) return b;
      const usados = new Set(p.flatMap((x) => x.exercicios.map((e) => e.c)));
      const pool = EXERCICIOS.filter((e) => b.familias.includes(e.f) && e.e.includes(aluno.estagio) && !usados.has(e.c));
      if (!pool.length) return b;
      const novo = pool[Math.floor(Math.random() * pool.length)];
      const saiu = b.exercicios[i];
      setDivergencias((d) => [...d, { bloco: b.nome, tipo: "troca", saiu: saiu.c, entrou: novo.c }]);
      return { ...b, exercicios: b.exercicios.map((e, k) => (k === i ? novo : e)) };
    }));
  }

  function remover(id, i) {
    setPlano((p) => p.map((b) => {
      if (b.id !== id) return b;
      setDivergencias((d) => [...d, { bloco: b.nome, tipo: "corte", saiu: b.exercicios[i].c }]);
      return { ...b, exercicios: b.exercicios.filter((_, k) => k !== i) };
    }));
  }

  function registrar() {
    const cods = plano.flatMap((b) => b.exercicios.map((e) => e.c));
    const reg = {
      id: "r" + Date.now(), tipo: "sessao", data: new Date().toISOString().slice(0, 10),
      ciclo: ciclos[cicloAtivo].letra + " · " + ciclos[cicloAtivo].nome,
      duracao, exercicios: cods, divergencias, ...obs,
    };
    setAlunos(alunos.map((a) => a.id === aluno.id
      ? { ...a, historico: [...a.historico, cods], registros: [...(a.registros || []), reg] }
      : a));
    setPlano(null); setFechando(false); setDivergencias([]);
    setObs({ corrigi: "", ignorei: "", mudaria: "", nota: 3 });
  }

  const total = plano ? plano.reduce((s, b) => s + b.minutos, 0) : 1;
  const pctIP = plano ? Math.round((plano[2].minutos / total) * 100) : 0;
  const dentro = pctIP >= 25 && pctIP <= 35;

  return (
    <div>
      <Campo rotulo="Ciclo ativo hoje" nota="O caderno do treinador manda decidir isto antes de entrar na quadra.">
        <Seletor opcoes={ciclos.map((c, i) => ({ v: i, r: `${c.letra} · ${c.nome}` }))} valor={cicloAtivo} aoMudar={setCiclo} />
      </Campo>
      <Campo rotulo="Duração">
        <Seletor opcoes={[45, 60, 90, 120].map((d) => ({ v: d, r: d + " min" }))} valor={duracao} aoMudar={setDuracao} />
      </Campo>
      <Botao onClick={gerar} variante="saibro">{plano ? "Gerar outra proposta" : "Gerar sessão"}</Botao>

      {plano && (
        <div className="mt-7">
          <div className="flex gap-4 mb-6">
            <div className="flex flex-col" style={{ width: 10, minHeight: 170 }}>
              {plano.map((b) => (
                <div key={b.id} title={b.nome} style={{ flexGrow: b.minutos, background: b.id === 3 ? C.saibro : C.quadra, opacity: b.id === 3 ? 1 : 0.2 + b.id * 0.06, borderBottom: "2px solid " + C.papel }} />
              ))}
            </div>
            <div className="flex-1 self-center">
              <div style={{ fontFamily: ARCH, fontSize: 32, fontWeight: 700, lineHeight: 1, color: dentro ? C.tinta : C.saibro }}>{pctIP}%</div>
              <p style={{ ...prosa, fontSize: 13.5, color: C.grafite, marginTop: 4 }}>
                da sessão em início do ponto.{" "}
                {dentro ? "Dentro da faixa do método (25–35%)." : <span style={{ color: C.saibro }}>Fora da faixa de 25–35%.</span>}
              </p>
            </div>
          </div>

          {plano.map((b) => (
            <div key={b.id} className="mb-6">
              <div className="flex items-baseline justify-between gap-3 mb-1">
                <h3 style={{ fontFamily: ARCH, fontSize: 15, fontWeight: 700 }}>
                  <span style={{ color: b.id === 3 ? C.saibro : C.grafite, marginRight: 8 }}>{b.id}</span>{b.nome}
                </h3>
                <Etiqueta cor={b.id === 3 ? C.saibro : C.grafite}>{b.minutos} min · {b.percentual}%</Etiqueta>
              </div>
              <p style={{ ...prosa, fontSize: 13, color: C.grafite, marginBottom: 9 }}>{b.porque}</p>
              {b.exercicios.map((e, i) => (
                <CartaoExercicio key={e.c} e={e} aoTrocar={() => trocar(b.id, i)} aoRemover={() => remover(b.id, i)} />
              ))}
            </div>
          ))}
          {divergencias.length > 0 && (
            <Aviso cor={C.quadra}>
              {divergencias.length} {divergencias.length === 1 ? "mudança sua" : "mudanças suas"} sobre
              a proposta {divergencias.length === 1 ? "foi registrada" : "foram registradas"}. Toda vez
              que você recusa uma escolha do sistema, é a regra que está errada — não você.
            </Aviso>
          )}

          {!fechando ? (
            <Botao onClick={() => setFechando(true)}>Fechar a sessão</Botao>
          ) : (
            <div style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + C.saibro, padding: 16 }}>
              <div className="mb-3"><Etiqueta cor={C.saibro}>Menos de dois minutos, ainda na quadra</Etiqueta></div>
              <Campo rotulo="O que corrigi hoje">
                <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={obs.corrigi}
                  onChange={(e) => setObs({ ...obs, corrigi: e.target.value })}
                  placeholder="Em que camada estava a causa" />
              </Campo>
              <Campo rotulo="O que vi e deixei passar" nota="O campo mais valioso do registro: o que você escolheu ignorar hoje, e por quê.">
                <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={obs.ignorei}
                  onChange={(e) => setObs({ ...obs, ignorei: e.target.value })} />
              </Campo>
              <Campo rotulo="O que eu teria montado diferente" nota="Se a proposta não servia, escreva o que serviria. É isso que corrige as regras.">
                <textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={obs.mudaria}
                  onChange={(e) => setObs({ ...obs, mudaria: e.target.value })} />
              </Campo>
              <Campo rotulo="Presença do jogador na sessão">
                <Seletor opcoes={[1, 2, 3, 4, 5].map((n) => ({ v: n, r: String(n) }))} valor={obs.nota}
                  aoMudar={(v) => setObs({ ...obs, nota: v })} />
              </Campo>
              <Botao onClick={registrar} variante="saibro">Salvar no caderno</Botao>
            </div>
          )}
        </div>
      )}
    </div>
  );
}



/* ─────────────────────────── scout de partida ─────────────────────────── */
const PONTOS_TENIS = ["0", "15", "30", "40"];

function placarInicial(formato, sacaPrimeiro) {
  return {
    formato, p: [0, 0], g: [0, 0], sets: [], saque: sacaPrimeiro,
    tiebreak: false, fim: false, vencedor: null,
  };
}

function rotuloPontos(e) {
  if (e.tiebreak) return `${e.p[0]}-${e.p[1]}`;
  const [a, b] = e.p;
  if (a >= 3 && b >= 3) {
    if (a === b) return "40-40";
    return a > b ? "AD-40" : "40-AD";
  }
  return `${PONTOS_TENIS[a]}-${PONTOS_TENIS[b]}`;
}

/* placar adverso: adversário à frente no game, ou nós atrás em games no set */
function ehAdverso(e) {
  if (e.p[1] > e.p[0]) return true;
  if (e.g[1] > e.g[0]) return true;
  return false;
}

function gamesParaSet(formato) {
  return formato === "4games" ? 4 : 6;
}

function aplicaPonto(e0, nos) {
  const e = { ...e0, p: [...e0.p], g: [...e0.g], sets: [...e0.sets] };
  if (e.fim) return e;
  const i = nos ? 0 : 1, j = nos ? 1 : 0;
  e.p[i]++;

  const alvoGames = gamesParaSet(e.formato);

  function fechaGame(quem) {
    e.g[quem]++;
    e.p = [0, 0];
    e.saque = e.saque === "nos" ? "ele" : "nos";
    const o = quem === 0 ? 1 : 0;
    if (e.g[quem] >= alvoGames && e.g[quem] - e.g[o] >= 2) fechaSet(quem);
    else if (e.g[0] === alvoGames && e.g[1] === alvoGames) e.tiebreak = true;
  }
  function fechaSet(quem) {
    e.sets.push([e.g[0], e.g[1]]);
    e.g = [0, 0];
    e.tiebreak = false;
    const meus = e.sets.filter((s) => s[0] > s[1]).length;
    const dele = e.sets.filter((s) => s[1] > s[0]).length;
    const preciso = e.formato === "3sets" ? 2 : 1;
    if (meus >= preciso || dele >= preciso) {
      e.fim = true;
      e.vencedor = meus > dele ? "nos" : "ele";
    }
  }

  if (e.tiebreak) {
    if (e.p[i] >= 7 && e.p[i] - e.p[j] >= 2) {
      e.g[i]++;
      e.p = [0, 0];
      fechaSet(i);
    }
  } else if (e.p[i] >= 4 && e.p[i] - e.p[j] >= 2) {
    fechaGame(i);
  }
  return e;
}

function TelaScout({ aluno, alunos, setAlunos }) {
  const [fase, setFase] = useState("antes");
  const [cfg, setCfg] = useState({ adversario: "", torneio: "", formato: "3sets", saca: "nos" });
  const [placar, setPlacar] = useState(null);
  const [pontos, setPontos] = useState([]);
  const [rascunho, setRascunho] = useState(null);
  const [pilha, setPilha] = useState([]);

  function comecar() {
    setPlacar(placarInicial(cfg.formato, cfg.saca));
    setPontos([]);
    setPilha([]);
    setFase("durante");
  }

  function escolheFim(op) {
    setRascunho({
      fim: op.v, nos: op.nos, saque: null, bola: null, causa: null,
      protocolo: false, rede: false, ataquePerdido: false,
      adverso: ehAdverso(placar), sacador: placar.saque,
    });
  }

  function confirma(bola) {
    const p = { ...rascunho, bola, n: pontos.length + 1, placarAntes: rotuloPontos(placar) };
    setPilha([...pilha, { placar, pontos }]);
    setPontos([...pontos, p]);
    setPlacar(aplicaPonto(placar, p.nos));
    setRascunho(null);
  }

  function desfazer() {
    if (rascunho) { setRascunho(null); return; }
    const ult = pilha[pilha.length - 1];
    if (!ult) return;
    setPlacar(ult.placar);
    setPontos(ult.pontos);
    setPilha(pilha.slice(0, -1));
  }

  const setsTexto = placar
    ? [...placar.sets.map((x) => `${x[0]}-${x[1]}`), `${placar.g[0]}-${placar.g[1]}`].join("  ")
    : "";

  /* ── antes ── */
  if (fase === "antes")
    return (
      <div>
        <Aviso cor={C.quadra}>
          Dois toques por ponto: como terminou e em que bola. O placar se calcula sozinho, para que
          o jogo sob placar adverso possa ser lido depois.
        </Aviso>
        <Campo rotulo="Adversário">
          <input style={entrada} value={cfg.adversario} onChange={(e) => setCfg({ ...cfg, adversario: e.target.value })} />
        </Campo>
        <Campo rotulo="Torneio">
          <input style={entrada} value={cfg.torneio} onChange={(e) => setCfg({ ...cfg, torneio: e.target.value })} placeholder="Torneio ou jogo-treino" />
        </Campo>
        <Campo rotulo="Formato">
          <Seletor opcoes={[{ v: "3sets", r: "Melhor de 3" }, { v: "1set", r: "Set único" }, { v: "4games", r: "Set a 4 games" }]}
            valor={cfg.formato} aoMudar={(v) => setCfg({ ...cfg, formato: v })} />
        </Campo>
        <Campo rotulo="Quem saca primeiro">
          <Seletor opcoes={[{ v: "nos", r: "Meu jogador" }, { v: "ele", r: "Adversário" }]}
            valor={cfg.saca} aoMudar={(v) => setCfg({ ...cfg, saca: v })} />
        </Campo>
        <Botao onClick={comecar} variante="saibro">Começar a coleta</Botao>
      </div>
    );

  /* ── relatório ── */
  if (fase === "depois")
    return <Relatorio aluno={aluno} alunos={alunos} setAlunos={setAlunos} cfg={cfg}
      pontos={pontos} placar={placar} aoSair={() => { setFase("antes"); setPontos([]); }} />;

  /* ── durante ── */
  const nossoSaque = placar.saque === "nos";
  const adverso = ehAdverso(placar);

  return (
    <div>
      <div style={{ position: "sticky", top: 96, background: C.papel, paddingBottom: 10, zIndex: 5 }}>
        <div style={{ background: C.tinta, color: C.papel, padding: "12px 15px", borderRadius: 2 }}>
          <div className="flex items-center justify-between">
            <div>
              <div style={{ fontFamily: ARCH, fontSize: 10, letterSpacing: "0.14em", opacity: 0.7 }}>
                {nossoSaque ? "SAQUE DO MEU JOGADOR" : "SAQUE DO ADVERSÁRIO"}
              </div>
              <div style={{ fontFamily: ARCH, fontSize: 30, fontWeight: 700, lineHeight: 1.1 }}>
                {rotuloPontos(placar)}
              </div>
            </div>
            <div className="text-right">
              <div style={{ fontFamily: ARCH, fontSize: 10, letterSpacing: "0.14em", opacity: 0.7 }}>SETS</div>
              <div style={{ fontFamily: ARCH, fontSize: 17, fontWeight: 600 }}>{setsTexto}</div>
            </div>
          </div>
          {adverso && (
            <div className="mt-2" style={{ fontFamily: ARCH, fontSize: 11, fontWeight: 700, color: "#FF8DA1" }}>
              PLACAR ADVERSO — este ponto entra na comparação
            </div>
          )}
        </div>
      </div>

      {placar.fim && (
        <Aviso>
          Partida encerrada. {pontos.length} pontos coletados.{" "}
          <button onClick={() => setFase("depois")} style={{ textDecoration: "underline", cursor: "pointer" }}>
            Ver o relatório
          </button>
        </Aviso>
      )}

      {nossoSaque && !rascunho && (
        <div className="mb-4">
          <div className="mb-2"><Etiqueta>Saque (opcional)</Etiqueta></div>
          <div className="flex gap-2">
            {[["1", "1º dentro"], ["2", "2º dentro"], ["df", "Dupla falta"]].map(([v, r]) => (
              <button key={v}
                onClick={() => {
                  if (v === "df") {
                    setPilha([...pilha, { placar, pontos }]);
                    const p = { fim: "erro_nos", nos: false, saque: "df", bola: "1-2", causa: "execucao",
                      protocolo: false, rede: false, ataquePerdido: false, adverso, sacador: "nos",
                      n: pontos.length + 1, placarAntes: rotuloPontos(placar) };
                    setPontos([...pontos, p]);
                    setPlacar(aplicaPonto(placar, false));
                  } else setRascunho({ saquePre: v });
                }}
                style={{ flex: 1, fontFamily: ARCH, fontSize: 13, fontWeight: 600, padding: "12px 6px",
                  border: "1px solid " + (v === "df" ? C.saibro : C.linha), borderRadius: 2,
                  background: C.cal, color: v === "df" ? C.saibro : C.tinta, cursor: "pointer" }}>
                {r}
              </button>
            ))}
          </div>
        </div>
      )}

      {!rascunho?.fim && (
        <div>
          <div className="mb-2"><Etiqueta>Como o ponto terminou</Etiqueta></div>
          <div className="grid grid-cols-2 gap-2 mb-4">

              <button key={op.v}
                onClick={() => setRascunho({ ...(rascunho || {}), ...{
                  fim: op.v, nos: op.nos, saque: rascunho?.saquePre || null, bola: null, causa: null,
                  protocolo: false, rede: false, ataquePerdido: false, adverso, sacador: placar.saque } })}
                style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700, padding: "20px 8px",
                  border: "1px solid " + op.cor, borderRadius: 2, background: C.cal, color: op.cor, cursor: "pointer" }}>
                {op.r}
              </button>
            ))}
          </div>
        </div>
      )}

      {rascunho?.fim && (
        <div style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + C.saibro, padding: 15 }}>
          <div className="mb-3">
            <Etiqueta cor={C.saibro}>{FIM_PONTO.find((o) => o.v === rascunho.fim).r}</Etiqueta>
          </div>

          {rascunho.fim === "erro_nos" && (
            <Campo rotulo="A causa" nota="Decisão errada e execução errada não se corrigem juntas.">
              <Seletor opcoes={[{ v: "decisao", r: "Decisão" }, { v: "execucao", r: "Execução" }]}
                valor={rascunho.causa} aoMudar={(v) => setRascunho({ ...rascunho, causa: v })} />
            </Campo>
          )}

          <div className="flex flex-wrap gap-2 mb-4">
            {[["protocolo", "Protocolo antes do ponto"], ["rede", "Subiu à rede"], ["ataquePerdido", "Demanda de ataque não convertida"]].map(([k, r]) => (
              <button key={k} onClick={() => setRascunho({ ...rascunho, [k]: !rascunho[k] })}
                style={{ fontFamily: ARCH, fontSize: 12, fontWeight: 600, padding: "7px 11px", borderRadius: 2,
                  cursor: "pointer", border: "1px solid " + (rascunho[k] ? C.tinta : C.linha),
                  background: rascunho[k] ? C.tinta : C.cal, color: rascunho[k] ? C.papel : C.grafite }}>
                {rascunho[k] ? "✓ " : ""}{r}
              </button>
            ))}
          </div>

          <div className="mb-2"><Etiqueta>Em que bola o ponto terminou</Etiqueta></div>
          <div className="grid grid-cols-3 gap-2">
            {["1-2", "3-4", "5+"].map((b) => (
              <button key={b} onClick={() => confirma(b)}
                style={{ fontFamily: ARCH, fontSize: 16, fontWeight: 700, padding: "18px 6px", borderRadius: 2,
                  cursor: "pointer", border: "1px solid " + C.tinta, background: C.tinta, color: C.papel }}>
                {b}
              </button>
            ))}
          </div>
        </div>
      )}

      <div className="flex items-center justify-between mt-6">
        <Etiqueta>{pontos.length} pontos</Etiqueta>
        <div className="flex gap-2">
          <Botao pequeno variante="vazio" onClick={desfazer}>Desfazer</Botao>
          <Botao pequeno onClick={() => setFase("depois")}>Encerrar e ver relatório</Botao>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────── relatório ─────────────────────────── */
function resume(pontos) {
  const n = pontos.length || 1;
  const conta = (f) => pontos.filter(f).length;
  const pct = (x) => Math.round((x / n) * 100);

  const curtos = conta((p) => p.bola === "1-2");
  const medios = conta((p) => p.bola === "3-4");
  const longos = conta((p) => p.bola === "5+");
  const ganhos = conta((p) => p.nos);
  const errosNos = pontos.filter((p) => p.fim === "erro_nos");
  const errosDecisao = errosNos.filter((p) => p.causa === "decisao").length;
  const errosExec = errosNos.filter((p) => p.causa === "execucao").length;
  const errosCurtos = errosNos.filter((p) => p.bola === "1-2").length;

  const meusSaques = pontos.filter((p) => p.sacador === "nos");
  const df = meusSaques.filter((p) => p.saque === "df");
  const dfAdverso = df.filter((p) => p.adverso).length;
  const saquesAdverso = meusSaques.filter((p) => p.adverso).length || 1;
  const saquesNeutro = meusSaques.length - saquesAdverso || 1;
  const razaoDF = ((dfAdverso / saquesAdverso) / (Math.max(df.length - dfAdverso, 0.0001) / saquesNeutro)) || 0;

  const primeiros = meusSaques.filter((p) => p.saque === "1").length;
  const comSaqueMarcado = meusSaques.filter((p) => p.saque).length || 1;

  const protocolo = conta((p) => p.protocolo);
  const rede = conta((p) => p.rede);
  const redeGanha = conta((p) => p.rede && p.nos);
  const ataquePerdido = conta((p) => p.ataquePerdido);

  const adversos = pontos.filter((p) => p.adverso);
  const adversosGanhos = adversos.filter((p) => p.nos).length;

  return {
    n: pontos.length, curtos, medios, longos,
    pctCurtos: pct(curtos), pctMedios: pct(medios), pctLongos: pct(longos),
    pctAte4: pct(curtos + medios),
    ganhos, pctGanhos: pct(ganhos),
    errosNos: errosNos.length, errosDecisao, errosExec, errosCurtos,
    pctErrosCurtos: errosNos.length ? Math.round((errosCurtos / errosNos.length) * 100) : 0,
    df: df.length, dfAdverso, razaoDF: Number(razaoDF.toFixed(1)),
    pctPrimeiro: Math.round((primeiros / comSaqueMarcado) * 100),
    pctProtocolo: pct(protocolo), rede, redeGanha, ataquePerdido,
    adversos: adversos.length, adversosGanhos,
    pctAdversos: adversos.length ? Math.round((adversosGanhos / adversos.length) * 100) : 0,
  };
}

function leitura(r) {
  const sinais = [];
  if (r.pctErrosCurtos >= 40)
    sinais.push(["devolucao", `${r.pctErrosCurtos}% dos seus erros aconteceram na bola 1–2. O ponto está sendo perdido antes de existir — o trabalho é de início do ponto, não de troca.`]);
  if (r.razaoDF >= 1.5 && r.df > 0)
    sinais.push(["saque", `As duplas faltas aparecem ${r.razaoDF}× mais sob placar adverso. Isso é rotina antes do saque, não mecânica.`]);
  else if (r.pctPrimeiro > 0 && r.pctPrimeiro < 55)
    sinais.push(["saque", `${r.pctPrimeiro}% de primeiro saque dentro. Abaixo da faixa que sustenta o padrão de abertura.`]);
  if (r.errosDecisao > r.errosExec && r.errosNos >= 5)
    sinais.push(["fundo", `Mais erros de decisão (${r.errosDecisao}) que de execução (${r.errosExec}). O recurso existe; o padrão de decisão é que não está treinado.`]);
  if (r.errosExec > r.errosDecisao * 2 && r.errosNos >= 5)
    sinais.push(["fundo", `Os erros são de execução (${r.errosExec} contra ${r.errosDecisao} de decisão). A decisão está certa — corrige-se apoio e ponto de contato, nunca a jogada.`]);
  if (r.pctProtocolo > 0 && r.pctProtocolo < 70)
    sinais.push(["mental", `Protocolo presente em ${r.pctProtocolo}% dos pontos. Abaixo de 80% o intervalo de 20 segundos está sendo desperdiçado.`]);
  if (r.ataquePerdido >= 4)
    sinais.push(["rede", `${r.ataquePerdido} bolas com demanda de ataque não convertidas. É a assimetria clássica: reconhecer defesa é fácil, decidir atacar é o que custa.`]);
  if (r.pctLongos >= 35)
    sinais.push(["movimentacao", `${r.pctLongos}% dos pontos passaram de cinco bolas. Acima do que os dados do circuito mostram — o tempo do adversário não está sendo reduzido.`]);
  return sinais;
}

function Relatorio({ aluno, alunos, setAlunos, cfg, pontos, placar, aoSair }) {
  const r = useMemo(() => resume(pontos), [pontos]);
  const sinais = useMemo(() => leitura(r), [r]);
  const [salvo, setSalvo] = useState(false);

  const dados = [
    { faixa: "1–2 bolas", valor: r.pctCurtos },
    { faixa: "3–4 bolas", valor: r.pctMedios },
    { faixa: "5+ bolas", valor: r.pctLongos },
  ];

  function salvar() {
    const reg = {
      id: "r" + Date.now(), tipo: "jogo", data: new Date().toISOString().slice(0, 10),
      torneio: cfg.torneio || "jogo-treino", adversario: cfg.adversario || "—",
      plano: "", protocolo: r.pctProtocolo, erros12: r.pctErrosCurtos,
      revelou: sinais.map((s) => s[1]).join(" "),
      resultado: placar ? [...placar.sets.map((x) => `${x[0]}-${x[1]}`)].join(" ") || "não concluído" : "—",
      scout: { ...r, pontos },
    };
    setAlunos(alunos.map((a) => a.id === aluno.id ? { ...a, registros: [...(a.registros || []), reg] } : a));
    setSalvo(true);
  }

  function reordenar() {
    const areas = [...new Set(sinais.map((s) => s[0]))];
    const nova = [...areas, ...aluno.prioridades.filter((p) => !areas.includes(p))];
    setAlunos(alunos.map((a) => a.id === aluno.id ? { ...a, prioridades: nova } : a));
  }

  if (!pontos.length)
    return <div><Aviso>Nenhum ponto coletado.</Aviso><Botao onClick={aoSair}>Voltar</Botao></div>;

  return (
    <div>
      <Secao titulo="Onde o ponto se decidiu" nota="Cerca de 70% dos pontos do circuito terminam em até quatro bolas. É contra essa referência que se lê o jogo.">
        <div className="flex mb-3" style={{ height: 40 }}>
          {dados.map((d, i) => (
            <div key={d.faixa} style={{ width: Math.max(d.valor, 3) + "%", background: [C.saibro, C.quadra, C.grafite][i],
              color: "#fff", fontFamily: ARCH, fontSize: 11, fontWeight: 700, display: "flex",
              alignItems: "center", justifyContent: "center", borderRight: "2px solid " + C.papel }}>
              {d.valor}%
            </div>
          ))}
        </div>
        <Tabela cabecalho={["Faixa", "Pontos", "%"]}
          linhas={[["1–2 bolas", r.curtos, r.pctCurtos + "%"], ["3–4 bolas", r.medios, r.pctMedios + "%"], ["5 ou mais", r.longos, r.pctLongos + "%"]]} />
        <p style={{ ...prosa, fontSize: 13.5, color: C.grafite, marginTop: 10 }}>
          {r.pctAte4}% dos pontos terminaram em até quatro bolas.
          {r.pctAte4 >= 65 ? " Em linha com o circuito." : " Abaixo do circuito — o jogo está indo para a troca longa."}
        </p>
      </Secao>

      <Secao titulo="O jogo em números">
        <Tabela cabecalho={["Medida", "Valor"]} linhas={[
          ["Pontos coletados", r.n],
          ["Pontos ganhos", `${r.ganhos} · ${r.pctGanhos}%`],
          ["Erros do meu jogador", r.errosNos],
          ["— por decisão", r.errosDecisao],
          ["— por execução", r.errosExec],
          ["Erros na bola 1–2", `${r.errosCurtos} · ${r.pctErrosCurtos}% dos erros`],
          ["1º saque dentro", r.pctPrimeiro ? r.pctPrimeiro + "%" : "não marcado"],
          ["Duplas faltas", `${r.df} · ${r.dfAdverso} em placar adverso`],
          ["Protocolo entre pontos", r.pctProtocolo + "%"],
          ["Subidas à rede", `${r.rede} · ${r.redeGanha} convertidas`],
          ["Demandas de ataque perdidas", r.ataquePerdido],
          ["Pontos em placar adverso", `${r.adversos} · ${r.pctAdversos}% ganhos`],
        ]} larguras={["58%", "42%"]} />
      </Secao>

      <Secao titulo="O que este jogo aponta" nota="Leitura automática pelas regras do método. É ponto de partida para a sua conversa com o atleta, não conclusão.">
        {sinais.length === 0 ? (
          <p style={{ ...prosa, color: C.grafite }}>
            Nada fora do esperado nos indicadores coletados. Vale olhar o registro livre no caderno.
          </p>
        ) : (
          sinais.map(([area, txt], i) => (
            <div key={i} className="flex gap-4 mb-4">
              <div style={{ width: 4, background: C.saibro, flexShrink: 0 }} />
              <div>
                <Etiqueta cor={C.saibro}>{AREAS[area]?.nome || area}</Etiqueta>
                <p style={{ ...prosa, fontSize: 13.5, marginTop: 3 }}>{txt}</p>
              </div>
            </div>
          ))
        )}
        {sinais.length > 0 && (
          <div className="mt-4">
            <Botao pequeno variante="vazio" onClick={reordenar}>
              Reordenar prioridades do jogador por esta leitura
            </Botao>
            <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 8 }}>
              Muda os ciclos de estímulo e a proporção tática do plano. A rotação de estímulos
              acontece no fim do mesociclo — não no dia seguinte ao jogo.
            </p>
          </div>
        )}
      </Secao>

      <Aviso>
        Um jogo é uma amostra. Três jogos na mesma direção são um sinal; um jogo isolado é ruído. O
        resultado não muda a rota do plano — quem muda a rota é o padrão que se repete.
      </Aviso>

      <div className="flex gap-2 flex-wrap">
        {!salvo ? <Botao onClick={salvar} variante="saibro">Salvar no caderno</Botao>
          : <Etiqueta cor={C.quadra}>✓ Salvo no caderno do jogador</Etiqueta>}
        <Botao variante="vazio" onClick={aoSair}>Novo jogo</Botao>
      </div>
    </div>
  );
}

/* ─────────────────────────── caderno ─────────────────────────── */
const DIAS_SEM = ["SEG", "TER", "QUA", "QUI", "SEX"];

function exportaCaderno(a) {
  const regs = a.registros || [];
  const L = [`# Caderno — ${a.nome || "sem nome"}`, ""];
  L.push(`Estágio ${a.estagio} · nível ${a.nivel} · ${regs.length} registros`, "");

  const sess = regs.filter((r) => r.tipo === "sessao");
  if (sess.length) {
    L.push("## Sessões", "");
    sess.forEach((r) => {
      L.push(`### ${r.data} · ciclo ${r.ciclo} · ${r.duracao} min`);
      L.push(`Aplicados: ${r.exercicios.join(" · ")}`);
      if (r.corrigi) L.push(`**Corrigi:** ${r.corrigi}`);
      if (r.ignorei) L.push(`**Vi e deixei passar:** ${r.ignorei}`);
      if (r.mudaria) L.push(`**Teria montado diferente:** ${r.mudaria}`);
      L.push(`Presença do jogador: ${r.nota}/5`);
      if (r.divergencias?.length) {
        L.push("Divergências sobre a proposta:");
        r.divergencias.forEach((d) => L.push(`- ${d.bloco}: ${d.tipo === "troca" ? `${d.saiu} → ${d.entrou}` : `cortou ${d.saiu}`}`));
      }
      L.push("");
    });
  }

  const jogos = regs.filter((r) => r.tipo === "jogo");
  if (jogos.length) {
    L.push("## Jogos", "");
    L.push("| Data | Torneio | Adversário | Plano em uma frase | Protocolo | Erros bola 1–2 | O que o jogo revelou | Resultado |");
    L.push("|---|---|---|---|---|---|---|---|");
    jogos.forEach((r) => L.push(`| ${r.data} | ${r.torneio} | ${r.adversario} | ${r.plano} | ${r.protocolo}% | ${r.erros12}% | ${r.revelou} | ${r.resultado} |`));
    L.push("");
  }

  const semanas = regs.filter((r) => r.tipo === "semana");
  if (semanas.length) {
    L.push("## Planilha semanal (F-03)", "");
    semanas.forEach((r) => {
      L.push(`### Semana de ${r.data}`, "");
      L.push("| Dia | Erros bola 1–2 (%) | Bola em que a atenção soltou | Protocolo nos sets (%) | Observação |");
      L.push("|---|---|---|---|---|");
      DIAS_SEM.forEach((d) => {
        const l = r.linhas[d] || {};
        L.push(`| ${d} | ${l.erros || ""} | ${l.atencao || ""} | ${l.protocolo || ""} | ${l.obs || ""} |`);
      });
      L.push("");
    });
  }

  const med = regs.filter((r) => r.tipo === "medicao");
  if (med.length) {
    L.push("## Medições dos critérios", "");
    L.push("| Data | Área | Métrica | Valor |");
    L.push("|---|---|---|---|");
    med.forEach((r) => L.push(`| ${r.data} | ${r.area} | ${r.metrica} | ${r.valor} |`));
    L.push("");
  }

  L.push("---", "", "Material de campo. Serve para corrigir o método, não para julgar o jogador.");
  return L.join("\n");
}

function TelaRegistro({ aluno, alunos, setAlunos }) {
  const [modo, setModo] = useState("historico");
  const regs = aluno.registros || [];

  function adiciona(reg) {
    setAlunos(alunos.map((a) => a.id === aluno.id ? { ...a, registros: [...(a.registros || []), reg] } : a));
    setModo("historico");
  }
  function apaga(id) {
    setAlunos(alunos.map((a) => a.id === aluno.id ? { ...a, registros: a.registros.filter((r) => r.id !== id) } : a));
  }

  function baixar() {
    const blob = new Blob([exportaCaderno(aluno)], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const el = document.createElement("a");
    el.href = url;
    el.download = `caderno-${(aluno.nome || "jogador").toLowerCase().replace(/\s+/g, "-")}.md`;
    el.click();
    URL.revokeObjectURL(url);
  }

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-6">
        <Seletor
          opcoes={[
            { v: "historico", r: "Histórico" },
            { v: "jogo", r: "+ Jogo" },
            { v: "semana", r: "+ Semana" },
            { v: "medicao", r: "+ Medição" },
          ]}
          valor={modo} aoMudar={setModo} />
      </div>

      {modo === "jogo" && <FormJogo aoSalvar={adiciona} />}
      {modo === "semana" && <FormSemana aoSalvar={adiciona} />}
      {modo === "medicao" && <FormMedicao aluno={aluno} aoSalvar={adiciona} />}

      {modo === "historico" && (
        <div>
          {regs.length === 0 ? (
            <Aviso cor={C.quadra}>
              Nada registrado ainda. O caderno é o que faz o plano melhorar: cada sessão fechada,
              cada jogo e cada medição vira material para rever as regras.
            </Aviso>
          ) : (
            <>
              <div className="mb-4"><Etiqueta>{regs.length} registros</Etiqueta></div>
              {[...regs].reverse().map((r) => (
                <div key={r.id} style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + (r.tipo === "jogo" ? C.saibro : C.quadra), padding: "11px 13px", marginBottom: 8 }}>
                  <div className="flex justify-between items-start gap-3">
                    <div className="flex-1">
                      <Etiqueta>{r.data} · {r.tipo}</Etiqueta>
                      {r.tipo === "sessao" && (
                        <p style={{ ...prosa, fontSize: 13.5, marginTop: 4 }}>
                          Ciclo {r.ciclo} · {r.exercicios.length} exercícios
                          {r.divergencias?.length ? ` · ${r.divergencias.length} divergências` : ""}
                          {r.mudaria ? <><br /><span style={{ color: C.saibro }}>Teria montado diferente: {r.mudaria}</span></> : null}
                        </p>
                      )}
                      {r.tipo === "jogo" && (
                        <p style={{ ...prosa, fontSize: 13.5, marginTop: 4 }}>
                          {r.torneio} · {r.adversario} · {r.resultado}
                          <br />Protocolo executado em {r.protocolo}% dos pontos
                          {r.revelou ? <><br /><span style={{ color: C.grafite }}>{r.revelou}</span></> : null}
                        </p>
                      )}
                      {r.tipo === "semana" && (
                        <p style={{ ...prosa, fontSize: 13.5, marginTop: 4 }}>Planilha da semana preenchida</p>
                      )}
                      {r.tipo === "medicao" && (
                        <p style={{ ...prosa, fontSize: 13.5, marginTop: 4 }}>{r.area} · {r.metrica}: <b>{r.valor}</b></p>
                      )}
                    </div>
                    <button onClick={() => apaga(r.id)} style={iconeEstilo}>×</button>
                  </div>
                </div>
              ))}
              <div className="mt-5">
                <Botao onClick={baixar} variante="saibro">Baixar caderno em Markdown</Botao>
                <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 10 }}>
                  Este arquivo é o que sustenta a revisão do método. Junte alguns meses e traga o
                  conjunto — é lendo o acumulado que dá para ver quais regras erram sempre.
                </p>
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

function FormJogo({ aoSalvar }) {
  const [f, setF] = useState({ data: new Date().toISOString().slice(0, 10), torneio: "", adversario: "", plano: "", protocolo: "", erros12: "", revelou: "", resultado: "" });
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  return (
    <div style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + C.saibro, padding: 16 }}>
      <Aviso cor={C.quadra}>
        A pergunta única depois do jogo, antes de qualquer análise técnica: em quantos pontos você
        executou o protocolo de verdade? O resultado entra por último — ele é efeito colateral da
        performance.
      </Aviso>
      <div className="grid grid-cols-2 gap-3">
        <Campo rotulo="Data"><input type="date" style={entrada} value={f.data} onChange={(e) => set("data", e.target.value)} /></Campo>
        <Campo rotulo="Torneio"><input style={entrada} value={f.torneio} onChange={(e) => set("torneio", e.target.value)} /></Campo>
      </div>
      <Campo rotulo="Adversário"><input style={entrada} value={f.adversario} onChange={(e) => set("adversario", e.target.value)} /></Campo>
      <Campo rotulo="Plano de jogo, em uma frase" nota="Combinado antes de entrar."><input style={entrada} value={f.plano} onChange={(e) => set("plano", e.target.value)} /></Campo>
      <div className="grid grid-cols-2 gap-3">
        <Campo rotulo="Protocolo executado (%)"><input style={entrada} value={f.protocolo} onChange={(e) => set("protocolo", e.target.value)} placeholder="autodeclarado" /></Campo>
        <Campo rotulo="Erros na bola 1–2 (%)"><input style={entrada} value={f.erros12} onChange={(e) => set("erros12", e.target.value)} /></Campo>
      </div>
      <Campo rotulo="O que o jogo revelou" nota="Serve para a rotação de estímulos no fim do mesociclo.">
        <textarea rows={3} style={{ ...entrada, resize: "vertical" }} value={f.revelou} onChange={(e) => set("revelou", e.target.value)} />
      </Campo>
      <Campo rotulo="Resultado"><input style={entrada} value={f.resultado} onChange={(e) => set("resultado", e.target.value)} placeholder="6-4 3-6 7-5" /></Campo>
      <Botao variante="saibro" onClick={() => aoSalvar({ ...f, id: "r" + Date.now(), tipo: "jogo" })}>Salvar jogo</Botao>
    </div>
  );
}

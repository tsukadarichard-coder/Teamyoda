<script>
/* ═══════ CREDENCIAIS DO FIREBASE ═══════
   Deixe "COLE_AQUI" para rodar em modo local (sem nuvem e sem login).
   Preencha os seis valores para ligar o banco de dados e o acesso da equipe.
   O passo a passo está no Guia_Conectar_Firebase.pdf. */
/* As credenciais vêm do arquivo central mty-nuvem.js, que fica ao lado
   deste arquivo. Um lugar só para editar, em todo o ecossistema. */
const firebaseConfig = (typeof MTY_CONFIG !== "undefined") ? MTY_CONFIG : {
  apiKey: "COLE_AQUI", authDomain: "COLE_AQUI", projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI", messagingSenderId: "COLE_AQUI", appId: "COLE_AQUI",
};

const CONFIGURADO =
  firebaseConfig.apiKey !== "COLE_AQUI" && firebaseConfig.projectId !== "COLE_AQUI";

/* mty-nuvem.js (carregado antes deste script) já inicializou o Firebase
   se estiver configurado — reaproveita o mesmo app em vez de chamar
   initializeApp() de novo, o que lançaria "app já existe" e derrubaria
   db/auth para null mesmo com tudo certo. */
let db = null, auth = null;
if (CONFIGURADO) {
  try {
    db = firebase.firestore();
    auth = firebase.auth();
  } catch (e) {
    console.error("Falha ao iniciar o Firebase — caindo para o modo local.", e);
    db = null; auth = null;
  }
}

/* ── organização do usuário logado ──
   Cada conta carrega uma custom claim orgId, atribuída pelo administrador
   (nunca pelo próprio usuário — não existe autocadastro). Dados na nuvem
   vivem em orgs/{orgId}/... e são compartilhados por toda a academia. */
let orgIdCache = null;
if (auth) {
  auth.onAuthStateChanged(async (u) => {
    if (!u) { orgIdCache = null; return; }
    try {
      const tok = await u.getIdTokenResult(true);
      orgIdCache = (tok.claims && tok.claims.orgId) || null;
    } catch (e) { orgIdCache = null; }
  });
}
async function organizacao() {
  if (!auth || !auth.currentUser) return null;
  if (orgIdCache) return orgIdCache;
  try {
    const tok = await auth.currentUser.getIdTokenResult();
    orgIdCache = (tok.claims && tok.claims.orgId) || null;
    return orgIdCache;
  } catch (e) { return null; }
}

/* ── autenticação da equipe ──
   Só exposta quando há Firebase. O app lê window.mtyAuth para decidir se
   mostra a tela de login. Não existe "criar conta" aqui — uma conta nova
   é criada pelo administrador (netlify/functions/provisionar-org.js),
   já ligada à academia certa. */
if (auth) {
  window.mtyAuth = {
    entrar: (email, senha) => auth.signInWithEmailAndPassword(email, senha),
    sair: () => auth.signOut(),
    observar: (cb) => auth.onAuthStateChanged(cb),
    usuario: () => auth.currentUser,
    tokenId: (forcar) => auth.currentUser ? auth.currentUser.getIdToken(!!forcar) : Promise.resolve(null),
    organizacao,
  };
}

/* ── armazenamento: Firestore (por academia) ou localStorage, mesma assinatura ──
   Na nuvem não existe mais "local" vs "compartilhado" — uma vez logado
   numa academia, tudo que se lê e grava é da academia inteira. */
const storageFirestore = {
  async get(key) {
    const org = await organizacao();
    if (!org) return null;
    try {
      const snap = await db.collection("orgs").doc(org).collection("dados").doc(key).get();
      return snap.exists ? { key, value: snap.data().value, shared: true } : null;
    } catch (e) { console.error("Firestore get:", e); return null; }
  },
  async set(key, value) {
    const org = await organizacao();
    if (!org) return null;
    try {
      await db.collection("orgs").doc(org).collection("dados").doc(key).set({ value, atualizado: Date.now() });
      return { key, value, shared: true };
    } catch (e) { console.error("Firestore set:", e); return null; }
  },
  async delete(key) {
    const org = await organizacao();
    if (!org) return null;
    try {
      const ref = db.collection("orgs").doc(org).collection("dados").doc(key);
      const snap = await ref.get();
      const had = snap.exists;
      await ref.delete();
      return { key, deleted: had, shared: true };
    } catch (e) { console.error("Firestore delete:", e); return null; }
  },
  async list(prefix) {
    const org = await organizacao();
    if (!org) return null;
    try {
      const snap = await db.collection("orgs").doc(org).collection("dados").get();
      const keys = [];
      snap.forEach((d) => { if (!prefix || d.id.indexOf(prefix) === 0) keys.push(d.id); });
      return { keys, prefix: prefix || "", shared: true };
    } catch (e) { console.error("Firestore list:", e); return null; }
  },
};

const storageLocal = {
  async get(key, shared) {
    try {
      const raw = localStorage.getItem((shared ? "shared:" : "local:") + key);
      return raw === null ? null : { key, value: raw, shared: !!shared };
    } catch (e) { return null; }
  },
  async set(key, value, shared) {
    try {
      localStorage.setItem((shared ? "shared:" : "local:") + key, value);
      return { key, value, shared: !!shared };
    } catch (e) { return null; }
  },
  async delete(key, shared) {
    try {
      const k = (shared ? "shared:" : "local:") + key;
      const had = localStorage.getItem(k) !== null;
      localStorage.removeItem(k);
      return { key, deleted: had, shared: !!shared };
    } catch (e) { return null; }
  },
  async list(prefix, shared) {
    try {
      const base = shared ? "shared:" : "local:";
      const pre = base + (prefix || "");
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(pre) === 0) keys.push(k.slice(base.length));
      }
      return { keys, prefix: prefix || "", shared: !!shared };
    } catch (e) { return null; }
  },
};

window.storage = db ? storageFirestore : storageLocal;

async function atualizaFaixa() {
  const faixa = document.getElementById("mty-faixa");
  if (!faixa) return;
  if (!db) {
    faixa.textContent = "Modo local — dados só neste aparelho, sem login. Configure o Firebase para a academia toda acompanhar.";
    faixa.style.background = "#C25A22";
    return;
  }
  if (!auth.currentUser) {
    faixa.textContent = "Nuvem configurada — entre com sua conta para ver os dados da academia.";
    faixa.style.background = "#C25A22";
    return;
  }
  const org = await organizacao();
  if (!org) {
    faixa.textContent = "Conta sem academia vinculada — fale com o administrador.";
    faixa.style.background = "#8A2E2E";
    return;
  }
  faixa.textContent = "Academia conectada — dados sincronizados (org: " + org + ")";
  faixa.style.background = "#2E4739";
}
atualizaFaixa();
if (auth) auth.onAuthStateChanged(() => setTimeout(atualizaFaixa, 300));
</script>

":"Ritmo Acelerado - 80% do Tempo Normal","f":"ADV","e":["A","C"],"m":"Pegar qualquer drill básico e executar com 80% do tempo entre bolas. Menos tempo para pensar, reagir com padrões automatizados.","g":"4 séries de qualquer drill básico","r":"Noventa por cento do tempo normal.","p":"Setenta por cento do tempo normal, em drill já dominado.","x":"A automatização — o que sobrevive quando não há tempo para pensar.","i":"Erros que aparecem sob tempo reduzido em drill ainda não dominado. Só se acelera o que já está estabelecido.","v":0,"o":"Drills em 80% do tempo normal para desenvolver automatização."},{"c":"ADV020","n":"Simulação Completa de Set - Protocolo MTY","f":"ADV","e":["A","C"],"m":"Set completo com: rotina de 20 seg entre pontos, intenção prévia em cada saque, debriefing nos changeovers, análise de padrão pelo treinador.","g":"1 set completo","r":"Meio set com dois protocolos ativos.","p":"Set completo com todos os protocolos e registro posterior.","x":"A integração — os protocolos coexistindo sem que um apague o outro.","i":"O resultado do set. É o encerramento de um ciclo de trabalho, não uma avaliação.","v":0,"o":"Set completo com todos os protocolos MTY integrados."},{"c":"AT001","n":"Entra e joga","f":"AT","e":["V","L","G","A"],"m":"Bola curta; entrar na quadra e jogar ao espaço vazio.","g":"4×8","r":"bola mais alta e central","p":"bola mais baixa e angulada","x":"decisão de entrar, apoio na chegada","i":"se a bola entrou","v":1,"o":""},{"c":"AT002","n":"Ataque plano de meia quadra","f":"AT","e":["L","G","A","C"],"m":"Bola de três quartos; atacar plano e para a frente.","g":"4×8","r":"bola mais alta, alvo amplo","p":"alvo reduzido, bola mais baixa","x":"ponto de contato à frente, apoio, terminação","i":"margem sobre a rede","v":1,"o":""},{"c":"AT003","n":"Ataque + finalização à frente","f":"AT","e":["L","G","A","C"],"m":"Atacar e finalizar na rede na bola seguinte.","g":"3×8","r":"finalização com bola lançada","p":"passador tentando o passe","x":"split na zona de voleio","i":"qualidade do voleio nas primeiras sessões","v":1,"o":""},{"c":"AT004","n":"Duas bolas: arma e converte","f":"AT","e":["L","G","A","C"],"m":"Primeira bola com alvo de segurança (2 m das linhas); segunda com alvo de pressão.","g":"4×6","r":"papéis anunciados antes","p":"o aluno decide qual bola é qual","x":"não inverter os papéis","i":"velocidade","v":1,"o":""},{"c":"AT005","n":"Ataque por variação","f":"AT","e":["L","G","A","C"],"m":"Atacar por curtinha ou mudança de ritmo, sem acelerar.","g":"3×8","r":"variação anunciada","p":"variação escolhida na hora","x":"compreensão de que isto também é ataque","i":"potência","v":1,"o":""},{"c":"AT006","n":"Ataque por posição","f":"AT","e":["G","A","C"],"m":"Ganhar terreno progressivamente até a resposta ficar impossível, sem bater forte.","g":"3 × 6 pontos","r":"parceiro em bola neutra","p":"parceiro defendendo ativamente","x":"avanço com equilíbrio","i":"velocidade da bola","v":1,"o":""},{"c":"AT007","n":"Curtinha disfarçada","f":"AT","e":["G","A","C"],"m":"Preparação idêntica ao drive até o último instante.","g":"3×8","r":"sem exigência de disfarce","p":"parceiro tentando antecipar","x":"identidade da preparação, mãos macias no contato","i":"perfeição do segundo quique","v":1,"o":""},{"c":"AT008","n":"Approach paralelo + cobertura","f":"AT","e":["G","A","C"],"m":"Approach na paralela e split na zona de voleio, cobrindo a rota provável.","g":"3×8","r":"sem passador","p":"passador com liberdade total","x":"linha de cobertura e timing do split","i":"o voleio","v":1,"o":""},{"c":"AT009","n":"Approach pesado no backhand","f":"AT","e":["G","C"],"m":"Bola pesada caindo atrás do adversário, seguida de voleio de decisão.","g":"3×8","r":"alvo amplo","p":"alvo profundo com margem reduzida","x":"profundidade e direção do approach","i":"o resultado","v":1,"o":""},{"c":"AT010","n":"Contorno de forehand","f":"AT","e":["G","C"],"m":"Inside out e inside in a partir de bola central.","g":"3 × 8 de cada","r":"bola central previsível","p":"bola variando com recuperação exigida","x":"recuo diagonal do pé de trás e recuperação","i":"potência","v":1,"o":""},{"c":"AT011","n":"Os seis sistemas","f":"AT","e":["C"],"m":"Ciclo pelos seis padrões de duas bolas do método.","g":"6 blocos de 6","r":"três sistemas por sessão","p":"o parceiro joga livre após a segunda bola","x":"papéis de cada bola","i":"o terceiro golpe","v":1,"o":""},{"c":"AT012","n":"Ataque sob placar adverso","f":"AT","e":["G","C"],"m":"Atacar obrigatoriamente em 15-40.","g":"3 × 6 pontos","r":"placar neutro","p":"com consequência real (série decisiva)","x":"a decisão de atacar acontecer","i":"o resultado — sempre","v":1,"o":""},{"c":"BR001","n":"Pega-pega do split","f":"BR","e":["V","L"],"m":"Um pegador. Só se pode correr depois de um salto de prontidão no comando de palma do professor. Quem corre sem saltar volta ao ponto de partida.","g":"4-6 min","r":"Professor conduz o ritmo em voz alta e todos saltam juntos antes de liberar a corrida.","p":"O comando vira o quique de uma bola lançada: salta-se no quique, não na palma.","x":"O salto acontecendo antes da saída, não junto com ela.","i":"A velocidade da corrida. O que se instala aqui é o hábito do salto, não a agilidade.","v":0,"o":"Instala o split step como reflexo, sem que a criança saiba que está treinando split step."},{"c":"BR002","n":"Vulcão","f":"BR","e":["V"],"m":"Cones espalhados, metade em pé e metade deitados. Um time derruba, o outro levanta. Ao apito, conta-se. Duas rodadas de 45 segundos.","g":"3-4 min","r":"Menos cones e área menor.","p":"Cada jogador carrega a raquete na mão dominante o tempo todo.","x":"Nada. Este é o bloco de abertura e a bola vem em seguida.","i":"Tudo. É aquecimento com alegria — corrigir aqui ensina que a quadra é lugar de ser corrigido.","v":0,"o":"Coloca o corpo em movimento em trinta segundos, sem fila e sem alongamento parado."},{"c":"BR003","n":"Alvo que grita","f":"BR","e":["V","L"],"m":"Cones coloridos no fundo. O professor grita a cor no momento em que alimenta a bola. Ponto para quem acerta o alvo da cor certa.","g":"5-7 min","r":"A cor é anunciada antes da alimentação, com a criança já posicionada.","p":"Duas cores anunciadas em sequência: acerta a primeira, depois a segunda.","x":"A decisão de direção acontecendo antes da preparação.","i":"A precisão do acerto. O que importa é a intenção ter sido escolhida a tempo.","v":0,"o":"Transforma decisão de direção em jogo. É a raiz do que depois vira leitura tática."},{"c":"BR004","n":"Rei da quadra pequena","f":"BR","e":["V","L","G"],"m":"Um rei de um lado, fila do outro. Quem ganha o ponto vira rei. Quadra reduzida ao estágio.","g":"6-10 min","r":"Ponto começa com alimentação do professor, sem saque.","p":"O ponto obrigatoriamente começa com saque e devolução, e vale dobro se terminar em até quatro bolas.","x":"O início do ponto: o saque acontece de verdade, não como formalidade.","i":"A qualidade técnica durante o jogo. Aqui se joga; corrige-se depois.","v":0,"o":"É o formato de jogo aplicado mais eficiente com criança: ninguém fica parado e todos disputam."},{"c":"BR005","n":"Batata quente com raquete","f":"BR","e":["V"],"m":"Círculo, bola equilibrada na raquete, passa-se de raquete em raquete sem usar a mão. Quem derruba faz uma tarefa divertida e volta.","g":"3-5 min","r":"Bola maior e mais leve; permite-se apoiar a outra mão.","p":"O círculo caminha enquanto a bola passa.","x":"A raquete acompanhando a bola em vez de bater nela — é o começo do toque.","i":"A queda da bola. Ela vai cair muito, e faz parte.","v":0,"o":"Sensibilidade de raquete e controle de equilíbrio, que são pré-requisitos motores do golpe."},{"c":"BR006","n":"Travessia do rio","f":"BR","e":["V","L"],"m":"Duas linhas marcam as margens. A criança atravessa quicando a bola na raquete. Se a bola cair, volta ao início. Três travessias.","g":"4-6 min","r":"Bola quicando no chão, empurrada com a raquete.","p":"Alternar face da raquete a cada dois quiques.","x":"O olhar acompanhando a bola sem travar o deslocamento.","i":"O tempo da travessia. Correr e derrubar não é melhor que andar e sustentar.","v":0,"o":"Coordenação óculo-manual em deslocamento — a base motora que sustenta o golpe em movimento."},{"c":"BR007","n":"Duelo de sombras","f":"BR","e":["V","L","G"],"m":"Dois de frente, sem bola. Um lidera o deslocamento, o outro copia como espelho. Troca a cada 30 segundos.","g":"3-5 min","r":"Movimentos lentos e anunciados.","p":"O líder pode fintar; o espelho precisa ler a saída real.","x":"A qualidade dos apoios na mudança de direção.","i":"A velocidade. Espelho rápido e desorganizado não ensina nada.","v":0,"o":"Padrão de deslocamento e leitura de corpo — o começo da antecipação."},{"c":"BR008","n":"Ilha do tesouro","f":"BR","e":["V","L"],"m":"Bolas espalhadas pela quadra são tesouros. Ao comando, cada criança recolhe o máximo em 30 segundos e leva para o próprio bau. Vale bola por bola.","g":"3-4 min","r":"Menos bolas, área menor.","p":"As bolas só podem ser levadas equilibradas na raquete.","x":"Nada durante; ao fim, comenta-se quem escolheu bem o caminho.","i":"A quantidade recolhida. É abertura, não competição de verdade.","v":0,"o":"Movimento intenso e curto no início da aula, com decisão de trajetória embutida."},{"c":"BR009","n":"Saque na muralha","f":"BR","e":["V","L","G"],"m":"Fila de cones ou fitas formando uma muralha atrás do quadrado de saque. Cada saque que entra derruba uma peça da muralha do time. Times alternam.","g":"6-8 min","r":"Saque por baixo e alvo ampliado.","p":"Só o segundo saque derruba peça; o primeiro precisa ser plano e forte.","x":"Consistência do lançamento entre um saque e outro.","i":"O percentual individual. A muralha é do time — ninguém é exposto sozinho.","v":0,"o":"Faz o bloco de início do ponto acontecer com volume alto sem virar repetição silenciosa."},{"c":"BR010","n":"Semáforo","f":"BR","e":["V","L"],"m":"Verde: troca livre. Amarelo: só bola alta. Vermelho: para e congela. O professor troca a luz durante a troca.","g":"5-7 min","r":"Apenas verde e vermelho.","p":"Acrescentar azul: obrigatório atacar a próxima bola que sobrar.","x":"A mudança de intenção acontecendo na bola seguinte ao comando, não duas depois.","i":"Erros no instante da troca de cor. A confusão é o exercício.","v":0,"o":"Ensina a trocar de intenção dentro do ponto — a semente da decisão tática."},{"c":"BR011","n":"Caçador de bola curta","f":"BR","e":["L","G"],"m":"O professor alimenta bolas profundas e, sem aviso, uma curta. A curta vale três pontos se for atacada e a criança terminar dentro da quadra.","g":"6-8 min","r":"A bola curta é anunciada antes de sair.","p":"Depois da curta, o ponto é disputado até o fim.","x":"A entrada em diagonal e o pé de apoio na bola curta.","i":"O erro do ataque. Atacar e errar vale mais que esperar e acertar — e isso precisa ser dito em voz alta.","v":0,"o":"Constrói o hábito de reconhecer e atacar a bola que sobra, desde a iniciação."},{"c":"BR012","n":"Números na rede","f":"BR","e":["V","L"],"m":"Fitas dividem a rede em faixas de altura numeradas. Cada bola que passa na faixa alta vale mais. Conta-se em duplas.","g":"5-7 min","r":"Duas faixas apenas, alta e baixa.","p":"A faixa que vale mais muda a cada dois pontos.","x":"A altura sobre a rede como caminho para a profundidade.","i":"A velocidade da bola. Bola alta e lenta pontuando é o resultado desejado.","v":0,"o":"Faz a margem sobre a rede virar objetivo visível, em vez de instrução repetida."},{"c":"BR013","n":"Estátua com bola","f":"BR","e":["V"],"m":"Música ou palmas. Quando para, todos congelam na posição de espera, com a raquete pronta. Quem se mexe faz uma careta e continua.","g":"3-4 min","r":"Congelar só o corpo, sem exigir posição de raquete.","p":"Congelar já na base de apoio do golpe que o professor gritar.","x":"A posição de espera com pés ativos.","i":"A perfeição da posição. Repetir a forma vinte vezes rindo vale mais que uma vez corrigida.","v":0,"o":"Instala a posição de prontidão sem transformá-la em ordem."},{"c":"BR014","n":"Corrida dos cones malucos","f":"BR","e":["V","L"],"m":"Percurso de cones com mudanças de direção. Duas equipes em revezamento. Cada volta termina com um golpe alimentado pelo professor.","g":"5-8 min","r":"Percurso mais curto e sem golpe final.","p":"Cronometrar e comparar com a marca da semana anterior.","x":"A freada antes da mudança de direção.","i":"O golpe final nas primeiras rodadas. A pressa é parte do jogo.","v":0,"o":"Deslocamento com mudança de direção sob excitação — que é a condição real do jogo."},{"c":"BR015","n":"Bola no balde","f":"BR","e":["V","L"],"m":"Baldes em posições diferentes da quadra valem pontuações diferentes. O mais distante vale mais. Cada criança tem dez bolas.","g":"5-7 min","r":"Baldes maiores e mais próximos.","p":"A criança declara o balde antes de bater.","x":"A escolha declarada antes da preparação.","i":"O acerto. Errar o balde declarado vale mais que acertar sem escolher.","v":0,"o":"Torna visível que decidir vem antes de executar — princípio que atravessa todo o método."},{"c":"BR016","n":"Túnel do tempo","f":"BR","e":["L","G"],"m":"Dois jogadores trocam bolas. A cada bola, o professor conta em voz alta o tempo até o contato. Ganha a dupla que reduzir a contagem sem errar.","g":"6-8 min","r":"Contagem apenas para um dos dois.","p":"Reduzir o tempo alvo a cada série.","x":"O contato acontecendo mais cedo, com o corpo entrando na bola.","i":"A força. Reduzir o tempo do outro não é bater mais forte — é a lição central desta brincadeira.","v":0,"o":"Traduz o eixo do método, a redução de tempo, para uma criança de dez anos."},{"c":"BR017","n":"Guerra de bolas","f":"BR","e":["V","L"],"m":"Quadra dividida, bolas espalhadas dos dois lados. Em 60 segundos, cada time manda o máximo de bolas para o lado adversário, sempre com a raquete.","g":"3-4 min","r":"Permite-se lançar com a mão nas primeiras rodadas.","p":"Só valem bolas que passem acima de uma fita alta.","x":"Nada durante a rodada.","i":"Técnica, direção, tudo. É abertura com bola e serve para gastar a ansiedade do começo da aula.","v":0,"o":"Volume enorme de contatos em pouco tempo, sem fila e sem espera."},{"c":"BR018","n":"Espelho da devolução","f":"BR","e":["L","G"],"m":"O professor saca e anuncia, no ar, se a devolução deve ser bloqueada ou atacada. Ponto dobrado se a devolução corresponder ao comando.","g":"6-8 min","r":"O comando vem antes do saque.","p":"O comando desaparece: a criança lê a bola e declara em voz alta o que escolheu.","x":"O split step no contato do sacador.","i":"A profundidade da devolução. O objeto é a leitura, não a bola.","v":0,"o":"Constrói a devolução como decisão, e não como reação sorte-ou-azar."},{"c":"BR019","n":"Placar invertido","f":"BR","e":["L","G"],"m":"Joga-se um game normal, mas o placar é anunciado sempre desfavorável ao jogador que está treinando. Vence quem chega a quatro pontos mesmo assim.","g":"8-10 min","r":"Desvantagem menor.","p":"Desvantagem máxima e set curto.","x":"A rotina entre pontos se mantendo apesar do placar.","i":"O resultado. E as reações — elas são exatamente o que se está observando.","v":0,"o":"Apresenta o placar adverso como brincadeira, antes que ele apareça como sofrimento em torneio."},{"c":"BR020","n":"Coelho na toca","f":"BR","e":["V"],"m":"Bambolês ou marcações são tocas. Ao comando, cada criança corre para uma toca livre. Sempre falta uma toca.","g":"3-4 min","r":"Uma toca para cada criança, sem eliminação.","p":"A corrida até a toca acontece com a bola quicando na raquete.","x":"Nada.","i":"Tudo. Serve para instalar alegria no começo da aula.","v":0,"o":"Aquecimento em disputa leve, com reação a comando."},{"c":"BR021","n":"Passa-passa da dupla","f":"BR","e":["L","G"],"m":"Duplas trocam bolas cooperativamente, contando em voz alta. A meta é bater o recorde da turma, não vencer a outra dupla.","g":"5-8 min","r":"Meta reduzida e quadra menor.","p":"A contagem só avança se a bola passar de uma fita de altura.","x":"A regularidade do ponto de contato.","i":"A velocidade. Aqui só existe manter a bola viva.","v":0,"o":"Consistência tratada como conquista coletiva — o que sustenta a permanência da criança no esporte."},{"c":"BR022","n":"Detetive do erro","f":"BR","e":["G"],"m":"Dois jogam um ponto; um terceiro observa e, ao fim, diz se o erro foi de decisão ou de execução. Se acertar, ganha ponto.","g":"6-8 min","r":"O professor sugere as duas opções em voz alta antes da resposta.","p":"O observador precisa também dizer o que faria diferente.","x":"A capacidade de separar decisão de execução — no observador, não em quem jogou.","i":"O acerto do julgamento nas primeiras rodadas.","v":0,"o":"Ensina a ordem de observação do erro pelo caminho mais rápido: fazendo a criança observar."},{"c":"BR023","n":"Pontes e alçapões","f":"BR","e":["V","L"],"m":"Zonas da quadra são pontes, que valem ponto, e alçapões, que tiram ponto. Joga-se um ponto normal sobre esse mapa.","g":"6-8 min","r":"Só pontes, sem alçapões.","p":"As zonas mudam de lugar a cada dois pontos.","x":"A consciência de destino antes de bater.","i":"O acerto das zonas. O que se treina é olhar para a quadra antes do golpe.","v":0,"o":"Introduz a geometria da quadra como mapa, e não como abstração."},{"c":"BR024","n":"Vôlei de raquete","f":"BR","e":["V","L"],"m":"Sem quique: a bola precisa ser devolvida no ar, por cima de uma rede baixa, em duplas ou trios. Conta-se o rally.","g":"5-7 min","r":"Permite-se um quique.","p":"Duas trocas no mesmo time antes de mandar.","x":"Punho firme e contato à frente.","i":"A direção. Aqui só se pede que a bola siga viva no ar.","v":0,"o":"Constrói voleio sem chamar de voleio, e resolve o medo da bola no ar."},{"c":"BR025","n":"Cronômetro humano","f":"BR","e":["L","G"],"m":"Um jogador conta em voz alta os segundos entre um ponto e outro. Quem sacar antes de completar a contagem perde o ponto.","g":"5-7 min","r":"Contagem mais curta.","p":"A contagem vira silenciosa: quem sacar cedo demais perde o ponto.","x":"A rotina de fechar o ponto anterior antes de começar o próximo.","i":"O ritmo do jogo. A pausa é o exercício.","v":0,"o":"Instala o intervalo de vinte segundos como parte do jogo, muito antes de virar protocolo."},{"c":"BR026","n":"Corrida do saque","f":"BR","e":["L","G","A"],"m":"Cada criança tem dez saques. Cada saque dentro avança uma casa num tabuleiro desenhado no chão. Primeiro a chegar ao fim vence.","g":"6-8 min","r":"Saque por baixo e alvo ampliado.","p":"O segundo saque avança duas casas; a dupla falta recua uma.","x":"A consistência do lançamento.","i":"A força do saque. Velocidade de braço, não força.","v":0,"o":"Dá volume de saque com motivação, resolvendo o problema clássico do bloco chato."},{"c":"BR027","n":"Bola quente na rede","f":"BR","e":["L","G"],"m":"Os dois jogadores começam o ponto na meia quadra. Quem recuar além da linha de saque perde o ponto.","g":"5-8 min","r":"Quadra reduzida e alimentação lenta.","p":"Ponto começa com approach real a partir do fundo.","x":"O contato à frente e a firmeza do punho.","i":"A profundidade. Voleio de finalização é ângulo, não profundidade.","v":0,"o":"Faz a criança viver a rede como lugar bom, e não como território estranho."},{"c":"BR028","n":"Adivinha o alvo","f":"BR","e":["L","G"],"m":"Antes de cada bola, o jogador aponta com a raquete para onde vai bater. O parceiro tenta cobrir. Ponto se a bola for para onde foi apontado.","g":"5-7 min","r":"Apontar em voz alta, com o parceiro parado.","p":"Apontar e ter permissão de mudar até o contato: entra o disfarce.","x":"O compromisso com a intenção declarada.","i":"O acerto do alvo. Declarar e falhar vale mais que bater sem escolher.","v":0,"o":"Transforma intenção declarada em hábito, que é o alicerce da matriz de decisão do saque."},{"c":"BR029","n":"Ataque obrigatório","f":"BR","e":["L","G"],"m":"Toda bola que quicar dentro da linha de saque precisa ser atacada. Quem devolver essa bola com segurança perde o ponto.","g":"6-10 min","r":"A bola curta é alimentada pelo professor e anunciada.","p":"A regra vale dentro de um game completo.","x":"O ponto de contato e o apoio de pernas no ataque.","i":"O erro do ataque, sempre. E jamais se pede mais efeito para a bola cair dentro — isso converteria o ataque em bola de controle.","v":0,"o":"Constrói a característica agressiva desde a iniciação, com a regra fazendo o trabalho do sermão."},{"c":"BR030","n":"Torneio relâmpago","f":"BR","e":["V","L","G"],"m":"Mini-torneio de pontos únicos ou games curtos, com todos jogando ao mesmo tempo em quadras reduzidas e rodízio a cada dois minutos.","g":"10-15 min","r":"Pontos iniciados por alimentação do professor.","p":"Todo ponto começa com saque e devolução; regra do tema da semana valendo.","x":"O início do ponto acontecendo de verdade em todas as quadras.","i":"Resultados e classificação. A festa é o fechamento da aula, não uma medição.","v":0,"o":"Fecha o ciclo com jogo de verdade, que é o que a criança conta em casa."},{"c":"CF001","n":"Spider Drill Cronometrado","f":"CF","e":["L","G","A","C"],"m":"5 bolas nos pontos da quadra. Partir do centro, buscar cada bola e retornar. Cronometrar. Meta: sub-20 seg.","g":"4 séries, 90 seg descanso","r":"Três pontos em vez de cinco; sem cronômetro.","p":"Cronometrar e comparar com a marca da semana anterior.","x":"Freada e mudança de direção — a economia de passos é o que baixa o tempo.","i":"O tempo absoluto de um dia isolado. A curva ao longo das semanas é a informação.","v":0,"o":"Velocidade e mudança de direção - teste e treino."},{"c":"CF002","n":"Corridas Laterais - Baseline a Simples","f":"CF","e":["L","G","A","C"],"m":"Parte do centro da baseline, corre até a linha de simples de um lado, retorna ao centro, vai ao outro lado.","g":"6 repetições, 45 seg descanso","r":"Distância reduzida; mais descanso entre repetições.","p":"Distância completa com descanso reduzido.","x":"O passo cruzado de saída e a postura baixa.","i":"O tempo de corrida. Padrão de deslocamento antes de velocidade.","v":0,"o":"Velocidade lateral explosiva para o tênis."},{"c":"CF003","n":"Escada - 2 Dentro 2 Fora","f":"CF","e":["V","L","G","A","C"],"m":"2 pés dentro de cada quadrado, 2 fora. Percorrer a escadinha lateral e voltar. 3 passagens = 1 série.","g":"4 séries","r":"Ritmo lento com contagem em voz alta.","p":"Velocidade máxima seguida de deslocamento até uma bola.","x":"A cadência dos apoios, não a velocidade dos pés.","i":"Erros de sequência nas primeiras séries. A escadinha é coordenação — ela se constrói errando.","v":0,"o":"Coordenação e velocidade de pés com escadinha."},{"c":"CF004","n":"Escada - Ickey Shuffle","f":"CF","e":["V","L","G","A","C"],"m":"Padrão: 2 pés dentro, 1 fora lateral, 2 dentro do próximo, 1 fora lateral. Padrão avançado de coordenação bilateral.","g":"4 séries","r":"Padrão fracionado, um pé de cada vez.","p":"Velocidade máxima com transição imediata para movimento de quadra.","x":"A coordenação cruzada entre braços e pernas.","i":"A velocidade enquanto o padrão não estiver estabelecido.","v":0,"o":"Coordenação avançada de pés com escadinha."},{"c":"CF005","n":"Saltos com Corda - 3 Minutos","f":"CF","e":["V","L","G","A","C"],"m":"Salto com corda por 3 min continuos. Variações: 2 pés, alternado, duplo pulo. Ritmo constante.","g":"3 min continuos","r":"Blocos de um minuto com pausa entre eles.","p":"Três minutos contínuos com variação de padrão a cada trinta segundos.","x":"A permanência sobre a ponta dos pés e a amplitude mínima do salto.","i":"O número de erros na corda. A continuidade importa mais que a perfeição.","v":0,"o":"Resistência cardiovascular e coordenação com corda."},{"c":"CF006","n":"Box Jumps - Explosividade Vertical","f":"CF","e":["G","A","C"],"m":"Saltos em caixa de 40-60cm. Aterrissagem suave com joelhos levemente flexionados. Descer pelo lado.","g":"4 séries de 8 repetições","r":"Altura reduzida da caixa; menos repetições.","p":"Altura maior com aterrissagem controlada e salto imediato.","x":"A aterrissagem — joelho alinhado ao pé, sem colapso interno.","i":"A altura alcançada. Aterrissagem correta antes de altura.","v":0,"o":"Força explosiva nas pernas para potencializar os golpes."},{"c":"CF007","n":"Agachamento com Salto - Potência","f":"CF","e":["G","A","C"],"m":"Agachamento até 90 graus e salto explosivo para cima. Aterrissagem controlada com joelhos amortecendo.","g":"4 séries de 10 repetições","r":"Agachamento sem salto; menos repetições.","p":"Salto com carga leve ou em superfície instável.","x":"Profundidade do agachamento e alinhamento do joelho.","i":"A velocidade de execução. Potência aqui nasce do padrão correto.","v":0,"o":"Potência das pernas para movimentação explosiva."},{"c":"CF008","n":"Resistência com Elástico - Laterais","f":"CF","e":["G","A","C"],"m":"Elástico ao redor das coxas. Passos laterais por 20m em cada direção com resistência. Manter posição baixa.","g":"4 séries de 20m cada lado","r":"Elástico de menor resistência; distância menor.","p":"Maior resistência com deslocamento em posição baixa contínua.","x":"A manutenção da postura baixa contra a resistência.","i":"O tempo. Este é trabalho de força, não de velocidade.","v":0,"o":"Força lateral e resistência para movimentos defensivos."},{"c":"CF009","n":"Sprints Curtos - 5x5m","f":"CF","e":["L","G","A","C"],"m":"Sprints de 5 metros máximos partindo da posição de espera. 6 repetições com 30 seg de descanso.","g":"6 séries de 5m, 30 seg descanso","r":"Quatro repetições com descanso ampliado.","p":"Sprints com partida a partir de estímulo visual do treinador.","x":"Os três primeiros passos — é neles que o tênis se decide.","i":"A velocidade máxima. Cinco metros nunca chegam à velocidade máxima.","v":0,"o":"Aceleração explosiva nos primeiros passos."},{"c":"CF010","n":"Corrida Mudança de Direção - Cone T","f":"CF","e":["G","A","C"],"m":"4 cones em forma de T. Corrida do base ao topo, lateral até uma ponta, lateral até a outra, retorno. Cronometrar.","g":"4 séries, 90 seg descanso","r":"Distância reduzida entre os cones.","p":"Cronometrar com registro e comparação semanal.","x":"A técnica de freada nos vértices do T.","i":"O tempo total quando a freada ainda não está estabelecida.","v":0,"o":"Agilidade em padrão T de mudança de direção."},{"c":"CF011","n":"Medicine Ball - Rotação de Tronco","f":"CF","e":["G","A","C"],"m":"Medicine ball (3-5kg). Rotação de tronco para ambos os lados com extensão total dos braços. 20 repetições para cada lado.","g":"3 séries de 20 repetições","r":"Bola mais leve; menos repetições.","p":"Bola mais pesada com execução em base de golpe.","x":"A cadeia de rotação de baixo para cima — quadril antes de tronco, tronco antes de braço.","i":"A força do arremesso. A sequência importa mais que a distância.","v":0,"o":"Cadeia de rotação do tronco para potencializar os golpes."},{"c":"CF012","n":"Medicine Ball - Arremesso na Parede","f":"CF","e":["G","A","C"],"m":"De pé de lado para a parede, arremesso da medicine ball com gesto de FH. Bate na parede, pega e repete.","g":"3 séries de 15 arremessos cada lado","r":"Bola leve, distância curta da parede.","p":"Bola pesada com arremesso a partir de deslocamento lateral.","x":"A transferência de peso e a rotação do quadril no arremesso.","i":"A potência absoluta. O padrão de transferência é o objeto.","v":0,"o":"Potência explosiva no movimento de FH."},{"c":"CF013","n":"Prancha Lateral - Estabilidade","f":"CF","e":["V","L","G","A","C"],"m":"Prancha lateral em cotovelo por 30-45 seg cada lado. Quadril elevado, coluna alinhada.","g":"3 séries de 45 seg cada lado","r":"Prancha com joelho apoiado; trinta segundos.","p":"Prancha lateral com elevação de perna ou apoio instável.","x":"O alinhamento do quadril — ele cai antes de o tempo acabar.","i":"O tempo total quando o alinhamento se perde. Vinte segundos alinhados valem mais que quarenta e cinco tortos.","v":0,"o":"Estabilidade lateral do tronco."},{"c":"CF014","n":"Polichinelo Lateral - Velocidade de Pés","f":"CF","e":["V","L","G","A","C"],"m":"4 cones em linha. Polichinelo lateral entre cones. Distância total: 5m. Máxima velocidade.","g":"6 séries, 30 seg descanso","r":"Ritmo reduzido; séries mais curtas.","p":"Ritmo máximo com mudança de direção sob comando.","x":"A frequência dos apoios e o contato mínimo com o solo.","i":"A amplitude do movimento. Aqui frequência supera amplitude.","v":0,"o":"Velocidade de reação lateral específica para o tênis."},{"c":"CF015","n":"Circuito - 4 Estações","f":"CF","e":["G","A","C"],"m":"Est.1: 30 seg corrida lateral. Est.2: 10 agachamentos explosivos. Est.3: 30 seg escadinha. Est.4: 10 sprints de 5m.","g":"4 circuitos completos","r":"Duas estações em vez de quatro; um circuito a menos.","p":"Quatro estações com tempo reduzido entre elas.","x":"A qualidade de execução na última estação de cada circuito.","i":"A comparação de desempenho entre estações diferentes.","v":0,"o":"Condicionamento geral com circuito de 4 estações."},{"c":"CF016","n":"Força de Braço - Rosca para Tênis","f":"CF","e":["G","A","C"],"m":"Rosca alternada com halteres (3-5kg). Fortalecer braço de jogo e braço de apoio igualmente.","g":"3 séries de 15 repetições cada braço","r":"Carga menor com amplitude completa.","p":"Carga maior com execução mais lenta na fase excêntrica.","x":"A amplitude completa e o controle na descida.","i":"A carga levantada. Volume de treino em quadra é o objetivo, não hipertrofia.","v":0,"o":"Força específica do braço para suportar o volume de treino."},{"c":"CF017","n":"Resistência Cardiovascular - Corrida","f":"CF","e":["G","A","C"],"m":"Corrida continua por 20-30 min em ritmo moderado.","g":"20-30 min","r":"Vinte minutos em ritmo confortável.","p":"Trinta minutos com variação de ritmo em blocos.","x":"A regularidade da respiração e do ritmo.","i":"A velocidade. Base aeróbica se constrói em ritmo baixo e sustentado.","v":0,"o":"Base aeróbica para manter qualidade técnica nos games finais."},{"c":"CF018","n":"Reação - Bola Caindo","f":"CF","e":["V","L","G","A","C"],"m":"Treinador segura bola na altura do ombro. Jogador em posição de espera. Quando o treinador solta sem aviso, jogador deve pegar antes de 2 toques no chão.","g":"20 repetições","r":"Bola solta de altura maior, dando mais tempo.","p":"Duas bolas alternadas com anúncio de cor no momento da soltura.","x":"O tempo entre o estímulo visual e o primeiro passo.","i":"A pegada da bola. O objeto é o tempo de reação.","v":0,"o":"Tempo de reação e reflexos para bolas rápidas."},{"c":"CF019","n":"Flexibilidade - Rotina de 10 Minutos","f":"CF","e":["V","L","G","A","C"],"m":"Sequência: 1. Rotação de ombros 30s. 2. Flexão lateral de tronco 30s cada. 3. Agachamento profundo 30s. 4. Abertura de quadril 30s. 5. Flexão de quadríceps 30s cada.","g":"10 minutos pós-treino","r":"Amplitude parcial em cada posição; menos tempo.","p":"Amplitude completa com permanência maior em cada posição.","x":"A respiração durante a permanência e a ausência de dor aguda.","i":"A amplitude comparada a outro atleta. Cada corpo tem a sua.","v":0,"o":"Amplitude de movimento necessária para o tênis."},{"c":"CF020","n":"HIIT Específico para Tênis - Tabata","f":"CF","e":["A","C"],"m":"20 seg de esforço máximo (corrida lateral, sprints, saltos) mais 10 seg de descanso. 8 vezes = 1 rodada. 3 rodadas.","g":"3 rodadas de 8 intervalos","r":"Duas rodadas em vez de três; intervalos mais longos.","p":"Três rodadas completas com movimentos específicos de quadra.","x":"A manutenção da qualidade de movimento no último intervalo de cada rodada.","i":"A queda de rendimento ao longo dos intervalos. É o desenho do estímulo.","v":0,"o":"Potência anaeróbia específica para o ritmo de um ponto de tênis."},{"c":"CO001","n":"Pegar, lançar, rebater","f":"CO","e":["V","L","A"],"m":"Progressão em três etapas com bola adaptada.","g":"8 min","r":"bola maior e mais lenta","p":"bola menor, distância maior","x":"coordenação global","i":"técnica de golpe","v":1,"o":""},{"c":"CO002","n":"Alvos móveis","f":"CO","e":["V","L","A"],"m":"Rebater para alvo que o professor desloca durante o voo da bola.","g":"3×8","r":"alvo fixo","p":"alvo que muda após o contato começar","x":"ajuste tardio de direção","i":"potência","v":1,"o":""},{"c":"CO003","n":"Um pé, base firme","f":"CO","e":["V","L","G","A"],"m":"Golpear a partir de apoio unipodal.","g":"2 × 8 por lado","r":"apoio com toque leve do outro pé","p":"olhos em alvo distante","x":"equilíbrio e estabilidade de tronco","i":"resultado da bola","v":1,"o":""},{"c":"CO004","n":"Parar antes de bater","f":"CO","e":["V","L","G","A"],"m":"Corrida com freada obrigatória e equilíbrio verificável antes do contato.","g":"3×8","r":"distância curta","p":"distância longa com mudança de direção","x":"frenagem e base","i":"velocidade da corrida","v":1,"o":""},{"c":"CO005","n":"Circuito de apoios","f":"CO","e":["V","L","G","A"],"m":"Percurso com apoios variados terminando em bola.","g":"3 voltas","r":"menos estações","p":"cronometrado","x":"organização dos pés","i":"o golpe final","v":1,"o":""},{"c":"CO006","n":"Reação ao sinal visual","f":"CO","e":["V","L","G","A","C"],"m":"Partida multidirecional ao gesto do professor — nunca ao som, porque em jogo a informação é visual.","g":"3 × 8 partidas","r":"gesto amplo e antecipado","p":"gesto sutil e tardio","x":"tempo entre sinal e primeiro passo","i":"o resto","v":1,"o":""},{"c":"CO007","n":"Acoplamento inferior-superior","f":"CO","e":["V","L","G","A"],"m":"Lançamento com pernas e braço em sequência, sentindo a ordem da cadeia.","g":"3 × 10","r":"só pernas, depois só braço","p":"lançamento com carga leve","x":"sequência de baixo para cima","i":"distância alcançada","v":1,"o":""},{"c":"CO008","n":"Mão-olho com duas bolas","f":"CO","e":["V","L","A"],"m":"Duas bolas simultâneas, uma quicando e uma no ar.","g":"6 min","r":"uma bola de cada vez","p":"trocar de mão a cada ciclo","x":"foco visual dividido","i":"quedas","v":1,"o":""},{"c":"CO009","n":"Propriocepção em superfície instável","f":"CO","e":["L","G","A"],"m":"Base instável e golpe controlado.","g":"3×6","r":"superfície mais estável","p":"com deslocamento antes","x":"estabilização","i":"direção","v":1,"o":""},{"c":"CO010","n":"Freada e reaceleração","f":"CO","e":["L","G","A","C"],"m":"Ida, freada completa e volta imediata na direção oposta.","g":"4×6","r":"distância menor","p":"com bola ao final de cada retorno","x":"qualidade da desaceleração","i":"tempo total","v":1,"o":""},{"c":"CO011","n":"Passos pequenos finais","f":"CO","e":["L","G","A","C"],"m":"Dois ajustes obrigatórios de pernas antes de cada contato.","g":"3 × 10","r":"um ajuste","p":"três ajustes com bola variando","x":"existência dos ajustes","i":"o golpe","v":1,"o":""},{"c":"CO012","n":"Velocidade de braço sem bola","f":"CO","e":["L","G","A","C"],"m":"Lançamentos e aceleração de raquete com braço solto, sem tensão.","g":"3 × 10","r":"movimento parcial","p":"com resistência leve","x":"soltura e aceleração final","i":"forma do gesto completo","v":1,"o":""},{"c":"DC008","n":"Saque - 10 de 10 em Cada Posição","f":"DC","e":["L","G","A","C"],"m":"10 saques por posição: T no DC, aberto no DC, T no AC, aberto no AC. Registrar percentual. Meta: 70% em todas.","g":"10 saques por posição","r":"Cinco saques por posição; alvo ampliado.","p":"Registro mensal com meta progressiva por posição.","x":"A repetibilidade do lançamento entre as quatro posições.","i":"O percentual isolado de um dia. O valor deste exercício é a série histórica.","v":0,"o":"Consistência máxima do saque em todas as posições."},{"c":"DC011","n":"FH com Variação de Spin","f":"DC","e":["L","G","A","C"],"m":"Jogadores alternam: 1 FH com topspin (alta trajetória), 1 FH plano (baixa trajetória). Manter rally por 5 min sem erro.","g":"5 min continuos","r":"Blocos separados: primeiro topspin, depois plano.","p":"Alternância comandada dentro da mesma troca.","x":"A mudança de plano do swing entre as duas trajetórias.","i":"Qual das duas o jogador prefere. As duas precisam existir.","v":0,"o":"Consistência alternando FH topspin e FH plano."},{"c":"DC013","n":"FH mais BH em Sequência Controlada","f":"DC","e":["V","L","G","A","C"],"m":"2 FH cruzados mais 2 BH cruzados mais 2 trocas livres. Ciclos de 6 bolas repetidos. Meta: 5 ciclos sem erro.","g":"5 ciclos de 6 bolas","r":"Sequência previsível e ritmo reduzido.","p":"Sequência imprevisível com variação de profundidade.","x":"A transição entre um golpe e outro — é aí que a técnica real aparece.","i":"A técnica de cada golpe isolado.","v":0,"o":"Transição suave entre FH e BH em sequência definida."},{"c":"DC014","n":"Voleio mais Golpe de Base - Alternado","f":"DC","e":["L","G","A","C"],"m":"Treinador alimenta alternando: 1 bola para voleio, 1 para golpe de base. 2 min continuos.","g":"2 min continuos","r":"Reduzir para um minuto; distância menor.","p":"Aumentar para três minutos com direção comandada.","x":"O ajuste de distância e de tempo entre as duas alturas de jogo.","i":"A qualidade individual do voleio e do golpe de base.","v":0,"o":"Consistência alternando entre voleio e golpe de base."},{"c":"DC016","n":"Drop Shot mais Lob - Alternado","f":"DC","e":["G","A","C"],"m":"Treinador alimenta bolas. Jogador alterna: 1 drop shot mais 1 lob mais 1 drop shot. Treina alternancia de golpes de controle extremos.","g":"4 séries de 6 bolas","r":"Alternância anunciada, com bola alimentada.","p":"Escolha entre drop e lob decidida pelo jogador conforme a posição do adversário.","x":"O disfarce comum aos dois golpes — a preparação precisa ser a mesma.","i":"A eficácia isolada de cada um. O objeto é a alternância.","v":0,"o":"Alternancia entre drop shot e lob como variação tática."},{"c":"DC017","n":"Passada mais Lob - Decisão","f":"DC","e":["G","A","C"],"m":"Treinador na rede. Quando avança: lob indicado. Quando recua: passada indicada.","g":"6 séries de 6 situações","r":"Decisão anunciada pelo treinador antes de cada bola.","p":"Decisão livre com adversário real na rede.","x":"O tempo da decisão — antes da preparação, com base na posição do adversário.","i":"A opção escolhida quando a leitura estava certa. Passada e lob são respostas igualmente válidas.","v":0,"o":"Decisão entre passada e lob com adversário na rede."},{"c":"DC018","n":"FH 4 Direções - Precisão","f":"DC","e":["L","G","A","C"],"m":"Treinador sinaliza um dos 4 cantos antes de alimentar. Jogador executa FH para o canto indicado.","g":"6 séries de 4 bolas","r":"Duas direções em vez de quatro; alvos amplos.","p":"Quatro direções com alvos estreitos e comando em tempo real.","x":"A repetibilidade do ponto de contato nas quatro direções.","i":"A velocidade. Precisão e velocidade não se treinam na mesma série.","v":0,"o":"Precisão do FH nos 4 cantos da quadra."},{"c":"DC019","n":"BH 4 Direções - Precisão","f":"DC","e":["L","G","A","C"],"m":"Mesma estrutura do DC018 com BH. Sinalização dos 4 cantos pelo treinador.","g":"6 séries de 4 bolas","r":"Duas direções com alvos amplos.","p":"Quatro direções sob comando, com contagem de acertos consecutivos.","x":"A consistência do apoio nas direções menos treinadas.","i":"A comparação com o forehand. São golpes de margens diferentes.","v":0,"o":"Precisão do BH nos 4 cantos da quadra."},{"c":"DM001","n":"Rotina de 20 Segundos MTY","f":"DM","e":["V","L","G","A","C"],"m":"Em exercícios de pontos: após cada ponto, 20 seg para respirar, olhar para as cordas e decidir a tática do próximo ponto.","g":"Integrado a qualquer exercício de pontos","r":"Rotina reduzida a duas etapas: respirar e decidir.","p":"Rotina completa mantida em situação de placar e sob fadiga.","x":"A presença das três etapas — respirar, fechar o ponto anterior, decidir o próximo.","i":"O resultado do ponto seguinte. O objetivo é executar a decisão tomada nos vinte segundos, não vencer o ponto.","v":0,"o":"Rotina pre-ponto MTY: respirar, resetar, decidir."},{"c":"DM002","n":"Diagnóstico de Estilo de Jogo","f":"DM","e":["G","A","C"],"m":"Atleta joga 1 set enquanto treinador anota: golpe favorito de abertura, direção preferida sob pressão, onde erra a maioria dos pontos, comportamento nos pontos decisivos.","g":"1 set de observação mais 20 min debriefing","r":"Observação restrita a um único bloco de jogo.","p":"Observação em set completo com registro estruturado por padrão.","x":"A leitura do padrão natural do jogador, sem intervenção durante a observação.","i":"Tudo, durante a observação. Corrigir aqui destrói o dado que se quer coletar.","v":0,"o":"Mapear o padrão natural de jogo para construir o plano MTY individual."},{"c":"DM003","n":"Pontos com Intenção Prévia","f":"DM","e":["L","G","A","C"],"m":"Antes de cada ponto, jogador anuncia o plano em voz alta. Treinador avalia se o plano foi seguido, independente do resultado.","g":"10-15 pontos","r":"Intenção anunciada em voz alta antes de cada ponto.","p":"Intenção silenciosa, com verificação no debriefing.","x":"A correspondência entre a intenção declarada e o que foi jogado.","i":"O resultado do ponto. A medida é a fidelidade ao plano, não a vitória.","v":0,"o":"Execução de plano tático definido antes de cada ponto."},{"c":"DM004","n":"Foco de Processo - Não Resultado","f":"DM","e":["V","L","G","A","C"],"m":"Rally livre com instrução: a cada ponto, o atleta identifica UM aspecto que executou bem, independente de ter ganho ou perdido.","g":"5-7 min","r":"Um único indicador de processo por série.","p":"Três indicadores simultâneos, com registro após cada bloco.","x":"A capacidade de nomear o que foi executado, independentemente do resultado.","i":"O placar. Ele está deliberadamente fora deste exercício.","v":0,"o":"Foco no processo de execução, não no resultado."},{"c":"DM005","n":"Pontos sob Pressão Artificial","f":"DM","e":["G","A","C"],"m":"Jogadores jogam pontos mas cada game perdido deve ser anunciado em voz alta com o placar atual. Treinador pode adicionar comentários.","g":"1 set completo","r":"Pressão moderada: placar levemente desfavorável.","p":"Pressão máxima com consequência real combinada previamente.","x":"A manutenção da rotina entre pontos sob pressão.","i":"O resultado. E também as reações — elas são o dado que se está coletando.","v":0,"o":"Exposição a pressão artificial para desenvolver regulação emocional."},{"c":"DM006","n":"Breathing Between Points","f":"DM","e":["V","L","G","A","C"],"m":"Em qualquer exercício de pontos: após cada ponto (ganho ou perdido), o jogador faz 3 respirações diafragmáticas antes de continuar.","g":"Integrado a qualquer exercício","r":"Respiração guiada em voz alta pelo treinador.","p":"Respiração autônoma verificada por observação externa.","x":"A presença da respiração completa antes do saque ou da devolução.","i":"O ritmo de jogo. Respirar leva o tempo que leva.","v":0,"o":"Hábito de respiração consciente entre os pontos."},{"c":"DM007","n":"Rally com Distrator","f":"DM","e":["L","G","A","C"],"m":"Treinador tenta distrair o atleta durante o rally: faz barulho, comenta erros, faz gestos. Atleta mantém foco sem responder.","g":"5-7 min","r":"Distrator único e previsível.","p":"Múltiplos distratores imprevisíveis, incluindo ruído e movimento.","x":"O retorno da atenção após a distração — não a ausência de distração.","i":"As distrações que ocorrem. Elas são o exercício, não a interferência nele.","v":0,"o":"Capacidade de focar sob distrações controladas."},{"c":"DM008","n":"Jogo Silencioso - Sem Reações","f":"DM","e":["G","A","C"],"m":"Jogadores jogam pontos sem qualquer reação verbal ou gestual - nem positiva nem negativa.","g":"1 set completo","r":"Silêncio apenas verbal; gestos permitidos.","p":"Neutralidade completa, verbal e corporal, no set inteiro.","x":"A neutralidade como ferramenta de economia, não como repressão.","i":"A comparação com o comportamento habitual do jogador. Este é um exercício, não um padrão a impor.","v":0,"o":"Neutralidade emocional eliminando reações verbais e corporais."},{"c":"DM009","n":"Decisão em Milissegundos - Bola Colorida","f":"DM","e":["G","A","C"],"m":"Treinador usa bolas de 2 cores. Cor vermelha: cruzada. Cor amarela: paralela. Jogador reage a cor assim que vê a bola.","g":"4 séries de 8 bolas","r":"Duas cores em vez de mais; anúncio antecipado.","p":"Anúncio no instante do quique, com três estímulos possíveis.","x":"A velocidade entre o estímulo e o início da preparação.","i":"A qualidade técnica do golpe. Aqui só o tempo de decisão está em jogo.","v":0,"o":"Velocidade de decisão com estímulo visual de cores."},{"c":"DM010","n":"Análise de Vídeo - Pós-Treino","f":"DM","e":["L","G","A","C"],"m":"Gravar o atleta durante drills principais. Revisar junto após o treino. Atleta identifica diferença entre o que sente e o que acontece.","g":"15-20 min pós-treino","r":"Analisar um único aspecto, escolhido antes da gravação.","p":"Análise comparativa entre duas sessões distantes no tempo.","x":"O que o jogador vê antes de o treinador falar.","i":"Detalhes que o jogador ainda não é capaz de perceber. Vídeo mostra demais — escolha um ponto.","v":0,"o":"Vídeo como ferramenta de autoconhecimento e aprendizado acelerado."},{"c":"DM011","n":"Jogo com Placar Imaginário","f":"DM","e":["G","A","C"],"m":"Treinador anuncia situação: 5-5 no terceiro set, break point. Jogador joga o ponto como se fosse real.","g":"10-15 pontos","r":"Placar imaginário anunciado uma vez, sem variação.","p":"Placar variando a cada ponto, incluindo situações de desvantagem extrema.","x":"A mudança de comportamento entre os placares.","i":"O resultado do bloco. O objeto é a variação de conduta conforme o placar.","v":0,"o":"Pressão de jogo real com placar imaginário específico."},{"c":"DM012","n":"Sequência de Erros - Recuperação Mental","f":"DM","e":["G","A","C"],"m":"Treinador alimenta 3 bolas difíceis que forçam erro. Na 4a bola, uma bola fácil. Atleta deve executar a 4a bola perfeitamente.","g":"6 séries","r":"Sequência de dois erros induzidos em vez de mais.","p":"Sequência longa de erros com pressão adicional de tempo.","x":"O tempo que o jogador leva para retomar a rotina após a sequência.","i":"Os erros em si. Eles são induzidos de propósito.","v":0,"o":"Capacidade de recuperação após erros consecutivos."},{"c":"DM013","n":"Pontos sem Pontuação - Só Execução","f":"DM","e":["V","L","G","A","C"],"m":"Jogadores jogam pontos normais mas sem placar. Ninguém conta. Foco exclusivo na execução com intenção.","g":"10-15 min","r":"Blocos de cinco minutos.","p":"Sessão inteira sem pontuação, com registro apenas de execução.","x":"O foco na execução quando o placar não existe.","i":"Qualquer menção a resultado. É exatamente o que se está removendo.","v":0,"o":"Remover a pressão do placar para focar na execução técnica."},{"c":"DM014","n":"Visualização Pre-Treino - 5 Minutos","f":"DM","e":["L","G","A","C"],"m":"Antes de entrar em quadra: 5 min de visualização. Atleta fecha os olhos e visualiza executando perfeitamente os drills da sessão.","g":"5 min pre-treino","r":"Visualização de um único golpe por três minutos.","p":"Visualização de um ponto completo com adversário específico.","x":"A nitidez sensorial da imagem, não a duração.","i":"A dificuldade de visualizar no início. É uma habilidade que se treina.","v":0,"o":"Visualização como preparação mental para o treino."},{"c":"DM015","n":"Foco em 1 Objetivo por Sessão","f":"DM","e":["V","L","G","A","C"],"m":"Antes de cada sessão, treinador e atleta definem 1 objetivo. Todos os drills são avaliados por esse único critério.","g":"Sessão inteira","r":"Objetivo definido pelo treinador.","p":"Objetivo definido pelo jogador e revisado por ele no fim da sessão.","x":"A manutenção do objetivo do início ao fim da sessão.","i":"Outras lacunas que aparecem durante a sessão. Elas entram na próxima — não nesta.","v":0,"o":"Hábito de definir e manter 1 objetivo técnico ou tático por sessão."},{"c":"DM016","n":"Jogo com Adversário Desconhecido","f":"DM","e":["G","A","C"],"m":"Atleta joga contra adversário de estilo diferente do usual: destros e canhotos, defensivos e agressivos, rápidos e lentos.","g":"1 set","r":"Adversário conhecido com estilo alterado por restrição.","p":"Adversário real desconhecido, sem informação prévia.","x":"O tempo que o jogador leva para identificar o padrão do adversário.","i":"O resultado. A leitura é a medida.","v":0,"o":"Adaptação tática a estilos diferentes."},{"c":"DM017","n":"Checklist Mental Pre-Saque","f":"DM","e":["L","G","A","C"],"m":"Antes de cada saque: 1. Posição dos pés. 2. Olhar o alvo. 3. Respiração. 4. Visualizar a trajetória. 5. Executar.","g":"Integrado a todos os drills de saque","r":"Checklist de dois itens.","p":"Checklist completo mantido sob pressão de placar.","x":"A constância do checklist entre o primeiro e o segundo saque.","i":"O conteúdo do checklist. Ele é do jogador, não do treinador.","v":0,"o":"Checklist mental consistente antes de cada saque."},{"c":"DM018","n":"Pontos com Mudança de Tática","f":"DM","e":["G","A","C"],"m":"2 games com tática A, depois 2 games com tática B. Avaliar qual funcionou melhor.","g":"4 games totais","r":"Mudança de tática anunciada pelo treinador entre os games.","p":"Mudança decidida pelo jogador com base na leitura do adversário.","x":"A capacidade de abandonar um plano que não está funcionando.","i":"O plano abandonado. Mudar não é falha de convicção.","v":0,"o":"Capacidade de mudar de plano tático durante o jogo."},{"c":"DM019","n":"Simulação de Matchday - Rotina Completa","f":"DM","e":["A","C"],"m":"Atleta chega como se fosse competição: aquecimento físico, visualização, rotina de pre-jogo, entrada com postura de competição.","g":"Sessão completa de 2h","r":"Simular apenas a rotina de aquecimento e o primeiro set.","p":"Simulação completa incluindo deslocamento, alimentação e intervalos reais.","x":"A fidelidade da rotina ao que acontecerá no dia da competição.","i":"O desempenho técnico. A rotina é o objeto.","v":0,"o":"Simular a rotina completa de um dia de competição."},{"c":"DM020","n":"Debriefing Pós-Jogo Estruturado","f":"DM","e":["L","G","A","C"],"m":"Após jogo ou simulação: 15 min de análise estruturada. O que funcionou. O que não funcionou. Por que os erros. O que trabalhar.","g":"15 min pós-jogo","r":"Três perguntas fixas de debriefing.","p":"Debriefing completo com registro escrito e comparação com jogos anteriores.","x":"A separação entre o que foi decisão e o que foi execução.","i":"O resultado do jogo. Ele já aconteceu e não é o assunto do debriefing.","v":0,"o":"Análise pós-competição para acelerar o aprendizado."},{"c":"DT001","n":"Armar Dir - Finalizar Esq 1","f":"DT","e":["G","A","C"],"m":"FH cruzado profundo (construção) e FH invertido (finalização). Alvo definido. O cruzado deve ser fundo, não atacar na bola de construção.","g":"4 séries de 6-8 bolas","r":"Treinador alimenta as bolas de construção; o jogador executa só a finalização.","p":"Construção livre em número variável de bolas, com a finalização decidida em tempo real.","x":"O reconhecimento da bola que autoriza a virada para o invertido.","i":"O erro da bola de finalização. Se a decisão de finalizar estava certa, a decisão fica; corrige-se apoio ou contato — nunca se pede mais efeito.","v":0,"o":"Construção pelo FH cruzado e finalização pelo invertido."},{"c":"DT002","n":"Armar Dir - Finalizar Esq 2","f":"DT","e":["G","A","C"],"m":"3 bolas: FH cruzado profundo, FH angulado curto abrindo quadra, FH paralelo finalização. Alvo para cada bola.","g":"4 séries de 6-9 bolas","r":"Reduzir a dois tempos: profundo e paralelo, sem o angulado.","p":"Ordem dos três tempos definida pelo jogador em tempo real.","x":"A sequência de intenções — cada bola tem função distinta e o corpo precisa mudar com ela.","i":"A velocidade das bolas de construção. Construção não é ataque.","v":0,"o":"Construção em 3 tempos: FH profundo, angulado e paralelo."},{"c":"DT003","n":"Armar Esq - Finalizar Dir 1","f":"DT","e":["G","A","C"],"m":"BH cruzado profundo (construção) mais FH cruzado (finalização). Padrão favorito de jogadores com BH sólido.","g":"4 séries de 6-8 bolas","r":"Alimentação das bolas de backhand pelo treinador.","p":"Padrão iniciado a partir do saque.","x":"A qualidade do backhand cruzado que sustenta o padrão até a virada.","i":"A ansiedade de virar cedo nas primeiras séries. Vira-se cedo demais quando a paciência ainda não existe — isso se constrói, não se corrige com instrução.","v":0,"o":"Padrão inverso: BH cruzado e finalização pelo FH."},{"c":"DT004","n":"Armar Esq - Finalizar Dir 2","f":"DT","e":["G","A","C"],"m":"BH cruzado profundo, FH invertido, FH inside in. Versão avançada: treinador sinaliza direção da 3a bola em tempo real.","g":"4 séries de 6-9 bolas","r":"Uma variante por série, anunciada previamente.","p":"As três variantes disponíveis, escolha em tempo real.","x":"A leitura da posição do adversário antes de escolher a variante.","i":"Qual variante foi escolhida. Se a leitura estava certa, todas as três são corretas.","v":0,"o":"Construção pelo BH com opções de finalização em 3 variantes."},{"c":"DT005","n":"Saque e 1a Bola DC","f":"DT","e":["G","A","C"],"m":"Jogador saca e golpeia a 1ª bola. Posição do saque varia. Direção da 1ª bola decide ANTES do saque.","g":"1 série de 16 combinações por lado","r":"Reduzir para oito combinações; decisão anunciada em voz alta antes do saque.","p":"Combinação decidida e não anunciada, com o ponto disputado até o fim.","x":"A decisão tomada antes do saque e mantida na primeira bola.","i":"O percentual de primeiro saque nas primeiras semanas. O objeto aqui é o encadeamento, não o saque.","v":0,"o":"Abertura do ponto no DC com intenção tática."},{"c":"DT006","n":"Saque e 1a Bola AC","f":"DT","e":["G","A","C"],"m":"Mesma estrutura do DT005 no AC. Saque aberto no AC vai para o BH do adversário.","g":"1 série de 16 combinações por lado","r":"Oito combinações com anúncio prévio da direção.","p":"Ponto disputado após a primeira bola, com registro do resultado do padrão.","x":"A adaptação do padrão ao ângulo diferente do lado da vantagem.","i":"A transposição direta do padrão do lado da igualdade. Os dois lados têm geometrias distintas.","v":0,"o":"Abertura do ponto no AC."},{"c":"DT007","n":"Devolução e 1a Bola","f":"DT","e":["G","A","C"],"m":"Treinador saca variando posição. Após a devolução, lança bola no lado oposto para golpe cruzado.","g":"1 série de 16 combinações por lado","r":"Saque à meia velocidade e direção anunciada.","p":"Saque real com direção variada e ponto disputado.","x":"A intenção de direção decidida antes da devolução.","i":"A profundidade da devolução quando a decisão está certa e o saque foi bom.","v":0,"o":"Abertura do ponto na devolução com intenção de direção."},{"c":"DT008","n":"Comando FH - 3 Direções","f":"DT","e":["G","A","C"],"m":"2 bolas na direita (cruzada e paralela de FH) mais 1 bola no lado esquerdo (inside out). Pressão continua.","g":"4 séries de 6-9 bolas","r":"Duas direções em vez de três.","p":"Três direções com o adversário disputando o ponto livremente após a terceira.","x":"A manutenção da posição de comando entre as três bolas.","i":"Erros na terceira bola. Três bolas de pressão consecutivas é carga alta — o erro final é esperado.","v":0,"o":"Pressionar com FH em 3 direções consecutivas."},{"c":"DT009","n":"FH Inside Out e Inside In - Decisão","f":"DT","e":["G","A","C"],"m":"Treinador lança bolas para o lado do BH. Jogador decide entre FH inside out (cruzado) ou inside in (paralelo).","g":"4 séries de 8 bolas","r":"Direção anunciada pelo treinador antes de cada bola.","p":"Decisão livre com o adversário se reposicionando de verdade.","x":"O tempo da decisão — ela precisa acontecer antes da preparação, não durante.","i":"Qual das duas foi escolhida. Ambas são corretas; o que se observa é se a escolha foi feita a tempo.","v":0,"o":"Decisão entre inside out e inside in sob pressão."},{"c":"DT010","n":"Ponto Restrição - Só Cruzadas","f":"DT","e":["L","G","A","C"],"m":"Jogadores jogam pontos normais mas SOMENTE com golpes cruzados. Ponto perdido automaticamente se bater na paralela.","g":"Sets de 4 games","r":"Restringir apenas um dos jogadores.","p":"Restrição para os dois, com games completos e placar valendo.","x":"A construção do ponto dentro do espaço restrito.","i":"A monotonia da troca. O ponto do exercício é justamente a paciência que ele impõe.","v":0,"o":"Controle tático sob restrição de direção."},{"c":"DT011","n":"Ponto Restrição - FH Dominante","f":"DT","e":["G","A","C"],"m":"Atleta deve usar o FH sempre que possível, correndo para usar o FH mesmo em bolas de BH.","g":"Sets de 4 games","r":"Permitir backhand em bolas de emergência.","p":"Restrição total, com o adversário atacando o lado do backhand deliberadamente.","x":"O deslocamento que viabiliza o forehand invertido.","i":"A leitura de que isto é um modelo de jogo. É um exercício de restrição, não uma recomendação tática.","v":0,"o":"Jogo construído exclusivamente pelo FH."},{"c":"DT012","n":"Ponto Restrição - BH Dominante","f":"DT","e":["G","A","C"],"m":"Atleta deve usar o BH sempre que possível. Restrição mais difícil para a maioria dos destros.","g":"Sets de 4 games","r":"Permitir forehand nas bolas curtas.","p":"Restrição total com pressão deliberada no lado do forehand.","x":"A capacidade de construir e não apenas sustentar com o backhand.","i":"O número de erros. O lado menos usado erra mais — é o motivo do exercício existir.","v":0,"o":"Jogo construído pelo BH."},{"c":"DT013","n":"Rally com Zona Proibida - Centro","f":"DT","e":["L","G","A","C"],"m":"Em rally livre, o centro da quadra do adversário é zona proibida. Só golpes para os cantos contam como positivos.","g":"5-7 min","r":"Zona proibida estreita, apenas o corredor central.","p":"Zona ampliada, com perda do ponto ao acertá-la.","x":"A consciência de direção em cada golpe.","i":"A velocidade. Bola lenta e fora do centro cumpre o objetivo.","v":0,"o":"Evitar o centro da quadra ao golpear."},{"c":"DT014","n":"Rally com Zona Proibida - Curta","f":"DT","e":["L","G","A","C"],"m":"Em rally, bola antes da linha de serviço do adversário é ponto negativo. Força profundidade em todos os golpes.","g":"5-7 min","r":"Marcar a zona curta com cones visíveis e não penalizar de imediato.","p":"Perda do ponto na primeira bola curta, sem aviso.","x":"A altura sobre a rede — profundidade nasce da altura.","i":"A velocidade da bola. Bola alta e profunda é bola correta aqui.","v":0,"o":"Evitar bolas curtas em todos os golpes."},{"c":"DT015","n":"3 Bolas de Construção mais Winner","f":"DT","e":["G","A","C"],"m":"Treinador alimenta 3 bolas de rally neutro. Na 4a bola, jogador tenta o winner. Regra: não pode tentar antes da 4a bola.","g":"6 séries de 4 bolas","r":"Treinador alimenta as três bolas de construção.","p":"Número de bolas de construção variável, com o jogador decidindo quando finalizar.","x":"O reconhecimento do momento em que a construção autoriza a finalização.","i":"O resultado do winner. Decisão certa com erro de execução é corrigida na execução, nunca na decisão.","v":0,"o":"Padrão de 3 bolas de construção seguidas de finalização."},{"c":"DT016","n":"Abertura de Quadra mais Subida a Rede","f":"DT","e":["G","A","C"],"m":"FH cruzado com ângulo para abrir espaço, depois bola curta para approach pela paralela e subida à rede.","g":"6 séries de 3 bolas J","r":"Bola de subida alimentada pelo treinador.","p":"Ponto disputado até o fim com o adversário buscando a passada.","x":"A continuidade do deslocamento entre a abertura e a subida.","i":"A qualidade do voleio final nas primeiras séries. O objeto é o encadeamento.","v":0,"o":"Abrir quadra pelo cruzado e subir pela paralela."},{"c":"DT017","n":"Devolução Chip-and-Charge","f":"DT","e":["A","C"],"m":"Treinador saca. Jogador executa chip (BH slice baixa sobre a rede) e avança imediatamente a rede. Finaliza com voleio.","g":"6 séries de 4 situações J","r":"Saque à meia velocidade e subida anunciada.","p":"Saque real, subida decidida em tempo real conforme a devolução possível.","x":"O primeiro passo para dentro no instante da devolução.","i":"A profundidade da devolução. Chip-and-charge vive da chegada, não da bola.","v":0,"o":"Devolução agressiva com subida imediata a rede."},{"c":"DT018","n":"Jogo 1x1 com Placar Invertido","f":"DT","e":["G","A","C"],"m":"Jogadores jogam sets mas o placar começa em 0-4 para o atleta treinando. Ele precisa ganhar todos os games restantes.","g":"1 set por treino","r":"Desvantagem menor no placar inicial.","p":"Desvantagem maior, com o set valendo dentro de um bloco de competição.","x":"A rotina entre pontos sob desvantagem.","i":"O resultado do set. O placar aqui é ferramenta, não medida — o resultado é efeito colateral da performance.","v":0,"o":"Resiliência e estratégia sob pressão de desvantagem."},{"c":"DT019","n":"Pontos de Tiebreak - Situações Decisivas","f":"DT","e":["A","C"],"m":"Jogadores jogam somente situações de tiebreak: 6-6, 7-6, etc. Treinador pode sinalizar a situação antes do ponto.","g":"10-15 pontos","r":"Pontos isolados sem contexto de placar.","p":"Tiebreak completo com registro dos pontos decisivos.","x":"A decisão tática nos pontos de maior peso e a manutenção da rotina.","i":"O resultado. O que se observa é se a decisão do ponto grande foi a mesma do ponto pequeno.","v":0,"o":"Execução nos pontos mais importantes do tiebreak."},{"c":"DT020","n":"Construção BH Profundo mais Inside In","f":"DT","e":["G","A","C"],"m":"BH cruzado profundo. Treinador lança 2a bola para FH executar inside in.","g":"4 séries de 6 bolas","r":"Alimentação da bola profunda de backhand pelo treinador.","p":"Padrão iniciado no saque, com adversário real defendendo.","x":"A profundidade do backhand que cria o espaço para o inside in.","i":"A velocidade do backhand de abertura. Ele abre com profundidade, não com força.","v":0,"o":"BH fundo abre, inside in finaliza."},{"c":"DT021","n":"Defesa Profunda mais Transição Ataque","f":"DT","e":["G","A","C"],"m":"2 bolas profundas (defesa) mais 1 bola mais curta ou lenta (oportunidade). Atleta deve reconhecer e mudar para modo ataque.","g":"4 séries de 6 bolas","r":"Duas bolas em vez de três, com a virada anunciada.","p":"Número de bolas defensivas variável e virada decidida pelo jogador.","x":"O reconhecimento da bola que autoriza a transição.","i":"A escolha entre defesa alta e acelerada. As duas são válidas — a função da defesa é parar o ataque.","v":0,"o":"Saída da posição defensiva para o ataque em sequência de 3 bolas."},{"c":"DT022","n":"Jogo 1x1 - Só Pontos Longos","f":"DT","e":["G","A","C"],"m":"Pontos só contam se tiverem pelo menos 6 golpes. Pontos que terminam antes são refeitos.","g":"10-15 pontos válidos","r":"Duração mínima menor por ponto.","p":"Duração mínima maior, com pontos abaixo do mínimo anulados.","x":"A capacidade de sustentar qualidade técnica ao longo do ponto.","i":"A estratégia de encurtar o ponto. Neste exercício ela está temporariamente suspensa — não é correção de método.","v":0,"o":"Consistência e estratégia em pontos de alta duração."},{"c":"DT023","n":"Serve-Volley Clássico","f":"DT","e":["A","C"],"m":"Jogador saca e avança imediatamente a rede. Split step antes do voleio. Finalizar com 1-2 voleios.","g":"6 séries de 6 pontos J","r":"Subida a partir de saque alimentado, sem pressão de devolução.","p":"Serve-volley em ponto real com devolução de ataque.","x":"O split step antes do primeiro voleio e a distância percorrida após o saque.","i":"O percentual de pontos ganhos. Serve-volley é ferramenta de variação — o volume de acerto não é a medida.","v":0,"o":"Padrão serve-volley como tática de surpresa."},{"c":"DT024","n":"Segunda Bola do Adversário - Ataque","f":"DT","e":["G","A","C"],"m":"Treinador simula segundo saque fraco (bola mais lenta e curta). Jogador deve reconhecer e atacar agressivamente.","g":"8-12 devoluções","r":"Segundo saque alimentado à meia velocidade.","p":"Segundo saque real com o ponto disputado após a devolução.","x":"A entrada para dentro da quadra na devolução do segundo saque.","i":"O erro da devolução agressiva. Devolução de ataque que nunca erra não é ataque.","v":0,"o":"Aproveitar a segunda bola do adversário para atacar."},{"c":"DT025","n":"Lob Tático mais Posicionamento na Rede","f":"DT","e":["G","A","C"],"m":"Treinador na rede. Quando recua: lob indicado. Quando mantém posição: passada indicada. Decisão baseada na posição.","g":"6 séries de 6 situações","r":"Lob alimentado sem adversário na rede.","p":"Adversário real na rede buscando o smash, com ponto disputado.","x":"O reposicionamento imediato após o lob — a decisão continua depois da bola sair.","i":"A profundidade do lob nas primeiras séries.","v":0,"o":"Quando usar o lob e como se reposicionar após."},{"c":"DT026","n":"Drop Shot mais Subida a Rede","f":"DT","e":["G","A","C"],"m":"Drop shot mais sprint máximo a rede. Treinador alimenta resposta do adversário. Jogador cobre a resposta.","g":"6 séries de 4 situações","r":"Drop shot alimentado com o jogador já dentro da quadra.","p":"Drop shot em ponto real com o adversário buscando a bola.","x":"A subida imediata — quem faz drop e fica é quem perde o ponto.","i":"A qualidade do drop shot. Aqui o objeto é o que vem depois dele.","v":0,"o":"Drop shot seguido de avanço imediato a rede."},{"c":"DT027","n":"Jogo com Pontuação por Zona","f":"DT","e":["L","G","A","C"],"m":"Dividir quadra em 3 zonas: vermelha (próxima -1), amarela (central 0), verde (fundo +1). Acumular pontos por zona.","g":"10 games","r":"Zonas amplas com pontuação simples.","p":"Zonas estreitas com pesos diferentes por zona.","x":"A consciência de destino antes da preparação.","i":"A pontuação final. As zonas são linguagem, não placar.","v":0,"o":"Consciência de onde golpear em cada situação."},{"c":"DT028","n":"Sequência Saque mais 3 Bolas","f":"DT","e":["G","A","C"],"m":"Jogador saca, recebe a 1ª bola e joga mais 2 golpes com intenção tática definida. Não pode tentar winner antes da 3a bola.","g":"8-12 séries de 4 bolas","r":"Saque mais duas bolas.","p":"Saque mais três bolas com o ponto disputado a seguir.","x":"A manutenção da iniciativa ao longo das três bolas.","i":"O erro na terceira bola. É o ponto de maior carga da sequência.","v":0,"o":"Padrão completo de abertura no saque com 3 bolas."},{"c":"DT029","n":"Triângulo Tático - 3 Zonas","f":"DT","e":["G","A","C"],"m":"Cones demarcam 3 zonas: defensiva, construção e finalização. Conforme a zona, o atleta executa o golpe tático correspondente.","g":"4 séries de 9 situações","r":"Duas zonas em vez de três, com decisão anunciada.","p":"Três zonas com decisão em tempo real e adversário ativo.","x":"A leitura da zona de onde a bola está sendo jogada — a decisão muda com a posição.","i":"A execução técnica dentro de cada zona. O objeto é a decisão.","v":0,"o":"Tomada de decisão tática em 3 zonas diferentes."},{"c":"DT030","n":"Ponto Livre - Aplicação Tática","f":"DT","e":["G","A","C"],"m":"Jogadores jogam sets normais mas após cada ponto identificam o padrão tático que funcionou ou falhou. Debriefing de 30 seg após cada game.","g":"1 set de 6 games","r":"Um padrão obrigatório por game, anunciado antes.","p":"Jogo totalmente livre com debriefing sobre os padrões que apareceram.","x":"Se os padrões treinados aparecem espontaneamente ou só sob comando.","i":"Tudo, durante o jogo. Este é um exercício de observação — a correção vem no debriefing.","v":0,"o":"Integrar todos os padrões táticos em situação de jogo livre."},{"c":"FB001","n":"FH Cruzado Profundo","f":"FB","e":["V","L","G","A","C"],"m":"Jogadores trocam bolas na cruzada de forehand buscando o último metro do fundo. Ritmo moderado. Treinador observa preparação, ponto de contato e finalização.","g":"5-7 min","r":"Treinador alimenta de cesta em vez de troca livre; quadra reduzida ao corredor da cruzada.","p":"Alvo no último metro; contar 8 cruzadas seguidas dentro do alvo antes de encerrar a série.","x":"Ponto de contato à frente do corpo e altura da bola sobre a rede — profundidade vem da altura, não da força.","i":"Velocidade da bola e escolha de direção. Bola curta aqui é erro de altura, não de intenção — não peça mais efeito para corrigir.","v":0,"o":"Consistência e profundidade do forehand cruzado."},{"c":"FB002","n":"BH Cruzado Profundo","f":"FB","e":["V","L","G","A","C"],"m":"Mesmo formato do FB001 com backhand cruzado. Para dois mãos: verificar braço não-dominante ativo. Para uma mão: checar posição do ombro no contato.","g":"5-7 min","r":"Treinador alimenta; bola parada no ponto alto para quem ainda não tem timing de backhand.","p":"Alvo no último metro e alternância de altura sob comando do treinador.","x":"Duas mãos: braço não-dominante ativo na aceleração. Uma mão: ombro fechado no contato.","i":"Velocidade. Diferença entre uma e duas mãos não se corrige — se acomoda; o gesto que o jogador traz é o ponto de partida.","v":0,"o":"Consistência e profundidade do backhand cruzado."},{"c":"FB003","n":"FH Paralelo","f":"FB","e":["V","L","G","A","C"],"m":"Jogadores trocam bolas na paralela de forehand. Bola funda e plana, sem ângulo. Verificar fechamento do ombro antes do contato.","g":"5-7 min","r":"Bola alimentada de posição fixa, sem deslocamento lateral.","p":"Mudança de direção sob comando: duas paralelas, uma cruzada, retomar.","x":"Fechamento do ombro antes do contato e transferência de peso para frente.","i":"O erro para fora. Ele é consequência de ombro aberto cedo, não de excesso de força — corrija o ombro e o erro sai sozinho.","v":0,"o":"Forehand paralelo com profundidade e controle."},{"c":"FB004","n":"BH Paralelo","f":"FB","e":["V","L","G","A","C"],"m":"Jogadores trocam bolas na paralela de backhand. Para dois mãos: quadris devem rodar completamente na direção da paralela. Para uma mão: extensão do braço mais longa que no cruzado.","g":"5-7 min","r":"Alimentação de cesta com bola alta e lenta; encurtar a distância do alvo.","p":"Alternar paralela e cruzada mantendo profundidade em ambas.","x":"Duas mãos: rotação completa do quadril na direção da paralela. Uma mão: extensão longa do braço.","i":"A taxa de acerto. Este é o golpe de menor consistência natural — use o número como diagnóstico, não como meta da sessão.","v":0,"o":"Backhand paralelo com profundidade."},{"c":"FB005","n":"Rally do Meio - FH e BH","f":"FB","e":["V","L","G","A","C"],"m":"Jogadores trocam bolas pelo centro usando FH e BH conforme a bola chega. Sem restrição de direção. Foco em profundidade e recuperação ao centro entre golpes.","g":"7-10 min","r":"Reduzir o espaço de deslocamento; treinador anuncia o lado antes de alimentar.","p":"Sem anúncio, com variação de altura e profundidade.","x":"Leitura antecipada do lado e a transição entre um golpe e o outro.","i":"A técnica de cada golpe isolado. Aqui se observa a passagem de um para o outro — é nela que a técnica real aparece.","v":0,"o":"Aquecer e desenvolver leitura de bola usando ambos os golpes."},{"c":"FB007","n":"BH com Alvo - Cruzada","f":"FB","e":["V","L","G","A","C"],"m":"Área no canto cruzado (min 1mx1m). Jogadores trocam BH cruzado buscando a área. Sistema de contagem: meta de 16 acertos. Use como avaliação mensal.","g":"16 acertos","r":"Ampliar a área do alvo; alimentação de cesta.","p":"Reduzir o alvo; contar acertos consecutivos e reiniciar a contagem ao errar.","x":"Direção e ponto de contato. O alvo é referência visual, não obrigação.","i":"Velocidade da bola. Perseguir alvo com força é o caminho mais curto para descaracterizar o golpe.","v":0,"o":"Precisão do BH cruzado com alvo visual."},{"c":"FB008","n":"FH Alto e Baixo","f":"FB","e":["L","G","A","C"],"m":"Jogadores alternam FH alto (topspin, parabólico) e FH baixo (plano, rápido) na cruzada. A cada dois golpes mudar a trajetória. Treina controle de spin e variação de ritmo.","g":"4 séries de 8 bolas","r":"Trabalhar apenas uma das trajetórias por série.","p":"Alternância sob comando do treinador, sem sequência previsível.","x":"A mudança de plano do swing entre a bola plana e a de topspin.","i":"Qual das duas trajetórias é a preferida do jogador. As duas convivem — não se elege uma como a certa.","v":0,"o":"Variação de trajetória do FH - plana e com topspin."},{"c":"FB009","n":"BH Slice Cruzado","f":"FB","e":["L","G","A","C"],"m":"Jogado

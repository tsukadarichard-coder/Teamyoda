                atualiza({ plano: null, regPlano: {}, historicoRelatorios: [item, ...historico] });

            }}>Remover plano</Botao>

/* Cadastro de um exercício próprio da academia, com os mesmos campos do
   catálogo do manual — depois de salvo, ele entra em TODOS_EXERCICIOS()
   e passa a estar disponível pra geração de plano e sessão, pro índice
   que a IA recebe e pra busca aqui no catálogo, exatamente como um
   exercício do manual (só que marcado como "exercício do treinador"). */
function NovoExercicioAcademia({ aoAdicionar }) {
  const VAZIO = { n: "", f: Object.keys(FAM)[0], e: [], m: "", g: "", r: "", p: "", x: "", i: "", o: "" };
  const [aberto, setAberto] = useState(false);
  const [ex, setEx] = useState(VAZIO);
  const set = (k, v) => setEx((x) => ({ ...x, [k]: v }));
  function alternaEstagio(s) {
    setEx((x) => ({ ...x, e: x.e.includes(s) ? x.e.filter((v) => v !== s) : [...x.e, s] }));
  }
  function adicionar() {
    if (!ex.n.trim()) return;
    aoAdicionar({
      c: "CUSTOM-" + Date.now().toString(36).toUpperCase(),
      n: ex.n.trim(), f: ex.f, e: ex.e, m: ex.m.trim(), g: ex.g.trim(),
      r: ex.r.trim(), p: ex.p.trim(), x: ex.x.trim(), i: ex.i.trim(), o: ex.o.trim(),
      custom: true,
    });
    setEx(VAZIO);
    setAberto(false);
  }
  if (!aberto) {
    return <div className="mb-5"><Botao variante="vazio" onClick={() => setAberto(true)}>+ Novo exercício da academia</Botao></div>;
  }
  return (
    <div className="mb-5" style={{ background: C.cal, border: "1px solid " + C.linha, padding: "13px 15px" }}>
      <Etiqueta>Novo exercício da academia</Etiqueta>
      <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginTop: 4, marginBottom: 12 }}>
        Mesmos campos do catálogo do manual — enriquece a biblioteca da academia. Só o nome é
        obrigatório; preencha o resto quando puder.
      </p>
      <Campo rotulo="Nome"><input style={entrada} value={ex.n} onChange={(e) => set("n", e.target.value)} /></Campo>
      <Campo rotulo="Família"><Seletor opcoes={Object.keys(FAM).map((f) => ({ v: f, r: f }))} valor={ex.f} aoMudar={(v) => set("f", v)} /></Campo>
      <Campo rotulo="Estágios" nota="Em quais estágios este exercício serve.">
        <div className="flex flex-wrap gap-2">
          {ESTAGIOS.map((s) => {
            const on = ex.e.includes(s.s);
            return (
              <button key={s.s} type="button" onClick={() => alternaEstagio(s.s)}
                style={{ fontFamily: ARCH, fontSize: 13, fontWeight: on ? 700 : 500, padding: "8px 13px",
                  borderRadius: 2, cursor: "pointer", border: "1px solid " + (on ? C.tinta : C.linha),
                  background: on ? C.tinta : C.cal, color: on ? C.papel : C.grafite }}>
                {s.n}
              </button>
            );
          })}
        </div>
      </Campo>
      <Campo rotulo="Objetivo (resumo)"><input style={entrada} value={ex.o} onChange={(e) => set("o", e.target.value)} /></Campo>
      <Campo rotulo="Montagem"><textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={ex.m} onChange={(e) => set("m", e.target.value)} /></Campo>
      <Campo rotulo="Carga"><input style={entrada} value={ex.g} onChange={(e) => set("g", e.target.value)} /></Campo>
      <Campo rotulo="Regressão"><textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={ex.r} onChange={(e) => set("r", e.target.value)} /></Campo>
      <Campo rotulo="Progressão"><textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={ex.p} onChange={(e) => set("p", e.target.value)} /></Campo>
      <Campo rotulo="Corrigir"><textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={ex.x} onChange={(e) => set("x", e.target.value)} /></Campo>
      <Campo rotulo="Ignorar"><textarea rows={2} style={{ ...entrada, resize: "vertical" }} value={ex.i} onChange={(e) => set("i", e.target.value)} /></Campo>
      <div className="flex gap-2">
        <Botao variante="saibro" onClick={adicionar} disabled={!ex.n.trim()}>Adicionar à biblioteca</Botao>
        <Botao variante="vazio" onClick={() => { setEx(VAZIO); setAberto(false); }}>Cancelar</Botao>
      </div>
    </div>
  );
}

function TelaCatalogo({ exerciciosCustom, setExerciciosCustom }) {
  const [busca, setBusca] = useState("");
  const [estagio, setEstagio] = useState("todos");
  const [familia, setFamilia] = useState("todas");
  const lista = useMemo(() => {
    const t = busca.trim().toLowerCase();
    const filtrados = TODOS_EXERCICIOS().filter((e) => {
      if (estagio !== "todos" && !e.e.includes(estagio)) return false;
      if (familia !== "todas" && e.f !== familia) return false;
      if (!t) return true;
      return (e.c + " " + e.n + " " + e.m + " " + e.i).toLowerCase().includes(t);
    });
    // os da academia primeiro — senão, com 315+ exercícios do manual, um
    // exercício recém-cadastrado nunca aparece nos 80 primeiros da lista.
    return [...filtrados].sort((a, b) => (a.custom === b.custom) ? 0 : (a.custom ? -1 : 1));
  }, [busca, estagio, familia, exerciciosCustom]);
  function remover(c) {
    if (!confirm("Remover este exercício da biblioteca da academia? Não dá pra desfazer.")) return;
    setExerciciosCustom(exerciciosCustom.filter((e) => e.c !== c));
  }
  return (
    <div>
      <MapaFamilias />
      <NovoExercicioAcademia aoAdicionar={(ex) => setExerciciosCustom([...exerciciosCustom, ex])} />
      <input style={{ ...entrada, marginBottom: 14 }} value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar por código, nome ou montagem" />
      <Campo rotulo="Estágio"><Seletor opcoes={[{ v: "todos", r: "Todos" }, ...ESTAGIOS.map((e) => ({ v: e.s, r: e.s }))]} valor={estagio} aoMudar={setEstagio} /></Campo>
      <Campo rotulo="Família"><Seletor opcoes={[{ v: "todas", r: "Todas" }, ...Object.keys(FAM).map((f) => ({ v: f, r: f }))]} valor={familia} aoMudar={setFamilia} /></Campo>
      <div className="mb-3"><Etiqueta>{lista.length} exercícios</Etiqueta></div>
      {lista.slice(0, 80).map((e) => <CartaoExercicio key={e.c} e={e} aoRemover={e.custom ? () => remover(e.c) : undefined} />)}
      {lista.length > 80 && <p style={{ ...prosa, fontSize: 13, color: C.grafite }}>Mostrando os 80 primeiros. Refine a busca.</p>}
    </div>
  );
}

/* "Adicionar à tela de início" não tem uma API única entre navegadores:
   Chrome/Android (e Edge/desktop) disparam beforeinstallprompt e dá pra
   chamar .prompt() num clique; iOS Safari não tem NENHUMA API pra isso —
   só dá pra orientar o toque em Compartilhar → Adicionar à Tela de
   Início. Sem nenhum dos dois sinais (ex: desktop Firefox), não mostra
   nada — instrução sem ação possível só confunde. */
function InstalarApp({ compacto }) {
  const [prompt, setPrompt] = useState(null);
  const [instalado, setInstalado] = useState(false);
  useEffect(() => {
    function aoPedir(e) { e.preventDefault(); setPrompt(e); }
    function aoInstalar() { setInstalado(true); setPrompt(null); }
    window.addEventListener("beforeinstallprompt", aoPedir);
    window.addEventListener("appinstalled", aoInstalar);
    return () => {
      window.removeEventListener("beforeinstallprompt", aoPedir);
      window.removeEventListener("appinstalled", aoInstalar);
    };
  }, []);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (instalado || standalone || (!prompt && !ios)) return null;

  async function instalar() {
    if (!prompt) return;
    prompt.prompt();
    await prompt.userChoice;
    setPrompt(null);
  }

  if (compacto) {
    return prompt ? (
      <button onClick={instalar} style={{ fontFamily: ARCH, fontSize: 11.5, fontWeight: 600, color: C.grafite, cursor: "pointer",
        padding: "4px 8px", border: "1px solid " + C.linha, borderRadius: 2, background: C.cal }}>
        instalar app
      </button>
    ) : (
      <Etiqueta cor={C.grafite}>Instalar: compartilhar → tela de início</Etiqueta>
    );
  }

  return (
    <div style={{ background: C.cal, border: "1px solid " + C.linha, borderLeft: "3px solid " + C.saibro, padding: "11px 13px", marginTop: 18 }}>
      {prompt ? (
        <>
          <p style={{ ...prosa, fontSize: 13, marginBottom: 8 }}>Instale o app na tela de início do seu celular — abre direto, sem digitar o endereço de novo.</p>
          <Botao pequeno onClick={instalar}>Instalar app</Botao>
        </>
      ) : (
        <p style={{ ...prosa, fontSize: 13 }}>
          Pra instalar na tela de início: toque em <b>Compartilhar</b> (o ícone com uma seta pra cima) e depois em <b>"Adicionar à Tela de Início"</b>.
        </p>
      )}
    </div>
  );
}

/* ── "meu nome" ──
   Sem isso, quem entra por solicitar-acesso.html digita o nome certo,
   mas quem foi vinculado por "corrigir cadastro" (ou logou antes desse
   campo existir) só tinha o e-mail pra aparecer em toda seleção de
   professor. Guarda em orgs/{org}/solicitacoes/{uid}.nome — o mesmo
   lugar de onde listaProfessores() já lê — pra qualquer um corrigir o
   próprio nome, sem depender do coordenador. */
function EditorMeuNome({ org, uid, emailAtual }) {
  const [nome, setNome] = useState("");
  const [carregado, setCarregado] = useState(false);
  const [editando, setEditando] = useState(false);
  const [rascunho, setRascunho] = useState("");
  const [salvando, setSalvando] = useState(false);

  useEffect(() => {
    if (!db || !org || !uid) { setCarregado(true); return; }
    db.collection("orgs").doc(org).collection("solicitacoes").doc(uid).get()
      .then((d) => setNome(d.exists ? (d.data().nome || "") : ""))
      .catch(() => {})
      .then(() => setCarregado(true));
  }, [org, uid]);

  async function salvar() {
    const novo = rascunho.trim();
    if (!novo) return;
    setSalvando(true);
    try {
      await db.collection("orgs").doc(org).collection("solicitacoes").doc(uid)
        .set({ nome: novo, email: emailAtual || "" }, { merge: true });
      setNome(novo);
      setEditando(false);
    } catch (e) {}
    setSalvando(false);
  }

  if (!carregado) return null;
  if (editando) {
    return (
      <div className="flex items-center gap-1">
        <input autoFocus style={{ ...entrada, fontSize: 11.5, padding: "4px 6px", width: 130 }} value={rascunho}
          onChange={(e) => setRascunho(e.target.value)} placeholder="Seu nome"
          onKeyDown={(e) => e.key === "Enter" && salvar()} />
        <Botao pequeno onClick={salvar} disabled={salvando || !rascunho.trim()}>{salvando ? "…" : "Salvar"}</Botao>
        <button onClick={() => setEditando(false)} style={{ border: "none", background: "none", cursor: "pointer", color: C.grafite, fontSize: 15 }}>×</button>
      </div>
    );
  }
  return (
    <button onClick={() => { setRascunho(nome); setEditando(true); }} title="Como seu nome aparece pros outros"
      style={{ fontFamily: ARCH, fontSize: 11.5, fontWeight: 600, color: C.grafite, cursor: "pointer", padding: "4px 8px",
        border: "1px solid " + C.linha, borderRadius: 2, background: C.cal, maxWidth: 110, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
      {nome || "+ meu nome"}
    </button>
  );
}

/* ── visão geral da equipe (dashboard do coordenador) ──
   Um retrato de cada professor da academia — não o painel de um só
   (isso já é o Dashboard com "toda a academia"), e sim "cada um deles,
   lado a lado". A grade de horário completa mora na Agenda; aqui é
   gente, não grade. */
function VisaoGeralEquipe({ alunos, turmas, uidAtual, irPara }) {
  const [professores, setProfessores] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [selecionado, setSelecionado] = useState(null); // uid do professor aberto, ou null
  const [removendo, setRemovendo] = useState(null);
  const [promovendo, setPromovendo] = useState(null);
  const [erro, setErro] = useState("");

  function carregar() {
    setCarregando(true);
    listaProfessores().then((p) => { setProfessores(p); setCarregando(false); });
  }
  useEffect(carregar, []);

  /* Remove o ACESSO dele a esta academia (revoga a claim e marca o
     pedido como removido) — não apaga a conta do Firebase nem os
     jogadores já atribuídos a ele, que continuam com o nome salvo até
     alguém reatribuir. Reversível: basta aprová-lo de novo em Pedidos. */
  async function removerProfessor(p) {
    if (!confirm("Remover " + p.nome + " desta academia? Ele perde o acesso — pode ser reaprovado depois em Pedidos.")) return;
    setRemovendo(p.uid); setErro("");
    try {
      const token = await window.mtyAuth.tokenId();
      const r = await fetch("/.netlify/functions/remover-treinador", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: "Bearer " + token },
        body: JSON.stringify({ uid: p.uid }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.erro || ("Erro " + r.status));
      if (selecionado === p.uid) setSelecionado(null);
      carregar();
    } catch (e) {
      setErro(String(e.message || e));
    }
    setRemovendo(null);
  }

  /* Promove um treinador a coordenador — ele passa a ver Academia/Quadras
     e a própria aba de Equipe, e ganha os mesmos poderes de aprovar,
     remover e promover outros. Não tem "rebaixar" ainda. */
  async function promoverProfessor(p) {
    if (!confirm("Promover " + p.nome + " a coordenador? Ele passa a ter acesso total à academia.")) return;
    setPromovendo(p.uid); setErro("");
    try {
      const token = await window.mtyAuth.tokenId();
      const r = await fetch("/.netlify/functions/promover-treinador", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: "Bearer " + token },
        body: JSON.stringify({ uid: p.uid }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.erro || ("Erro " + r.status));
      carregar();
    } catch (e) {
      setErro(String(e.message || e));
    }
    setPromovendo(null);
  }

  if (carregando) return <p style={{ ...prosa, color: C.grafite }}>Carregando…</p>;

  const linhas = professores.map((p) => {
    const meus = alunos.filter((a) => a.professorUid === p.uid);
    const abertos = meus.filter((a) => a.plano && aulaEmVigor(a)).length;
    const dadas7 = aulasDadasRecentes(meus, 7);
    const minhasTurmas = turmas.filter((t) => t.professorUid === p.uid || t.professorAuxiliarUid === p.uid);
    let pendencias = 0;
    minhasTurmas.forEach((t) => (t.pendencias || []).forEach((pd) => { if (!pd.resolvida) pendencias++; }));
    return { ...p, alunos: meus.length, abertos, dadas7, pendencias, turmas: minhasTurmas.length };
  });
  const semDono = alunos.filter((a) => !a.professorUid).length;

  const profAberto = selecionado ? linhas.find((l) => l.uid === selecionado) : null;
  if (profAberto) {
    const meus = alunos.filter((a) => a.professorUid === profAberto.uid);
    return (
      <div>
        <button onClick={() => setSelecionado(null)} className="mb-4" style={{ ...prosa, color: C.grafite, cursor: "pointer" }}>← Todos os professores</button>
        <h2 style={{ fontFamily: ARCH, fontSize: 18, fontWeight: 700, marginBottom: 4 }}>{profAberto.nome}</h2>
        <div className="flex flex-wrap gap-2 mb-5">
          <Etiqueta>{profAberto.alunos} jogador{profAberto.alunos === 1 ? "" : "es"}</Etiqueta>
          <Etiqueta>{profAberto.turmas} turma{profAberto.turmas === 1 ? "" : "s"}</Etiqueta>
          <Etiqueta cor={profAberto.abertos > 0 ? C.saibro : C.grafite}>{profAberto.abertos} aula{profAberto.abertos === 1 ? "" : "s"} em aberto</Etiqueta>
          <Etiqueta cor={C.quadra}>{profAberto.dadas7} dada{profAberto.dadas7 === 1 ? "" : "s"} · 7 dias</Etiqueta>
        </div>
        {meus.length === 0 ? (
          <p style={{ ...prosa, color: C.grafite, marginBottom: 16 }}>Nenhum jogador atribuído a este professor ainda.</p>
        ) : (
          meus.map((a) => {
            const emVigor = a.plano ? aulaEmVigor(a) : null;
            const regEmVigor = emVigor ? (a.regPlano || {})[emVigor.id] || {} : null;
            const repetindo = regEmVigor && (regEmVigor.status === "falta" || regEmVigor.status === "cancelada");
            return (
              <button key={a.id} onClick={() => irPara(a.id)} className="w-full text-left flex items-center justify-between gap-3"
                style={{ background: C.cal, border: "1px solid " + C.linha, borderRadius: 2, padding: "13px 15px", marginBottom: 8 }}>
                <div>
                  <div style={{ fontFamily: ARCH, fontSize: 15, fontWeight: 700 }}>{a.nome || "Sem nome"}</div>
                  <div className="mt-1"><Etiqueta>{a.nivel} · Estágio {a.estagio} · {a.inicio ? `início ${a.inicio}` : "sem calendário"}</Etiqueta></div>
                  {emVigor && (
                    <p style={{ ...prosa, fontSize: 12.5, color: C.saibro, marginTop: 4 }}>
                      {repetindo ? "Repetindo: " : "Em vigor: "}{emVigor.t}
                    </p>
                  )}
                </div>
                <span style={{ color: C.grafite, fontSize: 20 }}>→</span>
              </button>
            );
          })
        )}
      </div>
    );
  }

  return (
    <div>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 4 }}>
        Um retrato de cada professor da academia. Toque no nome pra ver os jogadores dele. Pra ver a grade de horário completa, use a Agenda com "Toda a academia".
      </p>
      {semDono > 0 && (
        <p style={{ ...prosa, fontSize: 12.5, color: C.saibro, marginBottom: 14 }}>
          {semDono} jogador{semDono === 1 ? "" : "es"} ainda sem professor definido.
        </p>
      )}
      {erro && <div className="mb-4"><Aviso>{erro}</Aviso></div>}
      {linhas.length === 0 ? (
        <p style={{ ...prosa, color: C.grafite, marginTop: 10 }}>Nenhum professor aprovado na academia ainda.</p>
      ) : (
        linhas.map((l) => (
          <div key={l.uid} style={{ background: C.cal, border: "1px solid " + C.linha, padding: "13px 15px", marginBottom: 9 }}>
            <div className="flex items-center justify-between gap-3 flex-wrap mb-7" style={{ marginBottom: 7 }}>
              <button onClick={() => setSelecionado(l.uid)}
                style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700, cursor: "pointer", border: "none", background: "none", padding: 0, color: C.tinta, textDecoration: "underline" }}>
                {l.nome}
              </button>
              {l.uid !== uidAtual && (
                <div className="flex items-center gap-3">
                  {l.role !== "coordenador" && (
                    <button onClick={() => promoverProfessor(l)} disabled={promovendo === l.uid}
                      style={{ fontFamily: ARCH, fontSize: 11, fontWeight: 700, color: C.quadra, cursor: "pointer", border: "none", background: "none", padding: 0 }}>
                      {promovendo === l.uid ? "promovendo…" : "Promover a coordenador"}
                    </button>
                  )}
                  <button onClick={() => removerProfessor(l)} disabled={removendo === l.uid}
                    style={{ fontFamily: ARCH, fontSize: 11, fontWeight: 700, color: C.saibro, cursor: "pointer", border: "none", background: "none", padding: 0 }}>
                    {removendo === l.uid ? "removendo…" : "Excluir professor"}
                  </button>
                </div>
              )}
            </div>
            <div className="flex flex-wrap gap-2">
              {l.role === "coordenador" && <Etiqueta cor={C.quadra}>Coordenador</Etiqueta>}
              <Etiqueta>{l.alunos} jogador{l.alunos === 1 ? "" : "es"}</Etiqueta>
              <Etiqueta>{l.turmas} turma{l.turmas === 1 ? "" : "s"}</Etiqueta>
              <Etiqueta cor={l.abertos > 0 ? C.saibro : C.grafite}>{l.abertos} aula{l.abertos === 1 ? "" : "s"} em aberto</Etiqueta>
              <Etiqueta cor={C.quadra}>{l.dadas7} dada{l.dadas7 === 1 ? "" : "s"} · 7 dias</Etiqueta>
              {l.pendencias > 0 && <Etiqueta cor={C.saibro}>{l.pendencias} pendência{l.pendencias === 1 ? "" : "s"} de grupo</Etiqueta>}
            </div>
          </div>
        ))
      )}
    </div>
  );
}

/* ── equipe da academia (só coordenador) ──
   Pedidos de acesso ficam pendentes até alguém com role "coordenador"
   aprovar — a function aprovar-treinador confere isso pelo próprio
   token de quem chama, não por um segredo separado. */
function TelaEquipe({ alunos, turmas, membros, setMembros, carregandoForm, uidAtual, irPara, irParaManual }) {
  const [subaba, setSubaba] = useState("visao");
  const [pendentes, setPendentes] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [ocupado, setOcupado] = useState(null);
  const [erro, setErro] = useState("");
  const [linkConvite, setLinkConvite] = useState("");
  const [linkCopiado, setLinkCopiado] = useState(false);
  const [emailCorrigir, setEmailCorrigir] = useState("");
  const [nomeCorrigir, setNomeCorrigir] = useState("");
  const [corrigindo, setCorrigindo] = useState(false);
  const [msgCorrigir, setMsgCorrigir] = useState(null);

  useEffect(() => {
    (async () => {
      const org = await organizacao();
      if (org) setLinkConvite(location.origin + "/solicitar-acesso.html?org=" + encodeURIComponent(org));
    })();
  }, []);

  async function copiarLinkConvite() {
    try {
      await navigator.clipboard.writeText(linkConvite);
    } catch {
      const campo = document.getElementById("mty-link-convite");
      if (campo) { campo.select(); document.execCommand("copy"); }
    }
    setLinkCopiado(true);
    setTimeout(() => setLinkCopiado(false), 2000);
  }

  async function carregar() {
    setCarregando(true);
    try {
      const org = await organizacao();
      const snap = await db.collection("orgs").doc(org).collection("solicitacoes")
        .where("status", "==", "pendente").get();
      const lista = [];
      snap.forEach((d) => lista.push({ uid: d.id, ...d.data() }));
      setPendentes(lista);
    } catch (e) {
      setErro(String(e.message || e));
    }
    setCarregando(false);
  }
  useEffect(() => { carregar(); }, []);

  async function aprovar(uid) {
    setOcupado(uid); setErro("");
    try {
      const token = await window.mtyAuth.tokenId();
      const r = await fetch("/.netlify/functions/aprovar-treinador", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: "Bearer " + token },
        body: JSON.stringify({ uid }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.erro || ("Erro " + r.status));
      await carregar();
    } catch (e) {
      setErro(String(e.message || e));
    }
    setOcupado(null);
  }

  async function recusar(uid) {
    setOcupado(uid); setErro("");
    try {
      const org = await organizacao();
      await db.collection("orgs").doc(org).collection("solicitacoes").doc(uid)
        .set({ status: "recusada" }, { merge: true });
      await carregar();
    } catch (e) {
      setErro(String(e.message || e));
    }
    setOcupado(null);
  }

  /* Quando o treinador digitou a academia errada em solicitar-acesso.html
     (antes de existir o link de convite, ou mesmo com ele, por engano), a
     conta dele já existe mas o pedido ficou pendurado numa organização que
     ninguém enxerga daqui — e ele não consegue tentar de novo (e-mail já
     cadastrado). O coordenador resolve direto pelo e-mail, sem precisar
     achar o pedido perdido. */
  async function corrigirCadastro() {
    const email = emailCorrigir.trim();
    const nome = nomeCorrigir.trim();
    if (!email) return;
    setCorrigindo(true); setMsgCorrigir(null);
    try {
      const token = await window.mtyAuth.tokenId();
      const r = await fetch("/.netlify/functions/corrigir-cadastro", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: "Bearer " + token },
        body: JSON.stringify({ email, nome }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.erro || ("Erro " + r.status));
      setMsgCorrigir({ ok: true, texto: "Pronto — " + (nome || email) + " já está vinculado a esta academia. Ele já pode entrar de novo com a mesma senha." });
      setEmailCorrigir(""); setNomeCorrigir("");
      await carregar();
    } catch (e) {
      setMsgCorrigir({ ok: false, texto: String(e.message || e) });
    }
    setCorrigindo(false);
  }

  return (
    <div>
      <h1 style={{ fontFamily: ARCH, fontSize: 22, fontWeight: 700, marginBottom: 4 }}>Equipe</h1>
      <div className="flex gap-5 mb-6" style={{ borderBottom: "1px solid " + C.linha }}>
        {[{ v: "visao", r: "Visão geral" }, { v: "pedidos", r: "Pedidos" }, { v: "formacao", r: "Formação" }].map((t) => (
          <button key={t.v} onClick={() => setSubaba(t.v)}
            style={{ fontFamily: ARCH, fontSize: 13, fontWeight: subaba === t.v ? 700 : 500, padding: "8px 0", cursor: "pointer",
              color: subaba === t.v ? C.tinta : C.grafite, borderBottom: "2px solid " + (subaba === t.v ? C.saibro : "transparent"), marginBottom: -1 }}>
            {t.r}
          </button>
        ))}
      </div>

      {subaba === "visao" ? (
        <VisaoGeralEquipe alunos={alunos} turmas={turmas} uidAtual={uidAtual} irPara={irPara} />
      ) : subaba === "pedidos" ? (
        <div>
          <p style={{ ...prosa, color: C.grafite, marginBottom: 10 }}>
            Pedidos de acesso de treinadores novos para esta academia.
          </p>

          {linkConvite && (
            <div className="mb-5">
              <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginBottom: 6 }}>
                Envie este link ao treinador novo — a academia já vem preenchida, então não tem como ele digitar errado e o pedido "sumir".
              </p>
              <div className="flex gap-2 items-center flex-wrap">
                <input id="mty-link-convite" readOnly value={linkConvite} style={{ ...entrada, fontSize: 12, flex: 1 }}
                  onFocus={(e) => e.target.select()} />
                <Botao pequeno variante="vazio" onClick={copiarLinkConvite}>{linkCopiado ? "✓ copiado" : "Copiar"}</Botao>
              </div>
            </div>
          )}

          {erro && <div className="mb-4"><Aviso>{erro}</Aviso></div>}

          {carregando ? (
            <p style={{ ...prosa, color: C.grafite }}>Carregando…</p>
          ) : pendentes.length === 0 ? (
            <p style={{ ...prosa, color: C.grafite }}>Nenhum pedido pendente no momento.</p>
          ) : (
            pendentes.map((p) => (
              <div key={p.uid} style={{ background: C.cal, border: "1px solid " + C.linha, padding: "13px 15px", marginBottom: 9 }}>
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <div>
                    <div style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700 }}>{p.nome || "Sem nome"}</div>
                    <div style={{ ...prosa, fontSize: 12.5, color: C.grafite }}>{p.email}</div>
                  </div>
                  <div className="flex gap-2">
                    <Botao pequeno onClick={() => aprovar(p.uid)} disabled={ocupado === p.uid}>
                      {ocupado === p.uid ? "…" : "Aprovar"}
                    </Botao>
                    <Botao pequeno variante="vazio" onClick={() => recusar(p.uid)} disabled={ocupado === p.uid}>
                      Recusar
                    </Botao>
                  </div>
                </div>
              </div>
            ))
          )}

          <div style={{ background: C.cal, border: "1px solid " + C.linha, padding: "13px 15px", marginTop: 22 }}>
            <p style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700, marginBottom: 4 }}>Um treinador criou a conta mas o pedido não aparece aqui?</p>
            <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginBottom: 10 }}>
              Provavelmente ele digitou a academia errada. Como o e-mail já ficou cadastrado, ele não consegue tentar
              de novo sozinho — coloque o e-mail (e o nome, se souber) que eu vinculo direto a esta academia.
            </p>
            <div className="flex gap-2 items-center flex-wrap">
              <input type="email" style={{ ...entrada, fontSize: 13, flex: 1, minWidth: 160 }} value={emailCorrigir}
                onChange={(e) => setEmailCorrigir(e.target.value)} placeholder="e-mail do treinador" />
              <input style={{ ...entrada, fontSize: 13, flex: 1, minWidth: 140 }} value={nomeCorrigir}
                onChange={(e) => setNomeCorrigir(e.target.value)} placeholder="nome dele (opcional)" />
              <Botao pequeno onClick={corrigirCadastro} disabled={corrigindo || !emailCorrigir.trim()}>
                {corrigindo ? "…" : "Vincular a esta academia"}
              </Botao>
            </div>
            {msgCorrigir && (
              <div className="mt-3">
                {msgCorrigir.ok
                  ? <p style={{ ...prosa, fontSize: 12.5, color: C.quadra, fontWeight: 600 }}>✓ {msgCorrigir.texto}</p>
                  : <Aviso>{msgCorrigir.texto}</Aviso>}
              </div>
            )}
          </div>
        </div>
      ) : (
        <SecaoFormacao membros={membros} setMembros={setMembros} carregando={carregandoForm} irParaManual={irParaManual} />
      )}
    </div>
  );
}

/* uid: quando vem de um treinador de verdade (a formação virou
   autodidata — ver TelaFormacaoPessoal), amarra o registro à conta dele,
   pra ele sempre reencontrar o próprio progresso ao entrar. Registro
   antigo, cadastrado à mão pelo coordenador antes disso existir, continua
   com uid null — segue funcionando, só não abre sozinho pra ninguém. */
function novoMembroFormacao(nome, uid) {
  return {
    id: uid || "mem-" + Date.now().toString(36),
    uid: uid || null,
    nome: (nome || "").trim(),
    progresso: Object.fromEntries(CURSOS_FORMACAO.map((c) => [c.id, c.modulos.map(() => ({ concluido: false, resposta: "", confianca: null, comentario: "" }))])),
    quiz: Object.fromEntries(CURSOS_FORMACAO.filter((c) => (c.quiz || []).length).map((c) => [c.id, { respostas: c.quiz.map(() => null), acertos: null }])),
  };
}

/* Lê o progresso de um módulo tolerando o formato antigo (um boolean
   solto, de antes da formação virar autodidata) — sem isso, todo
   registro criado antes desta mudança quebraria ao abrir. */
function progressoModulo(membro, cursoId, idx) {
  const raw = ((membro.progresso || {})[cursoId] || [])[idx];
  if (raw && typeof raw === "object") return { concluido: false, resposta: "", confianca: null, comentario: "", ...raw };
  return { concluido: !!raw, resposta: "", confianca: null, comentario: "" };
}

/* Sequencial, como uma trilha de aulas: só dá pra escrever a resposta do
   módulo N se todos os módulos anteriores DESTE MESMO curso já estiverem
   concluídos. Cursos diferentes não travam entre si — cada um cobre um
   tema próprio (ficha, manual, formação interna...), sem ordem lógica
   única entre eles. O quiz do curso também fica travado até o último
   módulo ser concluído — ele fecha o curso, não abre ele. */
function moduloBloqueado(membro, cursoId, idx) {
  for (let i = 0; i < idx; i++) {
    if (!progressoModulo(membro, cursoId, i).concluido) return true;
  }
  return false;
}
function quizBloqueado(membro, curso) {
  return curso.modulos.some((_, i) => !progressoModulo(membro, curso.id, i).concluido);
}

function contagemFormacao(membro) {
  const feitos = CURSOS_FORMACAO.reduce((n, c) =>
    n + c.modulos.filter((_, i) => progressoModulo(membro, c.id, i).concluido).length, 0);
  const total = CURSOS_FORMACAO.reduce((n, c) => n + c.modulos.length, 0);
  return feitos + "/" + total;
}

/* Módulo com "saída" pra responder por escrito (o texto é a avaliação
   de verdade — nunca uma suposição do treinador sobre si mesmo sem
   registro) + confiança de 1 a 5. Em modoCoordenador, os três campos do
   treinador ficam travados e só o comentário de supervisão é editável —
   Richard revisa, não preenche por ele. */
function AutoAvaliacaoModulo({ mod, indice, progresso, aoMudar, modoCoordenador, bloqueado, irParaManual }) {
  const podeConcluir = progresso.resposta.trim().length > 0;
  if (bloqueado && !modoCoordenador) {
    return (
      <div style={{ background: C.papel, border: "1px solid " + C.linha, padding: "12px 14px", marginBottom: 9, opacity: 0.6 }}>
        <div className="flex items-start gap-3">
          <span style={{ fontFamily: ARCH, fontSize: 16, lineHeight: 1.2, color: C.grafite }}>🔒</span>
          <div className="flex-1">
            <div style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700, color: C.grafite }}>Módulo {indice + 1} · {mod.t}</div>
            <p style={{ ...prosa, fontSize: 12, color: C.grafite, marginTop: 3 }}>Conclua o módulo anterior pra desbloquear este.</p>
          </div>
        </div>
      </div>
    );
  }
  return (
    <div style={{ background: progresso.concluido ? "#F4F7F4" : C.cal, border: "1px solid " + C.linha,
      borderLeft: "3px solid " + (progresso.concluido ? C.quadra : C.linha), padding: "12px 14px", marginBottom: 9 }}>
      <div className="flex items-start gap-3 mb-2">
        {!modoCoordenador && (
          <button onClick={() => podeConcluir && aoMudar({ concluido: !progresso.concluido })} disabled={!podeConcluir}
            style={{ border: "none", background: "none", padding: 0, cursor: podeConcluir ? "pointer" : "default",
              fontFamily: ARCH, fontSize: 16, lineHeight: 1.2, color: progresso.concluido ? C.quadra : (podeConcluir ? C.grafite : C.linha) }}>
            {progresso.concluido ? "☑" : "☐"}
          </button>
        )}
        <div className="flex-1">
          <div style={{ fontFamily: ARCH, fontSize: 13, fontWeight: 700, color: progresso.concluido ? C.quadra : C.tinta }}>
            Módulo {indice + 1} · {mod.t}{modoCoordenador && progresso.concluido ? " · concluído" : ""}{modoCoordenador && bloqueado ? " · ainda bloqueado pro treinador" : ""}
          </div>
          {mod.teoria && (
            <div className="mt-2 mb-2" style={{ background: C.papel, borderLeft: "3px solid " + C.grafite, padding: "9px 11px" }}>
              <Etiqueta cor={C.grafite}>Leia antes de responder</Etiqueta>
              <p style={{ ...prosa, fontSize: 12.5, color: C.tinta, marginTop: 5 }}>{mod.teoria}</p>
              {mod.referenciaManual && irParaManual && (
                <button onClick={() => irParaManual(mod.referenciaManual)}
                  style={{ border: "none", background: "none", padding: 0, marginTop: 6, cursor: "pointer",
                    fontFamily: ARCH, fontSize: 11.5, fontWeight: 700, color: C.saibro, textDecoration: "underline" }}>
                  Ver mais no Manual → {mod.referenciaManual.rotulo}
                </button>
              )}
            </div>
          )}
          <p style={{ ...prosa, fontSize: 12, color: C.grafite, marginTop: 3 }}>Demonstre: {mod.saida}</p>
        </div>
      </div>
      {modoCoordenador ? (
        <div className="mt-2" style={{ paddingLeft: 4 }}>
          <p style={{ ...prosa, fontSize: 12.5, whiteSpace: "pre-wrap", background: C.papel, padding: "8px 10px", borderRadius: 2 }}>
            {progresso.resposta.trim() || "[o treinador ainda não escreveu a resposta deste módulo]"}
          </p>
          {progresso.confianca && <p style={{ ...prosa, fontSize: 11.5, color: C.grafite, marginTop: 4 }}>Confiança que ele próprio deu: {progresso.confianca}/5</p>}
          <div className="mt-2">
            <Campo rotulo="Comentário de supervisão">
              <textarea rows={2} style={{ ...entrada, resize: "vertical", fontSize: 12.5 }}
                value={progresso.comentario} onChange={(e) => aoMudar({ comentario: e.target.value })}
                placeholder="devolutiva pra este módulo — o que faltou, o que foi bem" />
            </Campo>
          </div>
        </div>
      ) : (
        <div className="mt-2" style={{ paddingLeft: 4 }}>
          <textarea rows={3} style={{ ...entrada, resize: "vertical", fontSize: 12.5 }}
            value={progresso.resposta} onChange={(e) => aoMudar({ resposta: e.target.value, ...(e.target.value.trim() ? {} : { concluido: false }) })}
            placeholder="escreva o caso real que demonstra este módulo" />
          <div className="flex items-center gap-2 mt-2 flex-wrap">
            <span style={{ ...prosa, fontSize: 11.5, color: C.grafite }}>Quão confiante você está nisso?</span>
            <Seletor opcoes={[1, 2, 3, 4, 5].map((n) => ({ v: n, r: String(n) }))} valor={progresso.confianca || 0}
              aoMudar={(v) => aoMudar({ confianca: v })} />
          </div>
          {!podeConcluir && <p style={{ ...prosa, fontSize: 11, color: C.grafite, marginTop: 4 }}>Escreva a resposta pra poder marcar como concluído.</p>}
          {progresso.comentario && (
            <div className="mt-2" style={{ background: C.papel, borderLeft: "3px solid " + C.saibro, padding: "8px 10px" }}>
              <Etiqueta cor={C.saibro}>Comentário do coordenador</Etiqueta>
              <p style={{ ...prosa, fontSize: 12, marginTop: 3 }}>{progresso.comentario}</p>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* Quiz objetivo, autocorrigido — confirma que o conteúdo foi lido antes
   de partir pra "saída" de cada módulo, que é a avaliação de verdade. */
function QuizCurso({ curso, quizState, aoResponder, modoCoordenador, bloqueado }) {
  const perguntas = curso.quiz || [];
  if (!perguntas.length) return null;
  const [rascunho, setRascunho] = useState(quizState.respostas);
  const jaRespondeu = quizState.acertos !== null;

  function escolher(i, v) {
    setRascunho((r) => r.map((x, k) => (k === i ? v : x)));
  }
  function conferir() {
    const acertos = rascunho.reduce((n, r, i) => n + (r === perguntas[i].certa ? 1 : 0), 0);
    aoResponder({ respostas: rascunho, acertos });
  }

  if (bloqueado && !modoCoordenador) {
    return (
      <div className="mt-4" style={{ background: C.papel, border: "1px solid " + C.linha, padding: "12px 14px", opacity: 0.6 }}>
        <div className="flex items-center gap-3">
          <span style={{ fontFamily: ARCH, fontSize: 16, lineHeight: 1.2, color: C.grafite }}>🔒</span>
          <p style={{ ...prosa, fontSize: 12.5, color: C.grafite }}>Conclua todos os módulos deste curso pra desbloquear o quiz.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="mt-4" style={{ background: C.papel, border: "1px solid " + C.linha, padding: "12px 14px" }}>
      <div className="flex items-center justify-between gap-3 mb-2">
        <span style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 700 }}>Quiz do curso</span>
        {(jaRespondeu || modoCoordenador) && (
          <Etiqueta cor={quizState.acertos === perguntas.length ? C.quadra : C.saibro}>
            {quizState.acertos === null ? "ainda não respondeu" : quizState.acertos + " de " + perguntas.length + " certas"}
          </Etiqueta>
        )}
      </div>
      {perguntas.map((q, i) => (
        <div key={i} className="mb-3">
          <p style={{ ...prosa, fontSize: 12.5, fontWeight: 600, marginBottom: 5 }}>{i + 1}. {q.p}</p>
          {q.opcoes.map((op, oi) => {
            const marcada = modoCoordenador ? quizState.respostas[i] === oi : rascunho[i] === oi;
            const mostrarCerto = (jaRespondeu || modoCoordenador) && oi === q.certa;
            const mostrarErrado = (jaRespondeu || modoCoordenador) && marcada && oi !== q.certa;
            return (
              <button key={oi} disabled={modoCoordenador || jaRespondeu} onClick={() => escolher(i, oi)}
                className="w-full text-left flex items-center gap-2" style={{ padding: "6px 9px", marginBottom: 3, border: "none",
                  background: mostrarCerto ? "#F4F7F4" : mostrarErrado ? "#FBF0EE" : "transparent",
                  cursor: modoCoordenador || jaRespondeu ? "default" : "pointer" }}>
                <span style={{ fontFamily: ARCH, fontSize: 13, color: mostrarCerto ? C.quadra : mostrarErrado ? C.saibro : (marcada ? C.tinta : C.grafite) }}>
                  {marcada ? "●" : "○"}
                </span>
                <span style={{ ...prosa, fontSize: 12.5, color: mostrarCerto ? C.quadra : mostrarErrado ? C.saibro : C.tinta }}>{op}</span>
              </button>
            );
          })}
        </div>
      ))}
      {!modoCoordenador && !jaRespondeu && (
        <Botao pequeno onClick={conferir} disabled={rascunho.some((r) => r === null)}>Conferir respostas</Botao>
      )}
      {!modoCoordenador && jaRespondeu && quizState.acertos < perguntas.length && (
        <Botao pequeno variante="vazio" onClick={() => { setRascunho(perguntas.map(() => null)); aoResponder({ respostas: perguntas.map(() => null), acertos: null }); }}>
          Tentar de novo
        </Botao>
      )}
    </div>
  );
}

/* Visão do coordenador: supervisão, não preenchimento. Cada treinador
   preenche o próprio progresso em "Formação" (TelaFormacaoPessoal); aqui
   o coordenador só lê o que foi escrito e deixa comentário — o registro
   manual por nome continua existindo, pra quem ainda não tem conta
   própria no sistema. */
function SecaoFormacao({ membros, setMembros, carregando, irParaManual }) {
  const [nomeNovo, setNomeNovo] = useState("");
  const [abertoId, setAbertoId] = useState(null);

  function adicionar() {
    if (!nomeNovo.trim()) return;
    setMembros([...membros, novoMembroFormacao(nomeNovo)]);
    setNomeNovo("");
  }
  function remover(id) {
    if (!confirm("Remover este treinador da formação? O progresso registrado vai junto.")) return;
    setMembros(membros.filter((m) => m.id !== id));
    if (abertoId === id) setAbertoId(null);
  }
  function mudarModulo(id, cursoId, idx, patch) {
    setMembros(membros.map((m) => {
      if (m.id !== id) return m;
      const curso = CURSOS_FORMACAO.find((c) => c.id === cursoId);
      const atual = curso.modulos.map((_, i) => progressoModulo(m, cursoId, i));
      atual[idx] = { ...atual[idx], ...patch };
      return { ...m, progresso: { ...m.progresso, [cursoId]: atual } };
    }));
  }

  const aberto = abertoId ? membros.find((m) => m.id === abertoId) : null;

  return (
    <div>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 16 }}>
        Supervisão da formação — cada treinador preenche o próprio progresso, com texto e quiz, na
        aba "Formação". Aqui você acompanha e deixa comentário, sem precisar preencher por ele.
      </p>

      <ReferenciaFormacaoStaff />

      <div className="flex gap-2 mb-5">
        <input style={entrada} value={nomeNovo} onChange={(e) => setNomeNovo(e.target.value)}
          placeholder="Nome do treinador (sem conta própria ainda)" onKeyDown={(e) => e.key === "Enter" && adicionar()} />
        <Botao pequeno onClick={adicionar} disabled={!nomeNovo.trim()}>Adicionar</Botao>
      </div>

      {carregando ? (
        <p style={{ ...prosa, color: C.grafite }}>Carregando…</p>
      ) : aberto ? (
        <div>
          <button onClick={() => setAbertoId(null)} className="mb-3" style={{ ...prosa, color: C.grafite, cursor: "pointer" }}>← Todos os treinadores</button>
          <h2 style={{ fontFamily: ARCH, fontSize: 18, fontWeight: 700, marginBottom: 4 }}>{aberto.nome}</h2>
          <div className="mb-5"><Etiqueta>{contagemFormacao(aberto)} módulos concluídos</Etiqueta></div>
          {CURSOS_FORMACAO.map((c) => (
            <div key={c.id} className="mb-6">
              <h3 style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700, marginBottom: 9 }}>{c.nome}</h3>
              {c.modulos.map((mod, i) => (
                <AutoAvaliacaoModulo key={i} mod={mod} indice={i} progresso={progressoModulo(aberto, c.id, i)}
                  aoMudar={(patch) => mudarModulo(aberto.id, c.id, i, patch)} modoCoordenador bloqueado={moduloBloqueado(aberto, c.id, i)}
                  irParaManual={irParaManual} />
              ))}
              {(c.quiz || []).length > 0 && (
                <QuizCurso curso={c} quizState={aberto.quiz && aberto.quiz[c.id] ? aberto.quiz[c.id] : { respostas: c.quiz.map(() => null), acertos: null }}
                  aoResponder={() => {}} modoCoordenador bloqueado={quizBloqueado(aberto, c)} />
              )}
            </div>
          ))}
          <Botao variante="vazio" onClick={() => remover(aberto.id)}>Remover treinador</Botao>
        </div>
      ) : membros.length === 0 ? (
        <p style={{ ...prosa, color: C.grafite }}>Nenhum treinador na formação ainda — cada um aparece aqui assim que abrir a própria aba "Formação".</p>
      ) : (
        membros.map((m) => (
          <button key={m.id} onClick={() => setAbertoId(m.id)} className="w-full text-left flex items-center justify-between gap-3"
            style={{ background: C.cal, border: "1px solid " + C.linha, padding: "13px 15px", marginBottom: 9 }}>
            <div style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700 }}>{m.nome}</div>
            <Etiqueta>{contagemFormacao(m)}</Etiqueta>
          </button>
        ))
      )}
    </div>
  );
}

/* Formação autodidata do próprio treinador — encontra (ou cria, no
   primeiro acesso) o registro amarrado à própria conta, e deixa ele
   preencher texto, quiz e confiança no próprio ritmo. O coordenador
   nunca preenche isto por ele — só acompanha e comenta em Equipe →
   Formação (ver SecaoFormacao). */
function TelaFormacaoPessoal({ membros, setMembros, carregando, uidAtual, irParaManual }) {
  const [meuNome, setMeuNome] = useState("");
  const [carregandoNome, setCarregandoNome] = useState(true);

  useEffect(() => {
    listaProfessores().then((lista) => {
      const eu = lista.find((p) => p.uid === uidAtual);
      setMeuNome(eu ? eu.nome : "Eu");
      setCarregandoNome(false);
    }).catch(() => setCarregandoNome(false));
  }, [uidAtual]);

  const meuRegistro = membros.find((m) => m.uid === uidAtual);
  useEffect(() => {
    if (carregando || carregandoNome || meuRegistro) return;
    setMembros((atual) => atual.some((m) => m.uid === uidAtual) ? atual : [...atual, novoMembroFormacao(meuNome, uidAtual)]);
  }, [carregando, carregandoNome, meuRegistro, uidAtual, meuNome]);

  function mudarModulo(cursoId, idx, patch) {
    setMembros(membros.map((m) => {
      if (m.uid !== uidAtual) return m;
      const curso = CURSOS_FORMACAO.find((c) => c.id === cursoId);
      const atual = curso.modulos.map((_, i) => progressoModulo(m, cursoId, i));
      atual[idx] = { ...atual[idx], ...patch };
      return { ...m, progresso: { ...m.progresso, [cursoId]: atual } };
    }));
  }
  function responderQuiz(cursoId, resultado) {
    setMembros(membros.map((m) => (m.uid === uidAtual ? { ...m, quiz: { ...m.quiz, [cursoId]: resultado } } : m)));
  }

  if (carregando || carregandoNome || !meuRegistro) {
    return <p style={{ ...prosa, color: C.grafite }}>Carregando…</p>;
  }

  return (
    <div>
      <h1 style={{ fontFamily: ARCH, fontSize: 22, fontWeight: 700, marginBottom: 4 }}>Formação</h1>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 6 }}>
        Estudo no seu ritmo — leia a saída de cada módulo, responda com um caso real seu, faça o
        quiz, e marque como concluído quando estiver pronto. O coordenador acompanha e comenta,
        mas quem preenche é você.
      </p>
      <div className="mb-5"><Etiqueta cor={C.quadra}>{contagemFormacao(meuRegistro)} módulos concluídos</Etiqueta></div>

      <ReferenciaFormacaoStaff />

      {CURSOS_FORMACAO.map((c) => (
        <div key={c.id} className="mb-7">
          <h3 style={{ fontFamily: ARCH, fontSize: 15, fontWeight: 700, marginBottom: 9 }}>{c.nome}</h3>
          {c.modulos.map((mod, i) => (
            <AutoAvaliacaoModulo key={i} mod={mod} indice={i} progresso={progressoModulo(meuRegistro, c.id, i)}
              aoMudar={(patch) => mudarModulo(c.id, i, patch)} bloqueado={moduloBloqueado(meuRegistro, c.id, i)}
              irParaManual={irParaManual} />
          ))}
          {(c.quiz || []).length > 0 && (
            <QuizCurso curso={c} quizState={meuRegistro.quiz && meuRegistro.quiz[c.id] ? meuRegistro.quiz[c.id] : { respostas: c.quiz.map(() => null), acertos: null }}
              aoResponder={(resultado) => responderQuiz(c.id, resultado)} bloqueado={quizBloqueado(meuRegistro, c)} />
          )}
        </div>
      ))}
    </div>
  );
}

/* ── quadras e reservas ──
   Agenda de aluguel avulso de quadra/espaço, separada das turmas e do
   plano de cada jogador — pensada pra também virar o destino de uma
   reserva feita por WhatsApp no futuro (mesma coleção, só quem grava
   muda). Qualquer pessoa pode reservar, mesmo sem ser aluno cadastrado
   — por isso o contato é nome+telefone livre, não um vínculo com ficha.
   Sem cobrança e sem recorrência nesta primeira versão. */
function novaQuadra() {
  return { id: "quadra-" + Date.now(), nome: "", ativa: true };
}
function novaReserva() {
  return {
    id: "reserva-" + Date.now(), quadraId: "", data: "", horaInicio: "", horaFim: "",
    nomeContato: "", telefoneContato: "", observacao: "", origem: "staff", vistoPeloStaff: true,
    criadoEm: new Date().toISOString(),
  };
}
function reservasSeSobrepoem(a, b) {
  return a.data === b.data && a.quadraId === b.quadraId && a.horaInicio < b.horaFim && a.horaFim > b.horaInicio;
}
function formatarDataLonga(data) {
  if (!data) return "";
  const d = new Date(data + "T00:00:00");
  if (isNaN(d.getTime())) return data;
  const texto = d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}
/* Grade de meia em meia hora, 06:00 às 23:00 — a mesma faixa que o link
   público (reservar.html) usa, pra a visão do treinador bater exatamente
   com o que o cliente vê. */
const FAIXAS_MEIA_HORA = (() => {
  const lista = [];
  for (let h = 6; h < 23; h++) {
    lista.push(String(h).padStart(2, "0") + ":00");
    lista.push(String(h).padStart(2, "0") + ":30");
  }
  lista.push("23:00");
  return lista;
})();

function TelaQuadras({ quadras, setQuadras, reservas, setReservas, orgAtual }) {
  const [gerenciando, setGerenciando] = useState(false);
  const [nomeNovaQuadra, setNomeNovaQuadra] = useState("");
  const [dataEscolhida, setDataEscolhida] = useState(() => new Date().toISOString().slice(0, 10));
  const [rascunho, setRascunho] = useState(null); // null = nenhum form de reserva aberto
  const [erro, setErro] = useState("");
  const [linkCopiado, setLinkCopiado] = useState(false);

  const quadrasAtivas = quadras.filter((q) => q.ativa !== false);
  const linkReserva = orgAtual ? location.origin + "/reservar.html?org=" + encodeURIComponent(orgAtual) : "";

  async function copiarLink() {
    try { await navigator.clipboard.writeText(linkReserva); }
    catch { const c = document.getElementById("mty-link-reserva"); if (c) { c.select(); document.execCommand("copy"); } }
    setLinkCopiado(true);
    setTimeout(() => setLinkCopiado(false), 2000);
  }

  function adicionarQuadra() {
    if (!nomeNovaQuadra.trim()) return;
    setQuadras([...quadras, { ...novaQuadra(), nome: nomeNovaQuadra.trim() }]);
    setNomeNovaQuadra("");
  }
  function removerQuadra(id) {
    if (!confirm("Remover esta quadra? As reservas já feitas nela continuam guardadas, mas ela some da lista.")) return;
    setQuadras(quadras.map((q) => (q.id === id ? { ...q, ativa: false } : q)));
  }

  function reservaEm(quadraId, hora) {
    return reservas.find((r) => r.quadraId === quadraId && r.data === dataEscolhida && r.horaInicio <= hora && r.horaFim > hora);
  }
  function abrirFormNaFaixa(quadraId, hora) {
    setErro("");
    const fim = FAIXAS_MEIA_HORA[FAIXAS_MEIA_HORA.indexOf(hora) + 1] || hora;
    setRascunho({ ...novaReserva(), quadraId, data: dataEscolhida, horaInicio: hora, horaFim: fim });
  }
  function confirmarReserva() {
    const r = rascunho;
    if (!r.data || !r.horaInicio || !r.horaFim || !r.nomeContato.trim() || !r.telefoneContato.trim()) {
      setErro("Preencha data, horário de início e fim, nome e telefone de contato.");
      return;
    }
    if (r.horaFim <= r.horaInicio) {
      setErro("O horário de fim precisa ser depois do horário de início.");
      return;
    }
    if (reservas.some((existente) => reservasSeSobrepoem(existente, r))) {
      setErro("Já existe uma reserva nesta quadra que se sobrepõe a este horário.");
      return;
    }
    setReservas([...reservas, { ...r, nomeContato: r.nomeContato.trim(), telefoneContato: r.telefoneContato.trim() }]);
    setRascunho(null);
    setErro("");
  }
  function removerReserva(id) {
    if (!confirm("Cancelar esta reserva?")) return;
    setReservas(reservas.filter((r) => r.id !== id));
  }

  const quadraDoRascunho = rascunho ? quadrasAtivas.find((q) => q.id === rascunho.quadraId) : null;

  return (
    <div>
      <h1 style={{ fontFamily: ARCH, fontSize: 22, fontWeight: 700, marginBottom: 4 }}>Quadras</h1>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 18 }}>
        Agenda de reserva avulsa de quadra ou espaço, de meia em meia hora — separada das turmas e
        do plano de cada jogador. Qualquer pessoa pode reservar, mesmo sem ser aluno cadastrado.
      </p>

      {linkReserva && (
        <div className="mb-6" style={{ background: C.cal, border: "1px solid " + C.linha, padding: "12px 15px" }}>
          <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginBottom: 6 }}>
            Link público de reserva — envie pro cliente. Ele escolhe o dia, vê quais quadras estão
            livres ou ocupadas, e reserva sozinho, sem precisar de conta. Você recebe um aviso aqui
            assim que ele reservar.
          </p>
          <div className="flex gap-2 items-center flex-wrap">
            <input id="mty-link-reserva" readOnly value={linkReserva} style={{ ...entrada, fontSize: 12, flex: 1 }}
              onFocus={(e) => e.target.select()} />
            <Botao pequeno variante="vazio" onClick={copiarLink}>{linkCopiado ? "✓ copiado" : "Copiar"}</Botao>
          </div>
        </div>
      )}

      <div className="mb-6" style={{ background: C.cal, border: "1px solid " + C.linha, padding: "12px 15px" }}>
        <button onClick={() => setGerenciando(!gerenciando)} className="w-full flex items-center justify-between gap-3" style={{ cursor: "pointer" }}>
          <span style={{ fontFamily: ARCH, fontSize: 13.5, fontWeight: 700 }}>Gerenciar quadras ({quadrasAtivas.length})</span>
          <Etiqueta>{gerenciando ? "fechar" : "abrir"}</Etiqueta>
        </button>
        {gerenciando && (
          <div className="mt-3">
            {quadrasAtivas.length === 0 && (
              <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginBottom: 10 }}>Nenhuma quadra cadastrada ainda.</p>
            )}
            {quadrasAtivas.map((q) => (
              <div key={q.id} className="flex items-center justify-between gap-3 mb-2" style={{ background: C.papel, border: "1px solid " + C.linha, padding: "8px 11px" }}>
                <span style={{ ...prosa, fontSize: 13 }}>{q.nome}</span>
                <button onClick={() => removerQuadra(q.id)} title="Remover quadra" style={iconeEstilo}>×</button>
              </div>
            ))}
            <div className="flex gap-2 mt-3 flex-wrap items-center">
              <input style={{ ...entrada, flex: 1, minWidth: 180 }} value={nomeNovaQuadra} onChange={(e) => setNomeNovaQuadra(e.target.value)}
                placeholder="ex: Quadra 1 · saibro" onKeyDown={(e) => e.key === "Enter" && adicionarQuadra()} />
              <Botao pequeno onClick={adicionarQuadra} disabled={!nomeNovaQuadra.trim()}>Adicionar quadra</Botao>
            </div>
          </div>
        )}
      </div>

      <Campo rotulo="Ver agenda do dia">
        <input type="date" style={{ ...entrada, maxWidth: 220 }} value={dataEscolhida}
          onChange={(e) => { setDataEscolhida(e.target.value); setRascunho(null); }} />
      </Campo>
      <div className="mb-5"><Etiqueta>{formatarDataLonga(dataEscolhida)}</Etiqueta></div>

      {quadrasAtivas.length === 0 ? (
        <p style={{ ...prosa, color: C.grafite }}>Cadastre uma quadra acima pra começar a receber reservas.</p>
      ) : (
        <div style={{ overflowX: "auto" }}>
          <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 90 + quadrasAtivas.length * 150 }}>
            <thead>
              <tr>
                <th style={{ ...celulaGrade, background: C.papel }}></th>
                {quadrasAtivas.map((q) => (
                  <th key={q.id} style={{ ...celulaGrade, fontFamily: ARCH, fontSize: 12, fontWeight: 700, textAlign: "left" }}>{q.nome}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {FAIXAS_MEIA_HORA.slice(0, -1).map((hora) => (
                <tr key={hora}>
                  <td style={{ ...celulaGrade, fontFamily: ARCH, fontSize: 12, fontWeight: 700, color: C.grafite, whiteSpace: "nowrap" }}>{hora}</td>
                  {quadrasAtivas.map((q) => {
                    const r = reservaEm(q.id, hora);
                    if (r) {
                      const primeiraFaixa = r.horaInicio === hora;
                      return (
                        <td key={q.id} style={{ ...celulaGrade, minWidth: 140, background: primeiraFaixa ? C.cal : "#EFEAE4" }}>
                          {primeiraFaixa && (
                            <div className="flex items-center justify-between gap-2">
                              <div>
                                <div style={{ fontFamily: ARCH, fontSize: 11.5, fontWeight: 700 }}>{r.nomeContato}</div>
                                <div style={{ ...prosa, fontSize: 10.5, color: C.grafite }}>
                                  {r.horaInicio}–{r.horaFim}{r.origem === "cliente" ? " · reservado pelo cliente" : ""}
                                </div>
                              </div>
                              <button onClick={() => removerReserva(r.id)} title="Cancelar reserva"
                                style={{ ...iconeEstilo, width: 20, height: 20, fontSize: 12, flexShrink: 0 }}>×</button>
                            </div>
                          )}
                        </td>
                      );
                    }
                    return (
                      <td key={q.id} style={{ ...celulaGrade, minWidth: 140, padding: 0 }}>
                        <button onClick={() => abrirFormNaFaixa(q.id, hora)}
                          style={{ width: "100%", height: "100%", minHeight: 32, border: "none", background: "transparent",
                            cursor: "pointer", fontFamily: ARCH, fontSize: 11, color: C.linha }}>
                          livre
                        </button>
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {rascunho && (
        <div className="mt-5" style={{ background: C.papel, border: "1px solid " + C.linha, padding: "14px 16px" }}>
          <div style={{ fontFamily: ARCH, fontWeight: 700, fontSize: 13, marginBottom: 8 }}>
            Nova reserva{quadraDoRascunho ? " · " + quadraDoRascunho.nome : ""}
          </div>
          <div className="flex gap-2 flex-wrap">
            <Campo rotulo="Data"><input type="date" style={entrada} value={rascunho.data}
              onChange={(e) => setRascunho({ ...rascunho, data: e.target.value })} /></Campo>
            <Campo rotulo="Início"><input type="time" style={entrada} value={rascunho.horaInicio}
              onChange={(e) => setRascunho({ ...rascunho, horaInicio: e.target.value })} /></Campo>
            <Campo rotulo="Fim"><input type="time" style={entrada} value={rascunho.horaFim}
              onChange={(e) => setRascunho({ ...rascunho, horaFim: e.target.value })} /></Campo>
          </div>
          <Campo rotulo="Nome de quem reserva">
            <input style={entrada} value={rascunho.nomeContato} onChange={(e) => setRascunho({ ...rascunho, nomeContato: e.target.value })} />
          </Campo>
          <Campo rotulo="Telefone (com WhatsApp, se possível)">
            <input style={entrada} value={rascunho.telefoneContato} onChange={(e) => setRascunho({ ...rascunho, telefoneContato: e.target.value })}
              placeholder="(11) 90000-0000" />
          </Campo>
          <Campo rotulo="Observação" nota="Opcional">
            <input style={entrada} value={rascunho.observacao} onChange={(e) => setRascunho({ ...rascunho, observacao: e.target.value })} />
          </Campo>
          {erro && <div className="mb-2"><Aviso>{erro}</Aviso></div>}
          <div className="flex gap-2">
            <Botao pequeno onClick={confirmarReserva}>Confirmar reserva</Botao>
            <Botao pequeno variante="vazio" onClick={() => { setRascunho(null); setErro(""); }}>Cancelar</Botao>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── turmas (aulas em dupla/grupo) ──
   Cada jogador continua com o plano dele, individual, gerado do jeito
   de sempre. A turma só agrupa quem treina junto — a sessão une a
   próxima aula pendente de cada um numa tela só, e marca presença de
   todo mundo em uma ação (com espaço pra corrigir por pessoa: chuva
   cancela a turma inteira, mas um jogador específico pode ter faltado
   por outro motivo mesmo com o resto treinando). */
function TelaTurmas({ alunos, setAlunos, turmas, setTurmas, papelAtual, uidAtual }) {
  const [abertaId, setAbertaId] = useState(null);
  const [criando, setCriando] = useState(false);
  const [nome, setNome] = useState("");
  const [membrosSel, setMembrosSel] = useState([]);
  const [duracao, setDuracao] = useState("2h");
  const [professorUid, setProfessorUid] = useState("");
  const [auxiliarUid, setAuxiliarUid] = useState("");
  const [horarios, setHorarios] = useState([]);
  const [professores, setProfessores] = useState([]);
  useEffect(() => { listaProfessores().then(setProfessores); }, []);

  const aberta = abertaId ? turmas.find((t) => t.id === abertaId) : null;
  if (aberta) {
    return (
      <SessaoTurma turma={aberta} alunos={alunos} setAlunos={setAlunos} turmas={turmas} setTurmas={setTurmas}
        papelAtual={papelAtual} uidAtual={uidAtual}
        aoFechar={() => setAbertaId(null)}
        aoRemover={() => { setTurmas(turmas.filter((t) => t.id !== aberta.id)); setAbertaId(null); }} />
    );
  }

  function alternarMembro(id) {
    setMembrosSel((sel) => sel.includes(id) ? sel.filter((x) => x !== id) : [...sel, id]);
  }
  function criarTurma() {
    if (!nome.trim() || membrosSel.length < 2) return;
    const prof = professores.find((p) => p.uid === professorUid);
    const aux = professores.find((p) => p.uid === auxiliarUid);
    setTurmas([...turmas, {
      id: "turma-" + Date.now(), nome: nome.trim(), membros: membrosSel, duracaoPadrao: duracao,
      professorUid, professorNome: prof ? prof.nome : "",
      professorAuxiliarUid: auxiliarUid, professorAuxiliarNome: aux ? aux.nome : "",
      horarios,
    }]);
    setNome(""); setMembrosSel([]); setDuracao("2h"); setProfessorUid(""); setAuxiliarUid(""); setHorarios([]); setCriando(false);
  }

  return (
    <div>
      <h1 style={{ fontFamily: ARCH, fontSize: 22, fontWeight: 700, marginBottom: 4 }}>Turmas</h1>
      <p style={{ ...prosa, color: C.grafite, marginBottom: 18 }}>
        Pra jogadores que treinam juntos. Cada um mantém o próprio plano — a turma só une a
        aula do dia numa sessão só, com presença marcada de uma vez para o grupo.
      </p>

      <CartaoConducao />

      {!criando ? (
        <Botao pequeno onClick={() => setCriando(true)}>Nova turma</Botao>
      ) : (
        <div style={{ background: C.cal, border: "1px solid " + C.linha, padding: 15, marginBottom: 18 }}>
          <Campo rotulo="Nome da turma">
            <input style={entrada} value={nome} onChange={(e) => setNome(e.target.value)} placeholder="ex: Terça 17h" />
          </Campo>
          <Campo rotulo="Duração padrão">
            <Seletor opcoes={[{ v: "1h", r: "1h" }, { v: "1h30", r: "1h30" }, { v: "2h", r: "2h" }]} valor={duracao} aoMudar={setDuracao} />
          </Campo>
          {professores.length > 0 && (
            <Campo rotulo="Professor responsável">
              <Seletor opcoes={[{ v: "", r: "A definir" }, ...professores.map((p) => ({ v: p.uid, r: p.nome }))]}
                valor={professorUid} aoMudar={(v) => { setProfessorUid(v); if (v === auxiliarUid) setAuxiliarUid(""); }} />
            </Campo>
          )}
          {professores.length > 1 && (
            <Campo rotulo="Professor auxiliar" nota="Opcional — o segundo professor da turma entra sempre como auxiliar, nunca como responsável.">
              <Seletor opcoes={[{ v: "", r: "Nenhum" }, ...professores.filter((p) => p.uid !== professorUid).map((p) => ({ v: p.uid, r: p.nome }))]}
                valor={auxiliarUid} aoMudar={setAuxiliarUid} />
            </Campo>
          )}
          <Campo rotulo="Dias e horários de treino" nota="Pode ter de 2 a 5 por semana. Alimenta a Grade de horário e a Agenda semanal.">
            <EditorHorarios horarios={horarios} setHorarios={setHorarios} />
          </Campo>
          <Campo rotulo="Jogadores (mínimo 2)">
            <div className="flex flex-wrap gap-2">
              {alunos.map((a) => (
                <button key={a.id} onClick={() => alternarMembro(a.id)}
                  style={{ fontFamily: ARCH, fontSize: 12.5, fontWeight: 600, padding: "6px 11px", borderRadius: 2, cursor: "pointer",
                    border: "1px solid " + (membrosSel.includes(a.id) ? C.tinta : C.linha),
                    background: membrosSel.includes(a.id) ? C.tinta : C.papel,
                    color: membrosSel.includes(a.id) ? C.papel : C.grafite }}>
                  {a.nome || "Sem nome"}
                </button>
              ))}
            </div>
          </Campo>
          <div className="flex gap-2">
            <Botao pequeno onClick={criarTurma} disabled={!nome.trim() || membrosSel.length < 2}>Criar turma</Botao>
            <Botao pequeno variante="vazio" onClick={() => { setCriando(false); setNome(""); setMembrosSel([]); }}>Cancelar</Botao>
          </div>
        </div>
      )}

      {turmas.length === 0 ? (
        <p style={{ ...prosa, color: C.grafite }}>Nenhuma turma criada ainda.</p>
      ) : (
        turmas.map((t) => (
          <div key={t.id} onClick={() => setAbertaId(t.id)}
            style={{ background: C.cal, border: "1px solid " + C.linha, padding: "13px 15px", marginBottom: 9, cursor: "pointer" }}>
            <div className="flex items-center justify-between gap-3 flex-wrap">
              <div style={{ fontFamily: ARCH, fontSize: 14, fontWeight: 700 }}>{t.nome}</div>
              {!t.plano && <Etiqueta cor={C.saibro}>sem plano — toque pra montar</Etiqueta>}
            </div>
            <div className="mt-1"><Etiqueta>{t.duracaoPadrao} · {t.membros.length} jogadores{rotuloProfessores(t.professorNome, t.professorAuxiliarNome)}</Etiqueta></div>
            {(t.horarios || []).length > 0 && (
              <p style={{ ...prosa, fontSize: 12, color: C.grafite, marginTop: 4 }}>
                {t.horarios.map((h) => nomeDia(h.dia) + " " + h.hora).join(" · ")}
              </p>
            )}
          </div>
        ))
      )}
    </div>
  );
}

/* Editar quem está na turma depois de criada — adicionar um jogador novo
   ou tirar alguém sem precisar excluir a turma inteira. O jogador removido
   só sai da turma; o cadastro dele continua intacto. */
function GerenciarMembrosTurma({ turma, alunos, setTurmas, podeEditar }) {
  const [aberto, setAberto] = useState(false);
  const [addId, setAddId] = useState("");
  const membros = turma.membros.map((id) => alunos.find((a) => a.id === id)).filter(Boolean);
  const disponiveis = alunos.filter((a) => !turma.membros.includes(a.id));

  function adicionar() {
    if (!addId) return;
    setTurmas((atual) => atual.map((t) => (t.id !== turma.id ? t : { ...t, membros: [...t.membros, addId] })));
    setAddId("");
  }
  function remover(id) {
    if (!confirm("Remover este jogador da turma? O cadastro dele continua, ele só sai desta turma.")) return;
    setTurmas((atual) => atual.map((t) => (t.id !== turma.id ? t : { ...t, membros: t.membros.filter((m) => m !== id) })));
  }

  return (
    <div className="mb-5" style={{ background: C.cal, border: "1px solid " + C.linha, padding: "12px 15px" }}>
      <button onClick={() => setAberto(!aberto)} className="w-full flex items-center justify-between gap-3" style={{ cursor: "pointer" }}>
        <span style={{ fontFamily: ARCH, fontSize: 13.5, fontWeight: 700 }}>Jogadores da turma ({membros.length})</span>
        <Etiqueta>{aberto ? "fechar" : "abrir"}</Etiqueta>
      </button>
      {aberto && (
        <div className="mt-3">
          {membros.map((m) => (
            <div key={m.id} className="flex items-center justify-between gap-3 mb-2" style={{ background: C.papel, border: "1px solid " + C.linha, padding: "8px 11px" }}>
              <span style={{ ...prosa, fontSize: 13 }}>{m.nome || "Sem nome"}</span>
              {podeEditar && <button onClick={() => remover(m.id)} title="Remover da turma" style={iconeEstilo}>×</button>}
            </div>
          ))}
          {!podeEditar && (
            <p style={{ ...prosa, fontSize: 12, color: C.grafite }}>Só o professor responsável, o auxiliar ou o coordenador podem alterar os jogadores desta turma.</p>
          )}
          {podeEditar && disponiveis.length > 0 && (
            <div className="flex gap-2 mt-3 flex-wrap items-center">
              <Seletor opcoes={[{ v: "", r: "Adicionar jogador…" }, ...disponiveis.map((a) => ({ v: a.id, r: a.nome || "Sem nome" }))]}
                valor={addId} aoMudar={setAddId} />
              <Botao pequeno onClick={adicionar} disabled={!addId}>Adicionar</Botao>
            </div>
          )}
          {podeEditar && disponiveis.length === 0 && (
            <p style={{ ...prosa, fontSize: 12, color: C.grafite, marginTop: 8 }}>Todos os jogadores cadastrados já estão nesta turma.</p>
          )}
        </div>
      )}
    </div>
  );
}

function SessaoTurma({ turma, alunos, setAlunos, turmas, setTurmas, aoFechar, aoRemover, papelAtual, uidAtual }) {
  const podeEditar = podeEditarTurma(turma, papelAtual, uidAtual);
  const membros = turma.membros.map((id) => alunos.find((a) => a.id === id)).filter(Boolean);
  /* Sem plano ainda, a aba Sessão só mostra "esta turma não tem plano" —
     abre direto em Plano pra "gerar os treinos" ser a primeira coisa que
     aparece, em vez de escondido atrás de um link dentro da Sessão. */
  const [subaba, setSubaba] = useState(turma.plano ? "sessao" : "plano");
  const [statusGeral, setStatusGeral] = useState("feita");
  const [motivo, setMotivo] = useState("");
  const [nota, setNota] = useState("");
  const [salvo, setSalvo] = useState(null);
  const [chuvaAberta, setChuvaAberta] = useState(false);
  const [chuvaModeloId, setChuvaModeloId] = useState(null);
  const [sessaoTurma, setSessaoTurma] = useState(null); // { aquecimento, conteudo } | null — a sessão de hoje da turma, com exercícios de verdade pra rodar em quadra

  const pendencias = turma.pendencias || [];
  const pendenciasAbertas = pendencias.filter((p) => !p.resolvida);
  /* Com plano de turma, o grupo segue UM cronograma — a aula em vigor é
     a da turma, não a de cada jogador. Sem plano de turma ainda, cada
     um continua com o próprio (comportamento de antes da unificação). */
  const aulaTurma = turma.plano ? aulaEmVigor(turma) : null;
  const estagiosTurma = [...new Set(membros.map((m) => m.estagio))];

  /* Monta a sessão de hoje da turma de verdade (com exercícios pra rodar
     em quadra), igual a Sessão de hoje individual já faz — antes disso a
     tela só mostrava o título da aula, sem exercício nenhum, então não
     dava pra "gerar a sessão do dia" de fato, só marcar status depois. */
  function gerarSessaoTurma() {
    const evitar = new Set();
    const aquecimento = sorteia(exerciciosParaSorteio().filter((e) => BLOCOS[0].familias.includes(e.f) && e.e.some((s) => estagiosTurma.includes(s))), evitar, 1);
    let conteudo = (aulaTurma.ex || []).map((c) => TODOS_EXERCICIOS().find((e) => e.c === c)).filter((e) => e && !e.semBola);
    const usados = new Set(conteudo.map((e) => e.c));
    const temSaque = conteudo.some((e) => AREAS.saque.busca.test(e.n + " " + e.m));
    const temDevolucao = conteudo.some((e) => AREAS.devolucao.busca.test(e.n + " " + e.m));
    if (!temSaque) {
      const [s] = sorteia(exerciciosParaSorteio().filter((e) => AREAS.saque.busca.test(e.n + " " + e.m) && e.e.some((x) => estagiosTurma.includes(x)) && !usados.has(e.c)), evitar, 1);
      if (s) { conteudo = [...conteudo, s]; usados.add(s.c); }
    }
    if (!temDevolucao) {
      const [d] = sorteia(exerciciosParaSorteio().filter((e) => AREAS.devolucao.busca.test(e.n + " " + e.m) && e.e.some((x) => estagiosTurma.includes(x)) && !usados.has(e.c)), evitar, 1);
      if (d) conteudo = [...conteudo, d];
    }
    if (estagiosTurma.some((s) => s === "V" || s === "L")) conteudo = garanteBrincadeira(conteudo, evitar, estagiosTurma.find((s) => s === "V" || s === "L"));
    setSessaoTurma({ aquecimento, conteudo });
  }
  function trocarSessaoTurma(secao, i) {
    setSessaoTurma((p) => {
      const lista = p[secao];
      const usados = new Set([...p.aquecimento, ...p.conteudo].map((e) => e.c));
      const pool = exerciciosParaSorteio().filter((e) => e.e.some((s) => estagiosTurma.includes(s)) && !usados.has(e.c));
      if (!pool.length) return p;
      const novo = pool[Math.floor(Math.random() * pool.length)];
      return { ...p, [secao]: lista.map((e, k) => (k === i ? novo : e)) };
    });
  }
  function removerSessaoTurma(secao, i) {
    setSessaoTurma((p) => ({ ...p, [secao]: p[secao].filter((_, k) => k !== i) }));
  }

  /* Quando a sessão sai como planejado ("Realizada"): se a turma tem
     plano próprio, avança só ele (uma marcação, pro grupo inteiro). Sem
     plano de turma, cai no comportamento antigo — avança o plano
     individual de cada jogador que tiver um. Quando não sai como
     planejado (chuva, quadra, o grupo não fechou etc.), NÃO tentamos
     decidir por cada jogador — fica só uma "pendência do grupo"
     pendurada na turma, com motivo e uma anotação livre. */
  function salvarSessao() {
    const hoje = new Date().toISOString().slice(0, 10);
    const modeloChuva = statusGeral === "chuva" ? TREINO_CHUVA.find((m) => m.id === chuvaModeloId) : null;
    const obsChuva = modeloChuva ? ("Dia de chuva — " + modeloChuva.nome + ". " + modeloChuva.saida) : "";
    if (statusGeral === "feita" || statusGeral === "chuva") {
      if (turma.plano && aulaTurma && !aulaTurma.gate) {
        setTurmas(turmas.map((t) => t.id !== turma.id ? t : {
          ...t, regPlano: { ...(t.regPlano || {}), [aulaTurma.id]: { status: "feita", data: hoje, ...(obsChuva ? { obs: obsChuva } : {}) } },
        }));
      } else if (!turma.plano) {
        setAlunos(alunos.map((a) => {
          if (!turma.membros.includes(a.id)) return a;
          const prox = aulaEmVigor(a);
          if (!prox) return a;
          const reg = { ...(a.regPlano || {}), [prox.id]: { status: "feita", data: hoje, ...(obsChuva ? { obs: obsChuva } : {}) } };
          return { ...a, regPlano: reg };
        }));
      }
    } else {
      setTurmas((turmasAtuais) => turmasAtuais.map((t) => t.id !== turma.id ? t : {
        ...t,
        pendencias: [...(t.pendencias || []), { id: "pend-" + Date.now(), data: hoje, motivo, nota, resolvida: false }],
      }));
    }
    setSalvo(statusGeral);
    setChuvaModeloId(null);
    setSessaoTurma(null);
  }

  function marcarResolvida(id) {
    setTurmas((turmasAtuais) => turmasAtuais.map((t) => t.id !== turma.id ? t : {
      ...t,
      pendencias: (t.pendencias || []).map((p) => p.id === id ? { ...p, resolvida: true } : p),
    }));
  }

  return (
    <div>
      <button onClick={aoFechar} className="mb-3" style={{ ...prosa, color: C.grafite, cursor: "pointer" }}>← Turmas</button>
      <h1 style={{ fontFamily: ARCH, fontSize: 22, fontWeight: 700, marginBottom: 4 }}>{turma.nome}</h1>
      <div style={{ marginBottom: (turma.horarios || []).length > 0 ? 4 : 20 }}>
        <Etiqueta>{turma.duracaoPadrao} · {membros.length} jogadores{rotuloProfessores(turma.professorNome, turma.professorAuxiliarNome)}</Etiqueta>
      </div>
      {(turma.horarios || []).length > 0 && (
        <p style={{ ...prosa, fontSize: 12.5, color: C.grafite, marginBottom: 20 }}>
          {turma.horarios.map((h) => nomeDia(h.dia) + " " + h.hora).join(" · ")}
        </p>
      )}

      <GerenciarMembrosTurma turma={turma} alunos={alunos} setTurmas={setTurmas} podeEditar={podeEditar} />

      <div className="flex flex-wrap gap-5 mb-6" style={{ borderBottom: "1px solid " + C.linha }}>
        {[{ v: "sessao", r: "Sessão" }, { v: "plano", r: "Plano" }, { v: "aulas", r: "Aulas" }].map((t) => (
          <button key={t.v} onClick={() => setSubaba(t.v)}
            style={{ fontFamily: ARCH, fontSize: 13, fontWeight: subaba === t.v ? 700 : 500, padding: "8px 0", cursor: "pointer", flexShrink: 0,
              color: subaba === t.v ? C.tinta : C.grafite, borderBottom: "2px solid " + (subaba === t.v ? C.saibro : "transparent"), marginBottom: -1 }}>
            {t.r}
          </button>
        ))}
      </div>

      {subaba === "plano" ? (

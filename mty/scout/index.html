<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#103B32">
<title>Scout da partida · QuadraLab</title>
<link rel="stylesheet" href="graficos.css">
<link rel="stylesheet" href="ao-vivo.css">
<style>
:root { --tinta: #17251F; --papel: #F6F8F7; --verde: #103B32; --grafite: #5B6B63; --linha: #E2E8E5; --contra: #C8102E; --saibro: #B14C1D; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
header { background: var(--verde); color: #fff; padding: 22px 16px 26px; }
header .in { max-width: 640px; margin: 0 auto; }
.marca { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; font-weight: 700; }
h1 { margin: 8px 0 0; font-size: 26px; line-height: 1.15; }
.meta { margin-top: 6px; opacity: .85; font-size: 14px; }
.placar { margin-top: 14px; display: inline-block; padding: 6px 14px; border-radius: 999px; background: #fff; color: var(--verde); font-weight: 800; font-size: 18px; }
section { background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 16px; margin-top: 14px; }
h2 { margin: 0 0 4px; font-size: 18px; }
.nota { color: var(--grafite); font-size: 14px; }
.abas { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.abas button { font: 700 13px system-ui, sans-serif; padding: 8px 14px; min-height: 40px; border-radius: 10px; border: 1.5px solid var(--linha); background: #fff; color: var(--tinta); cursor: pointer; }
.abas button[aria-pressed="true"] { background: var(--verde); border-color: var(--verde); color: #fff; }
svg { display: block; width: 100%; height: auto; }
.leg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; font-weight: 700; margin-top: 4px; }
.barra { display: flex; height: 38px; border-radius: 8px; overflow: hidden; margin: 10px 0; }
.barra div { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 800; }
table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14.5px; }
th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--linha); }
td:last-child, th:last-child { text-align: right; }
.mapa { display: grid; grid-template-columns: 70px repeat(3, 1fr); gap: 6px; margin-top: 10px; font-size: 12px; }
.mapa .c { border-radius: 10px; padding: 10px 6px; text-align: center; min-height: 64px; display: flex; flex-direction: column; justify-content: center; border: 1px solid var(--linha); }
.mapa .h { font-weight: 700; color: var(--grafite); display: flex; align-items: center; justify-content: center; text-align: center; }
.mapa b { font-size: 16px; }
.sinal { border-left: 4px solid var(--saibro); padding: 2px 0 2px 12px; margin: 12px 0; }
.aviso { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #EEF6E8; border: 1px solid #CBE3B8; color: #234A12; font-size: 14.5px; }
footer { margin-top: 22px; font-size: 13px; color: var(--grafite); text-align: center; }
.agora { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0 4px; }
.agora .gr { font: 800 44px/1 system-ui, sans-serif; letter-spacing: -.02em; color: var(--verde); }
.agora .gl { font-size: 12.5px; color: var(--grafite); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.pts { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0 2px; }
.pts i { width: 14px; height: 14px; border-radius: 50%; background: #C65825; }
.pts i.v { background: #0F5E8C; }
.log { list-style: none; margin: 10px 0 0; padding: 0; }
.log li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--linha); font-size: 14.5px; }
.log li .n { color: var(--grafite); font-size: 12.5px; font-weight: 700; }
.log li .q { font-weight: 800; font-variant-numeric: tabular-nums; }
.log li .q.v { color: #0F5E8C; } .log li .q.c { color: #C65825; }
.log li small { display: block; color: var(--grafite); font-size: 12.5px; }
.log li.marco { background: #F1F6F3; border-radius: 8px; border-bottom: 0; margin: 4px 0; font-weight: 800; }
.vermais { margin-top: 10px; font: 700 13px system-ui, sans-serif; padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--linha); background: #fff; color: var(--tinta); cursor: pointer; min-height: 40px; }
.espera { text-align: center; color: var(--grafite); padding: 22px 8px; }
.erro { margin: 40px 0; text-align: center; }
.selo { margin-top: 10px; font-size: 13px; font-weight: 700; opacity: .92; display: flex; align-items: center; gap: 8px; }
.selo.vivo i { width: 9px; height: 9px; border-radius: 50%; background: #ff5a5a; box-shadow: 0 0 0 0 rgba(255,90,90,.7); animation: pulso 1.6s infinite; }
@keyframes pulso { 70% { box-shadow: 0 0 0 9px rgba(255,90,90,0); } 100% { box-shadow: 0 0 0 0 rgba(255,90,90,0); } }
@media (prefers-reduced-motion: reduce) { .selo.vivo i { animation: none; } }
</style>

<body>
<header><div class="in"><div class="marca">QuadraLab · Scout da partida</div><h1 id="titulo">Carregando…</h1><div class="meta" id="meta"></div><div class="placar" id="placar" hidden></div></div></header>
<main id="conteudo" aria-live="polite"></main>
<script src="ao-vivo.js"></script>
<script src="graficos.js"></script>
<script>
(function () {
  var cont = document.getElementById("conteudo");
  var abaAtual = "todo", JANELA = 6, VERDE = "#0F5E8C", CONTRA = "#C65825";
  function el(tag, props, filhos) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { if (k === "texto") e.textContent = props[k]; else if (k === "cls") e.className = props[k]; else e.setAttribute(k, props[k]); });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(f); });
    return e;
  }
  function dataBR(s) { var p = String(s || "").split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : ""; }
  function erro(msg) {
    document.getElementById("titulo").textContent = "Link indisponível";
    cont.textContent = "";
    cont.appendChild(el("p", { cls: "erro", texto: msg }));
  }

  function serieMomento(serie) {
    var saldo = 0;
    return serie.map(function (x, i) {
      var nos = !!x[0];
      saldo += nos ? 1 : -1;
      var mom = 0, ini = Math.max(0, i - JANELA + 1);
      for (var k = ini; k <= i; k++) mom += serie[k][0] ? 1 : -1;
      return { n: i + 1, nos: nos, mom: mom, set: x[1] };
    });
  }
  function sequencias(lista) {
    var melhor = { tam: 0, ini: 0, fim: 0 }, pior = { tam: 0, ini: 0, fim: 0 }, at = null;
    lista.forEach(function (x) {
      if (at && at.nos === x.nos) at.tam++; else at = { nos: x.nos, tam: 1, ini: x.n };
      at.fim = x.n;
      var alvo = x.nos ? melhor : pior;
      if (at.tam > alvo.tam) { alvo.tam = at.tam; alvo.ini = at.ini; alvo.fim = at.fim; }
    });
    return { melhor: melhor, pior: pior };
  }
  /* ── gráfico do momento do jogo ──
     Curva suave do saldo dos últimos 6 pontos, com preenchimento em degradê acima (a favor) e abaixo (contra) da linha de zero,
     faixas nas maiores sequências, divisões por set e um cursor que acompanha o dedo ou o mouse. Só usa os pontos coletados. */
  var MOM_J = 6, momUid = 0;
  function momSuave(pts) {
    var d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += " C" + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + " " + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + " " + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + " " + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
    }
    return d;
  }
  function momentoGrafico(alvo, lista, inicios, opt) {
    opt = opt || {};
    var W = 600, H = 250, pl = 30, pr = 14, pt = 28, pb = 26, J = MOM_J, n = lista.length, id = "mg" + (++momUid);
    var POS = opt.pos || "#0F7A4A", NEG = opt.neg || "#D23B3B", nome = String(opt.nome || "o atleta").replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; });
    function x(i) { return pl + (n <= 1 ? 0 : (i / (n - 1)) * (W - pl - pr)); }
    function y(m) { return pt + (J - m) / (2 * J) * (H - pt - pb); }
    var y0 = y(0), pts = lista.map(function (p, i) { return [x(i), y(p.mom)]; }), linha = momSuave(pts);
    var area = linha + " L" + x(n - 1).toFixed(1) + " " + y0.toFixed(1) + " L" + x(0).toFixed(1) + " " + y0.toFixed(1) + " Z";
    var larg = W - pl - pr, ultimo = lista[n - 1], corUlt = ultimo.mom >= 0 ? POS : NEG;
    var o = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Gráfico do momento do jogo, ponto a ponto" style="display:block;width:100%;height:auto;touch-action:pan-y">' +
      "<defs>" +
      '<linearGradient id="' + id + 'p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + POS + '" stop-opacity=".45"/><stop offset="1" stop-color="' + POS + '" stop-opacity=".03"/></linearGradient>' +
      '<linearGradient id="' + id + 'n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + NEG + '" stop-opacity=".03"/><stop offset="1" stop-color="' + NEG + '" stop-opacity=".42"/></linearGradient>' +
      '<clipPath id="' + id + 'c"><rect x="' + pl + '" y="' + pt + '" width="' + larg + '" height="' + (y0 - pt) + '"/></clipPath>' +
      '<clipPath id="' + id + 'b"><rect x="' + pl + '" y="' + y0 + '" width="' + larg + '" height="' + (H - pb - y0) + '"/></clipPath></defs>';
    [-J / 2, J / 2].forEach(function (v) { o += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#E3E8E5" stroke-dasharray="2 4"/>'; });
    /* faixas das maiores sequências */
    var bandas = [], at = null, mel = { tam: 0 }, pio = { tam: 0 };
    lista.forEach(function (p, i) {
      if (at && at.nos === p.nos) at.tam++; else at = { nos: p.nos, tam: 1, ini: i };
      at.fim = i;
      var alvoSeq = p.nos ? mel : pio;
      if (at.tam > alvoSeq.tam) { alvoSeq.tam = at.tam; alvoSeq.ini = at.ini; alvoSeq.fim = at.fim; }
    });
    [[mel, POS, "a favor"], [pio, NEG, "contra"]].forEach(function (b) {
      var s = b[0]; if (s.tam < 4) return;
      var xa = x(s.ini), xb = x(s.fim), cx = (xa + xb) / 2, rot = s.tam + " seguidos", lw = rot.length * 5.6 + 14;
      o += '<rect x="' + xa.toFixed(1) + '" y="' + pt + '" width="' + Math.max(xb - xa, 3).toFixed(1) + '" height="' + (H - pt - pb) + '" fill="' + b[1] + '" fill-opacity=".07"/>' +
        '<rect x="' + (cx - lw / 2).toFixed(1) + '" y="' + (pt - 22) + '" width="' + lw.toFixed(1) + '" height="17" rx="8.5" fill="#fff" stroke="' + b[1] + '" stroke-opacity=".5"/>' +
        '<text x="' + cx.toFixed(1) + '" y="' + (pt - 10) + '" text-anchor="middle" font-size="10" font-weight="700" fill="' + b[1] + '">' + rot + "</text>";
    });
    o += '<path d="' + area + '" fill="url(#' + id + 'p)" clip-path="url(#' + id + 'c)"/><path d="' + area + '" fill="url(#' + id + 'n)" clip-path="url(#' + id + 'b)"/>' +
      '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y0 + '" y2="' + y0 + '" stroke="#5B6B63" stroke-opacity=".55" stroke-width="1.2"/>' +
      '<path d="' + linha + '" fill="none" stroke="' + POS + '" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#' + id + 'c)"/>' +
      '<path d="' + linha + '" fill="none" stroke="' + NEG + '" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#' + id + 'b)"/>';
    [[J, "+" + J], [0, "0"], [-J, "−" + J]].forEach(function (v) { o += '<text x="' + (pl - 7) + '" y="' + (y(v[0]) + 3.5) + '" text-anchor="end" font-size="10" fill="#7A8580">' + v[1] + "</text>"; });
    (inicios || []).forEach(function (it) {
      if (it.i <= 0 || it.i >= n) return;
      o += '<line x1="' + x(it.i).toFixed(1) + '" x2="' + x(it.i).toFixed(1) + '" y1="' + pt + '" y2="' + (H - pb) + '" stroke="#9AA6A0" stroke-dasharray="3 3"/><text x="' + (x(it.i) + 5).toFixed(1) + '" y="' + (H - pb - 6) + '" font-size="9.5" font-weight="700" letter-spacing=".08em" fill="#7A8580">SET ' + (it.set + 1) + "</text>";
    });
    var passo = Math.max(1, Math.ceil(n / 6));
    for (var k = 0; k < n; k += passo) o += '<text x="' + x(k).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="#7A8580">' + lista[k].n + "</text>";
    o += (opt.aoVivo ? '<circle cx="' + x(n - 1).toFixed(1) + '" cy="' + y(ultimo.mom).toFixed(1) + '" r="5" fill="' + corUlt + '" fill-opacity=".35"><animate attributeName="r" values="5;11;5" dur="1.6s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values=".4;0;.4" dur="1.6s" repeatCount="indefinite"/></circle>' : "") +
      '<circle cx="' + x(n - 1).toFixed(1) + '" cy="' + y(ultimo.mom).toFixed(1) + '" r="4.2" fill="#fff" stroke="' + corUlt + '" stroke-width="2.4"/>' +
      '<line class="mg-cur" y1="' + pt + '" y2="' + (H - pb) + '" stroke="#17251F" stroke-opacity=".5" style="display:none"/><circle class="mg-dot" r="4.8" fill="#fff" stroke="#17251F" stroke-width="2" style="display:none"/></svg>';
    alvo.innerHTML = '<div style="position:relative">' + o + '<div class="mg-tip" hidden style="position:absolute;top:0;pointer-events:none;background:#fff;border:1px solid #DDE5E0;border-radius:10px;padding:6px 10px;font:12px/1.35 system-ui,sans-serif;color:#17251F;box-shadow:0 8px 22px rgba(0,0,0,.14);white-space:nowrap;z-index:2"></div></div>';
    var svg = alvo.querySelector("svg"), tip = alvo.querySelector(".mg-tip"), cur = svg.querySelector(".mg-cur"), dot = svg.querySelector(".mg-dot");
    function mover(ev) {
      var r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * W;
      var i = Math.max(0, Math.min(n - 1, Math.round((vx - pl) / larg * (n - 1)))), p = lista[i];
      cur.setAttribute("x1", x(i)); cur.setAttribute("x2", x(i)); cur.style.display = "";
      dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(p.mom)); dot.style.display = "";
      tip.innerHTML = "<b>Ponto " + p.n + (inicios && inicios.length ? " · Set " + (p.set + 1) : "") + "</b><br>" + (p.nos ? "Ponto de " + nome : "Ponto do adversário") + "<br>Momento: " + (p.mom > 0 ? "+" : p.mom < 0 ? "−" : "") + Math.abs(p.mom);
      tip.hidden = false;
      var px = x(i) / W * r.width, tw = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(r.width - tw, px - tw / 2)) + "px";
    }
    function sair() { cur.style.display = "none"; dot.style.display = "none"; tip.hidden = true; }
    svg.addEventListener("pointermove", mover); svg.addEventListener("pointerdown", mover); svg.addEventListener("pointerleave", sair); svg.addEventListener("pointercancel", sair);
  }

  function secaoMomento(p) {
    var todos = serieMomento(p.serie);
    if (todos.length < JANELA) return null;
    var sets = []; todos.forEach(function (x) { if (sets.indexOf(x.set) < 0) sets.push(x.set); });
    var box = el("section", {}, [el("h2", { texto: "Momento do jogo" }), el("p", { cls: "nota", texto: "A linha é o saldo dos últimos " + JANELA + " pontos. Acima de zero, o jogo estava a favor de " + p.atleta + "; abaixo, a favor do adversário." })]);
    var abas = el("div", { cls: "abas", role: "group", "aria-label": "Escolher a parte do jogo" });
    var area = el("div"), resumo = el("p", { cls: "nota" });
    function mostrar(v) {
      Array.prototype.forEach.call(abas.children, function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === v)); });
      var lista = v === "todo" ? todos : todos.filter(function (x) { return String(x.set) === v; });
      var inicios = []; if (v === "todo") sets.slice(1).forEach(function (st) { for (var i = 0; i < todos.length; i++) if (todos[i].set === st) { inicios.push({ i: i, set: st }); break; } });
      abaAtual = v; momentoGrafico(area, lista, inicios, { pos: VERDE, neg: CONTRA, nome: p.atleta, aoVivo: !!p.aoVivo });
      var sq = sequencias(lista);
      resumo.textContent = "Do ponto " + lista[0].n + " ao " + lista[lista.length - 1].n + ": " +
        (sq.melhor.tam >= 3 ? "maior sequência a favor, " + sq.melhor.tam + " pontos seguidos (" + sq.melhor.ini + " a " + sq.melhor.fim + "). " : "sem sequência a favor de 3 pontos ou mais. ") +
        (sq.pior.tam >= 3 ? "Maior sequência contra, " + sq.pior.tam + " pontos seguidos (" + sq.pior.ini + " a " + sq.pior.fim + ")." : "Sem sequência contra de 3 pontos ou mais.");
    }
    if (sets.length > 1) {
      [["todo", "Jogo todo"]].concat(sets.map(function (st) { return [String(st), "Set " + (st + 1)]; })).forEach(function (a) {
        var b = el("button", { type: "button", "data-v": a[0], "aria-pressed": "false", texto: a[1] }); b.addEventListener("click", function () { mostrar(a[0]); }); abas.appendChild(b);
      });
      box.appendChild(abas);
    }
    box.appendChild(area);
    box.appendChild(el("div", { cls: "leg" }, [el("span", { texto: "▬ A favor de " + p.atleta, style: "color:" + VERDE }), el("span", { texto: "▬ A favor do adversário", style: "color:" + CONTRA })]));
    box.appendChild(resumo);
    mostrar(sets.indexOf(Number(abaAtual)) >= 0 || abaAtual === "todo" ? abaAtual : "todo");
    return box;
  }
  var ROT_ZONA = { "D-REDE": "Direita · rede", "D-APR": "Direita · aproximação", "D-FUNDO": "Direita · fundo", "E-REDE": "Esquerda · rede", "E-APR": "Esquerda · aproximação", "E-FUNDO": "Esquerda · fundo" };
  
  var verTodos = false;
  /* contagem ponto a ponto: o mais recente em cima, com a pontuação depois de cada ponto, os games e os sets */
  function secaoContagem(p) {
    var serie = p.serie || [], box = el("section"), FIM_ROT = { winner_nos: "Winner de " + p.atleta, erro_dele: "Erro do adversário", erro_nos: "Erro de " + p.atleta, winner_dele: "Winner do adversário" };
    function montar() {
      box.textContent = "";
      box.appendChild(el("h2", { texto: "Contagem ponto a ponto" }));
      if (!serie.length) { box.appendChild(el("p", { cls: "espera", texto: "Aguardando o primeiro ponto…" })); return; }
      var ult = serie[serie.length - 1], tem = ult.length > 2 && ult[2];
      if (tem) {
        var atual = /^(Game|Set)/.test(ult[2]) ? "0-0" : ult[2];
        box.appendChild(el("div", { cls: "agora" }, [el("div", {}, [el("div", { cls: "gl", texto: p.concluida ? "Último ponto" : "Pontos do game" }), el("div", { cls: "gr", texto: p.concluida ? ult[2] : atual })]), el("div", { cls: "gl", style: "text-align:right", texto: "Games e sets: " + (p.resultado && p.resultado !== "—" ? p.resultado : "—") })]));
      }
      var dots = el("div", { cls: "pts", role: "img", "aria-label": "Últimos pontos: verde ganhos por " + p.atleta + ", vermelho ganhos pelo adversário" });
      serie.slice(-12).forEach(function (x) { dots.appendChild(el("i", { cls: x[0] ? "v" : "" })); });
      box.appendChild(dots);
      box.appendChild(el("p", { cls: "nota", texto: "Cada ponto, do mais recente para o mais antigo. A pontuação mostrada é a de depois do ponto." }));
      var lista = el("ol", { cls: "log" }), ini = verTodos ? 0 : Math.max(0, serie.length - 30);
      for (var i = serie.length - 1; i >= ini; i--) {
        var x = serie[i], marco = /^(Game|Set)/.test(x[2] || "");
        var q = el("span", { cls: "q " + (x[0] ? "v" : "c"), texto: x[2] || "" });
        var quem = x[0] ? "Ponto de " + p.atleta : "Ponto do adversário";
        var li = el("li", { cls: marco ? "marco" : "" }, [el("span", { cls: "n", texto: "#" + (i + 1) }), el("span", {}, [document.createTextNode(quem), FIM_ROT[x[3]] ? el("small", { texto: FIM_ROT[x[3]] }) : null]), q]);
        lista.appendChild(li);
      }
      box.appendChild(lista);
      if (serie.length > 30) {
        var b = el("button", { type: "button", cls: "vermais", texto: verTodos ? "Mostrar só os 30 mais recentes" : "Mostrar todos os " + serie.length + " pontos" });
        b.addEventListener("click", function () { verTodos = !verTodos; montar(); });
        box.appendChild(b);
      }
    }
    montar();
    return box;
  }
  function secaoMapa(p) {
    var z = p.zonas || {}, total = 0;
    Object.keys(z).forEach(function (k) { total += z[k].n; });
    if (total < 5) return null;
    var box = el("section", {}, [el("h2", { texto: "Mapa da quadra" }), el("p", { cls: "nota", texto: "Onde foi o último golpe de " + p.atleta + " em cada ponto marcado (" + total + " de " + p.n + "). O saldo é pontos ganhos menos pontos perdidos naquela zona." })]);
    var g = el("div", { cls: "mapa" });
    g.appendChild(el("div"));
    ["Rede", "Aproximação", "Fundo"].forEach(function (c) { g.appendChild(el("div", { cls: "h", texto: c })); });
    [["D", "Direita"], ["E", "Esquerda"]].forEach(function (lado) {
      g.appendChild(el("div", { cls: "h", texto: lado[1] }));
      ["REDE", "APR", "FUNDO"].forEach(function (pos) {
        var d = z[lado[0] + "-" + pos], c = el("div", { cls: "c" });
        if (!d || !d.n) { c.appendChild(el("span", { cls: "nota", texto: "—" })); }
        else {
          var saldo = d.ganhos - (d.n - d.ganhos);
          c.style.background = saldo > 0 ? "#E3F3EA" : saldo < 0 ? "#FBE6E4" : "#F6F8F7";
          c.appendChild(el("b", { texto: (saldo > 0 ? "+" : "") + saldo, style: "color:" + (saldo > 0 ? "#1F6B4A" : saldo < 0 ? "#A6432F" : "#5B6B63") }));
          c.appendChild(el("span", { texto: d.n + (d.n === 1 ? " ponto" : " pontos") }));
        }
        g.appendChild(c);
      });
    });
    box.appendChild(g);
    return box;
  }
  function secaoBolas(p) {
    var b = p.bolas, cores = ["#B14C1D", "#103B32", "#5B6B63"];
    var box = el("section", {}, [el("h2", { texto: "Onde o ponto se decidiu" }), el("p", { cls: "nota", texto: "Cerca de 70% dos pontos do circuito terminam em até quatro bolas." })]);
    var barra = el("div", { cls: "barra", role: "img", "aria-label": "Pontos por duração: " + b.pctCurtos + "% em 1–2 bolas, " + b.pctMedios + "% em 3–4, " + b.pctLongos + "% em 5 ou mais" });
    [["1–2 bolas", b.pctCurtos], ["3–4 bolas", b.pctMedios], ["5+ bolas", b.pctLongos]].forEach(function (x, i) { var d = el("div", { texto: x[1] + "%" }); d.style.width = Math.max(x[1], 4) + "%"; d.style.background = cores[i]; barra.appendChild(d); });
    box.appendChild(barra);
    box.appendChild(el("p", { cls: "nota", texto: b.pctAte4 + "% dos pontos terminaram em até quatro bolas." + (b.pctAte4 >= 65 ? " Em linha com o circuito." : " Abaixo do circuito: o jogo foi para a troca longa.") }));
    return box;
  }
  function secaoNumeros(p) {
    var nm = p.numeros, linhas = [["Pontos coletados", p.n], ["Pontos ganhos", p.ganhos + " · " + p.pctGanhos + "%"], ["Erros de " + p.atleta, nm.errosNos + " (" + nm.errosDecisao + " por decisão, " + nm.errosExec + " por execução)"], ["Duplas faltas", nm.df], ["Protocolo entre pontos", nm.pctProtocolo + "%"], ["Subidas à rede", nm.rede + " · " + nm.redeGanha + " convertidas"]];
    var t = el("table"), tb = el("tbody");
    linhas.forEach(function (l) { tb.appendChild(el("tr", {}, [el("td", { texto: l[0] }), el("td", { texto: String(l[1]) })])); });
    t.appendChild(tb);
    return el("section", {}, [el("h2", { texto: "O jogo em números" }), t]);
  }
  function secaoSinais(p) {
    var box = el("section", {}, [el("h2", { texto: "O que este jogo aponta" }), el("p", { cls: "nota", texto: "Leitura automática pelas regras do método. É ponto de partida para a conversa com o treinador, não conclusão." })]);
    if (!p.sinais.length) box.appendChild(el("p", { texto: "Nada fora do esperado nos indicadores coletados." }));
    p.sinais.forEach(function (t) { box.appendChild(el("div", { cls: "sinal", texto: t })); });
    return box;
  }

  function desenhar(p, ate) {
    var sy = window.scrollY;
    if (token) cont.removeAttribute("aria-live");
    document.title = "Scout da partida · " + p.atleta;
    document.getElementById("titulo").textContent = "Partida de " + p.atleta;
    document.getElementById("meta").textContent = [dataBR(p.data), p.torneio, p.concluida || p.aoVivo ? "" : "Acompanhamento interrompido"].filter(Boolean).join(" · ");
    if (p.resultado && p.resultado !== "—") { var pl = document.getElementById("placar"); pl.textContent = p.resultado; pl.hidden = false; }
    cont.textContent = "";
    var gr = el("div", {}); if (p.n > 0 && window.QLScoutGraficos) gr.innerHTML = QLScoutGraficos.topo(p) + QLScoutGraficos.secoes(p);
    [p.n > 0 ? gr : null, secaoMomento(p), p.n > 0 ? secaoNumeros(p) : null, p.n > 0 ? secaoBolas(p) : null, secaoMapa(p), p.n > 0 ? secaoSinais(p) : null].forEach(function (x) { if (x) cont.appendChild(x); });
    cont.appendChild(el("p", { cls: "aviso", texto: "Um jogo é uma amostra. Três jogos na mesma direção são um sinal; um jogo isolado é ruído. O que importa é o padrão que se repete." }));
    cont.appendChild(el("footer", { texto: token ? "Compartilhado pelo treinador no QuadraLab. Esta página se atualiza sozinha enquanto a partida acontece; o link expira em algumas horas e pode ser desativado pelo treinador." : (ate ? "Compartilhado pelo treinador no QuadraLab. Este link vale até " + dataBR(ate) + " e pode ser desativado pelo treinador a qualquer momento." : "Do seu link de aluno, compartilhado pelo treinador no QuadraLab.") }));
    if (token || !ate) { window.scrollTo(0, sy); return; }
    var imp = el("p", { cls: "nota", style: "text-align:center;margin-top:10px" });
    imp.appendChild(document.createTextNode("Você é o atleta? Guarde este scout na sua conta em "));
    var a = el("a", { href: "https://quadralab.com.br/competicao/#/scouts", target: "_blank", rel: "noopener noreferrer", texto: "QuadraLab Competição · Scouts do treinador" });
    imp.appendChild(a); imp.appendChild(document.createTextNode(" colando o endereço desta página."));
    cont.appendChild(imp);
  }

  /* início: fica no fim do arquivo para que todas as variáveis acima já estejam atribuídas */
  var q = new URLSearchParams(location.search), token = q.get("l"), versao = 0, aoVivo = false, falhas = 0, timer = null;
  function pegar(url) {
    return fetch(url, { referrerPolicy: "no-referrer", cache: "no-store" })
      .then(function (r) { return r.json().then(function (c) { if (!r.ok) { var e = new Error(c.erro || "Link inválido."); e.status = r.status; throw e; } return c; }); });
  }
  function hora(d) { function z(v) { return (v < 10 ? "0" : "") + v; } return z(d.getHours()) + ":" + z(d.getMinutes()) + ":" + z(d.getSeconds()); }
  function selo(texto, vivo) {
    var e = document.getElementById("selo");
    if (!e) { e = el("div", { id: "selo", cls: "selo", role: "status" }); document.getElementById("placar").parentNode.appendChild(e); }
    e.className = "selo" + (vivo ? " vivo" : ""); e.textContent = "";
    if (vivo) e.appendChild(el("i"));
    e.appendChild(document.createTextNode(texto));
  }
  if (token) {
    if (!/^[0-9a-f]{32}$/.test(token)) { erro("Link incompleto. Peça um novo ao seu treinador."); return; }
    var buscar = function () {
      clearTimeout(timer);
      if (document.hidden) { timer = setTimeout(buscar, 4000); return; }
      pegar("/.netlify/functions/scout-ao-vivo?" + new URLSearchParams({ t: token, v: String(versao) }).toString())
        .then(function (c) {
          falhas = 0;
          if (!c.semMudanca) { versao = c.versao; aoVivo = !!c.publico.aoVivo; desenhar(c.publico, c.expiraEm); }
          else if (aoVivo !== !!c.aoVivo) { aoVivo = !!c.aoVivo; versao = 0; return buscar(); }
          selo(aoVivo ? "AO VIVO · atualizado às " + hora(new Date()) : "Partida encerrada · resultado final", aoVivo);
          timer = setTimeout(buscar, aoVivo ? 5000 : 30000);
        })
        .catch(function (e) {
          if (e.status === 404 || e.status === 410) { clearTimeout(timer); erro("Este acompanhamento foi encerrado pelo treinador ou expirou."); return; }
          falhas++; selo("Reconectando… (" + (e.status ? "erro " + e.status : "sem conexão") + ")", false);
          if (!versao) { document.getElementById("titulo").textContent = "Conectando ao jogo…"; cont.textContent = ""; cont.appendChild(el("p", { cls: "espera", texto: "Ainda não consegui abrir o acompanhamento" + (e.status ? " (erro " + e.status + (e.message ? ": " + e.message : "") + ")" : "; verifique a internet") + ". Vou tentar de novo automaticamente." })); }
          timer = setTimeout(buscar, Math.min(30000, 4000 * falhas));
        });
    };
    document.addEventListener("visibilitychange", function () { if (!document.hidden) buscar(); });
    buscar();
    return;
  }
  if (!q.get("org") || !q.get("id") || !q.get("j") || !q.get("t")) { erro("Link incompleto. Peça um novo ao seu treinador."); return; }
  /* aberto a partir do link do aluno (aluno.html): o mesmo resumo, conferido pelo token do link do aluno */
  if (q.get("a") === "1") {
    pegar("/.netlify/functions/ver-aluno?" + new URLSearchParams({ org: q.get("org"), id: q.get("id"), t: q.get("t"), jogo: q.get("j") }).toString())
      .then(function (c) { desenhar(c.publico, ""); })
      .catch(function (e) { erro(e.message || "Não foi possível abrir agora."); });
    return;
  }
  pegar("/.netlify/functions/scout-publico?" + new URLSearchParams({ org: q.get("org"), id: q.get("id"), j: q.get("j"), t: q.get("t") }).toString())
    .then(function (c) { desenhar(c.publico, c.ate); })
    .catch(function (e) { erro(e.message || "Não foi possível abrir agora."); });

})();
</script>

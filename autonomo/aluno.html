<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu plano · QuadraLab</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#67AD2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu plano">
<style>
  :root{ --papel:#F5F2F0; --tinta:#141210; --verm:#67AD2E; --cinza:#6B6461; --linha:#D8D1CB; --verde:#2E4739;
    /* Cores do mapa de calor de conceitos — fixas, independentes de
       --verm (aqui é o verde da marca QuadraLab, não dá pra usar pra
       "não atingido" — ficaria verde = ruim). */
    --conc-atingiu:#1F6B4A; --conc-parcial:#C9A227; --conc-nao:#A6432F; }
  *{box-sizing:border-box}
  body{margin:0; background:var(--papel); color:var(--tinta);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:0 0 60px}
  .topo{background:var(--verm); height:7px}
  .wrap{max-width:560px; margin:0 auto; padding:0 18px}
  header{padding:22px 0 10px}
  h1{font-family:Georgia,serif; font-size:24px; margin:10px 0 2px}
  .sub{color:var(--cinza); font-size:13.5px}
  .rosca-wrap{display:flex; align-items:center; gap:16px; background:#fff; border:1px solid var(--linha); border-radius:6px; padding:14px 16px; margin:14px 0 6px}
  .progtxt{font-size:12px; color:var(--cinza); margin-top:6px}
  .bloco{margin:22px 0 8px; font-family:Georgia,serif; font-weight:700; font-size:16px}
  .semana{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--cinza); margin:14px 0 6px}
  .aula{background:#fff; border:1px solid var(--linha); border-left:4px solid var(--linha); border-radius:3px;
    padding:10px 13px; margin-bottom:8px; display:flex; align-items:center; gap:10px}
  .aula.feita{border-left-color:var(--verde)}
  .marca{font-size:18px}
  .aula .txt{flex:1}
  .aula .data{font-size:11.5px; color:var(--cinza)}
  .erro{background:#fff; border:1px solid var(--linha); border-left:4px solid var(--verm); padding:14px; margin-top:24px}
  .carregando{color:var(--cinza); padding:30px 0}
  .sincronia{font-size:11.5px; color:var(--cinza); text-align:right; margin-top:22px}
  .sincronia.piscando{color:var(--verde)}

  .painel{background:#fff; border:1px solid var(--linha); border-radius:6px; padding:15px 16px; margin-top:18px}
  .painel h2{font-family:Georgia,serif; font-size:15px; margin:0 0 4px}
  .painel .desc{font-size:12.5px; color:var(--cinza); margin:0 0 11px}
  .btn{font:600 13px -apple-system,sans-serif; padding:9px 14px; border-radius:4px; border:1px solid var(--tinta);
    background:var(--tinta); color:#fff; cursor:pointer}
  .btn.fraco{background:#fff; color:var(--tinta)}
  .btn.perigo{background:var(--verm); border-color:var(--verm); color:#fff}
  .btn:disabled{opacity:.5; cursor:default}
  .linha-btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
  textarea, .campo-texto{width:100%; font:14px/1.4 -apple-system,sans-serif; padding:9px 10px; border:1px solid var(--linha);
    border-radius:4px; resize:vertical; background:var(--papel)}
  .aviso-mini{font-size:12px; color:var(--cinza); margin-top:6px}
  .confirmado{font-size:12.5px; color:var(--verde); margin-top:8px; font-weight:600}
  .grade{display:grid; grid-template-columns:repeat(7, 1fr); gap:3px; margin:10px 0}
  .grade .rot{font-size:10px; text-align:center; color:var(--cinza); font-weight:700}
  .cel{font-size:10.5px; text-align:center; padding:5px 2px; border-radius:3px; border:1px solid var(--linha); cursor:pointer; background:var(--papel)}
  .cel.ocupado{background:#EFE7E4; color:var(--cinza); cursor:default; text-decoration:line-through}
  .cel.sel{background:var(--verde); color:#fff; border-color:var(--verde)}
  .pedido-pendente{background:#FDF6E7; border:1px solid #C9A227; border-radius:4px; padding:10px 12px; font-size:12.5px; margin-top:8px}
</style>
</head>
<body>
<div class="topo"></div>
<div class="wrap">
<div id="mty-instalar"></div>
<div id="conteudo"><div class="carregando">Carregando…</div></div>
</div>
<script>
/* Manifest gerado na hora, não um arquivo estático: o link do aluno
   carrega org/id/t na própria URL, e um manifest fixo (start_url fixo)
   faria o ícone instalado abrir sem esses parâmetros — "link incompleto".
   Gerando o manifest com start_url = URL atual, o ícone reabre exatamente
   este link do aluno. */
(function () {
  const manifest = {
    name: 'Meu plano · QuadraLab', short_name: 'Meu plano',
    start_url: location.pathname + location.search, display: 'standalone',
    background_color: '#F5F2F0', theme_color: '#67AD2E',
    icons: [
      { src: 'assets/icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: 'assets/icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: 'assets/icon-512-maskable.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' },
    ],
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});

/* Mesma ideia do app do treinador: sem API única entre navegadores —
   Chrome/Android dispara beforeinstallprompt (dá pra chamar .prompt()
   num clique); iOS Safari não tem nenhuma API, só a orientação de tocar
   em Compartilhar → Adicionar à Tela de Início. Fica fora do ciclo de
   render(d) porque não depende dos dados do aluno nem deve sumir a cada
   sincronia automática. */
(function () {
  const el = document.getElementById('mty-instalar');
  let deferredPrompt = null;
  function dispensado() {
    try { return localStorage.getItem('mty-instalar-dispensado') === '1'; } catch (e) { return false; }
  }
  function dispensar() {
    try { localStorage.setItem('mty-instalar-dispensado', '1'); } catch (e) {}
    el.innerHTML = '';
  }
  function padrao() {
    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    /* Discreto de propósito: nunca repete depois que o aluno já instalou
       ou já disse "não, obrigado" uma vez — e a próxima aula (render(d))
       sempre aparece acima disto na ordem visual da página. */
    if (standalone || dispensado()) { el.innerHTML = ''; return; }
    if (deferredPrompt) {
      el.innerHTML = '<div class="painel" style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">' +
        '<div><p class="desc" style="margin:0 0 8px">Instale este link na tela de início do seu celular — abre direto, sem digitar o endereço de novo.</p>' +
        '<button class="btn" id="mty-btn-instalar">Instalar</button></div>' +
        '<button id="mty-btn-dispensar-instalar" aria-label="Dispensar" style="background:none;border:none;color:var(--cinza);font-size:16px;cursor:pointer;padding:0 2px">✕</button></div>';
      document.getElementById('mty-btn-instalar').addEventListener('click', async function () {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        padrao();
      });
      document.getElementById('mty-btn-dispensar-instalar').addEventListener('click', dispensar);
      return;
    }
    if (ios) {
      el.innerHTML = '<div class="painel" style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">' +
        '<p class="desc" style="margin:0">Pra instalar na tela de início: toque em <b>Compartilhar</b> ' +
        '(o ícone com uma seta pra cima) e depois em <b>"Adicionar à Tela de Início"</b>.</p>' +
        '<button id="mty-btn-dispensar-instalar" aria-label="Dispensar" style="background:none;border:none;color:var(--cinza);font-size:16px;cursor:pointer;padding:0 2px">✕</button></div>';
      document.getElementById('mty-btn-dispensar-instalar').addEventListener('click', dispensar);
      return;
    }
    el.innerHTML = '';
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; padrao(); });
  window.addEventListener('appinstalled', function () { deferredPrompt = null; padrao(); });
  padrao();
})();
</script>
<script>
function escapar(s){ return String(s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

/* Mesma convenção de texto do relatório de ciclo do app do treinador
   (═══ TÍTULO ═══, ── bloco ──, CAIXA ALTA, indentação como detalhe) —
   interpretada aqui em HTML de verdade, pra não aparecer cru num <pre>
   pro aluno. */
function formatarRelatorioHTML(texto) {
  const linhas = String(texto || '').split('\n');
  const partes = [];
  let paragrafo = [];
  function fecharParagrafo() {
    if (paragrafo.length) {
      partes.push('<p style="margin:0 0 10px;font-size:13px;line-height:1.6">' + paragrafo.join('<br>') + '</p>');
      paragrafo = [];
    }
  }
  linhas.forEach(function (linhaCrua) {
    const linha = linhaCrua.trim();
    if (!linha) { fecharParagrafo(); return; }
    const divisorForte = linha.match(/^═+\s*(.*?)\s*═+$/);
    if (divisorForte) {
      fecharParagrafo();
      partes.push('<h2 style="font-family:Georgia,serif;font-size:15px;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid #67AD2E">' + escapar(divisorForte[1]) + '</h2>');
      return;
    }
    const divisorFraco = linha.match(/^─+\s*(.*?)\s*─+$/);
    if (divisorFraco) {
      fecharParagrafo();
      partes.push('<h3 style="font-family:Georgia,serif;font-size:12.5px;margin:16px 0 6px;color:#6B6461;text-transform:uppercase;letter-spacing:.03em">' + escapar(divisorFraco[1]) + '</h3>');
      return;
    }
    if (linha === '---') { fecharParagrafo(); partes.push('<hr style="border:none;border-top:1px solid #D8D1CB;margin:18px 0">'); return; }
    const soCaixaAlta = linha.length < 80 && /[A-ZÀ-Ú]/.test(linha) && !/[a-zà-ú]/.test(linha);
    if (soCaixaAlta) {
      fecharParagrafo();
      partes.push('<h3 style="font-family:Georgia,serif;font-size:12.5px;margin:16px 0 6px">' + escapar(linha) + '</h3>');
      return;
    }
    const indentado = /^\s{2,}/.test(linhaCrua);
    if (indentado) {
      fecharParagrafo();
      partes.push('<p style="margin:0 0 6px 16px;font-size:12.5px;color:#6B6461;line-height:1.5">' + escapar(linha) + '</p>');
      return;
    }
    paragrafo.push(escapar(linha));
  });
  fecharParagrafo();
  return partes.join('');
}

/* Mesmo cabeçalho de marca usado no PDF do app do treinador — nome da
   academia (d.academiaNome) quando o backend consegue achar, senão só
   a identidade do QuadraLab. */
function cabecalhoRelatorioHTML(academiaNome) {
  return '<div style="border-bottom:3px solid #67AD2E;padding-bottom:10px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px">' +
    '<div><div style="font-family:Georgia,serif;font-weight:700;font-size:13px;letter-spacing:.02em">QUADRALAB</div>' +
    (academiaNome ? '<div style="font-size:11.5px;color:#6B6461;margin-top:2px">' + escapar(academiaNome) + '</div>' : '') +
    '</div></div>';
}

/* Mesma leitura de três estados usada no app do treinador: feita (verde),
   pendente (cinza, neutro) e repetindo — falta/cancelada, ainda vai
   precisar de reposição (vermelho). */
function rosquinhaSvg(feita, pendente, repetindo) {
  const total = feita + pendente + repetindo;
  if (!total) return '';
  const r = 42, c = 2 * Math.PI * r;
  let offset = 0;
  const circulos = [
    { v: feita, cor: 'var(--verde)' },
    { v: repetindo, cor: 'var(--verm)' },
    { v: pendente, cor: 'var(--linha)' },
  ].filter(function (s) { return s.v > 0; }).map(function (s) {
    const len = (s.v / total) * c;
    const trecho = '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="' + s.cor + '" stroke-width="12" ' +
      'stroke-dasharray="' + len + ' ' + (c - len) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 50 50)" />';
    offset += len;
    return trecho;
  }).join('');
  const pct = Math.round((feita / total) * 100);
  return '<svg width="104" height="104" viewBox="0 0 100 100" style="flex-shrink:0">' + circulos +
    '<text x="50" y="48" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="20" fill="var(--tinta)">' + pct + '%</text>' +
    '<text x="50" y="62" text-anchor="middle" font-size="7.5" letter-spacing="0.5" fill="var(--cinza)">FEITAS</text>' +
    '</svg>';
}
function legendaRosca(feita, pendente, repetindo) {
  const itens = [['Feitas', 'var(--verde)', feita], ['Pendentes', 'var(--cinza)', pendente], ['Repetindo', 'var(--verm)', repetindo]]
    .filter(function (x) { return x[2] > 0; });
  return itens.map(function (x) {
    return '<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">' +
      '<span style="width:9px;height:9px;border-radius:999px;background:' + x[1] + ';display:inline-block"></span>' +
      '<span style="font-size:12.5px">' + x[0] + ' · ' + x[2] + '</span></div>';
  }).join('');
}

/* Mesma lógica do painel do treinador: os critérios de saída são sempre
   a mesma pergunta (atingido/parcial/não atingido) em todo ciclo, então
   dá pra comparar % de critérios atingidos entre ciclos, mesmo com plano
   e texto diferentes em cada um. Sem biblioteca de gráfico aqui — é um
   SVG simples, na mesma linha da rosquinhaSvg acima. */
function graficoEvolucaoSvg(pontos) {
  if (pontos.length < 2) return '';
  const w = 280, h = 120, padL = 22, padR = 8, padT = 10, padB = 8;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  function x(i) { return padL + (pontos.length === 1 ? 0 : (i / (pontos.length - 1)) * innerW); }
  function y(v) { return padT + innerH - (v / 100) * innerH; }
  function linha(chave, cor) {
    const segmentos = [];
    let atual = [];
    pontos.forEach(function (p, i) {
      if (p[chave] == null) { if (atual.length > 1) segmentos.push(atual); atual = []; return; }
      atual.push([x(i), y(p[chave])]);
    });
    if (atual.length > 1) segmentos.push(atual);
    const linhas = segmentos.map(function (seg) {
      const d = seg.map(function (p, i) { return (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
      return '<path d="' + d + '" fill="none" stroke="' + cor + '" stroke-width="2" />';
    }).join('');
    const pontosSvg = pontos.map(function (p, i) {
      return p[chave] == null ? '' : '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p[chave]).toFixed(1) + '" r="3" fill="' + cor + '" />';
    }).join('');
    return linhas + pontosSvg;
  }
  const grade = [0, 50, 100].map(function (v) {
    return '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--linha)" stroke-width="1" />' +
      '<text x="' + (padL - 4) + '" y="' + (y(v) + 3).toFixed(1) + '" font-size="8" text-anchor="end" fill="var(--cinza)">' + v + '</text>';
  }).join('');
  return '<svg width="100%" viewBox="0 0 ' + w + ' ' + h + '" style="max-width:320px">' + grade +
    linha('pctCriterios', 'var(--verde)') + linha('pctAulas', 'var(--tinta)') + '</svg>';
}

/* A mesma escada Y1–Y6 do método, versão curta pro aluno — a descrição
   completa (critérios técnicos, o que "ainda não exige" etc.) é pro
   treinador observar em quadra; aqui o que importa é o jogador entender
   o caminho inteiro e onde ele está agora, não virar uma segunda ficha
   técnica. Nomes e "capacidade" batem com NIVEIS_CRITERIOS do app do
   treinador (duplicado aqui porque esta página roda isolada, sem
   acesso ao bundle React). */
const NIVEIS_ESCADA = [
  { v: 'Y1', nome: 'Descoberta', capacidade: 'Jogar o jogo — sacar, trocar bola e disputar o ponto do início ao fim.' },
  { v: 'Y2', nome: 'Troca', capacidade: 'Sustentar a troca de bola e começar o ponto com intenção.' },
  { v: 'Y3', nome: 'Direção', capacidade: 'Escolher para onde a bola vai, e ir à frente na quadra.' },
  { v: 'Y4', nome: 'Construção', capacidade: 'Construir o ponto em duas bolas, cada uma com um papel definido.' },
  { v: 'Y5', nome: 'Decisão', capacidade: 'Decidir sob pressão, com padrões que já saem automáticos.' },
  { v: 'Y6', nome: 'Competição', capacidade: 'Competir com repertório completo, sustentando o plano na partida.' },
];

/* Escada visual Y1→Y6: de baixo pra cima, como se sobe de verdade —
   degraus já alcançados em verde, o atual em destaque, os que faltam
   mais claros (o aluno vê de cara quanto já andou e quanto falta). */
function escadaNiveisHtml(nivelAtual) {
  const idxAtual = NIVEIS_ESCADA.findIndex(function (n) { return n.v === nivelAtual; });
  const ordem = NIVEIS_ESCADA.slice().reverse();
  return ordem.map(function (n, i) {
    const idx = NIVEIS_ESCADA.length - 1 - i;
    const passado = idxAtual >= 0 && idx < idxAtual;
    const atual = idx === idxAtual;
    const futuro = idxAtual >= 0 && idx > idxAtual;
    const cor = passado ? 'var(--verde)' : atual ? 'var(--verm)' : 'var(--linha)';
    const ehUltimo = i === ordem.length - 1;
    const proximoIdx = idx - 1;
    const linhaAlcancada = idxAtual >= 0 && proximoIdx >= 0 && proximoIdx <= idxAtual;
    return '<div style="display:flex;gap:12px">' +
      '<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:34px">' +
      '<div style="width:34px;height:34px;border-radius:999px;flex-shrink:0;background:' + (passado || atual ? cor : '#fff') +
        ';border:2px solid ' + cor + ';display:flex;align-items:center;justify-content:center;' +
        'font-family:Georgia,serif;font-weight:700;font-size:12.5px;color:' + (passado || atual ? '#fff' : cor) + '">' +
        (passado ? '✓' : n.v) + '</div>' +
      (!ehUltimo ? '<div style="width:2px;flex:1;min-height:18px;background:' + (linhaAlcancada ? 'var(--verde)' : 'var(--linha)') + '"></div>' : '') +
      '</div>' +
      '<div style="padding-bottom:' + (ehUltimo ? '0' : '16') + 'px;opacity:' + (futuro ? '.55' : '1') + '">' +
      '<div style="font-family:Georgia,serif;font-weight:700;font-size:14px">' + n.v + ' · ' + escapar(n.nome) +
        (atual ? ' <span style="font-size:10px;font-weight:700;background:var(--verm);color:#fff;padding:2px 7px;border-radius:999px;margin-left:3px;vertical-align:middle;white-space:nowrap">VOCÊ ESTÁ AQUI</span>' : '') +
        '</div>' +
      '<div style="font-size:12.5px;color:var(--cinza);margin-top:2px">' + escapar(n.capacidade) + '</div>' +
      '</div></div>';
  }).join('');
}

/* Mapa de calor de conceitos — versão simplificada pro aluno: só as
   últimas aulas (d.mapaConceitos já vem recortado em até 6 pela
   function ver-aluno.js), sem nomes de bloco, com a frase de insight já
   calculada no servidor. Linhas fixas (mesma ordem de CONCEITOS_ALUNO em
   toda tela que usa isto); cor = STATUS, não intensidade, com glifo (✕ ◐
   ✓) pra nunca depender só da cor; toque numa célula mostra a mesma
   frase do title num texto abaixo (ver data-acao="tocar-celula-conceito"
   em ligarEventos). */
const CONCEITOS_ALUNO = ["Saque e devolução", "Construção de ponto", "Rede e finalização", "Movimentação e base", "Tático e jogo", "Físico e mental"];
const CONCEITO_STATUS_LABEL_ALUNO = { atingiu: 'Atingiu', parcial: 'Parcial', nao_atingiu: 'Não atingiu', nao_trabalhado: 'Não trabalhado' };
function corStatusConceitoAluno(status) {
  return status === 'atingiu' ? 'var(--conc-atingiu)' : status === 'parcial' ? 'var(--conc-parcial)' : status === 'nao_atingiu' ? 'var(--conc-nao)' : 'var(--linha)';
}
function glifoStatusConceito(status) {
  return status === 'atingiu' ? '✓' : status === 'parcial' ? '◐' : status === 'nao_atingiu' ? '✕' : '';
}
function painelMapaConceitos(d, ui) {
  const m = d.mapaConceitos;
  if (!m || !m.colunas || !m.colunas.length) return '';
  const linhas = CONCEITOS_ALUNO.map(function (conceito) {
    const celulas = m.colunas.map(function (col) {
      const status = col.celulas[conceito] || 'nao_trabalhado';
      const cor = corStatusConceitoAluno(status);
      const texto = 'Aula ' + col.indice + ' · ' + conceito + ' · ' + CONCEITO_STATUS_LABEL_ALUNO[status];
      return '<td style="padding:2px"><div data-acao="tocar-celula-conceito" data-texto="' + escapar(texto) + '" title="' + escapar(texto) + '" ' +

  const legenda = ['atingiu', 'parcial', 'nao_atingiu', 'nao_trabalhado'].map(function (s) {

      '<span style="width:14px;height:14px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;' +
      'background:' + corStatusConceitoAluno(s) + ';color:' + (s === 'nao_trabalhado' ? 'var(--cinza)' : '#fff') + ';' +
      'border:1px solid ' + (s === 'nao_trabalhado' ? 'var(--linha)' : 'transparent') + '">' + escapar(glifoStatusConceito(s)) + '</span>' + escapar(CONCEITO_STATUS_LABEL_ALUNO[s]) + '</span>';
  }).join('');
  return '<div class="painel">' +
    '<h2>Evolução por conceito</h2>' +
    '<p class="desc">Como foram as últimas aulas, por tema trabalhado — é status, não é intensidade.</p>' +
    (m.insight ? '<p style="font-size:13px;font-weight:600;margin:0 0 12px">' + escapar(m.insight) + '</p>' : '') +
    '<div style="overflow-x:auto"><table style="border-collapse:collapse">' + linhas + '</table></div>' +

    (ui && ui.celulaConceitoSelecionada ? '<p class="aviso-mini" style="margin-top:4px">' + escapar(ui.celulaConceitoSelecionada) + '</p>' : '') +
    '</div>';
}

/* Rótulo neutro pro jogador — "Não atingido" soa como apontar erro; aqui
   é sempre factual, nunca crítico: o que já ficou pronto e o que ainda
   está em construção. */
const NOTA_COR_REL = { sim: '#2E4739', par: '#C9A227', nao: '#67AD2E' };
const NOTA_LABEL_REL = { sim: 'Atingido', par: 'Em andamento', nao: 'Em construção' };

/* Mesma técnica do painel do treinador: sem biblioteca de PDF — abre uma
   aba com HTML limpo e chama a impressão do navegador ("Salvar como PDF"
   em qualquer aparelho, sem precisar de nada além do próprio navegador). */
function exportarRelatorioPDF(d, id) {

    '.sub{color:#6B6461;font-size:13px;margin-bottom:20px}' +
    'h2{font-family:Georgia,serif;font-size:15px;margin:26px 0 8px}' +
    '@media print { .no-print{display:none} }' +
    '</style></head><body>' +
    cabecalhoRelatorioHTML(d.academiaNome) +
    '<h1>Relatório de ciclo</h1>' +
    '<div class="sub">' + escapar(d.nome) + ' · ' + escapar(h.tipo || '') + ' · gerado em ' +
      new Date(h.data).toLocaleDateString('pt-BR') + ' · ' + h.feitas + ' de ' + h.total + ' aulas</div>' +
    (criteriosHtml ? '<h2>Critérios de saída</h2>' + criteriosHtml : '') +
    '<h2>Relatório completo</h2>' + formatarRelatorioHTML(h.texto) +
    '<div class="no-print" style="margin-top:20px;display:flex;gap:10px">' +
    '<button onclick="window.print()" style="padding:10px 16px;font-weight:700;cursor:pointer">Salvar como PDF / Imprimir</button>' +
    '<button onclick="window.close()" style="padding:10px 16px;font-weight:700;cursor:pointer;background:transparent;border:1px solid #14121055">← Voltar à plataforma</button>' +

  );

}

const NOMES_DIA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
function horariosPadrao() {
  const lista = [];
  for (let h = 7; h <= 21; h++) lista.push((h < 10 ? '0' : '') + h + ':00');
  return lista;
}
function todosHorarios(agenda) {
  const set = {};
  horariosPadrao().forEach(function (h) { set[h] = true; });
  Object.keys(agenda || {}).forEach(function (dia) { (agenda[dia] || []).forEach(function (h) { set[h] = true; }); });
  return Object.keys(set).sort();
}

(function(){
  const p = new URLSearchParams(location.search);
  const org = p.get('org'), id = p.get('id'), t = p.get('t');
  const el = document.getElementById('conteudo');
  const INTERVALO = 20000; // atualiza sozinho a cada 20s — o aluno não precisa recarregar a página

  if (!org || !id || !t) {
    el.innerHTML = '<div class="erro">Este link está incompleto. Peça o link certo ao seu treinador.</div>';
    return;
  }

  let ultimoJson = null;
  let ultimoDado = null;

  /* Estado das telinhas de ação — fica fora do innerHTML (que é
     reconstruído a cada atualização), pra abrir um painel ou digitar
     numa caixa de texto não se perder na próxima sincronia automática. */
  const ui = {
    painel: null, // 'cancelar' | 'reagendar' | null
    diaEscolhido: null, horaEscolhida: null,
    mensagem: null, enviando: false,
    relatorioAberto: null, // id do relatório de ciclo aberto na lista, ou null
    semanaAberta: null, // chave "bloco·semana" do bloco de semana expandido no plano compacto
    glossarioAberto: false,
    celulaConceitoSelecionada: null, // texto da última célula do mapa de conceitos tocada (fallback de toque, sem :hover)
    formAberto: null, // 'duvida' | 'jogo' | 'feedback' | null — só um dos três formulários por vez
    rascunhos: { duvida: '', jogo: '', feedback: '' }, // preserva o que foi digitado ao trocar de formulário
    mensagemForm: null, // { tipo, texto, erro }
    enviandoForm: false,
  };

  async function postAcao(corpo) {
    const r = await fetch('/.netlify/functions/ver-aluno', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(Object.assign({ org: org, id: id, t: t }, corpo)),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.erro || ('Erro ' + r.status));
    return d;
  }

  async function carregar(forcarRender) {
    try {
      const r = await fetch('/.netlify/functions/ver-aluno?org=' + encodeURIComponent(org) + '&id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t));
      const d = await r.json();
      if (!r.ok) throw new Error(d.erro || ('Erro ' + r.status));

      const textoJson = JSON.stringify(d);
      const primeiraCarga = ultimoJson === null;
      const mudou = textoJson !== ultimoJson;
      ultimoJson = textoJson;
      ultimoDado = d;
      if (!mudou && !forcarRender) { marcarSincronia(false); return; }

      render(d);
      marcarSincronia(!primeiraCarga);
    } catch (e) {
      el.innerHTML = '<div class="erro">' + escapar(e.message || String(e)) + '</div>';
    }
  }

  /* Ordem pensada pro aluno, não pro treinador: primeiro quem ele é e o
     que busca, depois a próxima aula (a pergunta mais prática), só então
     o progresso do ciclo inteiro, a semana atual em detalhe, o nível no
     método (separado da execução — ver evolucaoFactualHtml) e por fim os
     canais de contato. */
  function render(d) {
    if (!d.temPlano) {
      // sem plano ainda, mas dá pra dizer o que gostaria de trabalhar e
      // mandar feedback — o pedido pode até virar insumo do primeiro plano.
      // planoRascunho: existe um plano, só que ainda não foi revisado e
      // aprovado pelo treinador — o link nunca mostra rascunho, então a
      // mensagem precisa dizer isso, não "ainda não há nada".
      const subtitulo = d.planoRascunho
        ? 'Seu treinador está preparando seu plano — assim que for revisado e aprovado, aparece aqui.'
        : 'Ainda não há um plano montado para você.';
      el.innerHTML = '<header><h1>' + escapar(d.nome) + '</h1><div class="sub">' + subtitulo + '</div></header>' +
        painelMapaConceitos(d, ui) + painelEvolucao(d) + painelRelatorios(d) + painelComunicacao(d) + '<div class="sincronia" id="mty-sincronia"></div>';
      ligarEventos(d);
      return;
    }
    const repetindo = d.aulas.filter(function (a) { return a.status === 'falta' || a.status === 'cancelada'; }).length;
    const pendente = d.totalAulas - d.aulasFeitas - repetindo;
    let html = '';
    html += '<header><h1>' + escapar(d.nome) + '</h1><div class="sub">' + escapar(d.tipoPlano) + '</div></header>';
    if (d.prioridade) html += '<p class="sub">' + escapar(d.prioridade) + '</p>';
    html += painelProximaAula(d);
    html += '<div class="painel"><h2>Progresso do ciclo</h2><div class="rosca-wrap" style="margin-top:0">' + rosquinhaSvg(d.aulasFeitas, pendente, repetindo) +
      '<div>' + legendaRosca(d.aulasFeitas, pendente, repetindo) +
      '<div class="progtxt">' + d.aulasFeitas + ' de ' + d.totalAulas + ' aulas realizadas — isto é execução, não é uma nota sobre sua técnica.</div></div></div></div>';
    html += painelSemanas(d);
    html += painelGlossario(d.aulas);
    html += painelMapaConceitos(d, ui);
    html += painelEvolucao(d);
    html += painelRelatorios(d);
    html += painelComunicacao(d);
    html += '<div class="sincronia" id="mty-sincronia"></div>';
    el.innerHTML = html;
    ligarEventos(d);
  }

  /* Agrupa o plano achatado (d.aulas) de volta em bloco → semana, só pra
     desenhar os blocos compactos — o mesmo dado de sempre, outra forma. */
  function agruparEmSemanas(aulas) {
    const blocos = [];
    let blocoAtual = null, semanaAtual = null, grupoBloco = null, grupoSemana = null;
    aulas.forEach(function (a) {
      if (a.bloco !== blocoAtual) { blocoAtual = a.bloco; semanaAtual = null; grupoBloco = { bloco: a.bloco, semanas: [] }; blocos.push(grupoBloco); }
      if (a.semana !== semanaAtual) { semanaAtual = a.semana; grupoSemana = { semana: a.semana, foco: a.foco, chave: a.bloco + '·' + a.semana, aulas: [] }; grupoBloco.semanas.push(grupoSemana); }
      grupoSemana.aulas.push(a);
    });
    return blocos;
  }

  /* Semana que abre sozinha, sem o aluno precisar escolher: a primeira
     com alguma aula ainda não realizada, ou — se o ciclo inteiro já foi
     dado — a última, pra nunca cair com tudo fechado por padrão. */
  function semanaAtualPadrao(blocos) {
    for (const b of blocos) for (const s of b.semanas) if (s.aulas.some(function (a) { return a.status !== 'feita'; })) return s.chave;
    const ultimoBloco = blocos[blocos.length - 1];
    const ultimaSemana = ultimoBloco && ultimoBloco.semanas[ultimoBloco.semanas.length - 1];
    return ultimaSemana ? ultimaSemana.chave : null;
  }

  const ROTULO_STATUS_AULA = { feita: 'Realizada', falta: 'Falta (será reposta)', cancelada: 'Cancelada (será reposta)' };

  /* Só os termos com definição real já escrita na metodologia (ENSINO_TATICO
     em index.html, duplicado aqui pela mesma razão de sempre — esta página
     roda isolada). Termos sem fonte textual pronta (ex.: "power drill", que
     só existe como código interno PDB/PDR/PDS, nunca como texto) ficam de
     fora — explicar errado é peor que não explicar. */
  const GLOSSARIO = [
    { termo: /trilho fechado/i, rotulo: 'Trilho fechado', explicacao: 'A jogada inteira é combinada: o jogador sabe o que vem e para onde vai, repetindo até a decisão virar automática. É uma fase do aprendizado, não o jogo de verdade — depois dela vêm fases mais livres.' },
    { termo: /semiabert/i, rotulo: 'Semiaberto', explicacao: 'O ponto começa com uma bola alimentada pelo treinador numa situação específica, e a partir daí segue como bola viva, disputada de verdade.' },
  ];
  function termosNoPlano(aulas) {
    const texto = aulas.flatMap(function (a) { return [a.foco, a.titulo]; }).filter(Boolean).join(' · ');
    return GLOSSARIO.filter(function (g) { return g.termo.test(texto); });
  }
  function painelGlossario(aulas) {
    const achados = termosNoPlano(aulas);
    if (!achados.length) return '';
    const aberto = ui.glossarioAberto;
    let html = '<div class="painel"><h2>Termos usados no seu plano</h2>';
    if (!aberto) {
      html += '<button data-acao="abrir-glossario" class="btn fraco">Ver o que esses termos significam</button>';
    } else {
      html += achados.map(function (g) {
        return '<p style="margin:0 0 10px"><b>' + escapar(g.rotulo) + '</b> — ' + escapar(g.explicacao) + '</p>';
      }).join('');
    }
    html += '</div>';
    return html;
  }

  /* Blocos de semana que abrem/fecham — só a semana atual (a da próxima
     aula pendente) começa aberta; as outras ficam resumidas num título +
     contagem, pra não jogar o plano inteiro na tela de uma vez. Estados
     em texto ("Planejada"/"Realizada"), nunca um quadrado sem rótulo —
     isso parecia uma caixa de marcar que o aluno pudesse clicar, quando
     quem decide se a aula foi realizada é sempre o treinador. */
  function painelSemanas(d) {
    const blocos = agruparEmSemanas(d.aulas);
    if (!blocos.length) return '';
    const chaveAtual = semanaAtualPadrao(blocos);
    let html = '<div class="painel"><h2>Seu plano, semana a semana</h2>';
    blocos.forEach(function (b) {
      html += '<div class="bloco">' + escapar(b.bloco) + '</div>';
      b.semanas.forEach(function (s) {
        const realizadas = s.aulas.filter(function (a) { return a.status === 'feita'; }).length;
        // null = ainda não mexeu em nada -> abre só a semana atual por padrão;
        // depois do primeiro clique, ui.semanaAberta vira a fonte da verdade
        // (inclusive '' pra "tudo fechado", quando o aluno fecha a própria atual).
        const estaAberta = ui.semanaAberta === null ? (s.chave === chaveAtual) : (ui.semanaAberta === s.chave);
        html += '<div style="border:1px solid var(--linha);border-radius:4px;margin-bottom:8px;overflow:hidden">';
        html += '<button data-acao="alternar-semana" data-chave="' + escapar(s.chave) + '" style="width:100%;text-align:left;background:#fff;border:none;padding:10px 12px;cursor:pointer;font:inherit;color:inherit">' +
          '<div class="semana" style="margin:0">Semana ' + s.semana + (s.foco ? ' · ' + escapar(s.foco) : '') + '</div>' +
          '<div style="font-size:12.5px;margin-top:3px">' + realizadas + ' de ' + s.aulas.length + ' aulas realizadas' +
          '<span style="float:right;color:var(--cinza)">' + (estaAberta ? '▲' : '▼') + '</span></div></button>';
        if (estaAberta) {
          html += '<div style="padding:0 12px 10px">';
          s.aulas.forEach(function (a) {
            const rot = ROTULO_STATUS_AULA[a.status] || 'Planejada';
            const cor = a.status === 'feita' ? 'var(--verde)' : (a.status === 'falta' || a.status === 'cancelada') ? 'var(--verm)' : 'var(--cinza)';
            html += '<div class="aula' + (a.status === 'feita' ? ' feita' : '') + '" style="margin-bottom:6px">' +
              '<span class="txt">' + escapar(a.titulo) + '</span>' +
              '<span style="font-size:10.5px;font-weight:700;color:' + cor + ';white-space:nowrap">' + rot + '</span>' +
              (a.data ? '<span class="data">' + escapar(a.data) + '</span>' : '') +
              '</div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
    });
    html += '</div>';
    return html;
  }

  /* O relatório de ciclo (h.texto) é escrito pra o treinador — carrega
     critério "não atingido", registro de dor, faltas e observações que
     podem soar como crítica. O jogador não precisa disso pra ter
     feedback: só precisa saber o que foi trabalhado. Esta função lê
     APENAS os blocos de aulas realizadas (as linhas "── BLOCO ──" e os
     temas de cada uma, na mesma convenção de texto de construirRelatorio
     em index.html) e ignora todo o resto — nada de dor, falta ou nota. */
  function resumoFactualCiclo(h) {
    const linhas = String(h.texto || '').split('\n');
    const blocos = [];
    let atual = null;
    linhas.forEach(function (linhaCrua) {
      const linha = linhaCrua.trim();
      const divisorFraco = linha.match(/^─+\s*(.*?)\s*─+$/);
      if (divisorFraco) { atual = { nome: divisorFraco[1], temas: [] }; blocos.push(atual); return; }
      if (!atual) return;
      const m = linha.match(/^Semana\s+\d+\s+·\s+(.+?)\s+·/);
      if (m && m[1]) atual.temas.push(m[1]);
    });
    return blocos.filter(function (b) { return b.temas.length > 0; });
  }

  function evolucaoFactualHtml(h) {
    const blocos = resumoFactualCiclo(h);
    if (!blocos.length) return '';
    return '<div style="margin-top:8px;padding:10px;background:var(--papel);border-radius:4px">' +
      '<div style="font-size:11px;font-weight:700;color:var(--cinza);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px">O que foi trabalhado</div>' +
      blocos.map(function (b) {
        return '<p style="font-size:12.5px;margin:0 0 4px;line-height:1.5"><b>' + escapar(b.nome) + ':</b> ' + b.temas.map(escapar).join(', ') + '</p>';
      }).join('') +
      '</div>';
  }

  function painelRelatorios(d) {
    const historico = d.historicoRelatorios || [];
    if (!historico.length) return '';
    const pontos = historico.slice().reverse().map(function (h) {
      const comCriterios = (h.criterios || []).length > 0;
      const pctCriterios = comCriterios ? Math.round(100 * h.criterios.reduce(function (s, c) {
        return s + (c.resultado === 'sim' ? 1 : c.resultado === 'par' ? 0.5 : 0);
      }, 0) / h.criterios.length) : null;
      const pctAulas = h.total > 0 ? Math.round(100 * (h.feitas / h.total)) : null;
      return { pctCriterios: pctCriterios, pctAulas: pctAulas };
    });
    let html = '<div class="painel">';
    html += '<h2>Seus relatórios de ciclo</h2>';
    html += '<p class="desc">O que seu treinador observou ao fechar cada ciclo de treino.</p>';
    const grafico = graficoEvolucaoSvg(pontos);
    if (grafico) {
      html += '<div style="margin:8px 0">' + grafico + '</div>' +
        '<div style="display:flex;gap:14px;font-size:11.5px;margin-bottom:10px">' +
        '<span><span style="color:var(--verde);font-weight:700">▬</span> Critérios atingidos</span>' +
        '<span><span style="color:var(--tinta);font-weight:700">▬</span> Aulas realizadas</span></div>';
    }
    html += historico.map(function (h) {
      const aberto = ui.relatorioAberto === h.id;
      const criteriosHtml = (h.criterios || []).map(function (c) {
        const cor = NOTA_COR_REL[c.resultado] || 'var(--cinza)';
        const rot = NOTA_LABEL_REL[c.resultado] || 'Não avaliado';
        return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px">' +
          '<span style="width:8px;height:8px;border-radius:999px;background:' + cor + ';flex-shrink:0"></span>' +
          '<span style="flex:1">' + escapar(c.nome) + '</span><span style="font-size:11px;font-weight:700;color:' + cor + '">' + rot + '</span></div>';
      }).join('');
      return '<div style="border-top:1px solid var(--linha);padding:10px 0">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<span style="font-size:12.5px">' + new Date(h.data).toLocaleDateString('pt-BR') + ' · ' + escapar(h.tipo || 'ciclo') + ' · ' + h.feitas + ' de ' + h.total + ' aulas</span>' +
        '<span class="linha-btns" style="margin-top:0">' +
        '<button class="btn fraco" data-acao="alternar-relatorio" data-id="' + h.id + '">' + (aberto ? 'Fechar' : 'Ver detalhes') + '</button>' +
        '<button class="btn fraco" data-acao="exportar-relatorio-pdf" data-id="' + h.id + '">Exportar PDF</button>' +
        '</span></div>' +
        evolucaoFactualHtml(h) +
        (aberto ? '<div style="margin-top:8px">' + criteriosHtml +
          '<pre style="white-space:pre-wrap;font-size:11.5px;background:var(--papel);padding:10px;border-radius:4px;margin-top:8px">' + escapar(h.texto) + '</pre></div>' : '') +
        '</div>';
    }).join('');
    html += '</div>';
    return html;
  }

  /* "Próxima aula" é sempre a pedagogicamente próxima (a primeira ainda
     não realizada do plano) — d.proximaAula é só o horário fixo mais
     próximo, um dado de agenda, não necessariamente desta mesma aula.
     Nunca inventamos um horário: sem data calculada, dizemos isso. */
  function painelProximaAula(d) {
    const pendentes = (d.pedidosReposicao || []).filter(function (p) { return p.status === 'pendente'; });
    let html = '<div class="painel">';
    html += '<h2>Próxima aula</h2>';
    if (!d.aulaEmVigor) {
      html += '<p class="desc">Nenhuma aula pendente no momento — nada para cancelar ou reagendar.</p></div>';
      return html;
    }
    const quando = d.proximaAula ? new Date(d.proximaAula) : null;
    html += '<p class="desc" style="margin-bottom:4px"><b>' + escapar(d.aulaEmVigor.titulo) + '</b></p>';
    html += '<p class="desc" style="margin:0 0 10px">' + escapar(d.aulaEmVigor.bloco) + ' · semana ' + d.aulaEmVigor.semana + '</p>';
    html += '<p class="desc" style="margin:0 0 12px">' +
      (quando
        ? 'Horário: ' + quando.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' }) + ' às ' + quando.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
        : 'Horário ainda não definido — fale com seu treinador para agendar.') +
      '</p>';

    if (pendentes.length > 0) {
      html += '<div class="pedido-pendente">Você já pediu reposição para ' + NOMES_DIA[pendentes[0].diaPreferido] +
        ' ' + escapar(pendentes[0].horaPreferido) + ' — aguardando seu treinador confirmar.</div>';
    } else {
      html += '<div class="linha-btns">' +
        '<button class="btn perigo" data-acao="abrir-cancelar">Cancelar esta aula</button>' +
        '<button class="btn fraco" data-acao="abrir-reagendar">Pedir outro horário</button>' +
        '</div>';
    }

    if (ui.painel === 'cancelar') {
      const horasDeAviso = d.proximaAula ? (new Date(d.proximaAula).getTime() - Date.now()) / 3600000 : null;
      const dentroDoPrazo = horasDeAviso !== null && horasDeAviso >= 24;
      html += '<div class="painel" style="margin-top:10px;background:var(--papel)">' +
        '<p class="desc">Cancelar com pelo menos 24h de antecedência não conta como aula realizada — seu treinador repõe. ' +
        'Com menos de 24h, o horário já está reservado e esta aula é contada como realizada mesmo assim.</p>' +
        (horasDeAviso === null
          ? '<p class="aviso-mini">Sem horário fixo cadastrado — fale com seu treinador para cancelar.</p>'
          : '<p class="aviso-mini" style="color:' + (dentroDoPrazo ? 'var(--verde)' : 'var(--verm)') + ';font-weight:600">' +
            (dentroDoPrazo
              ? 'Ainda dá tempo — faltam ' + Math.round(horasDeAviso) + 'h para sua aula. Cancelar agora NÃO conta como realizada.'
              : 'Faltam só ' + Math.max(0, Math.round(horasDeAviso)) + 'h para sua aula — menos de 24h. Cancelar agora conta como realizada.') +
            '</p>') +
        '<div class="linha-btns">' +
        '<button class="btn perigo" data-acao="confirmar-cancelar" ' + (ui.enviando || horasDeAviso === null ? 'disabled' : '') + '>Confirmar cancelamento</button>' +
        '<button class="btn fraco" data-acao="fechar-painel">Voltar</button>' +
        '</div></div>';
    }
    if (ui.painel === 'reagendar') {
      html += '<div class="painel" style="margin-top:10px;background:var(--papel)">' +
        '<p class="desc">Toque num horário livre da grade abaixo pra sugerir a troca. Isto vira um pedido — seu treinador confirma.</p>' +
        html_gradeAgenda(d.agendaOcupada || {}) +
        '<textarea id="mty-nota-reagendar" rows="2" placeholder="Algo a explicar? (opcional)"></textarea>' +
        '<div class="linha-btns">' +
        '<button class="btn" data-acao="enviar-reagendar" ' + (ui.enviando || ui.diaEscolhido === null ? 'disabled' : '') + '>Enviar pedido</button>' +
        '<button class="btn fraco" data-acao="fechar-painel">Cancelar</button>' +
        '</div></div>';
    }
    if (ui.painel === 'msg-sua-aula' && ui.mensagem) {
      html += '<div class="confirmado">' + escapar(ui.mensagem) + '</div>';
    }
    html += '</div>';
    return html;
  }

  function html_gradeAgenda(agenda) {
    const horas = todosHorarios(agenda);
    let html = '<div class="grade">';
    NOMES_DIA.forEach(function (nome) { html += '<div class="rot">' + nome + '</div>'; });
    horas.forEach(function (hora) {
      for (let dia = 0; dia < 7; dia++) {
        const ocupado = (agenda[dia] || agenda[String(dia)] || []).indexOf(hora) >= 0;
        const selecionado = ui.diaEscolhido === dia && ui.horaEscolhida === hora;
        const classe = ocupado ? 'cel ocupado' : (selecionado ? 'cel sel' : 'cel');
        html += '<div class="' + classe + '" ' + (ocupado ? '' : 'data-acao="escolher-horario" data-dia="' + dia + '" data-hora="' + hora + '"') + '>' +
          (ocupado ? '·' : hora) + '</div>';
      }
    });
    html += '</div>';
    return html;
  }

  /* Os três formulários que já existiam (dúvida/jogo/feedback) viviam
     sempre abertos ao mesmo tempo na tela — três caixas de texto, a
     maioria delas vazia a maior parte do tempo. Agora são três botões;
     só um formulário abre por vez, e o rascunho do que não foi enviado
     sobrevive a trocar de botão (ui.rascunhos), porque fechar um pra
     abrir outro não deveria custar o que a pessoa já tinha escrito. */
  const BOTOES_COMUNICACAO = [
    { tipo: 'duvida', rotulo: 'Sugerir um foco de treino', acaoApi: 'duvida',
      destino: 'Vai para o seu treinador — se ele aprovar, entra no seu próximo planejamento.',
      placeholder: 'Um golpe, uma dúvida, algo que você quer treinar mais...' },
    { tipo: 'jogo', rotulo: 'Relatar um jogo', acaoApi: 'jogo',
      destino: 'Fica disponível para seu treinador consultar — como foi o jogo, o que funcionou, o que não funcionou.',
      placeholder: 'Contra quem, o resultado, o que você notou...' },
    { tipo: 'feedback', rotulo: 'Falar com a coordenação', acaoApi: 'feedback',
      destino: 'Vai direto para o coordenador da academia — seu treinador não vê este campo.',
      placeholder: 'O que você quer contar pro coordenador?' },
  ];
  const ROTULO_STATUS_DUVIDA = { pendente: 'aguardando seu treinador', aprovado: 'aprovado — entrou no planejamento', recusado: 'não aprovado desta vez' };

  function painelComunicacao(d) {
    let html = '<div class="painel"><h2>Fale com a plataforma</h2><p class="desc">Escolha o que você quer fazer — cada um vai para quem precisa ver.</p>';
    html += '<div class="linha-btns">';
    BOTOES_COMUNICACAO.forEach(function (b) {
      html += '<button class="btn fraco" data-acao="abrir-form" data-tipo="' + b.tipo + '">' + b.rotulo + '</button>';
    });
    html += '</div>';

    const atual = BOTOES_COMUNICACAO.find(function (b) { return b.tipo === ui.formAberto; });
    if (atual) {
      const sucesso = ui.mensagemForm && ui.mensagemForm.tipo === atual.tipo && !ui.mensagemForm.erro;
      html += '<div class="painel" style="margin-top:10px;background:var(--papel)">';
      html += '<p class="desc">' + atual.destino + '</p>';
      if (sucesso) {
        html += '<div class="confirmado">' + escapar(ui.mensagemForm.texto) + '</div>';
      } else {
        if (ui.mensagemForm && ui.mensagemForm.tipo === atual.tipo && ui.mensagemForm.erro) {
          html += '<p class="aviso-mini" style="color:var(--verm);font-weight:600">' + escapar(ui.mensagemForm.texto) + '</p>';
        }
        html += '<textarea id="mty-form-texto" rows="3" placeholder="' + escapar(atual.placeholder) + '">' + escapar(ui.rascunhos[atual.tipo] || '') + '</textarea>' +
          '<div class="linha-btns">' +
          '<button class="btn" data-acao="enviar-form" ' + (ui.enviandoForm ? 'disabled' : '') + '>' + (ui.enviandoForm ? 'Enviando…' : 'Enviar') + '</button>' +
          '<button class="btn fraco" data-acao="fechar-form">Fechar</button>' +
          '</div>';
      }
      if (atual.tipo === 'duvida' && (d.pedidosConteudo || []).length) {
        html += d.pedidosConteudo.slice(0, 5).map(function (p) {
          return '<div class="pedido-pendente" style="margin-top:8px">' + escapar(p.texto) +
            '<br><span class="aviso-mini">' + (ROTULO_STATUS_DUVIDA[p.status] || p.status) + '</span></div>';
        }).join('');
      }
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function ligarEventos(d) {
    el.querySelectorAll('[data-acao]').forEach(function (btn) {
      btn.addEventListener('click', function () { onAcao(btn.dataset, d); });
    });
    // grava o rascunho a cada tecla, sem re-renderizar (perderia o foco e o
    // cursor) — é por isso que o texto sobrevive a fechar/trocar de formulário.
    const campoForm = document.getElementById('mty-form-texto');
    if (campoForm && ui.formAberto) {
      campoForm.addEventListener('input', function () { ui.rascunhos[ui.formAberto] = campoForm.value; });
    }
  }

  async function onAcao(dataset, d) {
    const acao = dataset.acao;
    if (acao === 'abrir-cancelar') { ui.painel = 'cancelar'; ui.mensagem = null; render(d); return; }
    if (acao === 'abrir-reagendar') { ui.painel = 'reagendar'; ui.diaEscolhido = null; ui.horaEscolhida = null; ui.mensagem = null; render(d); return; }
    if (acao === 'fechar-painel') { ui.painel = null; render(d); return; }
    if (acao === 'escolher-horario') { ui.diaEscolhido = Number(dataset.dia); ui.horaEscolhida = dataset.hora; render(d); return; }
    if (acao === 'alternar-relatorio') { ui.relatorioAberto = (ui.relatorioAberto === dataset.id) ? null : dataset.id; render(d); return; }
    if (acao === 'exportar-relatorio-pdf') { exportarRelatorioPDF(d, dataset.id); return; }
    if (acao === 'abrir-glossario') { ui.glossarioAberto = true; render(d); return; }
    if (acao === 'tocar-celula-conceito') { ui.celulaConceitoSelecionada = dataset.texto; render(d); return; }
    if (acao === 'alternar-semana') {
      // alterna: se já está aberta (pelo default ou por escolha anterior), fecha; senão abre só essa.
      const blocos = agruparEmSemanas(d.aulas);
      const chaveAtualPadrao = semanaAtualPadrao(blocos);
      const estavaAberta = ui.semanaAberta === null ? dataset.chave === chaveAtualPadrao : ui.semanaAberta === dataset.chave;
      ui.semanaAberta = estavaAberta ? '' : dataset.chave;
      render(d);
      return;
    }

    if (acao === 'confirmar-cancelar') {
      ui.enviando = true; render(d);
      try {
        const resp = await postAcao({ acao: 'cancelar' });
        ui.enviando = false; ui.painel = 'msg-sua-aula'; ui.mensagem = resp.mensagem;
        await carregar(true);
      } catch (e) {
        ui.enviando = false; ui.painel = 'msg-sua-aula'; ui.mensagem = 'Não deu: ' + e.message; render(ultimoDado);
      }
      return;
    }
    if (acao === 'enviar-reagendar') {
      const nota = (document.getElementById('mty-nota-reagendar') || {}).value || '';
      ui.enviando = true; render(d);
      try {
        const resp = await postAcao({ acao: 'reagendar', diaPreferido: ui.diaEscolhido, horaPreferido: ui.horaEscolhida, nota: nota });
        ui.enviando = false; ui.painel = 'msg-sua-aula'; ui.mensagem = resp.mensagem;
        await carregar(true);
      } catch (e) {
        ui.enviando = false; ui.painel = 'msg-sua-aula'; ui.mensagem = 'Não deu: ' + e.message; render(ultimoDado);
      }
      return;
    }
    if (acao === 'abrir-form') { ui.formAberto = dataset.tipo; ui.mensagemForm = null; render(d); return; }
    if (acao === 'fechar-form') { ui.formAberto = null; render(d); return; }
    if (acao === 'enviar-form') {
      if (ui.enviandoForm) return; // trava contra duplo clique / reenvio por falha de rede
      const tipo = ui.formAberto;
      const botao = BOTOES_COMUNICACAO.find(function (b) { return b.tipo === tipo; });
      const texto = (ui.rascunhos[tipo] || '').trim();
      if (!botao || !texto) return;
      ui.enviandoForm = true; ui.mensagemForm = null; render(d);
      try {
        const resp = await postAcao({ acao: botao.acaoApi, texto: texto });
        ui.enviandoForm = false;
        ui.mensagemForm = { tipo: tipo, texto: resp.mensagem || 'Enviado.', erro: false };
        ui.rascunhos[tipo] = ''; // só limpa o rascunho quando o envio realmente deu certo
        await carregar(true);
      } catch (e) {
        // mantém o formulário aberto com o texto digitado — tentar de novo
        // não pode custar reescrever tudo por causa de uma falha de rede.
        ui.enviandoForm = false;
        ui.mensagemForm = { tipo: tipo, texto: 'Não deu: ' + e.message, erro: true };
        render(ultimoDado);
      }
      return;
    }
  }

  function marcarSincronia(destacar) {
    const nota = document.getElementById('mty-sincronia');
    if (!nota) return;
    const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    nota.textContent = 'Atualizado às ' + agora;
    nota.className = 'sincronia' + (destacar ? ' piscando' : '');
    if (destacar) setTimeout(() => { nota.className = 'sincronia'; }, 2500);
  }

  carregar();
  setInterval(carregar, INTERVALO);
})();
</script>
</body>
</html>

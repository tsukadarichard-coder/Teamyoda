<!doctype html>
<html lang="pt-BR">
<head>

<title>QuadraLab Tática · protótipo</title>
<meta name="description" content="Protótipo: o jogador conta onde trava em quadra e aprende, situação por situação, a decidir melhor.">

<style>/* QuadraLab Tática · protótipo (14/11/2026). Azul-noite e âmbar, para não confundir com o roxo do Scout nem o verde do Team Yoda. */
:root {
  --noite: #0E2433; --noite-2: #17384D; --ambar: #F2A93B; --ambar-esc: #A8650A; --ambar-claro: #FDF1DD;
  --tinta: #13202A; --grafite: #55626C; --papel: #F4F6F7; --branco: #FFFFFF; --linha: #DDE3E7;
  --azul: #1F5E8A; --azul-claro: #E5EFF6; --ok: #2F6B3A; --ok-claro: #E7F2E9;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--papel); color: var(--tinta); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.45; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
a { color: var(--azul); }
h1 { font-size: 26px; line-height: 1.15; letter-spacing: -.02em; margin: 6px 0 6px; }
h2 { font-size: 18px; margin: 0 0 8px; letter-spacing: -.01em; }
h3 { font-size: 15.5px; margin: 0 0 4px; }
p { margin: 0 0 10px; }
.topo { position: sticky; top: 0; z-index: 5; background: var(--branco); border-bottom: 1px solid var(--linha); padding-top: env(safe-area-inset-top, 0px); }
.topo-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.marca { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--noite); font-size: 18px; letter-spacing: -.01em; }
.marca b { font-weight: 800; }
.selo-proto { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ambar-esc); background: var(--ambar-claro); border-radius: 999px; padding: 4px 10px; }
main { max-width: 760px; margin: 0 auto; padding: 14px 16px 24px; outline: none; }
.carregando { color: var(--grafite); }
.sub { color: var(--grafite); margin: 0 0 14px; }
.nota { color: var(--grafite); font-size: 13.5px; }
.olho { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--grafite); margin: 0 0 6px; }
.cartao { background: var(--branco); border: 1px solid var(--linha); border-radius: 16px; padding: 16px; margin: 0 0 12px; }
.secao { margin: 18px 0 8px; }
.voltar { margin: 0 0 4px; }
.voltar a { text-decoration: none; font-weight: 700; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.bt { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 10px 16px; border-radius: 12px; border: 1.5px solid var(--linha); background: var(--branco); color: var(--tinta); font: inherit; font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; }
.bt-principal { background: var(--noite); border-color: var(--noite); color: #fff; }
.bt-ambar { background: var(--ambar); border-color: var(--ambar); color: var(--noite); }
.bt-pq { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.bt-texto { border: none; background: none; padding: 6px 0; min-height: 0; color: var(--azul); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 7px 13px; border-radius: 999px; border: 1.5px solid var(--linha); background: var(--branco); color: var(--tinta); font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--noite); border-color: var(--noite); color: #fff; }
.campo { margin: 12px 0 0; }
.campo label, .rot { display: block; font-weight: 700; margin: 0 0 5px; font-size: 14.5px; }
input[type=text], input[type=search], textarea, select { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1.5px solid var(--linha); border-radius: 12px; background: var(--branco); color: var(--tinta); }
textarea { min-height: 76px; resize: vertical; }
input:focus, textarea:focus, select:focus, .bt:focus-visible, .chip:focus-visible, a:focus-visible { outline: 3px solid var(--ambar); outline-offset: 1px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--azul-claro); color: var(--azul); vertical-align: middle; }
.tag.p1 { background: var(--ok-claro); color: var(--ok); }
.tag.p2 { background: var(--azul-claro); color: var(--azul); }
.tag.p3 { background: var(--ambar-claro); color: var(--ambar-esc); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--noite); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14.5px; z-index: 20; max-width: calc(100% - 32px); }

/* menu de baixo */
.abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--branco); border-top: 1px solid var(--linha);
  padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); box-shadow: 0 -6px 20px rgba(14,36,51,.06); }
.abas a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; color: var(--grafite); font-size: 12px; font-weight: 700; border-radius: 12px; text-align: center; }
.abas svg { width: 24px; height: 24px; }
.abas a[aria-current="page"] { color: var(--noite); background: var(--ambar-claro); }

/* início */
.hero { background: linear-gradient(150deg, var(--noite) 0%, var(--noite-2) 100%); color: #fff; border-radius: 20px; padding: 20px 18px; margin: 0 0 12px; position: relative; overflow: hidden; }
.hero h1 { color: #fff; font-size: 25px; }
.hero p { color: #D5E1E8; }
.hero .olho { color: var(--ambar); }
.hero svg.quadra { position: absolute; right: -18px; bottom: -22px; width: 150px; opacity: .18; }
.semana { border-left: 5px solid var(--ambar); }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 12px; }
.num { background: var(--branco); border: 1px solid var(--linha); border-radius: 14px; padding: 12px 10px; text-align: center; }
.num b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; color: var(--noite); }
.num span { font-size: 12px; color: var(--grafite); font-weight: 600; }
.atalhos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
.atalho { display: block; background: var(--branco); border: 1px solid var(--linha); border-radius: 16px; padding: 14px; text-decoration: none; color: var(--tinta); }
.atalho b { display: block; font-size: 15.5px; margin: 6px 0 2px; }
.atalho span { font-size: 13px; color: var(--grafite); }
.atalho .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--ambar-claro); display: grid; place-items: center; color: var(--ambar-esc); font-weight: 800; }

/* manual */
.momentos { display: grid; grid-template-columns: 1fr; gap: 8px; }
.momento { display: flex; align-items: center; gap: 12px; background: var(--branco); border: 1px solid var(--linha); border-radius: 14px; padding: 12px 14px; text-decoration: none; color: var(--tinta); }
.momento .letra { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--noite); color: var(--ambar); font-weight: 800; font-size: 18px; display: grid; place-items: center; }
.momento b { display: block; font-size: 15px; }
.momento span { font-size: 13px; color: var(--grafite); }
.momento .seta { margin-left: auto; color: var(--grafite); font-size: 20px; }
.lista-fichas { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ficha-l { display: block; background: var(--branco); border: 1px solid var(--linha); border-radius: 14px; padding: 12px 14px; text-decoration: none; color: var(--tinta); }
.ficha-l .cod { font-size: 12px; font-weight: 800; color: var(--grafite); letter-spacing: .03em; }
.ficha-l b { display: block; font-size: 15px; margin: 2px 0 4px; }
.ficha-l .vista { color: var(--ok); font-size: 12px; font-weight: 800; }
.bloco { border-top: 1px solid var(--linha); padding-top: 12px; margin-top: 12px; }
.bloco:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
.bloco h3 { display: flex; align-items: center; gap: 8px; }
.bloco h3 i { font-style: normal; width: 26px; height: 26px; border-radius: 8px; background: var(--ambar-claro); color: var(--ambar-esc); display: inline-grid; place-items: center; font-size: 13px; font-weight: 800; flex: none; }
.estados { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.estado { border-radius: 12px; padding: 10px 12px; background: var(--papel); }
.estado b { display: block; font-size: 14px; }
.estado span { font-size: 12.5px; color: var(--grafite); }

/* simulador */
.sim-nav { margin: 0 0 10px; }
.sim-moldura { background: var(--branco); border: 1px solid var(--linha); border-radius: 16px; overflow: hidden; }
.sim-moldura iframe { display: block; width: 100%; height: calc(100vh - 250px); min-height: 520px; border: 0; }

/* plano de jogo */
.passo-n { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--noite); color: #fff; font-size: 12.5px; font-weight: 800; margin-right: 6px; }
.plano-doc .item { border-top: 1px solid var(--linha); padding: 12px 0 2px; }
.plano-doc .item:first-child { border-top: none; padding-top: 0; }
.plano-doc .item p { margin: 0 0 6px; }
.plano-doc .item ul { margin: 0 0 6px; padding-left: 18px; }
.sugestao { background: var(--ambar-claro); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; margin: 6px 0 0; }
.ia { display: flex; gap: 10px; align-items: flex-start; background: var(--azul-claro); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; color: var(--tinta); }
.ia b { color: var(--azul); }
.planos-preco { display: grid; grid-template-columns: 1fr; gap: 10px; }
.planos-preco .cartao ul { margin: 6px 0 0; padding-left: 18px; }
.planos-preco .destaque { border: 2px solid var(--ambar); }

/* trilha do jogador (14/11/2026) */
.hero-pq { padding: 16px 18px; }
.hero-pq h1 { font-size: 22px; }
.bt-grande { min-height: 54px; font-size: 16.5px; padding: 12px 22px; width: 100%; }
.tag.ok { background: var(--ok-claro); color: var(--ok); }
.tag.azul { background: var(--azul-claro); color: var(--azul); }
.probs { display: grid; grid-template-columns: 1fr; gap: 8px; }
.prob { text-align: left; min-height: 48px; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--linha); background: var(--branco); color: var(--tinta); font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; }
.prob[aria-pressed="true"] { border-color: var(--noite); background: var(--noite); color: #fff; }
.barra { display: inline-flex; gap: 3px; vertical-align: middle; }
.barra i { width: 18px; height: 6px; border-radius: 3px; background: var(--linha); }
.barra i.on { background: var(--ambar); }
.trilha { list-style: none; margin: 0; padding: 0; counter-reset: t; }
.trilha li { counter-increment: t; border-top: 1px solid var(--linha); }
.trilha li:first-child { border-top: none; }
.trilha a { display: flex; align-items: center; gap: 10px; padding: 10px 0; text-decoration: none; color: var(--tinta); }
.trilha a::before { content: counter(t); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--papel); color: var(--grafite); font-weight: 800; font-size: 13px; display: grid; place-items: center; }
.trilha a > span:first-of-type { flex: 1; min-width: 0; }
.trilha b { display: block; font-size: 14.5px; margin-bottom: 4px; }
.trilha .tag { flex: none; }
.passos-sit { list-style: none; margin: 0; padding: 0; }
.passos-sit li { display: grid; grid-template-columns: 30px 1fr; grid-template-areas: "bola txt" ". acao"; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--linha); }
.passos-sit li:first-child { border-top: none; }
.passos-sit .bola { grid-area: bola; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--linha); display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--grafite); }
.passos-sit li.ok .bola { background: var(--ok); border-color: var(--ok); color: #fff; }
.passos-sit .txt { grid-area: txt; }
.passos-sit .txt b { display: block; font-size: 15px; }
.passos-sit .txt span { font-size: 13px; color: var(--grafite); }
.passos-sit .acao { grid-area: acao; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
@media (min-width: 520px) { .passos-sit li { grid-template-columns: 30px 1fr auto; grid-template-areas: "bola txt acao"; align-items: center; } }
h1.pergunta { font-size: 21px; line-height: 1.25; }
.opcoes { display: grid; gap: 10px; margin: 12px 0; }
.opcao { text-align: left; padding: 14px; border-radius: 14px; border: 2px solid var(--linha); background: var(--branco); color: var(--tinta); font: inherit; font-size: 15px; line-height: 1.4; cursor: pointer; }
.opcao:disabled { cursor: default; opacity: 1; }
.opcao.certa { border-color: var(--ok); background: var(--ok-claro); }
.opcao.errada { border-color: #B23A2E; background: #FBEAE8; }
.retorno { border-left: 5px solid var(--ambar); }
.retorno.ok { border-left-color: var(--ok); }
.video-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 14px; overflow: hidden; }
.video-box iframe, .video-box #ytPlayer { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grade3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--linha); margin-top: 8px; }
.stepper .st { display: flex; align-items: center; gap: 10px; }
.stepper b { min-width: 24px; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
.contagem { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--linha); font-size: 14.5px; }
.contagem:first-of-type { border-top: none; }
.contagem b { font-variant-numeric: tabular-nums; }
.erro { color: #B23A2E; }
.atalhos-2 { grid-template-columns: 1fr 1fr !important; }
.indice { margin: 0; padding-left: 26px; }
.indice li { padding: 6px 0; border-bottom: 1px solid var(--linha); }
.indice a { text-decoration: none; font-weight: 600; }
.leitura h3 { margin: 14px 0 6px; font-size: 16px; }
.leitura p { line-height: 1.55; }
.tab-wrap { overflow-x: auto; margin: 8px 0 12px; }
.tab-wrap table { border-collapse: collapse; font-size: 13.5px; min-width: 100%; }
.tab-wrap th, .tab-wrap td { border: 1px solid var(--linha); padding: 6px 8px; text-align: left; vertical-align: top; }
.tab-wrap th { background: var(--papel); }
.lista-simples { margin: 0; padding-left: 18px; }
.lista-simples li { margin: 0 0 8px; }

@media (min-width: 620px) {
  .momentos { grid-template-columns: 1fr 1fr; }
  .planos-preco { grid-template-columns: 1fr 1fr; }
  .atalhos { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 360px) { .trio { grid-template-columns: 1fr 1fr; } .estados { grid-template-columns: 1fr; } }
@media print {
  .topo, .abas, .acoes, .voltar, .toast, .nao-imprimir { display: none !important; }
  body { background: #fff; padding: 0; }
  .cartao { border: none; padding: 0; }
}
</style>
</head>

<main id="app" tabindex="-1"><p class="carregando">Carregando…</p></main>
<nav class="abas" id="abas" aria-label="Menu">

<script>/* Situações de jogo do Team Yoda (conteúdo do Richard, 8/11/2026), integradas ao que o app já tem:
   · as 96 situações entram como exercícios das famílias existentes (leitura e defesa em DT, saque e devolução em IP,
     construção no fundo em PDB, transição em AT, rede em PDR, duplas em DP), continuando a numeração de cada uma;
   · o método vira seções das abas Táticas, Condução, Aulas e Como decide, e três princípios a mais nos pedidos de plano.
   Só o app do professor carrega este arquivo. */
(function (raiz) {
  "use strict";
  /* ficha: [código, nome, competência inicial, prioridade, ler, decidir, exercício, variar e observar, indicador] */
  var FICHAS = [
    ["F01","Manter a bola disponível","N0 a N1","P1","Altura, distância e tempo para encontrar a bola em posição confortável.","Enviar com margem para uma região ampla e preparar a próxima ação. Se o contato se perde, reduzir distância ou usar bola mais lenta antes de cobrar direção.","A e B trocam em quadra reduzida; contar trocas cooperativas, depois disputar pontos com os mesmos limites.","Ampliar um pouco o espaço e retirar a meta de trocas.","Bolas jogáveis enviadas e recuperação antes da próxima resposta."],
    ["F02","Reconhecer o espaço livre","N1","P1","Posição de B no momento de preparar e executar o golpe.","Enviar para uma zona acessível que afaste a bola de B. Se a mudança exigir um golpe fora de controle, manter margem e continuar construindo.","Dividir o fundo em duas zonas amplas. B joga e recupera livremente; A escolhe a zona sem aviso do treinador.","B passa a recuperar em velocidades diferentes.","Escolhas de espaço justificadas pela posição de B, e não só pelo resultado."],
    ["F03","Ganhar tempo quando pressionado","N1","P1","Atraso na chegada, pouco equilíbrio ou bola que empurra para trás.","Usar trajetória mais alta e alvo amplo para recuperar organização. Se B já está na rede, avaliar lob ou bola baixa em vez de apenas levantar no meio.","B alterna bolas confortáveis e profundas. A muda a intenção quando sente a pressão; o ponto segue.","Aumentar gradualmente o deslocamento inicial.","Respostas que permitem a A reorganizar-se antes do golpe seguinte."],
    ["F04","Recuperar conforme a bola enviada","N1 a N2","P1","Direção do próprio golpe e possibilidades de resposta de B.","Mover-se para uma posição que cubra respostas plausíveis e reagir ao golpe adversário. Não correr automaticamente ao centro se isso abandonar o espaço mais ameaçado.","A joga cruzado ou ao centro; B responde livremente. Observar a posição de A quando B golpeia.","Liberar mudanças paralelas e comparar a cobertura.","Recuperações adequadas ao golpe anterior, sem comando externo."],
    ["F05","Distinguir bola confortável de oportunidade","N1 a N2","P1","Ter tempo para bater não significa que B esteja pressionado.","Construir com qualidade quando há conforto, mas ainda não existe vantagem clara. Acelerar somente se a combinação de controle e posição oferecer benefício plausível.","B envia bolas confortáveis variando sua posição. A decide entre manutenção e pressão em ponto vivo.","B passa a contra-atacar a bola curta de A.","Ataques forçados e oportunidades aproveitadas, registrados separadamente."],
    ["F06","Reconhecer a bola curta baixa","N1 a N2","P1","Profundidade curta, altura de contato baixa e distância para chegar.","Entrar com controle e usar margem, podendo abordar ou recolocar B em movimento. Se A chega atrasado, evitar buscar winner forte só porque a bola é curta.","B intercala bola curta alta, curta baixa e profunda. A escolhe e joga a continuação.","Retirar a alternância previsível entre tipos de bola.","Escolha compatível com a altura e o equilíbrio no contato."],
    ["F07","Usar altura com intenção","N1 a N2","P1","Tempo necessário para recuperar e altura de contato de B.","Aumentar altura para ganhar tempo ou incomodar B; reduzir quando há controle e intenção de retirar tempo. Não associar toda bola alta à defesa nem toda bola baixa ao ataque.","A e B jogam pontos com duas janelas de trajetória imaginadas sobre a rede, sem obrigação de usá-las.","B muda a distância da linha de fundo.","Efeito da altura sobre tempo de recuperação e posição de B."],
    ["F08","Usar profundidade com intenção","N1 a N2","P1","Posição de B e capacidade de A controlar comprimento.","Buscar profundidade com margem para limitar a entrada de B na quadra. Uma bola profunda lenta pode não pressionar; observar a resposta antes de concluir vantagem.","Marcar uma zona profunda ampla. Jogar pontos e contar entradas de B após bolas curtas de A.","Retirar a zona visual e variar a bola recebida.","Redução de bolas involuntariamente curtas em situações neutras."],
    ["F09","Jogar para o centro funcional","N1 a N2","P1","Ângulos disponíveis para B e condição de equilíbrio de A.","Usar o centro com profundidade para reduzir algumas opções laterais ou neutralizar. Se B domina o centro e ataca com facilidade, variar altura ou direção quando houver controle.","A recebe bolas abertas e escolhe centro ou cruzado. B tenta aproveitar a resposta.","B alterna ficar atrás e entrar na quadra.","Qualidade da neutralização e espaço concedido na resposta seguinte."],
    ["F10","Reconhecer a mudança de estado","N2","P1","O próprio golpe pode transformar defesa em neutralidade ou vantagem em pressão.","Atualizar a intenção após cada resposta, sem manter ataque a qualquer custo. Se a bola de B neutraliza a vantagem, reconstruir antes de procurar nova finalização.","Pontos livres iniciados em vantagem de A; B tenta neutralizar. Depois inverter.","Mudar a situação inicial sem dizer qual jogador está em vantagem.","Mudanças adequadas de intenção após a resposta adversária."],
    ["F11","Escolher margem e alvo","N1 a N2","P1","Controle disponível, distância da rede e tamanho do alvo executável.","Preferir um alvo interno coerente com a intenção e com a própria dispersão. Não exigir linha para demonstrar coragem; não ampliar tanto o alvo que a bola fique sem função.","Usar duas zonas internas amplas e pontos vivos. Registrar erros por excesso de precisão exigida.","Reduzir o alvo apenas quando a tarefa continuar representativa.","Acerto da intenção com margem, além do simples acerto do cone."],
    ["F12","Criar e revisar uma intenção","N1 a N3","P1","Uma característica observada de B e uma solução disponível a A.","Escolher uma hipótese simples para um bloco de pontos e verificar respostas. Abandonar a hipótese se a situação não permite executá-la ou a evidência não a sustenta.","A diz uma intenção antes de quatro a seis pontos; depois descreve dois exemplos do que aconteceu.","Testar a mesma hipótese contra outro adversário.","Ajustes apoiados em observação, sem depender apenas do placar."],
    ["S01","Iniciar o ponto com intenção","N1","P1","Alvo grande, posição do devolvedor e capacidade atual de saque.","Colocar o saque em jogo e preparar a resposta seguinte. Se o saque impede toda troca, aproximar a linha ou usar saque adaptado na tarefa de aprendizagem.","Saque, devolução e ponto completo em espaço adequado. Alternar lados e papéis.","Ampliar distância sem perder a preparação da terceira bola.","Saques em jogo com A pronto para a devolução."],
    ["S02","Saque aberto e espaço disponível","N2","P2","Deslocamento real de B e qualidade da devolução.","Explorar o espaço aberto com a primeira bola quando houver controle. Se B recupera cedo ou devolve profundo, jogar atrás dele ou reconstruir conforme a bola.","A busca saque aberto; B devolve e recupera livremente. A não tem direção obrigatória na terceira bola.","Adicionar saques ao centro para impedir leitura antecipada.","Terceiras bolas escolhidas pela devolução e recuperação de B."],
    ["S03","Saque ao T e resposta central","N2","P2","B deslocado para fora e espaço disponível na região central do saque.","Usar o T para reduzir ângulo de devolução ou surpreender; ler a bola seguinte. Não presumir que todo saque ao T gera devolução curta ou central.","Alternar saque ao T e aberto. B pode bloquear ou direcionar; jogar o ponto.","B muda sua posição antes do saque.","Ajuste do primeiro deslocamento de A à devolução real."],
    ["S04","Saque ao corpo funcional","N2","P2","Posição e espaço de preparação do devolvedor.","Buscar uma trajetória que reduza o espaço de golpe de B, dentro da área legal. B pode se afastar e atacar; evitar repetir sem observar essa adaptação.","A varia alvo entre região de B e zonas laterais. B escolhe como criar espaço para devolver.","B altera a distância da linha de fundo.","Respostas pressionadas produzidas, sem confundir saque dentro com sucesso tático."],
    ["S05","Segundo saque e continuidade","N1 a N2","P1","Margem disponível e comportamento de B ao atacar o segundo saque.","Executar segundo saque controlável e preparar uma primeira bola de construção ou defesa. Não tratar segundo saque apenas como bola sem intenção; não exigir efeito ainda indisponível.","Jogar pontos começando pelo segundo saque, com alvo amplo. Retomar depois games com dois saques.","B alterna posição ofensiva e recuada.","Duplas faltas no jogo normal e qualidade da resposta à devolução."],
    ["S06","Saque com efeito para deslocar","N2 a N3","P3","Trajetória, quique e lado do golpe de B que fica mais exposto.","Usar slice ou kick já disponíveis para modificar o contato do devolvedor. Não deduzir o lado fraco apenas por B ser destro ou canhoto; observar sua resposta.","A testa dois efeitos ou trajetórias possíveis e joga a terceira bola livre.","Comparar lados iguais e vantagem, registrando o golpe recebido por B.","Mudanças no contato de B e na bola oferecida a A."],
    ["S07","Saque e forehand de construção","N2","P2","Tempo para usar forehand sem abandonar excessivamente a cobertura.","Buscar uma primeira bola de forehand que crie vantagem com margem. Se contornar expõe toda a quadra ou exige contato atrasado, usar backhand ou neutralizar.","A saca buscando uma devolução provável; B pode mudar direção. A decide se contorna.","Aumentar a variedade de devoluções e retirar alvo de saque obrigatório.","Contornos funcionais e bolas cedidas por cobertura insuficiente."],
    ["S08","Saque e primeira bola de backhand","N2","P2","Devolução ao backhand e tempo para organizar contato.","Construir ou pressionar com o backhand disponível em vez de fugir automaticamente. Contornar só se houver tempo, equilíbrio e cobertura compatíveis.","B devolve parte das bolas ao backhand; A joga a continuação sem direção obrigatória.","B passa a alternar profundidade e direção sem combinação.","Qualidade da terceira bola quando A não consegue usar forehand."],
    ["S09","Saque e aproximação à rede","N2 a N3","P3","Qualidade do saque, trajetória da devolução e tempo para avançar.","Avançar quando o saque e a resposta favorecem uma primeira bola de rede controlável. Se a devolução chega baixa ou muito rápida, aceitar voleio de construção; a entrada não garante winner.","A escolhe subir em alguns saques. B pode passar ou lobar; jogar até o fim.","Alternar subida anunciada e livre, depois retirar o aviso.","Primeiro voleio, cobertura e decisão de continuar avançando."],
    ["S10","Resposta curta após o saque","N2","P2","Profundidade, altura e deslocamento exigido pela devolução curta.","Entrar e escolher ataque, abordagem ou controle conforme a altura do contato. Se a bola é baixa e A chega tarde, não buscar potência como resposta automática.","B alterna devolução curta e profunda; A decide e continua o ponto.","Introduzir devolução curta cruzada e central.","Reconhecimento da altura antes da escolha na terceira bola."],
    ["S11","Defender a devolução agressiva","N2","P1","Devolução que tira tempo ou coloca A fora de equilíbrio.","Neutralizar com alvo amplo e recuperar organização após sacar. Evitar insistir no plano ofensivo apenas porque o ponto começou com seu saque.","B pode atacar qualquer saque acessível. A procura uma resposta defensiva funcional e segue.","Variar primeiro e segundo saque e a posição de B.","Terceiras bolas defensivas que mantêm A competitivo no ponto."],
    ["S12","Variar o saque com propósito","N2 a N3","P2","Padrões de posicionamento e resposta observados em B.","Escolher entre destinos e trajetórias para testar uma hipótese e evitar previsibilidade fácil. Não trocar tudo aleatoriamente nem repetir um alvo só porque venceu o último ponto.","Jogar games; A registra intenção antes do game e revê ao final.","B recebe liberdade para antecipar padrões e ajustar posição.","Coerência entre intenção, adaptação de B e próximo plano."],
    ["R01","Devolver para começar a jogar","N1","P1","Trajetória do saque, distância e tempo de reação disponíveis.","Usar alvo amplo e devolver com controle para entrar no ponto. Se não há participação, adaptar saque e bola antes de acrescentar alvos estreitos.","Saque possível para o nível, devolução e ponto completo. Alternar funções frequentemente.","Aumentar gradualmente variedade e distância de saque.","Devoluções em jogo e prontidão para a bola seguinte."],
    ["R02","Bloquear primeiro saque rápido","N2","P1","Pouco tempo e velocidade suficiente da bola recebida.","Reduzir exigência de preparação e usar margem para neutralizar. Se o saque é mais lento e permite controle, explorar direção em vez de bloquear por hábito.","B alterna primeiro saque mais rápido e saque controlado; A escolhe a resposta.","B varia destinos sem aviso.","Devoluções neutralizadas e escolhas compatíveis com tempo disponível."],
    ["R03","Responder ao saque aberto","N1 a N2","P1","Deslocamento para fora e espaço deixado na quadra.","Devolver com margem e recuperar conforme a trajetória enviada. Buscar paralela só se houver controle e benefício; o cruzado também pode abrir ângulo para B.","B saca aberto e ao T. A devolve e joga o ponto, sem destino fixo.","Variar efeito e profundidade do saque.","Qualidade da devolução e recuperação após sair da quadra."],
    ["R04","Responder ao saque ao T","N1 a N2","P1","Bola que exige deslocamento para dentro e leitura do golpe possível.","Criar espaço para contato e enviar uma resposta controlável. Não decidir forehand ou backhand antecipadamente se a trajetória muda a solução.","B alterna T e corpo; A devolve a uma zona ampla e prepara a quarta bola.","Acrescentar saque aberto e variar posição inicial.","Contato organizado sem perder a continuação do ponto."],
    ["R05","Responder ao saque ao corpo","N2","P2","Trajetória que restringe espaço para preparar o golpe.","Ajustar posição para criar uma solução de forehand ou backhand viável. Evitar prescrever um único golpe para todas as alturas e efeitos.","B varia corpo e lateral. A escolhe a resposta possível e joga a continuação.","Variar altura do quique e distância de recepção.","Redução de devoluções comprometidas por falta de espaço."],
    ["R06","Atacar segundo saque acessível","N2","P2","Tempo, equilíbrio e segundo saque que permite contato favorável.","Entrar ou tomar a bola cedo para pressionar com alvo interno. Se o efeito ou o quique tiram controle, manter construção; segundo saque não obriga ataque.","B joga segundos saques variados. A escolhe atacar ou construir e continua.","B alterna saques que sobem e que ficam mais baixos.","Ataques adequados versus ataques forçados na devolução."],
    ["R07","Devolver alto e profundo","N1 a N2","P1","Necessidade de tempo e sacador que permanece no fundo.","Usar altura e profundidade para reduzir a vantagem inicial de B. Se B avança à rede, ajustar para lob útil ou resposta baixa; uma bola alta curta facilita o voleio.","B pode permanecer ou avançar após sacar. A lê e escolhe a trajetória.","Retirar o aviso sobre a intenção de B.","Efeito da devolução sobre a primeira bola do sacador."],
    ["R08","Devolver baixo contra subida","N2","P2","Sacador avançando e janela para jogar abaixo de sua altura de voleio confortável.","Buscar bola baixa com margem para dificultar o primeiro voleio. Se A está muito atrasado ou B fecha demais, considerar lob em vez de forçar os pés.","B alterna saque e subida com saque e fundo. A joga o ponto completo.","Permitir a B variar a velocidade de aproximação.","Primeiro voleio de B pressionado e resposta seguinte de A."],
    ["R09","Lob na devolução","N2 a N3","P3","Adversário próximo à rede e espaço atrás, com contato que permite elevar a bola.","Usar lob para superar ou recuar B, preparando a cobertura da resposta. Se o lob fica curto repetidamente, simplificar a bola recebida e não insistir só por regra.","B saca e sobe; A pode devolver baixo, passar ou lobar.","B varia proximidade da rede e não sobe em todos os pontos.","Lobs escolhidos por posição, com profundidade funcional."],
    ["R10","Escolher posição de recepção","N2 a N3","P2","Velocidade, efeito, quique e destinos que B realmente usa.","Testar posição mais próxima ou recuada para melhorar tempo e contato. A posição precisa permitir cobrir alternativas; antecipar uma tendência não é adivinhar sempre.","Jogar pequenos blocos em duas posições e comparar controle e opções de B.","B passa a alterar alvo quando percebe a mudança.","Qualidade da devolução e capacidade de cobrir variação."],
    ["R11","Devolução e bola seguinte","N1 a N2","P1","Qualidade da própria devolução e resposta provável do sacador.","Recuperar para a quarta bola com intenção coerente: defender, construir ou pressionar. Não permanecer assistindo à devolução nem assumir vantagem só por devolver fundo.","Pontos completos; o observador avalia especificamente a recuperação após devolver.","B varia a terceira bola e A precisa atualizar o plano.","Prontidão e qualidade da quarta bola em diferentes devoluções."],
    ["R12","Quebrar uma rotina do sacador","N2 a N3","P3","Sequências repetidas de saque e terceira bola observadas em mais de um ponto.","Alterar posição ou destino de devolução para testar uma resposta diferente de B. Evitar concluir padrão com amostra mínima; manter alternativa se B mudar.","Jogar games com hipótese prévia de A e revisão entre games.","Trocar o sacador e verificar se a hipótese continua útil.","Mudança de plano baseada em evidência do confronto."],
    ["C01","Sustentar a diagonal com intenção","N1 a N2","P1","Tempo, profundidade recebida e posição de B na diagonal.","Manter cruzado com margem, procurando qualidade que dificulte a resposta. Não prolongar a diagonal por obrigação quando surge oportunidade clara em outro espaço.","Começar cruzado; qualquer jogador pode mudar quando julgar adequado e liberar a quadra.","Retirar a regra de início cruzado no teste final.","Qualidade da construção e motivo da mudança de direção."],
    ["C02","Pressionar com profundidade","N1 a N2","P1","B tentando entrar na quadra ou recebendo bolas curtas frequentes.","Buscar profundidade controlável para limitar a iniciativa de B. Se a profundidade só vem com excesso de risco, aumentar altura ou reduzir velocidade.","Pontos com zona profunda de referência, sem obrigação de acertá-la em toda bola.","B alterna jogar recuado e sobre a linha.","Bolas curtas cedidas e posição de contato de B."],
    ["C03","Pressionar com altura e efeito","N2","P2","Altura de contato menos confortável para B e tempo de A para produzir a trajetória.","Usar bola mais alta e com efeito disponível para provocar resposta menos favorável. Se B toma cedo ou ataca a bola, mudar profundidade, direção ou trajetória.","A testa altura para um lado de B; B pode antecipar ou recuar e contra-atacar.","Comparar respostas em lados e alturas diferentes.","Respostas realmente pressionadas, sem presumir fraqueza por estilo."],
    ["C04","Mudar paralelo com controle","N2","P2","Contato equilibrado, bola manejável e espaço ou deslocamento favorável de B.","Mudar direção com alvo interno e reorganizar a cobertura. Se A está atrasado ou fora da quadra, manter ou neutralizar pode ser melhor.","Troca cruzada viva, paralela livre e continuação do ponto.","Variar profundidade recebida e velocidade de recuperação de B.","Mudanças oportunas e primeira resposta de A após mudar."],
    ["C05","Abrir a quadra e explorar","N2","P2","B deslocado pela bola aberta e oportunidade no golpe seguinte.","Criar ângulo e depois escolher espaço livre, bola atrás ou continuidade. Se a bola aberta ofereceu contra-ângulo a B, defender antes de buscar a segunda ação.","Pontos começando na diagonal; A tenta deslocar B sem sequência obrigatória de duas direções.","B pode recuperar cedo ou devolver atrás de A.","Aproveitamento condicionado à resposta, sem completar padrão às cegas."],
    ["C06","Jogar atrás de quem recupera","N2 a N3","P3","Movimento de recuperação de B e capacidade de A controlar direção.","Enviar para a região que B está abandonando quando a mudança de movimento o pressiona. Se B já parou ou A perdeu tempo, usar outra zona com margem.","B recupera de modos diferentes após bola aberta; A escolhe livremente.","Introduzir recuperação parcial e paradas de B.","Escolhas ligadas ao movimento observado, e não apenas à posição."],
    ["C07","Contornar para forehand cruzado","N2","P2","Tempo para contornar sem contato atrasado e sem expor cobertura excessiva.","Usar forehand invertido cruzado para construir ou pressionar. Se não há tempo, usar backhand disponível; contornar não é objetivo em si.","A recebe bolas no lado do backhand com profundidade variável e decide o golpe.","B pode explorar a quadra aberta após o contorno.","Benefício criado em relação ao espaço abandonado."],
    ["C08","Contornar para forehand paralelo","N2 a N3","P3","B protegendo a diagonal e bola que permite direção paralela controlada.","Explorar a paralela após contorno, preparando resposta cruzada de B. Se a janela é pequena ou A fica desequilibrado, preferir cruzado ou backhand.","B alterna cobertura; A escolhe forehand invertido cruzado, paralelo ou backhand.","Retirar toda indicação de posicionamento de B.","Adequação da escolha e cobertura após o golpe."],
    ["C09","Usar slice como mudança funcional","N2","P2","Bola recebida e posição de B que tornam útil variar altura e ritmo.","Usar slice disponível para baixar o contato, recuperar tempo ou preparar transição. Não assumir que todo slice é defensivo; avaliar se ele ficou curto e atacável.","A pode alternar topspin e slice em ponto vivo; B tenta aproveitar a mudança.","B muda sua distância da linha.","Efeito da mudança sobre contato e iniciativa de B."],
    ["C10","Tomar a bola mais cedo","N2 a N3","P3","Equilíbrio e tempo suficientes para interceptar sem recuar excessivamente.","Reduzir o tempo de B com contato antecipado e alvo controlável. Se a antecipação elimina controle, aceitar mais tempo e reconstruir.","B alterna bolas profundas de alturas diferentes. A escolhe interceptar ou recuar.","Aumentar incerteza sobre altura e direção.","Pressão produzida sem aumento desproporcional de erros de escolha."],
    ["C11","Variar ritmo sem perder intenção","N2","P2","B confortável com uma velocidade repetida e possibilidade de A variar a trajetória.","Alterar velocidade, altura ou efeito para modificar tempo e contato de B. Variar por variar pode entregar bola fácil; manter margem e objetivo observável.","A joga um bloco com hipótese de mudança de ritmo; B reage livremente.","B tenta antecipar a mudança e entrar na quadra.","Mudança útil no comportamento de B e qualidade da bola seguinte."],
    ["C12","Neutralizar e reconstruir","N1 a N2","P1","Vantagem de B reduzida por uma boa resposta de A.","Voltar à construção em vez de procurar winner imediatamente após defender. Se B continua pressionando, permanecer em defesa até surgir condição real.","B inicia com vantagem moderada. A tenta neutralizar e depois disputar livremente.","Inverter os papéis e variar origem da vantagem.","Reconhecimento de quando a defesa terminou e a construção começou."],
    ["T01","Atacar a bola curta alta","N1 a N2","P1","Contato confortável à frente e posição de B que oferece espaço útil.","Entrar com equilíbrio e pressionar um alvo interno; seguir a resposta. Se a bola cai abaixo da zona confortável antes da chegada, reduzir a exigência de finalização.","B alterna curta alta e profunda. A escolhe entrar ou construir, sem aviso.","B varia posição após enviar a bola curta.","Entradas oportunas e escolhas com margem, não apenas winners."],
    ["T02","Abordar a bola curta baixa","N2","P2","Bola abaixo da rede ou contato baixo, com tempo para aproximação.","Usar trajetória controlada e preparar o primeiro voleio. Se A chega muito atrasado, manter o ponto pode ser melhor que subir sem equilíbrio.","B intercala curta baixa e bola neutra. A decide abordagem ou continuidade.","B pode passar ou lobar após a entrada.","Qualidade da abordagem e organização antes do primeiro voleio."],
    ["T03","Escolher abordagem paralela","N2","P2","Posição de B, alvo disponível e cobertura possível após a aproximação.","Testar abordagem paralela e deslocar-se para cobrir respostas prováveis. A paralela não é obrigatória; se B a antecipa ou o contato não permite, usar outra solução.","A recebe bola de aproximação variável; B tenta responder livremente.","Permitir abordagens cruzadas e centrais no mesmo exercício.","Relação entre direção da abordagem, recuperação e resposta de B."],
    ["T04","Escolher abordagem cruzada","N2 a N3","P3","B fora de posição e espaço cruzado que pode ser explorado com controle.","Abordar cruzado quando o benefício supera o ângulo que pode ser oferecido. Se B está equilibrado e alcança bem, considerar paralela ou centro.","A entra em bola curta; B alterna posição inicial e pode usar a paralela.","Retirar posição combinada e iniciar em troca viva.","Escolha de direção e cobertura do espaço aberto."],
    ["T05","Abordar pelo centro","N2","P2","B com boas passagens anguladas e A capaz de enviar bola profunda central.","Reduzir ângulos disponíveis e preparar o voleio seguinte. Uma bola central curta e alta pode facilitar o ataque; avaliar qualidade real.","Pontos de aproximação com três destinos livres; comparar respostas de B.","B varia a posição de contato e usa lob quando possível.","Primeiro voleio recebido e controle dos ângulos adversários."],
    ["T06","Decidir subir ou permanecer","N1 a N2","P1","Qualidade do próprio ataque e tempo para ocupar posição de rede útil.","Avançar quando a resposta provável e o deslocamento favorecem continuidade. Não subir apenas porque bateu dentro da quadra; uma resposta neutralizante pode pedir reorganização.","A recebe bola curta e escolhe avançar ou ficar; B responde livremente.","Variar altura da bola curta e qualidade da abordagem.","Entradas justificadas e capacidade de interromper avanço quando necessário."],
    ["T07","Acompanhar pressão sem subida obrigatória","N2","P2","B recuado ou deslocado, mas sem garantia de bola para voleio.","Ganhar posição de quadra gradualmente, preparado para a resposta. Se B recupera profundidade, ajustar a distância e evitar ficar preso avançando.","A constrói pressão no fundo e pode ocupar espaço à frente conforme a resposta.","B alterna defesa alta e contra-ataque profundo.","Posição de A compatível com a qualidade de sua bola."],
    ["T08","Executar deixada com contexto","N2 a N3","P3","B recuado, A equilibrado e contato que permite controle fino.","Usar deixada para explorar distância e preparar resposta curta. Se A está atrasado, muito longe ou sem domínio do toque, preferir outra construção.","B joga ora recuado, ora próximo. A escolhe entre profundidade e deixada.","B pode antecipar a deixada após reconhecer repetição.","Deixadas escolhidas pela distância e controle, além da execução."],
    ["T09","Responder à deixada","N1 a N2","P2","Quique curto, altura restante e posição de B.","Chegar e escolher recolocar, contra-deixada, abordagem ou lob disponível. Se chega abaixo da rede e tarde, priorizar controle antes de tentar encerrar.","B intercala deixada e bola profunda sem aviso. A responde e o ponto continua.","B muda posição depois de executar a deixada.","Escolha compatível com chegada e posição do adversário."],
    ["T10","Deixada e cobertura da resposta","N2 a N3","P3","Qualidade da deixada e trajetórias possíveis da resposta de B.","Acompanhar a jogada e cobrir resposta curta ou lob conforme o efeito obtido. Não invadir a rede automaticamente se a deixada ficou alta e B chega confortável.","A escolhe deixada durante ponto vivo; B tem todas as respostas disponíveis.","B alterna contra-deixada e bola profunda.","Reação de A à qualidade real da deixada."],
    ["T11","Bola curta angulada","N2","P2","Bola lateral curta e equilíbrio para jogar com ângulo ou profundidade.","Escolher alvo que mantenha pressão sem perder cobertura. Aumentar o ângulo pode abrir contra-ângulo; se o contato é difícil, usar alvo mais amplo.","B envia curta lateral misturada a bola profunda; A decide e joga a sequência.","B varia a recuperação para dentro ou para trás.","Benefício do ângulo e prontidão para a resposta seguinte."],
    ["T12","Recuar e reorganizar após transição frustrada","N2","P2","B recuperou vantagem ou lançou lob que impede uma posição ofensiva confortável.","Reorganizar com segurança e recuperar uma posição jogável. Evitar continuar avançando por compromisso com a jogada inicial; não recuar de costas em corrida cega.","A começa avançando após bola moderada; B pode neutralizar, passar ou lobar.","Variar qualidade inicial da abordagem.","Mudança de plano e recuperação funcional após perder a vantagem."],
    ["N01","Primeiro voleio de construção","N1 a N2","P2","Altura do contato, distância da rede e equilíbrio após avançar.","Usar alvo amplo e profundidade para organizar a próxima bola. Primeiro voleio baixo ou distante da rede pode exigir construção, não finalização.","A aproxima, B devolve baixo ou confortável, e o ponto segue.","B varia direção e altura sem aviso.","Escolha de construção quando a bola não permite encerrar."],
    ["N02","Voleio baixo","N2","P2","Contato abaixo do topo da rede e pouco ângulo útil.","Colocar a bola com margem, preferindo uma solução que dificulte a resposta de B. Não tentar aceleração excessiva que exige uma trajetória inviável.","A começa em posição de transição; B alterna bola nos pés e bola mais alta.","A precisa chegar à posição a partir de abordagem real.","Bolas jogáveis e posição de A após o voleio baixo."],
    ["N03","Voleio alto para finalizar","N1 a N2","P2","Contato confortável, controle e espaço disponível.","Finalizar com alvo acessível e direção coerente com B. Se a bola chega rápida ou A está esticado, controlar em vez de assumir finalização.","B alterna voleios altos confortáveis e bolas difíceis. A escolhe intensidade e direção.","B pode mudar a posição antes do contato.","Finalizações com margem e identificação de bolas não finalizáveis."],
    ["N04","Voleio atrás do adversário","N2 a N3","P3","B se deslocando para cobrir o espaço aberto e A com controle de direção.","Jogar na região abandonada quando isso dificulta a mudança de B. Se B para ou A golpeia atrasado, usar alvo mais amplo.","B recupera após uma passagem; A decide voleio no espaço ou atrás.","B varia a recuperação sem combinar.","Leitura do movimento antes da escolha de direção."],
    ["N05","Fechar a rede após vantagem","N2","P2","Qualidade do próprio voleio e limitação da resposta seguinte de B.","Aproximar para reduzir opções quando a bola realmente pressiona B. Se o voleio ficou neutro ou curto, manter cobertura de lob e passagem.","Sequência de abordagem, primeiro voleio e continuação livre.","B pode alternar lob e passagem em qualquer momento.","Avanço proporcional ao efeito da bola enviada."],
    ["N06","Interceptar sem invadir a bola errada","N2","P2","Trajetória alcançável com equilíbrio e espaço que ficará exposto.","Interceptar a bola quando o ganho de tempo e posição favorece A. Se exige extensão sem controle e abre a quadra, recuperar em vez de perseguir.","B alterna bolas acessíveis e mais afastadas; A escolhe interceptar ou deixar quicar quando possível.","Começar em ponto vivo para retirar posição fixa.","Interceptações úteis versus tentativas que comprometem a cobertura."],
    ["N07","Ler passagem ou lob","N2","P2","Preparação e trajetória inicial de B, além da distância da rede.","Preparar reação sem abandonar cedo demais uma das respostas. Não adivinhar só pela posição da raquete; atualizar com o voo da bola.","B escolhe passagem ou lob após abordagem. A ajusta posição e responde.","Variar o momento e a qualidade da aproximação.","Capacidade de cobrir alternativas sem antecipação rígida."],
    ["N08","Smash de controle","N1 a N2","P2","Altura, profundidade do lob e equilíbrio para golpear.","Usar alvo amplo e reorganizar-se; potência máxima não é requisito. Se o lob passa e não há golpe seguro, deixar quicar ou recuperar outra solução.","B alterna lobs confortáveis e profundos; A decide smash, quique ou recuperação.","Iniciar o lob após troca real de rede.","Decisão segura de interceptação e qualidade do alvo."],
    ["N09","Smash após quique","N2","P2","Lob alto que permite organizar deslocamento e contato após o quique.","Usar o quique quando ele melhora a possibilidade de controle. Não esperar por regra se isso entrega posição; considerar velocidade e superfície.","B envia lobs variados e A escolhe golpear no ar ou após quique.","B pode recuperar para diferentes regiões enquanto a bola sobe.","Escolha do momento e manutenção da vantagem."],
    ["N10","Voleio curto com intenção","N2 a N3","P3","B recuado e bola que permite controle fino à frente.","Explorar espaço curto com toque disponível, cobrindo a resposta. Se B está perto ou A só consegue bloquear sem precisão, preferir profundidade.","B alterna posição recuada e avançada; A decide voleio curto ou profundo.","Variar a velocidade da bola recebida.","Toques curtos usados em contexto favorável, sem obrigação de efeito."],
    ["N11","Responder à bola no corpo na rede","N2","P2","Pouco espaço de preparação e bola próxima ao tronco.","Criar espaço possível e escolher uma resposta compacta com margem. Evitar trocar de golpe tardiamente por regra fixa; a solução depende da trajetória.","B varia destinos seguros ao redor da zona de voleio em ritmo compatível; A joga a sequência.","A chega à rede a partir de abordagem em vez de começar parado.","Respostas controladas e prontidão para a bola seguinte."],
    ["N12","Recuperar uma finalização que voltou","N1 a N2","P1","B alcançou a bola que A esperava encerrar.","Continuar preparado e atualizar a intenção pela qualidade da resposta. Não parar depois de um golpe aparentemente vencedor nem atacar qualquer retorno.","Pontos em que A começa com vantagem; B tenta devolver mais uma bola e continuar.","Retirar a bola facilitada inicial.","Reação de A à defesa de B e manutenção do ponto."],
    ["D01","Defender bola profunda central","N1","P1","Bola que limita preparação e afasta A da posição desejada.","Criar espaço de contato e devolver com margem para recuperar organização. Se consegue tomar cedo com controle, essa também é uma alternativa; não impor recuo automático.","B alterna profundidade central e bola neutra. A escolhe ajuste e responde.","Variar altura e velocidade sem aumentar tudo ao mesmo tempo.","Neutralizações e retorno a uma posição funcional."],
    ["D02","Defender bola aberta","N1 a N2","P1","Deslocamento lateral, equilíbrio no contato e distância de recuperação.","Usar altura, profundidade ou alvo central para ganhar tempo conforme a situação. Uma bola cruzada pode oferecer mais margem, mas também abrir novo ângulo; observar B.","B alterna bola aberta e central, A responde e continua o ponto.","B ganha liberdade para atacar a resposta curta.","Tempo recuperado e qualidade da cobertura de A."],
    ["D03","Defender bola alta no backhand","N1 a N2","P1","Altura acima da zona confortável e tempo disponível.","Escolher recuar, tomar antes ou variar a resposta conforme habilidade real. Contornar para forehand só se houver tempo e cobertura; não tratar backhand como fraqueza presumida.","B alterna bolas altas e neutras ao lado do backhand.","B pode mudar direção após identificar o ajuste de A.","Escolha executável e qualidade da bola de neutralização."],
    ["D04","Defender bola baixa e rápida","N2","P2","Contato baixo, pouco tempo e dificuldade para elevar a trajetória.","Usar solução controlada com margem sobre a rede e alvo acessível. Não acelerar só para devolver a velocidade; se há tempo, reconstruir com mais altura.","B varia slice baixo e bola com quique mais alto; A lê e ajusta.","Iniciar com deslocamento moderado em vez de posição estática.","Respostas adequadas à altura e tempo, não ao golpe preferido."],
    ["D05","Lob defensivo","N1 a N2","P2","B próximo à rede e A sem condição de passagem controlada.","Buscar altura e profundidade para superar ou obrigar B a recuar. Lob curto pode facilitar smash; se A tem bola baixa viável, essa pode ser melhor.","B aproxima e A escolhe lob ou passagem conforme a bola recebida.","B varia proximidade da rede e lado de aproximação.","Escolha do lob e efeito sobre a vantagem de B."],
    ["D06","Passagem paralela","N2","P2","Janela paralela, altura de contato e posição de B na rede.","Explorar a paralela com margem quando a trajetória é executável. Se B cobre a linha ou A está esticado, buscar outra solução em vez de forçar.","B aborda em destinos diferentes; A escolhe paralela, cruzada ou lob.","Retirar o destino combinado de abordagem.","Passagens coerentes com posição de B e controle disponível."],
    ["D07","Passagem cruzada","N2","P2","Ângulo disponível e cobertura de B após a abordagem.","Usar cruzado para afastar a bola do alcance de B quando houver controle. Não tentar ângulo extremo se o contato é baixo e atrasado; considerar bola nos pés.","B muda a direção da abordagem e ajusta a cobertura.","Variar altura e velocidade da bola de aproximação.","Escolha de ângulo sem excesso de risco imposto pelo alvo."],
    ["D08","Passagem em duas bolas","N2","P2","B em boa posição de rede, sem janela clara para passar de primeira.","Enviar uma bola que provoque voleio difícil e preparar a segunda passagem. Se surge uma passagem direta acessível, não prolongar por obrigação.","B aproxima; A pode jogar baixo ou ao centro e responder ao voleio seguinte.","B passa a variar a profundidade do primeiro voleio.","Preparação de A para a segunda bola e qualidade da primeira pressão."],
    ["D09","Contra atacar com tempo reduzido","N2 a N3","P3","Trajetória previsível o suficiente e habilidade para redirecionar em equilíbrio relativo.","Usar velocidade recebida para mudar a iniciativa quando o contato permite. Se não há controle mínimo, neutralizar; defesa não obriga uma resposta passiva nem heroica.","B inicia com ataque moderado. A escolhe neutralização ou contra-ataque e segue.","Aumentar incerteza antes de aumentar velocidade.","Contra-ataques funcionais separados de tentativas sem controle."],
    ["D10","Recuperar lob que passou","N2","P2","Bola ultrapassou a posição de interceptação confortável.","Girar, deslocar-se com visão possível e reconstruir uma resposta segura após o quique. Não exigir golpe acrobático ou corrida para trás sem controle como solução de formação.","B alterna lob alcançável e profundo após A chegar à rede.","Começar a situação a partir de uma abordagem real.","Decisão de deixar passar e capacidade de reorganizar o ponto."],
    ["D11","Sair de uma sequência defensiva","N2","P1","Uma resposta de B finalmente oferece mais tempo ou menor deslocamento.","Reconhecer a chance de neutralizar e voltar à construção. Não procurar winner na primeira bola menos difícil se B mantém boa posição.","B pressiona por construção própria; A tenta produzir uma bola que interrompa a pressão.","Inverter papéis e retirar qualquer limite artificial de bolas.","Reconhecimento da mudança de estado e redução de ataques precipitados."],
    ["D12","Defender a resposta atrás do deslocamento","N2","P2","B muda direção enquanto A recupera lateralmente.","Ajustar o deslocamento à nova bola e priorizar contato possível com margem. Evitar recuperação tão automática que impeça reagir; o ritmo depende do golpe de B.","B alterna espaço aberto e bola atrás de A em troca viva.","Variar a velocidade de recuperação de A sem prescrever passos fixos.","Reação à mudança e qualidade da resposta de recuperação."],
    ["U01","Definir papéis antes do ponto","N1","P1","Lado de saque, posição dos quatro jogadores e padrão combinado.","Combinar uma intenção simples e quem cobre respostas prováveis. Se a bola muda o cenário, adaptar a cobertura e comunicar depois; não seguir plano cego.","Quatro jogadores, formação básica e pontos completos; cada parceria combina um objetivo.","Trocar sacador e lados de devolução.","Clareza de responsabilidade e redução de bolas sem cobertura."],
    ["U02","Devolver cruzado com margem","N1 a N2","P1","Parceiro do sacador na rede e espaço cruzado disponível.","Buscar devolução que evite interceptação fácil e permita entrar no ponto. Se o jogador da rede fecha cedo, paralela ou lob podem ser respostas; não tornar cruzado obrigatório.","Saque e ponto completo com jogador da rede ativo.","Variar posição do voleador e destino de saque.","Devoluções funcionais diante da movimentação real da rede."],
    ["U03","Interceptação combinada","N2","P2","Plano prévio, qualidade do saque e trajetória alcançável.","Jogador da rede intercepta enquanto parceiro cobre o espaço combinado. Se a bola não é alcançável, não forçar por fidelidade ao sinal; revisar cobertura.","Combinar ficar ou interceptar antes do saque e jogar o ponto livre.","Devolvedores podem variar direção e usar lob.","Coordenação da cobertura e interceptações em bolas possíveis."],
    ["U04","Interceptação pela leitura","N2 a N3","P3","Bola adversária e janela de deslocamento sem antecipação excessiva.","Cruzar para interceptar quando a trajetória oferece vantagem real. Se o movimento abre a paralela sem possibilidade de contato, recuperar e manter a parceria organizada.","Jogos sem sinais obrigatórios; observar tentativas de leitura do jogador da rede.","Variar nível e padrão dos devolvedores.","Interceptações úteis e espaços abandonados prematuramente."],
    ["U05","Devolver paralelo como resposta","N2","P2","Voleador adversário fecha o centro cedo e existe janela controlável na linha.","Explorar paralela com margem para impedir fechamento confortável. Não usar a paralela como prova de coragem quando saque e contato a tornam inviável.","Voleador alterna manter e fechar; devolvedor escolhe cruzado, paralelo ou lob.","Retirar qualquer aviso de movimentação.","Escolha vinculada à posição e ao tempo disponíveis."],
    ["U06","Lob sobre o jogador da rede","N1 a N2","P2","Voleador próximo e espaço atrás para recuperar a estrutura do ponto.","Usar lob com profundidade funcional e avançar ou reorganizar conforme a resposta. Se o lob fica curto, a parceria precisa defender; não avançar automaticamente.","Pontos com devolução ou troca de fundo; lob é livre e a parceria reage.","Adversários variam distância da rede.","Qualidade do lob e organização dos dois após a bola."],
    ["U07","Jogar baixo contra dois na rede","N2","P2","Ambos os adversários avançados e ausência de passagem clara.","Buscar contato baixo para provocar voleio difícil e preparar a próxima bola. Lob continua opção se há controle e espaço; não exigir winner entre os dois.","Dois contra dois, uma parceria inicia em aproximação e o ponto continua.","Alternar posição inicial e permitir transição dos dois lados.","Primeiro voleio adversário pressionado e cobertura da resposta."],
    ["U08","Explorar o centro entre adversários","N1 a N2","P1","Espaço entre a dupla e dúvida funcional de cobertura.","Usar alvo central com intenção de reduzir ângulos ou provocar coordenação difícil. Não presumir que o meio está sempre aberto; uma dupla bem posicionada pode interceptar.","Pontos completos com observação da distância entre parceiros.","Adversários ajustam cobertura e a parceria atacante precisa variar.","Uso do centro em relação à posição, não por regra fixa."],
    ["U09","Cobrir lob e trocar posições","N1 a N2","P1","Lob supera um parceiro e o outro tem melhor possibilidade de recuperação.","Comunicar e cobrir a quadra após a troca de função. Se quem recebeu alcança com controle, não trocar sem necessidade; combinar critérios antes.","Adversários alternam lob e passagem; a dupla resolve e segue o ponto.","Iniciar o lob em diferentes lados e fases do ponto.","Comunicação, ausência de colisão e cobertura depois da troca."],
    ["U10","Dois atrás para reorganizar","N1 a N2","P2","Devolução vulnerável ou rede sendo explorada repetidamente.","Testar ambos no fundo para ganhar participação e construir nova chance de avanço. Não transformar a formação em recuo permanente; avançar se a qualidade da bola permitir.","Comparar pequenos blocos com formação básica e dois atrás contra o mesmo padrão de saque.","Adversários podem subir ou variar saque.","Participação no ponto e condições para transição posterior."],
    ["U11","Avançar como parceria","N2","P2","Bola que pressiona adversários e permite ocupação coordenada da rede.","Avançar com cobertura das respostas plausíveis e comunicação simples. Se um parceiro chega atrasado, ajustar distância; não exigir alinhamento rígido em toda situação.","A dupla começa no fundo e pode avançar após construir vantagem.","Adversários usam bola baixa e lob para testar coordenação.","Qualidade da primeira bola de rede e cobertura compartilhada."],
    ["U12","Formações alternativas no saque","N3","P3","Padrão de devolução identificado e domínio de sinais e coberturas.","Testar formação australiana ou em I com destinos e responsabilidades combinados. Voltar à formação básica se a coordenação impede reação; posição legal depende das regras vigentes.","Ensaiar posicionamento sem bola, depois saque e ponto completo contra devolução livre.","Comparar resposta adversária entre formação básica e alternativa.","Mudança útil na devolução sem perda de cobertura ou comunicação."],
  ];

  var FORMATOS = [
    ["E01","Diagnóstico sem pistas","F01 a F12; S01; R01","Após aquecimento progressivo, jogar dois blocos de pontos com saque ou início adaptado. Não anunciar o padrão que será avaliado. Manter adversário, bola e espaço registrados.","O observador escolhe uma decisão: atacar ou construir, por exemplo. Anota oportunidades, escolhas e execução em linhas separadas. Não interrompe o ponto para preencher.","Após o bloco, pedir um exemplo de bola em que o jogador tinha tempo e outro em que não tinha. Escolher apenas o problema mais limitante para o próximo exercício.","Simplificar equipamento se o ponto não começa. Para avançados, observar dois adversários ou dois momentos de jogo.","Registrar ajuda recebida, contexto e denominador das oportunidades. Repetir condições comparáveis em outro dia."],
    ["E02","Trocar e escolher espaço","F01; F02; F04; F11","Dois jogadores em espaço compatível, com bola lenta quando necessário. Marcar duas zonas amplas de destino. Começar cooperativo, enviando bolas possíveis para o parceiro.","Passar a pontos em que ambos podem escolher o destino. A posição de quem recebe precisa variar, para que exista informação real sobre espaço.","Perguntar na pausa: qual espaço estava disponível quando você bateu? Não indicar esquerda ou direita antes do contato.","Reduzir distância e ampliar alvos para N0. Para N2, retirar zonas e acrescentar variação de profundidade.","Observar espaço escolhido, bolas jogáveis e recuperação. Não medir apenas o comprimento da troca cooperativa."],
    ["E03","Contraste entre pressão e oportunidade","F03; F05; F06; T01","B alterna bolas que A recebe confortavelmente com bolas que o pressionam. Começar com contrastes claros e ordem não anunciada. Toda bola inicial é seguida de ponto vivo.","A escolhe manter, pressionar ou ganhar tempo. O treinador pode iniciar com duas intenções e acrescentar a terceira quando houver compreensão.","Comparar dois pontos nas pausas: em qual você tinha tempo e equilíbrio? Usar o contraste, não uma classificação verbal durante a corrida.","Facilitar a chegada sem tornar o tipo de bola previsível. Depois aproximar as situações e reduzir a diferença entre oportunidade e neutralidade.","Separar ataques adequados, ataques forçados e oportunidades não usadas. Considerar a habilidade real do aluno."],
    ["E04","Recuperação ligada à própria bola","F04; F09; D02; D12","A e B trocam em quadra adequada. A começa escolhendo cruzado ou centro. B tem liberdade de resposta. O foco do observador é A no instante em que B golpeia.","Não obrigar A a pisar num cone após cada golpe. Marcas podem ilustrar opções entre pontos, mas a posição de cobertura deve mudar com a jogada.","Perguntar: quais respostas sua bola deixou para B? Relacionar o deslocamento de recuperação à qualidade do golpe enviado.","Simplificar para meia quadra com duas opções. Progredir incluindo paralela e bola atrás da recuperação.","Registrar se A consegue reagir às respostas plausíveis, e não se voltou ao centro geométrico."],
    ["E05","Construir antes de mudar","C01 a C06; C12","Iniciar com troca cruzada. Cada jogador pode mudar direção quando perceber oportunidade. A partir da mudança, usar toda a quadra e jogar até o fim.","Não estabelecer três cruzadas obrigatórias antes da paralela. Uma sequência inicial breve pode apresentar a tarefa, mas o bloco avaliado precisa permitir mudança por leitura.","Perguntar o que a bola anterior provocou e se a mudança encontrou A equilibrado. Separar tentativa adequada de execução errada.","Para simplificar, baixar ritmo e ampliar o alvo. Para progredir, retirar o início cruzado e começar pelo saque.","Contar mudanças oportunas, mudanças forçadas e cobertura na resposta seguinte."],
    ["E06","Saque com três respostas possíveis","S02 a S11; R02 a R08","A saca com intenção escolhida. B devolve livremente; inicialmente pode produzir uma combinação de devoluções curtas, neutras e profundas que A não conhece.","A decide a terceira bola e o ponto continua. B não deve fornecer sempre a devolução ideal para o plano do saque.","Comparar intenção antes do saque com a resposta realmente recebida. Perguntar: o saque criou a condição que você esperava?","Simplificar usando saque controlado e destinos amplos. Progredir com primeiro e segundo saque, efeitos disponíveis e placar normal.","Separar execução do saque, estado após devolução e decisão na terceira bola. Alternar funções."],
    ["E07","Devolução e cobertura da quarta bola","R01 a R11","B saca, A devolve e o ponto segue. O observador acompanha a trajetória da devolução e a preparação de A para seu golpe seguinte.","Variar saque e comportamento do sacador, incluindo permanecer no fundo ou avançar quando o nível permite. A escolhe altura e direção.","Perguntar: depois da sua devolução, o que B podia fazer? Evitar elogiar uma devolução profunda que deixou A parado.","Simplificar saque e espaço para aumentar participação. Progredir alterando a posição de recepção e adicionando placar.","Registrar devoluções funcionais e decisões adequadas na quarta bola; não contar apenas devoluções dentro."],
    ["E08","Contornar ou usar backhand","S07; S08; C07; C08; D03","B joga bolas variadas no lado do backhand de A, sem exigir forehand. A decide qual golpe usar e o ponto continua com B podendo explorar espaço aberto.","A tarefa deve oferecer bolas com e sem tempo para contorno. Se todas são fáceis, o exercício avalia principalmente execução de forehand.","Perguntar: o ganho do forehand compensou o espaço que ficou aberto? Mostrar um exemplo de cada solução funcional.","Simplificar deslocamento e ritmo. Progredir começando pelo saque e permitindo B mudar direção a qualquer momento.","Registrar decisão de golpe, equilíbrio e resposta adversária. Evitar tratar o backhand como opção inferior por definição."],
    ["E09","Entrar com a bola certa","T01 a T07; N01 a N05","B alterna bolas neutras, curtas altas e curtas baixas em troca viva. A decide ficar, avançar parcialmente ou abordar. Não há obrigação de rede.","Depois da entrada, B pode passar, lobar ou neutralizar. A deve escolher também a função do primeiro voleio.","Comparar a bola que permitiu finalizar com a que exigiu construção. Perguntar como a abordagem mudou a resposta de B.","Simplificar com bola lenta e espaço menor. Progredir retirando a oferta de curta: A precisa produzi-la.","Registrar entrada adequada, qualidade da abordagem e escolha no primeiro voleio como três eventos diferentes."],
    ["E10","Passar em uma ou duas bolas","D05 a D08; N01; N07","B constrói ou recebe uma condição de abordagem. A tem passagem, lob e bola baixa disponíveis. Continuar o ponto após o primeiro voleio.","B deve variar destino e qualidade da aproximação. O objetivo de A é encontrar uma resposta funcional, não acertar uma passagem obrigatória.","Perguntar: havia janela de passagem imediata ou era melhor dificultar o voleio? Rever a prontidão para a segunda bola.","Simplificar velocidade e posição da aproximação. Progredir iniciando o ponto no fundo e deixando B decidir subir.","Registrar escolha inicial e qualidade da continuação, inclusive quando A perde o ponto após decisão adequada."],
    ["E11","Neutralizar para voltar ao ponto","F03; F10; C12; D01 a D04; D11","B inicia com uma vantagem moderada, produzida por uma bola de jogo. A procura recuperar uma situação jogável. Depois, ambos disputam livremente.","Não obrigar A a defender um número fixo de bolas. Assim que o estado muda, sua intenção pode mudar também.","Perguntar qual resposta de A diminuiu a pressão e em qual bola B recuperou controle. Trabalhar transições, não rótulos permanentes.","Simplificar o deslocamento inicial. Progredir com B criando a vantagem desde uma troca neutra.","Registrar neutralizações e ataques precipitados após a defesa. Não pontuar só a sobrevivência em qualquer qualidade."],
    ["E12","Plano de jogo como hipótese","F12; S12; R12; C03; C11","Antes de um bloco de games, A escolhe uma hipótese com base em observação: testar bola alta ao backhand, por exemplo. Define também uma alternativa.","Jogar sem obrigação de executar o plano quando a bola recebida não permite. B não coopera e pode adaptar seu jogo.","Na troca de lado, perguntar o que A tentou provocar e quais respostas observou. Solicitar exemplos, não apenas venceu ou perdeu.","Para N1, usar uma intenção simples sobre espaço. Para N3, acrescentar um segundo padrão e outro adversário.","Registrar ocasiões em que o plano era executável, resposta obtida e motivo de manutenção ou mudança."],
    ["E13","Mesma decisão com placar","S05; R06; F10; contexto de pontuação","Usar primeiro games normais; depois iniciar alguns em 30 iguais ou jogar um tie-break. Manter a decisão tática escolhida no bloco anterior.","Não anunciar que o jogador deve ser conservador em ponto importante. A margem deve combinar contexto, recursos e bola recebida.","Observar se ele muda de comportamento de forma funcional ou abandona a leitura. Conversar apenas nas pausas naturais.","Para iniciantes, usar contagem simples e curta. Progredir para formatos do ambiente competitivo habitual.","Comparar escolhas em oportunidades semelhantes com e sem pressão de placar, sem atribuir toda diferença à ansiedade."],
    ["E14","Revisão com vídeo e retorno à quadra","Qualquer família","Selecionar três ou quatro pontos do próprio jogador, com autorização apropriada para uso do registro. Incluir boas escolhas com erro e escolhas discutíveis com sucesso.","Pausar antes da consequência final. Pedir que o jogador indique sinais e alternativas; depois mostrar o resultado e discutir a interpretação.","Escolher uma única hipótese de melhoria e testá-la em quadra. O vídeo complementa a ação; não substitui o treino com adversário.","Para crianças, usar comparação visual breve e linguagem concreta. Para avançados, incluir sequência anterior ao lance.","Verificar se a leitura discutida aparece na quadra sem comando. O formato específico aqui é proposta de aplicação. [R05]"],
    ["E15","Duplas com decisão da parceria","U01 a U12","Quatro jogadores em formação adequada ao nível. Antes do ponto, uma parceria combina uma intenção e cobertura; a outra joga livremente.","Alternar temas por bloco: devolução e rede, interceptação, lob e troca ou avanço conjunto. Não ensinar todos simultaneamente.","Perguntar quem tinha melhor condição de alcançar a bola e como o parceiro cobriu a resposta. Observar comunicação sem gritos a cada golpe.","Simplificar com bola mais lenta e formação básica. Progredir com destinos de saque e formações alternativas quando houver domínio.","Registrar decisões da parceria, coberturas e comunicação, sem atribuir toda falha ao jogador que tocou por último."],
    ["E16","Retenção e transferência sem lembrete","Qualquer família","Em outra sessão, após aquecer, jogar antes de recordar a solução. Usar condições comparáveis para retenção; depois mudar adversário ou contexto para transferência.","Registrar as mesmas definições de oportunidade e escolha utilizadas anteriormente. Não confundir um teste com ajuda do treinador com autonomia.","Dar retorno somente após o bloco de observação. Se a escolha não aparece, investigar se faltaram oportunidades ou se o contexto ficou difícil demais.","Mudar uma condição por vez quando quiser entender a causa. Para generalização mais ampla, testar combinações posteriormente.","Comparar contagens e exemplos, incluindo o tamanho da amostra. Uma sessão boa não comprova estabilidade permanente."],

    ["X22","Rival conhecido","Usar tendências anteriores como hipótese e atualizar com o jogo atual. Condições, confiança e recursos podem ser diferentes.","Lateralidade e resposta à adaptação"],

window.QLTManual = [{"titulo":"Ensino tático e estratégico no tênis","blocos":[{"t":"h","x":"Ensino tático e estratégico no tênis"},{"t":"p","x":"Manual de aplicação em quadra"},{"t":"p","x":"Preparado para Richard Tsukada"},{"t":"p","x":"Formação de jogadores iniciantes, intermediários e em desenvolvimento competitivo"},{"t":"p","x":"Uma estrutura para observar o jogo, ensinar decisões, construir planos e acompanhar a aprendizagem."},{"t":"p","x":"Inclui fundamentos científicos, progressão pedagógica, 96 fichas de situações, exercícios de aplicação, adaptações, planejamento e instrumentos de observação."},{"t":"p","x":"Versão 1 • 8 de novembro de 2026"},{"t":"p","x":"O material propõe uma metodologia de trabalho informada por pesquisa. O conjunto de exercícios e os critérios operacionais precisam ser testados e ajustados na sua escola; não constituem um método integralmente validado em estudo experimental."}]},{"titulo":"Como usar este manual","blocos":[{"t":"p","x":"Comece por um problema observado em jogo. Escolha uma situação do catálogo, adapte a tarefa ao jogador e mantenha pelo menos duas respostas possíveis. Termine com jogo sem instrução e retome o problema em outra sessão, antes de lembrar a solução."},{"t":"p","x":"Percurso de leitura. Leia primeiro os fundamentos e a progressão. Consulte o catálogo pelo momento do ponto. Use os exercícios para organizar a quadra e as fichas finais para registrar decisões. O catálogo é material do treinador: o aluno recebe um objetivo simples por vez."},{"t":"p","x":"Escopo. O foco é o tênis de simples, com uma família específica de duplas. Crianças, adolescentes e adultos podem trabalhar os mesmos problemas em escalas diferentes. A adaptação parte da competência funcional, e não apenas da idade ou do tempo de prática."},{"t":"p","x":"O que está mapeado. As 96 fichas descrevem famílias recorrentes de problemas e respostas. Não existe uma lista finita de todos os pontos possíveis: direção, velocidade, efeito, adversário e contexto se combinam continuamente. A matriz de variações permite gerar novas tarefas sem transformar cada combinação em uma jogada independente."},{"t":"p","x":"Prioridade. As classificações de prioridade são pedagógicas. Não representam uma frequência estatística universal. Saque, devolução e primeiras decisões merecem observação desde o início, mas o tempo de treino depende do jogo real daquela turma."},{"t":"p","x":"Convenções. A é o jogador focal; B é o adversário. Forehand e backhand indicam o golpe, não um lado fixo da quadra. Saque + 1 é o saque seguido do próximo golpe do sacador, o terceiro golpe da sequência; devolução + 1 é a devolução seguida do próximo golpe do devolvedor, o quarto. Ajuste direções para destros e canhotos."}]},{"titulo":"O que a pesquisa permite afirmar","blocos":[{"t":"p","x":"Há evidências experimentais e observacionais úteis para organizar o ensino. Sua força varia conforme o desenho, o tamanho da amostra e a semelhança entre o teste e uma partida. Uma intervenção eficaz em laboratório não determina automaticamente o melhor exercício em quadra."},{"t":"p","x":"Aprendizagem e plasticidade. Estudos humanos de sequências motoras observaram mudanças funcionais relacionadas à prática no córtex motor. Isso sustenta a capacidade de adaptação do sistema nervoso, mas não demonstra uma sequência neural específica para aprender saque aberto e primeira bola. [R01]"},{"t":"p","x":"Variação da prática. Um estudo de antecipação no tênis encontrou vantagens da prática aleatória sobre blocos na retenção e no tempo de decisão em transferência. Em outro estudo, com 16 juvenis e dez sessões de saque, prática com interferência moderada favoreceu uma medida em jogo, enquanto a baixa interferência favoreceu o teste fechado. São achados específicos, não uma superioridade universal da aleatoriedade. [R02, R03]"},{"t":"p","x":"Informação do ponto. Em treino de antecipação por vídeo, preservar a sequência das ações do rally favoreceu o tempo de decisão no teste de quadra. Variar tarefas e preservar contexto são decisões distintas: embaralhar tudo pode retirar informação útil. [R04]"},{"t":"p","x":"Aplicação. Use repetição inicial quando ela ajuda a entender o problema. Acrescente alternativas e contexto assim que o jogador consegue participar. Verifique depois se a escolha permanece sem ajuda; não deduza aprendizagem apenas pelo treino parecer organizado."}]},{"titulo":"Evidência aplicada e seus limites","blocos":[{"t":"p","x":"Perguntas e vídeo. Um estudo com 11 tenistas intermediários, divididos em grupos de cinco e seis, encontrou melhora em conhecimento tático e decisão com vídeo das próprias ações e questionamento. A amostra pequena e a intervenção combinada impedem atribuir o benefício a uma pergunta específica. Publicações relacionadas não devem ser contadas automaticamente como replicações independentes. [R05, R06]"},{"t":"p","x":"Representatividade. Uma comparação com dez juvenis encontrou diferenças entre exercícios comuns e partidas nas características das bolas e do movimento. Outro estudo, com 33 jogadores durante seis semanas, comparou saque isolado, saque com devolução e saque com golpe seguinte: os efeitos não seguiram uma relação linear de mais realismo com mais aprendizagem em todas as medidas. [R07, R08]"},{"t":"p","x":"Equipamento e espaço. Uma intervenção de cinco semanas com iniciantes encontrou vantagens de condições adaptadas em oportunidades de golpe e experiência de prática. A ITF recomenda bolas mais lentas e quadras adequadas para que iniciantes possam sacar, trocar e contar pontos. Isso inclui programas para adultos; adaptar o ambiente não é exclusivo de crianças. [R09, R10]"},{"t":"p","x":"Instrução. Em um estudo com 60 crianças, o foco externo favoreceu o teste de habilidade, mas não foi superior ao foco interno no teste de transferência. Prefira instruções curtas orientadas ao efeito quando úteis, sem proibir toda explicação corporal. [R11]"},{"t":"p","x":"Consequência para o método. Os p

rincípios orientam escolhas de treino. As fichas, durações, escalas e exemplos deste manual são propostas de aplicação, e não protocolos cuja eficácia individual já foi demonstrada."}]},{"titulo":"Como a aprendizagem se organiza","blocos":[{"t":"p","x":"O jogador aprende a identificar informação relevante, relacioná-la às próprias possibilidades e regular a ação pelo que acontece. Parte desse conhecimento pode ser explicada em palavras; parte aparece no ajuste do movimento e na rapidez da resposta. Uma boa explicação verbal não garante uma boa decisão sob pressão."},{"t":"p","x":"Perceber. Atenção à bola, ao movimento do adversário e ao espaço disponível. No iniciante, torne diferenças mais claras: uma bola confortável e outra que realmente exige defesa. Evite apresentar cinco sinais novos ao mesmo tempo."},{"t":"p","x":"Explorar e comparar. O jogador experimenta soluções e percebe suas consequências. Não é preciso errar deliberadamente: ofereça alternativas executáveis e compare o que cada uma produziu. Uma bola no centro pode neutralizar; uma bola aberta pode criar ângulo para o adversário."},{"t":"p","x":"Regular. O erro informa sobre distância, tempo e margem. O sucesso também informa, mas precisa ser interpretado: ganhar um ponto por erro casual do adversário não torna boa toda a decisão anterior."},{"t":"p","x":"Estabilizar com flexibilidade. Reencontrar o mesmo problema em dias e condições diferentes ajuda a verificar consistência. Estudos de distribuição de prática e sono em tarefas motoras oferecem evidência indireta, com efeitos dependentes da tarefa; não estabelecem um intervalo ótimo para aprender uma jogada de tênis. [R12, R13]"},{"t":"p","x":"Automatizar. O objetivo operacional é responder com menos dependência da instrução, mantendo capacidade de adaptação. Não se mede automatização neural pelo número de bolas batidas, nem se deve prometer instalação de um comportamento em um número fixo de dias."},{"t":"p","x":"Explicações a evitar. Não atribua cada exercício a um hemisfério, a uma descarga de dopamina ou à criação garantida de uma conexão específica. Os testes de quadra medem comportamento, não permitem observar diretamente esses mecanismos."}]},{"titulo":"A unidade de ensino é um problema de jogo","blocos":[{"t":"p","x":"Uma jogada ensinável precisa de um gatilho perceptivo, uma intenção e uma resposta que possa ser ajustada. A frase “bater cruzado e depois paralelo” descreve a sequência; ainda falta explicar quando e por que mudar."},{"t":"tab","r":[["Elemento","Pergunta operacional"],["Situação","Como estão bola, jogadores, tempo e espaço antes da escolha?"],["Intenção","O jogador quer neutralizar, construir, pressionar ou finalizar?"],["Sinal","Que informação permite escolher essa intenção agora?"],["Resposta","Qual trajetória e posicionamento são executáveis para ele?"],["Alternativa","O que fazer se a oportunidade não surgir ou desaparecer?"],["Efeito","Que mudança a ação provocou no ponto?"]]},{"t":"h","x":"Exemplo completo"},{"t":"p","x":"A recebe uma bola curta, mas baixa. B está equilibrado no fundo. A quer avançar. O sinal decisivo não é apenas o quique curto: A precisa chegar com controle e avaliar a altura do contato. Pode abordar com margem e preparar o voleio, ou manter a construção se chegar tarde. Tentar um winner forte rente à rede não é obrigatório."},{"t":"h","x":"Estratégia e tática"},{"t":"p","x":"Estratégia: testar se bolas profundas e altas ao backhand produzem respostas curtas naquele adversário. Tática: decidir, em cada bola recebida, se há condições de executar esse plano. Se B melhora a resposta ou A perde equilíbrio, o plano precisa ser ajustado."},{"t":"p","x":"Uma estratégia inclui hipótese, comportamento observável e alternativa. “Jogar agressivo” é insuficiente; “procurar tomar a bola cedo quando estiver equilibrado para reduzir o tempo de B” permite observar e ensinar."}]},{"titulo":"Leitura do ponto e geometria funcional","blocos":[{"t":"p","x":"Bola. Leia profundidade, altura, velocidade, efeito e direção. Considere também onde e quando será possível interceptá-la. A mesma profundidade pode oferecer oportunidades diferentes a jogadores de estatura, mobilidade e habilidade distintas."},{"t":"p","x":"Jogador. Avalie equilíbrio, tempo de preparação, deslocamento e golpe disponível. Estar dentro da quadra aumenta algumas possibilidades, mas não garante ataque; estar atrás da linha não proíbe contra-ataque."},{"t":"p","x":"Adversário. Observe posição e movimento. O espaço aparentemente vazio pode fechar antes de a bola chegar. Jogar atrás de quem recupera pode ser uma opção, mas não quando exige uma mudança de direção sem controle."},{"t":"p","x":"Trajetória. Direção, altura sobre a rede, profundidade, velocidade e efeito funcionam juntos. Mais potência não significa automaticamente mais pressão. Uma bola profunda pode reduzir tempo; uma bola alta pode aumentar o tempo de recuperação de quem a executa."},{"t":"p","x":"Recuperação. A posição de cobertura depende das respostas plausíveis do adversário e do tempo disponível. O centro geométrico da linha de fundo não é o destino obrigatório depois de todo golpe. Reorganize-se enquanto a bola viaja e prepare-se para reagir ao golpe de B."},{"t":"p","x":"Cruzado e paralelo. O cruzado frequentemente oferece mais comprimento de quadra e pode favorecer margem. A dificuldade real depende do ponto de contato, trajetória e alvo. Mudar paralelo pode abrir o ponto, mas também oferecer um cruzado aberto para B; ensine a mudança com recuperação."},{"t":"p","x":"Alvos. Use zonas amplas dentro das linhas, adequadas ao jogador. Os limites são referências didáticas, não zonas científicas universais. Se o aluno só acerta o alvo com bola previsível, teste de novo com adversário e variação."}]},{"titulo":"Quatro estados para orientar a intenção","blocos":[{"t":"p","x":"Os estados abaixo são linguagem de treino. Não são diagnósticos rígidos, nem substituem a leitura individual. O ponto pode mudar de estado em uma única bola."},{"t":"tab","r":[["Estado","Sinais possíveis","Resposta a explorar"],["Defesa","Pouco tempo, grande deslocamento ou contato comprometido","Ganhar tempo, aumentar margem, reduzir ângulos ou manter o ponto vivo"],["Neutralidade","Ambos conseguem responder com relativo controle","Manter qualidade e procurar uma condição favorável"],["Vantagem","Tempo e controle próprios, adversário pressionado","Retirar mais tempo, deslocar, avançar ou explorar espaço"],["Finalização","Bola e posição permitem encerrar com boa margem","Escolher alvo acessível, sem exigir potência máxima"]]},{"t":"h","x":"O que observar no ensino"},{"t":"p","x":"Peça ao treinador observador para registrar o estado antes do golpe. Registre a ação depois. Essa ordem reduz o viés de chamar toda bola que terminou em winner de uma boa oportunidade."},{"t":"p","x":"Para o iniciante, use apenas “tenho tempo” e “preciso de tempo”. Acrescente neutralidade e vantagem quando a distinção inicial já fizer sentido. A terminologia completa pertence ao professor, não precisa ser recitada durante a troca."},{"t":"h","x":"Dois erros de simplificação"},{"t":"p","x":"“Bola curta é ataque”: falha quando a bola é baixa, o jogador chega atrasado ou o adversário está bem posicionado. “Bola alta é defesa”: falha quando a altura e o efeito pressionam o adversário. Avalie função e consequência, não apenas aparência."}]},{"titulo":"Adaptação por competência funcional","blocos":[{"t":"tab","r":[["Nível","O jogador consegue","Prioridade da tarefa"],["N0 Exploração","Participar de trocas muito curtas em ambiente adaptado","Enviar, perceber o outro lado e recuperar posição"],["N1 Iniciação","Sacar de forma adaptada e sustentar alguma troca","Escolher espaço e distinguir bola confortável de pressionante"],["N2 Construção","Variar direção e profundidade com alguma intenção","Construir vantagem, usar primeiras bolas e reconhecer transição"],["N3 Desenvolvimento competitivo","Jogar pontos completos e ajustar mais de uma solução","Integrar plano, adversário, placar e adaptação autônoma"]]},{"t":"p","x":"Esses níveis são descritores deste manual, sem equivalência automática com rankings ou idades. Um jogador pode ser N3 no fundo e N1 na rede. Escolha o nível por situação."},{"t":"p","x":"Crianças. Adequar bola, raquete e dimensões para que consigam chegar, escolher e recuperar. Use linguagem concreta, demonstração e blocos curtos. As orientações Tennis10s são uma referência oficial; verifique o regulamento aplicável antes de organizar competição. [R10]"},{"t":"p","x":"Adultos iniciantes. Bolas mais lentas e menor espaço também ajudam a tornar a escolha possível. Não exigir que o adulto execute primeiro uma técnica completa para só depois ter intenção tática."},{"t":"p","x":"Limitações funcionais. Ajustar deslocamento, altura, ritmo e duração às possibilidades reais. Tênis em cadeira de rodas e outras modalidades adaptadas exigem regras e deslocamentos específicos: a lógica de leitura pode ser aproveitada, mas as fichas não substituem um programa especializado."},{"t":"p","x":"Critério para mudar o ambiente. Ampliar quando o jogador consegue sustentar a intenção e recuperar-se. Se a mudança de bola ou quadra elimina as escolhas, voltar uma variável e reconstruir o desafio. A idade, isoladamente, não demonstra prontidão."}]},{"titulo":"Progressão de ensino em oito etapas","blocos":[{"t":"tab","r":[["Etapa","Tarefa central","Evidência para seguir"],["1 Observar","Pontos sem orientação sobre a resposta","Problema descrito por comportamento e contexto"],["2 Reconhecer","Contrastar duas situações reais","Distingue oportunidades também pela ação"],["3 Escolher","Oferecer duas respostas possíveis","Escolhe sem comando prévio"],["4 Construir","Criar a vantagem em troca viva","Produz oportunidades sem bola sempre facilitada"],["5 Adaptar","Variar resposta e posicionamento de B","Mantém ou abandona a jogada conforme a situação"],["6 Planejar","Testar hipótese em games","Relaciona plano a respostas observáveis"],["7 Pressão","Jogar com placar e oposição real","Decisão continua funcional com consequência"],["8 Transferir","Novo dia e novo adversário sem lembrete","Comportamento permanece fora do exercício"]]},{"t":"p","x":"A sequência é flexível. Um jogador experiente pode iniciar na etapa 5; um iniciante pode experimentar uma partida adaptada desde a primeira aula. Não é preciso concluir todo o repertório de uma etapa antes de jogar."},{"t":"p","x":"Se o aluno identifica a oportunidade mas não consegue executá-la, mantenha a decisão e simplifique a exigência técnica. Se executa bem quando avisado, mas escolhe mal sozinho, preserve a bola possível e retire o aviso. O ajuste depende de qual parte do problema falhou."},{"t":"p","x":"Não estabeleça um percentual universal de aprovação. Compare blocos de condições semelhantes, registre a quantidade de oportunidades e procure consistência em mais de uma sessão. Poucos pontos ou adversários muito diferentes podem gerar impressões enganosas."}]},{"titulo":"Como desenhar um exercício","blocos":[{"t":"p","x":"1 Definir. Escreva uma decisão observável: reconhecer quando uma devolução permite atacar. Evite escolher simultaneamente cinco intenções."},{"t":"p","x":"2 Montar. Defina A, B, posição inicial, bola, alvo e forma de início. Use marcações planas fora das rotas de corrida e espaço para recuperação. Sempre que possível, B deve produzir uma bola ligada a uma ação de jogo."},{"t":"p","x":"3 Criar informação. Faça a oportunidade aparecer com frequência suficiente para ser aprendida, mas inclua situações em que ela não aparece. B não precisa anunciar qual bola enviará."},{"t":"p","x":"4 Preservar a consequência. Depois da decisão, continue o ponto. Se toda tentativa termina no primeiro golpe de ataque, o jogador não aprende a lidar com a resposta do adversário."},{"t":"p","x":"5 Ajustar uma variável. Mude bola, espaço, velocidade, opções, alvo ou placar. Observe o efeito antes de alterar outra variável. Complexidade alta demais pode transformar o exercício em sobrevivência sem intenção."},{"t":"p","x":"6 Medir. Escolha um indicador de decisão e um de execução. Registre também oportunidades. Uma melhora na quantidade de winners pode vir apenas de mais bolas facilitadas."},{"t":"p","x":"7 Retirar o apoio. Termine sem zonas obrigatórias, bônus ou lembretes. Volte ao problema em outra sessão e, quando possível, com outra pessoa."},{"t":"h","x":"Cesto e máquina"},{"t":"p","x":"Podem ajudar a organizar contato, volume e exploração inicial. Entretanto, a origem previsível da bola e a ausência de adversário retiram informações de jogo. Use-os como parte do trabalho e conecte depois a troca viva. Não use o desempenho no cesto como única medida de decisão. [R07]"},{"t":"h","x":"Duração"},{"t":"p","x":"Os tempos sugeridos adiante são organização de aula, não dose científica. Pausas, hidratação, rotação e carga de saques precisam acompanhar condições ambientais, idade e tolerância do grupo."}]},{"titulo":"Feedback e perguntas que ajudam a decidir","blocos":[{"t":"p","x":"Observe primeiro, pergunte em uma pausa e ofereça uma informação acionável. Evite longas entrevistas após todo ponto. A pergunta deve ajudar a próxima tentativa, e não testar se o aluno conhece o vocabulário do treinador."},{"t":"tab","r":[["Momento","Exemplo de intervenção"],["Antes","Procure perceber se você chega com tempo para pressionar"],["Depois de um bloco","Em qual bola você realmente tinha controle para mudar?"],["Boa escolha e erro","A oportunidade existia; teste um alvo com mais margem"],["Má escolha e ponto ganho","Você ganhou; ainda assim, como estava seu equilíbrio?"],["Aluno não sabe explicar","Compare estes dois pontos e mostre onde viu espaço"],["Aluno depende do aviso","Vou observar este bloco sem indicar a jogada"]]},{"t":"p","x":"Foco externo. “Faça a bola passar com margem e cair mais fundo” pode ser mais útil naquele momento que várias instruções articulares. Use explicação técnica breve quando houver uma limitação concreta e retorne à tarefa. [R11]"},{"t":"p","x":"Vídeo. Escolha poucos lances do próprio jogador, incluindo uma decisão adequada e outra discutível. Pause antes do resultado, pergunte sobre opções e depois veja a consequência. Isso é uma aplicação pedagógica inspirada no uso combinado de vídeo e perguntas; não reproduz integralmente um protocolo publicado. [R05]"},{"t":"p","x":"Frequência. No início, o aluno pode precisar de ajuda mais frequente. Reduza conforme ele identifica e corrige o problema. Se a tarefa perde sentido ou a execução se deteriora por cansaço, ajuste antes de insistir no silêncio."},{"t":"p","x":"Evitar. Recompensar apenas winner, impor a resposta antes de toda bola, corrigir tudo ao mesmo tempo ou transformar o erro em punição física. O jogador precisa explorar alternativas e entender consequências."}]},{"titulo":"Como priorizar o repertório","blocos":[{"t":"p","x":"Ensinar todas as fichas na mesma ordem desperdiça a informação do aluno. Use uma observação inicial e selecione o que aparece, limita o jogo e pode ser trabalhado agora. O catálogo permanece disponível para ampliar o repertório."},{"t":"tab","r":[["Prioridade","Famílias típicas","Motivo"],["P1 Base","Iniciar ponto, devolver, manter bola, recuperar, reconhecer pressão e oportunidade","Permitem participação e decisões recorrentes desde cedo"],["P2 Ampliação","Saque + 1, construção, mudança de direção, abordagem, voleio, passagem e lob","Conectam fases e ampliam soluções"],["P3 Contexto","Variações específicas, disfarce, planos contra estilos, formações de duplas","Exigem pré-requisitos ou oportunidade específica"]]},{"t":"p","x":"P1 a P3 indicam prioridade sugerida para formação. Não afirmam que uma situação acontece mais vezes em todo nível, superfície ou categoria. Um iniciante que joga principalmente duplas pode precisar de algumas fichas de duplas muito cedo."},{"t":"p","x":"Por que observar as primeiras bolas. A vantagem do saque e as características dos pontos diferem entre juvenis e profissionais. Dados de elite ajudam a formular perguntas, mas não justificam impor a todo iniciante uma distribuição fixa de treino ou uma porcentagem de pontos curtos. [R14]"},{"t":"p","x":"Amostra de trabalho. Como início prático, observe dois blocos de jogo em dias diferentes e anote por que o ponto não evolui. Se quase não há devoluções em quadra, comece por esse gargalo. Se chegam muitas bolas curtas e são mal aproveitadas, priorize leitura e transição."},{"t":"p","x":"Decisão da semana. Escolha uma família principal, uma situação de apoio e uma situação de contraste. Exemplo: atacar a bola curta, recuperar após a abordagem e reconhecer a bola curta baixa que exige mais controle."}]},{"titulo":"Leitura das fichas de situações","blocos":[{"t":"p","x":"As páginas seguintes contêm 96 situações em oito famílias. Cada ficha apresenta sinais, resposta possível, condição para mudar, exercício e indicador. São propostas de treino, não receitas garantidas para vencer pontos."},{"t":"tab","r":[["Código","Família","Quantidade"],["F01 a F12","Fundamentos de leitura e organização","12"],["S01 a S12","Saque e primeira bola do sacador","12"],["R01 a R12","Devolução e primeira bola do devolvedor","12"],["C01 a C12","Construção e mudança no fundo","12"],["T01 a T12","Transição e jogo curto","12"],["N01 a N12","Rede e finalização","12"],["D01 a D12","Defesa e contra-ataque","12"],["U01 a U12","Duplas e coordenação da parceria","12"]]},{"t":"p","x":"Os códigos de referências científicas aparecem entre colchetes, como [R01]. Os códigos de devolução aparecem sem colchetes, como R01; são sistemas diferentes. Nas fichas, N1 a N3 indicam a competência inicial sugerida e P1 a P3 a prioridade pedagógica."},{"t":"p","x":"Montagem comum. Dois jogadores em oposição; em duplas, quatro. Salvo indicação diferente, jogar o ponto até o fim, alternar papéis e lados e registrar a decisão antes de julgar o resultado. Os exercícios podem ser usados com os formatos E01 a E16."},{"t":"p","x":"Simplificação comum. Bola mais lenta, menor espaço, alvo mais amplo e menos alternativas. Manter uma escolha real. Não acrescentar várias regras artificiais para compensar uma tarefa acima do nível."},{"t":"p","x":"Progressão comum. Retirar a previsibilidade, variar B, começar pelo saque e testar com placar normal. A presença do padrão no exercício é apenas a primeira verificação; repetir sem ajuda em outro dia."}]},{"titulo":"Fundamentos de leitura e organização 1","blocos":[{"t":"h","x":"F01 Manter a bola disponível"},{"t":"p","x":"N0 a N1 • P1"},{"t":"p","x":"Ler. Altura, distância e tempo para encontrar a bola em posição confortável."},{"t":"p","x":"Decidir. Enviar com margem para uma região ampla e preparar a próxima ação. Se o contato se perde, reduzir distância ou usar bola mais lenta antes de cobrar direção."},{"t":"p","x":"Exercício. A e B trocam em quadra reduzida; contar trocas cooperativas, depois disputar pontos com os mesmos limites."},{"t":"p","x":"Variar e observar. Ampliar um pouco o espaço e retirar a meta de trocas. Indicador: Bolas jogáveis enviadas e recuperação antes da próxima resposta."},{"t":"h","x":"F02 Reconhecer o espaço livre"},{"t":"p","x":"N1 • P1"},{"t":"p","x":"Ler. Posição de B no momento de preparar e executar o golpe."},{"t":"p","x":"Decidir. Enviar para uma zona acessível que afaste a bola de B. Se a mudança exigir um golpe fora de controle, manter margem e continuar construindo."},{"t":"p","x":"Exercício. Dividir o fundo em duas zonas amplas. B joga e recupera livremente; A escolhe a zona sem aviso do treinador."},{"t":"p","x":"Variar e observar. B passa a recuperar em velocidades diferentes. Indicador: Escolhas de espaço justificadas pela posição de B, e não só pelo resultado."},{"t":"h","x":"F03 Ganhar tempo quando pressionado"},{"t":"p","x":"N1 • P1"},{"t":"p","x":"Ler. Atraso na chegada, pouco equilíbrio ou bola que empurra para trás."},{"t":"p","x":"Decidir. Usar trajetória mais alta e alvo amplo para recuperar organização. Se B já está na rede, avaliar lob ou bola baixa em vez de apenas levantar no meio."},{"t":"p","x":"Exercício. B alterna bolas confortáveis e profundas. A muda a intenção quando sente a pressão; o ponto segue."},{"t":"p","x":"Variar e observar. Aumentar gradualmente o deslocamento inicial. Indicador: Respostas que permitem a A reorganizar-se antes do golpe seguinte."}]},{"titulo":"Fundamentos de leitura e organização 2","blocos":[{"t":"h","x":"F04 Recuperar conforme a bola enviada"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Direção do próprio golpe e possibilidades de resposta de B."},{"t":"p","x":"Decidir. Mover-se para uma posição que cubra respostas plausíveis e reagir ao golpe adversário. Não correr automaticamente ao centro se isso abandonar o espaço mais ameaçado."},{"t":"p","x":"Exercício. A joga cruzado ou ao centro; B responde livremente. Observar a posição de A quando B golpeia."},{"t":"p","x":"Variar e observar. Liberar mudanças paralelas e comparar a cobertura. Indicador: Recuperações adequadas ao golpe anterior, sem comando externo."},{"t":"h","x":"F05 Distinguir bola confortável de oportunidade"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Ter tempo para bater não significa que B esteja pressionado."},{"t":"p","x":"Decidir. Construir com qualidade quando há conforto, mas ainda não existe vantagem clara. Acelerar somente se a combinação de controle e posição oferecer benefício plausível."},{"t":"p","x":"Exercício. B envia bolas confortáveis variando sua posição. A decide entre manutenção e pressão em ponto vivo."},{"t":"p","x":"Variar e observar. B passa a contra-atacar a bola curta de A. Indicador: Ataques forçados e oportunidades aproveitadas, registrados separadamente."},{"t":"h","x":"F06 Reconhecer a bola curta baixa"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Profundidade curta, altura de contato baixa e distância para chegar."},{"t":"p","x":"Decidir. Entrar com controle e usar margem, podendo abordar ou recolocar B em movimento. Se A chega atrasado, evitar buscar winner forte só porque a bola é curta."},{"t":"p","x":"Exercício. B intercala bola curta alta, curta baixa e profunda. A escolhe e joga a continuação."},{"t":"p","x":"Variar e observar. Retirar a alternância previsível entre tipos de bola. Indicador: Escolha compatível com a altura e o equilíbrio no contato."}]},{"titulo":"Fundamentos de leitura e organização 3","blocos":[{"t":"h","x":"F07 Usar altura com intenção"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Tempo necessário para recuperar e altura de contato de B."},{"t":"p","x":"Decidir. Aumentar altura para ganhar tempo ou incomodar B; reduzir quando há controle e intenção de retirar tempo. Não associar toda bola alta à defesa nem toda bola baixa ao ataque."},{"t":"p","x":"Exercício. A e B jogam pontos com duas janelas de trajetória imaginadas sobre a rede, sem obrigação de usá-las."},{"t":"p","x":"Variar e observar. B muda a distância da linha de fundo. Indicador: Efeito da altura sobre tempo de recuperação e posição de B."},{"t":"h","x":"F08 Usar profundidade com intenção"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Posição de B e capacidade de A controlar comprimento."},{"t":"p","x":"Decidir. Buscar profundidade com margem para limitar a entrada de B na quadra. Uma bola profunda lenta pode não pressionar; observar a resposta antes de concluir vantagem."},{"t":"p","x":"Exercício. Marcar uma zona profunda ampla. Jogar pontos e contar entradas de B após bolas curtas de A."},{"t":"p","x":"Variar e observar. Retirar a zona visual e variar a bola recebida. Indicador: Redução de bolas involuntariamente curtas em situações neutras."},{"t":"h","x":"F09 Jogar para o centro funcional"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Ângulos disponíveis para B e condição de equilíbrio de A."},{"t":"p","x":"Decidir. Usar o centro com profundidade para reduzir algumas opções laterais ou neutralizar. Se B domina o centro e ataca com facilidade, variar altura ou direção quando houver controle."},{"t":"p","x":"Exercício. A recebe bolas abertas e escolhe centro ou cruzado. B tenta aproveitar a resposta."},{"t":"p","x":"Variar e observar. B alterna ficar atrás e entrar na quadra. Indicador: Qualidade da neutralização e espaço concedido na resposta seguinte."}]},{"titulo":"Fundamentos de leitura e organização 4","blocos":[{"t":"h","x":"F10 Reconhecer a mudança de estado"},{"t":"p","x":"N2 • P1"},{"t":"p","x":"Ler. O próprio golpe pode transformar defesa em neutralidade ou vantagem em pressão."},{"t":"p","x":"Decidir. Atualizar a intenção após cada resposta, sem manter ataque a qualquer custo. Se a bola de B neutraliza a vantagem, reconstruir antes de procurar nova finalização."},{"t":"p","x":"Exercício. Pontos livres iniciados em vantagem de A; B tenta neutralizar. Depois inverter."},{"t":"p","x":"Variar e observar. Mudar a situação inicial sem dizer qual jogador está em vantagem. Indicador: Mudanças adequadas de intenção após a resposta adversária."},{"t":"h","x":"F11 Escolher margem e alvo"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Controle disponível, distância da rede e tamanho do alvo executável."},{"t":"p","x":"Decidir. Preferir um alvo interno coerente com a intenção e com a própria dispersão. Não exigir linha para demonstrar coragem; não ampliar tanto o alvo que a bola fique sem função."},{"t":"p","x":"Exercício. Usar duas zonas internas amplas e pontos vivos. Registrar erros por excesso de precisão exigida."},{"t":"p","x":"Variar e observar. Reduzir o alvo apenas quando a tarefa continuar representativa. Indicador: Acerto da intenção com margem, além do simples acerto do cone."},{"t":"h","x":"F12 Criar e revisar uma intenção"},{"t":"p","x":"N1 a N3 • P1"},{"t":"p","x":"Ler. Uma característica observada de B e uma solução disponível a A."},{"t":"p","x":"Decidir. Escolher uma hipótese simples para um bloco de pontos e verificar respostas. Abandonar a hipótese se a situação não permite executá-la ou a evidência não a sustenta."},{"t":"p","x":"Exercício. A diz uma intenção antes de quatro a seis pontos; depois descreve dois exemplos do que aconteceu."},{"t":"p","x":"Variar e observar. Testar a mesma hipótese contra outro adversário. Indicador: Ajustes apoiados em observação, sem depender apenas do placar."}]},{"titulo":"Saque e primeira bola do sacador 1","blocos":[{"t":"h","x":"S01 Iniciar o ponto com intenção"},{"t":"p","x":"N1 • P1"},{"t":"p","x":"Ler. Alvo grande, posição do devolvedor e capacidade atual de saque."},{"t":"p","x":"Decidir. Colocar o saque em jogo e preparar a resposta seguinte. Se o saque impede toda troca, aproximar a linha ou usar saque adaptado na tarefa de aprendizagem."},{"t":"p","x":"Exercício. Saque, devolução e ponto completo em espaço adequado. Alternar lados e papéis."},{"t":"p","x":"Variar e observar. Ampliar distância sem perder a preparação da terceira bola. Indicador: Saques em jogo com A pronto para a devolução."},{"t":"h","x":"S02 Saque aberto e espaço disponível"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Deslocamento real de B e qualidade da devolução."},{"t":"p","x":"Decidir. Explorar o espaço aberto com a primeira bola quando houver controle. Se B recupera cedo ou devolve profundo, jogar atrás dele ou reconstruir conforme a bola."},{"t":"p","x":"Exercício. A busca saque aberto; B devolve e recupera livremente. A não tem direção obrigatória na terceira bola."},{"t":"p","x":"Variar e observar. Adicionar saques ao centro para impedir leitura antecipada. Indicador: Terceiras bolas escolhidas pela devolução e recuperação de B."},{"t":"h","x":"S03 Saque ao T e resposta central"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. B deslocado para fora e espaço disponível na região central do saque."},{"t":"p","x":"Decidir. Usar o T para reduzir ângulo de devolução ou surpreender; ler a bola seguinte. Não presumir que todo saque ao T gera devolução curta ou central."},{"t":"p","x":"Exercício. Alternar saque ao T e aberto. B pode bloquear ou direcionar; jogar o ponto."},{"t":"p","x":"Variar e observar. B muda sua posição antes do saque. Indicador: Ajuste do primeiro deslocamento de A à devolução real."}]},{"titulo":"Saque e primeira bola do sacador 2","blocos":[{"t":"h","x":"S04 Saque ao corpo funcional"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Posição e espaço de preparação do devolvedor."},{"t":"p","x":"Decidir. Buscar uma trajetória que reduza o espaço de golpe de B, dentro da área legal. B pode se afastar e atacar; evitar repetir sem observar essa adaptação."},{"t":"p","x":"Exercício. A varia alvo entre região de B e zonas laterais. B escolhe como criar espaço para devolver."},{"t":"p","x":"Variar e observar. B altera a distância da linha de fundo. Indicador: Respostas pressionadas produzidas, sem confundir saque dentro com sucesso tático."},{"t":"h","x":"S05 Segundo saque e continuidade"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Margem disponível e comportamento de B ao atacar o segundo saque."},{"t":"p","x":"Decidir. Executar segundo saque controlável e preparar uma primeira bola de construção ou defesa. Não tratar segundo saque apenas como bola sem intenção; não exigir efeito ainda indisponível."},{"t":"p","x":"Exercício. Jogar pontos começando pelo segundo saque, com alvo amplo. Retomar depois games com dois saques."},{"t":"p","x":"Variar e observar. B alterna posição ofensiva e recuada. Indicador: Duplas faltas no jogo normal e qualidade da resposta à devolução."},{"t":"h","x":"S06 Saque com efeito para deslocar"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. Trajetória, quique e lado do golpe de B que fica mais exposto."},{"t":"p","x":"Decidir. Usar slice ou kick já disponíveis para modificar o contato do devolvedor. Não deduzir o lado fraco apenas por B ser destro ou canhoto; observar sua resposta."},{"t":"p","x":"Exercício. A testa dois efeitos ou trajetórias possíveis e joga a terceira bola livre."},{"t":"p","x":"Variar e observar. Comparar lados iguais e vantagem, registrando o golpe recebido por B. Indicador: Mudanças no contato de B e na bola oferecida a A."}]},{"titulo":"Saque e primeira bola do sacador 3","blocos":[{"t":"h","x":"S07 Saque e forehand de construção"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Tempo para usar forehand sem abandonar excessivamente a cobertura."},{"t":"p","x":"Decidir. Buscar uma primeira bola de forehand que crie vantagem com margem. Se contornar expõe toda a quadra ou exige contato atrasado, usar backhand ou neutralizar."},{"t":"p","x":"Exercício. A saca buscando uma devolução provável; B pode mudar direção. A decide se contorna."},{"t":"p","x":"Variar e observar. Aumentar a variedade de devoluções e retirar alvo de saque obrigatório. Indicador: Contornos funcionais e bolas cedidas por cobertura insuficiente."},{"t":"h","x":"S08 Saque e primeira bola de backhand"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Devolução ao backhand e tempo para organizar contato."},{"t":"p","x":"Decidir. Construir ou pressionar com o backhand disponível em vez de fugir automaticamente. Contornar só se houver tempo, equilíbrio e cobertura compatíveis."},{"t":"p","x":"Exercício. B devolve parte das bolas ao backhand; A joga a continuação sem direção obrigatória."},{"t":"p","x":"Variar e observar. B passa a alternar profundidade e direção sem combinação. Indicador: Qualidade da terceira bola quando A não consegue usar forehand."},{"t":"h","x":"S09 Saque e aproximação à rede"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. Qualidade do saque, trajetória da devolução e tempo para avançar."},{"t":"p","x":"Decidir. Avançar quando o saque e a resposta favorecem uma primeira bola de rede controlável. Se a devolução chega baixa ou muito rápida, aceitar voleio de construção; a entrada não garante winner."},{"t":"p","x":"Exercício. A escolhe subir em alguns saques. B pode passar ou lobar; jogar até o fim."},{"t":"p","x":"Variar e observar. Alternar subida anunciada e livre, depois retirar o aviso. Indicador: Primeiro voleio, cobertura e decisão de continuar avançando."}]},{"titulo":"Saque e primeira bola do sacador 4","blocos":[{"t":"h","x":"S10 Resposta curta após o saque"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Profundidade, altura e deslocamento exigido pela devolução curta."},{"t":"p","x":"Decidir. Entrar e escolher ataque, abordagem ou controle conforme a altura do contato. Se a bola é baixa e A chega tarde, não buscar potência como resposta automática."},{"t":"p","x":"Exercício. B alterna devolução curta e profunda; A decide e continua o ponto."},{"t":"p","x":"Variar e observar. Introduzir devolução curta cruzada e central. Indicador: Reconhecimento da altura antes da escolha na terceira bola."},{"t":"h","x":"S11 Defender a devolução agressiva"},{"t":"p","x":"N2 • P1"},{"t":"p","x":"Ler. Devolução que tira tempo ou coloca A fora de equilíbrio."},{"t":"p","x":"Decidir. Neutralizar com alvo amplo e recuperar organização após sacar. Evitar insistir no plano ofensivo apenas porque o ponto começou com seu saque."},{"t":"p","x":"Exercício. B pode atacar qualquer saque acessível. A procura uma resposta defensiva funcional e segue."},{"t":"p","x":"Variar e observar. Variar primeiro e segundo saque e a posição de B. Indicador: Terceiras bolas defensivas que mantêm A competitivo no ponto."},{"t":"h","x":"S12 Variar o saque com propósito"},{"t":"p","x":"N2 a N3 • P2"},{"t":"p","x":"Ler. Padrões de posicionamento e resposta observados em B."},{"t":"p","x":"Decidir. Escolher entre destinos e trajetórias para testar uma hipótese e evitar previsibilidade fácil. Não trocar tudo aleatoriamente nem repetir um alvo só porque venceu o último ponto."},{"t":"p","x":"Exercício. Jogar games; A registra intenção antes do game e revê ao final."},{"t":"p","x":"Variar e observar. B recebe liberdade para antecipar padrões e ajustar posição. Indicador: Coerência entre intenção, adaptação de B e próximo plano."}]},{"titulo":"Devolução e primeira bola do devolvedor 1","blocos":[{"t":"h","x":"R01 Devolver para começar a jogar"},{"t":"p","x":"N1 • P1"},{"t":"p","x":"Ler. Trajetória do saque, distância e tempo de reação disponíveis."},{"t":"p","x":"Decidir. Usar alvo amplo e devolver com controle para entrar no ponto. Se não há participação, adaptar saque e bola antes de acrescentar alvos estreitos."},{"t":"p","x":"Exercício. Saque possível para o nível, devolução e ponto completo. Alternar funções frequentemente."},{"t":"p","x":"Variar e observar. Aumentar gradualmente variedade e distância de saque. Indicador: Devoluções em jogo e prontidão para a bola seguinte."},{"t":"h","x":"R02 Bloquear primeiro saque rápido"},{"t":"p","x":"N2 • P1"},{"t":"p","x":"Ler. Pouco tempo e velocidade suficiente da bola recebida."},{"t":"p","x":"Decidir. Reduzir exigência de preparação e usar margem para neutralizar. Se o saque é mais lento e permite controle, explorar direção em vez de bloquear por hábito."},{"t":"p","x":"Exercício. B alterna primeiro saque mais rápido e saque controlado; A escolhe a resposta."},{"t":"p","x":"Variar e observar. B varia destinos sem aviso. Indicador: Devoluções neutralizadas e escolhas compatíveis com tempo disponível."},{"t":"h","x":"R03 Responder ao saque aberto"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Deslocamento para fora e espaço deixado na quadra."},{"t":"p","x":"Decidir. Devolver com margem e recuperar conforme a trajetória enviada. Buscar paralela só se houver controle e benefício; o cruzado também pode abrir ângulo para B."},{"t":"p","x":"Exercício. B saca aberto e ao T. A devolve e joga o ponto, sem destino fixo."},{"t":"p","x":"Variar e observar. Variar efeito e profundidade do saque. Indicador: Qualidade da devolução e recuperação após sair da quadra."}]},{"titulo":"Devolução e primeira bola do devolvedor 2","blocos":[{"t":"h","x":"R04 Responder ao saque ao T"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Bola que exige deslocamento para dentro e leitura do golpe possível."},{"t":"p","x":"Decidir. Criar espaço para contato e enviar uma resposta controlável. Não decidir forehand ou backhand antecipadamente se a trajetória muda a solução."},{"t":"p","x":"Exercício. B alterna T e corpo; A devolve a uma zona ampla e prepara a quarta bola."},{"t":"p","x":"Variar e observar. Acrescentar saque aberto e variar posição inicial. Indicador: Contato organizado sem perder a continuação do ponto."},{"t":"h","x":"R05 Responder ao saque ao corpo"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Trajetória que restringe espaço para preparar o golpe."},{"t":"p","x":"Decidir. Ajustar posição para criar uma solução de forehand ou backhand viável. Evitar prescrever um único golpe para todas as alturas e efeitos."},{"t":"p","x":"Exercício. B varia corpo e lateral. A escolhe a resposta possível e joga a continuação."},{"t":"p","x":"Variar e observar. Variar altura do quique e distância de recepção. Indicador: Redução de devoluções comprometidas por falta de espaço."},{"t":"h","x":"R06 Atacar segundo saque acessível"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Tempo, equilíbrio e segundo saque que permite contato favorável."},{"t":"p","x":"Decidir. Entrar ou tomar a bola cedo para pressionar com alvo interno. Se o efeito ou o quique tiram controle, manter construção; segundo saque não obriga ataque."},{"t":"p","x":"Exercício. B joga segundos saques variados. A escolhe atacar ou construir e continua."},{"t":"p","x":"Variar e observar. B alterna saques que sobem e que ficam mais baixos. Indicador: Ataques adequados versus ataques forçados na devolução."}]},{"titulo":"Devolução e primeira bola do devolvedor 3","blocos":[{"t":"h","x":"R07 Devolver alto e profundo"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Necessidade de tempo e sacador que permanece no fundo."},{"t":"p","x":"Decidir. Usar altura e profundidade para reduzir a vantagem inicial de B. Se B avança à rede, ajustar para lob útil ou resposta baixa; uma bola alta curta facilita o voleio."},{"t":"p","x":"Exercício. B pode permanecer ou avançar após sacar. A lê e escolhe a trajetória."},{"t":"p","x":"Variar e observar. Retirar o aviso sobre a intenção de B. Indicador: Efeito da devolução sobre a primeira bola do sacador."},{"t":"h","x":"R08 Devolver baixo contra subida"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Sacador avançando e janela para jogar abaixo de sua altura de voleio confortável."},{"t":"p","x":"Decidir. Buscar bola baixa com margem para dificultar o primeiro voleio. Se A está muito atrasado ou B fecha demais, considerar lob em vez de forçar os pés."},{"t":"p","x":"Exercício. B alterna saque e subida com saque e fundo. A joga o ponto completo."},{"t":"p","x":"Variar e observar. Permitir a B variar a velocidade de aproximação. Indicador: Primeiro voleio de B pressionado e resposta seguinte de A."},{"t":"h","x":"R09 Lob na devolução"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. Adversário próximo à rede e espaço atrás, com contato que permite elevar a bola."},{"t":"p","x":"Decidir. Usar lob para superar ou recuar B, preparando a cobertura da resposta. Se o lob fica curto repetidamente, simplificar a bola recebida e não insistir só por regra."},{"t":"p","x":"Exercício. B saca e sobe; A pode devolver baixo, passar ou lobar."},{"t":"p","x":"Variar e observar. B varia proximidade da rede e não sobe em todos os pontos. Indicador: Lobs escolhidos por posição, com profundidade funcional."}]},{"titulo":"Devolução e primeira bola do devolvedor 4","blocos":[{"t":"h","x":"R10 Escolher posição de recepção"},{"t":"p","x":"N2 a N3 • P2"},{"t":"p","x":"Ler. Velocidade, efeito, quique e destinos que B realmente usa."},{"t":"p","x":"Decidir. Testar posição mais próxima ou recuada para melhorar tempo e contato. A posição precisa permitir cobrir alternativas; antecipar uma tendência não é adivinhar sempre."},{"t":"p","x":"Exercício. Jogar pequenos blocos em duas posições e comparar controle e opções de B."},{"t":"p","x":"Variar e observar. B passa a alterar alvo quando percebe a mudança. Indicador: Qualidade da devolução e capacidade de cobrir variação."},{"t":"h","x":"R11 Devolução e bola seguinte"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Qualidade da própria devolução e resposta provável do sacador."},{"t":"p","x":"Decidir. Recuperar para a quarta bola com intenção coerente: defender, construir ou pressionar. Não permanecer assistindo à devolução nem assumir vantagem só por devolver fundo."},{"t":"p","x":"Exercício. Pontos completos; o observador avalia especificamente a recuperação após devolver."},{"t":"p","x":"Variar e observar. B varia a terceira bola e A precisa atualizar o plano. Indicador: Prontidão e qualidade da quarta bola em diferentes devoluções."},{"t":"h","x":"R12 Quebrar uma rotina do sacador"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. Sequências repetidas de saque e terceira bola observadas em mais de um ponto."},{"t":"p","x":"Decidir. Alterar posição ou destino de devolução para testar uma resposta diferente de B. Evitar concluir padrão com amostra mínima; manter alternativa se B mudar."},{"t":"p","x":"Exercício. Jogar games com hipótese prévia de A e revisão entre games."},{"t":"p","x":"Variar e observar. Trocar o sacador e verificar se a hipótese continua útil. Indicador: Mudança de plano baseada em evidência do confronto."}]},{"titulo":"Construção e mudança no fundo 1","blocos":[{"t":"h","x":"C01 Sustentar a diagonal com intenção"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Tempo, profundidade recebida e posição de B na diagonal."},{"t":"p","x":"Decidir. Manter cruzado com margem, procurando qualidade que dificulte a resposta. Não prolongar a diagonal por obrigação quando surge oportunidade clara em outro espaço."},{"t":"p","x":"Exercício. Começar cruzado; qualquer jogador pode mudar quando julgar adequado e liberar a quadra."},{"t":"p","x":"Variar e observar. Retirar a regra de início cruzado no teste final. Indicador: Qualidade da construção e motivo da mudança de direção."},{"t":"h","x":"C02 Pressionar com profundidade"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. B tentando entrar na quadra ou recebendo bolas curtas frequentes."},{"t":"p","x":"Decidir. Buscar profundidade controlável para limitar a iniciativa de B. Se a profundidade só vem com excesso de risco, aumentar altura ou reduzir velocidade."},{"t":"p","x":"Exercício. Pontos com zona profunda de referência, sem obrigação de acertá-la em toda bola."},{"t":"p","x":"Variar e observar. B alterna jogar recuado e sobre a linha. Indicador: Bolas curtas cedidas e posição de contato de B."},{"t":"h","x":"C03 Pressionar com altura e efeito"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Altura de contato menos confortável para B e tempo de A para produzir a trajetória."},{"t":"p","x":"Decidir. Usar bola mais alta e com efeito disponível para provocar resposta menos favorável. Se B toma cedo ou ataca a bola, mudar profundidade, direção ou trajetória."},{"t":"p","x":"Exercício. A testa altura para um lado de B; B pode antecipar ou recuar e contra-atacar."},{"t":"p","x":"Variar e observar. Comparar respostas em lados e alturas diferentes. Indicador: Respostas realmente pressionadas, sem presumir fraqueza por estilo."}]},{"titulo":"Construção e mudança no fundo 2","blocos":[{"t":"h","x":"C04 Mudar paralelo com controle"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Contato equilibrado, bola manejável e espaço ou deslocamento favorável de B."},{"t":"p","x":"Decidir. Mudar direção com alvo interno e reorganizar a cobertura. Se A está atrasado ou fora da quadra, manter ou neutralizar pode ser melhor."},{"t":"p","x":"Exercício. Troca cruzada viva, paralela livre e continuação do ponto."},{"t":"p","x":"Variar e observar. Variar profundidade recebida e velocidade de recuperação de B. Indicador: Mudanças oportunas e primeira resposta de A após mudar."},{"t":"h","x":"C05 Abrir a quadra e explorar"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. B deslocado pela bola aberta e oportunidade no golpe seguinte."},{"t":"p","x":"Decidir. Criar ângulo e depois escolher espaço livre, bola atrás ou continuidade. Se a bola aberta ofereceu contra-ângulo a B, defender antes de buscar a segunda ação."},{"t":"p","x":"Exercício. Pontos começando na diagonal; A tenta deslocar B sem sequência obrigatória de duas direções."},{"t":"p","x":"Variar e observar. B pode recuperar cedo ou devolver atrás de A. Indicador: Aproveitamento condicionado à resposta, sem completar padrão às cegas."},{"t":"h","x":"C06 Jogar atrás de quem recupera"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. Movimento de recuperação de B e capacidade de A controlar direção."},{"t":"p","x":"Decidir. Enviar para a região que B está abandonando quando a mudança de movimento o pressiona. Se B já parou ou A perdeu tempo, usar outra zona com margem."},{"t":"p","x":"Exercício. B recupera de modos diferentes após bola aberta; A escolhe livremente."},{"t":"p","x":"Variar e observar. Introduzir recuperação parcial e paradas de B. Indicador: Escolhas ligadas ao movimento observado, e não apenas à posição."}]},{"titulo":"Construção e mudança no fundo 3","blocos":[{"t":"h","x":"C07 Contornar para forehand cruzado"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Tempo para contornar sem contato atrasado e sem expor cobertura excessiva."},{"t":"p","x":"Decidir. Usar forehand invertido cruzado para construir ou pressionar. Se não há tempo, usar backhand disponível; contornar não é objetivo em si."},{"t":"p","x":"Exercício. A recebe bolas no lado do backhand com profundidade variável e decide o golpe."},{"t":"p","x":"Variar e observar. B pode explorar a quadra aberta após o contorno. Indicador: Benefício criado em relação ao espaço abandonado."},{"t":"h","x":"C08 Contornar para forehand paralelo"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. B protegendo a diagonal e bola que permite direção paralela controlada."},{"t":"p","x":"Decidir. Explorar a paralela após contorno, preparando resposta cruzada de B. Se a janela é pequena ou A fica desequilibrado, preferir cruzado ou backhand."},{"t":"p","x":"Exercício. B alterna cobertura; A escolhe forehand invertido cruzado, paralelo ou backhand."},{"t":"p","x":"Variar e observar. Retirar toda indicação de posicionamento de B. Indicador: Adequação da escolha e cobertura após o golpe."},{"t":"h","x":"C09 Usar slice como mudança funcional"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Bola recebida e posição de B que tornam útil variar altura e ritmo."},{"t":"p","x":"Decidir. Usar slice disponível para baixar o contato, recuperar tempo ou preparar transição. Não assumir que todo slice é defensivo; avaliar se ele ficou curto e atacável."},{"t":"p","x":"Exercício. A pode alternar topspin e slice em ponto vivo; B tenta aproveitar a mudança."},{"t":"p","x":"Variar e observar. B muda sua distância da linha. Indicador: Efeito da mudança sobre contato e iniciativa de B."}]},{"titulo":"Construção e mudança no fundo 4","blocos":[{"t":"h","x":"C10 Tomar a bola mais cedo"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. Equilíbrio e tempo suficientes para interceptar sem recuar excessivamente."},{"t":"p","x":"Decidir. Reduzir o tempo de B com contato antecipado e alvo controlável. Se a antecipação elimina controle, aceitar mais tempo e reconstruir."},{"t":"p","x":"Exercício. B alterna bolas profundas de alturas diferentes. A escolhe interceptar ou recuar."},{"t":"p","x":"Variar e observar. Aumentar incerteza sobre altura e direção. Indicador: Pressão produzida sem aumento desproporcional de erros de escolha."},{"t":"h","x":"C11 Variar ritmo sem perder intenção"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. B confortável com uma velocidade repetida e possibilidade de A variar a trajetória."},{"t":"p","x":"Decidir. Alterar velocidade, altura ou efeito para modificar tempo e contato de B. Variar por variar pode entregar bola fácil; manter margem e objetivo observável."},{"t":"p","x":"Exercício. A joga um bloco com hipótese de mudança de ritmo; B reage livremente."},{"t":"p","x":"Variar e observar. B tenta antecipar a mudança e entrar na quadra. Indicador: Mudança útil no comportamento de B e qualidade da bola seguinte."},{"t":"h","x":"C12 Neutralizar e reconstruir"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Vantagem de B reduzida por uma boa resposta de A."},{"t":"p","x":"Decidir. Voltar à construção em vez de procurar winner imediatamente após defender. Se B continua pressionando, permanecer em defesa até surgir condição real."},{"t":"p","x":"Exercício. B inicia com vantagem moderada. A tenta neutralizar e depois disputar livremente."},{"t":"p","x":"Variar e observar. Inverter os papéis e variar origem da vantagem. Indicador: Reconhecimento de quando a defesa terminou e a construção começou."}]},{"titulo":"Transição e jogo curto 1","blocos":[{"t":"h","x":"T01 Atacar a bola curta alta"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Contato confortável à frente e posição de B que oferece espaço útil."},{"t":"p","x":"Decidir. Entrar com equilíbrio e pressionar um alvo interno; seguir a resposta. Se a bola cai abaixo da zona confortável antes da chegada, reduzir a exigência de finalização."},{"t":"p","x":"Exercício. B alterna curta alta e profunda. A escolhe entrar ou construir, sem aviso."},{"t":"p","x":"Variar e observar. B varia posição após enviar a bola curta. Indicador: Entradas oportunas e escolhas com margem, não apenas winners."},{"t":"h","x":"T02 Abordar a bola curta baixa"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Bola abaixo da rede ou contato baixo, com tempo para aproximação."},{"t":"p","x":"Decidir. Usar trajetória controlada e preparar o primeiro voleio. Se A chega muito atrasado, manter o ponto pode ser melhor que subir sem equilíbrio."},{"t":"p","x":"Exercício. B intercala curta baixa e bola neutra. A decide abordagem ou continuidade."},{"t":"p","x":"Variar e observar. B pode passar ou lobar após a entrada. Indicador: Qualidade da abordagem e organização antes do primeiro voleio."},{"t":"h","x":"T03 Escolher abordagem paralela"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Posição de B, alvo disponível e cobertura possível após a aproximação."},{"t":"p","x":"Decidir. Testar abordagem paralela e deslocar-se para cobrir respostas prováveis. A paralela não é obrigatória; se B a antecipa ou o contato não permite, usar outra solução."},{"t":"p","x":"Exercício. A recebe bola de aproximação variável; B tenta responder livremente."},{"t":"p","x":"Variar e observar. Permitir abordagens cruzadas e centrais no mesmo exercício. Indicador: Relação entre direção da abordagem, recuperação e resposta de B."}]},{"titulo":"Transição e jogo curto 2","blocos":[{"t":"h","x":"T04 Escolher abordagem cruzada"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. B fora de posição e espaço cruzado que pode ser explorado com controle."},{"t":"p","x":"Decidir. Abordar cruzado quando o benefício supera o ângulo que pode ser oferecido. Se B está equilibrado e alcança bem, considerar paralela ou centro."},{"t":"p","x":"Exercício. A entra em bola curta; B alterna posição inicial e pode usar a paralela."},{"t":"p","x":"Variar e observar. Retirar posição combinada e iniciar em troca viva. Indicador: Escolha de direção e cobertura do espaço aberto."},{"t":"h","x":"T05 Abordar pelo centro"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. B com boas passagens anguladas e A capaz de enviar bola profunda central."},{"t":"p","x":"Decidir. Reduzir ângulos disponíveis e preparar o voleio seguinte. Uma bola central curta e alta pode facilitar o ataque; avaliar qualidade real."},{"t":"p","x":"Exercício. Pontos de aproximação com três destinos livres; comparar respostas de B."},{"t":"p","x":"Variar e observar. B varia a posição de contato e usa lob quando possível. Indicador: Primeiro voleio recebido e controle dos ângulos adversários."},{"t":"h","x":"T06 Decidir subir ou permanecer"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Qualidade do próprio ataque e tempo para ocupar posição de rede útil."},{"t":"p","x":"Decidir. Avançar quando a resposta provável e o deslocamento favorecem continuidade. Não subir apenas porque bateu dentro da quadra; uma resposta neutralizante pode pedir reorganização."},{"t":"p","x":"Exercício. A recebe bola curta e escolhe avançar ou ficar; B responde livremente."},{"t":"p","x":"Variar e observar. Variar altura da bola curta e qualidade da abordagem. Indicador: Entradas justificadas e capacidade de interromper avanço quando necessário."}]},{"titulo":"Transição e jogo curto 3","blocos":[{"t":"h","x":"T07 Acompanhar pressão sem subida obrigatória"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. B recuado ou deslocado, mas sem garantia de bola para voleio."},{"t":"p","x":"Decidir. Ganhar posição de quadra gradualmente, preparado para a resposta. Se B recupera profundidade, ajustar a distância e evitar ficar preso avançando."},{"t":"p","x":"Exercício. A constrói pressão no fundo e pode ocupar espaço à frente conforme a resposta."},{"t":"p","x":"Variar e observar. B alterna defesa alta e contra-ataque profundo. Indicador: Posição de A compatível com a qualidade de sua bola."},{"t":"h","x":"T08 Executar deixada com contexto"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. B recuado, A equilibrado e contato que permite controle fino."},{"t":"p","x":"Decidir. Usar deixada para explorar distância e preparar resposta curta. Se A está atrasado, muito longe ou sem domínio do toque, preferir outra construção."},{"t":"p","x":"Exercício. B joga ora recuado, ora próximo. A escolhe entre profundidade e deixada."},{"t":"p","x":"Variar e observar. B pode antecipar a deixada após reconhecer repetição. Indicador: Deixadas escolhidas pela distância e controle, além da execução."},{"t":"h","x":"T09 Responder à deixada"},{"t":"p","x":"N1 a N2 • P2"},{"t":"p","x":"Ler. Quique curto, altura restante e posição de B."},{"t":"p","x":"Decidir. Chegar e escolher recolocar, contra-deixada, abordagem ou lob disponível. Se chega abaixo da rede e tarde, priorizar controle antes de tentar encerrar."},{"t":"p","x":"Exercício. B intercala deixada e bola profunda sem aviso. A responde e o ponto continua."},{"t":"p","x":"Variar e observar. B muda posição depois de executar a deixada. Indicador: Escolha compatível com chegada e posição do adversário."}]},{"titulo":"Transição e jogo curto 4","blocos":[{"t":"h","x":"T10 Deixada e cobertura da resposta"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. Qualidade da deixada e trajetórias possíveis da resposta de B."},{"t":"p","x":"Decidir. Acompanhar a jogada e cobrir resposta curta ou lob conforme o efeito obtido. Não invadir a rede automaticamente se a deixada ficou alta e B chega confortável."},{"t":"p","x":"Exercício. A escolhe deixada durante ponto vivo; B tem todas as respostas disponíveis."},{"t":"p","x":"Variar e observar. B alterna contra-deixada e bola profunda. Indicador: Reação de A à qualidade real da deixada."},{"t":"h","x":"T11 Bola curta angulada"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Bola lateral curta e equilíbrio para jogar com ângulo ou profundidade."},{"t":"p","x":"Decidir. Escolher alvo que mantenha pressão sem perder cobertura. Aumentar o ângulo pode abrir contra-ângulo; se o contato é difícil, usar alvo mais amplo."},{"t":"p","x":"Exercício. B envia curta lateral misturada a bola profunda; A decide e joga a sequência."},{"t":"p","x":"Variar e observar. B varia a recuperação para dentro ou para trás. Indicador: Benefício do ângulo e prontidão para a resposta seguinte."},{"t":"h","x":"T12 Recuar e reorganizar após transição frustrada"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. B recuperou vantagem ou lançou lob que impede uma posição ofensiva confortável."},{"t":"p","x":"Decidir. Reorganizar com segurança e recuperar uma posição jogável. Evitar continuar avançando por compromisso com a jogada inicial; não recuar de costas em corrida cega."},{"t":"p","x":"Exercício. A começa avançando após bola moderada; B pode neutralizar, passar ou lobar."},{"t":"p","x":"Variar e observar. Variar qualidade inicial da abordagem. Indicador: Mudança de plano e recuperação funcional após perder a vantagem."}]},{"titulo":"Rede e finalização 1","blocos":[{"t":"h","x":"N01 Primeiro voleio de construção"},{"t":"p","x":"N1 a N2 • P2"},{"t":"p","x":"Ler. Altura do contato, distância da rede e equilíbrio após avançar."},{"t":"p","x":"Decidir. Usar alvo amplo e profundidade para organizar a próxima bola. Primeiro voleio baixo ou distante da rede pode exigir construção, não finalização."},{"t":"p","x":"Exercício. A aproxima, B devolve baixo ou confortável, e o ponto segue."},{"t":"p","x":"Variar e observar. B varia direção e altura sem aviso. Indicador: Escolha de construção quando a bola não permite encerrar."},{"t":"h","x":"N02 Voleio baixo"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Contato abaixo do topo da rede e pouco ângulo útil."},{"t":"p","x":"Decidir. Colocar a bola com margem, preferindo uma solução que dificulte a resposta de B. Não tentar aceleração excessiva que exige uma trajetória inviável."},{"t":"p","x":"Exercício. A começa em posição de transição; B alterna bola nos pés e bola mais alta."},{"t":"p","x":"Variar e observar. A precisa chegar à posição a partir de abordagem real. Indicador: Bolas jogáveis e posição de A após o voleio baixo."},{"t":"h","x":"N03 Voleio alto para finalizar"},{"t":"p","x":"N1 a N2 • P2"},{"t":"p","x":"Ler. Contato confortável, controle e espaço disponível."},{"t":"p","x":"Decidir. Finalizar com alvo acessível e direção coerente com B. Se a bola chega rápida ou A está esticado, controlar em vez de assumir finalização."},{"t":"p","x":"Exercício. B alterna voleios altos confortáveis e bolas difíceis. A escolhe intensidade e direção."},{"t":"p","x":"Variar e observar. B pode mudar a posição antes do contato. Indicador: Finalizações com margem e identificação de bolas não finalizáveis."}]},{"titulo":"Rede e finalização 2","blocos":[{"t":"h","x":"N04 Voleio atrás do adversário"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. B se deslocando para cobrir o espaço aberto e A com controle de direção."},{"t":"p","x":"Decidir. Jogar na região abandonada quando isso dificulta a mudança de B. Se B para ou A golpeia atrasado, usar alvo mais amplo."},{"t":"p","x":"Exercício. B recupera após uma passagem; A decide voleio no espaço ou atrás."},{"t":"p","x":"Variar e observar. B varia a recuperação sem combinar. Indicador: Leitura do movimento antes da escolha de direção."},{"t":"h","x":"N05 Fechar a rede após vantagem"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Qualidade do próprio voleio e limitação da resposta seguinte de B."},{"t":"p","x":"Decidir. Aproximar para reduzir opções quando a bola realmente pressiona B. Se o voleio ficou neutro ou curto, manter cobertura de lob e passagem."},{"t":"p","x":"Exercício. Sequência de abordagem, primeiro voleio e continuação livre."},{"t":"p","x":"Variar e observar. B pode alternar lob e passagem em qualquer momento. Indicador: Avanço proporcional ao efeito da bola enviada."},{"t":"h","x":"N06 Interceptar sem invadir a bola errada"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Trajetória alcançável com equilíbrio e espaço que ficará exposto."},{"t":"p","x":"Decidir. Interceptar a bola quando o ganho de tempo e posição favorece A. Se exige extensão sem controle e abre a quadra, recuperar em vez de perseguir."},{"t":"p","x":"Exercício. B alterna bolas acessíveis e mais afastadas; A escolhe interceptar ou deixar quicar quando possível."},{"t":"p","x":"Variar e observar. Começar em ponto vivo para retirar posição fixa. Indicador: Interceptações úteis versus tentativas que comprometem a cobertura."}]},{"titulo":"Rede e finalização 3","blocos":[{"t":"h","x":"N07 Ler passagem ou lob"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Preparação e trajetória inicial de B, além da distância da rede."},{"t":"p","x":"Decidir. Preparar reação sem abandonar cedo demais uma das respostas. Não adivinhar só pela posição da raquete; atualizar com o voo da bola."},{"t":"p","x":"Exercício. B escolhe passagem ou lob após abordagem. A ajusta posição e responde."},{"t":"p","x":"Variar e observar. Variar o momento e a qualidade da aproximação. Indicador: Capacidade de cobrir alternativas sem antecipação rígida."},{"t":"h","x":"N08 Smash de controle"},{"t":"p","x":"N1 a N2 • P2"},{"t":"p","x":"Ler. Altura, profundidade do lob e equilíbrio para golpear."},{"t":"p","x":"Decidir. Usar alvo amplo e reorganizar-se; potência máxima não é requisito. Se o lob passa e não há golpe seguro, deixar quicar ou recuperar outra solução."},{"t":"p","x":"Exercício. B alterna lobs confortáveis e profundos; A decide smash, quique ou recuperação."},{"t":"p","x":"Variar e observar. Iniciar o lob após troca real de rede. Indicador: Decisão segura de interceptação e qualidade do alvo."},{"t":"h","x":"N09 Smash após quique"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Lob alto que permite organizar deslocamento e contato após o quique."},{"t":"p","x":"Decidir. Usar o quique quando ele melhora a possibilidade de controle. Não esperar por regra se isso entrega posição; considerar velocidade e superfície."},{"t":"p","x":"Exercício. B envia lobs variados e A escolhe golpear no ar ou após quique."},{"t":"p","x":"Variar e observar. B pode recuperar para diferentes regiões enquanto a bola sobe. Indicador: Escolha do momento e manutenção da vantagem."}]},{"titulo":"Rede e finalização 4","blocos":[{"t":"h","x":"N10 Voleio curto com intenção"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. B recuado e bola que permite controle fino à frente."},{"t":"p","x":"Decidir. Explorar espaço curto com toque disponível, cobrindo a resposta. Se B está perto ou A só consegue bloquear sem precisão, preferir profundidade."},{"t":"p","x":"Exercício. B alterna posição recuada e avançada; A decide voleio curto ou profundo."},{"t":"p","x":"Variar e observar. Variar a velocidade da bola recebida. Indicador: Toques curtos usados em contexto favorável, sem obrigação de efeito."},{"t":"h","x":"N11 Responder à bola no corpo na rede"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Pouco espaço de preparação e bola próxima ao tronco."},{"t":"p","x":"Decidir. Criar espaço possível e escolher uma resposta compacta com margem. Evitar trocar de golpe tardiamente por regra fixa; a solução depende da trajetória."},{"t":"p","x":"Exercício. B varia destinos seguros ao redor da zona de voleio em ritmo compatível; A joga a sequência."},{"t":"p","x":"Variar e observar. A chega à rede a partir de abordagem em vez de começar parado. Indicador: Respostas controladas e prontidão para a bola seguinte."},{"t":"h","x":"N12 Recuperar uma finalização que voltou"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. B alcançou a bola que A esperava encerrar."},{"t":"p","x":"Decidir. Continuar preparado e atualizar a intenção pela qualidade da resposta. Não parar depois de um golpe aparentemente vencedor nem atacar qualquer retorno."},{"t":"p","x":"Exercício. Pontos em que A começa com vantagem; B tenta devolver mais uma bola e continuar."},{"t":"p","x":"Variar e observar. Retirar a bola facilitada inicial. Indicador: Reação de A à defesa de B e manutenção do ponto."}]},{"titulo":"Defesa e contra ataque 1","blocos":[{"t":"h","x":"D01 Defender bola profunda central"},{"t":"p","x":"N1 • P1"},{"t":"p","x":"Ler. Bola que limita preparação e afasta A da posição desejada."},{"t":"p","x":"Decidir. Criar espaço de contato e devolver com margem para recuperar organização. Se consegue tomar cedo com controle, essa também é uma alternativa; não impor recuo automático."},{"t":"p","x":"Exercício. B alterna profundidade central e bola neutra. A escolhe ajuste e responde."},{"t":"p","x":"Variar e observar. Variar altura e velocidade sem aumentar tudo ao mesmo tempo. Indicador: Neutralizações e retorno a uma posição funcional."},{"t":"h","x":"D02 Defender bola aberta"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Deslocamento lateral, equilíbrio no contato e distância de recuperação."},{"t":"p","x":"Decidir. Usar altura, profundidade ou alvo central para ganhar tempo conforme a situação. Uma bola cruzada pode oferecer mais margem, mas também abrir novo ângulo; observar B."},{"t":"p","x":"Exercício. B alterna bola aberta e central, A responde e continua o ponto."},{"t":"p","x":"Variar e observar. B ganha liberdade para atacar a resposta curta. Indicador: Tempo recuperado e qualidade da cobertura de A."},{"t":"h","x":"D03 Defender bola alta no backhand"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Altura acima da zona confortável e tempo disponível."},{"t":"p","x":"Decidir. Escolher recuar, tomar antes ou variar a resposta conforme habilidade real. Contornar para forehand só se houver tempo e cobertura; não tratar backhand como fraqueza presumida."},{"t":"p","x":"Exercício. B alterna bolas altas e neutras ao lado do backhand."},{"t":"p","x":"Variar e observar. B pode mudar direção após identificar o ajuste de A. Indicador: Escolha executável e qualidade da bola de neutralização."}]},{"titulo":"Defesa e contra ataque 2","blocos":[{"t":"h","x":"D04 Defender bola baixa e rápida"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Contato baixo, pouco tempo e dificuldade para elevar a trajetória."},{"t":"p","x":"Decidir. Usar solução controlada com margem sobre a rede e alvo acessível. Não acelerar só para devolver a velocidade; se há tempo, reconstruir com mais altura."},{"t":"p","x":"Exercício. B varia slice baixo e bola com quique mais alto; A lê e ajusta."},{"t":"p","x":"Variar e observar. Iniciar com deslocamento moderado em vez de posição estática. Indicador: Respostas adequadas à altura e tempo, não ao golpe preferido."},{"t":"h","x":"D05 Lob defensivo"},{"t":"p","x":"N1 a N2 • P2"},{"t":"p","x":"Ler. B próximo à rede e A sem condição de passagem controlada."},{"t":"p","x":"Decidir. Buscar altura e profundidade para superar ou obrigar B a recuar. Lob curto pode facilitar smash; se A tem bola baixa viável, essa pode ser melhor."},{"t":"p","x":"Exercício. B aproxima e A escolhe lob ou passagem conforme a bola recebida."},{"t":"p","x":"Variar e observar. B varia proximidade da rede e lado de aproximação. Indicador: Escolha do lob e efeito sobre a vantagem de B."},{"t":"h","x":"D06 Passagem paralela"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Janela paralela, altura de contato e posição de B na rede."},{"t":"p","x":"Decidir. Explorar a paralela com margem quando a trajetória é executável. Se B cobre a linha ou A está esticado, buscar outra solução em vez de forçar."},{"t":"p","x":"Exercício. B aborda em destinos diferentes; A escolhe paralela, cruzada ou lob."},{"t":"p","x":"Variar e observar. Retirar o destino combinado de abordagem. Indicador: Passagens coerentes com posição de B e controle disponível."}]},{"titulo":"Defesa e contra ataque 3","blocos":[{"t":"h","x":"D07 Passagem cruzada"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Ângulo disponível e cobertura de B após a abordagem."},{"t":"p","x":"Decidir. Usar cruzado para afastar a bola do alcance de B quando houver controle. Não tentar ângulo extremo se o contato é baixo e atrasado; considerar bola nos pés."},{"t":"p","x":"Exercício. B muda a direção da abordagem e ajusta a cobertura."},{"t":"p","x":"Variar e observar. Variar altura e velocidade da bola de aproximação. Indicador: Escolha de ângulo sem excesso de risco imposto pelo alvo."},{"t":"h","x":"D08 Passagem em duas bolas"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. B em boa posição de rede, sem janela clara para passar de primeira."},{"t":"p","x":"Decidir. Enviar uma bola que provoque voleio difícil e preparar a segunda passagem. Se surge uma passagem direta acessível, não prolongar por obrigação."},{"t":"p","x":"Exercício. B aproxima; A pode jogar baixo ou ao centro e responder ao voleio seguinte."},{"t":"p","x":"Variar e observar. B passa a variar a profundidade do primeiro voleio. Indicador: Preparação de A para a segunda bola e qualidade da primeira pressão."},{"t":"h","x":"D09 Contra atacar com tempo reduzido"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. Trajetória previsível o suficiente e habilidade para redirecionar em equilíbrio relativo."},{"t":"p","x":"Decidir. Usar velocidade recebida para mudar a iniciativa quando o contato permite. Se não há controle mínimo, neutralizar; defesa não obriga uma resposta passiva nem heroica."},{"t":"p","x":"Exercício. B inicia com ataque moderado. A escolhe neutralização ou contra-ataque e segue."},{"t":"p","x":"Variar e observar. Aumentar incerteza antes de aumentar velocidade. Indicador: Contra-ataques funcionais separados de tentativas sem controle."}]},{"titulo":"Defesa e contra ataque 4","blocos":[{"t":"h","x":"D10 Recuperar lob que passou"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Bola ultrapassou a posição de interceptação confortável."},{"t":"p","x":"Decidir. Girar, deslocar-se com visão possível e reconstruir uma resposta segura após o quique. Não exigir golpe acrobático ou corrida para trás sem controle como solução de formação."},{"t":"p","x":"Exercício. B alterna lob alcançável e profundo após A chegar à rede."},{"t":"p","x":"Variar e observar. Começar a situação a partir de uma abordagem real. Indicador: Decisão de deixar passar e capacidade de reorganizar o ponto."},{"t":"h","x":"D11 Sair de uma sequência defensiva"},{"t":"p","x":"N2 • P1"},{"t":"p","x":"Ler. Uma resposta de B finalmente oferece mais tempo ou menor deslocamento."},{"t":"p","x":"Decidir. Reconhecer a chance de neutralizar e voltar à construção. Não procurar winner na primeira bola menos difícil se B mantém boa posição."},{"t":"p","x":"Exercício. B pressiona por construção própria; A tenta produzir uma bola que interrompa a pressão."},{"t":"p","x":"Variar e observar. Inverter papéis e retirar qualquer limite artificial de bolas. Indicador: Reconhecimento da mudança de estado e redução de ataques precipitados."},{"t":"h","x":"D12 Defender a resposta atrás do deslocamento"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. B muda direção enquanto A recupera lateralmente."},{"t":"p","x":"Decidir. Ajustar o deslocamento à nova bola e priorizar contato possível com margem. Evitar recuperação tão automática que impeça reagir; o ritmo depende do golpe de B."},{"t":"p","x":"Exercício. B alterna espaço aberto e bola atrás de A em troca viva."},{"t":"p","x":"Variar e observar. Variar a velocidade de recuperação de A sem prescrever passos fixos. Indicador: Reação à mudança e qualidade da resposta de recuperação."}]},{"titulo":"Duplas e coordenação da parceria 1","blocos":[{"t":"h","x":"U01 Definir papéis antes do ponto"},{"t":"p","x":"N1 • P1"},{"t":"p","x":"Ler. Lado de saque, posição dos quatro jogadores e padrão combinado."},{"t":"p","x":"Decidir. Combinar uma intenção simples e quem cobre respostas prováveis. Se a bola muda o cenário, adaptar a cobertura e comunicar depois; não seguir plano cego."},{"t":"p","x":"Exercício. Quatro jogadores, formação básica e pontos completos; cada parceria combina um objetivo."},{"t":"p","x":"Variar e observar. Trocar sacador e lados de devolução. Indicador: Clareza de responsabilidade e redução de bolas sem cobertura."},{"t":"h","x":"U02 Devolver cruzado com margem"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Parceiro do sacador na rede e espaço cruzado disponível."},{"t":"p","x":"Decidir. Buscar devolução que evite interceptação fácil e permita entrar no ponto. Se o jogador da rede fecha cedo, paralela ou lob podem ser respostas; não tornar cruzado obrigatório."},{"t":"p","x":"Exercício. Saque e ponto completo com jogador da rede ativo."},{"t":"p","x":"Variar e observar. Variar posição do voleador e destino de saque. Indicador: Devoluções funcionais diante da movimentação real da rede."},{"t":"h","x":"U03 Interceptação combinada"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Plano prévio, qualidade do saque e trajetória alcançável."},{"t":"p","x":"Decidir. Jogador da rede intercepta enquanto parceiro cobre o espaço combinado. Se a bola não é alcançável, não forçar por fidelidade ao sinal; revisar cobertura."},{"t":"p","x":"Exercício. Combinar ficar ou interceptar antes do saque e jogar o ponto livre."},{"t":"p","x":"Variar e observar. Devolvedores podem variar direção e usar lob. Indicador: Coordenação da cobertura e interceptações em bolas possíveis."}]},{"titulo":"Duplas e coordenação da parceria 2","blocos":[{"t":"h","x":"U04 Interceptação pela leitura"},{"t":"p","x":"N2 a N3 • P3"},{"t":"p","x":"Ler. Bola adversária e janela de deslocamento sem antecipação excessiva."},{"t":"p","x":"Decidir. Cruzar para interceptar quando a trajetória oferece vantagem real. Se o movimento abre a paralela sem possibilidade de contato, recuperar e manter a parceria organizada."},{"t":"p","x":"Exercício. Jogos sem sinais obrigatórios; observar tentativas de leitura do jogador da rede."},{"t":"p","x":"Variar e observar. Variar nível e padrão dos devolvedores. Indicador: Interceptações úteis e espaços abandonados prematuramente."},{"t":"h","x":"U05 Devolver paralelo como resposta"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Voleador adversário fecha o centro cedo e existe janela controlável na linha."},{"t":"p","x":"Decidir. Explorar paralela com margem para impedir fechamento confortável. Não usar a paralela como prova de coragem quando saque e contato a tornam inviável."},{"t":"p","x":"Exercício. Voleador alterna manter e fechar; devolvedor escolhe cruzado, paralelo ou lob."},{"t":"p","x":"Variar e observar. Retirar qualquer aviso de movimentação. Indicador: Escolha vinculada à posição e ao tempo disponíveis."},{"t":"h","x":"U06 Lob sobre o jogador da rede"},{"t":"p","x":"N1 a N2 • P2"},{"t":"p","x":"Ler. Voleador próximo e espaço atrás para recuperar a estrutura do ponto."},{"t":"p","x":"Decidir. Usar lob com profundidade funcional e avançar ou reorganizar conforme a resposta. Se o lob fica curto, a parceria precisa defender; não avançar automaticamente."},{"t":"p","x":"Exercício. Pontos com devolução ou troca de fundo; lob é livre e a parceria reage."},{"t":"p","x":"Variar e observar. Adversários variam distância da rede. Indicador: Qualidade do lob e organização dos dois após a bola."}]},{"titulo":"Duplas e coordenação da parceria 3","blocos":[{"t":"h","x":"U07 Jogar baixo contra dois na rede"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Ambos os adversários avançados e ausência de passagem clara."},{"t":"p","x":"Decidir. Buscar contato baixo para provocar voleio difícil e preparar a próxima bola. Lob continua opção se há controle e espaço; não exigir winner entre os dois."},{"t":"p","x":"Exercício. Dois contra dois, uma parceria inicia em aproximação e o ponto continua."},{"t":"p","x":"Variar e observar. Alternar posição inicial e permitir transição dos dois lados. Indicador: Primeiro voleio adversário pressionado e cobertura da resposta."},{"t":"h","x":"U08 Explorar o centro entre adversários"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Espaço entre a dupla e dúvida funcional de cobertura."},{"t":"p","x":"Decidir. Usar alvo central com intenção de reduzir ângulos ou provocar coordenação difícil. Não presumir que o meio está sempre aberto; uma dupla bem posicionada pode interceptar."},{"t":"p","x":"Exercício. Pontos completos com observação da distância entre parceiros."},{"t":"p","x":"Variar e observar. Adversários ajustam cobertura e a parceria atacante precisa variar. Indicador: Uso do centro em relação à posição, não por regra fixa."},{"t":"h","x":"U09 Cobrir lob e trocar posições"},{"t":"p","x":"N1 a N2 • P1"},{"t":"p","x":"Ler. Lob supera um parceiro e o outro tem melhor possibilidade de recuperação."},{"t":"p","x":"Decidir. Comunicar e cobrir a quadra após a troca de função. Se quem recebeu alcança com controle, não trocar sem necessidade; combinar critérios antes."},{"t":"p","x":"Exercício. Adversários alternam lob e passagem; a dupla resolve e segue o ponto."},{"t":"p","x":"Variar e observar. Iniciar o lob em diferentes lados e fases do ponto. Indicador: Comunicação, ausência de colisão e cobertura depois da troca."}]},{"titulo":"Duplas e coordenação da parceria 4","blocos":[{"t":"h","x":"U10 Dois atrás para reorganizar"},{"t":"p","x":"N1 a N2 • P2"},{"t":"p","x":"Ler. Devolução vulnerável ou rede sendo explorada repetidamente."},{"t":"p","x":"Decidir. Testar ambos no fundo para ganhar participação e construir nova chance de avanço. Não transformar a formação em recuo permanente; avançar se a qualidade da bola permitir."},{"t":"p","x":"Exercício. Comparar pequenos blocos com formação básica e dois atrás contra o mesmo padrão de saque."},{"t":"p","x":"Variar e observar. Adversários podem subir ou variar saque. Indicador: Participação no ponto e condições para transição posterior."},{"t":"h","x":"U11 Avançar como parceria"},{"t":"p","x":"N2 • P2"},{"t":"p","x":"Ler. Bola que pressiona adversários e permite ocupação coordenada da rede."},{"t":"p","x":"Decidir. Avançar com cobertura das respostas plausíveis e comunicação simples. Se um parceiro chega atrasado, ajustar distância; não exigir alinhamento rígido em toda situação."},{"t":"p","x":"Exercício. A dupla começa no fundo e pode avançar após construir vantagem."},{"t":"p","x":"Variar e observar. Adversários usam bola baixa e lob para testar coordenação. Indicador: Qualidade da primeira bola de rede e cobertura compartilhada."},{"t":"h","x":"U12 Formações alternativas no saque"},{"t":"p","x":"N3 • P3"},{"t":"p","x":"Ler. Padrão de devolução identificado e domínio de sinais e coberturas."},{"t":"p","x":"Decidir. Testar formação australiana ou em I com destinos e responsabilidades combinados. Voltar à formação básica se a coordenação impede reação; posição legal depende das regras vigentes."},{"t":"p","x":"Exercício. Ensaiar posicionamento sem bola, depois saque e ponto completo contra devolução livre."},{"t":"p","x":"Variar e observar. Comparar resposta adversária entre formação básica e alternativa. Indicador: Mudança útil na devolução sem perda de cobertura ou comunicação."}]},{"titulo":"Como transformar fichas em sessões","blocos":[{"t":"p","x":"As fichas descrevem decisões; os exercícios E01 a E16 organizam sua prática. Um mesmo exercício pode trabalhar várias fichas em sessões diferentes. Escolha uma decisão principal por bloco para que o aluno saiba o que procurar."},{"t":"tab","r":[["Formato","Participantes","Uso principal"],["E01 a E04","Dois e um observador opcional","Diagnóstico, percepção e escolhas básicas"],["E05 a E08","Dois","Construção, primeiras bolas e mudança de direção"],["E09 a E12","Dois","Transição, rede, defesa e estratégia"],["E13 a E14","Dois e treinador","Placar, vídeo e revisão"],["E15","Quatro","Decisão e cobertura em duplas"],["E16","Dois ou quatro","Retenção e transferência"]]},{"t":"p","x":"Rotação. Em turma de quatro numa quadra, dois jogam e dois observam uma única variável por um bloco breve; depois trocam. Também é possível jogar duplas. Evite bolas de estações vizinhas cruzando rotas de corrida. Não organizar quatro jogadores com bola livre em simples no mesmo espaço."},{"t":"p","x":"Aula individual. O treinador pode fazer o papel de B, variando respostas de forma honesta. Como conhece a intenção do aluno e pode facilitar sem perceber, inclua depois oposição de outro jogador. Sem parceiro, tarefas com cesto ajudam a execução, mas o teste tático fica pendente."},{"t":"p","x":"Contagem. Use pontos ou tempo para organizar, sem tratar a quantidade como dose ideal. Nos exemplos, blocos de quatro a seis minutos e pausas breves são opções de logística. Troque papéis e encerre o bloco se a qualidade cai por cansaço."},{"t":"p","x":"Pontuação bônus. Quando usada, deve destacar a decisão e durar pouco. Não premie uma jogada que só é executada para cumprir a regra. Termine com contagem normal para verificar se o comportamento permanece."}]},{"titulo":"Exercícios de aplicação 1","blocos":[{"t":"h","x":"E01 Diagnóstico sem pistas"},{"t":"p","x":"Fichas relacionadas: F01 a F12; S01; R01."},{"t":"p","x":"Montagem. Após aquecimento progressivo, jogar dois blocos de pontos com saque ou início adaptado. Não anunciar o padrão que será avaliado. Manter adversário, bola e espaç

o registrados."},{"t":"p","x":"Tarefa. O observador escolhe uma decisão: atacar ou construir, por exemplo. Anota oportunidades, escolhas e execução em linhas separadas. Não interrompe o ponto para preencher."},{"t":"p","x":"Intervenção. Após o bloco, pedir um exemplo de bola em que o jogador tinha tempo e outro em que não tinha. Escolher apenas o problema mais limitante para o próximo exercício."},{"t":"p","x":"Adaptação. Simplificar equipamento se o ponto não começa. Para avançados, observar dois adversários ou dois momentos de jogo."},{"t":"p","x":"Avaliação. Registrar ajuda recebida, contexto e denominador das oportunidades. Repetir condições comparáveis em outro dia."},{"t":"h","x":"E02 Trocar e escolher espaço"},{"t":"p","x":"Fichas relacionadas: F01; F02; F04; F11."},{"t":"p","x":"Montagem. Dois jogadores em espaço compatível, com bola lenta quando necessário. Marcar duas zonas amplas de destino. Começar cooperativo, enviando bolas possíveis para o parceiro."},{"t":"p","x":"Tarefa. Passar a pontos em que ambos podem escolher o destino. A posição de quem recebe precisa variar, para que exista informação real sobre espaço."},{"t":"p","x":"Intervenção. Perguntar na pausa: qual espaço estava disponível quando você bateu? Não indicar esquerda ou direita antes do contato."},{"t":"p","x":"Adaptação. Reduzir distância e ampliar alvos para N0. Para N2, retirar zonas e acrescentar variação de profundidade."},{"t":"p","x":"Avaliação. Observar espaço escolhido, bolas jogáveis e recuperação. Não medir apenas o comprimento da troca cooperativa."}]},{"titulo":"Exercícios de aplicação 2","blocos":[{"t":"h","x":"E03 Contraste entre pressão e oportunidade"},{"t":"p","x":"Fichas relacionadas: F03; F05; F06; T01."},{"t":"p","x":"Montagem. B alterna bolas que A recebe confortavelmente com bolas que o pressionam. Começar com contrastes claros e ordem não anunciada. Toda bola inicial é seguida de ponto vivo."},{"t":"p","x":"Tarefa. A escolhe manter, pressionar ou ganhar tempo. O treinador pode iniciar com duas intenções e acrescentar a terceira quando houver compreensão."},{"t":"p","x":"Intervenção. Comparar dois pontos nas pausas: em qual você tinha tempo e equilíbrio? Usar o contraste, não uma classificação verbal durante a corrida."},{"t":"p","x":"Adaptação. Facilitar a chegada sem tornar o tipo de bola previsível. Depois aproximar as situações e reduzir a diferença entre oportunidade e neutralidade."},{"t":"p","x":"Avaliação. Separar ataques adequados, ataques forçados e oportunidades não usadas. Considerar a habilidade real do aluno."},{"t":"h","x":"E04 Recuperação ligada à própria bola"},{"t":"p","x":"Fichas relacionadas: F04; F09; D02; D12."},{"t":"p","x":"Montagem. A e B trocam em quadra adequada. A começa escolhendo cruzado ou centro. B tem liberdade de resposta. O foco do observador é A no instante em que B golpeia."},{"t":"p","x":"Tarefa. Não obrigar A a pisar num cone após cada golpe. Marcas podem ilustrar opções entre pontos, mas a posição de cobertura deve mudar com a jogada."},{"t":"p","x":"Intervenção. Perguntar: quais respostas sua bola deixou para B? Relacionar o deslocamento de recuperação à qualidade do golpe enviado."},{"t":"p","x":"Adaptação. Simplificar para meia quadra com duas opções. Progredir incluindo paralela e bola atrás da recuperação."},{"t":"p","x":"Avaliação. Registrar se A consegue reagir às respostas plausíveis, e não se voltou ao centro geométrico."}]},{"titulo":"Exercícios de aplicação 3","blocos":[{"t":"h","x":"E05 Construir antes de mudar"},{"t":"p","x":"Fichas relacionadas: C01 a C06; C12."},{"t":"p","x":"Montagem. Iniciar com troca cruzada. Cada jogador pode mudar direção quando perceber oportunidade. A partir da mudança, usar toda a quadra e jogar até o fim."},{"t":"p","x":"Tarefa. Não estabelecer três cruzadas obrigatórias antes da paralela. Uma sequência inicial breve pode apresentar a tarefa, mas o bloco avaliado precisa permitir mudança por leitura."},{"t":"p","x":"Intervenção. Perguntar o que a bola anterior provocou e se a mudança encontrou A equilibrado. Separar tentativa adequada de execução errada."},{"t":"p","x":"Adaptação. Para simplificar, baixar ritmo e ampliar o alvo. Para progredir, retirar o início cruzado e começar pelo saque."},{"t":"p","x":"Avaliação. Contar mudanças oportunas, mudanças forçadas e cobertura na resposta seguinte."},{"t":"h","x":"E06 Saque com três respostas possíveis"},{"t":"p","x":"Fichas relacionadas: S02 a S11; R02 a R08."},{"t":"p","x":"Montagem. A saca com intenção escolhida. B devolve livremente; inicialmente pode produzir uma combinação de devoluções curtas, neutras e profundas que A não conhece."},{"t":"p","x":"Tarefa. A decide a terceira bola e o ponto continua. B não deve fornecer sempre a devolução ideal para o plano do saque."},{"t":"p","x":"Intervenção. Comparar intenção antes do saque com a resposta realmente recebida. Perguntar: o saque criou a condição que você esperava?"},{"t":"p","x":"Adaptação. Simplificar usando saque controlado e destinos amplos. Progredir com primeiro e segundo saque, efeitos disponíveis e placar normal."},{"t":"p","x":"Avaliação. Separar execução do saque, estado após devolução e decisão na terceira bola. Alternar funções."}]},{"titulo":"Exercícios de aplicação 4","blocos":[{"t":"h","x":"E07 Devolução e cobertura da quarta bola"},{"t":"p","x":"Fichas relacionadas: R01 a R11."},{"t":"p","x":"Montagem. B saca, A devolve e o ponto segue. O observador acompanha a trajetória da devolução e a preparação de A para seu golpe seguinte."},{"t":"p","x":"Tarefa. Variar saque e comportamento do sacador, incluindo permanecer no fundo ou avançar quando o nível permite. A escolhe altura e direção."},{"t":"p","x":"Intervenção. Perguntar: depois da sua devolução, o que B podia fazer? Evitar elogiar uma devolução profunda que deixou A parado."},{"t":"p","x":"Adaptação. Simplificar saque e espaço para aumentar participação. Progredir alterando a posição de recepção e adicionando placar."},{"t":"p","x":"Avaliação. Registrar devoluções funcionais e decisões adequadas na quarta bola; não contar apenas devoluções dentro."},{"t":"h","x":"E08 Contornar ou usar backhand"},{"t":"p","x":"Fichas relacionadas: S07; S08; C07; C08; D03."},{"t":"p","x":"Montagem. B joga bolas variadas no lado do backhand de A, sem exigir forehand. A decide qual golpe usar e o ponto continua com B podendo explorar espaço aberto."},{"t":"p","x":"Tarefa. A tarefa deve oferecer bolas com e sem tempo para contorno. Se todas são fáceis, o exercício avalia principalmente execução de forehand."},{"t":"p","x":"Intervenção. Perguntar: o ganho do forehand compensou o espaço que ficou aberto? Mostrar um exemplo de cada solução funcional."},{"t":"p","x":"Adaptação. Simplificar deslocamento e ritmo. Progredir começando pelo saque e permitindo B mudar direção a qualquer momento."},{"t":"p","x":"Avaliação. Registrar decisão de golpe, equilíbrio e resposta adversária. Evitar tratar o backhand como opção inferior por definição."}]},{"titulo":"Exercícios de aplicação 5","blocos":[{"t":"h","x":"E09 Entrar com a bola certa"},{"t":"p","x":"Fichas relacionadas: T01 a T07; N01 a N05."},{"t":"p","x":"Montagem. B alterna bolas neutras, curtas altas e curtas baixas em troca viva. A decide ficar, avançar parcialmente ou abordar. Não há obrigação de rede."},{"t":"p","x":"Tarefa. Depois da entrada, B pode passar, lobar ou neutralizar. A deve escolher também a função do primeiro voleio."},{"t":"p","x":"Intervenção. Comparar a bola que permitiu finalizar com a que exigiu construção. Perguntar como a abordagem mudou a resposta de B."},{"t":"p","x":"Adaptação. Simplificar com bola lenta e espaço menor. Progredir retirando a oferta de curta: A precisa produzi-la."},{"t":"p","x":"Avaliação. Registrar entrada adequada, qualidade da abordagem e escolha no primeiro voleio como três eventos diferentes."},{"t":"h","x":"E10 Passar em uma ou duas bolas"},{"t":"p","x":"Fichas relacionadas: D05 a D08; N01; N07."},{"t":"p","x":"Montagem. B constrói ou recebe uma condição de abordagem. A tem passagem, lob e bola baixa disponíveis. Continuar o ponto após o primeiro voleio."},{"t":"p","x":"Tarefa. B deve variar destino e qualidade da aproximação. O objetivo de A é encontrar uma resposta funcional, não acertar uma passagem obrigatória."},{"t":"p","x":"Intervenção. Perguntar: havia janela de passagem imediata ou era melhor dificultar o voleio? Rever a prontidão para a segunda bola."},{"t":"p","x":"Adaptação. Simplificar velocidade e posição da aproximação. Progredir iniciando o ponto no fundo e deixando B decidir subir."},{"t":"p","x":"Avaliação. Registrar escolha inicial e qualidade da continuação, inclusive quando A perde o ponto após decisão adequada."}]},{"titulo":"Exercícios de aplicação 6","blocos":[{"t":"h","x":"E11 Neutralizar para voltar ao ponto"},{"t":"p","x":"Fichas relacionadas: F03; F10; C12; D01 a D04; D11."},{"t":"p","x":"Montagem. B inicia com uma vantagem moderada, produzida por uma bola de jogo. A procura recuperar uma situação jogável. Depois, ambos disputam livremente."},{"t":"p","x":"Tarefa. Não obrigar A a defender um número fixo de bolas. Assim que o estado muda, sua intenção pode mudar também."},{"t":"p","x":"Intervenção. Perguntar qual resposta de A diminuiu a pressão e em qual bola B recuperou controle. Trabalhar transições, não rótulos permanentes."},{"t":"p","x":"Adaptação. Simplificar o deslocamento inicial. Progredir com B criando a vantagem desde uma troca neutra."},{"t":"p","x":"Avaliação. Registrar neutralizações e ataques precipitados após a defesa. Não pontuar só a sobrevivência em qualquer qualidade."},{"t":"h","x":"E12 Plano de jogo como hipótese"},{"t":"p","x":"Fichas relacionadas: F12; S12; R12; C03; C11."},{"t":"p","x":"Montagem. Antes de um bloco de games, A escolhe uma hipótese com base em observação: testar bola alta ao backhand, por exemplo. Define também uma alternativa."},{"t":"p","x":"Tarefa. Jogar sem obrigação de executar o plano quando a bola recebida não permite. B não coopera e pode adaptar seu jogo."},{"t":"p","x":"Intervenção. Na troca de lado, perguntar o que A tentou provocar e quais respostas observou. Solicitar exemplos, não apenas venceu ou perdeu."},{"t":"p","x":"Adaptação. Para N1, usar uma intenção simples sobre espaço. Para N3, acrescentar um segundo padrão e outro adversário."},{"t":"p","x":"Avaliação. Registrar ocasiões em que o plano era executável, resposta obtida e motivo de manutenção ou mudança."}]},{"titulo":"Exercícios de aplicação 7","blocos":[{"t":"h","x":"E13 Mesma decisão com placar"},{"t":"p","x":"Fichas relacionadas: S05; R06; F10; contexto de pontuação."},{"t":"p","x":"Montagem. Usar primeiro games normais; depois iniciar alguns em 30 iguais ou jogar um tie-break. Manter a decisão tática escolhida no bloco anterior."},{"t":"p","x":"Tarefa. Não anunciar que o jogador deve ser conservador em ponto importante. A margem deve combinar contexto, recursos e bola recebida."},{"t":"p","x":"Intervenção. Observar se ele muda de comportamento de forma funcional ou abandona a leitura. Conversar apenas nas pausas naturais."},{"t":"p","x":"Adaptação. Para iniciantes, usar contagem simples e curta. Progredir para formatos do ambiente competitivo habitual."},{"t":"p","x":"Avaliação. Comparar escolhas em oportunidades semelhantes com e sem pressão de placar, sem atribuir toda diferença à ansiedade."},{"t":"h","x":"E14 Revisão com vídeo e retorno à quadra"},{"t":"p","x":"Fichas relacionadas: Qualquer família."},{"t":"p","x":"Montagem. Selecionar três ou quatro pontos do próprio jogador, com autorização apropriada para uso do registro. Incluir boas escolhas com erro e escolhas discutíveis com sucesso."},{"t":"p","x":"Tarefa. Pausar antes da consequência final. Pedir que o jogador indique sinais e alternativas; depois mostrar o resultado e discutir a interpretação."},{"t":"p","x":"Intervenção. Escolher uma única hipótese de melhoria e testá-la em quadra. O vídeo complementa a ação; não substitui o treino com adversário."},{"t":"p","x":"Adaptação. Para crianças, usar comparação visual breve e linguagem concreta. Para avançados, incluir sequência anterior ao lance."},{"t":"p","x":"Avaliação. Verificar se a leitura discutida aparece na quadra sem comando. O formato específico aqui é proposta de aplicação. [R05]"}]},{"titulo":"Exercícios de aplicação 8","blocos":[{"t":"h","x":"E15 Duplas com decisão da parceria"},{"t":"p","x":"Fichas relacionadas: U01 a U12."},{"t":"p","x":"Montagem. Quatro jogadores em formação adequada ao nível. Antes do ponto, uma parceria combina uma intenção e cobertura; a outra joga livremente."},{"t":"p","x":"Tarefa. Alternar temas por bloco: devolução e rede, interceptação, lob e troca ou avanço conjunto. Não ensinar todos simultaneamente."},{"t":"p","x":"Intervenção. Perguntar quem tinha melhor condição de alcançar a bola e como o parceiro cobriu a resposta. Observar comunicação sem gritos a cada golpe."},{"t":"p","x":"Adaptação. Simplificar com bola mais lenta e formação básica. Progredir com destinos de saque e formações alternativas quando houver domínio."},{"t":"p","x":"Avaliação. Registrar decisões da parceria, coberturas e comunicação, sem atribuir toda falha ao jogador que tocou por último."},{"t":"h","x":"E16 Retenção e transferência sem lembrete"},{"t":"p","x":"Fichas relacionadas: Qualquer família."},{"t":"p","x":"Montagem. Em outra sessão, após aquecer, jogar antes de recordar a solução. Usar condições comparáveis para retenção; depois mudar adversário ou contexto para transferência."},{"t":"p","x":"Tarefa. Registrar as mesmas definições de oportunidade e escolha utilizadas anteriormente. Não confundir um teste com ajuda do treinador com autonomia."},{"t":"p","x":"Intervenção. Dar retorno somente após o bloco de observação. Se a escolha não aparece, investigar se faltaram oportunidades ou se o contexto ficou difícil demais."},{"t":"p","x":"Adaptação. Mudar uma condição por vez quando quiser entender a causa. Para generalização mais ampla, testar combinações posteriormente."},{"t":"p","x":"Avaliação. Comparar contagens e exemplos, incluindo o tamanho da amostra. Uma sessão boa não comprova estabilidade permanente."}]},{"titulo":"Matriz para gerar variações","blocos":[{"t":"p","x":"Uma situação não precisa virar dezenas de fichas repetidas. Use os eixos abaixo para variar a mesma decisão. Escolha uma mudança inicial e observe se ela preserva o problema que se deseja ensinar."},{"t":"tab","r":[["Eixo","Variações possíveis","Pergunta para o treinador"],["Origem","Saque, devolução, troca neutra, ataque, defesa","A bola nasce de uma ação parecida com a partida?"],["Bola","Curta ou profunda; baixa ou alta; lenta ou rápida; diferentes efeitos","O jogador ainda consegue perceber e escolher?"],["Posição de A","Dentro, sobre ou atrás da linha; aberto ou central","A resposta proposta é executável daqui?"],["Posição de B","Equilibrado, deslocado, recuperando, avançando ou na rede","Que alternativa a mudança abre ou fecha?"],["Tempo","Mais ou menos preparação e recuperação","O aluno precisa defender ou pode pressionar?"],["Intenção","Neutralizar, construir, pressionar, finalizar","A intenção mudou por leitura ou por ordem?"],["Lateralidade","Destro, canhoto, golpes de uma ou duas mãos","Quais direções levam a qual golpe nesta combinação?"],["Contexto","Placar, adversário, superfície, vento e bola","A solução continua funcional?"],["Organização","Individual, turma, parceria de duplas","Há participação e oposição suficientes?"]]},{"t":"p","x":"Exemplo: S02 com destro contra canhoto, devolvedor recuado e bola alta profunda após o saque. A intenção de abrir permanece; a terceira bola pode pedir construção. Não classificar como erro tático apenas porque A não jogou no espaço aberto."},{"t":"p","x":"Essa matriz amplia o catálogo sem afirmar que qualquer combinação é igualmente frequente ou igualmente importante. Registre as variantes que aparecem no seu grupo e aumente a prioridade das mais relevantes."}]},{"titulo":"Placar e momento do ponto","blocos":[{"t":"p","x":"As respostas abaixo são hipóteses de aplicação a verificar no jogador e nas condições reais. Não são efeitos universais garantidos."},{"t":"p","x":"X01 Início do game. Observar padrões sem usar o primeiro ponto como conclusão definitiva. Testar destinos executáveis de saque e devolução."},{"t":"p","x":"X02 30 iguais e deuce. Manter leitura da bola e usar soluções conhecidas quando adequadas. O placar não transforma bola defensiva em ataque obrigatório."},{"t":"p","x":"X03 Break point no saque. Planejar saque e possível resposta à devolução, incluindo defesa. Não ordenar saque fraco nem máxima potência por princípio."},{"t":"p","x":"X04 Break point na devolução. Escolher posição e intenção compatíveis com o saque observado. Entrar no ponto com qualidade pode ser melhor que buscar winner imediato."},{"t":"p","x":"X05 Segundo saque após falta. Retomar alvo e rotina funcional, sem reconstruir toda a técnica naquele instante. Treinar a continuação, não apenas acertar o saque."},{"t":"p","x":"X06 Fechamento de set ou partida. Testar a capacidade de manter intenção e margem em oportunidades semelhantes às anteriores. Avaliar a decisão, não o resultado isolado."},{"t":"p","x":"X07 Tie break. Trabalhar alternância de saque e lados com o formato aplicável. Preparar intenções curtas e alternativas para a resposta recebida."},{"t":"p","x":"X08 Após erro ou ponto longo. Reorganizar atenção e plano entre pontos. Se fadiga altera a execução, ajustar a solução disponível; evitar punição ou distração artificial."}]},{"titulo":"Características observáveis do adversário","blocos":[{"t":"p","x":"As respostas abaixo são hipóteses de aplicação a verificar no jogador e nas condições reais. Não são efeitos universais garantidos."},{"t":"p","x":"X09 Grande consistência. Testar profundidade, altura, ângulo ou avanço para produzir resposta diferente. Aumentar potência sem critério pode apenas aumentar erros."},{"t":"p","x":"X10 Golpes agressivos de fundo. Investigar se mudança de altura, profundidade ou tempo reduz conforto. Contra-atacar só quando houver contato possível."},{"t":"p","x":"X11 Jogo recuado. Explorar distância por ângulo, tomada de tempo, aproximação ou deixada disponível. Não usar deixada em toda bola confortável."},{"t":"p","x":"X12 Contato muito cedo. Variar altura e profundidade para testar adaptação; não presumir que bola alta o incomoda. Observar o contato real."},{"t":"p","x":"X13 Bom saque e terceira bola. Buscar uma devolução que altere o padrão preferido, com posição e alvo sustentáveis. Rever a quarta bola do devolvedor."},{"t":"p","x":"X14 Segundo saque vulnerável. Pressionar quando o quique e o equilíbrio permitem, comparando controle e risco. Evitar avançar apenas pelo rótulo de segundo saque."},{"t":"p","x":"X15 Saque e voleio. Preparar devolução baixa, passagem e lob. A escolha depende da bola recebida e da posição do adversário."},{"t":"p","x":"X16 Assimetria entre golpes. Confirmar a diferença em várias situações e alturas. Um backhand sólido pode neutralizar melhor que um forehand potente, porém irregular."}]},{"titulo":"Lateralidade e resposta à adaptação","blocos":[{"t":"p","x":"As respostas abaixo são hipóteses de aplicação a verificar no jogador e nas condições reais. Não são efeitos universais garantidos."},{"t":"p","x":"X17 Destro contra canhoto. Identificar antes do exercício qual alvo chega ao forehand e ao backhand em cada lado de saque. Não espelhar só os cones sem revisar a sequência."},{"t":"p","x":"X18 Jogador que contorna muito. Testar se a abertura deixada pode ser explorada com controle. Se o forehand invertido pressiona, primeiro neutralizar."},{"t":"p","x":"X19 Jogador que recupera cedo. Comparar espaço aberto e bola atrás. A decisão depende do movimento no contato, e não da intenção prevista antes da troca."},{"t":"p","x":"X20 Jogador que muda o plano. Reconhecer a alteração por exemplos e atualizar a hipótese. Não insistir apenas porque a estratégia anterior funcionou no primeiro set."},{"t":"p","x":"X21 Rival desconhecido. Usar os primeiros games para testar respostas com soluções disponíveis. Manter registro de hipóteses, não rótulos definitivos."},{"t":"p","x":"X22 Rival conhecido. Usar tendências anteriores como hipótese e atualizar com o jogo atual. Condições, confiança e recursos podem ser diferentes."},{"t":"p","x":"X23 Diferença de alcance ou mobilidade. Escolher soluções que façam sentido para os dois jogadores reais. Não usar estatura ou idade como prova automática de dificuldade específica."},{"t":"p","x":"X24 Mesmo adversário por muitas sessões. Verificar se o aluno aprendeu a situação ou apenas a rotina do parceiro. Alternar oponentes quando possível, mantendo registro da mudança."}]},{"titulo":"Ambiente e condições de execução","blocos":[{"t":"p","x":"As respostas abaixo são hipóteses de aplicação a verificar no jogador e nas condições reais. Não são efeitos universais garantidos."},{"t":"p","x":"X25 Saibro. Observar o quique e a velocidade reais da quadra. Preparar construção, altura, recuperação e transição; deslize exige habilidade própria e não é requisito imposto pelo exercício."},{"t":"p","x":"X26 Quadra dura ou mais rápida. Verificar tempo disponível e regular posições e preparação. O nome da superfície, sozinho, não determina o ritmo de todas as bolas."},{"t":"p","x":"X27 Grama ou quique mais baixo. Testar contatos baixos, transição e devolução conforme o quique observado. Evitar aplicar automaticamente o mesmo espaço e alvo de outra quadra."},{"t":"p","x":"X28 Vento a favor ou contra. Observar como trajetória e profundidade mudam em cada lado. Ajustar alvo e margem, testando antes de concluir que precisa bater mais forte."},{"t":"p","x":"X29 Vento lateral ou sol. Reavaliar alvos, leitura do voo e posição. No saque e smash, adaptar decisões às condições visuais; não insistir em tarefas com visão comprometida."},{"t":"p","x":"X30 Bola diferente ou desgastada. Observar velocidade e quique no aquecimento e registrar a condição. Não comparar testes como se o material fosse idêntico."},{"t":"p","x":"X31 Cansaço e atenção em queda. Reduzir volume ou complexidade quando a qualidade deixa de refletir a intenção. Dor ou mal-estar pedem interrupção e avaliação adequada, não treino de resistência mental."},{"t":"p","x":"X32 Piso molhado ou instável. Interromper tarefas com deslocamento quando a aderência não permite prática segura. Regras de pontuação não compensam um ambiente inadequado."}]},{"titulo":"Sessões de referência","blocos":[{"t":"p","x":"A organização abaixo reserva espaço para decisão, oposição e observação. Os minutos são sugestões de logística. Ajuste pausas e volume à idade, ao ambiente e à disponibilidade física; os blocos incluem organização e retornos breves."},{"t":"tab","r":[["Bloco","45 minutos","60 minutos","90 minutos"],["Aquecimento e leitura inicial","8","10","12"],["Situação simples com escolha","10","12","18"],["Variação e construção","12","16","25"],["Jogo com placar sem ajuda","10","16","25"],["Revisão e próximo objetivo","5","6","10"]]},{"t":"h","x":"Exemplo de 60 minutos para iniciação"},{"t":"p","x":"Tema: reconhecer espaço e recuperar. Usar F01, F02 e F04; organizar com E02 e E04. Começar com bola e quadra que permitam troca. No jogo final, retirar zonas obrigatórias e observar se a escolha continua aparecendo."},{"t":"h","x":"Exemplo de 60 minutos para construção"},{"t":"p","x":"Tema: saque + 1 adaptável. Usar S02, S10 e S11 com E06. A mesma intenção de saque deve encontrar devoluções diferentes. O jogo final inclui primeiro e segundo saque e permite ao jogador mudar o alvo."},{"t":"h","x":"Exemplo de 90 minutos para desenvolvimento competitivo"},{"t":"p","x":"Tema: construir e finalizar com resposta adversária. Usar C05, T06, N01 e N12. Organizar E05, E09 e E12, priorizando uma decisão por bloco. O jogo com placar testa a estratégia sem bônus."},{"t":"p","x":"Evite preencher a sessão com todas as fichas citadas se o objetivo central ainda não ficou claro. Os códigos funcionam como opções de seleção, não como lista obrigatória de exercícios."}]},{"titulo":"Ciclo inicial de oito sessões","blocos":[{"t":"p","x":"Exemplo de implantação, sem promessa de concluir a aprendizagem em oito aulas. Na abertura de cada encontro, retestar um problema anterior sem lembrete. Se o aluno ainda não participa das situações, adaptar o ambiente antes de avançar."},{"t":"tab","r":[["Sessão","Problema principal","Fichas e formato","Teste final"],["1","Participar e reconhecer espaço","F01 F02 F04; E01 E02","Pontos adaptados sem alvo obrigatório"],["2","Distinguir tempo e pressão","F03 F05 F06; E03","Bolas variadas sem aviso"],["3","Construir com profundidade","F08 C01 C02; E05","Jogo livre com mudança de direção"],["4","Sacar e preparar próxima bola","S01 S05 S10 S11; E06","Games com saque adequado ao nível"],["5","Devolver e reorganizar","R01 R03 R11; E07","Jogo sem destino fixo de devolução"],["6","Entrar e lidar com resposta","T01 T02 T06 N01; E09","Subida decidida pelo jogador"],["7","Defender e retomar iniciativa","D02 D05 D08 D11; E10 E11","Pontos com estados variáveis"],["8","Planejar e transferir","F12; E12 E16","Outro adversário e revisão do ciclo"]]},{"t":"p","x":"Para quem está em N0, uma mesma sessão pode ser desdobrada em vários encontros. Para N3, iniciar por diagnóstico competitivo e selecionar os gargalos, sem repetir uma sequência de iniciação já dominada."},{"t":"p","x":"No ciclo seguinte, retomar o repertório com outras respostas e acrescentar jogo curto, rede, contextos e duplas. A progressão é em espiral: o mesmo problema reaparece com mais exigência e autonomia."}]},{"titulo":"Exemplo de aplicação de uma jogada ao longo do ciclo","blocos":[{"t":"h","x":"Saque aberto e primeira bola"},{"t":"p","x":"Hipótese. O saque aberto desloca B e pode oferecer uma terceira bola para pressionar. A hipótese inclui a possibilidade de B devolver profundo ou recuperar cedo."},{"t":"p","x":"Primeiro encontro. E01 mostra que A joga sempre no espaço aberto, mesmo atrasado. E06 simplifica o saque e alterna devoluções curtas e profundas. A aprende a reconhecer se a terceira bola permite pressão."},{"t":"p","x":"Segundo encontro. Antes do lembrete, jogar alguns pontos comparáveis. Depois, B varia a recuperação: deixa espaço, volta cedo ou muda a direção. A escolhe espaço aberto, bola atrás ou construção."},{"t":"p","x":"Terceiro encontro. Adicionar segundo saque e devolução agressiva. A precisa defender quando necessário. Não considerar abandono do padrão um erro se B neutralizou a vantagem."},{"t":"p","x":"Quarto encontro. Jogar games com plano de saque e avaliação da resposta. Registrar oportunidades por tipo de devolução. Usar outro parceiro para verificar se a leitura se mantém."},{"t":"p","x":"Registro ilustrativo. Em um bloco, surgiram oito terceiras bolas favoráveis: A aproveitou cinco. Houve também três ataques forçados entre sete bolas sem condição favorável. Esses números são um exemplo inventado de registro, não um resultado esperado nem um limiar de aprovação."},{"t":"p","x":"Decisão do treinador. Se as escolhas melhoram e os erros de execução permanecem, trabalhar alvo e controle mantendo a leitura. Se só melhora quando B facilita, ampliar contraste e revisar o teste livre. Se quase não há oportunidade, primeiro investigar a qualidade do saque e da devolução, sem atribuir tudo à tomada de decisão."}]},{"titulo":"Medidas de aprendizagem em quadra","blocos":[{"t":"p","x":"As medidas precisam responder ao objetivo da tarefa. Defina o que conta como oportunidade antes do bloco e aceite mais de uma solução adequada. Registre dúvidas como indeterminadas, em vez de forçar uma classificação."},{"t":"tab","r":[["Indicador","Como calcular ou descrever"],["Aproveitamento de oportunidade","Escolhas adequadas de pressão divididas pelas oportunidades favoráveis observadas"],["Ataque forçado","Ataques sem condição favorável divididos pelas situações sem condição favorável"],["Execução da intenção","Execuções funcionais divididas pelas tentativas com escolha considerada adequada"],["Autonomia","Descrever se ocorreu sem aviso, com pergunta posterior ou com comando prévio"],["Retenção","Repetir medida em outro dia sob condições comparáveis, sem lembrete inicial"],["Transferência","Repetir em adversário ou contexto diferente, registrando o que mudou"]]},{"t":"p","x":"Se não houve oportunidades, não calcular a taxa. Sempre apresentar contagem junto da porcentagem: 6 de 10 informa mais que 60% sozinho. Não comparar diretamente 6 de 10 contra iniciante com 6 de 10 contra um adversário muito mais forte."},{"t":"p","x":"Momento da classificação. Julgar a condição de escolha antes de ver o desfecho, quando possível. No vídeo, pausar no momento do golpe ajuda a reduzir o viés do resultado."},{"t":"p","x":"Concordância entre professores. Dois observadores podem classificar uma pequena amostra e discutir divergências. Refinar as definições antes de usar o registro para avaliar evolução. A ficha proposta aqui não é uma escala psicométrica validada."},{"t":"p","x":"Interpretação. Melhora observada junto a um ciclo não prova que ele foi a única causa. Adversário, bola, frequência de prática e desenvolvimento técnico também influenciam. Use os dados para ajustar o ensino e reúna exemplos de jogo."}]},{"titulo":"Implantação com professores e jogadores","blocos":[{"t":"p","x":"Primeira semana. Escolher uma turma e dois problemas frequentes. Observar o jogo, acordar definições simples e aplicar poucas tarefas. O objetivo inicial é conseguir usar e registrar o método sem interromper continuamente a aula."},{"t":"p","x":"Calibração. Reunir os professores com pequenos trechos de jogo. Cada um classifica a condição antes da escolha e explica o motivo. Discutir diferenças de interpretação e ajustar a linguagem comum."},{"t":"p","x":"Registro enxuto. Por sessão, guardar situação trabalhada, uma contagem de oportunidade, uma medida de escolha, uma de execução e um exemplo. O registro pode ser digitado ou ditado após o bloco; não precisa acompanhar cada golpe de toda a aula."},{"t":"p","x":"Retorno ao jogador. Apresentar uma conquista observável e um próximo objetivo. Exemplo: você já reconhece a devolução curta; agora vamos trabalhar a curta baixa, que pede outra margem. Não comunicar apenas nota ou ranking."},{"t":"p","x":"Retorno aos responsáveis. Explicar o problema, o comportamento aprendido e como foi verificado. Evitar prometer resultados de torneio ou atribuir cada erro a falta de coragem, concentração ou vontade."},{"t":"p","x":"Revisão do catálogo. Adicionar uma variante quando surgir uma decisão nova relevante, e não para multiplicar nomes da mesma tarefa. Preservar código, objetivo, condição de uso e critério de observação."},{"t":"p","x":"Validação local. Depois de ciclos sucessivos, comparar exemplos e contagens com contexto semelhante. Ajustar o que não produz participação ou transferência. Para afirmar eficácia científica própria, seria necessário um estudo planejado, com medidas confiáveis e desenho adequado."},{"t":"p","x":"Uma futura organização na Quadra Lab pode usar os campos desta ficha: jogador, competência funcional, situação, sinais, exercício, ajuste, decisão, execução e teste posterior. A plataforma deve servir ao professor com poucos registros úteis, não acrescentar uma ficha longa a cada ponto."}]},{"titulo":"Vocabulário de trabalho","blocos":[{"t":"tab","r":[["Termo","Significado neste manual"],["Aprendizagem","Mudança relativamente persistente na capacidade, inferida por retenção e transferência"],["Desempenho","O que o jogador consegue fazer nas condições daquele momento"],["Retenção","Manutenção em teste posterior sob condições comparáveis"],["Transferência","Uso do aprendido em outra tarefa, adversário ou contexto"],["Representatividade","Presença de informações e ações relevantes do jogo na tarefa"],["Restrição da tarefa","Regra, espaço, material ou objetivo que modifica possibilidades de ação"],["Interferência contextual","Exigência criada ao alternar habilidades ou tarefas na prática"],["Foco externo","Atenção dirigida ao efeito da ação, como trajetória ou alvo"],["Neutralizar","Reduzir a vantagem do adversário e recuperar uma situação jogável"],["Construir","Modificar o ponto para criar uma condição mais favorável"],["Pressionar","Reduzir tempo, espaço ou conforto do adversário com uma ação funcional"],["Finalizar","Buscar encerrar quando a situação oferece uma solução acessível"],["Padrão de jogo","Relação recorrente entre situação e respostas, com possibilidade de adaptação"],["Estratégia","Hipótese de organização do jogo para explorar condições do confronto"],["Tática","Escolhas e ajustes realizados nas situações concretas do ponto"]]},{"t":"p","x":"A linguagem pode ser simplificada para crianças e iniciantes. As definições organizam a comunicação entre professores; não exigem que o jogador pense verbalmente em todos esses termos enquanto joga."}]},{"titulo":"Referências e alcance da evidência 1","blocos":[{"t":"p","x":"As referências sustentam os princípios discutidos no texto. As 96 fichas, os exercícios E01 a E16, os contextos X01 a X32 e os modelos de registro são propostas pedagógicas deste manual. Não foram individualmente testados nos estudos citados."},{"t":"h","x":"R01"},{"t":"p","x":"Karni A et al. 1995. Functional MRI evidence for adult motor cortex plasticity during motor skill learning. Nature 377, 155-158."},{"t":"p","x":"https://doi.org/10.1038/377155a0"},{"t":"p","x":"Estudo humano de sequência motora e imagem funcional. Fundamenta plasticidade associada à aprendizagem; não valida exercícios táticos de tênis."},{"t":"h","x":"R02"},{"t":"p","x":"Broadbent DP, Causer J, Ford PR, Williams AM. 2015. Contextual interference effect on perceptual-cognitive skills training. Medicine & Science in Sports & Exercise 47, 1243-1250."},{"t":"p","x":"https://doi.org/10.1249/MSS.0000000000000530"},{"t":"p","x":"Treino de antecipação no tênis com retenção e transferência. As conclusões se referem ao protocolo investigado."},{"t":"h","x":"R03"},{"t":"p","x":"Buszard T, Reid M, Krause L, Kovalchik S, Farrow D. 2017. Quantifying Contextual Interference and Its Effect on Skill Transfer in Skilled Youth Tennis Players. Frontiers in Psychology 8, 1931."},{"t":"p","x":"https://doi.org/10.3389/fpsyg.2017.01931"},{"t":"p","x":"Inclui intervenção com 16 juvenis. O teste fechado e o jogo apresentaram respostas diferentes à organização da prática."},{"t":"h","x":"R04"},{"t":"p","x":"Broadbent DP, Ford PR, O’Hara DA, Williams AM, Causer J. 2017. The effect of a sequential structure of practice for the training of perceptual-cognitive skills in tennis. PLOS ONE 12, e0174311."},{"t":"p","x":"https://doi.org/10.1371/journal.pone.0174311"},{"t":"p","x":"Treino por vídeo preservando ou alterando sequência do ponto. Não implica que toda repetição deva seguir uma ordem fixa."}]},{"titulo":"Referências e alcance da evidência 2","blocos":[{"t":"h","x":"R05"},{"t":"p","x":"García-González L, Moreno MP, Moreno A, Gil A, del Villar F. 2013. Effectiveness of a Video-Feedback and Questioning Programme to Develop Cognitive Expertise in Sport. PLOS ONE 8, e82270."},{"t":"p","x":"https://doi.org/10.1371/journal.pone.0082270"},{"t":"p","x":"Pequena amostra de tenistas intermediários. Estuda vídeo e questionamento em conjunto, não o efeito isolado de cada recurso."},{"t":"h","x":"R06"},{"t":"p","x":"García-González L, Moreno A, Gil A, Moreno MP, del Villar F. 2014. Effects of Decision Training on Decision Making and Performance in Young Tennis Players: An Applied Research. Journal of Applied Sport Psychology 26, 426-440."},{"t":"p","x":"https://doi.org/10.1080/10413200.2014.917441"},{"t":"p","x":"Programa de dez semanas com avaliação posterior. Tratar com cautela a independência em relação a publicações relacionadas do grupo."},{"t":"h","x":"R07"},{"t":"p","x":"Krause L, Farrow D, Buszard T, Pinder R, Reid M. 2019. Application of representative learning design for assessment of common practice tasks in tennis. Psychology of Sport and Exercise."},{"t":"p","x":"https://doi.org/10.1016/j.psychsport.2018.11.008"},{"t":"p","x":"Comparação transversal entre tarefas e partidas. Mostra diferenças de comportamento; não demonstra sozinha uma relação causal de aprendizagem."},{"t":"h","x":"R08"},{"t":"p","x":"Krause L, Farrow D, Pinder R, Buszard T, Kovalchik S, Reid M. 2019. Enhancing skill transfer in tennis using representative learning design. Journal of Sports Sciences 37."},{"t":"p","x":"https://doi.org/10.1080/02640414.2019.1647739"},{"t":"p","x":"Intervenção de seis semanas com 33 participantes. Aumentar representatividade não melhorou linearmente todas as variáveis."}]},{"titulo":"Referências e alcance da evidência 3","blocos":[{"t":"h","x":"R09"},{"t":"p","x":"Farrow D, Reid M. 2010. The effect of equipment scaling on the skill acquisition of beginning tennis players. Journal of Sports Sciences 28, 723-732."},{"t":"p","x":"https://doi.org/10.1080/02640411003770238"},{"t":"p","x":"Intervenção com equipamento e espaço adaptados. A escolha de escala para um aluno ainda requer observação funcional."},{"t":"h","x":"R10"},{"t":"p","x":"International Tennis Federation. Tennis Play and Stay. Página oficial consultada em 8 de novembro de 2026."},{"t":"p","x":"https://www.itftennis.com/en/growing-the-game/itf-tennis-play-and-stay/"},{"t":"p","x":"Orientação institucional para iniciar sacando, trocando e contando pontos com material adequado. É diretriz de prática, não ensaio experimental."},{"t":"h","x":"R11"},{"t":"p","x":"Tapan T, Şahan A, Erman KA. 2023. The effect of internal and external focus of attention on tennis skill acquisition in children. Frontiers in Psychology 14, 1308244."},{"t":"p","x":"https://doi.org/10.3389/fpsyg.2023.1308244"},{"t":"p","x":"Sessenta crianças. O resultado favoreceu foco externo no teste de habilidade; não houve superioridade entre os dois focos no teste de transferência."},{"t":"h","x":"R12"},{"t":"p","x":"Shea CH, Lai Q, Black C, Park JH. 2000. Spacing practice sessions across days benefits the learning of motor skills. Human Movement Science 19, 737-760."},{"t":"p","x":"https://www.sciencedirect.com/science/article/pii/S016794570000021X"},{"t":"p","x":"Experimentos com equilíbrio e temporização de teclas. Evidência indireta para tênis; não define a duração ideal dos blocos deste manual."}]},{"titulo":"Referências e alcance da evidência 4","blocos":[{"t":"h","x":"R13"},{"t":"p","x":"Kvint S et al. 2011. Acquisition and retention of motor sequences: The effects of time of the day and sleep. Archives Italiennes de Biologie 149(3)."},{"t":"p","x":"https://doi.org/10.4449/aib.v149i3.1244"},{"t":"p","x":"Estudo de sequências motoras, não de decisões táticas em partidas. A extrapolação para a organização de treino deve ser limitada."},{"t":"h","x":"R14"},{"t":"p","x":"Kovalchik SA, Reid M. 2017. Comparing Matchplay Characteristics and Physical Demands of Junior and Professional Tennis Athletes in the Era of Big Data. Journal of Sports Science and Medicine 16, 489-497."},{"t":"p","x":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5721178/"},{"t":"p","x":"Comparação observacional entre juvenis e profissionais. Não fornece uma frequência universal de cada jogada para iniciantes."},{"t":"h","x":"R15"},{"t":"p","x":"Krause L, Farrow D, Reid M, Buszard T, Pinder R. 2018. Helping coaches apply the principles of representative learning design: validation of a tennis specific practice assessment tool. Journal of Sports Sciences 36, 1277-1286."},{"t":"p","x":"https://doi.org/10.1080/02640414.2017.1374684"},{"t":"p","x":"Referência para avaliação de representatividade. As fichas de observação deste manual são próprias e não devem ser apresentadas como a ferramenta RPAT validada."}]}];

<script>/* QuadraLab Tática · protótipo (pedidos do Richard em 14/11/2026: "Faça o app separado... só um protótipo" e "pense em um app que seja
   uma solução para o jogador de tênis que não sabe o que fazer em quadra e possa aprender com a plataforma"). Sem publicar.
   O jogador conta onde trava (diagnóstico) → o app monta uma trilha de situações do manual do Richard → cada situação é um ciclo:
   entender → decidir no app (Pausa e decide) → simulador → treinar em quadra → usar no jogo (plano + registro) → revisar em outro dia.
   Conteúdo: as 96 situações (mty/situacoes-jogo.js, sem mudar o arquivo), o manual completo (manual-completo.js), o Simulador de Decisões
   (autonomo/decisoes) e vídeos do YouTube com pausa na decisão. Sem conta, sem servidor, sem IA e sem cobrança: tudo no aparelho ("qlt:v1"). */
(function () {
  "use strict";
  var S = window.MTYSituacoes, MAN = window.QLTManual || [], app = document.getElementById("app");
  if (!S) { app.innerHTML = '<p class="cartao">Não foi possível carregar o manual tático.</p>'; return; }

  /* ── utilidades ── */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(sel) { return app.querySelector(sel); }
  function cada(sel, f) { Array.prototype.forEach.call(app.querySelectorAll(sel), f); }
  function frases(t) { return String(t || "").split(/(?<=[.!?])\s+/).filter(Boolean); }
  var tmrToast = null;
  function toast(t) { var el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(tmrToast); tmrToast = setTimeout(function () { el.hidden = true; }, 2800); }
  function tela(h) { pararVideo(); app.innerHTML = h; window.scrollTo(0, 0); try { app.focus({ preventScroll: true }); } catch (e) { /* sem foco */ } }
  function hoje() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function dataBR(iso) { var p = String(iso || "").slice(0, 10).split("-"); return p.length === 3 ? p[2] + "/" + p[1] : ""; }
  function dias(isoA, isoB) { return Math.floor((Date.parse(String(isoB).slice(0, 10)) - Date.parse(String(isoA).slice(0, 10))) / 864e5); }
  function maisDias(iso, n) { var d = new Date(String(iso).slice(0, 10) + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function novoId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function chip(attr, v, rot, on) { return '<button type="button" class="chip" ' + attr + '="' + esc(v) + '" aria-pressed="' + !!on + '">' + rot + "</button>"; }
  function params() { var q = (location.hash.split("?")[1] || ""), o = {}; q.split("&").forEach(function (kv) { var p = kv.split("="); if (p[0]) o[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ""); }); return o; }

  /* ── estado do aparelho ── */
  var CHAVE = "qlt:v1", est;
  function carregar() {
    try { est = JSON.parse(localStorage.getItem(CHAVE) || "null"); } catch (e) { est = null; }
    if (!est || typeof est !== "object") est = {};
    est.vistas = est.vistas || {}; est.prog = est.prog || {};
    est.planos = Array.isArray(est.planos) ? est.planos : []; est.jogos = Array.isArray(est.jogos) ? est.jogos : []; est.videos = Array.isArray(est.videos) ? est.videos : [];
    est.trilha = Array.isArray(est.trilha) ? est.trilha : [];
    if (est.treinadas) { Object.keys(est.treinadas).forEach(function (c) { prog(c).quadra = est.treinadas[c]; }); delete est.treinadas; } // versão anterior do protótipo
  }
  function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(est)); } catch (e) { /* sem armazenamento: segue na memória */ } }
  function prog(cod) { return est.prog[cod] || (est.prog[cod] = { quiz: [] }); }
  carregar();

  /* ── conteúdo ── */
  var FICHAS = S.FICHAS.map(function (f) { return { cod: f[0], nome: f[1], faixa: f[2], prio: f[3], ler: f[4], decidir: f[5], exercicio: f[6], variar: f[7], medir: f[8], m: f[0].charAt(0) }; });
  var POR_COD = {}; FICHAS.forEach(function (f) { POR_COD[f.cod] = f; });
  var MOMENTOS = S.MOMENTOS, NOME_MOMENTO = {}; MOMENTOS.forEach(function (m) { NOME_MOMENTO[m.l] = m.n; });
  var NIVEIS = S.NIVEIS, PRIO = { P1: "Base", P2: "Desenvolvimento", P3: "Avançado" };
  var CTX = {}; S.CONTEXTOS.forEach(function (c) { CTX[c[0]] = { cod: c[0], nome: c[1], dica: c[2], grupo: c[3] }; });
  var CTX_ADV = ["X09", "X10", "X11", "X12", "X13", "X14", "X15", "X16", "X17", "X18", "X19", "X20", "X21", "X22", "X23", "X24"];
  var CTX_COND = ["X25", "X26", "X27", "X28", "X29", "X30", "X31", "X32"];
  var CTX_PLACAR = ["X02", "X05", "X06"];
  /* que momentos do jogo treinar contra cada tipo de adversário (proposta do protótipo; o Richard ajusta) */
  var MOMENTO_DO_ADV = { X09: ["C", "T"], X10: ["D", "C"], X11: ["T", "N"], X12: ["C", "D"], X13: ["R", "D"], X14: ["R"], X15: ["R", "D"], X16: ["C"],
    X17: ["S", "R"], X18: ["C"], X19: ["C", "T"], X20: ["F"], X21: ["F", "S"], X22: ["C"], X23: ["C", "T"], X24: ["F"] };
  /* diagnóstico na língua do jogador → situações do manual, na ordem de aprender (proposta do protótipo; o Richard ajusta) */
  var PROBLEMAS = [
    { id: "atacar", t: "Não sei quando atacar e quando esperar", f: ["F05", "F10", "T01", "T06"] },
    { id: "erro", t: "Erro demais tentando ganhar o ponto", f: ["F11", "F05", "F07", "C02"] },
    { id: "passando", t: "Fico só passando a bola e o outro manda no ponto", f: ["C01", "F08", "C02", "C05"] },
    { id: "saque", t: "Meu saque não me ajuda no ponto", f: ["S01", "S05", "S07", "S10"] },
    { id: "devolucao", t: "Sofro na devolução", f: ["R01", "R07", "R11", "R03"] },
    { id: "pressao", t: "Quando o outro me pressiona, não sei sair", f: ["F03", "D01", "D02", "C12"] },
    { id: "rede", t: "Subo à rede e não sei o que fazer lá", f: ["T06", "N01", "N12", "N07"] },
    { id: "placar", t: "Travo no placar apertado", f: ["F12", "S05", "R07", "F11"] },
    { id: "duplas", t: "Jogo duplas e não sei me posicionar", f: ["U01", "U02", "U08", "U09"] },
  ];
  var POR_PROBLEMA = {}; PROBLEMAS.forEach(function (p) { POR_PROBLEMA[p.id] = p; });

  function nivelNum(n) { return +String(n || "N2").slice(1); }
  function servePara(f, nivel) { var m = String(f.faixa).match(/N(\d)(?:\s*a\s*N(\d))?/); if (!m) return true; var a = +m[1], b = m[2] != null ? +m[2] : a, n = nivelNum(nivel); return n >= a && n <= b; }
  function meuNivel() { return est.nivel || "N2"; }
  function nomeNivel(n) { var x = NIVEIS.filter(function (v) { return v[0] === n; })[0]; return x ? x[2] : n; }
  function faixaTxt(f) { return f.faixa.replace(/N(\d)/g, function (m, d) { return nomeNivel("N" + d); }); }

  /* ══ Aprendizagem de uma situação: seis passos ══ */
  var PASSOS = [
    { k: "leu", t: "Entender", s: "O que ler e como decidir" },
    { k: "decide", t: "Decidir no app", s: "Pausa e decide: leitura e decisão" },
    { k: "sim", t: "Simulador", s: "Escolher a jogada e ver a resposta" },
    { k: "quadra", t: "Treinar em quadra", s: "O exercício, com um parceiro" },
    { k: "jogo", t: "Usar no jogo", s: "Plano antes, registro depois" },
    { k: "retida", t: "Revisar em outro dia", s: "Sem olhar a ficha, pelo menos 2 dias depois" },
  ];
  function passoFeito(cod, k) {
    var p = est.prog[cod]; if (!p) return false;
    if (k === "decide") return p.quiz.some(function (q) { return q.ok; });
    if (k === "jogo") return est.jogos.some(function (j) { return j.cod === cod && j.apareceu === "sim"; });
    return !!p[k];
  }
  function feitos(cod) { return PASSOS.filter(function (x) { return passoFeito(cod, x.k); }).length; }
  function estado(cod) {
    if (passoFeito(cod, "retida")) return ["Aprendida", "ok"];
    if (passoFeito(cod, "jogo")) return ["Usada no jogo", "ok"];
    if (passoFeito(cod, "quadra")) return ["Treinada", "azul"];
    if (passoFeito(cod, "decide")) return ["Decide no app", "azul"];
    if (passoFeito(cod, "leu")) return ["Entendida", "azul"];
    return ["Nova", ""];
  }
  function proximoPasso(cod) { return PASSOS.filter(function (x) { return !passoFeito(cod, x.k); })[0] || null; }
  function linkPasso(cod, k) { return k === "decide" ? "#/quiz/" + cod : k === "sim" ? "#/simulador" : k === "jogo" ? "#/jogo?cod=" + cod : k === "retida" ? "#/quiz/" + cod + "?revisao=1" : "#/situacao/" + cod; }
  function situacaoAtual() { return est.trilha.filter(function (c) { return !(passoFeito(c, "quadra") && passoFeito(c, "jogo")); })[0] || null; }
  function ultimoAcerto(cod) { var q = (est.prog[cod] || { quiz: [] }).quiz.filter(function (x) { return x.ok; }); return q.length ? q[q.length - 1].em : null; }
  function revisoesDeHoje() {
    return Object.keys(est.prog).filter(function (c) { var u = ultimoAcerto(c); return u && !passoFeito(c, "retida") && dias(u, hoje()) >= 2; });
  }

  /* ══ rotas ══ */
  function marcarAba(aba) { Array.prototype.forEach.call(document.querySelectorAll("#abas a"), function (a) { if (a.getAttribute("data-aba") === aba) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }); }
  function rota() {
    var p = (location.hash || "#/").replace(/^#\/?/, "").split("?")[0].split("/");
    var r = p[0];
    if (r === "aprender" || r === "manual" && !p[1]) { marcarAba("aprender"); telaAprender(); }
    else if (r === "manual") { marcarAba("aprender"); telaMomento(p[1]); }
    else if (r === "situacao" || r === "ficha") { marcarAba("aprender"); telaSituacao(p[1]); }
    else if (r === "metodo") { marcarAba("aprender"); telaMetodo(); }
    else if (r === "ler") { marcarAba("aprender"); telaLer(p[1]); }
    else if (r === "treinar") { marcarAba("treinar"); telaTreinar(); }
    else if (r === "quiz") { marcarAba("treinar"); telaQuiz(p[1]); }
    else if (r === "videos") { marcarAba("treinar"); telaVideos(); }
    else if (r === "video" && p[1] === "novo") { marcarAba("treinar"); telaVideoNovo(); }
    else if (r === "video") { marcarAba("treinar"); telaVideo(p[1]); }
    else if (r === "simulador") { marcarAba("treinar"); telaSimulador(p[1]); }
    else if (r === "jogo" || r === "plano" && !p[1]) { marcarAba("jogo"); telaJogo(); }
    else if (r === "plano" && p[1] === "novo") { marcarAba("jogo"); telaNovoPlano(); }
    else if (r === "plano") { marcarAba("jogo"); telaPlano(p[1]); }
    else if (r === "registro" && p[1] === "novo") { marcarAba("jogo"); telaRegistroNovo(); }
    else if (r === "registro") { marcarAba("jogo"); reg = null; telaRegistro(p[1]); }
    else if (r === "planos") { marcarAba(""); telaProposta(); }
    else { marcarAba("inicio"); telaInicio(); }
  }
  window.addEventListener("hashchange", function () { if (!/^#\/registro\/novo/.test(location.hash)) reg = null; if (!/^#\/video\//.test(location.hash)) vid = null; rota(); });
  rota();
})();

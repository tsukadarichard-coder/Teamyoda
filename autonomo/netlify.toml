[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Página inicial: QuadraLab Hub. O app e a página comercial do Treinador ficam em /treinador
# (o arquivo continua sendo index.html, que também segue acessível em /index.html).
[[redirects]]
  from = "/"
  to = "/hub/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/treinador"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/treinador/"
  to = "/treinador"
  status = 301
  force = true

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/player/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/painel/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/competicao/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuadraLab System · Análise de Movimento</title>
<link rel="icon" href="../../assets/favicon-32.png">
<link rel="stylesheet" href="../../scout/movimento.css">
<style>
body{margin:0;background:#F6F4EF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14202B}
header,main{max-width:1000px;margin:auto;padding:0 16px}header{padding-top:16px}
.marca{display:flex;align-items:center;gap:10px;margin-bottom:8px}.marca img{height:38px;display:block}.sys{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:#0B3B2E;padding:4px 9px;border-radius:6px}
h1{font-size:20px;margin:0}header p{margin:4px 0 0;color:#5C6B78;font-size:14px}main{padding-bottom:60px}
</style></head><body>
<header><div class="marca"><img src="../../assets/logo-quadralab.png" alt="QuadraLab"><span class="sys">System</span></div>
<h1>Análise de Movimento em Vídeo</h1>
<p>Forehand, backhand e saque. Protótipo de uso particular: a análise roda no seu aparelho e o vídeo não sai do navegador. O histórico fica neste navegador e cada análise é comparada com a anterior.</p></header>
<main><div id="app"></div></main>
<script src="../../scout/movimento-motor.js"></script>
<script src="../../scout/movimento.js"></script>
<script>
(function(){
 var CH="ql-proto-movimentos",hist=[];
 try{hist=JSON.parse(localStorage.getItem(CH)||"[]")}catch(e){}
 function grava(){try{localStorage.setItem(CH,JSON.stringify(hist))}catch(e){}}
 window.__mov=QLMovimento.montar(document.getElementById("app"),{
  logo:"../../assets/logo-quadralab.png",logoAbsoluto:new URL("../../assets/logo-quadralab.png",location.href).href,historico:hist,
  aoSalvar:function(reg){hist=hist.filter(function(h){return h.id!==reg.id}).concat([reg]);grava()},
  aoRemover:function(id){hist=hist.filter(function(h){return h.id!==id});grava()}
 });
})();
</script></body></html>
